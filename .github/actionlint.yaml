# The required gate checks syntax and expressions on all tracked workflows,
# then runs ShellCheck-enabled actionlint on workflows changed by the PR.
# Generated workflows can contain embedded JavaScript/template bodies that
# ShellCheck parses as shell, so untouched workflow copies stay in the first
# pass while edited workflows receive the active shell check.
# GitHub Actions supports `concurrency.queue` (`single` or `max`), but pinned
# actionlint v1.7.12 does not model that schema field yet. Ignore only that
# diagnostic on the three workflows that use the documented queue policy.
paths:
  .github/workflows/translate-queue-recovery-watchdog.yml:
    ignore:
      - 'unexpected key "queue"'
  .github/workflows/translate-queue-recovery.yml:
    ignore:
      - 'unexpected key "queue"'
  .github/workflows/translate-pending.yml:
    ignore:
      - 'unexpected key "queue"'
