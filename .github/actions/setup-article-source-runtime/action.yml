name: Setup isolated article source TypeScript runtime
description: Install only the pinned TypeScript compiler into RUNNER_TEMP and expose its absolute entry path.
runs:
  using: composite
  steps:
    - name: Install isolated TypeScript runtime
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        action_root="$(cd "$ACTION_PATH/../../.." && pwd)"
        source_dir="$action_root/scripts/ci/article-source-runtime"
        runtime_dir="$RUNNER_TEMP/frontaliere-article-source-runtime"
        mkdir -p "$runtime_dir"
        cp "$source_dir/package.json" "$runtime_dir/package.json"
        cp "$source_dir/package-lock.json" "$runtime_dir/package-lock.json"
        (
          cd "$runtime_dir"
          bash "$action_root/scripts/lib/npm-ci-retry.sh" --ignore-scripts --no-audit --no-fund
        )
        compiler_entry="$runtime_dir/node_modules/typescript/lib/typescript.js"
        if [ ! -f "$compiler_entry" ]; then
          echo "::error::Pinned TypeScript compiler entry was not installed at $compiler_entry"
          exit 1
        fi
        printf 'ARTICLE_SOURCE_TYPESCRIPT=%s\n' "$compiler_entry" >> "$GITHUB_ENV"
        ARTICLE_SOURCE_TYPESCRIPT="$compiler_entry" node "$action_root/scripts/ci/check-article-source-runtime.mjs"
