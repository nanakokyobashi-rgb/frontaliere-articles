name: Refresh Canton Hubs

# Rigenera i DATI dei 6 hub evergreen (carburanti, fisco, mobilita', eventi,
# pensioni, servizi) delle sezioni cantonali attive o accese (piano «sezioni
# articoli per cantone», P10, D17). Il producer e'
# generator/scripts/generate-canton-hubs.mjs: scrive
# content/cantons/<sezione>/hubs/<tema>.json, che il publisher delle sezioni
# (P7b) rende e carica su R2.
#
# NESSUNA SEZIONE = SUCCESSO. Finche' nessun cantone e' attivo nel core ne'
# acceso (profilo `enabled` o Remote Config CANTON_ARTICLE_SECTIONS_ENABLED)
# il job esce verde subito dopo aver risolto l'elenco, senza scaricare niente.
#
# I DATASET SONO SOFT, IL PRODUCER NO. Ogni `refresh` qui sotto e' il download
# di produzione della sua cache REWIRE (dichiarato in `productionFetch` di
# generator/tests/lib/rewire-contracts.mjs, che un test confronta con questo
# file). Un refresh che fallisce NON ferma il job: il producer omette il
# blocco di quel dataset — o conserva quello gia' pubblicato se e' ancora
# entro la sua eta' massima — e l'hub resta valido e indicizzabile (nessun
# noindex, decisions.md). Un errore del producer invece ferma tutto prima del
# commit.
#
# Fisco e pensioni: i dataset `canton-tax` e `pension-parameters` hanno refresh
# e contratto nella PR del corpus P9d+e; quando arriva, aggiunge qui i suoi
# due step e i blocchi (gia' scritti, oggi `missing`) si accendono da soli.
on:
  schedule:
    # Ogni giorno alle 08:23 UTC: dopo il build giornaliero dei carburanti del
    # sito (06:37) e il crawl degli eventi (05:40), sfalsato dagli altri cron.
    - cron: '23 8 * * *'
  push:
    paths:
      - '.github/workflows/refresh-canton-hubs.yml'
      - 'generator/scripts/generate-canton-hubs.mjs'
      - 'generator/scripts/lib/canton-hubs/**'
      - 'generator/data/canton-hub-topics.json'
      - 'generator/data/canton-hub-links.json'
  workflow_dispatch:
    inputs:
      sections:
        description: 'Sezioni da rigenerare (canton-ti,canton-gr). Vuoto = tutte quelle attive o accese'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Scarica e costruisce, ma non scrive e non committa'
        required: false
        default: false
        type: boolean

concurrency:
  group: refresh-canton-hubs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve run mode
        id: mode
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            DRY=true
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DRY="${{ inputs.dry_run }}"
          else
            DRY=false
          fi
          echo "dry=$DRY" >> "$GITHUB_OUTPUT"
          echo "event=${{ github.event_name }} → dry_run=$DRY"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # persist-credentials: false e' portante: altrimenti l'extraheader
          # del GITHUB_TOKEN vince sulle credenziali nell'URL di push e il
          # push su main viene rifiutato (vedi refresh-events-digest.yml).
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Remote Config porta sia il PAT del push sia l'elenco dei cantoni accesi
      # (D16). Il loader esce 0 anche quando non carica niente: il controllo di
      # successo e' esplicito qui sotto, perche' un elenco vuoto per un
      # fallimento di auth sarebbe indistinguibile da «nessun cantone acceso».
      - name: Prepare Firebase credentials
        if: steps.mode.outputs.dry != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not set — it is the only source of the push PAT and of the canton gate"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config
        if: steps.mode.outputs.dry != 'true'
        run: node generator/scripts/load-rc-env.mjs

      - name: Remote Config loaded
        if: steps.mode.outputs.dry != 'true'
        run: |
          set -euo pipefail
          # Il token del push: GITHUB_PAT_NANAKO (AGENTS.md: push, merge e
          # dispatch), con GITHUB_PAT come riserva — e' quello con cui pushano
          # su main gli altri produttori del corpus. Mai il GITHUB_TOKEN: non
          # farebbe partire publish-api.yml.
          PUSH_TOKEN="${GITHUB_PAT_NANAKO:-${GITHUB_PAT:-}}"
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::error::Remote Config non caricato (GITHUB_PAT_NANAKO e GITHUB_PAT assenti): senza, l'elenco dei cantoni accesi non e' affidabile e il push non farebbe partire publish-api.yml"
            exit 1
          fi

      # Con zero sezioni il job finisce qui, verde. Il self-test su push non ha
      # secret e di norma nessuna sezione accesa: esercita il producer in
      # dry-run sul Ticino, cosi' una modifica rotta si vede prima del cron.
      - name: Resolve canton sections
        id: sections
        env:
          REQUESTED: ${{ inputs.sections }}
          DRY: ${{ steps.mode.outputs.dry }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED:-}" ]; then
            SECTIONS="$(printf '%s' "$REQUESTED" | tr -d '[:space:]')"
          else
            SECTIONS="$(node generator/scripts/generate-canton-hubs.mjs --list-enabled | paste -sd, -)"
          fi
          if [ -z "$SECTIONS" ] && [ "$EVENT" = "push" ] && [ "$DRY" = "true" ]; then
            SECTIONS="canton-ti"
            echo "self-test: nessuna sezione accesa, dry-run su canton-ti"
          fi
          if [ -z "$SECTIONS" ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "nessuna sezione cantonale attiva o accesa: niente da rigenerare"
            echo "### Canton hubs — nessuna sezione attiva o accesa, niente da fare" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Valida l'elenco (un refuso non deve diventare un run vuoto) e
          # ricava i path dei file dati, che servono ad add e rebase.
          node generator/scripts/generate-canton-hubs.mjs --section "$SECTIONS" --print-paths > "$RUNNER_TEMP/canton-hub-paths.txt"
          COUNT="$(printf '%s' "$SECTIONS" | tr ',' '\n' | grep -c .)"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "list=$SECTIONS" >> "$GITHUB_OUTPUT"
          echo "sezioni: $SECTIONS"

      # ── Dataset di categoria (D11): letti, mai ricrawlati ────────────────
      # Uno step per dataset, ognuno soft: vedi l'intestazione. Anche in
      # dry-run i refresh scrivono le loro cache (senza, il producer non
      # avrebbe niente da costruire): sono file gitignored sul runner, che non
      # entrano in nessun commit — in dry-run lo step di commit non gira.
      - name: Fetch fuel prices per canton
        if: steps.sections.outputs.count != '0'
        run: |
          npm run refresh:fuel-cantons || echo "::warning::fuel-prices-cantons non scaricato: il blocco prezzi carburanti si omette o resta quello pubblicato"

      - name: Fetch the events dataset
        if: steps.sections.outputs.count != '0'
        run: |
          npm run refresh:events || echo "::warning::events.json non scaricato: il blocco prossimi eventi si omette o resta quello pubblicato"

      - name: Fetch the border-wait window
        if: steps.sections.outputs.count != '0'
        run: |
          npm run refresh:border-wait-window || echo "::warning::border-wait-ranking-window non scaricato: il blocco attese ai valichi si omette o resta quello pubblicato"

      - name: Fetch road events
        if: steps.sections.outputs.count != '0'
        run: |
          npm run refresh:road-events || echo "::warning::road-events non scaricato: il blocco chiusure e cantieri si omette o resta quello pubblicato"

      - name: Fetch canton notices
        if: steps.sections.outputs.count != '0'
        run: |
          npm run refresh:canton-notices || echo "::warning::canton-notices non scaricato: il blocco avvisi ufficiali si omette o resta quello pubblicato"

      - name: Build the canton services view
        if: steps.sections.outputs.count != '0'
        run: |
          npm run refresh:canton-services || echo "::warning::canton-services non costruita: i blocchi dell'hub servizi si omettono o restano quelli pubblicati"

      - name: Generate the canton hubs
        id: producer
        if: steps.sections.outputs.count != '0'
        env:
          SECTIONS: ${{ steps.sections.outputs.list }}
          DRY: ${{ steps.mode.outputs.dry }}
        run: |
          set -euo pipefail
          ARGS=(--section "$SECTIONS" --report "$RUNNER_TEMP/canton-hubs-report.json")
          if [ "$DRY" = "true" ]; then ARGS+=(--dry-run); fi
          node generator/scripts/generate-canton-hubs.mjs "${ARGS[@]}"

      # I link a strumenti e pagine di categoria vengono da un catalogo
      # verificato sulle sitemap: qui si ricontrolla contro quelle live. Non
      # blocca (una sitemap momentaneamente irraggiungibile non deve fermare
      # gli hub), ma un link sparito diventa un'annotazione sul run.
      - name: Check hub links against the published sitemaps
        if: steps.sections.outputs.count != '0'
        continue-on-error: true
        env:
          SECTIONS: ${{ steps.sections.outputs.list }}
        run: node generator/scripts/verify-canton-hub-links.mjs --section "$SECTIONS" --warn

      - name: Commit and push
        if: steps.sections.outputs.count != '0' && steps.mode.outputs.dry != 'true'
        run: |
          set -euo pipefail
          # Solo i file dati degli hub di QUESTE sezioni: le cache dei dataset
          # sono gitignored e non si committano.
          mapfile -t HUB_PATHS < "$RUNNER_TEMP/canton-hub-paths.txt"
          for p in "${HUB_PATHS[@]}"; do
            if [ -f "$p" ]; then git add -- "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "nessun hub cambiato"
            exit 0
          fi
          git config user.name "Valerie Linc"
          git config user.email "valerielinc@gmail.com"
          git commit -m "Refresh canton hubs"

          PUSH_TOKEN="${GITHUB_PAT_NANAKO:-${GITHUB_PAT:-}}"
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::error::GITHUB_PAT_NANAKO e GITHUB_PAT assenti — un push col GITHUB_TOKEN non farebbe partire publish-api.yml"
            exit 1
          fi
          TARGET="${{ github.ref_name }}"
          REMOTE="https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3 4 5; do
            if git push "$REMOTE" "HEAD:$TARGET"; then
              echo "pushed to $TARGET"
              exit 0
            fi
            echo "push attempt $attempt failed"
            if [ "$attempt" -eq 5 ]; then
              break
            fi
            sleep $((attempt * 3))
            # `--section-surfaces` dichiara all'helper le superfici di ogni
            # sezione ATTIVA del core, compresi i file dati degli hub
            # (`hubDataFiles` in scripts/lib/article-surfaces.mjs): in un
            # conflitto vale la copia upstream e il giro dopo li rigenera. I
            # path di questo run si passano anche in chiaro, perche' una
            # sezione accesa da Remote Config ma non ancora attiva nel core
            # non e' fra quelle.
            bash scripts/lib/rebase-onto-remote.sh "$REMOTE" "$TARGET" \
              --section-surfaces \
              "${HUB_PATHS[@]}" || true
          done
          echo "::error::push failed after 5 attempts (git output above)"
          exit 1

      - name: Summary
        if: always() && steps.sections.outputs.count != '0'
        run: |
          {
            echo "### Canton hubs"
            echo "- Dry run: ${{ steps.mode.outputs.dry }}"
            echo "- Sezioni: ${{ steps.sections.outputs.list }}"
            if [ -f "$RUNNER_TEMP/canton-hubs-report.json" ]; then
              echo
              echo "| hub | news | blocchi dati | omessi | stato |"
              echo "|---|---|---|---|---|"
              node -e '
                const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
                for (const h of r.hubs) console.log(`| ${h.section}/${h.topic} | ${h.curatedArticles} | ${h.dataBlocks.join(", ") || "—"} | ${h.omittedBlocks.map((b) => `${b.id} (${b.code})`).join(", ") || "—"} | ${h.changed ? (r.dryRun ? "cambierebbe" : "scritto") : "invariato"} |`);
                for (const e of r.errors) console.log(`| ${e.section}/${e.topic} | — | — | — | ERRORE: ${e.message.replace(/\|/g, "/")} |`);
              ' "$RUNNER_TEMP/canton-hubs-report.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
