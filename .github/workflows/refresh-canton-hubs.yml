name: Refresh Canton Hubs

# Rigenera i DATI dei 6 hub evergreen (carburanti, fisco, mobilita', eventi,
# pensioni, servizi) delle sezioni cantonali attive o accese (piano «sezioni
# articoli per cantone», P10, D17). Il producer e'
# generator/scripts/generate-canton-hubs.mjs: scrive
# content/cantons/<sezione>/hubs/<tema>.json, che il publisher delle sezioni
# (P7b) rende e carica su R2.
#
# NESSUNA SEZIONE = SUCCESSO. Finche' nessun cantone e' attivo nel core ne'
# acceso (profilo `enabled` o Remote Config CANTON_ARTICLE_SECTIONS_ENABLED)
# il job esce verde subito dopo aver risolto l'elenco, senza scaricare niente.
#
# I DATASET SONO SOFT, IL PRODUCER NO. Ogni `refresh` qui sotto e' il download
# di produzione della sua cache REWIRE (dichiarato in `productionFetch` di
# generator/tests/lib/rewire-contracts.mjs, che un test confronta con questo
# file). Un refresh che fallisce NON ferma il job: il producer omette il
# blocco di quel dataset — o conserva quello gia' pubblicato se e' ancora
# entro la sua eta' massima — e l'hub resta valido e indicizzabile (nessun
# noindex, decisions.md). Un errore del producer invece ferma tutto prima del
# commit.
on:
  schedule:
    # Ogni giorno alle 08:23 UTC: dopo il build giornaliero dei carburanti del
    # sito (06:37) e il crawl degli eventi (05:40), sfalsato dagli altri cron.
    - cron: '23 8 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-canton-hubs.yml'
      - 'generator/scripts/generate-canton-hubs.mjs'
      - 'generator/scripts/lib/canton-hubs/**'
      - 'scripts/lib/canton-hub-content.mjs'
      - 'generator/data/canton-hub-topics.json'
      - 'generator/data/canton-hub-links.json'
      # Un nuovo articolo aggiorna registro, slug/meta, corpo e sidecar. Il
      # bacino D17 legge anche frontaliere/svizzera con label cantonale, non
      # solo le 24 sezioni proprie.
      # Le modifiche agli articoli attendono il publisher: i link vengono
      # verificati contro sitemap che devono gia' contenere le nuove URL.
      # `workflow_run` avvia il refresh dopo il successo di Publish article data API.
      # Le URL di fonte non pubblicano una pagina e restano un trigger diretto.
      - 'data/article-source-urls.json'
      - 'data/swiss-article-source-urls.json'
      - 'data/sections/canton-*/articles/**'
  workflow_run:
    workflows: ['Publish article data API']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sections:
        description: 'Sezioni da rigenerare (canton-ti,canton-gr). Vuoto = tutte quelle attive o accese'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Scarica e costruisce, ma non scrive e non committa'
        required: false
        default: false
        type: boolean

concurrency:
  group: refresh-canton-hubs
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download publisher Pages artifact
        id: publisher_pages
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: github-pages-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/publish-api-wrapper
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          # persist-credentials: false e' portante: altrimenti l'extraheader
          # del GITHUB_TOKEN vince sulle credenziali nell'URL di push e il
          # push su main viene rifiutato (vedi refresh-events-digest.yml).
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Extract publisher Pages artifact safely
        if: github.event_name == 'workflow_run' && steps.publisher_pages.outcome == 'success'
        env:
          ARTIFACT_ARCHIVE: ${{ runner.temp }}/publish-api-wrapper/artifact.tar
          STAGING_DIR: ${{ runner.temp }}/publish-api-staged
        run: python3 generator/scripts/extract-publisher-pages-artifact.py --archive "$ARTIFACT_ARCHIVE" --destination "$STAGING_DIR"

      - name: Resolve publisher artifact state
        id: publisher
        if: github.event_name == 'workflow_run'
        env:
          DOWNLOAD_OUTCOME: ${{ steps.publisher_pages.outcome }}
          ARTIFACT_DIR: ${{ runner.temp }}/publish-api-staged
        run: |
          set -euo pipefail
          if [ "$DOWNLOAD_OUTCOME" = success ]; then
            test -s "$ARTIFACT_DIR/manifest.json" || { echo '::error::Pages artifact estratto ma manifest.json assente'; exit 1; }
            source_commit="$(jq -er '.commit | select(test("^[a-f0-9]{40}$"))' "$ARTIFACT_DIR/manifest.json")"
            echo "state=available" >> "$GITHUB_OUTPUT"
            echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          else
            # L'assenza e' uno skip solo se main contiene input API piu' nuovi
            # della run; il freshness gate publish-api conserva allora una run
            # FIFO successiva come owner. La classificazione Git e' nel resolver.
            echo 'state=missing' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout publisher artifact source
        if: github.event_name == 'workflow_run' && steps.publisher.outputs.state == 'available'
        env:
          SOURCE_COMMIT: ${{ steps.publisher.outputs.source_commit }}
        run: git checkout --detach "$SOURCE_COMMIT"

      - name: Resolve run mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_TITLE: ${{ github.event.workflow_run.display_title }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PUBLISH_API_ARTIFACT_STATE: ${{ steps.publisher.outputs.state }}
          PUBLISH_API_ARTIFACT_DIR: ${{ runner.temp }}/publish-api-staged
        run: node generator/scripts/resolve-canton-hub-refresh-mode.mjs

      # Un commit trailer e' un riferimento, non una prova. Per i range
      # publisher composti solo da output hub, ricaviamo il run/attempt richiesto
      # dal marker; l'autenticazione avviene solo dopo download e verifica API.
      - name: Resolve hub refresh proof candidate
        id: receipt_candidate
        if: github.event_name == 'workflow_run' && steps.mode.outputs.run == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ steps.mode.outputs.before }}
          PUBLISHER_SOURCE_COMMIT: ${{ steps.mode.outputs.after }}
        run: |
          set -euo pipefail
          if [ -n "$PUSH_BEFORE" ]; then
            git diff --no-renames --name-only "$PUSH_BEFORE" "$PUBLISHER_SOURCE_COMMIT" \
              | node generator/scripts/resolve-canton-hub-refresh-proof.mjs candidate
          else
            node generator/scripts/resolve-canton-hub-refresh-proof.mjs candidate </dev/null
          fi

      # L'artifact e' immutabile e scoped al run ID. Nome e receipt includono
      # anche attempt; il consumer controlla entrambi contro i metadata REST.
      - name: Download exact hub refresh proof artifact
        id: receipt_artifact
        if: steps.receipt_candidate.outputs.candidate == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: ${{ steps.receipt_candidate.outputs.artifact_name }}
          path: ${{ runner.temp }}/canton-hub-refresh-proof
          repository: ${{ github.repository }}
          run-id: ${{ steps.receipt_candidate.outputs.run_id }}
          github-token: ${{ github.token }}

      # Una sola GET, con limite temporale. Missing, expired, timeout, API error
      # o risposta vuota sono proof false: il resolver terra' il refresh globale.
      - name: Read exact hub refresh run attempt metadata
        if: steps.receipt_candidate.outputs.candidate == 'true' && steps.receipt_artifact.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_RUN_ID: ${{ steps.receipt_candidate.outputs.run_id }}
          RECEIPT_RUN_ATTEMPT: ${{ steps.receipt_candidate.outputs.run_attempt }}
          RUN_METADATA_PATH: ${{ runner.temp }}/canton-hub-refresh-proof/github-run.json
        run: |
          set -uo pipefail
          tmp="$RUN_METADATA_PATH.tmp"
          mkdir -p "$(dirname "$RUN_METADATA_PATH")"
          if timeout 20s gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$RECEIPT_RUN_ID/attempts/$RECEIPT_RUN_ATTEMPT" > "$tmp"; then
            mv "$tmp" "$RUN_METADATA_PATH"
            echo 'metadata=available'
          else
            rm -f "$tmp"
            printf '{}\n' > "$RUN_METADATA_PATH"
            echo "::warning::metadata receipt non disponibile o timeout; il resolver fara un refresh completo"
          fi

      - name: Verify hub refresh artifact against run metadata and commit
        id: receipt_verification
        if: steps.receipt_candidate.outputs.candidate == 'true'
        env:
          RECEIPT_PATH: ${{ runner.temp }}/canton-hub-refresh-proof/receipt.json
          RUN_METADATA_PATH: ${{ runner.temp }}/canton-hub-refresh-proof/github-run.json
          RECEIPT_RUN_ID: ${{ steps.receipt_candidate.outputs.run_id }}
          RECEIPT_RUN_ATTEMPT: ${{ steps.receipt_candidate.outputs.run_attempt }}
          PUBLISHER_SOURCE_COMMIT: ${{ steps.mode.outputs.after }}
        run: |
          set -euo pipefail
          if [ -n "${{ steps.mode.outputs.before }}" ]; then
            git diff --no-renames --name-only "${{ steps.mode.outputs.before }}" "${{ steps.mode.outputs.after }}" \
              | node generator/scripts/resolve-canton-hub-refresh-proof.mjs verify
          else
            node generator/scripts/resolve-canton-hub-refresh-proof.mjs verify </dev/null
          fi

      # Remote Config porta sia il PAT del push sia l'elenco dei cantoni accesi
      # (D16). Il loader esce 0 anche quando non carica niente: il controllo di
      # successo e' esplicito qui sotto, perche' un elenco vuoto per un
      # fallimento di auth sarebbe indistinguibile da «nessun cantone acceso».
      - name: Setup isolated article source runtime
        if: steps.mode.outputs.run == 'true'
        uses: ./.github/actions/setup-article-source-runtime

      - name: Prepare Firebase credentials
        if: steps.mode.outputs.run == 'true' && steps.mode.outputs.dry != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not set — it is the only source of the push PAT and of the canton gate"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config
        if: steps.mode.outputs.run == 'true' && steps.mode.outputs.dry != 'true'
        run: node generator/scripts/load-rc-env.mjs

      - name: Remote Config loaded
        if: steps.mode.outputs.run == 'true' && steps.mode.outputs.dry != 'true'
        run: |
          set -euo pipefail
          # Il token del push: GITHUB_PAT_NANAKO (AGENTS.md: push, merge e
          # dispatch). Nessun fallback su GITHUB_PAT: anche una sua eventuale
          # presenza non dimostra l'identita' owner necessaria per la catena.
          PUSH_TOKEN="${GITHUB_PAT_NANAKO:-}"
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::error::Remote Config non caricato (GITHUB_PAT_NANAKO assente): senza, l'elenco dei cantoni accesi non e' affidabile e il push non farebbe partire publish-api.yml"
            exit 1
          fi

      # Con zero sezioni il job finisce qui, verde. Un push di un nuovo articolo
      # segue il percorso reale; il dry-run resta disponibile solo per un
      # workflow_dispatch esplicito.
      - name: Resolve canton sections
        id: sections
        env:
          REQUESTED: ${{ inputs.sections }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ steps.mode.outputs.before }}
          PUSH_AFTER: ${{ steps.mode.outputs.after }}
          SHOULD_RUN: ${{ steps.mode.outputs.run }}
          PUBLISHER_SOURCE_COMMIT: ${{ steps.mode.outputs.after }}
          HUB_RECEIPT_VERIFIED: ${{ steps.receipt_verification.outputs.verified }}
        run: |
          set -euo pipefail
          if [ "$SHOULD_RUN" != "true" ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "il refresh content attende il publisher, o questo run non richiede hub"
            exit 0
          fi
          if [ -n "${REQUESTED:-}" ]; then
            SECTIONS="$(printf '%s' "$REQUESTED" | tr -d '[:space:]')"
          else
            ENABLED="$(node generator/scripts/generate-canton-hubs.mjs --list-enabled)"
            SECTIONS="$(printf '%s\n' "$ENABLED" | paste -sd, -)"
            # Un push diretto cantonale resta limitato al cantone cambiato.
            # Per il publisher, il resolver allarga al set attivo salvo un
            # receipt completo che provi che il range hub-only e' gia' coperto.
            case "$EVENT_NAME" in
              push|workflow_run)
                if [ -n "$PUSH_BEFORE" ]; then
                  CHANGED="$(git diff --no-renames --name-only "$PUSH_BEFORE" HEAD)"
                  SECTIONS="$(printf '%s\n' "$CHANGED" | ENABLED_SECTIONS="$ENABLED" node generator/scripts/resolve-canton-hub-target-sections.mjs)"
                fi
                ;;
            esac
          fi
          if [ -z "$SECTIONS" ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "nessuna sezione da rigenerare: nessuna attiva o scope hub gia' coperto"
            echo "### Canton hubs — nessuna sezione da rigenerare" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Valida l'elenco (un refuso non deve diventare un run vuoto) e
          # ricava i path dei file dati, che servono ad add e rebase.
          node generator/scripts/generate-canton-hubs.mjs --section "$SECTIONS" --print-paths > "$RUNNER_TEMP/canton-hub-paths.txt"
          COUNT="$(printf '%s' "$SECTIONS" | tr ',' '\n' | grep -c .)"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "list=$SECTIONS" >> "$GITHUB_OUTPUT"
          echo "sezioni: $SECTIONS"

      # Il publisher puo' risultare verde anche con deploy saltato o upload
      # sitemap degradato. Il suo Pages artifact contiene la sitemap canonica
      # (e il registro live/draft) generata dal publisher; senza artifact non
      # procediamo. Per le sezioni live aspettiamo la stessa sitemap pubblica.
      - name: Wait for the published sitemap links
        id: sitemap
        if: steps.sections.outputs.count != '0' && steps.mode.outputs.event == 'workflow_run'
        env:
          SECTIONS: ${{ steps.sections.outputs.list }}
          PUBLISH_API_ARTIFACT_DIR: ${{ runner.temp }}/publish-api-staged
        run: node generator/scripts/wait-canton-hub-sitemap-ready.mjs --section "$SECTIONS" --timeout-seconds 600 --interval-seconds 20

      # ── Dataset di categoria (D11): letti, mai ricrawlati ────────────────
      # Uno step per dataset, ognuno soft: vedi l'intestazione. Anche in
      # dry-run i refresh scrivono le loro cache (senza, il producer non
      # avrebbe niente da costruire): sono file gitignored sul runner, che non
      # entrano in nessun commit — in dry-run lo step di commit non gira.
      - name: Fetch fuel prices per canton
        if: steps.sections.outputs.count != '0'
        run: |
          npm run refresh:fuel-cantons || echo "::warning::fuel-prices-cantons non scaricato: il blocco prezzi carburanti si omette o resta quello pubblicato"

      - name: Fetch the events dataset
        if: steps.sections.outputs.count != '0'
        run: |
          npm run refresh:events || echo "::warning::events.json non scaricato: il blocco prossimi eventi si omette o resta quello pubblicato"

      - name: Fetch the border-wait window
        if: steps.sections.outputs.count != '0'
        run: |
          npm run refresh:border-wait-window || echo "::warning::border-wait-ranking-window non scaricato: il blocco attese ai valichi si omette o resta quello pubblicato"

      - name: Fetch road events
        if: steps.sections.outputs.count != '0'
        run: |
          npm run refresh:road-events || echo "::warning::road-events non scaricato: il blocco chiusure e cantieri si omette o resta quello pubblicato"

      - name: Fetch canton notices
        if: steps.sections.outputs.count != '0'
        run: |
          npm run refresh:canton-notices || echo "::warning::canton-notices non scaricato: il blocco avvisi ufficiali si omette o resta quello pubblicato"

      - name: Build the canton services view
        if: steps.sections.outputs.count != '0'
        run: |
          npm run refresh:canton-services || echo "::warning::canton-services non costruita: i blocchi dell'hub servizi si omettono o restano quelli pubblicati"

      - name: Fetch canton tax data
        if: steps.sections.outputs.count != '0'
        run: |
          npm run refresh:canton-tax || echo "::warning::canton-tax non scaricato: i blocchi onere fiscale e imposta alla fonte si omettono o restano quelli pubblicati"

      - name: Fetch pension parameters
        if: steps.sections.outputs.count != '0'
        run: |
          npm run refresh:pension-parameters || echo "::warning::pension-parameters non scaricato: i blocchi dell'hub pensioni si omettono o restano quelli pubblicati"

      - name: Generate the canton hubs
        id: producer
        if: steps.sections.outputs.count != '0'
        env:
          SECTIONS: ${{ steps.sections.outputs.list }}
          DRY: ${{ steps.mode.outputs.dry }}
        run: |
          set -euo pipefail
          ARGS=(--section "$SECTIONS" --report "$RUNNER_TEMP/canton-hubs-report.json")
          if [ "$DRY" = "true" ]; then ARGS+=(--dry-run); fi
          node generator/scripts/generate-canton-hubs.mjs "${ARGS[@]}"

      # I link a strumenti e pagine di categoria vengono da un catalogo
      # verificato sulle sitemap: qui si ricontrolla contro quelle live, PRIMA
      # del commit. Un link che non e' piu' in sitemap ferma il job (exit 1):
      # un hub con un link rotto non si pubblica. Solo le sitemap
      # irraggiungibili sono tollerate (`--soft-network`: annotazione ed exit
      # 0), perche' un guasto di rete non dice niente sui link.
      - name: Check hub links against the published sitemaps
        if: steps.sections.outputs.count != '0' && steps.mode.outputs.event != 'workflow_run'
        env:
          SECTIONS: ${{ steps.sections.outputs.list }}
        run: node generator/scripts/verify-canton-hub-links.mjs --section "$SECTIONS" --soft-network

      - name: Check live hub links after article publication
        if: steps.sections.outputs.count != '0' && steps.mode.outputs.event == 'workflow_run' && steps.sitemap.outputs.live-count != '0'
        env:
          SECTIONS: ${{ steps.sitemap.outputs.live-sections }}
        run: node generator/scripts/verify-canton-hub-links.mjs --section "$SECTIONS" --soft-network

      - name: Commit canton hubs
        id: commit
        if: steps.sections.outputs.count != '0' && steps.mode.outputs.dry != 'true'
        env:
          HUB_REFRESH_SOURCE_COMMIT: ${{ steps.mode.outputs.after }}
          HUB_REFRESH_SOURCE_VERIFIED: ${{ steps.mode.outputs.event == 'workflow_run' }}
          HUB_REFRESH_SECTIONS: ${{ steps.sections.outputs.list }}
          EVENT_NAME: ${{ steps.mode.outputs.event }}
        run: |
          set -euo pipefail
          # Solo i file dati degli hub di QUESTE sezioni: le cache dei dataset
          # sono gitignored e non si committano.
          mapfile -t HUB_PATHS < "$RUNNER_TEMP/canton-hub-paths.txt"
          for p in "${HUB_PATHS[@]}"; do
            if [ -f "$p" ]; then git add -- "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "nessun hub cambiato"
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HUB_REFRESH_SOURCE_COMMIT="${HUB_REFRESH_SOURCE_COMMIT:-$(git rev-parse HEAD)}"
          if [[ ! "$HUB_REFRESH_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::publisher source commit non verificabile per il receipt hub"
            exit 1
          fi
          if [[ "${HUB_REFRESH_SOURCE_VERIFIED:-}" != true && "${HUB_REFRESH_SOURCE_VERIFIED:-}" != false ]]; then
            echo "::error::provenienza publisher non valida per il receipt hub"
            exit 1
          fi
          if [[ ! "${HUB_REFRESH_SECTIONS:-}" =~ ^canton-[a-z]+(,canton-[a-z]+)*$ ]]; then
            echo "::error::sezioni processate non valide per il receipt hub"
            exit 1
          fi
          git config user.name "Valerie Linc"
          git config user.email "valerielinc@gmail.com"
          TRAILERS="$(printf 'Canton-Hub-Source-Commit: %s\nCanton-Hub-Source-Verified: %s\nCanton-Hub-Receipt-Run-Id: %s\nCanton-Hub-Receipt-Run-Attempt: %s\nCanton-Hub-Sections: %s' "$HUB_REFRESH_SOURCE_COMMIT" "$HUB_REFRESH_SOURCE_VERIFIED" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$HUB_REFRESH_SECTIONS")"
          git commit -m "Refresh canton hubs" -m "$TRAILERS"
          HUB_REFRESH_COMMIT="$(git rev-parse HEAD)"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "commit=$HUB_REFRESH_COMMIT" >> "$GITHUB_OUTPUT"

          if [[ "$HUB_REFRESH_SOURCE_VERIFIED" == true ]]; then
            HUB_REFRESH_COMMIT="$HUB_REFRESH_COMMIT" \
              RECEIPT_OUTPUT_PATH="$RUNNER_TEMP/canton-hub-refresh-proof/receipt.json" \
              node generator/scripts/write-canton-hub-refresh-receipt.mjs
          fi

      # Il proof deve esistere prima del push che attiva il publisher. Un
      # upload assente/fallito impedisce il push e non lascia un trailer fidato.
      - name: Upload authenticated hub refresh proof
        if: steps.sections.outputs.count != '0' && steps.commit.outputs.changed == 'true' && steps.mode.outputs.event == 'workflow_run'
        uses: actions/upload-artifact@v7
        with:
          name: canton-hub-refresh-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canton-hub-refresh-proof/receipt.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Push canton hubs
        if: steps.sections.outputs.count != '0' && steps.commit.outputs.changed == 'true' && steps.mode.outputs.dry != 'true'
        env:
          HUB_REFRESH_COMMIT: ${{ steps.commit.outputs.commit }}
          HUB_REFRESH_SOURCE_VERIFIED: ${{ steps.mode.outputs.event == 'workflow_run' }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$HUB_REFRESH_COMMIT" ]]; then
            echo "::error::HEAD e receipt artifact non identificano piu' lo stesso commit prima del push"
            exit 1
          fi
          mapfile -t HUB_PATHS < "$RUNNER_TEMP/canton-hub-paths.txt"

          PUSH_TOKEN="${GITHUB_PAT_NANAKO:-}"
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::error::GITHUB_PAT_NANAKO assente — un push col GITHUB_TOKEN non farebbe partire publish-api.yml"
            exit 1
          fi
          TARGET="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}"
          REMOTE="https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          push_target() {
            if [ "$TARGET" = 'main' ]; then
              node scripts/ci/guard-main-tree-shrink.mjs --push-main --remote "$REMOTE" --target main --after HEAD
            else
              git push "$REMOTE" "HEAD:$TARGET"
            fi
          }

          for attempt in 1 2 3 4 5; do
            ATTEMPT_LOG="$RUNNER_TEMP/main-push-$attempt.log"
            if push_target 2>&1 | tee "$ATTEMPT_LOG"; then
              echo "pushed to $TARGET"
              exit 0
            fi
            if grep -q 'MAIN_TREE_GUARD_FATAL:' "$ATTEMPT_LOG"; then
              echo "::error::main-tree guard reported a fatal failure; refusing to retry this push"
              exit 1
            fi
            echo "push attempt $attempt failed"
            if [ "$attempt" -eq 5 ]; then
              break
            fi
            sleep $((attempt * 3))
            # `--section-surfaces` dichiara all'helper le superfici di ogni
            # sezione ATTIVA del core, compresi i file dati degli hub
            # (`hubDataFiles` in scripts/lib/article-surfaces.mjs): in un
            # conflitto vale la copia upstream e il giro dopo li rigenera. I
            # path di questo run si passano anche in chiaro, perche' una
            # sezione accesa da Remote Config ma non ancora attiva nel core
            # non e' fra quelle.
            if ! bash scripts/lib/rebase-onto-remote.sh "$REMOTE" "$TARGET" \
              --section-surfaces \
              "${HUB_PATHS[@]}"; then
              echo "::error::rebase non riuscito; rifiuto il push per preservare la provenienza"
              exit 1
            fi
            if [[ "${HUB_REFRESH_SOURCE_VERIFIED:-false}" == true ]]; then
              node scripts/ci/verify-canton-hub-proof-head.mjs
            fi
          done
          echo "::error::push failed after 5 attempts (git output above)"
          exit 1

      - name: Summary
        if: always() && steps.sections.outputs.count != '0'
        run: |
          {
            echo "### Canton hubs"
            echo "- Dry run: ${{ steps.mode.outputs.dry }}"
            echo "- Sezioni: ${{ steps.sections.outputs.list }}"
            if [ -f "$RUNNER_TEMP/canton-hubs-report.json" ]; then
              echo
              echo "| hub | news | blocchi dati | omessi | stato |"
              echo "|---|---|---|---|---|"
              # JavaScript template expressions are evaluated by Node.
              # shellcheck disable=SC2016
              node -e '
                const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
                for (const h of r.hubs) console.log(`| ${h.section}/${h.topic} | ${h.curatedArticles} | ${h.dataBlocks.join(", ") || "—"} | ${h.omittedBlocks.map((b) => `${b.id} (${b.code})`).join(", ") || "—"} | ${h.changed ? (r.dryRun ? "cambierebbe" : "scritto") : "invariato"} |`);
                for (const e of r.errors) console.log(`| ${e.section}/${e.topic} | — | — | — | ERRORE: ${e.message.replace(/\|/g, "/")} |`);
              ' "$RUNNER_TEMP/canton-hubs-report.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
