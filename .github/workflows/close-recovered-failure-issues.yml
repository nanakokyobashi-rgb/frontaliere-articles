name: Close Recovered Failure Issues

# La metà che chiude di ciò che `workflow-failure-issues.yml` apre: quando un
# workflow torna verde, la sua issue `Workflow Failure: <nome>` si chiude da
# sola. Senza questo, la coda di triage accumulerebbe guasti già rientrati e
# smetterebbe di significare qualcosa.
#
# Portato dal sito (manifest: `adapted` — solo la cadenza cambia). Lo script
# `scripts/ci/close-recovered-failure-issues.mjs` è dichiarato `identical` nel
# manifest — il che vuol dire «deve tornare identico», non «lo è adesso»: il
# manifest tiene tre hash (sito, corpus, baseline) proprio perché i due lati
# possono divergere, e `loop-drift-check.mjs` chiama quello stato `corpus-ahead`.
# Prima di dare per scontata l'identità, misurala:
#
#   shasum -a 256 scripts/ci/close-recovered-failure-issues.mjs | cut -c1-16
#
# e confrontala con `baseline.site` nel manifest del corpus. Lo script riconosce
# i titoli `Workflow|Crawler|CI Failure: <nome>` ed è per costruzione la
# controparte del creator, quindi ogni modifica va comunque spedita da entrambi
# i lati nello stesso giro.
#
# Cadenza: :47 di ogni ora, sfasata dal :17 del sito per non sommare i picchi
# sulla stessa API. Zero Claude.

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Elenca cosa chiuderebbe senza mutare niente'
        required: false
        type: boolean
        default: false

concurrency:
  group: close-recovered-failure-issues
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Close recovered failure issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          node scripts/ci/close-recovered-failure-issues.mjs $ARGS
