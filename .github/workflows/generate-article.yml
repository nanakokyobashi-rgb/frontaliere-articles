name: Generate Blog Article

# The last producer to move (issue #4974 item 3, §4/§5). Scans for a source,
# generates a full multi-language article and registers it into the corpus this
# repository owns.
#
# THE SELF-TRIGGER CHAIN, RESTORED WITHOUT A DISPATCH CREDENTIAL (2026-08-03)
#
# The site repo's copy chains itself: each run dispatches the next via
# workflow_dispatch, alternating frontaliere/svizzera, to work around cron
# unreliability. At cutover that was dropped because dispatching needed a
# credential this repo appeared not to have:
#
#   - secrets.GITHUB_TOKEN cannot, by GitHub's anti-recursion rule — which is
#     precisely why the site repo mints an App token instead.
#   - The site's GitHub App is installed on valerielinc-ops only, and its
#     APP_ID/APP_PRIVATE_KEY are Actions secrets over there, absent from Remote
#     Config; secret values cannot be read back.
#   - Remote Config's GITHUB_PAT answered 403 on
#     POST /actions/workflows/*/dispatches ("Resource not accessible by
#     integration" — it was read as an integration token with no Actions write).
#
# CORRECTION (2026-08-06): the premise was wrong, and the correction matters more
# than the conclusion. Remote Config carries a SECOND credential, GITHUB_PAT_NANAKO,
# a classic PAT for this account with `repo` + `workflow` — already mapped in
# RC_TO_ENV and already loaded by every workflow here. It CAN dispatch: probed with
# POST .../dispatches against a nonexistent ref, it answers 422 "No ref found"
# rather than 403, which proves the authorisation without executing anything.
#
# SECONDA CORREZIONE (2026-08-18), e questa smentisce la riga del 403 qui sopra:
# rimisurata la stessa sonda contro un ref inesistente, ENTRAMBI i token
# rispondono 422 «No ref found for: refs/heads/…». Non solo GITHUB_PAT_NANAKO:
# anche GITHUB_PAT, che questa intestazione dava per incapace. La differenza fra
# 422 e 403 e' esattamente la differenza fra «autorizzato, ma il ref non esiste»
# e «non autorizzato», e un token senza Actions write risponde 403 prima ancora
# di guardare il ref — e' cosi' che il 403 di allora era stato ottenuto. Quindi
# il 403 descriveva uno stato del token che nel frattempo e' cambiato, e la riga
# non va ri-derivata come vera: la si legge come storia, non come vincolo.
#
# LA CATENA ORA E' DOPPIA, e le due meta' chainano su cose diverse:
#   - un run che PRODUCE chaina col push (`content/**` nei paths qui sotto).
#     Resta la meta' storica, e funziona: misurato il 2026-08-18 sulle ultime
#     100 run, 48 su 51 arrivi `push` hanno eseguito la generazione, contro 7
#     su 47 arrivi `schedule` — cioe' il push link passa il gate di ammissione
#     quasi sempre, mentre il cron e' quasi sempre il riavvio ridondante che
#     `admit` esiste per assorbire.
#   - un run che NON produce ma DICHIARA perche' (pool secco, duplicato,
#     rigetto qualita', quota vera: tutti exit 4) chaina con un dispatch, che
#     e' la meta' nuova. Era il buco: un anello del genere non pusha niente
#     sotto `content/**`, quindi non aveva nessun successore e la catena si
#     fermava li' fino al prossimo slot cron.
#
# PERCHE' IL DISPATCH NON VA ANCHE SUL CASO «HA PRODOTTO». Sarebbe il secondo
# successore dello stesso anello: il push ne ha gia' generato uno, i due
# arrivano a pochi secondi l'uno dall'altro, e uno dei due viene scartato da
# `admit` — cioe' si raddoppiano gli arrivi al gate che esiste per ridurli, e si
# tira a sorte quale sopravvive. Il push link e' gia' immediato e gia' misurato
# al 94%: non c'e' niente da aggiungere li'.
#
# The cost of dropping it was measured rather than estimated, and it was far
# larger than the "loses an immediate retry" note this comment used to carry.
# On 2026-08-01, the last full day on the chain, generate-article ran 47 times:
# 14 from cron and 33 from the chain. The chain was 70% of all invocations. On
# cron alone this repo managed 17 runs on 08-02 and 3 in the first eight hours
# of 08-03 — six consecutive :07/:37 slots silently dropped, while the site
# repo's scheduler delivered 16 runs in the same hour. Pure cron does not carry
# this workload.
#
# So the chain is back, built on the one thing the PAT provably CAN do: push.
# A push authenticated with a PAT triggers workflows normally (only
# GITHUB_TOKEN pushes are suppressed by the anti-recursion rule), which is
# already visible in this repo — publish-api.yml fires on every corpus push
# this workflow makes. Adding `content/**` to the push trigger below therefore
# makes each generated article start the next attempt, with no new credential.
#
# WHY IT CANNOT RUN AWAY. The chain link is the ARTICLE, not the run: only a
# push that touches content/** continues it. A run that generates nothing
# pushes only data/topic-candidates-evergreen-rejected.json, which is not in the
# trigger paths, so the chain stops there and waits for cron. That is the one
# deliberate difference from the site repo's version, which dispatched
# unconditionally — an unconditional chain that hits a fast-failing generator
# spins as fast as the runs exit, and this repo has just spent four days proving
# the generator can fail on every attempt. Chaining only on success makes the
# stop condition impossible to get wrong, at the price of needing cron to
# restart it after a dry spell. The two extra cron slots below pay that price.
#
# THAT PRICE TURNED OUT TO BE PAID EVERY SECOND LINK (2026-08-10). The chain
# alternates sections, and a section whose pool is dry ends the chain the first
# time its turn comes up — which for `svizzera` was every attempt that day.
# The fix does NOT touch the stop condition: it lets a single run try the other
# section before giving up, so a link ends only when BOTH sections have nothing.
# See "Generate the article" below for the full argument, including why a
# counter propagated across runs was rejected.
#
# ── L'ANELLO NON E' PIU' SOLO L'ARTICOLO (2026-08-18) ─────────────────────────
#
# Il paragrafo sopra non vale piu' parola per parola, ed e' deliberato. L'anello
# ora e' l'ESITO DICHIARATO: un run che non produce ma esce con una delle sei
# ragioni legittime (EXIT_NO_ARTICLE_DECLARED, cioe' exit 4 su ogni tentativo)
# dispatcha il successore dopo 90s. Il buco che chiude e' misurato: 6,8h di
# tempo davvero morto su 50,2h di finestra (14%), cioe' nessuna run vera attiva,
# quasi tutto in attesa di uno slot cron dopo un anello secco.
#
# LA CONDIZIONE DI STOP E' PIU' LARGA, MA E' ANCORA IMPOSSIBILE DA SBAGLIARE, e
# la ragione e' la stessa di prima letta al contrario: un generatore che
# fallisce presto NON dichiara niente — un kill duro, un kill per stallo, un
# exit 3, un'uscita muta e qualunque guasto infrastrutturale lasciano
# `declared=false`, e la catena si ferma. Cioe' proprio il caso «gira a vuoto
# alla velocita' con cui esce» che aveva fatto scartare il dispatch
# incondizionato del sito e' l'unico caso che NON chaina. Il costo di un anello
# e' quindi sempre una generazione vera arrivata in fondo.
#
# Sopra ci sono quattro tetti, in ordine di autorita':
#   1. l'esito dichiarato (sopra), che e' l'unico strato che non puo' essere
#      aggirato da un contatore sbagliato;
#   2. un tetto orario dentro `admit` (default 20 run/ora, `vars.CHAIN_MAX_RUNS_PER_HOUR`),
#      calcolato dalla stessa chiamata API che il gate fa gia': zero chiamate in
#      piu', e agisce PRIMA che il job `generate` esista;
#   3. `no_article_streak`, cap 6: sei anelli secchi di fila cedono al cron;
#   4. `chain_depth`, cap 40.
# Piu' un kill switch a due strati (vedi lo step «Chain»).
#
# ALSO DROPPED, each for a reason
#   - mint-app-token.mjs: the App has no rights here (above).
#   - npm run test:articles: site tests, some asserting on React rendering (§4).
#   - cleanup-news-sitemap.mjs: operated on public/sitemap-news.xml, which does
#     not exist here. The 48h prune now runs where the file is assembled — in the
#     site's pull-articles-api.mjs (§7.2).
#   - check-seo-pages-syntax.mjs: services/seo/seo-pages.ts is no longer written
#     by the generator at all (#4983/#4997) — the gate guards a file nobody
#     touches (§4: drop, don't port).
#   - trigger-deploy / fast-publish / corpus-mirror dispatches: site-only.
#   - setup-omniroute / setup-claude-haiku-fallback: optional model tiers behind
#     their own kill-switches, never transported.

on:
  schedule:
    # DUE SLOT, non piu' quattro (2026-08-18). Quattro erano la compensazione di
    # una catena che si spezzava a ogni anello secco: il cron doveva riaccenderla
    # da solo, e con GitHub che lascia cadere slot sotto carico (sei mancati di
    # fila il 2026-08-03) due non bastavano. Ora l'anello secco ha un successore
    # (vedi «L'ANELLO NON E' PIU' SOLO L'ARTICOLO»), quindi due slot bastano —
    # e servono ancora: sono l'unica cosa che riaccende dopo un `chain_depth` o
    # un `no_article_streak` esauriti, o dopo un kill switch riarmato. Per
    # questo NON si scende a uno.
    # Misurato il 2026-08-18: 40 dei 47 arrivi `schedule` delle ultime 100 run
    # sono stati saltati da `admit` come riavvii ridondanti — cioe' i due slot
    # tolti erano quasi interamente lavoro buttato.
    # I due rimasti stanno liberi dai minuti degli altri produttori (:15
    # publish-journalist, :30 batch-faq, :50 border-wait).
    - cron: '7 * * * *'   # frontaliere
    - cron: '37 * * * *'  # svizzera
  push:
    # Without this, ANY branch touching content/** starts a generation
    # attempt — not just main. Measured (issue #35, same bug class in
    # fast-publish-article.yml): a manually-pushed backup branch
    # (snapshot/sessione-morta-2026-08-08, explicitly marked "NON VA
    # MERGIATO") reverted the corpus wholesale and still matched
    # `content/**`. The normal chain (this workflow, batch-faq,
    # border-wait, publish-journalist) always pushes to
    # `github.ref_name`, which for scheduled/dispatch runs is main — so
    # this restriction does not affect the real chain link, only stray
    # non-main pushes. Matches publish-api.yml's own `branches: [main]`
    # guard on the same paths.
    branches: [main]
    paths:
      # Self-test on change, always dry. See batch-faq-articles.yml for why this
      # is what makes a new workflow dispatchable at all.
      - '.github/workflows/generate-article.yml'
      - 'generator/scripts/create-article.mjs'
      # THE CHAIN LINK. A corpus push means an article was actually produced, so
      # the next attempt starts immediately instead of waiting for a cron slot
      # that may never arrive. Runs that produce nothing touch only
      # data/topic-candidates-evergreen-rejected.json and so do not chain — see
      # the header. Other producers (batch-faq, border-wait, publish-journalist)
      # also write content/**, and their pushes starting a generation attempt is
      # intended, not a side effect: it is one more restart point.
      - 'content/**'
  workflow_dispatch:
    inputs:
      url:
        description: 'Optional: specific source URL (empty = auto-scan)'
        required: false
        type: string
      section:
        description: 'frontaliere (default) or svizzera'
        required: false
        default: 'frontaliere'
        type: string
      dry_run:
        description: 'Load the generator and stop before generating'
        required: false
        default: false
        type: boolean
      # ── I TRE INPUT DELLA CATENA ────────────────────────────────────────────
      # Nessuno di questi va messo a mano: li scrive lo step «Chain» dell'anello
      # precedente. Un dispatch umano li lascia ai default, ed e' proprio questo
      # a distinguerlo da un anello.
      chain_depth:
        # DOPPIO LAVORO, e va saputo: e' il contatore di profondita' ED e' il
        # MARCATORE. `admit` esenta ogni dispatch umano dal gate (una richiesta
        # esplicita non e' il riavvio ridondante di niente), ma NON puo' esentare
        # un anello: l'anello parte da dentro il job che lo genera, quindi
        # troverebbe sempre il padre in volo. `chain_depth > 0` e' la sola cosa
        # che permette al gate di trattare i due casi in modo diverso.
        description: 'Chain link depth (0 = human dispatch, never set by hand)'
        required: false
        default: '0'
        type: string
      no_article_streak:
        description: 'Consecutive links that declared an outcome without writing an article'
        required: false
        default: '0'
        type: string
      parent_run_id:
        # Senza questo, l'anello si auto-esclude dal gate «c'e' gia' una
        # generazione in volo?»: il padre e' per forza piu' vecchio e per forza
        # ancora `in_progress` quando il figlio chiede, quindi il figlio si
        # fermerebbe SEMPRE. Non e' un dato ridondante col contatore: dice QUALE
        # run va tolta dal confronto, e nessuna euristica sull'eta' lo sostituisce
        # senza sbagliare il caso in cui due anelli esistono davvero.
        description: 'Run id of the link that dispatched this one (never set by hand)'
        required: false
        default: ''
        type: string

# ── LA CONCURRENCY STA SUL JOB, E L'AMMISSIONE STA PRIMA (issue #193, #212) ──
#
# La riga che stava qui (`concurrency: group: generate-article` a livello di
# workflow) è scesa sul job `generate`, e davanti le è stato messo il job
# `admit`. Le due mosse rispondono a due domande diverse e vanno lette insieme.
#
# ## Cosa faceva davvero il gruppo a livello di workflow
#
# GitHub non ha una coda: un gruppo di concurrency ammette UNA run in esecuzione
# e UNA sola in attesa, e ogni nuovo arrivo CANCELLA quella in attesa. Sotto
# sovra-sottoscrizione non è una coda, è una politica di SCARTO. Misurato il
# 2026-08-13 sulle ultime 60 run: 16 `cancelled`, e le tre campionate
# (31680385924, 31676245073, 31675419426) tornano `jobs.total_count == 0` —
# sfrattate senza aver eseguito un solo step. La #193 lo aveva misurato a
# 48/142 il 10-08; la #180 non lo ha toccato.
#
# ## Perché lo sfratto NON stava proteggendo le scritture
#
# È l'argomento che decide il design, ed è verificabile in tre punti:
#
#  1. `cancel-in-progress: false` non ha mai cancellato una run IN CORSO. Le run
#     sfrattate hanno `total_count == 0`: zero step eseguiti, quindi zero righe
#     scritte. Il rischio dichiarato («un run ucciso a metà lascia il corpus
#     scritto a metà») non è ciò che lo sfratto produce.
#  2. Il gruppo non serializzava comunque le scritture su main, perché non è
#     l'unico scrittore: `batch-faq-articles.yml`, `publish-journalist-articles.yml`,
#     `generate-border-wait-ranking-weekly.yml`, `fast-publish-article.yml`,
#     `generate-daily-brief.yml` e `refresh-events-digest.yml` scrivono tutti
#     `content/**` su main sotto un gruppo PROPRIO. La sovrapposizione fra
#     produttori è quotidiana e non è mai passata di qui.
#  3. La mutua esclusione vera vive già dove deve vivere: sull'aggiornamento del
#     ref. Lo step «Commit and push» ritenta cinque volte con rebase e un
#     resolver in-place sui file di bookkeeping (vedi `scripts/lib/git-push-with-retry.sh`,
#     «Survives concurrent pushes from other workflows that also write to main»).
#     È l'unico strato che possa funzionare, appunto perché è l'unico che vede
#     anche gli altri sei produttori.
#
# Quindi il vincolo «le scritture su main non si sovrappongono» resta soddisfatto
# dal push, non dallo sfratto — che in cambio buttava via un arrivo su quattro.
#
# ## Cosa è stato scelto, e perché non è «togliere cancel-in-progress»
#
# `cancel-in-progress` era GIÀ `false`: non c'era nessun flag da togliere. Il
# difetto è la sovra-sottoscrizione, e si chiude all'INGRESSO, non nella coda:
#
#  · `admit` (nessun gruppo, quindi mai in coda e mai sfrattato) risponde a
#    «serve un'altra generazione ADESSO?». Se una run di questo workflow è già
#    in volo la risposta è no — per costruzione, non per euristica: il cron è
#    solo lo STARTER della catena (vedi l'intestazione), e gli altri produttori
#    che spingono `content/**` sono «one more restart point». Un riavvio mentre
#    la catena cammina è ridondante: la run in volo, se produce, chaina da sé.
#    Misurato oggi: 14 delle 16 run sfrattate erano arrivi `schedule`, cioè
#    proprio i riavvii ridondanti, contro 2 su 36 per gli arrivi `push`.
#  · il gruppo `generate-article`, ora sul job, resta come RETE: se due arrivi
#    passano insieme il gate (finestra di corsa fra i due controlli), la
#    serializzazione è ancora lì. Non è ridondante col push-retry, è lo strato
#    che evita di pagare due generazioni per un articolo solo.
#
# Effetto sulla metrica: ogni run esegue ora almeno il job `admit`, quindi una
# run con `total_count == 0` non è più producibile; e l'arrivo ridondante esce
# `skipped`, non `cancelled`, cioè smette di far sparire il lavoro di un altro.
# Quando la catena è ferma — pool secco, run fallita, niente in volo — il gate
# lascia passare tutto come prima, che è esattamente il caso in cui il cron
# serve.
#
# Il costo, dichiarato: se la run in volo non produce nulla, l'arrivo scartato
# non c'è più e la catena riparte al prossimo slot cron (≤15 min). È il prezzo
# già scelto e già scritto in questa intestazione («needing cron to restart it
# after a dry spell»), non uno nuovo.

permissions:
  contents: read

jobs:
  # ── Controllo di AMMISSIONE ────────────────────────────────────────────────
  # Volutamente senza `concurrency`: un gate che può finire in coda è il difetto
  # che deve chiudere. Costa una run di ubuntu senza checkout né npm.
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # elencare le run di questo workflow
      contents: read # il compare per distinguere il self-test dal chain link
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Skip when a generation is already in flight
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SELF_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          # La catena. Tutto via `env:` come il resto: dentro un `run:` non
          # entra nessun `${{ }}`.
          CHAIN_DEPTH: ${{ inputs.chain_depth }}
          PARENT_RUN_ID: ${{ inputs.parent_run_id }}
          CHAIN_MAX_RUNS_PER_HOUR: ${{ vars.CHAIN_MAX_RUNS_PER_HOUR }}
        run: |
          set -uo pipefail

          # ── UN DISPATCH ORA PUO' ESSERE DUE COSE DIVERSE (2026-08-18) ───────
          #
          # Prima di questa riga il gate esentava OGNI `workflow_dispatch`, e
          # aveva ragione: era sempre una richiesta esplicita di un umano,
          # spesso con un `url` preciso, cioè il contrario di un riavvio
          # ridondante. Da quando la catena dispatcha il proprio successore
          # quella premessa non copre più il caso nuovo, e va tenuta l'esenzione
          # SOLO per gli umani.
          #
          # Le due forme sbagliate, entrambe rotte, per capire perché serve un
          # marcatore e non un'euristica:
          #   - anello NON esente → non partirebbe mai. Il dispatch nasce dentro
          #     il job del padre, quindi al momento della domanda il padre è per
          #     forza `in_progress` e per forza più vecchio: il gate vedrebbe
          #     sempre «una generazione è già in volo» e salterebbe ogni anello.
          #   - anello esente come un umano → entrerebbe nel gruppo di
          #     concurrency mentre un'altra run cammina, e lì GitHub tiene UNA
          #     sola pending e cancella la precedente a ogni arrivo: è la
          #     politica di scarto che le #193/#212 hanno appena chiuso.
          # Quindi: `chain_depth > 0` ⇒ anello, e per l'anello valgono il tetto
          # orario e il confronto con le run in volo, con il solo padre escluso.
          chain_depth=0
          case "${CHAIN_DEPTH:-0}" in
            ''|*[!0-9]*) chain_depth=0 ;;
            *) chain_depth="${CHAIN_DEPTH:-0}" ;;
          esac
          is_link=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$chain_depth" -gt 0 ]; then
            is_link=true
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$is_link" != "true" ]; then
            echo "Dispatch manuale (chain_depth=$chain_depth) → si procede sempre."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Un push che non tocca `content/**` è il SELF-TEST dry del workflow
          # (vedi i `paths` sopra: le altre due voci sono questo file e
          # create-article.mjs). Non scrive niente, quindi non ha niente da
          # serializzare — e soprattutto non va saltato: è l'unica prova che il
          # workflow appena modificato parta ancora, e con il gate cieco
          # verrebbe saltata quasi sempre, perché una generazione è in volo
          # quasi sempre.
          #
          # NB: NON è una seconda definizione del chain link. Quella resta una
          # sola, nello step "Resolve run mode and section", che decide col
          # `git diff` sul checkout. Qui la domanda è più stretta — «questo
          # arrivo può scrivere?» — e nel dubbio (compare vuoto, `before`
          # azzerato, errore API) si risponde di sì e si prosegue col
          # ragionamento sotto, cioè si degrada al comportamento normale.
          if [ "$EVENT_NAME" = "push" ] && [ -n "${PUSH_BEFORE:-}" ]; then
            changed=$(gh api "repos/$REPO/compare/$PUSH_BEFORE...$PUSH_SHA" \
              --jq '.files[].filename' 2>/dev/null || true)
            if [ -n "${changed:-}" ] && ! printf '%s\n' "$changed" | grep -q '^content/'; then
              echo "Push senza content/** → self-test dry, nessuna scrittura: si procede."
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Una sola chiamata: le run non terminate sono per forza fra le più
          # recenti, quindi si filtra client-side invece di fare una chiamata
          # per stato. La stessa risposta serve al tetto orario qui sotto —
          # ecco perché non si filtra per stato lato server.
          runs=$(gh api \
            "repos/$REPO/actions/workflows/generate-article.yml/runs?per_page=100" \
            --jq '[.workflow_runs[] | {id: .id, created_at: .created_at, status: .status}]' \
            2>/dev/null || true)
          if [ -z "${runs:-}" ]; then
            echo "Impossibile leggere le run → si prosegue (fail-open)."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          inflight=$(printf '%s' "$runs" \
            | jq -c '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting")]' \
            2>/dev/null || true)
          if [ -z "${inflight:-}" ]; then
            echo "Impossibile filtrare le run in volo → si prosegue (fail-open)."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── IL TETTO ORARIO, l'unica guardia che un contatore non aggira ────
          #
          # `chain_depth` e `no_article_streak` viaggiano NEGLI INPUT: un anello
          # che li dimentica, o un dispatch fatto a mano con i default, riparte
          # da zero e i due cap non vedono niente. Questo tetto invece si calcola
          # dallo stato vero — le run create nell'ultima ora, che sono già nella
          # risposta qui sopra — quindi costa zero chiamate in più e nessuno può
          # ripulirlo passando un input sbagliato. Vale solo per gli anelli: un
          # umano e il cron restano fuori (il cron ha due slot, un umano si
          # ferma da solo).
          if [ "$is_link" = "true" ]; then
            cap="${CHAIN_MAX_RUNS_PER_HOUR:-}"
            case "$cap" in
              ''|*[!0-9]*) cap=20 ;;
            esac
            last_hour=$(printf '%s' "$runs" \
              | jq -r '[.[] | select((.created_at | fromdateiso8601) > (now - 3600))] | length' \
              2>/dev/null || true)
            case "${last_hour:-}" in
              ''|*[!0-9]*) last_hour=0 ;;
            esac
            if [ "$last_hour" -ge "$cap" ]; then
              echo "::warning::tetto orario della catena raggiunto: $last_hour run create nell'ultima ora (cap $cap) → anello non ammesso"
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Tetto orario: $last_hour run nell'ultima ora su un cap di $cap."
          fi

          self_created=$(printf '%s' "$inflight" \
            | jq -r --argjson me "$SELF_ID" '.[] | select(.id == $me) | .created_at' 2>/dev/null | head -1)
          if [ -z "${self_created:-}" ]; then
            self_created=$(gh api "repos/$REPO/actions/runs/$SELF_ID" --jq '.created_at' 2>/dev/null || true)
          fi
          if [ -z "${self_created:-}" ]; then
            echo "Impossibile leggere il createdAt di questa run → si prosegue (fail-open)."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Si cede solo a chi è PIÙ VECCHIO. Il confronto asimmetrico è ciò che
          # rende impossibile il caso in cui due arrivi simultanei si vedono a
          # vicenda e si fermano entrambi: fra due run che si osservano, esattamente
          # una si vede davanti. Il tie-break sull'id copre lo stesso secondo.
          #
          # IL PADRE VA ESCLUSO, e solo lui. Un anello nasce da dentro il job che
          # lo dispatcha: quel run è più vecchio e ancora in volo per
          # costruzione, quindi senza questa esclusione il confronto
          # asimmetrico direbbe «cedi» a ogni anello, sempre. Escluderlo NON
          # apre il buco della sovrapposizione: qualunque ALTRA run in volo fa
          # ancora saltare l'anello, ed è la risposta voluta — `create-article.mjs`
          # scrive registri su ~10 file e l'unica mutua esclusione reale è il
          # rebase-resolver del push; il repo ha già pagato tre volte
          # (#255, #281, #285) un conflitto su quei path, ogni volta con un
          # articolo perso, non ritardato. Meglio saltare un anello che
          # sovrapporre due generazioni.
          parent_id="${PARENT_RUN_ID:-}"
          case "$parent_id" in
            ''|*[!0-9]*) parent_id=0 ;;
          esac
          older=$(printf '%s' "$inflight" \
            | jq -r --argjson me "$SELF_ID" --arg mine "$self_created" --argjson dad "$parent_id" \
                '[ .[] | select(.id != $me) | select($dad == 0 or .id != $dad)
                       | select(.created_at < $mine or (.created_at == $mine and .id < $me)) ] | length' \
              2>/dev/null || true)
          case "${older:-}" in
            ''|*[!0-9]*) older=0 ;;
          esac

          if [ "$older" -gt 0 ]; then
            echo "Ci sono $older run di generate-article già in volo e più vecchie di questa ($self_created)."
            echo "La catena sta già camminando: questo arrivo ($EVENT_NAME) è un riavvio ridondante → skip."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Nessuna generazione più vecchia in volo → si procede."
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  generate:
    needs: admit
    if: needs.admit.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Never cancel: create-article.mjs registers across ~10 files and a cancelled
    # run can leave the corpus half-written. Resta come RETE dietro `admit` —
    # vedi l'intestazione sopra per perché non è più il primo strato.
    concurrency:
      group: generate-article
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # persist-credentials: false is load-bearing, not hygiene.
          # actions/checkout otherwise stores the GITHUB_TOKEN as
          # `http.https://github.com/.extraheader`, and that header takes
          # PRECEDENCE over credentials embedded in a push URL. So the push
          # below authenticated as GITHUB_TOKEN — which this job grants only
          # `contents: read` — instead of as GITHUB_PAT, and was rejected five
          # times over. The article had already been generated and committed
          # locally by then, so it was simply lost.
          persist-credentials: false

      # AFTER checkout, unlike before: telling a chain push from a self-test
      # push means looking at which files the push actually touched, and that
      # needs the repo on disk. `github.event.before` plus fetch-depth: 0 above
      # is what makes the diff resolvable.
      - name: Resolve run mode and section
        id: mode
        run: |
          set -euo pipefail
          EV="${{ github.event_name }}"

          # A push is DRY unless it carried a corpus change — that is the chain
          # link. Editing this workflow or create-article.mjs must still only
          # ever self-test, never generate for real.
          CHAIN=false
          if [ "$EV" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            # All-zero on a branch's first push, and a force-push can leave a
            # `before` that is no longer reachable; both fall back to the single
            # commit, which is the conservative read.
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
            else
              CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" 2>/dev/null || true)
            fi
            if printf '%s\n' "$CHANGED" | grep -q '^content/'; then CHAIN=true; fi
          fi

          if [ "$EV" = "push" ] && [ "$CHAIN" != "true" ]; then
            DRY=true
          elif [ "$EV" = "workflow_dispatch" ]; then
            DRY="${{ inputs.dry_run }}"
          else
            DRY=false
          fi

          # Section. github.event.schedule carries the cron expression that
          # fired, which is the only way a scheduled run can tell which of its
          # schedules it is — there is no per-schedule input.
          if [ "$EV" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              '22 * * * *'|'37 * * * *') SEC=svizzera ;;
              *)                         SEC=frontaliere ;;
            esac
          elif [ "$CHAIN" = "true" ]; then
            # ALTERNATE, the way the site repo's chain did. The previous link's
            # own commit subject records which section it wrote, so flipping it
            # keeps the two sections growing at the same rate however long the
            # chain runs. Anything unrecognised (another producer's push, e.g.
            # the border-wait digest) starts a frontaliere run.
            case "$(git log -1 --format=%s)" in
              *'(svizzera)'*) SEC=frontaliere ;;
              *'(frontaliere)'*) SEC=svizzera ;;
              *) SEC=frontaliere ;;
            esac
          else
            SEC="${{ inputs.section }}"
          fi
          [ "$SEC" = "svizzera" ] || SEC=frontaliere

          echo "dry=$DRY" >> "$GITHUB_OUTPUT"
          echo "section=$SEC" >> "$GITHUB_OUTPUT"
          echo "chain=$CHAIN" >> "$GITHUB_OUTPUT"
          echo "event=$EV chain=$CHAIN → section=$SEC dry_run=$DRY"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: bash scripts/lib/npm-ci-retry.sh

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not set — Remote Config is the only source of the provider keys and the push PAT"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config
        run: node generator/scripts/load-rc-env.mjs

      - name: Verify a model provider is actually available
        run: |
          set -euo pipefail
          if [ -z "${GH_MODELS_PAT:-}" ]; then
            echo "::error::GH_MODELS_PAT missing after the Remote Config load — refusing to start a run that would fail on every model"
            exit 1
          fi
          echo "model provider credentials present"

      # ── L'UNICO MODELLO CON UN CONTESTO CAPACE (issue #313 / #348) ─────────
      #
      # Va DOPO «Load secrets from Remote Config», e non prima: l'action legge
      # env.ENABLE_HAIKU_ARTICLE_FALLBACK, che esiste solo dopo quel caricamento
      # (il ponte RC→env e' load-rc-env.mjs, e un parametro fuori dalla sua mappa
      # RC_TO_ENV resta undefined per quanto sia impostato in Remote Config).
      #
      # MISURATO, run 31817957722: 38 rifiuti su input cap per un prompt stimato
      # ~9740 token contro un cap massimo di 8000, e l'unico membro del roster
      # che quel prompt lo regge — claude-cli/haiku — saltato con «no API key
      # for provider claude_cli». Il gate in ai-models.mjs vuole DUE cose
      # (isClaudeCliFallbackEnabled + hasClaudeCodeOauthToken): il flag lo
      # accende questa action, il token lo passa lo step di generazione qui
      # sotto via `env:`. Passarlo solo qui non basterebbe — la variabile deve
      # esistere nel processo che chiama callLLM.
      #
      # Il secret esiste gia' in questo repo (CLAUDE_CODE_OAUTH_TOKEN, lo stesso
      # del piano Max usato da pr-review-loop.yml/issue-fix.yml): non c'e' nulla
      # da provisionare, mancava solo il cablaggio.
      # continue-on-error: true — issue #367. Gli step delle composite action
      # non supportano continue-on-error (nulla lo assorbe dentro
      # setup-claude-haiku-fallback/action.yml), quindi va sullo STEP
      # CHIAMANTE qui. Il fallback Haiku e' opzionale per costruzione (vedi il
      # commento sopra): un fallimento di rete su `npm install -g
      # @anthropic-ai/claude-code` non deve abbattere l'intero job — deve solo
      # lasciare il flag ENABLE_HAIKU_ARTICLE_FALLBACK non alzato, che e' lo
      # stato "claude-cli/haiku non disponibile" gia' gestito a valle da
      # ai-models.mjs. "Generate the article" sotto dipende solo da
      # steps.mode.outputs.dry, non dall'esito di questo step.
      - name: Setup Claude CLI Haiku fallback
        if: steps.mode.outputs.dry != 'true'
        continue-on-error: true
        uses: ./.github/actions/setup-claude-haiku-fallback

      # Dry mode stops here: create-article.mjs has no --dry-run, and its first
      # side effect is a network call to a model provider. Proving it LOADS is as
      # far as a self-test may safely go — which is exactly the failure the
      # transport closure work was about (six missing imports made this file
      # throw before main()).
      - name: Load the generator without running it (dry run)
        if: steps.mode.outputs.dry == 'true'
        run: node generator/tests/dry-run-entrypoints.mjs

      - name: Configure git identity
        if: steps.mode.outputs.dry != 'true'
        run: |
          git config user.name "Valerie Linc"
          git config user.email "valerielinc@gmail.com"

      # Hard-killed out of process, like the site repo's copy: a model provider
      # that accepts the connection and then stalls would otherwise hold the job
      # to its 60-minute timeout and take the slot with it.
      #
      # ── AN UNPRODUCTIVE LINK MUST NOT KILL THE CHAIN (2026-08-10) ──────────
      #
      # THE DEFECT. The chain alternates sections (see "Resolve run mode and
      # section"), so half of all links are handed to `svizzera`. On 2026-08-10
      # `svizzera` produced nothing on every attempt — its evergreen pool is
      # saturated and its Phase-1 news scan comes back empty. Measured on three
      # consecutive chain links (runs 31402855968, 31405881104, 31379813715:
      # 60s, 42s, 79s) the run logged "Tutte le keyword evergreen risultano già
      # coperte dal pre-flight", wrote no article, and therefore pushed nothing
      # under content/** — so nothing triggered the next link. Every second link
      # was terminal. Half of the 70% of invocations the chain is supposed to
      # carry was structurally dead, and only cron restarted it.
      #
      # THE FIX, AND WHY THIS ONE. The retry happens INSIDE this run: when the
      # section this link was assigned produces nothing, the same job tries the
      # other section before giving up. Zero new runs, zero new triggers, zero
      # new credentials.
      #
      # WHY IT TERMINATES — the property the header's stop-condition argument
      # buys, kept intact:
      #   1. The chain's stop condition is UNCHANGED. A run that produces no
      #      article still pushes nothing under content/**, so nothing fires.
      #      Chaining is still on the ARTICLE, never on the run.
      #   2. The fallback spawns no run at all. It is a bounded loop over a list
      #      built BEFORE the loop, holding at most one entry per section (there
      #      are two), with `break` on the first article and `break` on a hard
      #      kill. Two attempts per run, maximum, always.
      #   3. A wall-clock budget caps the pair so two attempts cannot outlive
      #      the job's 60-minute timeout.
      # So "both sections dry" ends exactly where it ended before: one run, no
      # article, no push, chain stopped, cron restarts it.
      #
      # THE ALTERNATIVES, AND WHY NOT:
      #   - Hand the baton to the other section at CHAIN level: the empty run
      #     has to push or dispatch something to do it, which is chaining on the
      #     run — the exact shape the header spent four days proving spins — and
      #     two dry sections then ping-pong until a cap stops them.
      #   - Re-run the same section: repeats a failure already observed.
      #   - An empty "chain" push: `content/**` would stop meaning "an article
      #     arrived", which is the one invariant the stop condition rests on,
      #     and it would re-arm the recursion with no content in it.
      #   - A consecutive-empty-links counter propagated across runs with a cap:
      #     it does terminate, but every empty link becomes another queued run,
      #     and this workflow's concurrency group is already oversubscribed —
      #     48 of the 142 runs in the 24h to 2026-08-10T16:00Z are `cancelled`
      #     with `jobs.total_count == 0`, i.e. evicted from the pending queue by
      #     a newer arrival without executing a single step. Adding runs makes
      #     that worse; this fix adds none. It also needs the counter carried in
      #     the commit subject or a dispatch input — a second state carrier that
      #     can silently desync from the first. See "Non implementato" in the PR
      #     for the concurrency question itself, which is not fixed here.
      #
      # NOTE ON BALANCE. Alternation exists to keep the two sections growing at
      # the same rate. The fallback breaks that tie deliberately, and only in
      # the case where the tie is not real: the skipped section had nothing to
      # grow with. Its turn is still requested first on every link, so the day
      # its pool refills it starts producing again with no change here.
      #
      # NOTE ON THE `run:` BLOCK. It carries no `${{ }}` interpolation — every
      # value arrives through `env:`. That keeps a dispatch-supplied `url` out
      # of the command line the shell parses, and it is what lets
      # generator/tests/generate-article-chain.test.mjs extract this block and
      # execute it against stubbed `node`/`timeout`/`git`.
      - name: Generate the article
        id: generate
        if: steps.mode.outputs.dry != 'true'
        env:
          TARGET_SECTION: ${{ steps.mode.outputs.section }}
          SOURCE_URL: ${{ inputs.url }}
          EVENT_NAME: ${{ github.event_name }}
          # Issue #313 — la meta' che DEVE stare sul processo che chiama callLLM:
          # ai-models.mjs offre claude-cli/haiku solo se hasClaudeCodeOauthToken()
          # e' vero QUI dentro. L'action sopra accende il flag, questo passa il
          # token; senza entrambi il modello resta «no API key for provider
          # claude_cli», che e' com'e' stato fino al 2026-08-14.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # `set +e` explicitly: GitHub's default shell is `bash -eo pipefail`,
          # so without this the step dies the instant create-article.mjs exits
          # non-zero and every branch below — the timeout handling, the
          # no-article-this-run handling — is unreachable. That is exactly what
          # happened on the first scheduled run after cutover: the step was
          # reported as a hard failure for a condition it was written to absorb.
          set +e
          set -uo pipefail

          # THE HONEST SIGNAL, DEFINED ONCE. A real generation ADDS a per-locale
          # body file under content/blog-body{,-ch}/<loc>/<id>.ts — the same
          # thing fast-publish-article.yml keys on. Everything downstream (the
          # commit title, the job summary) reads the outputs this function
          # produces, so there is exactly one definition of "an article exists"
          # in this file. `git add -A` first because the body files are new and
          # untracked; it is idempotent and "Commit and push" runs it again.
          # `|| true` at the call site: a no-match `grep` exits 1.
          article_body_added() {
            git add -A
            git diff --cached --name-only --diff-filter=A \
              | grep -E '^content/blog-body(-ch)?/[a-z]{2}/.+\.ts$' | head -1
          }

          # The attempt list, fixed before the loop — this is the termination
          # argument in code: one entry per section, never more.
          sections=("$TARGET_SECTION")
          if [ "${EVENT_NAME:-}" != "workflow_dispatch" ] && [ -z "${SOURCE_URL:-}" ]; then
            # A human who named a section (or handed over a URL, which is
            # section-specific) gets that section and nothing else.
            if [ "$TARGET_SECTION" = "svizzera" ]; then
              sections+=(frontaliere)
            else
              sections+=(svizzera)
            fi
          fi

          # 3000s against the job's 60-minute timeout leaves ~10 minutes for
          # checkout, npm ci, the thumbnail encode and the push. `SECONDS` is
          # this shell's own clock, so it measures the attempts and nothing else.
          #
          # The bound that matters: attempt N's cap is min(hard_kill, budget −
          # elapsed), so the attempts sum to at most `budget_s` however many
          # there are. Without the `budget_s − SECONDS` term two attempts could
          # each take `hard_kill_s` and outlive the job's own timeout, which is
          # the version generate-article-chain.test.mjs caught before it shipped.
          #
          # Overridable so that test can drive the arithmetic in seconds instead
          # of in tens of minutes; nothing sets these in CI.
          budget_s="${GENERATE_BUDGET_S:-3000}"
          hard_kill_s="${GENERATE_HARD_KILL_S:-2400}"

          # ── IL WEDGE, E PERCHE' IL CAP DI DURATA NON LO VEDE ──────────────
          #
          # Misurato il 2026-08-18 sulle 69 run `failure` dal 13-08: 42 sono lo
          # STESSO difetto, 26,6 ore in cinque giorni, e dal 16-08 e' l'unica
          # causa di fallimento rimasta (17-08: 12 su 12; 18-08: 2 su 2). Le
          # run campione sono 32077204181, 31867246321, 31858140066 (la prima,
          # 15-08 02:02Z) e 32103362457 (l'ultima).
          #
          # LA FORMA DEL DIFETTO, con le tre prove che la fissano — tutte e tre
          # su 42 run su 42:
          #   1. il segnale e' SEMPRE SIGKILL, mai SIGTERM (42 «Killed», 0
          #      «Terminated»), e l'intervallo inizio-sezione → kill sta fra
          #      2459 e 2460s, cioe' hard_kill_s + il grace di --kill-after=60s
          #      al secondo. Eppure ai-models.mjs registra un handler SIGTERM
          #      che esce 143: il processo non l'ha eseguito per 60 secondi.
          #   2. l'heartbeat da 60s di `_callModel` («⏳ … in-flight Ns») non
          #      stampa mai (assente in 39 run su 42, mentre altrove nei log
          #      compare 144 volte);
          #   3. il cap duro interno «hard cap: no response» non scatta 0 volte
          #      su 69, e non compare nessun AbortError/TimeoutError/ECONNRESET.
          # Un timer JS che non parte, un handler di segnale che non gira e
          # nessun errore di rete: l'event loop e' bloccato da lavoro SINCRONO.
          #
          # In 40 run su 42 il silenzio comincia subito dopo una riga
          # `[prompt-budget]`, che e' un INDIZIO e non una localizzazione: quella
          # riga e' su stderr, stdout e stderr verso una pipe sono scritti in
          # modo asincrono e su canali distinti, l'ordinamento fra i due non e'
          # garantito, e su SIGKILL cio' che e' ancora in coda si perde.
          # «Ultima riga vista» non e' «ultimo punto eseguito» — ed e' la
          # ragione per cui questo step ora prende uno STACK, da cui non si
          # scappa, invece di far dedurre il punto dal log.
          #
          # PERCHE' NON SI ABBASSA `hard_kill_s`, che e' la mitigazione ovvia.
          # E' stata misurata: su 530 run `success` vere (≥90s) le durate sono
          # p50=460s, p75=704s, p90=1599s, p95=2493s. Un cap a 900s ucciderebbe
          # 82 run sane su 530 (15,5%), uno a 1200s ne ucciderebbe 63 (11,9%).
          # La durata NON separa i due regimi. Il SILENZIO si': su cinque run
          # sane (32051739807, 32069883181, 32074009886, 32086523370 e una da
          # 677s) il buco fra due righe di log consecutive sta fra 3 e 21s al
          # p99, con un MASSIMO osservato di 182s; una run incastrata tace 2337s
          # mediani. Piu' di un ordine di grandezza fra i due, e la soglia sotto
          # e' 3,3x il massimo legittimo osservato.
          #
          # Quindi il cap di durata resta dov'e' — e' lui a coprire il caso
          # «lento ma vivo» — e questo watchdog copre il caso «muto». Il wedge
          # costa 10 minuti invece di 40: ~74% delle 26,6 ore.
          #
          # LA MISURA E' LA CRESCITA DI UN FILE, non un timestamp per riga: lo
          # step produce fino a 5.500 righe e un `date` per riga sarebbe una
          # spesa per ogni riga per osservare un evento che capita una volta.
          # `wc -c` ogni 30s costa 80 letture in tutto il budget.
          #
          # Overridable come i due sopra, cosi' che
          # generate-article-chain.test.mjs possa provare il kill per stallo in
          # secondi invece che in dieci minuti; nulla li imposta in CI.
          stall_s="${GENERATE_STALL_S:-600}"
          stall_poll_s="${GENERATE_STALL_POLL_S:-30}"
          stall_grace_s="${GENERATE_STALL_GRACE_S:-10}"

          # Fuori dal workspace di proposito: `article_body_added` fa `git add
          # -A`, quindi qualunque file diagnostico scritto sotto il repo
          # finirebbe nel commit e su main. RUNNER_TEMP non e' in git.
          diag_dir="${RUNNER_TEMP:-/tmp}/generate-diagnostics"
          rm -rf "$diag_dir"
          mkdir -p "$diag_dir"
          stall_flag="$diag_dir/stalled"
          stall_log="$diag_dir/attempt.log"
          # Il client sta FUORI dalla cartella caricata: se ci stesse dentro,
          # `if-no-files-found: ignore` non scatterebbe mai e ogni run
          # caricherebbe un artifact con dentro solo lo strumento.
          cdp_client="${RUNNER_TEMP:-/tmp}/cdp-stack.mjs"

          # L'albero dei processi, foglie per prime. `ps -A -o pid=,ppid=` si
          # comporta identico su Linux e su macOS (questi blocchi girano anche
          # nei test in locale); `pgrep -P` no.
          proc_tree() {
            local root="$1" kid
            for kid in $(ps -A -o pid= -o ppid= | awk -v p="$root" '$2 == p { print $1 }'); do
              proc_tree "$kid"
            done
            printf '%s\n' "$root"
          }

          kill_tree() {
            local sig="$1" root="$2" p
            case "$root" in ''|0|*[!0-9]*) return 0 ;; esac
            for p in $(proc_tree "$root"); do
              kill "-$sig" "$p" 2>/dev/null || true
            done
          }

          # ── PRENDERE LO STACK, PERCHE' LA CAUSA NON SI TROVA LEGGENDO ─────
          #
          # Il client CDP qui sotto e' la meta' che trasforma il prossimo wedge
          # in una prova invece che in un silenzio. Sta qui dentro e non in
          # scripts/ perche' e' inerte finche' il watchdog non scatta.
          #
          # VERIFICATO su node v22.23.2 (il `node-version: '22'` di questo
          # workflow) contro un processo con l'event loop bloccato da un `while`
          # sincrono, il 2026-08-18:
          #   - `--report-on-signal --report-signal=SIGUSR2 --report-directory`
          #     sono accettati, e con l'event loop LIBERO il report viene
          #     scritto (header, javascriptStack, nativeStack, libuv, heap);
          #   - con l'event loop BLOCCATO il report NON viene scritto: la
          #     richiesta resta appesa e il file compare solo quando il loop
          #     riparte. Misurato: 0 file dopo SIGUSR2 a loop bloccato, 1 file
          #     appena il blocco finisce. Il report da solo non basta per QUESTO
          #     difetto — che e' esattamente un loop che non riparte piu'.
          #   - SIGUSR1 accende l'inspector ANCHE a loop bloccato (lo fa un
          #     thread dedicato), e `Debugger.pause` restituisce i callFrame:
          #     lo stack JS del frame incastrato, che e' cio' che serve.
          # Quindi si mandano entrambi: SIGUSR2 copre il caso in cui il loop si
          # sblocchi (il report porta anche stack nativo e handle libuv), il
          # client CDP copre il wedge vero.
          cat > "$cdp_client" <<'CDP_CLIENT'
          const fs = await import('node:fs');
          const outFile = process.argv[2];
          const port = process.env.STALL_INSPECT_PORT || '9229';
          const bail = (why) => {
            try { fs.writeFileSync(outFile, `stack non catturato: ${why}\n`); } catch {}
            process.exit(0);
          };
          setTimeout(() => bail('il client CDP non ha ricevuto Debugger.paused in 8s'), 8000);
          let target;
          try {
            const res = await fetch(`http://127.0.0.1:${port}/json/list`);
            [target] = await res.json();
          } catch (e) {
            bail(`inspector non raggiungibile: ${e && e.message}`);
          }
          if (!target || !target.webSocketDebuggerUrl) bail('nessun target inspector');
          const ws = new WebSocket(target.webSocketDebuggerUrl);
          const scriptUrls = new Map();
          let id = 0;
          const send = (method) => ws.send(JSON.stringify({ id: ++id, method, params: {} }));
          ws.addEventListener('error', (e) => bail(`websocket: ${(e && e.message) || 'errore'}`));
          ws.addEventListener('open', () => { send('Debugger.enable'); send('Debugger.pause'); });
          ws.addEventListener('message', (ev) => {
            const msg = JSON.parse(ev.data);
            if (msg.method === 'Debugger.scriptParsed') {
              scriptUrls.set(msg.params.scriptId, msg.params.url);
              return;
            }
            if (msg.method !== 'Debugger.paused') return;
            const frames = msg.params.callFrames.map((f) => {
              const url = f.url || scriptUrls.get(f.location.scriptId) || '(sconosciuto)';
              return `  at ${f.functionName || '(anonimo)'} (${url}:${f.location.lineNumber + 1}:${f.location.columnNumber + 1})`;
            });
            fs.writeFileSync(outFile, `stack JS al momento dello stallo — ${frames.length} frame\n${frames.join('\n')}\n`);
            process.exit(0);
          });
          CDP_CLIENT

          # I pid di create-article.mjs dentro l'albero del tentativo. Serve al
          # campionamento e ai segnali: `timeout` NON va segnalato al posto suo
          # (SIGUSR1/2 non sono fra quelli che rilancia, e li prenderebbe come
          # terminazione, orfanando il figlio).
          create_article_pids() {
            local root="$1" p args out=""
            for p in $(proc_tree "$root"); do
              args="$(ps -o args= -p "$p" 2>/dev/null || true)"
              case "$args" in
                *create-article.mjs*) out="$out $p" ;;
              esac
            done
            printf '%s' "$out"
          }

          # Il watchdog. Non fallisce mai lo step da solo: alza un flag e
          # uccide, e chi classifica l'esito resta il codice dopo il ciclo.
          stall_watchdog() {
            local root="$1" last=-1 quiet=0 size p node_pids
            while kill -0 "$root" 2>/dev/null; do
              sleep "$stall_poll_s"
              size="$(wc -c < "$stall_log" 2>/dev/null | tr -d ' ')"
              [ -n "$size" ] || size=0

              # ── LA TRAIETTORIA DELLA MEMORIA, dallo STESSO campione ────────
              # Costa un `ps` ogni 30s e separa due ipotesi che il silenzio da
              # solo confonde: un thrash del GC (major collection su heap
              # saturo — congela l'event loop, non serve SIGTERM, cede solo a
              # SIGKILL: spiega da sola tutti e tre i segnali osservati) tiene
              # l'RSS incollato al tetto con la CPU al 100%; un blocco in
              # codice nativo lascia l'RSS fermo e la CPU a zero. Il workflow
              # non imposta NODE_OPTIONS ne' --max-old-space-size (verificato:
              # zero occorrenze in questo file), quindi il tetto e' quello di
              # default del runner ed e' raggiungibile.
              # Campionato da FUORI il processo di proposito: un sampler dentro
              # (worker thread) andrebbe iniettato nel generatore, che questa PR
              # non tocca — e un worker non vede comunque l'heap del main.
              [ -s "$diag_dir/resources.log" ] || \
                echo "# ts elapsed log_bytes | pid rss_kb cpu% state" > "$diag_dir/resources.log"
              for p in $(create_article_pids "$root"); do
                echo "$(date -u +%H:%M:%SZ) ${SECONDS}s ${size} | $(ps -o pid=,rss=,%cpu=,state= -p "$p" 2>/dev/null | tr -s ' ')" \
                  >> "$diag_dir/resources.log" 2>/dev/null || true
              done

              if [ "$size" != "$last" ]; then
                last="$size"
                quiet=0
                continue
              fi
              quiet=$(( quiet + stall_poll_s ))
              [ "$quiet" -lt "$stall_s" ] && continue

              # Il flag PRIMA di qualunque segnale: da qui in poi qualunque
              # cosa succeda al processo, l'esito e' «stallo» e non «kill duro».
              : > "$stall_flag"
              echo "::warning::watchdog: nessun output per ${quiet}s (soglia ${stall_s}s) sulla sezione ${sec} — l'event loop e' bloccato, non e' lentezza. Prendo lo stack e uccido."

              node_pids="$(create_article_pids "$root")"
              for p in $node_pids; do kill -USR2 "$p" 2>/dev/null || true; done
              for p in $node_pids; do kill -USR1 "$p" 2>/dev/null || true; done
              sleep 2
              node "$cdp_client" "$diag_dir/stack-${sec}-${tried}.txt" \
                >> "$diag_dir/cdp-client.log" 2>&1 || true

              # Il grace serve al report di SIGUSR2, che e' scritto dal
              # processo stesso: ucciderlo subito butterebbe via l'unica cosa
              # per cui e' stato chiesto.
              sleep "$stall_grace_s"
              kill_tree KILL "$root"
              return 0
            done
          }

          watch_pid=""
          # Il watchdog non sopravvive mai allo step: muore col tentativo (qui
          # sotto) e comunque all'uscita, qualunque ramo la produca.
          stall_atexit() {
            kill_tree KILL "${watch_pid:-}"
            # Il log del tentativo e la traiettoria si caricano solo quando
            # servono: su una run che ha prodotto non resta niente da caricare,
            # e l'artifact sparisce da solo con `if-no-files-found: ignore`.
            if [ ! -f "$stall_flag" ] && [ "${produced:-false}" = "true" ]; then
              rm -f "$stall_log" "$diag_dir/resources.log"
            fi
            return 0
          }
          trap stall_atexit EXIT

          # Never start an attempt that cannot finish. A sixteenth of the budget
          # (~3 minutes on the defaults) is the floor; it also keeps the cap
          # strictly positive, and that matters — `timeout 0s` means NO limit,
          # so a zero cap would hand the job away rather than protect it.
          min_attempt_s=$(( budget_s / 16 ))
          [ "$min_attempt_s" -lt 1 ] && min_attempt_s=1
          produced=false
          effective="$TARGET_SECTION"
          tried=0
          # ── L'OSSERVATORE (issue #313 / #348) ────────────────────────────
          #
          # LA REGOLA E' INVERTITA rispetto a com'era, ed e' l'inversione a
          # essere la fix. Prima: «assorbi ogni uscita tranne quelle nominate»
          # (all'inizio nessuna, poi il solo exit 3). Una regola di quella forma
          # lascia passare per costruzione ogni difetto non ancora nominato, ed
          # e' precisamente cosi' che la run 31823202761 e' uscita verde: la sua
          # miscela di errori non era il caso nominato. Ora: «se non c'e' un
          # articolo, FALLISCI, tranne quando ogni tentativo ha DICHIARATO una
          # ragione legittima» — cioe' e' uscito EXIT_NO_ARTICLE_DECLARED (4).
          #
          # Le sei ragioni legittime sono enumerate in
          # `generator/scripts/lib/exhaustion-disposition.mjs` e sono le UNICHE
          # cose che questo step assorbe ancora quando article=false: pool
          # evergreen saturo, nessuna keyword disponibile, tentativi evergreen
          # esauriti, duplicato, rigetto qualita', quota davvero esaurita.
          #
          # Tutto il resto e' rosso, exit 0 compreso: un create-article.mjs che
          # esce 0 senza scrivere un corpo non ha dichiarato niente, ed e'
          # indistinguibile da una generazione riuscita. Anche il kill duro a
          # 2400s: quaranta minuti spesi su un provider che stalla non sono un
          # differimento, e assorbirli e' lo stesso silenzio verde a un'altra
          # riga.
          #
          # L'ORACOLO E' IL CODICE DI USCITA, mai una stringa dello stdout: quel
          # flusso e' pieno di sequenze ANSI e di virgolette tipografiche, e un
          # `grep` su di esso e' un oracolo che si acceca da solo senza dirlo.
          #
          # COSA QUESTA REGOLA NON COPRE, dichiarato perche' non venga
          # ri-derivato: un differimento VERO che si ripete per ore (quota vera
          # su tutto il roster, o pool secco per una notte intera) resta verde,
          # run per run, ed e' giusto — la sua patologia e' la DURATA, che un
          # singolo run non ha il denominatore per vedere. Quel denominatore ce
          # l'ha gia' `scripts/ci/scan-generation-health.mjs` (condizione
          # `generation-idle`, soglia 6h, cron ogni 2h): il 2026-08-14 ha
          # funzionato, ed e' lui ad aver aperto la #348 alle 14:03:36Z.
          # Duplicarlo qui dentro sarebbe una seconda copia peggiore di un
          # osservatore che gia' regge.
          roster_blocked=false
          # `false` appena UN tentativo finisce senza articolo e senza uscire 4.
          all_declared=true
          # La prima ragione non dichiarata incontrata, per il messaggio finale.
          undeclared_why=""

          for sec in "${sections[@]}"; do
            remaining=$(( budget_s - SECONDS ))
            if [ "$remaining" -lt "$min_attempt_s" ]; then
              echo "::warning::time budget spent — not attempting section $sec"
              break
            fi
            cap="$hard_kill_s"
            [ "$remaining" -lt "$cap" ] && cap="$remaining"
            tried=$(( tried + 1 ))
            echo "── attempt $tried: section=$sec cap=${cap}s"

            # Il tentativo gira in background con l'output duplicato su
            # `$stall_log`: e' quel file a crescere (o a non crescere) che il
            # watchdog campiona. `$!` e' il pid di `timeout`, quindi `wait` piu'
            # sotto restituisce il suo codice di uscita esattamente come prima.
            # I flag `--report-*` vanno PRIMA del path dello script, e non
            # cambiano la forma degli argomenti di `timeout` (tre, come prima).
            rm -f "$stall_flag"
            : > "$stall_log"
            if [ -n "${SOURCE_URL:-}" ]; then
              timeout --signal=TERM --kill-after=60s "${cap}s" \
                node --report-on-signal --report-signal=SIGUSR2 --report-directory="$diag_dir" \
                generator/scripts/create-article.mjs --section="$sec" "$SOURCE_URL" \
                > >(tee -a "$stall_log") 2>&1 &
            else
              timeout --signal=TERM --kill-after=60s "${cap}s" \
                node --report-on-signal --report-signal=SIGUSR2 --report-directory="$diag_dir" \
                generator/scripts/create-article.mjs --section="$sec" \
                > >(tee -a "$stall_log") 2>&1 &
            fi
            attempt_pid=$!
            stall_watchdog "$attempt_pid" &
            watch_pid=$!
            wait "$attempt_pid"
            rc=$?
            # Il watchdog muore col tentativo, e con lui il suo `sleep`: un
            # figlio rimasto vivo terrebbe aperto lo stdout dello step.
            kill_tree KILL "$watch_pid"
            wait "$watch_pid" 2>/dev/null || true
            watch_pid=""

            # ── LO STALLO PRIMA DEL KILL DURO, e l'ordine e' obbligatorio ────
            # Un kill del watchdog esce 137 come il grace di `timeout`, quindi
            # il codice di uscita da solo non distingue i due difetti. Li
            # distingue il flag, che il watchdog alza prima di toccare il
            # processo. Sono due patologie diverse — «bloccato» contro «lento
            # oltre il cap» — e il prossimo lettore deve poterle contare
            # separatamente nei log, non stimarle.
            if [ -f "$stall_flag" ]; then
              echo "::warning::create-article.mjs muto per ${stall_s}s sulla sezione $sec — ucciso dal watchdog dello stallo, mentre il cap di durata (${cap}s) non era nemmeno vicino"
              all_declared=false
              [ -n "$undeclared_why" ] || undeclared_why="stallo: nessun output per ${stall_s}s sulla sezione $sec (kill del watchdog, exit $rc) — l'event loop e' bloccato da lavoro sincrono, ed e' un difetto DIVERSO dal kill duro per budget scaduto. Lo stack e' nell'artifact generate-article-diagnostics."
              break
            fi
            if [ "$rc" = "124" ] || [ "$rc" = "137" ]; then
              # A provider that stalls stalls for the other section too, and the
              # budget is already gone. Stop; do not spend the job's remaining
              # minutes on the same wall.
              #
              # NON PIU' ASSORBITO (issue #313 / #348): un kill duro dopo
              # ${cap}s non e' un differimento — non c'e' niente che si curi da
              # solo al prossimo giro, e la run che lo assorbe e' verde per
              # quaranta minuti spesi contro un muro. Il `break` resta (il muro
              # e' lo stesso per l'altra sezione), il verde no.
              echo "::warning::create-article.mjs hard-killed after ${cap}s on section $sec — no article this run"
              all_declared=false
              [ -n "$undeclared_why" ] || undeclared_why="kill duro dopo ${cap}s sulla sezione $sec (exit $rc): un provider che stalla non e' un differimento"
              break
            fi
            # ISSUE #313 — l'ECCEZIONE all'assorbimento qui sotto, e va valutata
            # prima di esso. Exit 3 non vuol dire «nessuna fonte adatta»: vuol
            # dire che il roster ha rifiutato il payload sulla TAGLIA, cioe' una
            # condizione che il prossimo run riproduce identica perche' nessuna
            # finestra di quota rimpicciolisce un prompt. Assorbirla e' il ciclo
            # che ha tenuto questo workflow `success` per 60+ run consecutive
            # senza un articolo (06:06Z → 16:30Z del 2026-08-14), senza che
            # `scan-failed-runs.mjs` — che raccoglie solo le run `failure` —
            # avesse nulla da raccogliere.
            #
            # Non si esce subito: la sezione gemella va comunque tentata (un
            # prompt e' per-fonte, e l'altra fonte puo' stare sotto il cap). Il
            # flag decide DOPO il ciclo, e solo se non e' uscito niente.
            if [ "$rc" = "3" ]; then
              echo "::warning::create-article.mjs: il roster non puo' servire il prompt della sezione $sec (exit 3)"
              roster_blocked=true
            fi

            body="$(article_body_added || true)"
            if [ -n "$body" ]; then
              produced=true
              effective="$sec"
              echo "article body added: $body"
              break
            fi
            echo "section $sec produced no article"

            # ── LA DICHIARAZIONE, valutata DOPO aver constatato che non c'e' un
            # corpo. L'ordine conta: exit 4 con un articolo scritto non esiste,
            # ma exit 0 CON articolo e' il caso normale e non deve mai passare
            # di qui. Sopra c'e' gia' il `break`, quindi qui `$rc` descrive
            # sempre un tentativo finito a mani vuote.
            if [ "$rc" = "4" ]; then
              # Ragione legittima dichiarata: pool secco, duplicato, rigetto
              # qualita', o quota davvero esaurita. E' l'unico assorbimento
              # rimasto.
              echo "::warning::create-article.mjs: nessun articolo sulla sezione $sec, ragione legittima DICHIARATA (exit 4)"
            elif [ "$rc" = "0" ]; then
              # Il caso piu' insidioso, e quello che nessuno stava guardando:
              # uscita 0 senza aver scritto niente. Non e' distinguibile da una
              # generazione riuscita se non contando i corpi, che e' esattamente
              # cio' che `article_body_added` fa un attimo sopra.
              all_declared=false
              [ -n "$undeclared_why" ] || undeclared_why="create-article.mjs e' uscito 0 sulla sezione $sec senza scrivere un corpo e senza dichiarare una ragione (attesa: exit 4)"
            else
              all_declared=false
              [ -n "$undeclared_why" ] || undeclared_why="create-article.mjs e' uscito $rc sulla sezione $sec (non e' una delle sei ragioni legittime, che escono 4)"
            fi
          done

          # Zero tentativi non e' una dichiarazione vacuamente vera: e' il caso
          # che il ramo «tried == 0» piu' sotto rende rosso, e senza questa riga
          # `all_declared` restava `true` per costruzione (nessun giro del loop
          # lo tocca), quindi lo step «Chain» — che legge `declared` e non lo
          # status del job — dispatchava il successore esattamente nel caso in
          # cui il generatore non e' nemmeno partito.
          if [ "$tried" = "0" ]; then
            all_declared=false
          fi

          # `article` is the signal; `section` is the section that actually
          # wrote, which is what the next chain link alternates off.
          #
          # `declared` e `roster_blocked` esistono per lo step «Chain», e vanno
          # letti INSIEME: `all_declared` resta `true` anche quando il roster
          # non ha potuto servire il prompt (exit 3 non azzera il flag, imposta
          # `roster_blocked`), quindi un successore deciso sul solo `declared`
          # ripartirebbe contro un muro che il prossimo tentativo trova
          # identico. Sono due condizioni, non una.
          {
            echo "article=$produced"
            echo "section=$effective"
            echo "declared=$all_declared"
            echo "roster_blocked=$roster_blocked"
          } >> "$GITHUB_OUTPUT"
          echo "article=$produced section=$effective declared=$all_declared roster_blocked=$roster_blocked attempts=$tried/${#sections[@]}"

          # ── LA RUN DIVENTA ROSSA (issue #313 / #348) ──────────────────────
          # Gli output sono gia' scritti sopra: gli step con `if: always()` (il
          # Summary) leggono lo stesso verdetto che leggerebbero su una run
          # verde, quindi il fallimento non li rende ciechi.
          #
          # `produced=true` CHIUDE LA QUESTIONE, sempre e per primo. Se una
          # sezione ha scritto un corpo, il roster ha servito e la run e' un
          # successo qualunque cosa sia successa all'altra sezione: fallirla
          # getterebbe via un articolo buono, gia' pagato in LLM, traduzioni e
          # immagine. E' la ragione per cui il roster_blocked di #357 era in
          # congiunzione, e resta vera parola per parola qui.
          if [ "$produced" = "true" ]; then
            exit 0
          fi

          # Da qui in giu' NON c'e' un articolo. La domanda non e' piu' «quale
          # errore e' successo» — e' «qualcuno ha dichiarato perche'?».
          if [ "$tried" = "0" ]; then
            echo "::error::nessun tentativo eseguito: il budget wall-clock era gia' speso prima del primo. Una run che non prova nemmeno non e' un esito normale."
            exit 1
          fi
          if [ "$roster_blocked" = "true" ]; then
            echo "::error::roster esaurito: nessun modello ha accettato il prompt e nessun articolo e' stato prodotto in $tried tentativi. Una run che non genera niente perche' il roster non puo' servirla NON e' un esito normale — vedi il messaggio 'roster-cannot-serve-prompt' nel log per il numero di token da tagliare."
            exit 1
          fi
          if [ "$all_declared" != "true" ]; then
            echo "::error::nessun articolo in $tried tentativi, e la ragione NON e' dichiarata: ${undeclared_why}. Le sei ragioni legittime escono tutte con EXIT_NO_ARTICLE_DECLARED (4) — vedi generator/scripts/lib/exhaustion-disposition.mjs. Un'uscita senza articolo e senza dichiarazione e' il verde silenzioso della #313 (60+ run 'success' consecutive, 06:06Z→16:30Z del 2026-08-14), e da qui in poi e' rossa."
            exit 1
          fi
          # Nessun articolo, ma ogni tentativo ha dichiarato una ragione
          # legittima: e' l'unico verde senza articolo che resta. Se questo
          # stato PERSISTE, a vederlo e' `scan-generation-health.mjs`
          # (`generation-idle`, 6h) — non questo step, che non ha il
          # denominatore per distinguere una notte secca da un guasto.
          echo "nessun articolo, ma ogni tentativo ha dichiarato una ragione legittima (exit 4) — verde"
          exit 0

      # ── LO STACK CHE IL SILENZIO NON HA MAI STAMPATO ────────────────────────
      #
      # Il wedge ha lasciato 42 run identiche e nessuna prova: heartbeat assente,
      # nessun errore, nessun handler eseguito. Da qui in poi lascia dei file.
      # `if: always()` perche' lo step sopra e' ROSSO proprio nel caso che
      # interessa; senza, l'unica volta che l'artifact serve non verrebbe
      # caricato.
      #
      # `if-no-files-found: ignore` e non `warn`: sulla stragrande maggioranza
      # delle run la cartella e' vuota per costruzione (il log del tentativo
      # viene rimosso quando l'articolo c'e'), e un warning per run insegna solo
      # a ignorare i warning.
      #
      # Il path e' sotto `runner.temp` e NON sotto il workspace: `git add -A`
      # nello step sopra porterebbe un report diagnostico dritto dentro il
      # commit e su main.
      #
      # Si carica la CARTELLA, senza filtri e senza `tail`: il report di Node e'
      # un JSON solo, e le sue sezioni `javascriptHeap` e `resourceUsage` sono
      # esattamente quelle che distinguono un thrash del GC da un blocco in
      # codice nativo. Un filtro qui sarebbe la cecita' che questo step esiste
      # per togliere.
      - name: Upload wedge diagnostics (stack, report, log del tentativo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generate-article-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/generate-diagnostics
          if-no-files-found: ignore
          retention-days: 14

      # ── VALIDARE PRIMA DI SCRIVERE (issue #267) ─────────────────────────────
      #
      # Questo e' il percorso di scrittura, ed e' l'unico punto in cui un corpo
      # fabbricato puo' essere fermato PRIMA di esistere su `main`. La rete di
      # sicurezza gemella in `publish-api.yml` ferma l'ANNUNCIO — nessun
      # `repository_dispatch: articles-published`, nessuna superficie dati nuova
      # — ma il commit sarebbe gia' su main, e lo `schedule` 2x/giorno di
      # `sync-articles-sitemaps.yml` del sito potrebbe portarlo di la' comunque,
      # in ritardo e senza che nessuno colleghi le due cose. Le due meta' non si
      # sostituiscono: una impedisce di pubblicare, questa impedisce di scrivere.
      #
      # Il fatto che rende la coppia necessaria, misurato: `tests.yml` ha girato
      # 0 volte su `main` nelle ultime 50 run (ha `push: branches-ignore:
      # [main]`) mentre `main` riceve ~111 commit/giorno tutti su `content/**`
      # dal push qui sotto. Il gate ignora main, la generazione scrive solo su
      # main, e la guardia contro le allucinazioni — che conteneva gia' il
      # pattern giusto — non e' mai stata eseguita sugli artefatti per cui
      # esiste. Il 2026-08-11 un corpo con «LTL 1995» e' passato di qui e ha
      # tenuto rosso `main` DEL SITO per ~13 ore, bloccando sei PR.
      #
      # LA CONDIZIONE: solo quando un articolo e' stato prodotto davvero. Una
      # run che non scrive niente sotto content/** non ha niente da validare, e
      # farla fallire su un difetto preesistente del corpus spegnerebbe la
      # catena per un articolo che non ha generato lei.
      #
      # IL RIFIUTO E' OSSERVABILE, non silenzioso — la DoD di #267 lo chiede
      # esplicitamente, perche' un articolo scartato in silenzio e' un articolo
      # perso (#255). Tre canali, nessuno dei quali va cercato: `node --test`
      # elenca gli offender per path nel log dello step; il job summary porta il
      # verdetto in cima alla pagina della run; e la run finisce `failure`,
      # quindi `scan-failed-runs.mjs` la raccoglie (evento `schedule`/`push` +
      # `failure`, e `Generate Blog Article` non e' in `PR_GATE_WORKFLOWS`) e
      # apre una «Workflow Failure».
      #
      # QUESTO STEP NON RI-SONDA GIT, di proposito, e non e' una rinuncia: c'e'
      # UNA SOLA definizione di «articolo prodotto» in questo workflow — la
      # `article_body_added()` dello step sopra — e
      # `generate-article-chain.test.mjs` la tiene tale contando le occorrenze di
      # `--diff-filter=A`. Due probe sono due nozioni che possono divergere, ed e'
      # gia' costato una volta (il summary diceva «Generated: true» sulla run il
      # cui commit diceva «no article generated»). Il file appena scritto e' gia'
      # nel log, stampato da quella funzione come «article body added: …».
      #
      # NIENTE RIPARAZIONE EURISTICA, sempre per la DoD di #267: se una cifra e'
      # inventata, riattribuirla a un ente vero fa passare il gate e PEGGIORA
      # l'articolo. Qui si scarta e basta; la rigenerazione e' il run successivo.
      # AGGIUNTE 2026-08-13 (issue #280 item 3): stesso gemello aggiunto al
      # preflight di publish-api.yml, e per lo stesso motivo — questo step
      # rifiuta PRIMA del commit, quel preflight rifiuta prima della
      # pubblicazione se qualcos'altro (batch-faq, border-wait) fa arrivare a
      # main un articolo che questo step non ha visto. article-slug-i18n
      # (#191) e article-source-echo (#202) sono scan del corpus generato,
      # stessa famiglia di fabrication/placeholder, non contratti statici sul
      # sorgente — vedi il commento nel preflight di publish-api.yml per i due
      # esclusi (news-scan-quality, news-sources-svizzera) e perche'.
      - name: Guard — l'articolo generato non raggiunge main se viola le guardie
        id: guard
        if: steps.mode.outputs.dry != 'true' && steps.generate.outputs.article == 'true'
        env:
          SECTION: ${{ steps.generate.outputs.section }}
        run: |
          set -uo pipefail
          if node --test \
            generator/tests/article-fabrication-guard.test.mjs \
            generator/tests/prompt-placeholder-guard.test.mjs \
            generator/tests/article-slug-i18n.test.mjs \
            generator/tests/article-source-echo.test.mjs; then
            exit 0
          fi
          {
            echo "### ✖ Articolo RIFIUTATO prima del commit — sezione \`${SECTION:-?}\`"
            echo
            echo "\`article-fabrication-guard\` / \`prompt-placeholder-guard\` / \`article-slug-i18n\` / \`article-source-echo\` hanno trovato offender nel corpus dopo la generazione."
            echo "**Niente e' stato committato**: il corpo resta sul runner e sparisce con lui, \`main\` non lo vede."
            echo
            echo "Gli offender sono elencati per path nel log di questo step. Confrontali con la riga \`article body added:\` dello step «Generate the article»:"
            echo
            echo "- se coincidono, il difetto e' **dell'articolo appena generato** e il rimedio e' la rigenerazione (il run successivo), non una modifica al gate;"
            echo "- se NON coincidono, il difetto e' **preesistente nel corpus** e va riparato prima che la generazione possa ripartire — finche' resta li', ogni run che produce un articolo muore qui."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # Encode the 480w WebP thumbnail for the new hero. This step exists in the
      # main repo's generate-article.yml and was dropped in transport, so every
      # article generated here since the cutover has a hero and no thumbnail.
      # publish-article-fast.mjs looks for
      # public/images/blog/thumbnails/<slug>-480w.webp, logs "does not exist on
      # disk" and omits it from cdnUploads — a log line, not a failure, so the
      # thumbnail simply 404s on the CDN forever.
      #
      # The .webp outputs are COMMITTED (git is the cache): the committed ones
      # arrive with the checkout, so the script skips them via its fast path and
      # only encodes the freshly-added hero. `git add -A` below commits it.
      - name: Generate responsive image thumbnail for the new article
        if: steps.mode.outputs.dry != 'true'
        run: node scripts/generate-image-thumbnails.mjs

      - name: Commit and push
        if: steps.mode.outputs.dry != 'true'
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "no article generated this run"
            exit 0
          fi
          if [ -z "${GITHUB_PAT:-}" ]; then
            echo "::error::GITHUB_PAT missing — a GITHUB_TOKEN push fires no workflow at all (anti-recursion), so the article would never reach the site via publish-api.yml AND the self-trigger chain would stop dead. Both depend on this push being PAT-authenticated."
            exit 1
          fi

          # Title the commit by what it actually produced. `git add -A` stages
          # data/topic-candidates-evergreen-rejected.json, which this job
          # rewrites on EVERY run including ones that generate nothing, so
          # "changes exist" is not "an article exists" — and every such run was
          # landing as "Generate blog article (section)". Measured on four
          # consecutive runs: two produced an article, two produced only the
          # rejected-candidates file, and all four claimed an article. The log
          # read as twice the output that existed.
          #
          # The probe that answers that question now lives once, in
          # `article_body_added` in the "Generate the article" step, because it
          # is also what decides whether the fallback section gets a turn. This
          # step and the job summary both read its outputs, so the commit title
          # and the summary line cannot drift apart — that drift is defect 2 of
          # this PR, where the summary said "Generated: true" on the very run
          # whose commit said "no article generated".
          #
          # The produced branch names the EFFECTIVE section — the one that
          # wrote — not the one the link was assigned, because the next link
          # alternates off this subject and must alternate off what exists.
          if [ "${{ steps.generate.outputs.article }}" = "true" ]; then
            git commit -m "Generate blog article (${{ steps.generate.outputs.section }})"
          else
            git commit -m "Record rejected topic candidates (${{ steps.mode.outputs.section }} — no article generated)"
          fi

          TARGET="${{ github.ref_name }}"
          REMOTE="https://x-access-token:${GITHUB_PAT}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3 4 5; do
            if git push "$REMOTE" "HEAD:$TARGET"; then
              echo "pushed to $TARGET"
              exit 0
            fi
            echo "push attempt $attempt failed — rebasing onto $TARGET"
            # A conflict here is routinely NOT transient: this job rewrites the
            # bookkeeping caches below in full on every run, so two runs
            # started from different bases conflict for real and all five
            # attempts then fail identically (issue #76). The helper takes
            # upstream's copy when the conflict is confined to those caches and
            # lets the rebase finish, so the commit — and the article in it —
            # survives. Any other conflicting path still aborts, as before.
            #
            # public/data/journalist-image-catalog.json joined the list on
            # 2026-08-11 (issue #225). It belongs to the same category by
            # construction, not by convenience: generate-journalist-image-catalog.mjs
            # DERIVES it entirely from the filenames under public/images/blog/
            # ("Run directly to do a full rescan"), and appendCatalogEntry()
            # rewrites the whole file as a single JSON.stringify line with no
            # newline — so any two runs that add an image conflict textually on
            # that one line, every time. It was NOT on the list, so the helper
            # aborted exactly as designed, five times, and the run died on
            # "the article is registered locally but not pushed" with
            # steps.generate.outputs.article == true. Measured over the 37h to
            # 2026-08-11: 4 failures of this workflow, 4 with a fully generated
            # article — LLM, four DeepL translations and the hero image all
            # already paid for — thrown away. Run 31459831234 is the one that
            # conflicted on this path.
            #
            # Taking upstream costs one catalog entry (the new image's), and the
            # image file itself still lands in the commit; a full rescan restores
            # it. Losing the commit costs the whole article.
            #
            # ── I REGISTRI sono una categoria diversa (issue #255, #281, #285) ──
            #
            # I path sopra sono cache: la risoluzione giusta e' prendere
            # upstream, perche' al giro dopo vengono riscritte da zero. I path
            # sotto `--merge-registry` sono REGISTRI APPEND-ONLY, e per loro
            # prendere un lato non «perde un aggiornamento»: CANCELLA i record
            # che quel lato non ha. Aggiungerli all'allowlist di sopra avrebbe
            # tolto dal registro l'articolo appena generato lasciandone i corpi
            # sul posto — cioe' avrebbe fabbricato un articolo fantasma invece
            # di perderlo. Sono due semantiche opposte, quindi due liste.
            #
            # Senza questa seconda lista non c'era una terza opzione e il
            # conflitto abortiva: cinque tentativi, poi `exit 1` qui sotto, con
            # l'articolo — LLM, quattro traduzioni DeepL, immagine hero, tutto
            # gia' pagato — perso davvero, non ritardato. Tre occorrenze
            # misurate: #255 sui path FRONTALIERE, #281 e #285 sui gemelli
            # SVIZZERA. Entrambe le famiglie sono qui sotto, e
            # `generator/tests/rebase-onto-remote.test.mjs` deriva l'elenco
            # atteso da `ARTICLE_SECTION_CORE` + `corpusPath()` invece di
            # ricopiarlo: un target di scrittura nuovo che non arriva qui fa
            # rosso il test, che e' esattamente cio' che a #225 non successe.
            bash scripts/lib/rebase-onto-remote.sh "$REMOTE" "$TARGET" \
              data/topic-candidates-evergreen-rejected.json \
              data/blog-images-used.json \
              public/data/journalist-image-catalog.json \
              --merge-registry content/blog-articles-data.ts \
              --merge-registry content/routerBlogData.ts \
              --merge-registry content/blogArticleIds.ts \
              --merge-registry content/blog-meta-it.ts \
              --merge-registry content/blog-meta-en.ts \
              --merge-registry content/blog-meta-de.ts \
              --merge-registry content/blog-meta-fr.ts \
              --merge-registry content/seo/seo-blog-5.ts \
              --merge-registry content/swiss-articles-data.ts \
              --merge-registry content/routerSwissData.ts \
              --merge-registry content/blog-meta-ch-it.ts \
              --merge-registry content/blog-meta-ch-en.ts \
              --merge-registry content/blog-meta-ch-de.ts \
              --merge-registry content/blog-meta-ch-fr.ts \
              --merge-registry content/seo/seo-blog-ch.ts \
              --take-theirs content/blog-body/ \
              --take-theirs content/blog-body-ch/ \
              --take-theirs data/blog-articles/ \
              --take-theirs data/swiss-articles/ \
              --take-theirs public/images/blog/ || true
            sleep $((attempt * 3))
          done
          echo "::error::push failed after 5 attempts — the article is registered locally but not pushed"
          exit 1

      # The summary used to read `steps.generate.outputs.generated`, which was
      # set to `true` on every exit-0 of create-article.mjs — and exiting 0
      # without writing anything is the NORMAL outcome, as the step above says
      # in so many words. Verified on run 31405881104: the log carried "Tutte le
      # keyword evergreen risultano già coperte dal pre-flight", the commit step
      # printed "no article generated this run", and the summary said
      # "Generated: true". It reads `steps.generate.outputs.article` now, the
      # same output the commit title uses, so the two cannot disagree.
      #
      # Dry runs are spelled out rather than left as `false`: the generator is
      # only LOADED there, never invoked, so "no" without the reason invites the
      # same misreading from the other side.
      #
      # GUARD_OUTCOME closes the same bug class one variable later (#279): the
      # Guard step above can reject the article and block the commit while
      # `steps.generate.outputs.article` still reads `true` — the guard runs
      # AFTER generation succeeds, so ARTICLE alone can't tell "generated" from
      # "generated, then rejected". Reading `steps.guard.outcome` (`id: guard`
      # on that step) is what lets this branch distinguish the two.
      - name: Summary
        if: always()
        env:
          DRY: ${{ steps.mode.outputs.dry }}
          CHAIN: ${{ steps.mode.outputs.chain }}
          SECTION_REQUESTED: ${{ steps.mode.outputs.section }}
          SECTION_PRODUCED: ${{ steps.generate.outputs.section }}
          ARTICLE: ${{ steps.generate.outputs.article }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
        run: |
          set -uo pipefail
          if [ "${DRY:-}" = "true" ]; then
            generated='no — dry run, the generator is loaded and never invoked'
          elif [ "${GUARD_OUTCOME:-}" = "failure" ]; then
            generated='no — REJECTED by article-fabrication-guard / prompt-placeholder-guard, nothing committed (see above)'
          elif [ -z "${ARTICLE:-}" ]; then
            generated='unknown — the run never reached the generator'
          elif [ "$ARTICLE" = "true" ]; then
            generated="yes — ${SECTION_PRODUCED:-?}"
          else
            generated='no — no section produced an article'
          fi
          {
            echo "### Generate Blog Article"
            echo "- Section requested: ${SECTION_REQUESTED:-n/a}"
            echo "- Chain link: ${CHAIN:-n/a}"
            echo "- Dry run: ${DRY:-n/a}"
            echo "- Generated: $generated"
            echo "- Target ref: ${{ github.ref_name }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── L'ANELLO CHE MANCAVA (2026-08-18) ───────────────────────────────────
      #
      # IL BUCO, misurato: su 399 run in 50,2 ore il tempo davvero morto — nessuna
      # generazione vera attiva — e' 6,8h, il 14% della finestra. Non e' il cron
      # che manca gli slot: e' che un anello che non produce non pusha niente
      # sotto `content/**`, quindi non ha successore e la catena aspetta il
      # prossimo slot. Le run fallite ne occupano altre 15,7h (31%), che e' un
      # problema diverso e non si chiude qui.
      #
      # PERCHE' SOLO IL CASO «NIENTE ARTICOLO, MA DICHIARATO». Il caso «ha
      # prodotto» ha gia' il suo successore, il push su `content/**`, e funziona:
      # 48 arrivi `push` su 51 hanno eseguito la generazione (le ultime 100 run,
      # 2026-08-18). Aggiungere un dispatch li' significherebbe due successori
      # per lo stesso anello, che arrivano a pochi secondi l'uno dall'altro e di
      # cui `admit` ne scarta uno: si raddoppiano gli arrivi al gate che esiste
      # per ridurli, e si tira a sorte quale sopravvive.
      #
      # PERCHE' NON PUO' GIRARE A VUOTO. La catena richiede una DICHIARAZIONE:
      # ogni tentativo deve essere uscito 4 (le sei ragioni legittime). Un kill
      # duro, un kill per stallo, un exit 3, un'uscita muta, un guasto prima
      # ancora del generatore — tutti lasciano `declared` diverso da `true`, e
      # tutti fermano la catena. E' l'inverso esatto della forma che il dispatch
      # incondizionato del sito aveva: li' un generatore che falliva presto
      # girava alla velocita' con cui usciva, qui e' l'unico caso che non chaina.
      #
      # IL KILL SWITCH E' A DUE STRATI, e il primo e' un FILE nel repo — non e'
      # gusto, e' il precedente gia' pagato in questo repo: fast-publish-article.yml
      # documenta che l'API delle variabili Actions e' rifiutata dal proxy di
      # questo ambiente («Access to this GitHub Actions path is not permitted
      # through this proxy»), quindi un interruttore che vive SOLO in
      # `vars.` non e' azionabile da una sessione — ed e' esattamente cosi' che
      # quella pipeline e' rimasta ferma. Un file e' invece impostabile da qui,
      # si vede in un diff e si revoca con un revert. La variabile resta come
      # secondo strato per chi ha admin (che `valerielinc-ops` NON ha su questo
      # repo: serve `bin/gh-nanako variable set CHAIN_ARMED false`).
      # `vars.CHAIN_ARMED` non impostata = armato, come `FAST_PUBLISH_ARMED`.
      #
      # NIENTE Remote Config per il kill switch: `load-rc-env.mjs` esce 0 anche
      # quando non carica niente (e' voluto: non deve mai rompere un workflow),
      # quindi un interruttore letto da li' fallirebbe APERTO proprio quando
      # l'auth si rompe, cioe' quando spegnerlo serve di piu'.
      #
      # I PAT: `GITHUB_PAT_NANAKO` come primario (nanako e' admin qui),
      # `GITHUB_PAT` come fallback. Rimisurato il 2026-08-18 con la sonda contro
      # un ref inesistente: ENTRAMBI rispondono 422 «No ref found», cioe' sono
      # autorizzati a dispatchare — vedi la correzione nell'intestazione. Sono
      # gia' in `process.env` dopo lo step «Load secrets from Remote Config».
      #
      # Le soglie sono overridabili via env perche' generate-article-chain.test.mjs
      # esegue questo blocco davvero; nulla le imposta in CI.
      - name: Chain — dispatch the next link
        if: always()
        env:
          REPO: ${{ github.repository }}
          SELF_ID: ${{ github.run_id }}
          DRY: ${{ steps.mode.outputs.dry }}
          ARTICLE: ${{ steps.generate.outputs.article }}
          DECLARED: ${{ steps.generate.outputs.declared }}
          ROSTER_BLOCKED: ${{ steps.generate.outputs.roster_blocked }}
          SECTION_PRODUCED: ${{ steps.generate.outputs.section }}
          SECTION_REQUESTED: ${{ steps.mode.outputs.section }}
          CHAIN_DEPTH: ${{ inputs.chain_depth }}
          NO_ARTICLE_STREAK: ${{ inputs.no_article_streak }}
          CHAIN_ARMED: ${{ vars.CHAIN_ARMED }}
        run: |
          # Questo step NON puo' fallire la run: la classificazione dell'esito e'
          # gia' avvenuta nello step «Generate the article», e un errore nel
          # dispatch del successore non e' un difetto dell'articolo appena
          # prodotto (o non prodotto).
          set +e
          set -uo pipefail

          max_depth="${CHAIN_MAX_DEPTH:-40}"
          max_streak="${CHAIN_MAX_STREAK:-6}"
          delay_s="${CHAIN_DELAY_S:-90}"

          stop() {
            echo "catena ferma: $1"
            exit 0
          }

          num() {
            case "${1:-}" in
              ''|*[!0-9]*) printf '0' ;;
              *) printf '%s' "$1" ;;
            esac
          }
          depth=$(num "${CHAIN_DEPTH:-0}")
          streak=$(num "${NO_ARTICLE_STREAK:-0}")

          [ "${DRY:-}" = "true" ] && stop "self-test dry, non e' un anello"
          [ -f .github/CHAIN_DISABLED ] && stop ".github/CHAIN_DISABLED presente (kill switch in-repo)"
          [ "${CHAIN_ARMED:-}" = "false" ] && stop "vars.CHAIN_ARMED=false (kill switch)"

          # L'ordine dei tre test sotto e' l'ordine dell'argomento, e non e'
          # intercambiabile: prima «c'e' un articolo?» (allora il successore
          # esiste gia'), poi «c'e' una dichiarazione?» (senza, non si chaina
          # mai), poi «il roster ha servito?».
          [ "${ARTICLE:-}" = "true" ] && stop "articolo prodotto — il successore lo fa gia' il push su content/**"
          [ "${DECLARED:-}" = "true" ] || stop "esito NON dichiarato (kill duro, stallo, exit 3, uscita muta o guasto prima del generatore): e' il caso che non deve mai chainare"
          [ "${ROSTER_BLOCKED:-}" = "true" ] && stop "roster esaurito: il prossimo tentativo troverebbe lo stesso muro, non una finestra nuova"

          next_depth=$(( depth + 1 ))
          next_streak=$(( streak + 1 ))
          [ "$next_streak" -ge "$max_streak" ] && stop "$next_streak anelli secchi di fila (cap $max_streak) — si cede al cron"
          [ "$next_depth" -ge "$max_depth" ] && stop "profondita' $next_depth (cap $max_depth) — si cede al cron"

          # La sezione alterna, come ogni anello. `section` in uscita dallo step
          # di generazione e' la sezione che ha SCRITTO; senza articolo e' quella
          # richiesta, ed e' comunque quella su cui alternare.
          base="${SECTION_PRODUCED:-}"
          [ -n "$base" ] || base="${SECTION_REQUESTED:-frontaliere}"
          if [ "$base" = "svizzera" ]; then next_section=frontaliere; else next_section=svizzera; fi

          token="${GITHUB_PAT_NANAKO:-}"
          token_name=GITHUB_PAT_NANAKO
          if [ -z "$token" ]; then
            token="${GITHUB_PAT:-}"
            token_name=GITHUB_PAT
          fi
          [ -n "$token" ] || stop "nessun PAT in ambiente (Remote Config non caricato?)"

          # Le graffe non sono stile: `$depth→` fa entrare i byte della freccia
          # nel nome della variabile, e bash muore con «unbound variable» sotto
          # `set -u`. Lo ha trovato il test che esegue questo blocco.
          echo "anello: depth ${depth}→${next_depth}, streak ${streak}→${next_streak}, sezione ${base}→${next_section}, fra ${delay_s}s"
          [ "$delay_s" -gt 0 ] && sleep "$delay_s"

          payload=$(printf '{"ref":"main","inputs":{"section":"%s","chain_depth":"%s","no_article_streak":"%s","parent_run_id":"%s"}}' \
            "$next_section" "$next_depth" "$next_streak" "${SELF_ID:-}")

          dispatch() {
            curl -sS -o /tmp/chain-dispatch.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $1" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/workflows/generate-article.yml/dispatches" \
              -d "$payload" 2>/dev/null
          }

          code=$(dispatch "$token")
          if [ "$code" != "204" ] && [ "$token_name" = "GITHUB_PAT_NANAKO" ] && [ -n "${GITHUB_PAT:-}" ]; then
            echo "::warning::dispatch con GITHUB_PAT_NANAKO → HTTP $code, riprovo con GITHUB_PAT"
            token_name=GITHUB_PAT
            code=$(dispatch "${GITHUB_PAT}")
          fi

          if [ "$code" = "204" ]; then
            echo "anello dispatchato con $token_name: sezione $next_section, depth $next_depth, streak $next_streak"
            exit 0
          fi
          # Rosso NO: un successore mancato costa un giro di cron, e far fallire
          # la run qui renderebbe illeggibile la classificazione dell'esito che
          # lo step di generazione ha appena scritto.
          echo "::warning::dispatch dell'anello fallito (HTTP $code con $token_name): $(head -c 300 /tmp/chain-dispatch.json 2>/dev/null). La catena si ferma, il cron riprende."
          exit 0
