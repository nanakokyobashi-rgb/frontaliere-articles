name: PR 🔴 fixer (bounded loop-closure on bot PRs)

# Quando il reviewer Codex posta un `🔴` su una PR autonoma (bot-authored o
# head `fix/*`), questo workflow auto-applica il fix sullo stesso branch — in
# modo BOUNDED. Il push ri-triggera la review dentro tests.yml (re-review) → se pulito,
# auto-merge; se 🔴 di nuovo, questo workflow ri-parte fino al round cap.
# NON agisce mai su PR scritte da umani.
#
# ANTI-LOOP: un marker nascosto `<!-- REDFLAG_FIX_ROUND: N -->` sulla PR conta i
# round. A N>=2 → label `needs-human` + escalation, STOP senza Codex (frugalità
# quota: non bruciare turni in un loop che non converge).

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to inspect and fix'
        required: true
        type: string

# Un fixer alla volta per PR dentro questo workflow. Il gruppo resta distinto
# da redcheck: con `cancel-in-progress: false` GitHub conserva una sola pending e
# una coda condivisa potrebbe sfrattare silenziosamente proprio la run redflag.
# Il preflight aspetta la coda redcheck prima di fare checkout o modificare body,
# mentre il preflight redcheck scarta un rosso quando redflag e' gia' attivo.
concurrency:
  group: redflag-fix-pr-${{ inputs.pr || github.event.pull_request.number || 'unknown' }}
  cancel-in-progress: false

# Il lato YAML non può importare `REVIEWER_BOT_LOGIN_JQ` da constants.mjs. Questo
# filtro è quindi la singola copia eseguibile del predicato jq condiviso dentro
# questo workflow; i due consumer lo applicano come primo stadio, e il test
# `reviewer-bot-login.test.mjs` ne verifica il legame con la regex JS.
env:
  REVIEWER_BOT_REVIEW_FILTER: |
    select(.user.type == "Bot")
    | select(
        ((.user.login // "") | test("^(claude|frontaliere-automation)";"i"))
        or (((.user.login // "") | test("^github-actions\\[bot\\]$";"i"))
            and ((.body // "") | contains("<!-- CODEX_FALLBACK_REVIEW -->")))
      )

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  # Preflight (no checkout, solo gh): porta i gate evento + verifica che la PR
  # sia ancora AZIONABILE. Race benigna — tra il `review submitted` che triggera
  # e il checkout del job di fix, la PR può essere stata mergiata/chiusa e il suo
  # branch auto-cancellato (delete_branch_on_merge) → il `Checkout ref: head.ref`
  # fallirebbe secco ("branch could not be found"), run ROSSO su una PR già
  # risolta (osservato 2026-06-14 run 27509046723, fix/crawler-source-rewrites
  # già merged). Stessa classe della race auto-merge (#1953): un workflow su una
  # PR già risolta esce PULITO, non fallisce. actionable=false → redflag-fix
  # skippato (verde no-op, nessun round consumato).
  preflight:
    # NB il `if:` usa `contains(..., '🔴')` BROAD (non `'🔴 Important'`): la stringa
    # esatta `🔴 Important` è FRAGILE al markdown del reviewer. Osservato su PR #2211:
    # round-1 "🔴 Important: ..." (match) → round-2 "🔴 **Important —** ..." (bold →
    # `contains('🔴 Important')` FALSO → redflag-fix SKIPPATO → 🔴 round-2 mai
    # indirizzato, PR bloccata, niente auto-merge). Questo `if:` resta un pre-filter
    # ECONOMICO e volutamente ampio (solo "contiene un 🔴 qualsiasi"). Il match
    # PRECISO (è davvero un finding Important, non un 🔴 decorativo o prosa che lo
    # nega) lo fa il preflight sotto, con una regex tollerante al bold/spaziatura MA
    # che richiede un delimitatore dopo "Important" — impossibile in un'espressione
    # `if:` YAML.
    # NB: lo scope-check "PR autonoma" (autore Bot o head `fix/*`) NON vive più
    # in questo `if:` — vedi lo step sotto. Un `if:` di job che fallisce lascia il
    # job intero SKIPPED senza eseguire una riga di script: per una PR umana con
    # un vero 🔴 Important quel salto era invisibile ovunque (issue #5534, PR
    # #5515 — check-run "skipped", zero commenti, zero label). Qui restano solo i
    # pre-filtri economici che non richiedono distinguere lo scope.
    # Reviewer set = `claude*` + `frontaliere-automation*`, plus the explicitly
    # marked Codex fallback emitted by `github-actions[bot]` (prefisso: la
    # stessa App si presenta senza il suffisso `[bot]` in GraphQL). A job-level
    # `startsWith(..., 'claude')` alone skipped App-bot 🔴 on the site
    # (PRs #7610/#7609); this workflow is `adapted`, so the same login
    # hole is closed here, not by waiting for an identical twin. Lo STESSO set
    # vale per i consumer della review — bundle sotto, `auto-merge-eval.mjs`,
    # `review-gate.mjs`, `pr-autorebase.mjs`, `stale-pr-rescuer.yml` — via
    # `REVIEWER_BOT_LOGIN_RE`/`_JQ` in `scripts/ci/lib/constants.mjs`, e per i
    # due `--jq` di `tests.yml` (skip-guard `## LGTM` e base incrementale).
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.review.user.type == 'Bot' &&
        (
          startsWith(github.event.review.user.login, 'claude') ||
          startsWith(github.event.review.user.login, 'frontaliere-automation') ||
          (github.event.review.user.login == 'github-actions[bot]' &&
           contains(github.event.review.body, '<!-- CODEX_FALLBACK_REVIEW -->'))
        ) &&
        contains(github.event.review.body, '🔴') &&
        github.event.pull_request.draft == false
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      actionable: ${{ steps.pre.outputs.actionable }}
      pr_number: ${{ steps.normalize.outputs.pr_number }}
      pr_url: ${{ steps.normalize.outputs.pr_url }}
      pr_title: ${{ steps.normalize.outputs.pr_title }}
      base_ref: ${{ steps.normalize.outputs.base_ref }}
      head_ref: ${{ steps.normalize.outputs.head_ref }}
      head_sha: ${{ steps.normalize.outputs.head_sha }}
      is_draft: ${{ steps.normalize.outputs.is_draft }}
      pr_author_type: ${{ steps.normalize.outputs.pr_author_type }}
      review_body_b64: ${{ steps.normalize.outputs.review_body_b64 }}
      review_commit_id: ${{ steps.normalize.outputs.review_commit_id }}
      review_user_type: ${{ steps.normalize.outputs.review_user_type }}
      review_user_login: ${{ steps.normalize.outputs.review_user_login }}
    steps:
      - name: Normalize trigger context
        id: normalize
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PR: ${{ inputs.pr }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Legacy env name retained as the automatic-event input to the
          # normalizer; the preflight consumes the normalized output below.
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          EVENT_REVIEW_BODY: ${{ github.event.review.body }}
          EVENT_REVIEW_COMMIT_ID: ${{ github.event.review.commit_id }}
          EVENT_REVIEW_USER_TYPE: ${{ github.event.review.user.type }}
          EVENT_REVIEW_USER_LOGIN: ${{ github.event.review.user.login }}
        run: |
          set -euo pipefail

          context_fail() {
            echo "::error::$1"
            exit 1
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_NUMBER="${DISPATCH_PR:-}"
          else
            PR_NUMBER="${EVENT_PR_NUMBER:-}"
          fi
          if ! printf '%s' "$PR_NUMBER" | grep -qE '^[1-9][0-9]*$'; then
            context_fail "Numero PR mancante o malformato: il redflag fixer resta fail-closed."
          fi

          if ! PR_JSON=$(gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json number,headRefName,headRefOid,isDraft,author,url,baseRefName,title,state \
            2>/dev/null); then
            context_fail "Metadata PR #$PR_NUMBER illeggibile: il redflag fixer resta fail-closed."
          fi
          if ! printf '%s' "$PR_JSON" | jq -e '
            type == "object"
            and (.number | type == "number")
            and (.headRefName | type == "string" and length > 0)
            and (.headRefOid | type == "string" and test("^[a-f0-9]{40}$"; "i"))
            and (.isDraft | type == "boolean")
            and (.author | type == "object" and (.is_bot | type == "boolean"))
            and (.url | type == "string" and length > 0)
            and (.baseRefName | type == "string" and length > 0)
            and (.title | type == "string")
            and (.state | type == "string")
          ' >/dev/null 2>&1; then
            context_fail "Metadata PR #$PR_NUMBER malformata: il redflag fixer resta fail-closed."
          fi

          PR_URL=$(printf '%s' "$PR_JSON" | jq -r '.url')
          PR_TITLE=$(printf '%s' "$PR_JSON" | jq -r '.title')
          BASE_REF=$(printf '%s' "$PR_JSON" | jq -r '.baseRefName')
          IS_DRAFT=$(printf '%s' "$PR_JSON" | jq -r '.isDraft')
          PR_AUTHOR_TYPE_FROM_API=$(printf '%s' "$PR_JSON" | jq -r 'if .author.is_bot then "Bot" else "User" end')

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            HEAD_REF=$(printf '%s' "$PR_JSON" | jq -r '.headRefName')
            HEAD_SHA=$(printf '%s' "$PR_JSON" | jq -r '.headRefOid')

            if ! REVIEWS_JSON=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100" \
              --slurp 2>/dev/null); then
              context_fail "Reviews della PR #$PR_NUMBER illeggibili: il redflag fixer resta fail-closed."
            fi
            if ! printf '%s' "$REVIEWS_JSON" | jq -e 'type == "array" and all(.[]; type == "array")' >/dev/null 2>&1; then
              context_fail "Risposta reviews della PR #$PR_NUMBER malformata: il redflag fixer resta fail-closed."
            fi
            REVIEW_JSON=$(printf '%s' "$REVIEWS_JSON" \
              | jq -c 'flatten[]?' \
              | jq -c "$REVIEWER_BOT_REVIEW_FILTER" \
              | jq -c --arg head_sha "$HEAD_SHA" \
                  'select(((.commit_id // "") | ascii_downcase) == ($head_sha | ascii_downcase))' \
              | jq -cs '[.[] | {
                  id: (.id // 0),
                  body: (.body // ""),
                  commit_id: (.commit_id // ""),
                  user_type: (.user.type // ""),
                  user_login: (.user.login // "")
                }] | sort_by(.id) | last // empty')
            if [ -n "$REVIEW_JSON" ]; then
              REVIEW_BODY=$(printf '%s' "$REVIEW_JSON" | jq -r '.body')
              REVIEW_COMMIT_ID=$(printf '%s' "$REVIEW_JSON" | jq -r '.commit_id')
              REVIEW_USER_TYPE=$(printf '%s' "$REVIEW_JSON" | jq -r '.user_type')
              REVIEW_USER_LOGIN=$(printf '%s' "$REVIEW_JSON" | jq -r '.user_login')
            else
              echo "::warning::Nessuna review qualificante trovata sulla PR #$PR_NUMBER: nessun fix automatico ammesso."
              REVIEW_BODY=""
              REVIEW_COMMIT_ID=""
              REVIEW_USER_TYPE=""
              REVIEW_USER_LOGIN=""
            fi
            PR_AUTHOR_TYPE="$PR_AUTHOR_TYPE_FROM_API"
          else
            HEAD_REF="${EVENT_HEAD_REF:-}"
            HEAD_SHA="${EVENT_HEAD_SHA:-}"
            PR_AUTHOR_TYPE="${PR_AUTHOR_TYPE:-$PR_AUTHOR_TYPE_FROM_API}"
            REVIEW_BODY="${EVENT_REVIEW_BODY:-}"
            REVIEW_COMMIT_ID="${EVENT_REVIEW_COMMIT_ID:-}"
            REVIEW_USER_TYPE="${EVENT_REVIEW_USER_TYPE:-}"
            REVIEW_USER_LOGIN="${EVENT_REVIEW_USER_LOGIN:-}"
          fi

          if ! printf '%s' "$HEAD_REF" | grep -qE '^.{1,255}$'; then
            context_fail "Head ref PR #$PR_NUMBER mancante o malformata: il redflag fixer resta fail-closed."
          fi
          if ! printf '%s' "$HEAD_SHA" | grep -qE '^[a-f0-9]{40}$'; then
            context_fail "Head SHA PR #$PR_NUMBER mancante o malformata: il redflag fixer resta fail-closed."
          fi
          case "$PR_AUTHOR_TYPE" in
            Bot|User) ;;
            *) context_fail "Tipo autore PR #$PR_NUMBER inatteso: il redflag fixer resta fail-closed." ;;
          esac

          REVIEW_BODY_B64=$(printf '%s' "$REVIEW_BODY" | base64 -w0)
          {
            echo "pr_number=$PR_NUMBER"
            echo "pr_url=$PR_URL"
            echo "pr_title=$PR_TITLE"
            echo "base_ref=$BASE_REF"
            echo "head_ref=$HEAD_REF"
            echo "head_sha=$HEAD_SHA"
            echo "is_draft=$IS_DRAFT"
            echo "pr_author_type=$PR_AUTHOR_TYPE"
            echo "review_body_b64=$REVIEW_BODY_B64"
            echo "review_commit_id=$REVIEW_COMMIT_ID"
            echo "review_user_type=$REVIEW_USER_TYPE"
            echo "review_user_login=$REVIEW_USER_LOGIN"
          } >> "$GITHUB_OUTPUT"

      - name: PR still actionable?
        id: pre
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ steps.normalize.outputs.pr_number }}
          HEAD_REF: ${{ steps.normalize.outputs.head_ref }}
          HEAD_SHA: ${{ steps.normalize.outputs.head_sha }}
          REVIEW_BODY_B64: ${{ steps.normalize.outputs.review_body_b64 }}
          REVIEW_COMMIT_ID: ${{ steps.normalize.outputs.review_commit_id }}
          REVIEW_USER_TYPE: ${{ steps.normalize.outputs.review_user_type }}
          REVIEW_USER_LOGIN: ${{ steps.normalize.outputs.review_user_login }}
          IS_DRAFT: ${{ steps.normalize.outputs.is_draft }}
          PR_AUTHOR_TYPE: ${{ steps.normalize.outputs.pr_author_type }}
        run: |
          set -uo pipefail
          if ! REVIEW_BODY=$(printf '%s' "$REVIEW_BODY_B64" | base64 --decode 2>/dev/null); then
            echo "::error::Review body non decodificabile: il redflag fixer resta fail-closed."
            echo "actionable=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$REVIEW_USER_TYPE" != "Bot" ]; then
            echo "Review non proveniente da un reviewer Bot qualificante → skip 🔴-fix."
            echo "actionable=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          case "$REVIEW_USER_LOGIN" in
            claude*|frontaliere-automation*) ;;
            'github-actions[bot]')
              case "$REVIEW_BODY" in
                *'<!-- CODEX_FALLBACK_REVIEW -->'*) ;;
                *) echo "Review github-actions[bot] senza marker CODEX_FALLBACK_REVIEW → skip 🔴-fix."; echo "actionable=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
              esac
              ;;
            *) echo "Review Bot non nella allowlist del fixer → skip 🔴-fix."; echo "actionable=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if [ "$IS_DRAFT" != "false" ]; then
            echo "PR #$PR_NUMBER ancora draft → skip 🔴-fix."
            echo "actionable=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$REVIEW_COMMIT_ID" != "$HEAD_SHA" ]; then
            echo "Nessuna review qualificante sulla HEAD corrente della PR #$PR_NUMBER → skip 🔴-fix."
            echo "actionable=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Marker 🔴-Important tollerante al markdown: il reviewer a volte bolda
          # ("🔴 **Important —**") o varia la spaziatura. Richiede un delimitatore
          # (`:`, `—`, `-`) subito dopo "Important" (+ bold di chiusura opzionale) —
          # senza, la stessa regex matchava anche la prosa di negazione del
          # reviewer ("zero 🔴 Important findings", PR #3330): "Important" lì è un
          # aggettivo che dice che non ce ne sono, non il marker. Un 🔴 NON seguito
          # da "Important<delimitatore>" (decorativo o prosa, es. "nessun 🔴") →
          # no-op, niente round speso. Stessa regex in scripts/ci/lib/constants.mjs
          # (REDFLAG_IMPORTANT_RE) — YAML `if:` non può importarla, tenerle allineate.
          # il lead a due rami e i due lookbehind chiudono la terza variante della classe
          # sulla POSIZIONE invece che sul vocabolario (misurata sulla PR #909): un
          # 🔴 Important CITATO — dentro «» o dentro un code span APERTO — non e' il
          # marker di quella riga, e portava i due punti come quello vero. Ma un marker
          # vero non sparisce ne' per una label incollata (`` `a.mjs:L1`🔴 ``) ne' per un
          # secondo finding sulla stessa riga (#977): entrambi restano rossi. grep e' gia'
          # orientato alla riga, quindi il pattern e' REDFLAG_IMPORTANT_RE.source senza i
          # `\n` delle classi negate; il guard `mirror bash` di
          # generator/tests/redflag-important-marker.test.mjs lo pretende verbatim.
          # shellcheck disable=SC2016 # the single-quoted PCRE is intentional
          if ! printf '%s' "$REVIEW_BODY" | LC_ALL=C.UTF-8 grep -qP '^(?:(?=(?:[^`]*`[^`]*`)*[^`]*`[^`]*$)(?:[^🟡🟢❓]*|(?:[^«]|«[^»]*»)*[🟡🟢❓](?:[^«]|«[^»]*»)*)|(?:[^🟡🟢❓]*|(?:[^`«]|`[^`]*`|«[^»]*»|`(?![^`]*`))*[🟡🟢❓](?:[^`«]|`[^`]*`|«[^»]*»|`(?![^`]*`))*)(?<!\s`)(?<!^`))🔴\s*\*{0,2}\s*Important\s*\*{0,2}\s*[:—-]'; then
            echo "Review contiene 🔴 ma nessun finding '🔴 Important' (decorativo) → skip 🔴-fix (no-op)."
            echo "actionable=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          case "$REVIEW_BODY" in
            *'## Findings ('*) ;;
            *)
              echo "Review con 🔴 ma senza l'intestazione \\`## Findings (\\` → non è un verdetto del reviewer, skip 🔴-fix."
              echo "actionable=false" >> "$GITHUB_OUTPUT"; exit 0
              ;;
          esac
          state=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state --jq '.state' 2>/dev/null || echo UNKNOWN)
          if [ "$state" != "OPEN" ]; then
            echo "PR #$PR_NUMBER non più OPEN (state=$state) → già risolta, skip 🔴-fix (no-op)."
            echo "actionable=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! gh api "repos/$REPO/branches/$HEAD_REF" --jq '.name' >/dev/null 2>&1; then
            echo "Branch '$HEAD_REF' sparito (PR risolta + delete_branch_on_merge) → skip 🔴-fix (no-op)."
            echo "actionable=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Scope: il 🔴-fixer agisce sulle PR autonome. Il branch storico
          # `fix/*` resta sufficiente; per le PR owner-authored del nuovo loop la
          # prova esplicita è `agent:autofix`. Senza quel label una PR umana resta
          # fuori scope, anche se l'autore è l'owner del repo.
          PR_AUTOFIX=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels \
            --jq 'if any(.labels[]?.name; . == "agent:autofix") then "true" else "false" end' \
            2>/dev/null || echo false)
          if [ "$PR_AUTHOR_TYPE" != "Bot" ] && ! printf '%s' "$HEAD_REF" | grep -q '^fix/' && [ "$PR_AUTOFIX" != "true" ]; then
            echo "PR con autore non Bot, branch non 'fix/*' e senza agent:autofix → fuori scope autonomo (per design) → skip 🔴-fix."
            already=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" --paginate \
              --jq '[.[] | .body] | join("\\n")' 2>/dev/null || echo "")
            if ! printf '%s' "$already" | grep -q 'REDFLAG_OUT_OF_SCOPE'; then
              if ! gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(printf '<!-- REDFLAG_OUT_OF_SCOPE -->\nℹ️ 🔴-fixer: la review più recente contiene un finding \x60🔴 Important\x60, ma questa PR è fuori dallo scope autonomo (autore non Bot, branch non \x60fix/*\x60 e senza \x60agent:autofix\x60) — nessun fix automatico verrà tentato (per design). Se il finding resta aperto senza un commit nuovo, serve intervento manuale.')" \
                2>/dev/null; then
                echo "::warning::REDFLAG_OUT_OF_SCOPE non è stato pubblicato: il fixer resta fuori scope per design, ma il verdetto remoto non è osservabile."
              fi
            fi
            echo "actionable=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Cross-workflow mutex: i gruppi `concurrency` sono distinti per non
          # sfrattare una pending redflag, quindi la serializzazione del push si
          # completa qui. La run resta in attesa, invece di perdere l'evento di
          # review, finche' il fixer redcheck dello stesso branch termina.
          while :; do
            if ! busy=$(gh run list --repo "$REPO" --workflow=pr-redcheck-fixer.yml --branch "$HEAD_REF" \
              --json status --jq '[.[] | select(.status=="in_progress" or .status=="queued")] | length' 2>/dev/null); then
              echo "::warning::Impossibile leggere la coda redcheck per '$HEAD_REF' → ritento prima di modificare la PR."
              busy=1
            fi
            if [ "${busy:-0}" -eq 0 ]; then break; fi
            echo "Redcheck attivo su '$HEAD_REF' → attendo prima del checkout redflag (run in coda: $busy)."
            sleep 10
          done
          echo "actionable=true" >> "$GITHUB_OUTPUT"

  # Lo scope viene valutato dopo il checkout, usando la stessa classificazione
  # del review-gate. Se tutti i finding Important sono fuori dal diff, la review
  # ha già coniato una sola issue follow-up e il fixer non deve correggere la PR.
  # Errori di classificazione sono conservativi: il job di fix resta azionabile.
  scope:
    needs: preflight
    if: needs.preflight.outputs.actionable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      blocking: ${{ steps.classify.outputs.blocking }}
      error: ${{ steps.classify.outputs.error }}
    steps:
      - name: Checkout dello script di classificazione
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # Il branch della PR può non contenere ancora il classificatore: il
          # gate è codice del repository base, non materiale da riparare.
          ref: ${{ needs.preflight.outputs.base_ref }}

      - name: Classifica finding fuori diff e conia follow-up
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
          PR_URL: ${{ needs.preflight.outputs.pr_url }}
          REVIEW_BODY_B64: ${{ needs.preflight.outputs.review_body_b64 }}
        run: |
          set -uo pipefail
          if ! REVIEW_BODY=$(printf '%s' "$REVIEW_BODY_B64" | base64 --decode 2>/dev/null); then
            echo "::error::Review body non decodificabile: il fixer resta conservativamente azionabile."
            REVIEW_BODY=""
          fi
          export REVIEW_BODY
          set +e
          output=$(node scripts/ci/review-scope.mjs 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            echo "::warning::review-scope non verificabile: il fixer resta conservativamente azionabile."
            echo "blocking=true" >> "$GITHUB_OUTPUT"
            echo "error=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          summary=$(printf '%s\n' "$output" | tail -n 1)
          blocking=$(printf '%s' "$summary" | jq -r '.blocking' 2>/dev/null || echo true)
          if [ "$blocking" != "true" ] && [ "$blocking" != "false" ]; then
            echo "::warning::output review-scope inatteso: il fixer resta conservativamente azionabile."
            blocking=true
            echo "error=true" >> "$GITHUB_OUTPUT"
          else
            echo "error=false" >> "$GITHUB_OUTPUT"
          fi
          echo "blocking=$blocking" >> "$GITHUB_OUTPUT"

  redflag-fix:
    needs: [preflight, scope]
    if: >-
      needs.preflight.outputs.actionable == 'true' &&
      (needs.scope.outputs.blocking == 'true' || needs.scope.outputs.error == 'true')
    runs-on: ubuntu-latest
    # 30→40 (2026-07-17): headroom per il cap turni alzato 45→60.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.head_ref }}
          # Checkout 769-1379s su 3 run: il massimo è il 57% di un cap da 40min,
          # e il lavoro qui è un run Claude (costoso da buttare). Blobless partial
          # clone come issue-fix #4189, che è l'altro job Claude-driven con la
          # stessa forma. Sicuro: il fixer legge/scrive file dell'head e fa
          # `git merge origin/main` — servono i blob dei file toccati, non la
          # storia dei blob.
          filter: blob:none
        # Tetto sullo step → `failure` diagnosticabile invece di `cancelled`.
        timeout-minutes: 15

      # Profilassi workflow-validation drift (anti-401): la GitHub App del reviewer
      # esige che `.github/workflows/tests.yml` sul branch sia BYTE-IDENTICO
      # a `main`. Se `main` ha aggiornato un workflow di review DOPO il branch, la
      # re-review (ri-triggerata dal push del fix sotto) fallirebbe `401 Workflow
      # validation failed`, review vuota, niente `## LGTM`, niente auto-merge — e il
      # 🔴-fix risulterebbe RED senza colpa propria (osservato 2× nel campione 7gg).
      # Allineare i workflow PRIMA: `merge origin/main` no-op se già fresh; il merge
      # viaggia poi sul push del fix dell'agent. Su conflitto → abort + warning
      # (nessuna regressione: il branch resta com'era, comportamento pre-fix).
      - name: Align review workflows (merge origin/main, anti-401 drift)
        run: |
          set -uo pipefail
          git config user.name "Valerie Linc"
          git config user.email "valerielinc@gmail.com"
          git fetch origin main -q || true
          if git merge --no-edit origin/main; then
            echo "✓ branch allineato a origin/main (workflow-validation drift evitato)."
          else
            echo "::warning::merge origin/main in conflitto → abort, branch invariato (no regressione; eventuale 401 drift resta possibile su questo branch)."
            git merge --abort || true
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm


      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ Nessuna Firebase SA — GITHUB_PAT non caricato; il push del fix userà GITHUB_TOKEN (non ri-triggera la re-review automatica)."
          fi

      - name: Load secrets from Remote Config (GITHUB_PAT)
        continue-on-error: true
        run: node generator/scripts/load-rc-env.mjs

      # Primary identity for the fix push below = GitHub App installation token
      # (`frontaliere-automation[bot]`): auto-mints, no expiry babysit, and its
      # push re-triggers the review inside tests.yml just like the PAT (no GITHUB_TOKEN
      # anti-recursion). Falls back to env.GITHUB_PAT (#2861/#2899).
      - name: Mint App token (primary identity, PAT fallback)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      # Token-down = degrado silenzioso a catena del loop autonomo (merge senza
      # cascade, coda congelata, routing/re-queue inerti). Alert inline
      # deterministico, dedup sul titolo canonico del monitor daily
      # (gh-pat-expiry-monitor.yml) che resta l'owner dell'auto-close.
      # GH_TOKEN = GITHUB_TOKEN, NON l'App/PAT (e' la cosa rotta). Scatta solo se
      # NESSUN token usabile (né App né PAT).
      - name: Alert token-down (dedup, zero-Claude)
        if: env.GITHUB_PAT_NANAKO == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/ci/alert-pat-down.mjs --workflow "${{ github.workflow }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Acquire shared Codex lane quota lease (redflag residual)
        id: quota_lease
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          QUOTA_LEASE_ACTION: acquire
          QUOTA_LEASE_ROLE: redflag
          QUOTA_LEASE_OWNER: redflag-fixer
          QUOTA_LEASE_TARGET_TYPE: pr
          QUOTA_LEASE_TARGET: ${{ needs.preflight.outputs.pr_number }}
          QUOTA_LEASE_TTL_SEC: '3600'
          HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
        run: node scripts/ci/check-quota-backoff.mjs

      - name: Shared Codex lane quota lease unavailable (expected skip)
        if: steps.quota_lease.outputs.lease_allowed != 'true'
        run: |
          if [ "${{ steps.quota_lease.outputs.lease_error }}" = 'true' ]; then
            echo "::error::Lease quota condiviso illeggibile o non verificabile → redflag fixer saltato fail-closed."
            exit 1
          fi
          echo "::warning::Lease quota condiviso negato (${{ steps.quota_lease.outputs.lease_reason }}) → redflag fixer saltato senza consumare quota."

      # ── Round cap + capability guard (deterministico, prima di Claude) ────
      # Conta i marker `<!-- REDFLAG_FIX_ROUND: N -->` già sulla PR. A N>=2 →
      # escalation a needs-human, STOP senza Claude. Altrimenti incrementa.
      # Capability guard: se la PR tocca .github/workflows/** e non c'è nessun token
      # capace, il push verrebbe rifiutato (scope workflows) → skip senza bruciare
      # un turno.
      #
      # HAS_PAT accetta ORA anche APP_TOKEN. Fino al 2026-08-06 era legato al solo
      # GITHUB_PAT, e il commento lo giustificava con "la App installation token NON
      # ha lo scope workflows": era vero, ha smesso di esserlo quando alla App
      # `frontaliere-automation` è stato concesso `workflows: write`. Lasciarlo com'era
      # avrebbe fatto continuare a saltare i fix su .github/workflows/** con la
      # motivazione "serve un PAT abilitato" mentre il push sarebbe passato — cioè la
      # stessa capability sbloccata in un posto e ancora rifiutata nel gemello.
      #
      # Allineato al push step più sotto, che era già token-aware
      # (`env.APP_TOKEN || env.GITHUB_PAT`): erano i due lati della stessa decisione,
      # tenuti in disaccordo.
      - name: Round cap + capability guard + tier
        id: guard
        if: steps.quota_lease.outputs.lease_allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
          REVIEW_BODY_B64: ${{ needs.preflight.outputs.review_body_b64 }}
          HAS_PAT: ${{ env.GITHUB_PAT_NANAKO != '' }}
        run: |
          set -uo pipefail
          if ! REVIEW_BODY=$(printf '%s' "$REVIEW_BODY_B64" | base64 --decode 2>/dev/null); then
            echo "::error::Review body non decodificabile: guard round-cap fail-closed."
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          export REVIEW_BODY
          MAX_ROUNDS=2

          # Il preflight non fa checkout: il fingerprint si calcola qui, dove lo
          # script del repository è disponibile, prima di consumare un round.
          comments=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '[.[] | .body] | join("\n")' 2>/dev/null || echo "")
          INCOMING_FP=$(printf '%s' "$REVIEW_BODY" | node scripts/ci/redflag-findings-fingerprint.mjs 2>/dev/null || echo NULL)
          PRIOR_FP=$(printf '%s' "$comments" | grep -oE 'REDFLAG_FINDINGS_FINGERPRINT: [a-f0-9]{64}' \
            | tail -1 | cut -d' ' -f2 || true)
          if [ -n "$INCOMING_FP" ] && [ "$INCOMING_FP" != "NULL" ] \
             && [ -n "$PRIOR_FP" ] && [ "$INCOMING_FP" = "$PRIOR_FP" ]; then
            echo "Finding 🔴 identici a un round già registrato ($INCOMING_FP) → skip duplicate review, nessun round consumato."
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Round corrente = numero di marker già presenti.
          ROUND=$(printf '%s' "$comments" | grep -oE 'REDFLAG_FIX_ROUND: [0-9]+' \
            | grep -oE '[0-9]+' | sort -rn | head -1 || true)
          ROUND=${ROUND:-0}
          NEXT=$((ROUND + 1))
          echo "Round 🔴-fix correnti: $ROUND (cap $MAX_ROUNDS)"

          if [ "$ROUND" -ge "$MAX_ROUNDS" ]; then
            echo "::warning::Round cap raggiunto ($ROUND >= $MAX_ROUNDS) → escalation needs-human, no Claude."
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "needs-human" 2>/dev/null \
              || echo "label needs-human assente — creala: gh label create needs-human"
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(printf '🛑 **needs-human** (auto): il 🔴-fixer ha già tentato %s round senza chiudere i findings 🔴. STOP automatico (anti-loop, frugalità quota). Serve revisione umana: leggi le review più recenti e applica il fix a mano.' "$ROUND")" \
              2>/dev/null || true
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # File cambiati dalla PR (per tier + capability guard).
          files=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json files --jq '.files[].path' 2>/dev/null || echo "")
          touches_wf=$(echo "$files" | grep -E '^\.github/workflows/' || true)
          if [ -n "$touches_wf" ] && [ "$HAS_PAT" != "true" ]; then
            echo "::warning::PR tocca .github/workflows/** ma manca PAT (scope workflows) → push rifiutato, skip senza bruciare un turno Claude."
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(printf '⏭️ 🔴-fixer skip: la PR tocca \x60.github/workflows/**\x60 e non è disponibile un PAT con scope \x60workflows\x60 → il push fallirebbe. Applicare il fix dei 🔴 a mano.')" \
              2>/dev/null || true
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Tier (mirror della review in tests.yml e di issue-fix): high se la PR
          # tocca CODE funnel-critical (tests/, build-plugins/, scripts/lib/,
          # services/seo*), normal altrimenti. Modello UNIFICATO gpt-5.6-luna
          # su entrambi i tier (Codex Luna Max, effort max); i tier
          # restano distinti solo per telemetria/prompt.
          crit=$(echo "$files" | grep -E '^(tests/|build-plugins/|scripts/lib/|services/seo)' || true)
          if [ -n "$crit" ]; then
            echo "tier=high"   >> "$GITHUB_OUTPUT"
            echo "model=gpt-5.6-luna"   >> "$GITHUB_OUTPUT"
          else
            echo "tier=normal" >> "$GITHUB_OUTPUT"
            echo "model=gpt-5.6-luna" >> "$GITHUB_OUTPUT"
          fi

          # Posta/incrementa il marker round PRIMA di invocare Claude (così se la
          # run muore, il round è comunque contato → l'anti-loop tiene).
          FINDINGS_MARKER=""
          if [ -n "${INCOMING_FP:-}" ] && [ "${INCOMING_FP:-NULL}" != "NULL" ]; then
            FINDINGS_MARKER=$(printf '<!-- REDFLAG_FINDINGS_FINGERPRINT: %s -->\n' "$INCOMING_FP")
          fi
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(printf '<!-- REDFLAG_FIX_ROUND: %s -->\n%s_🔴-fixer round %s/%s avviato (auto)._' "$NEXT" "$FINDINGS_MARKER" "$NEXT" "$MAX_ROUNDS")" \
            2>/dev/null || true
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "round=$NEXT"  >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        if: steps.guard.outputs.proceed == 'true'
        run: |
          git config user.name "Valerie Linc"
          git config user.email "valerielinc@gmail.com"

      # Push via App token (primario) / PAT (fallback) — ri-attiva la review dentro tests.yml
      # = re-review. Senza nessuno dei due il push userebbe GITHUB_TOKEN e la
      # re-review non partirebbe (anti-ricorsione); il fix verrebbe comunque
      # committato. Esposto come remote authenticato.
      - name: Configure push remote (App token / PAT)
        if: steps.guard.outputs.proceed == 'true' && (env.APP_TOKEN != '' || env.GITHUB_PAT_NANAKO != '')
        env:
          PUSH_TOKEN: ${{ env.GITHUB_PAT_NANAKO }}
          REPO: ${{ github.repository }}
        # Stessa classe del bug di pr-autorebase: `actions/checkout` persiste
        # `http.https://github.com/.extraheader = AUTHORIZATION: basic <GITHUB_TOKEN>`,
        # che sovrascrive lo `x-access-token:<token>` del remote set-url → il `git
        # push origin` si autenticherebbe come github-actions[bot] (action_required,
        # no re-review). Azzerare l'extraheader prima del set-url forza l'uso
        # dell'App token/PAT.
        run: |
          git config --unset-all "http.https://github.com/.extraheader" || true
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git"

      # SHA di partenza (post-merge origin/main, pre-Claude): il classify finale lo
      # confronta con la HEAD remota dopo Claude per capire se il round ha davvero
      # pushato un fix → un round che pusha un fix è SUCCESS anche se la run Claude
      # è poi morta `error_max_turns` in cleanup (false-failure: 28% dei fail nel
      # campione 7gg pushavano un commit ma il job restava RED → failure-rate
      # gonfiato nel loop-health-report #1951).
      - name: Record base SHA (pre-Codex)
        id: base
        if: steps.guard.outputs.proceed == 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Contesto della PR + della review, deterministico e BOUNDED, prima di
      # spendere un turno Claude — stesso pattern del gemello sul sito
      # (frontaliere-si-o-no#6679, "Collect PR + review context"). Il prompt
      # sotto rifaceva da sé, a OGNI round, le letture della PR e delle review.
      # Zero-Claude qui, un bundle, una Read.
      - name: Collect PR + review context (zero-Claude)
        id: ctx
        if: steps.guard.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
          HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/redflag"
          mkdir -p "$OUT"

          context_fail() {
            echo "::error::$1"
            echo "context_verified=false" >> "$GITHUB_OUTPUT"
            exit 1
          }

          # `pull_request_review` può essere consegnato dopo un push. Il suo
          # `head.sha` è quindi solo l'input dell'evento, non una prova che la
          # PR remota sia ancora su quella HEAD. Conservare la risposta REST
          # completa come snapshot strict lega metadata, HEAD, body del bundle
          # e digest alla stessa lettura: nessuna seconda chiamata può accoppiare
          # una revisione nuova con un body vecchio.
          if ! gh api "repos/$REPO/pulls/$PR_NUMBER" \
            > "$OUT/pr-response.json" 2>/dev/null; then
            context_fail "Metadata della PR non leggibile: il redflag fixer resta fail-closed senza Claude."
          fi
          if ! jq -e '
            type == "object"
            and has("body")
            and ((.title | type) == "string")
            and ((.head | type) == "object")
            and (if (.head.sha | type) == "string" then
              (.head.sha | test("^[a-f0-9]{40}$"; "i"))
            else false end)
            and ((.head.ref | type) == "string")
            and ((.body == null) or ((.body | type) == "string"))
          ' "$OUT/pr-response.json" >/dev/null 2>&1; then
            context_fail "Metadata della PR malformata: il redflag fixer resta fail-closed senza Claude."
          fi
          if ! jq '{title, body, headRefName: .head.ref}' "$OUT/pr-response.json" \
            > "$OUT/pr.json" 2>/dev/null; then
            context_fail "Metadata della PR non proiettabile: il redflag fixer resta fail-closed senza Claude."
          fi
          if ! current_head_sha=$(jq -r '.head.sha' "$OUT/pr-response.json"); then
            context_fail "HEAD corrente della PR illeggibile: il redflag fixer resta fail-closed senza Claude."
          fi
          if ! printf '%s' "$current_head_sha" | grep -qE '^[a-f0-9]{40}$'; then
            context_fail "HEAD corrente della PR malformata: il redflag fixer resta fail-closed senza Claude."
          fi
          if ! printf '%s\n%s\n' "$current_head_sha" "$HEAD_SHA" | awk 'NR==1 { current=tolower($0); next } { event=tolower($0); exit current != event }'; then
            context_fail "La HEAD della PR è cambiata rispetto all'evento review: il redflag fixer resta fail-closed senza Claude."
          fi
          # Derive the body bytes from the same projected snapshot that enters
          # the bundle. Hashing an independent API response would recreate the
          # TOCTOU pair this collector is meant to close.
          if ! jq -r '.body // ""' "$OUT/pr.json" > "$OUT/body.txt" 2>/dev/null; then
            context_fail "Body della PR illeggibile: il redflag fixer resta fail-closed senza Claude."
          fi
          if ! body_sha=$(sha256sum "$OUT/body.txt" | awk '{print $1}'); then
            context_fail "Hash del body PR non calcolabile: il redflag fixer resta fail-closed senza Claude."
          fi
          if ! printf '%s' "$body_sha" | grep -qE '^[a-f0-9]{64}$'; then
            context_fail "Hash del body PR malformato: il redflag fixer resta fail-closed senza Claude."
          fi
          review_revision="body:$body_sha"
          # REST paginata, non `--json files` (tronca a 100 in silenzio sopra
          # quella soglia — stessa trappola nota sul sito).
          if ! gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' \
            > "$OUT/files.txt" 2>/dev/null; then
            context_fail "Elenco file della PR illeggibile: il redflag fixer resta fail-closed senza Claude."
          fi
          # STESSO set di reviewer del `if:` job-level sopra: la allowlist
          # condivisa `REVIEWER_BOT_LOGIN_JQ` resta la base, mentre il Codex
          # fallback è ammesso solo con login github-actions[bot] e marker
          # strutturale. Con il solo `claude`
          # una review dell'App bot dava un bundle con la sezione findings
          # VUOTA — o, peggio, l'ultima review `claude` PRECEDENTE, cioe' i 🔴
          # di un round gia' chiuso: l'agent non fallisce, fixa il round
          # sbagliato, e il marker di round e' gia' stato postato.
          if ! reviews_json=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate --slurp 2>/dev/null); then
            context_fail "Reviews API illeggibile: il redflag fixer resta fail-closed senza Claude."
          fi
          if ! printf '%s' "$reviews_json" | jq -e 'type == "array" and all(.[]; type == "array")' >/dev/null 2>&1; then
            context_fail "Risposta Reviews API malformata: il redflag fixer resta fail-closed senza Claude."
          fi
          if ! printf '%s' "$reviews_json" \
            | jq -c 'flatten[]?' \
            | jq -c "$REVIEWER_BOT_REVIEW_FILTER" \
            | jq -rs --arg revision "$review_revision" --arg head "$HEAD_SHA" '
            def has_current_revision($expected):
              [((.body // "") | split("\n")[] | rtrimstr("\r")
                | select(test("^<!-- REVIEW_INPUT_REVISION: body:[0-9a-f]{64} -->$"; "i"))
                | capture("^<!-- REVIEW_INPUT_REVISION: (?<revision>body:[0-9a-f]{64}) -->$"; "i").revision
                | ascii_downcase)] | unique as $revisions
              | (($revisions | length) == 1 and $revisions[0] == ($expected | ascii_downcase));
            [.[]
             | select((.commit_id // "" | ascii_downcase) == ($head | ascii_downcase))
             | select(has_current_revision($revision))
             | select((.body // "")|contains("## Findings ("))
            ] | sort_by(.id // 0) | last | .body // empty' \
            > "$OUT/latest-review.md" 2>/dev/null; then
            context_fail "Selezione della review corrente non verificabile: il redflag fixer resta fail-closed senza Claude."
          fi
          if [ ! -s "$OUT/latest-review.md" ]; then
            context_fail "Nessuna review Claude verificabile sulla HEAD e revisione body correnti: il redflag fixer resta fail-closed senza Claude."
          fi

          {
            echo "# Redflag-fix bundle — PR #$PR_NUMBER"
            echo
            echo "## PR metadata (title, body, headRefName)"
            cat "$OUT/pr.json"
            echo
            echo "## Changed file list"
            cat "$OUT/files.txt"
            echo
            echo '## Ultima review Claude (🔴 findings)'
            cat "$OUT/latest-review.md"
          } > "$OUT/redflag-bundle.md"
          {
            echo "review_revision=$review_revision"
            echo "head_sha=$current_head_sha"
            echo "context_verified=true"
          } >> "$GITHUB_OUTPUT"
          echo "Prefetched redflag context in $OUT:"
          ls -la "$OUT"

      - name: Fail closed when review context is unavailable
        if: always() && steps.guard.outputs.proceed == 'true' && steps.ctx.outputs.context_verified != 'true'
        run: |
          echo "::error::Contesto PR/review non verificato: nessun turno Claude ammesso."
          exit 1

      # Il beacon resta telemetria: il lease condiviso sopra decide l'ammissione
      # al turno, mentre questo probe conserva il segnale quota storico e il
      # fallback Codex-primary senza introdurre un secondo veto.
      - name: Pre-flight — Codex lane quota telemetry
        id: quota
        if: steps.guard.outputs.proceed == 'true' && steps.ctx.outputs.context_verified == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          QUOTA_BEACON_PEER_REPO: valerielinc-ops/frontaliere-si-o-no
          CODEX_FALLBACK_MODE: '1'
        run: node scripts/ci/check-quota-backoff.mjs

      # Il body e la HEAD possono cambiare fra la prefetch e l'avvio della
      # action Claude. Rifare il read/hash nell'ultimo step prima di consumare
      # quota Claude evita di applicare un finding a un contesto ormai stantio;
      # il mismatch è un errore fail-closed, non un bundle vuoto.
      - name: Revalidate PR + review context immediately before Codex
        id: precodex
        if: steps.guard.outputs.proceed == 'true' && steps.ctx.outputs.context_verified == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
          EVENT_HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          EXPECTED_HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
          EXPECTED_BODY_REVISION: ${{ steps.ctx.outputs.review_revision }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/redflag"
          context_fail() {
            echo "::error::$1"
            exit 1
          }

          pr_before_claude="$OUT/pr-before-claude.json"
          if ! gh api "repos/$REPO/pulls/$PR_NUMBER" > "$pr_before_claude" 2>/dev/null; then
            context_fail "Contesto PR illeggibile prima di Claude: il redflag fixer resta fail-closed."
          fi
          if ! jq -e 'type == "object" and (.head | type == "object") and (.head.sha | type == "string") and (.body == null or (.body | type == "string")) and has("body")' "$pr_before_claude" >/dev/null 2>&1; then
            context_fail "Contesto PR malformato prima di Claude: il redflag fixer resta fail-closed."
          fi
          current_head_sha=$(jq -r '.head.sha' "$pr_before_claude")
          if ! printf '%s' "$current_head_sha" | grep -qE '^[a-f0-9]{40}$'; then
            context_fail "HEAD corrente malformata prima di Claude: il redflag fixer resta fail-closed."
          fi
          if ! printf '%s\n%s\n' "$current_head_sha" "$EXPECTED_HEAD_SHA" | awk 'NR==1 { current=tolower($0); next } { expected=tolower($0); exit current != expected }'; then
            context_fail "La HEAD della PR è cambiata fra prefetch e Claude: nessun fix automatico viene avviato."
          fi
          if ! printf '%s\n%s\n' "$current_head_sha" "$EVENT_HEAD_SHA" | awk 'NR==1 { current=tolower($0); next } { event=tolower($0); exit current != event }'; then
            context_fail "La HEAD della PR non coincide con l'evento review: nessun fix automatico viene avviato."
          fi

          body_file="$OUT/body-before-claude.txt"
          if ! jq -r '(.body // "")' "$pr_before_claude" > "$body_file"; then
            context_fail "Body della PR illeggibile prima di Claude: il redflag fixer resta fail-closed."
          fi
          if ! body_sha=$(sha256sum "$body_file" | awk '{print $1}'); then
            context_fail "Hash del body PR non calcolabile prima di Claude: il redflag fixer resta fail-closed."
          fi
          if ! printf '%s' "$body_sha" | grep -qE '^[a-f0-9]{64}$'; then
            context_fail "Hash del body PR malformato prima di Claude: il redflag fixer resta fail-closed."
          fi
          current_revision="body:$body_sha"
          if [ "$current_revision" != "$EXPECTED_BODY_REVISION" ]; then
            context_fail "Il body della PR è cambiato fra prefetch e Claude: nessun fix automatico viene avviato."
          fi
          echo "verified=true" >> "$GITHUB_OUTPUT"
          echo "Contesto PR/review ancora identico alla prefetch (HEAD + body revision): Codex autorizzato."

      - name: Run Codex Luna Max 🔴-fix
        id: codex_review
        if: steps.guard.outputs.proceed == 'true' && steps.ctx.outputs.context_verified == 'true' && steps.precodex.outputs.verified == 'true'
        # Non far fallire il job sull'exit non-zero della action: lo `Classify
        # outcome` finale decide il colore in base al LAVORO reale (commit pushato),
        # non al subtype della CLI. Un error_max_turns DOPO un push valido non è un
        # fallimento del round. I fail genuini (nessun push) vengono ri-marcati RED
        # dal classify → il segnale "non-progress" resta visibile nel loop-health.
        continue-on-error: true
        uses: ./.github/actions/claude-codex-fallback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
          PR_TITLE: ${{ needs.preflight.outputs.pr_title }}
          REPO: ${{ github.repository }}
          FIX_TIER: ${{ steps.guard.outputs.tier }}
          FIX_ROUND: ${{ steps.guard.outputs.round }}
        with:
          codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}
          # Auth via subscription Max (zero API cost). MAI ANTHROPIC_API_KEY.
          # Stesso token dello step "Configure push remote" qui sopra, e per la
          # stessa ragione — ma passato DOVE conta davvero. All'avvio l'action
          # chiama `replaceCheckoutCredentials()`
          # (src/github/operations/git-config.ts): azzera l'extraheader di
          # actions/checkout e RISCRIVE `origin` con il token che ha ricevuto
          # qui. Senza questo input riscriveva col proprio token di App, e ogni
          # push su `.github/workflows/**` moriva con "refusing to allow a
          # GitHub App to create or update workflow ... without `workflows`
          # permission" — proprio mentre il guard a monte (`touches_wf`/
          # `HAS_PAT`) aveva dato via libera perche' il PAT c'era. Il remote
          # configurato sopra resta utile ai push da `run:`.
          #
          # Vuoto (non `secrets.GITHUB_TOKEN`) resta fail-closed: gli eventi del
          # GITHUB_TOKEN non ri-attivano i workflow a valle, quindi non può
          # essere usato come credenziale operativa per un fix che deve innescare
          # la re-review dentro tests.yml. L'action si ferma prima di invocare
          # Codex quando il PAT esplicito manca.
          github_token: ${{ env.GITHUB_PAT_NANAKO }}
          codex_github_token: ${{ env.GITHUB_PAT_NANAKO }}
          # Le review/PR autonome sono di claude[bot] / github-actions[bot] /
          # frontaliere-automation[bot] (App): le PR aggiornate via App token
          # triggerano con actor = l'App → senza whitelist la action aborta
          # "non-human actor: frontaliere-automation" (exit 1). Mai `*`.
          # 30->45 (misurato 06-12): 25 fail vs 20 success in 7gg, TUTTI
          # error_max_turns al cap 30 (run 27390252111/27375482475/27373263097)
          # = peggior failure-rate del loop; ogni fail brucia ~8-14min di run
          # senza commit e lascia il rosso alla escalation needs-human.
          # 2026-07-02: --dangerously-skip-permissions sostituisce --allowedTools scoped
          # (rationale completo: post-merge-followup.yml claude_args comment, stesso
          # fix, evita drift tra copie duplicate).
          # 45->60 (2026-07-17, owner): bump fleet-wide di tutti i cap max-turns
          # Claude dopo l'ennesimo error_max_turns (run 29556645538 del vecchio workflow di review).
          prompt: |
            Sei l'agent di chiusura 🔴 per la PR #${{ needs.preflight.outputs.pr_number }} ("${{ needs.preflight.outputs.pr_title }}"). Tier: ${{ steps.guard.outputs.tier }}. Round: ${{ steps.guard.outputs.round }}/2.

            **Bootstrap:**
            1. Leggi `REVIEW.md` (severity/scopo) + `AGENTS.md` (non-negotiables + Privacy). VINCOLANTI.
            2. Il bundle deterministico è già pronto in `${{ runner.temp }}/redflag/redflag-bundle.md` (prefetch zero-Claude): PR metadata (title/body/headRefName), elenco file completo (REST paginata, non tronca a 100), ultima review Claude con i 🔴. **Leggilo con `Read` come prima cosa; non rieseguire `gh pr view` o `gh api .../reviews` per gli stessi dati** — solo se una sezione risulta vuota/mancante e ti serve davvero, ripeti la singola chiamata mancante. Il branch è già checkoutato sulla head della PR.

            **Obiettivo:** applica un fix CLASS-COMPLETE ai SOLI findings `🔴 Important` della review più recente su QUESTO branch. NON mergiare.

            **Regole:**
            - Fix CHIRURGICO alla CLASSE del bug (AGENTS.md non-negotiable #6): se il 🔴 segnala un pattern (regex/guard/floor/threshold/selector/idiom), `rg` i sibling funnel-critical (`scripts/update-*.mjs`, `scripts/lib/*-parser.mjs`, `build-plugins/**`, `services/seoService.ts`) e sweepa l'intera classe nella STESSA commit, oppure giustifica ogni sibling non toccato in `## Non implementato`.
            - Mai abbassare quality gate/test/validation/SEO gate per "far passare" (#1). Mai disabilitare AdSense Auto Ads (#7). Mai path home assoluti o email personali (Privacy).
            - CODE vs DATA: non scorrere i blob `data/**`/`public/**`; fixa il CODE che li genera.
            - Esegui i test pertinenti: `npm test` (o il subset rilevante) per validare il fix prima di committare.
            - Commit con identity canonica già configurata (Valerie Linc <valerielinc@gmail.com>), messaggio conventional, nessuna email non-canonica in coda.
            - Push sullo stesso branch: `git push origin HEAD:${{ needs.preflight.outputs.head_ref }}`. Il remote `origin` è autenticato con il token passato a questa action come `github_token` (il PAT, quando disponibile): l'action riscrive `origin` all'avvio, quindi vale QUEL token, non quello configurato dagli step precedenti. Non è il GITHUB_TOKEN → il push ri-attiva la review dentro tests.yml (re-review), e i file sotto `.github/workflows/**` sono pushabili. Se il push fallisce per scope/auth → prima di arrenderti verifica `git remote -v` (deve mostrare `x-access-token:***@github.com`); se dice `without workflows permission`, il PAT non è arrivato: documenta in un commento e TERMINA.
            - Aggiorna il body della PR (`gh pr edit $PR_NUMBER --body`) mantenendo `## Implementato` (aggiungi cosa hai fixato) + `## Non implementato (ancora)`.
            - SCOPE: il blocco **Changed file list** è il confine della PR. Applica solo i finding `🔴 Important` che citano file presenti in quella lista; i finding su file fuori dal diff sono già stati coniati nel follow-up e non vanno fissati qui né trascinati nella PR.

            **Constraint:**
            - SOLO i 🔴 della review corrente. Non rifare l'intera PR, non drive-by.
            - Se i 🔴 non sono fixabili con confidenza (root cause non chiara / serve giudizio umano) → commenta "🔴 non auto-fixabile: <motivo>" e TERMINA senza commit (il round cap + needs-human gestiranno l'escalation).
            - Una sola passata: applica, valida, committa, pusha, aggiorna body, STOP.

      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json

      # Colore del job = LAVORO reale del round, non l'exit della CLI Claude.
      #  • commit pushato sul branch della PR  → round SUCCESS (la re-review girerà;
      #    se 🔴 di nuovo, il round successivo o il round-cap → needs-human). Vale
      #    anche se Claude è morto error_max_turns DOPO il push (false-failure).
      #  • nessun push + Claude FAILED          → non-progress reale → RED (segnale
      #    preservato per il loop-health-report + escalation round-cap).
      #  • nessun push + Claude SUCCESS          → terminale pulito (es. "🔴 non
      #    auto-fixabile") → GREEN, niente da fixare nel workflow.
      # I fail infra a monte (npm ci, setup, load-rc) restano RED da soli: quegli
      # step non hanno continue-on-error. Mai fa-passare un gate: il round non ha
      # gate, è telemetria di colore (cfr. #2288, disambigua intenzionale vs crash).
      - name: Classify outcome (work-done, not CLI exit)
        if: always() && steps.guard.outputs.proceed == 'true' && steps.ctx.outputs.context_verified == 'true'
        env:
          HEAD_REF: ${{ needs.preflight.outputs.head_ref }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          ACTION_OUTCOME: ${{ steps.codex_review.outcome }}
        run: |
          set -uo pipefail
          HEAD_NOW=$(git rev-parse HEAD 2>/dev/null || echo "")
          git fetch origin "$HEAD_REF" -q 2>/dev/null || true
          REMOTE_SHA=$(git rev-parse "origin/$HEAD_REF" 2>/dev/null || echo "")
          echo "base=$BASE_SHA local=$HEAD_NOW remote=$REMOTE_SHA claude=$ACTION_OUTCOME"
          if [ -n "$HEAD_NOW" ] && [ -n "$BASE_SHA" ] && [ "$HEAD_NOW" != "$BASE_SHA" ] && [ "$REMOTE_SHA" = "$HEAD_NOW" ]; then
            echo "✓ Fix pushato questo round (HEAD avanzato e presente su origin/$HEAD_REF) → round SUCCESS. Job verde anche se la CLI è uscita '$ACTION_OUTCOME'."
            exit 0
          fi
          if [ "$ACTION_OUTCOME" = "failure" ]; then
            echo "::error::🔴-fix: nessun commit pushato e la run Claude è fallita ('$ACTION_OUTCOME') → non-progress reale. Job RED (segnale preservato; round-cap → needs-human a N>=2)."
            exit 1
          fi
          echo "Nessun push ma Claude terminato pulito ('$ACTION_OUTCOME') → terminale legittimo (es. non auto-fixabile). Job verde."
          exit 0

      - name: Release shared Codex lane quota lease
        if: always() && steps.quota_lease.outputs.lease_allowed == 'true' && steps.quota_lease.outputs.lease_token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          QUOTA_LEASE_ACTION: release
          QUOTA_LEASE_ROLE: redflag
          QUOTA_LEASE_OWNER: redflag-fixer
          QUOTA_LEASE_TARGET_TYPE: pr
          QUOTA_LEASE_TARGET: ${{ needs.preflight.outputs.pr_number }}
          QUOTA_LEASE_TOKEN: ${{ steps.quota_lease.outputs.lease_token }}
        run: node scripts/ci/check-quota-backoff.mjs
