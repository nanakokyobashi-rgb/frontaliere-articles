name: Review quota rescuer (zero-Claude)

# Un run `tests` può essere verde nei test ma rosso nel review gate perché il
# lease condiviso era occupato dal fixer issue, oppure terminare senza un
# verdetto per un errore transitorio. Questo workflow riapre quel solo arco del
# grafo quando il consumer termina: non crea commit, non invoca Claude e non
# tocca PR senza un claim/marker deterministico. Il percorso transient è
# one-shot per PR + HEAD + body revision e rilancia soltanto `tests`.
#
# Le letture e le mutazioni del rescuer usano l'identità operativa del corpus,
# `GITHUB_PAT_NANAKO`, caricata dal solo ponte Remote Config. Il token automatico
# dell'installation (`secrets.GITHUB_TOKEN`) ha una quota separata e può
# rispondere 403 già sulla probe read-only (#1623), lasciando il retry non
# verificato. Il passaggio avviene dalla shell dopo `$GITHUB_ENV`: il contesto
# YAML `env.*` viene valutato prima che il loader renda disponibile il valore.
on:
  workflow_run:
    workflows:
      - tests
      - Issue fix (Claude → PR)
      - Issue decompose (Claude → sub-issues)
      - PR 🔴 fixer (bounded loop-closure on bot PRs)
      - PR ❌ check fixer (bounded, check richiesto rosso su PR bot)
      - Follow-up drainer (queue → agent:fix, no-Claude)
    types: [completed]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo log, nessun rerun o commento'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write
  pull-requests: write
  issues: write

jobs:
  rescue:
    # Due sorgenti `workflow_run` che non possono aver lasciato nulla da
    # riaprire, e che il `workflows:` sopra non sa escludere (non filtra per
    # evento, e un filtro `branches` taglierebbe i fixer, che girano sempre sul
    # branch di default):
    #  - `tests` su `push`: gira solo su `main`, senza PR, e non entra mai nella
    #    famiglia review, quindi non prende ne' rilascia il lease condiviso e
    #    non scrive marker di deferral. E' ~29% delle run `tests` (58 su 200,
    #    2026-09-18/19).
    #  - una run sorgente `skipped`: nessun job e' partito, quindi nessun lease.
    # Il cron e il dispatch restano la rete che scandisce TUTTE le PR aperte.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion != 'skipped' &&
       !(github.event.workflow_run.name == 'tests' && github.event.workflow_run.event == 'push'))
    # A livello di JOB e non di workflow: un job saltato dall'`if` sopra non
    # entra nel gruppo, quindi non puo' sfrattare la run pending di un trigger
    # utile (con `cancel-in-progress: false` GitHub ne tiene una sola).
    concurrency:
      group: review-quota-rescuer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout loop scripts
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/ci
            generator/scripts/load-rc-env.mjs
            generator/scripts/lib/google-service-account-token.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON non configurato — impossibile caricare il PAT operativo da Remote Config."
            exit 1
          fi

      - name: Load secrets from Remote Config
        continue-on-error: true
        run: node generator/scripts/load-rc-env.mjs

      - name: Retry deferred/transient reviews (deterministic, zero-Claude)
        env:
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -uo pipefail
          runtime_pat="${GITHUB_PAT_NANAKO:-}"
          if [ -z "$runtime_pat" ]; then
            echo "::error::GITHUB_PAT_NANAKO mancante dopo il caricamento Remote Config — rescuer fermato fail-closed, senza fallback su GITHUB_TOKEN."
            exit 1
          fi
          GH_TOKEN="$runtime_pat" node scripts/ci/review-quota-rescuer.mjs
          rc=$?
          unset runtime_pat
          exit "$rc"

      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json
