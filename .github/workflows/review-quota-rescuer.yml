name: Review quota rescuer (zero-Claude)

# Un run `tests` può essere verde nei test ma rosso nel review gate perché il
# lease condiviso era occupato dal fixer issue, oppure terminare senza un
# verdetto per un errore transitorio. Questo workflow riapre quel solo arco del
# grafo quando il consumer termina: non crea commit, non invoca Claude e non
# tocca PR senza un claim/marker deterministico. Il percorso transient è
# one-shot per PR + HEAD + body revision e rilancia soltanto `tests`.
on:
  workflow_run:
    workflows:
      - tests
      - Issue fix (Claude → PR)
      - Issue decompose (Claude → sub-issues)
      - PR 🔴 fixer (bounded loop-closure on bot PRs)
      - PR ❌ check fixer (bounded, check richiesto rosso su PR bot)
      - Follow-up drainer (queue → agent:fix, no-Claude)
    types: [completed]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo log, nessun rerun o commento'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write
  pull-requests: write
  issues: write

jobs:
  rescue:
    # Due sorgenti `workflow_run` che non possono aver lasciato nulla da
    # riaprire, e che il `workflows:` sopra non sa escludere (non filtra per
    # evento, e un filtro `branches` taglierebbe i fixer, che girano sempre sul
    # branch di default):
    #  - `tests` su `push`: gira solo su `main`, senza PR, e non entra mai nella
    #    famiglia review, quindi non prende ne' rilascia il lease condiviso e
    #    non scrive marker di deferral. E' ~29% delle run `tests` (58 su 200,
    #    2026-09-18/19).
    #  - una run sorgente `skipped`: nessun job e' partito, quindi nessun lease.
    # Il cron e il dispatch restano la rete che scandisce TUTTE le PR aperte.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion != 'skipped' &&
       !(github.event.workflow_run.name == 'tests' && github.event.workflow_run.event == 'push'))
    # A livello di JOB e non di workflow: un job saltato dall'`if` sopra non
    # entra nel gruppo, quindi non puo' sfrattare la run pending di un trigger
    # utile (con `cancel-in-progress: false` GitHub ne tiene una sola).
    concurrency:
      group: review-quota-rescuer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout loop scripts
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/ci

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Retry deferred/transient reviews (deterministic, zero-Claude)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node scripts/ci/review-quota-rescuer.mjs
