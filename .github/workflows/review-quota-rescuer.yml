name: Review quota rescuer (zero-Claude)

# Un run `tests` può essere verde nei test ma rosso nel review gate perché il
# lease condiviso era occupato dal fixer issue, oppure terminare senza un
# verdetto per un errore transitorio. Questo workflow riapre quel solo arco del
# grafo quando il consumer termina: non crea commit, non invoca Claude e non
# tocca PR senza un claim/marker deterministico. Il percorso transient è
# one-shot per PR + HEAD + body revision e rilancia soltanto `tests`.
#
# Dal 2026-09-25 c'e' un terzo arco: un run `tests` rosso perche' il bucket REST
# orario del GITHUB_TOKEN era esaurito (annotation `[gh-rate-limit …]` o 403
# «API rate limit exceeded» nel job richiesto) viene rilanciato UNA volta per
# HEAD, e solo DOPO il reset. Quello scan legge le run `tests` e le annotation,
# quindi gira sui tick cron/dispatch e sui completamenti di `tests` — dove un
# rosso nuovo puo' comparire — e non sugli altri trigger (`REVIEW_RATE_LIMIT_SCAN`).
#
# Le letture e le mutazioni del rescuer usano l'identità operativa del corpus,
# `GITHUB_PAT_NANAKO`, caricata dal solo ponte Remote Config. Il token automatico
# dell'installation (`secrets.GITHUB_TOKEN`) ha una quota separata e può
# rispondere 403 già sulla probe read-only (#1623), lasciando il retry non
# verificato. Il passaggio avviene dalla shell dopo `$GITHUB_ENV`: il contesto
# YAML `env.*` viene valutato prima che il loader renda disponibile il valore.
on:
  workflow_run:
    workflows:
      - tests
      - Issue fix (Codex Luna Max → PR)
      - Issue decompose (Codex Luna Max → sub-issues)
      - PR 🔴 fixer (bounded loop-closure on bot PRs)
      - PR ❌ check fixer (bounded, check richiesto rosso su PR bot)
    # Niente `Follow-up drainer`: riserva lo slot issue-fix e lo passa alla
    # run promossa (o lo rilascia nella stessa run), quindi alla fine non ha
    # liberato nessuno slot che una review differita stesse aspettando; lo
    # slot si libera al completamento di `Issue fix`, gia' in lista. Il 26-27/09
    # era la prima sorgente del rescuer: 211 run in 24 h (112 cancelled dal suo
    # mutex), tutte con `quota-candidate=0`.
    types: [completed]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo log, nessun rerun o commento'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write
  pull-requests: write
  issues: write

jobs:
  rescue:
    # Due sorgenti `workflow_run` che non possono aver lasciato nulla da
    # riaprire, e che il `workflows:` sopra non sa escludere (non filtra per
    # evento, e un filtro `branches` taglierebbe i fixer, che girano sempre sul
    # branch di default):
    #  - `tests` su `push` o su `workflow_dispatch` di `main`: gira senza PR e
    #    non entra mai nella famiglia review, quindi non prende ne' rilascia il
    #    lease condiviso e non scrive marker di deferral. E' ~29% delle run
    #    `tests` su push (58 su 200, 2026-09-18/19); il dispatch su `main` ha la
    #    stessa semantica di run manuale fuori dalla famiglia review.
    #  - una run sorgente `skipped`/`cancelled`: nessun esito utile può
    #    riaprire il gate; lasciarla entrare nel gruppo permetterebbe a un
    #    completamento non utile di sostituire una pending di rescue.
    # Il cron e il dispatch restano la rete che scandisce TUTTE le PR aperte.
    #
    # `tests` si riconosce dal PATH e non da `workflow_run.name`: tests.yml ha
    # un `run-name:` («Code checks and review · …») e `workflow_run.name` e' il
    # nome della RUN, non il `name:` del workflow. Il confronto con 'tests'
    # non era mai vero (#1614 non ha mai saltato nulla: 81 run su push di main
    # eseguite il 26-27/09) e `REVIEW_RATE_LIMIT_SCAN` restava sempre `false`
    # sui completamenti di `tests`.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion != 'skipped' &&
       github.event.workflow_run.conclusion != 'cancelled' &&
       !(github.event.workflow_run.path == '.github/workflows/tests.yml' &&
         (github.event.workflow_run.event == 'push' ||
          (github.event.workflow_run.event == 'workflow_dispatch' &&
           github.event.workflow_run.head_branch == 'main'))))
    # A livello di JOB e non di workflow: un job saltato dall'`if` sopra non
    # entra nel gruppo, quindi non puo' sfrattare la run pending di un trigger
    # utile (con `cancel-in-progress: false` GitHub ne tiene una sola).
    concurrency:
      group: review-quota-rescuer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout loop scripts
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/ci
            generator/scripts/load-rc-env.mjs
            generator/scripts/lib/source-copy-guard.mjs
            generator/scripts/lib/google-service-account-token.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON non configurato — impossibile caricare il PAT operativo da Remote Config."
            exit 1
          fi

      - name: Load secrets from Remote Config
        continue-on-error: true
        run: node generator/scripts/load-rc-env.mjs

      - name: Retry deferred/transient reviews (deterministic, zero-Claude)
        env:
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          REVIEW_RATE_LIMIT_SCAN: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.path == '.github/workflows/tests.yml' }}
        run: |
          set -uo pipefail
          runtime_pat="${GITHUB_PAT_NANAKO:-}"
          if [ -z "$runtime_pat" ]; then
            echo "::error::GITHUB_PAT_NANAKO mancante dopo il caricamento Remote Config — rescuer fermato fail-closed, senza fallback su GITHUB_TOKEN."
            exit 1
          fi
          GH_TOKEN="$runtime_pat" node scripts/ci/review-quota-rescuer.mjs
          rc=$?
          unset runtime_pat
          exit "$rc"

      - name: Report rate-limit budget
        if: always()
        run: |
          runtime_pat="${GITHUB_PAT_NANAKO:-}"
          RATE_LIMIT_WORKFLOW=review-quota-rescuer \
            RATE_LIMIT_TOKEN_NAME=GITHUB_PAT_NANAKO \
            RATE_LIMIT_RESOURCES=core,graphql \
            GH_TOKEN="$runtime_pat" \
            node scripts/ci/report-rate-limit-budget.mjs
          unset runtime_pat

      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json
