# TEMPORARY NON-PRODUCTION failure-injection probe, active only on 2026-09-01 UTC.
# Cleanup: remove this workflow and its schedule in an immediate PR after the probe.
name: NON-PRODUCTION Translate Queue Rerun Preservation Probe
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('NON-PRODUCTION rerun-probe {0} {1}', inputs.probe_token, inputs.role)
      || format('NON-PRODUCTION rerun-probe schedule-{0}', github.run_id) }}

on:
  workflow_dispatch:
    inputs:
      probe_token:
        description: Public comparison token; never put a secret here
        required: true
        type: string
      role:
        description: Candidate records immediately; blocker holds the concurrency slot
        required: true
        type: choice
        options:
          - candidate
          - blocker
      hold_seconds:
        description: Candidate must use 0; blocker must use 1..900
        required: true
        default: '0'
        type: string
  schedule:
    - cron: '*/5 16-20 1 9 *'

permissions:
  actions: read
  contents: read

concurrency:
  group: translation-queue-rerun-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch immutable zero-dependency probe verifier
        shell: bash
        env:
          PROBE_SCRIPT: ${{ runner.temp }}/verify-translate-queue-rerun-probe.mjs
          PROBE_SCRIPT_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/ci/verify-translate-queue-rerun-probe.mjs
          RUN_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RUN_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          for attempt in 1 2 3; do
            if curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
                --location --connect-timeout 5 --max-time 20 \
                --output "$PROBE_SCRIPT" "$PROBE_SCRIPT_URL"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 2
          done

      - name: Record preserved event and inputs
        env:
          PROBE_TOKEN: ${{ github.event_name == 'schedule' && format('schedule-{0}', github.run_id) || inputs.probe_token }}
          PROBE_ROLE: ${{ github.event_name == 'schedule' && 'candidate' || inputs.role }}
          PROBE_HOLD_SECONDS: ${{ github.event_name == 'schedule' && '0' || inputs.hold_seconds }}
          PROBE_SCHEDULE: ${{ github.event.schedule || '' }}
          PROBE_OUTPUT: ${{ runner.temp }}/translate-queue-rerun-probe/record.json
          PROBE_SCRIPT: ${{ runner.temp }}/verify-translate-queue-rerun-probe.mjs
        run: node "$PROBE_SCRIPT"

      - name: Upload run-attempt-bound probe record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: translate-queue-rerun-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/translate-queue-rerun-probe/record.json
          if-no-files-found: error
          retention-days: 3
