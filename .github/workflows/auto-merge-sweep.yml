name: Auto-merge sweep (periodic safety-net)

# La rete sotto ad `auto-merge-on-lgtm.yml`, che è event-driven e quindi ha un
# buco strutturale: valuta SOLO quando arriva una review o quando `tests`
# conclude con success. Una PR che diventa mergiabile senza che scatti nessuno
# dei due — per esempio perché il run di `tests` è concluso `cancelled` per un
# motivo collaterale mentre il check era verde — resta ferma senza che nulla la
# rivaluti.
#
# È esattamente il modo in cui una PR di questo repo è rimasta ferma 9 ore con
# tutti i check verdi. L'auto-merge event-driven risolve il caso normale;
# questo sweep esiste per il caso in cui l'evento non arriva mai.
#
# Stessa identica logica di gate (`auto-merge-eval.mjs`, unica fonte di verità):
# mergia solo con `## LGTM` + check verde + collision ok, altrimenti esce 0
# senza effetti. Zero Claude.
#
# ── Cadenza ─────────────────────────────────────────────────────────────────
# Ogni 30 minuti ai minuti 12 e 42, sfasati dal `*/15` del sito. GitHub throttla
# comunque i cron ad alta frequenza, e per una rete di sicurezza va bene: deve
# catturare le PR ferme in ore, non in giorni. Il percorso primario resta
# l'evento.

on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:

concurrency:
  group: auto-merge-sweep
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write # alert token-down
  actions: write # dispatch di publish-api come rete di sicurezza

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load secrets from Remote Config
        continue-on-error: true
        run: node generator/scripts/load-rc-env.mjs

      - name: Alert token-down (dedup, zero-Claude)
        if: env.GITHUB_PAT_NANAKO == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/ci/alert-pat-down.mjs --workflow "${{ github.workflow }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Re-evaluate every open PR (auto-merge-eval per PR)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CI_CHECK_NAME: 'tests (node --test)'
          MERGE_PRIMARY_TOKEN: ${{ env.GITHUB_PAT_NANAKO || secrets.GITHUB_TOKEN }}
          MERGE_FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ env.GITHUB_PAT_NANAKO != '' }}
        run: node scripts/ci/auto-merge-sweep.mjs

      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json
