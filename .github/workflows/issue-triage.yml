name: Issue triage (deterministic classify + route)

# Classifica ogni issue e la instrada: `agent:fix` se va risolta subito,
# `agent:fix-queued` + `fu-prio:<prio>` se deve passare dalla coda.
#
# ZERO Claude. La classificazione è regex su titolo e label
# (`scripts/lib/classify-issue.mjs`, testato in
# `generator/tests/classify-issue.test.mjs`), quindi il triage non tocca la
# quota condivisa col sito. Su questo repo importa più che altrove: il volume di
# issue è dominato dai fallimenti di generazione articoli, e farli passare da un
# modello sarebbe spendere quota per riconoscere un titolo.
#
# ── I due percorsi, e perché servono entrambi ───────────────────────────────
#
# `triage` (event-driven) scatta su `issues: opened`. `sweep` (schedulato)
# recupera le orfane. Non è ridondanza: una issue creata dal GITHUB_TOKEN NON
# emette l'evento `opened` (anti-ricorsione GitHub), quindi senza lo sweep ogni
# issue aperta da un'automazione senza PAT resterebbe fuori dal triage per
# sempre. Sul sito è così che se ne sono accumulate 46, alcune di due settimane.
# `workflow-failure-issues.yml` usa il PAT proprio per stare sul primo percorso,
# ma il secondo resta la rete.
#
# ── ADATTAMENTI rispetto al sito (manifest: `adapted`) ──────────────────────
#  - Nessun `npm ci`: gli script del ciclo usano solo builtin Node.
#  - Ponte Remote Config: `generator/scripts/load-rc-env.mjs`.
#  - Token di routing: `GITHUB_PAT_NANAKO`. Viene esposto a `triage-sweep.mjs`
#    come `GITHUB_PAT`, che è il nome che lo script legge: mappare qui tiene
#    lo script byte-identico a quello del sito invece di forkarlo.
#  - Cadenza dello sweep sfasata (`:41` invece di `:17`).

on:
  issues:
    types: [opened]
  schedule:
    - cron: '41 */4 * * *'
  workflow_dispatch:
    inputs:
      cap:
        description: 'Max issue instradate a fix immediato per run (anti-burst)'
        required: false
        type: string
        default: '5'
      dry_run:
        description: 'Solo log, nessuna modifica'
        required: false
        type: boolean
        default: false

# Una run di triage alla volta: i fallimenti arrivano in burst (un provider LLM
# che cade fa cadere più workflow di generazione insieme) e serializzare evita
# race sul routing.
# Chiave per-issue sugli eventi issue, gruppo unico condiviso per gli sweep.
# Stessa classe di `issue-fix.yml` e `issue-decompose.yml`: `concurrency` e'
# valutata a livello di workflow, prima dell'`if:` del job, quindi con un gruppo
# costante due issue APERTE nello stesso minuto si sfrattavano — e l'issue
# sfrattata non veniva mai instradata, perche' `issues:[opened]` e' one-shot e
# nessuno la ri-arma. Misurato qui il 2026-09-04: 7 `cancelled` su 32 run.
#
# Il fallback NON e' `github.run_id` come negli altri due, ed e' una differenza
# VERIFICATA sui trigger di questo file e non copiata dal sito: qui i trigger
# sono tre e per `schedule`/`workflow_dispatch` non c'e' nessuna issue nel
# payload. Con `run_id` ogni sweep avrebbe una chiave propria e due sweep
# potrebbero girare insieme instradando la stessa coda due volte; la costante
# `sweep` li tiene serializzati fra loro come prima, e insieme li tiene fuori
# dalla coda degli eventi per-issue.
concurrency:
  group: issue-triage-${{ github.event.issue.number || 'sweep' }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  # Serve allo step `Release stale agent:in-progress claims` del job `sweep`:
  # un claim va rilasciato SOLO se nessuna PR aperta lo giustifica, e senza
  # questo permesso quell'elenco sarebbe vuoto. Sola lettura.
  pull-requests: read

jobs:
  triage:
    if: ${{ github.event_name == 'issues' && !contains(github.event.issue.labels.*.name, 'agent:triaged') }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Le label di routing non si creano da sole: `gh issue edit --add-label`
      # fallisce se la label non esiste, e nei workflow quel fallimento è un
      # warning NON bloccante (di proposito: un routing mancato non deve
      # diventare una run rossa). Senza questo step il ciclo girerebbe, loggerebbe
      # e uscirebbe 0 — senza instradare nulla. Idempotente, costa una lista.
      - name: Ensure loop labels exist (idempotente)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/ensure-loop-labels.mjs

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ Nessuna Firebase SA — GITHUB_PAT_NANAKO non caricato; L11 usa la coda fallback e il resto attende lo sweep."
          fi

      - name: Load secrets from Remote Config
        continue-on-error: true
        run: node generator/scripts/load-rc-env.mjs

      - name: Alert token-down (dedup, zero-Claude)
        if: env.GITHUB_PAT_NANAKO == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/ci/alert-pat-down.mjs --workflow "${{ github.workflow }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Classify and route (deterministic, no Claude)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Le label di ROUTING devono essere applicate col PAT, non col
          # GITHUB_TOKEN: un evento `labeled` emesso dal GITHUB_TOKEN non fa
          # partire né il fixer né il drainer. Col GITHUB_TOKEN il triage
          # sembrerebbe funzionare — la label c'è — ma non succederebbe nulla.
          ROUTING_TOKEN: ${{ env.GITHUB_PAT_NANAKO }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          issue_json=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json title,body,labels,state)
          labels_json=$(printf '%s' "$issue_json" | jq -c '[.labels[].name]')
          state=$(printf '%s' "$issue_json" | jq -r '.state')
          title=$(printf '%s' "$issue_json" | jq -r '.title // ""')
          body=$(printf '%s' "$issue_json" | jq -r '.body // ""')
          echo "Issue #$ISSUE_NUMBER state=$state labels=$labels_json title=$title"

          # L11 ha un contratto prodotto dal supervisore. Validarlo prima della
          # classificazione generica evita che la prosa dei finding (spesso in
          # .github/workflows e scripts/ci) venga scambiata per una richiesta
          # umana o per un'autorizzazione implicita. Un contratto assente resta
          # sul classificatore normale; uno presente ma invalido è review-only.
          l11_contract=$(node --input-type=module - "$body" <<'NODE'
          const body = process.argv[2] || '';
          const marker = /<!-- L11_ISSUE_CONTRACT:\s*(\{.*\})\s*-->/ms.exec(body);
          if (!marker) {
            process.stdout.write(JSON.stringify({ present: false, valid: false, fixable: false }));
            process.exit(0);
          }
          let contract;
          try { contract = JSON.parse(marker[1]); } catch {
            process.stdout.write(JSON.stringify({ present: true, valid: false, fixable: false, reason: 'invalid-json' }));
            process.exit(0);
          }
          const id = (value, prefix) => typeof value === 'string' && new RegExp(`^lf-${prefix}-[0-9a-f]{24}$`).test(value);
          const generated = Date.parse(typeof contract.generatedAt === 'string' ? contract.generatedAt : '');
          const expires = Date.parse(typeof contract.expiresAt === 'string' ? contract.expiresAt : '');
          const ttl = Number.isInteger(contract.candidateTtlHours) && contract.candidateTtlHours > 0
            && Number.isFinite(generated) && Number.isFinite(expires)
            && expires > Date.now() && expires >= generated
            && expires <= generated + contract.candidateTtlHours * 3600000
            && contract.ttl?.hours === contract.candidateTtlHours
            && contract.ttl?.expiresAt === contract.expiresAt;
          const shape = contract.schemaVersion === 1 && contract.loopId === 'L11'
            && contract.mode === 'observe-report-only'
            && id(contract.candidateId, 'candidate') && id(contract.sourceRecordId, 'source')
            && Number.isFinite(generated)
            && contract.remediationPrProofRequired === true && contract.remediationPr === null
            && (contract.route === 'bounded-fix-queue' || contract.route === 'review-only');
          const actionParts = typeof contract.actionClass === 'string'
            ? contract.actionClass.split('+').map((part) => part.trim()) : [];
          const fixable = shape && contract.route === 'bounded-fix-queue' && actionParts.includes('issue') && ttl;
          const reviewOnly = shape && contract.route === 'review-only';
          process.stdout.write(JSON.stringify({ present: true, valid: fixable || reviewOnly, fixable, reason: fixable || reviewOnly ? null : 'fail-closed' }));
          NODE
          )
          l11_present=$(printf '%s' "$l11_contract" | jq -r '.present == true')
          l11_valid=$(printf '%s' "$l11_contract" | jq -r '.valid == true')
          l11_fixable=$(printf '%s' "$l11_contract" | jq -r '.fixable == true')

          if [ "$l11_present" = "true" ]; then
            if [ "$l11_valid" != "true" ] || [ "$l11_fixable" != "true" ]; then
              echo "L11 contract non eleggibile → review-only, nessun needs-human scelto per default."
              gh issue edit "$ISSUE_NUMBER" --repo "$REPO" \
                --remove-label agent:fix --remove-label agent:fix-queued \
                --add-label operations-audit-review --add-label agent:triaged || true
              exit 0
            fi
            # L11 è autorizzato dal registry solo al percorso issue bounded. Se
            # il PAT manca, il fallback usa GITHUB_TOKEN per lasciare una coda
            # visibile allo sweep/drainer: non si marca triaged prima di aver
            # scritto una label che preservi il lavoro.
            if [ "$state" != "OPEN" ]; then
              gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label agent:triaged || true
              echo "Issue non OPEN ($state) → skip routing L11."; exit 0
            fi
            if [ -z "${ROUTING_TOKEN:-}" ]; then
              echo "::warning::L11 senza PAT: accodo con GITHUB_TOKEN per il prossimo sweep/drainer."
              gh issue edit "$ISSUE_NUMBER" --repo "$REPO" \
                --add-label agent:fix-queued --add-label fu-prio:low \
                --remove-label operations-audit-review \
                --add-label agent:triaged
              exit 0
            fi
            echo "L11 contract valido → agent:fix-queued via PAT."
            GH_TOKEN="$ROUTING_TOKEN" gh issue edit "$ISSUE_NUMBER" --repo "$REPO" \
              --add-label agent:fix-queued --add-label fu-prio:low \
              --remove-label operations-audit-review
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label agent:triaged || true
            exit 0
          fi

          decision=$(node scripts/lib/classify-issue.mjs "$title" "$labels_json")
          echo "decision=$decision"
          cat=$(node -e "process.stdout.write(JSON.parse(process.argv[1]).category)" "$decision")
          autofix=$(node -e "process.stdout.write(String(JSON.parse(process.argv[1]).autofix===true))" "$decision")
          route=$(node -e "process.stdout.write(JSON.parse(process.argv[1]).route||'none')" "$decision")
          fuprio=$(node -e "process.stdout.write(JSON.parse(process.argv[1]).fuPrio||'')" "$decision")
          echo "category=$cat autofix=$autofix route=$route fuPrio=$fuprio"

          if [ "$route" = "none" ] || [ "$autofix" != "true" ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "agent:triaged" || true
            echo "route=$route autofix=$autofix → nessun routing."; exit 0
          fi
          if [ "$state" != "OPEN" ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "agent:triaged" || true
            echo "Issue non OPEN ($state) → skip routing."; exit 0
          fi
          if [ -z "${ROUTING_TOKEN:-}" ]; then
            echo "::warning::Nessun PAT usabile → issue non ancora triaged; lo sweep potrà ritentare senza perdere l'evento."; exit 0
          fi
          if [ "$route" = "queue" ]; then
            prio="${fuprio:-low}"
            echo "Accodo #$ISSUE_NUMBER → agent:fix-queued + fu-prio:$prio (la promuove il drainer)."
            GH_TOKEN="$ROUTING_TOKEN" gh issue edit "$ISSUE_NUMBER" --repo "$REPO" \
              --add-label "agent:fix-queued" --add-label "fu-prio:$prio" \
              || { echo "::warning::accodamento via PAT fallito (scope/label?) — issue non triaged, lo sweep ritenta."; exit 0; }
          else
            echo "Applico agent:fix via PAT su #$ISSUE_NUMBER (category=$cat) → fa partire il fixer."
            GH_TOKEN="$ROUTING_TOKEN" gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "agent:fix" \
              || { echo "::warning::agent:fix via PAT fallito (scope issues:write? label assente?) — issue non triaged, lo sweep ritenta."; exit 0; }
          fi
          # Anti-loop solo dopo il routing: un evento issues:opened è one-shot e
          # un claim prematuro renderebbe l'errore permanente.
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "agent:triaged" || true

      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json

  # Recupera le issue orfane che il percorso event-driven non vede mai. Su
  # questo repo NON è un caso limite: è il percorso normale ogni volta che il
  # PAT non è disponibile, perché tutte le issue di fallimento nascono da
  # un'automazione.
  sweep:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Le label di routing non si creano da sole: `gh issue edit --add-label`
      # fallisce se la label non esiste, e nei workflow quel fallimento è un
      # warning NON bloccante (di proposito: un routing mancato non deve
      # diventare una run rossa). Senza questo step il ciclo girerebbe, loggerebbe
      # e uscirebbe 0 — senza instradare nulla. Idempotente, costa una lista.
      - name: Ensure loop labels exist (idempotente)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/ensure-loop-labels.mjs

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ Nessuna Firebase SA — L11 usa la coda fallback; il routing PAT resta inerte."
          fi

      - name: Load secrets from Remote Config
        continue-on-error: true
        run: node generator/scripts/load-rc-env.mjs

      - name: Alert token-down (dedup, zero-Claude)
        if: env.GITHUB_PAT_NANAKO == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/ci/alert-pat-down.mjs --workflow "${{ github.workflow }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # Normalizza prima dello sweep generico le issue L11 già persistite dal
      # GITHUB_TOKEN. Il loro testo contiene path di control-plane, ma il
      # contratto registry-driven è l'unica autorizzazione per il fixer; un
      # contratto assente/invalido resta review-only e non introduce
      # `needs-human` per scelta.
      - name: Normalize L11 issue contracts (bounded, fail-closed)
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PAT: ${{ env.GITHUB_PAT_NANAKO }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          issues=$(gh issue list --repo "$GH_REPO" --state open --label operations-audit --limit 60 --json number,body 2>/dev/null || echo '[]')
          while IFS= read -r issue; do
            [ -n "$issue" ] || continue
            number=$(printf '%s' "$issue" | jq -r '.number')
            body=$(printf '%s' "$issue" | jq -r '.body // ""')
            contract=$(node --input-type=module - "$body" <<'NODE'
          const body = process.argv[2] || '';
          const marker = /<!-- L11_ISSUE_CONTRACT:\s*(\{.*\})\s*-->/ms.exec(body);
          if (!marker) { process.stdout.write(JSON.stringify({ present: false, valid: false, fixable: false })); process.exit(0); }
          let c;
          try { c = JSON.parse(marker[1]); } catch { process.stdout.write(JSON.stringify({ present: true, valid: false, fixable: false, reason: 'invalid-json' })); process.exit(0); }
          const id = (v, p) => typeof v === 'string' && new RegExp(`^lf-${p}-[0-9a-f]{24}$`).test(v);
          const generated = Date.parse(typeof c.generatedAt === 'string' ? c.generatedAt : '');
          const expires = Date.parse(typeof c.expiresAt === 'string' ? c.expiresAt : '');
          const ttl = Number.isInteger(c.candidateTtlHours) && c.candidateTtlHours > 0
            && Number.isFinite(generated) && Number.isFinite(expires) && expires > Date.now()
            && expires >= generated && expires <= generated + c.candidateTtlHours * 3600000
            && c.ttl?.hours === c.candidateTtlHours && c.ttl?.expiresAt === c.expiresAt;
          const shape = c.schemaVersion === 1 && c.loopId === 'L11' && c.mode === 'observe-report-only'
            && id(c.candidateId, 'candidate') && id(c.sourceRecordId, 'source') && Number.isFinite(generated)
            && c.remediationPrProofRequired === true && c.remediationPr === null
            && (c.route === 'bounded-fix-queue' || c.route === 'review-only');
          const parts = typeof c.actionClass === 'string' ? c.actionClass.split('+').map((v) => v.trim()) : [];
          const fixable = shape && c.route === 'bounded-fix-queue' && parts.includes('issue') && ttl;
          const reviewOnly = shape && c.route === 'review-only';
          process.stdout.write(JSON.stringify({ present: true, valid: fixable || reviewOnly, fixable }));
          NODE
            )
            present=$(printf '%s' "$contract" | jq -r '.present == true')
            valid=$(printf '%s' "$contract" | jq -r '.valid == true')
            fixable=$(printf '%s' "$contract" | jq -r '.fixable == true')
            [ "$present" = "true" ] || continue
            if [ "$valid" = "true" ] && [ "$fixable" = "true" ]; then
              echo "L11 #$number contract valido → queue + triaged"
              if [ -n "${GITHUB_PAT:-}" ]; then
                GH_TOKEN="$GITHUB_PAT" gh issue edit "$number" --repo "$GH_REPO" \
                  --add-label agent:fix-queued --add-label fu-prio:low \
                  --remove-label operations-audit-review >/dev/null 2>&1 || echo "::warning::L11 #$number PAT routing fallito"
              else
                gh issue edit "$number" --repo "$GH_REPO" \
                  --add-label agent:fix-queued --add-label fu-prio:low \
                  --remove-label operations-audit-review >/dev/null 2>&1 || echo "::warning::L11 #$number queue fallback fallito"
              fi
            else
              echo "L11 #$number contract assente/invalido o review-only → review + triaged"
              gh issue edit "$number" --repo "$GH_REPO" \
                --remove-label agent:fix --remove-label agent:fix-queued \
                --add-label operations-audit-review >/dev/null 2>&1 || true
            fi
            gh issue edit "$number" --repo "$GH_REPO" --add-label agent:triaged >/dev/null 2>&1 || true
          done < <(printf '%s' "$issues" | jq -c '.[]')

      - name: Triage sweep (recover orphaned issues, deterministic)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `triage-sweep.mjs` legge `GITHUB_PAT`. Mappare qui il nome del PAT
          # di questo account tiene lo script byte-identico a quello del sito:
          # è la differenza fra un file copiabile e un fork da riallineare a
          # mano ogni volta.
          GITHUB_PAT: ${{ env.GITHUB_PAT_NANAKO }}
          GH_REPO: ${{ github.repository }}
          INPUT_CAP: ${{ github.event.inputs.cap || '5' }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -uo pipefail
          ARGS=(--cap "$INPUT_CAP")
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          node scripts/ci/triage-sweep.mjs "${ARGS[@]}"

      # Doppio instradamento (#918, item 2). Da quando la chiave di concorrenza
      # e' per-issue (#908), questa run schedulata e la run event-driven non si
      # serializzano piu': lo sweep puo' leggere una issue proprio fra
      # `agent:triaged` e la sua label di routing, e instradarla una seconda
      # volta. Le due strade classificano lo stesso input, quindi di norma la
      # seconda label e' idempotente — tranne quando il clamp del budget diretto
      # dello sweep accoda cio' che l'event-driven ha mandato a fix diretto:
      # la issue resta con `agent:fix` E `agent:fix-queued`, e il drainer la
      # promuove una seconda volta.
      #
      # La riconciliazione sta QUI e non in `triage-sweep.mjs` perche' quello e'
      # `mode: identical` nel manifest: una modifica li' viene sovrascritta al
      # mirror successivo. GITHUB_TOKEN di proposito — si rimuove una label, e
      # nessun workflow ascolta `unlabeled`.
      - name: Reconcile double routing (deterministic, no Claude)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: node scripts/ci/reconcile-routing-labels.mjs

      # Lock `agent:in-progress` appesi. Sta QUI e non in `recycle-stale-prs.yml`
      # perche' questo e' il janitor schedulato del lato ISSUE: lo sweep sopra
      # recupera le issue che il triage non ha mai instradato, questo recupera
      # quelle che il triage ha instradato ma che un lock morto tiene fuori dal
      # fixer. Stessa cadenza, stessa superficie, stesso permesso `issues: write`.
      #
      # `agent:in-progress` non e' uno stato, e' mutua esclusione: `issue-fix.yml`
      # lo mette come primo pre-flight e salta tutto se lo trova. Il claim porta
      # anche `agent:remote` o `agent:local`, così il detector distingue il lock
      # del fixer CI da una sessione locale; gli errori di lettura sono
      # fail-closed e i claim locali non vengono rimossi automaticamente.
      # Un run remoto morto senza owner release resta comunque osservabile e
      # recuperabile dal detector stale (soglia 12h).
      #
      # `pull-requests: read` e' load-bearing: il detector rilascia solo i claim
      # SENZA una PR aperta che li giustifichi. Senza quel permesso l'elenco
      # delle PR sarebbe vuoto e rilascerebbe anche i claim VIVI, facendo
      # ripartire un secondo fixer in parallelo — la collisione #4788/#4793 che
      # il lock esiste per impedire. Lo script non decide niente se una delle due
      # liste manca, ma il permesso e' comunque il primo posto dove guardare.
      - name: Release stale agent:in-progress claims (zero-Claude, mutex)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          STALE_CLAIM_HOURS: '12'
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -uo pipefail
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            node scripts/ci/stale-claim-detector.mjs --dry-run
          else
            node scripts/ci/stale-claim-detector.mjs
          fi

      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json
