name: tests
run-name: "Code checks and review · ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || github.ref_name }} · ${{ github.event.action || github.event_name }}"

# Il check-run che governa il merge di QUALUNQUE PR di questo repo.
#
# Dal 2026-09-03 questo file non contiene piu' solo i test: contiene l'INTERO
# cancello della PR — contratto del body, unit + closure gates, e la Claude
# review col suo verdetto. E' l'allineamento all'architettura del sito
# (valerielinc-ops/frontaliere-si-o-no#6571 e #6606), portata qui perche' i due
# repo condividono il ciclo agentico e la quota Claude.
#
# ## Perche' un job solo, e perche' proprio questo
#
# Prima il merge lo decideva un workflow dedicato all'auto-merge su LGTM, oggi
# rimosso: leggeva la review, il check `tests`, la collisione, e chiamava
# `gh pr merge`. Con l'auto-merge NATIVO di GitHub quella decisione non e' piu' nostra — e' il ruleset su `main`
# a dire quali check devono essere verdi. Un gate che vive in un workflow
# separato diventa quindi invisibile al ruleset: la PR mergerebbe con la review
# rossa, o senza review affatto. Ficcando il verdetto della review DENTRO il job
# che produce il check richiesto, un 🔴 Important rende rosso esattamente il
# check su cui l'auto-merge nativo aspetta. E' un irrigidimento del cancello, ed
# e' voluto.
#
# Lo stesso vale per il contratto del body: il workflow che lo verificava girava,
# poteva diventare rosso, e non fermava niente (identica misura sul sito, issue
# #5552). Ora e' uno step di questo job.
#
# ## Perche' esiste, invece di riusare generator-ci.yml
#
# `generator-ci.yml` e' path-scoped di proposito (`generator/**`,
# `package.json`, se' stesso): e' il gate del generatore, e farlo girare su ogni
# PR sarebbe sprecato. Ma il gate del merge ha un invariante non negoziabile —
# **mai mergiare su un check pending o MANCANTE**. Su un CI path-scoped una PR
# che tocca solo `.github/workflows/` o `scripts/ci/` non fa scattare
# `generator-ci`, quindi produce zero check-run, quindi non mergia mai. Non
# fallisce: resta ferma. Misurato sulla PR #12 («no checks reported»).
#
# Il gate ha quindi bisogno di un check che esista su OGNI PR, qualunque path
# tocchi. Costa poco: le gate del generatore sono dependency-free (`node:test`,
# `node:assert`), niente `npm ci`, niente browser.
#
# ## Il `name:` del job NON cambia, ed e' deliberato
#
# Il job fa quattro cose e si chiama ancora `tests (node --test)`. E' fuorviante
# ed e' l'opzione meno pericolosa: quel nome e' `CI_CHECK_NAME` in
# `scripts/ci/lib/constants.mjs`, lo legge `pr-autorebase.mjs` e lo REQUISISCE
# il ruleset su `main`. Rinominarlo significa un ruleset che aspetta un contesto
# che nessuno produce piu' — nessun errore, solo una coda che si ferma.
# `generator/tests/ci-check-name.test.mjs` confronta i due valori.
#
# ## Perche' `main` e' fra i trigger
#
# `pr-autorebase.mjs` ha un rescue `stuck-red` per la PR rossa a causa di un
# dato di `main` e non per colpa sua. Il suo ramo `red-main`
# (`scripts/ci/lib/vitestCheck.mjs`, `vitestFailureIsNotAttributableToPr`) chiede
# UNA prova: che esista una run COMPLETATA e `success` di **questo** workflow sul
# branch `main`, piu' recente del rosso della PR. La legge `mainTestsRuns()` da
# `actions/workflows/tests.yml/runs?branch=main` — l'endpoint e' keyed sul NOME
# DI QUESTO FILE, quindi nessun workflow affiancato puo' soddisfarlo.
#
# Il `push:` e' pero' scopato a `main` e non piu' aperto a tutti i branch: da
# quando la review vive qui dentro, un `push:` senza filtro produrrebbe DUE run
# per ogni commit su un branch con PR aperta (una da `push`, una da
# `pull_request`) — cioe' DUE review Claude sullo stesso codice, sulla quota
# condivisa col sito. Il segnale su `main` resta intatto; il doppione sparisce.
#
# Il gate sul CONTENUTO generato e' un'altra cosa e vive altrove
# (`.github/workflows/content-gates-main.yml`): li' gira il sottoinsieme dei
# gate che leggono `content/**`, con gli offender in una issue.
on:
  # Body edits must re-enter the code check: a corrected description is a new
  # review input even when the code HEAD is unchanged. Title/other edit
  # metadata may also produce a cheap rerun, but the guard below only re-arms
  # review for an actual body edit.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR aperta da verificare con il gate completo, inclusa la review Codex'
        required: false
        type: string

# Union dei permessi dei tre workflow fusi qui dentro: i test non ne chiedevano
# (default), `pr-body-contract` scriveva la sticky sulla PR, la review posta il
# proprio verdetto e i commenti di diagnosi.
permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write
  id-token: write

# `cancel-in-progress` e' vero OVUNQUE TRANNE che su `main`, e la differenza e'
# tutta nel consumatore. Su un branch conta solo l'ultimo push — e cancellare la
# run vecchia risparmia anche la review Claude che avrebbe girato su un codice
# gia' superato. Su `main` conta invece che una run ARRIVI IN FONDO:
# `mainTestsRuns()` filtra `status=completed` e `conclusion == success`, e una
# run cancellata non e' ne' l'uno ne' l'altro. Con `main` che avanza ogni ~8
# minuti per la generazione articoli, cancellare in corso vorrebbe dire tenere
# `total_count = 0` esattamente come prima, con un trigger in piu' a far credere
# il contrario.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'tests-main' || format('tests-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    # Questo `name:` DEVE combaciare byte-per-byte con `CI_CHECK_NAME`
    # (scripts/ci/lib/constants.mjs) E con il contesto richiesto dal ruleset su
    # `main`. Se divergono, il gate legge conclusion '' in silenzio e nessuna PR
    # mergia piu' — nessun errore, solo una coda che si ferma. Il guard test
    # `generator/tests/ci-check-name.test.mjs` confronta i due valori.
    name: tests (node --test)
    runs-on: ubuntu-latest
    # 10 minuti bastavano ai soli test; la review Claude no. Il timeout e' un
    # anti-runaway, non un budget: un job ucciso a meta' review fabbrica un
    # `cancelled`, che nessun `if: failure()` vede e che blocca il merge di PR
    # sane. Stesso valore del sito.
    timeout-minutes: 360
    env:
      # Path NON-code: rigenerati o pubblicati, mai reviewabili riga-per-riga.
      # `content/` e' il corpus articoli (14.888 file), `dist/` la superficie
      # API generata da scripts/build-api.mjs, `data/` gli input, `public/` gli
      # asset. Sorgente unica: re-review guard e tier-decision leggono questa
      # var, mai una regex duplicata.
      NONCODE_RE: '^(content/|data/|dist/|public/)|(^|/)(package-lock\.json)$|\.(snap|png|jpe?g|webp|gif|svg|ico|woff2?)$'
      # I test realistici del floor seguono la stessa semantica dei gate:
      # `before` per push su main, base.sha per una PR; solo dispatch/locale
      # ricade sul fallback HEAD^ del modulo.
      PREFLIGHT_EVENT_NAME: ${{ github.event_name }}
      PREFLIGHT_PUSH_BASE_REVISION: ${{ github.event.before }}
      PREFLIGHT_PR_BASE_REVISION: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          # I gate dei body usano il high-water della revisione precedente per
          # rifiutare un registro troncato; il checkout deve quindi esporre la
          # storia completa anche quando la PR non modifica `content/`.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # ══════════════════════════════════════════════════════════════════════
      # FAMIGLIA 1/3 — contratto del body (ex workflow `PR body contract`)
      #
      # Un contratto del body fallito ferma tutte le famiglie successive,
      # così la recovery dopo un edit può rieseguire subito il run concluso.
      # Negli altri casi restano le condizioni indipendenti delle famiglie.
      #
      # Due esclusioni, entrambe portate qui dal workflow che sostituisce:
      #  - le draft sono lavoro in corso, il body si completa prima di uscirne;
      #  - `engine-lockstep-auto` e' la PR del MIRROR dell'engine: il body lo
      #    genera il workflow del sito, non un agente di qui, e pretendere il
      #    contratto umano su di essa e' un errore di categoria.
      # ══════════════════════════════════════════════════════════════════════
      - name: PR-body completeness + multi-issue Closes (zero-Claude)
        id: body_contract
        if: >-
          ${{ !cancelled() &&
          ((github.event_name == 'pull_request' &&
            github.event.pull_request.draft == false &&
            github.event.pull_request.head.ref != 'engine-lockstep-auto') ||
           (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/pr-body-contract.mjs "${{ github.event.pull_request.number || inputs.pr_number }}"

      # ══════════════════════════════════════════════════════════════════════
      # FAMIGLIA 2/3 — unit + closure gates
      #
      # ── PERCHE' NON E' PIU' LA CARTELLA INTERA ───────────────────────────
      #
      # Questo e' il check-run che governa il merge di QUALUNQUE PR. Finche'
      # eseguiva tutta la cartella, eseguiva anche i gate che leggono
      # `content/` — il corpus generato dai bot, che cambia senza che nessuna PR
      # lo tocchi (~90 push al giorno su `main`).
      #
      # Misurato il 2026-08-19: l'articolo `vivere-villa-guardia-lavorare-ticino`
      # («Villa Guardia» e' un comune, «guardia» l'alias del mestiere
      # `agente-sicurezza`) ha reso rosso `article-topic-coverage-guard` su
      # `main` e su OGNI branch, e nessuna PR ha potuto auto-mergiare per sei
      # ore — per un dato che nessuna di loro aveva scritto e che nessuna poteva
      # riparare.
      #
      # La copertura non si perde, si sposta dove il segnale e' azionabile:
      # `generator-ci.yml` esegue l'INTERA cartella sulle PR che toccano
      # `generator/**`, e `content-gates-main.yml` li esegue sui push a `main`
      # aprendo UNA issue deduplicata invece di rendere rossa una PR che non
      # c'entra.
      #
      # Lo script esce !=0 senza stampare niente se la lista collassa: un
      # `node --test` su una lista vuota passerebbe verde avendo eseguito nulla.
      # Il glob non c'e' piu' ma la sua ragione resta: `node --test <dir>` su
      # Node 22 collassa la cartella in UN test fallito invece di scoprire i
      # file, quindi si passano i path uno per uno.
      # ══════════════════════════════════════════════════════════════════════
      - name: Unit + closure gates (i gate sul contenuto girano altrove)
        id: unit_gates
        if: ${{ steps.body_contract.outcome != 'failure' && !cancelled() }}
        run: |
          set -euo pipefail
          # The file list is produced by a trusted repository script; keep the
          # exact expansion consumed by the gate and silence SC2086 here.
          files=$(node scripts/ci/list-pr-gate-tests.mjs)
          # shellcheck disable=SC2086
          node --test $files

      # Baseline del manifest del ciclo: diff-scoped, non un `node --test`.
      # `checkBaselineProvenance()` scopre le baseline fantasma al cron
      # SUCCESSIVO, cioe' dopo il merge — e nel frattempo il verdetto a tre vie
      # su quella voce e' privo di significato (misurate 13 voci sulla #954, 6
      # delle quali dichiarate dopo l'apertura della issue che ne contava 7).
      # Qui si guardano le SOLE voci il cui `baseline` e' cambiato nella PR:
      # di norma zero, quindi zero rete. Vedi l'intestazione dello script per
      # l'asimmetria fra i due lati.
      # `steps.unit_gates.conclusion == 'success'` e non `!cancelled()` da solo:
      # dentro una famiglia la catena resta fail-fast (col rosso dei test questo
      # non gira), ma un rosso di un'ALTRA famiglia non deve saltarlo — che e'
      # la proprieta' che i workflow separati avevano e che va conservata.
      - name: Baseline verificabili nel manifest del ciclo (diff-scoped)
        if: ${{ steps.body_contract.outcome != 'failure' && !cancelled() && steps.unit_gates.conclusion == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/loop-baseline-pr-gate.mjs

      # ══════════════════════════════════════════════════════════════════════
      # FAMIGLIA 3/3 — Codex review + verdetto (ex workflow di review dedicato)
      #
      # Girava su `workflow_run[tests]` proprio per non spendere Claude su
      # codice rosso. Quel risparmio NON si perde: gli step qui sotto stanno
      # DOPO le due famiglie precedenti e la catena e' fail-fast, quindi con i
      # test rossi la review non parte comunque. Cio' che si guadagna e' che il
      # verdetto finisce nello stesso check-run che il ruleset richiede.
      #
      # Il rovescio del `workflow_run` era che il workflow eseguito era sempre
      # quello di `main`, quindi una PR che modificava il reviewer non mandava
      # in 401 la propria review. Da qui in poi lo fa: la copertura di quel caso
      # e' il drift-fallback deterministico dentro `scripts/ci/review-gate.mjs`
      # (autore fidato + completeness contract), e `REVIEW_WORKFLOW_DRIFT_FILES`
      # ora nomina QUESTO file.
      # ══════════════════════════════════════════════════════════════════════
      - name: Resolve PR
        id: resolve
        # `engine-lockstep-auto` e' la PR del mirror dell'engine, il cui
        # contenuto e' gia' stato reviewato SUL SITO prima di essere mirrorato.
        # Reviewarlo di nuovo qui spende quota condivisa per ripetere un
        # giudizio gia' dato — e un `## LGTM` negato bloccherebbe il canale con
        # cui le correzioni all'engine scendono.
        if: >-
          ${{ steps.body_contract.outcome != 'failure' &&
          ((github.event_name == 'pull_request' &&
            github.event.pull_request.draft == false &&
            github.event.pull_request.head.ref != 'engine-lockstep-auto') ||
           (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRN: ${{ github.event.pull_request.number || inputs.pr_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          title=$(gh pr view "$PRN" --repo "$REPO" --json title --jq '.title // ""' 2>/dev/null || true)
          if [ "${EVENT_NAME:-}" = 'workflow_dispatch' ]; then
            if ! details=$(gh pr view "$PRN" --repo "$REPO" --json state,isDraft,headRefName,headRefOid); then
              echo '::error::Impossibile risolvere la PR indicata dal workflow_dispatch.'
              exit 1
            fi
            state=$(printf '%s' "$details" | jq -r '.state // ""')
            is_draft=$(printf '%s' "$details" | jq -r '.isDraft // false')
            head_ref=$(printf '%s' "$details" | jq -r '.headRefName // ""')
            resolved_head=$(printf '%s' "$details" | jq -r '.headRefOid // ""')
            if [ "$state" != 'OPEN' ] || [ "$is_draft" = 'true' ] || [ "$head_ref" = 'engine-lockstep-auto' ]; then
              echo '::error::La PR indicata deve essere aperta, non draft e non engine-lockstep-auto.'
              exit 1
            fi
            if [ "$resolved_head" != "$HEAD_SHA" ]; then
              echo "::error::La PR #$PRN non punta alla HEAD del run ($HEAD_SHA): $resolved_head."
              exit 1
            fi
            HEAD_SHA="$resolved_head"
          fi
          {
            echo "pr_number=$PRN"
            echo "should_review=true"
            echo "head_sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"
          # Il titolo puo' contenere caratteri speciali → delimitatore heredoc.
          {
            echo "title<<__TITLE_EOF__"
            echo "$title"
            echo "__TITLE_EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "Risolto PR #$PRN sulla head $HEAD_SHA."

      # The body is an input to the reviewer, not executable content. Its
      # trusted API hash gives the durable claim ledger a new revision when a
      # body correction arrives on the same code HEAD.
      - name: Resolve review input revision (zero-Claude)
        id: review_input
        if: steps.body_contract.outcome != 'failure' && steps.resolve.outputs.should_review == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          BODY_FILE: ${{ runner.temp }}/review-body.txt
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq 'if type != "object" then error("PR response is not an object") elif (has("body") | not) then error("PR response has no body field") elif .body != null and (.body | type) != "string" then error("PR body is not a string or null") else (.body // "") end' \
            > "$BODY_FILE"; then
            echo "::error::PR body illeggibile → review input revision fail-closed."
            exit 1
          fi
          body_sha=$(sha256sum "$BODY_FILE" | awk '{print $1}')
          if ! printf '%s' "$body_sha" | grep -qE '^[a-f0-9]{64}$'; then
            echo "::error::Hash del review body non verificabile → review input revision fail-closed."
            exit 1
          fi
          echo "review_revision=body:$body_sha" >> "$GITHUB_OUTPUT"
          echo "Review input revision: body:$body_sha"

      # Re-review guard: una review terminale sulla STESSA HEAD e' gia' il
      # giudizio di questo contributo, anche se e' negativa o non contiene
      # `## LGTM`, salvo un body edit che introduce una nuova review revision.
      # Senza questo controllo ogni rerun/retry dello stesso rosso poteva
      # invocare Codex di nuovo. Su una HEAD nuova si conserva invece il
      # percorso incrementale: si guarda il delta dal contributo della review
      # piu' recente e si fa carry-forward solo quando il codice PR e' invariato.
      # Una risposta API illeggibile è un errore: senza prova del ledger non si
      # può spendere un altro turno Codex in sicurezza.
      - name: Re-review guard (skip Codex when no code changed since last LGTM)
        id: guard
        if: steps.body_contract.outcome != 'failure' && steps.resolve.outputs.should_review == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          REPO: ${{ github.repository }}
          REVIEW_REVISION: ${{ steps.review_input.outputs.review_revision }}
          BODY_EDITED: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.body != null }}
        run: |
          set -euo pipefail
          if ! reviews=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate --slurp 2>/dev/null); then
            echo "::error::Reviews API illeggibile → claim review fail-closed, nessun nuovo Codex."
            exit 1
          fi
          if ! printf '%s' "$reviews" | jq -e 'type == "array" and all(.[]; type == "array")' >/dev/null 2>&1; then
            echo "::error::Risposta Reviews API malformata → claim review fail-closed, nessun nuovo Codex."
            exit 1
          fi
          # Conta ogni review terminale del reviewer, non solo `## LGTM`:
          # un Important, una domanda o un nit senza LGTM e' comunque un
          # giudizio gia' emesso. Il fallback Codex vale solo con il marker
          # strutturale che il review-gate richiede per quel bot.
          # The contribution fingerprint stays strict for the incremental
          # carry-forward decision below. The claim ledger, however, also
          # needs a 64-hex identity when GitHub's compare response omits a
          # patch from a large PR: without one, even a first review could not
          # be claimed. In that case pin the claim to this HEAD only; the
          # UNKNOWN values below still force a full review and can never cause
          # a carry-forward skip.
          set_claim_fingerprint() {
            fpHead=$(node scripts/ci/pr-contribution-fingerprint.mjs "$HEAD_SHA" 2>/dev/null) || fpHead=UNKNOWN
            if printf '%s' "$fpHead" | grep -qE '^[a-f0-9]{64}$'; then
              echo "contribution_fingerprint=$fpHead" >> "$GITHUB_OUTPUT"
              return 0
            fi
            if ! printf '%s' "$HEAD_SHA" | grep -qE '^[a-f0-9]{40}$'; then
              echo "::error::HEAD SHA non verificabile → review claim fail-closed."
              exit 1
            fi
            if ! claimFingerprint=$(node -e 'const { createHash } = require("node:crypto"); process.stdout.write(createHash("sha256").update("review-claim-head-only:" + process.argv[1]).digest("hex"));' "$HEAD_SHA"); then
              echo "::error::Identità claim ancorata alla HEAD non calcolabile → review claim fail-closed."
              exit 1
            fi
            if ! printf '%s' "$claimFingerprint" | grep -qE '^[a-f0-9]{64}$'; then
              echo "::error::Identità claim ancorata alla HEAD malformata → review claim fail-closed."
              exit 1
            fi
            echo "::warning::Fingerprint del contributo non verificabile (compare troncato/errore) → claim ancorato alla HEAD; carry-forward disabilitato e review completa obbligatoria."
            echo "contribution_fingerprint=$claimFingerprint" >> "$GITHUB_OUTPUT"
          }

          same_head=$(printf '%s' "$reviews" | jq --arg head "$HEAD_SHA" --arg revision "$REVIEW_REVISION" '
            def has_current_revision($expected):
              [((.body // "") | split("\n")[] | rtrimstr("\r")
                | select(test("^<!-- REVIEW_INPUT_REVISION: body:[0-9a-f]{64} -->$"; "i"))
                | capture("^<!-- REVIEW_INPUT_REVISION: (?<revision>body:[0-9a-f]{64}) -->$"; "i").revision
                | ascii_downcase)] | unique as $revisions
              | (($revisions | length) == 1 and $revisions[0] == ($expected | ascii_downcase));
            [flatten[]
             | select((.state // "") != "PENDING")
             | select(.user.type == "Bot")
             | select(
                 ((.user.login // "") | test("^(claude|frontaliere-automation)";"i"))
                 or (((.user.login // "") | test("^github-actions\\[bot\\]$"; "i"))
                     and ((.body // "") | contains("<!-- CODEX_FALLBACK_REVIEW -->")))
               )
             | select(has_current_revision($revision))
             | select(.commit_id == $head)] | length'
          )
          if [ "${same_head:-0}" -gt 0 ] && [ "${BODY_EDITED:-false}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Esiste gia' una review terminale del reviewer sulla HEAD $HEAD_SHA → nessuna seconda review per lo stesso contributo."
            exit 0
          fi
          if [ "${same_head:-0}" -gt 0 ]; then
            echo "Review terminale presente sulla HEAD, ma il body della PR è cambiato → nuova review ammessa con revisione distinta."
          fi

          if [ "${BODY_EDITED:-false}" = "true" ]; then
            set_claim_fingerprint
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Body della PR cambiato → review completa sulla nuova revisione del review input."
            exit 0
          fi

          # Il fast-path incrementale parte solo da una review che porta la
          # revisione del body corrente. Se restasse una review del body
          # precedente, il suo compare potrebbe classificare il delta come
          # solo content/data e saltare Claude proprio dopo una correzione del
          # contratto; in quel caso si deve ripartire da una review piena.
          last=$(printf '%s' "$reviews" | jq -r --arg revision "$REVIEW_REVISION" '
            def has_current_revision($expected):
              [((.body // "") | split("\n")[] | rtrimstr("\r")
                | select(test("^<!-- REVIEW_INPUT_REVISION: body:[0-9a-f]{64} -->$"; "i"))
                | capture("^<!-- REVIEW_INPUT_REVISION: (?<revision>body:[0-9a-f]{64}) -->$"; "i").revision
                | ascii_downcase)] | unique as $revisions
              | (($revisions | length) == 1 and $revisions[0] == ($expected | ascii_downcase));
            [flatten[]
             | select((.state // "") != "PENDING")
             | select(.user.type == "Bot")
             | select(
                 ((.user.login // "") | test("^(claude|frontaliere-automation)";"i"))
                 or (((.user.login // "") | test("^github-actions\\[bot\\]$"; "i"))
                     and ((.body // "") | contains("<!-- CODEX_FALLBACK_REVIEW -->")))
               )
             | select(has_current_revision($revision))
            ] | sort_by(.id // 0) | last | .commit_id // empty' 2>/dev/null || true)
          if [ -z "$last" ]; then
            set_claim_fingerprint
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "Nessuna review terminale precedente → review piena."; exit 0
          fi
          if ! changed=$(gh api "repos/$REPO/compare/$last...$HEAD_SHA" --jq '.files[] | .filename, (.previous_filename // empty)' 2>/dev/null); then
            set_claim_fingerprint
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "Compare illeggibile → review piena con claim (conservativo)."; exit 0
          fi
          if [ -z "$changed" ]; then
            set_claim_fingerprint
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "Compare vuoto → review piena con claim (conservativo)."; exit 0
          fi
          code=$(echo "$changed" | node scripts/ci/review-test-policy.mjs filter | grep -vE "$NONCODE_RE" || true)
          if [ -z "$code" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Delta dall'ultima review terminale = solo content/data (nessun code) → skip Codex; il review gate conserva il verdetto applicabile."
            exit 0
          fi
          # Il compare 2-dot vede anche il codice che main ha portato con un
          # rebase — ma quello NON e' il contributo della PR. Si confronta
          # allora il fingerprint del contributo (3-dot vs merge-base,
          # code-only): se e' invariato, la PR non ha cambiato il proprio codice
          # → skip. Stessa funzione che usa il review gate per il carry-forward
          # → niente drift.
          set_claim_fingerprint
          # UNKNOWN è un fallback esplicito: un errore transitorio, un output
          # parziale o un hash malformato non può mai diventare un no-op solo
          # perché HEAD e l'ultima review terminale hanno ricevuto lo stesso fallback.
          fpHead=$(node scripts/ci/pr-contribution-fingerprint.mjs "$HEAD_SHA" 2>/dev/null) || fpHead=UNKNOWN
          fpLast=$(node scripts/ci/pr-contribution-fingerprint.mjs "$last" 2>/dev/null) || fpLast=UNKNOWN
          if ! printf '%s' "$fpHead" | grep -qE '^[a-f0-9]{64}$'; then fpHead=UNKNOWN; fi
          if ! printf '%s' "$fpLast" | grep -qE '^[a-f0-9]{64}$'; then fpLast=UNKNOWN; fi
          if [ "$fpHead" != 'UNKNOWN' ] && [ "$fpLast" != 'UNKNOWN' ] \
             && [ "$fpHead" = "$fpLast" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Contributo CODE invariato dall'ultima review terminale (fingerprint $fpHead) → skip Codex."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "Code del contributo cambiato (fpHead=$fpHead fpLast=$fpLast) → review piena."
          fi

      - name: Claim review PR + HEAD + contribution (zero-agent)
        id: review_claim
        if: steps.body_contract.outcome != 'failure' && steps.resolve.outputs.should_review == 'true' && steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CLAIM_ACTION: acquire
          CLAIM_KIND: review
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          EVENT_KEY: run:${{ github.run_id }}
          CONTRIBUTION_FINGERPRINT: ${{ steps.guard.outputs.contribution_fingerprint }}
          REVIEW_REVISION: ${{ steps.review_input.outputs.review_revision }}
          CLAIM_TTL_SEC: '3600'
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/ci/review-claim.mjs --claim

      - name: Fail closed when review claim is unreadable
        if: steps.body_contract.outcome != 'failure' && steps.review_claim.outputs.claim_error == 'true'
        run: |
          echo "::error::Claim review PR+HEAD+contribution illeggibile o non verificabile → nessun nuovo Codex."
          exit 1

      - name: Skip already-consumed review contribution (zero-agent)
        if: steps.body_contract.outcome != 'failure' && steps.review_claim.outputs.claim_allowed != 'true' && steps.review_claim.outputs.claim_error != 'true'
        run: echo "Review già acquisita per questa PR+HEAD+contribution → nessun secondo Codex."

      - name: Determine review tier
        id: tier
        if: steps.body_contract.outcome != 'failure' && steps.resolve.outputs.should_review == 'true' && steps.guard.outputs.skip != 'true' && steps.review_claim.outputs.claim_allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          REPO: ${{ github.repository }}
          REVIEW_REVISION: ${{ steps.review_input.outputs.review_revision }}
        # Il tier si decide SOLO sul codice. Funnel-critical qui significa: cio'
        # che produce o rende la superficie pubblicata che il sito consuma —
        # `engine/` (rende le pagine articolo), `host/` (l'altra meta' del
        # SiteShellContract), `generator/` (genera gli articoli), gli script che
        # emettono `dist/api/`, e i workflow. Un bug li' esce live senza che il
        # sito faccia un deploy, quindi il probing rigoroso paga.
        #
        # I cap turni NON sono un budget di lavoro: sono un anti-runaway sopra
        # il p99 dei run sani. Un run che muore al cap brucia la quota intera e
        # lascia la PR ferma senza verdetto — peggio di qualche turno in piu'.
        run: |
          set -euo pipefail
          set_tier() {
            {
              echo "tier=$1"
              echo "model=$2"
              echo "max_turns=$3"
            } >> "$GITHUB_OUTPUT"
            echo "Review tier: $1 ($2, max-turns $3)"
          }
          # `gh pr view --json files` TRONCA a 100 file senza dirlo, e su questo
          # repo una PR che rigenera il corpus ne ha migliaia: il tier si
          # deciderebbe su un campione, e con >100 file `content/` in testa
          # all'alfabeto la lista code uscirebbe vuota → `minimal` su una PR che
          # tocca `engine/`. `fetch-pr-files.mjs` pagina davvero e dichiara se
          # l'elenco e' completo.
          result=$(node scripts/ci/fetch-pr-files.mjs --repo "$REPO" --pr "$PR_NUMBER" 2>/dev/null || echo '{}')
          expected=$(echo "$result" | jq -r '.expected // 0')
          count=$(echo "$result" | jq -r '.count // 0')
          files_complete=$(echo "$result" | jq -r 'if .complete then 1 else 0 end')
          reason=$(echo "$result" | jq -r '.reason // "unknown"')
          files=$(echo "$result" | jq -r '(.files // [])[]')
          # `&& files_complete = 1` non e' ridondante: un elenco vuoto puo' voler
          # dire «zero file davvero» oppure «il fetch e' andato muto», e senza
          # questa congiunzione il secondo caso sceglierebbe `normal`
          # scavalcando il guard di incompletezza qui sotto.
          if [ -z "$files" ] && [ "$files_complete" = "1" ]; then
            echo "Lista file vuota (PR rebase-only o vuota)."
            set_tier normal gpt-5.6-luna 35
            exit 0
          fi
          # Elenco incompleto: il tier NON si decide su un campione.
          if [ "$files_complete" != "1" ]; then
            echo "Elenco file INCOMPLETO ($count/$expected, causa: $reason) → tier high forzato: niente minimal, niente decisione funnel su un campione."
            set_tier high gpt-5.6-luna 60
            exit 0
          fi
          if printf '%s' "$result" | node scripts/ci/review-test-policy.mjs only; then
            if node scripts/ci/review-test-policy.mjs check; then
              set_tier tests-only none 0
            else
              # Includes a rename from application code or an uncertain snapshot.
              set_tier high gpt-5.6-luna 60
            fi
            exit 0
          fi
          code_files=$(echo "$files" | node scripts/ci/review-test-policy.mjs filter | grep -vE "$NONCODE_RE" || true)
          if [ -z "$code_files" ]; then
            # Una PR di soli articoli/dati non ha contributo reviewabile: resta
            # da verificare solo il contratto del body. E' il caso PIU' FREQUENTE
            # su questo repo, dove i workflow di generazione committano corpus.
            echo "PR di soli content/data (nessun codice toccato) → tier minimal."
            set_tier minimal gpt-5.6-luna 12
            exit 0
          fi
          # funnel_crit <file-list> → exit 0 se la lista contiene codice
          # funnel-critical. Come sul sito, gli helper CI/dev e gli audit
          # read-only sono ESCLUSI: verificano soltanto, non emettono nulla.
          funnel_crit() {
            local fs="$1" a b
            a=$(echo "$fs" | grep -E '^(generator/|engine/|host/|\.github/workflows/)' || true)
            b=$(echo "$fs" | grep -E '^scripts/' | grep -vE '^scripts/(ci|dev)/' | grep -viE '(audit|analytics|report)' || true)
            [ -n "$a$b" ]
          }

          # Re-review incrementale: se esiste gia' una review Claude su un commit
          # precedente, si valuta SOLO il delta, non l'intera PR.
          lastRev=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate --slurp 2>/dev/null \
            | jq -r --arg revision "$REVIEW_REVISION" '
              def has_current_revision($expected):
                [((.body // "") | split("\n")[] | rtrimstr("\r")
                  | select(test("^<!-- REVIEW_INPUT_REVISION: body:[0-9a-f]{64} -->$"; "i"))
                  | capture("^<!-- REVIEW_INPUT_REVISION: (?<revision>body:[0-9a-f]{64}) -->$"; "i").revision
                  | ascii_downcase)] | unique as $revisions
                | (($revisions | length) == 1 and $revisions[0] == ($expected | ascii_downcase));
              [flatten[]
               | select((.state // "") != "PENDING")
               | select(.user.type == "Bot")
               | select(
                   ((.user.login // "") | test("^(claude|frontaliere-automation)";"i"))
                   or (((.user.login // "") | test("^github-actions\\[bot\\]$"; "i"))
                       and ((.body // "") | contains("<!-- CODEX_FALLBACK_REVIEW -->")))
                 )
               | select(has_current_revision($revision))
              ] | sort_by(.id // 0) | last | .commit_id // empty' 2>/dev/null || true)
          if [ -n "$lastRev" ] && [ "$lastRev" != "$HEAD_SHA" ]; then
            delta_code=$(gh api "repos/$REPO/compare/$lastRev...$HEAD_SHA" --jq '.files[] | .filename, (.previous_filename // empty)' 2>/dev/null \
              | grep -Fxf <(echo "$code_files") || true)
            if [ -n "$delta_code" ]; then
              echo "incremental_base=$lastRev" >> "$GITHUB_OUTPUT"
              echo "Re-review incrementale: solo il delta dei file PR da $lastRev:"; echo "$delta_code"
              if funnel_crit "$delta_code"; then
                set_tier incremental-high gpt-5.6-luna 35
              else
                set_tier incremental gpt-5.6-luna 35
              fi
              exit 0
            fi
            echo "Nessun delta-code nei file PR dall'ultima review → review piena."
          fi

          code_file_count=$(echo "$code_files" | grep -c . || true)
          if funnel_crit "$code_files"; then
            if [ "$code_file_count" -ge 25 ]; then
              set_tier high-mega gpt-5.6-luna 90
            else
              set_tier high gpt-5.6-luna 60
            fi
          else
            set_tier normal gpt-5.6-luna 35
          fi

      # NIENTE proxy di compressione su questo step, e non e' una dimenticanza.
      # Il gemello sul sito ne monta uno; qui no, per la stessa ragione per cui
      # il proprietario lo ha scartato lato sessione il 2026-09-03: comprime in
      # modo LOSSY cio' che i tool restituiscono al modello, e su questo repo il
      # prodotto del reviewer sono le MISURE — il conteggio in `manifest.json`,
      # le righe di un log che distinguono un rosso vero da un falso rosso. Il
      # risparmio di token non paga il rischio di un verdetto dato su un input
      # potato. Resta montato su `issue-fix`/`issue-decompose`, dove esisteva
      # gia': toglierlo di la' e' una decisione separata, non un effetto
      # collaterale di questa.

      # Prefetch zero-Claude: si scarica UNA volta cio' che il prompt farebbe
      # rifare turno-per-turno. Costo Claude nullo, puro bash — e sui transcript
      # del sito il setup ripetuto era il primo consumatore di turni.
      #
      # Gira su TUTTI i tier, `minimal` compreso: quel tier legge `pr.json` e la
      # lista file, e saltare lo step lasciava il reviewer senza il suo unico
      # input (misura del sito, #6205). Cio' che su `minimal` resta saltato e'
      # il `gh pr diff`, che su una PR di corpus puo' essere enorme.
      - name: Prefetch review context (zero-Claude, saves turns)
        id: prefetch
        if: steps.body_contract.outcome != 'failure' && steps.tier.outputs.tier != 'tests-only' && steps.resolve.outputs.should_review == 'true' && steps.guard.outputs.skip != 'true' && steps.review_claim.outputs.claim_allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          INCREMENTAL_BASE: ${{ steps.tier.outputs.incremental_base }}
          REPO: ${{ github.repository }}
          CTX_DIR: ${{ runner.temp }}/review-ctx
          TIER: ${{ steps.tier.outputs.tier }}
          REVIEW_DIFF_EXCLUSIONS: content,data,dist,public
        run: |
          set -uo pipefail
          mkdir -p "$CTX_DIR"
          gh pr view "$PR_NUMBER" --repo "$REPO" --json title,body,labels > "$CTX_DIR/pr.json" \
            || echo '{}' > "$CTX_DIR/pr.json"
          # L'elenco vero passa dalla REST paginata, non dal campo `files` del
          # payload GraphQL, che tronca a 100 senza dirlo.
          gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' \
            > "$CTX_DIR/files.txt" 2>/dev/null || : > "$CTX_DIR/files.txt"
          # Gli --exclude sono la ragione per cui una PR con 500 articoli
          # rigenerati non fa esplodere il diff: `content/` da solo ha 14.888
          # file. Su `minimal` il diff e' vuoto per costruzione; su una review
          # incrementale il diff completo e' inutile e puo' essere enorme.
          if [ "${TIER:-}" = "minimal" ]; then
            : > "$CTX_DIR/diff.patch"
          else
            # Resolve/hydrate the complete scoped patch on the host. A missing
            # patch must fail here, not force the model to rebuild it via API.
            node scripts/ci/prefetch-review-diff.mjs || exit 1
          fi
          # Claude non ha bisogno dell'elenco completo dei file di corpus: per la
          # review servono il body, il diff code e i file code toccati.
          node scripts/ci/review-test-policy.mjs filter < "$CTX_DIR/files.txt" | grep -vE "$NONCODE_RE" > "$CTX_DIR/code-files.txt" || : > "$CTX_DIR/code-files.txt"
          if [ -n "${INCREMENTAL_BASE:-}" ]; then
            node scripts/ci/review-test-policy.mjs filter < "$CTX_DIR/delta-files.txt" | grep -vE "$NONCODE_RE" > "$CTX_DIR/review-code-files.txt" || : > "$CTX_DIR/review-code-files.txt"
          else
            cp "$CTX_DIR/code-files.txt" "$CTX_DIR/review-code-files.txt"
          fi
          # Unico input Claude: una fotografia deterministica del contesto gia'
          # raccolto, cosi' il reviewer fa un solo Read iniziale e non
          # ricostruisce il contesto con gh/grep in turni successivi.
          {
            echo "# PR review bundle"
            echo
            echo "## Metadata"
            echo "- PR: #$PR_NUMBER"
            echo "- HEAD: $HEAD_SHA"
            echo "- Tier: ${TIER:-unknown}"
            echo "- Incremental base: ${INCREMENTAL_BASE:-none}"
            echo "- Changed file entries: $(wc -l < "$CTX_DIR/files.txt")"
            echo "- Changed code file entries (full PR, tier only): $(wc -l < "$CTX_DIR/code-files.txt")"
            echo "- Review code file entries (delta-scoped when incremental): $(wc -l < "$CTX_DIR/review-code-files.txt")"
            echo "- Code diff lines: $(wc -l < "$CTX_DIR/diff.patch")"
            echo
            echo "## PR metadata"
            cat "$CTX_DIR/pr.json"
            echo
            echo "## Changed code-file list"
            cat "$CTX_DIR/review-code-files.txt"
            echo
            echo "## Code-only diff"
            cat "$CTX_DIR/diff.patch"
            echo
            echo "## Incremental delta"
            if [ -f "$CTX_DIR/delta.patch" ]; then cat "$CTX_DIR/delta.patch"; else echo "No incremental base: this is a full review."; fi
          } > "$CTX_DIR/review-bundle.md"
          echo "Contesto prefetchato in $CTX_DIR:"
          ls -la "$CTX_DIR"

      # Codex Luna Max è la corsia primaria della review. Questo probe conserva
      # la telemetria della vecchia quota senza trasformarla in un mutex che può
      # saltare la review: un consumer occupato non deve lasciare il gate senza
      # verdetto.
      - name: Pre-flight — Codex lane quota telemetry
        id: quota
        if: steps.body_contract.outcome != 'failure' && steps.tier.outputs.tier != 'tests-only' && steps.resolve.outputs.should_review == 'true' && steps.guard.outputs.skip != 'true' && steps.review_claim.outputs.claim_allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CODEX_FALLBACK_MODE: '1'
        run: node scripts/ci/check-quota-backoff.mjs

      - name: Publish automatic LGTM for a tests-only PR
        id: test_only_review
        if: ${{ steps.body_contract.outcome != 'failure' && success() && steps.resolve.outputs.should_review == 'true' && steps.guard.outputs.skip != 'true' && steps.tier.outputs.tier == 'tests-only' && steps.review_claim.outputs.claim_allowed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          REVIEW_REVISION: ${{ steps.review_input.outputs.review_revision }}
        run: node scripts/ci/review-test-policy.mjs post

      - name: Prepare Firebase credentials for Codex review
        if: steps.body_contract.outcome != 'failure' && steps.tier.outputs.tier != 'tests-only' && steps.resolve.outputs.should_review == 'true' && steps.guard.outputs.skip != 'true' && steps.review_claim.outputs.claim_allowed == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/codex-firebase-sa.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/codex-firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_JSON assente: il bridge corpus non potrà caricare il PAT da Remote Config"
          fi

      - name: Load cross-repo Codex credentials
        if: steps.body_contract.outcome != 'failure' && steps.tier.outputs.tier != 'tests-only' && steps.resolve.outputs.should_review == 'true' && steps.guard.outputs.skip != 'true' && steps.review_claim.outputs.claim_allowed == 'true'
        continue-on-error: true
        run: node generator/scripts/load-rc-env.mjs

      - name: Run Codex Luna Max review
        # Tetto sullo step (stessa classe del tetto sulla lane di fix in
        # issue-fix.yml). Qui il cap del job e' 360min ed e' CONDIVISO con la
        # suite `node --test`: un reviewer appeso se lo mangia tutto e il job
        # muore `cancelled` — che nessun `if: failure()` vede e che lascia il
        # check-run richiesto dal ruleset senza conclusione, fermando il merge
        # di PR sane. Misurato su questo repo il 2026-09-06, 17 review reali:
        # 188s min, 373s max. 45min sono ~7x il massimo, quindi non toccano
        # nessuna review vera; col `continue-on-error` qui sotto lo scadere non
        # tinge il job di rosso, lo lascia classificare al guard.
        timeout-minutes: 45
        id: codex_review
        if: steps.body_contract.outcome != 'failure' && steps.tier.outputs.tier != 'tests-only' && steps.resolve.outputs.should_review == 'true' && steps.guard.outputs.skip != 'true' && steps.review_claim.outputs.claim_allowed == 'true'
        # Un fallimento dell'action non deve abortire il job prima che il guard
        # sotto possa classificarlo: e' il guard a decidere se fallire forte.
        continue-on-error: true
        uses: ./.github/actions/claude-codex-fallback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          PR_TITLE: ${{ steps.resolve.outputs.title }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          REVIEW_TIER: ${{ steps.tier.outputs.tier }}
          INCREMENTAL_BASE: ${{ steps.tier.outputs.incremental_base }}
        with:
          # This corpus repo has no installation of the site's GitHub App. Use
          # the explicit run token only for the current-repository review so
          # the accepted reviewer identity remains github-actions[bot]. The
          # PAT loaded from Remote Config stays separate for corpus/cross-repo
          # operations; neither token is an implicit fallback for the other.
          codex_github_token: ${{ secrets.GITHUB_TOKEN }}
          codex_corpus_github_token: ${{ env.GITHUB_PAT_NANAKO || env.GITHUB_PAT }}
          codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}
          review_marker: '<!-- CODEX_FALLBACK_REVIEW -->'
          prompt: |
            Test files are excluded from review by owner policy: do not read, probe or raise findings on tests, including during cross-file analysis.
            Report the exact workflow tier `${{ steps.tier.outputs.tier }}` in Scope; this classifies review scope, not model reasoning effort.
            Reviewer automatico PR #${{ steps.resolve.outputs.pr_number }} (HEAD ${{ steps.resolve.outputs.head_sha }}). Tier: ${{ steps.tier.outputs.tier }}.
            Questa review vale esclusivamente per la revisione input `${{ steps.review_input.outputs.review_revision }}`. La review che posti DEVE contenere, come riga propria e senza modificarlo, il marker esatto `<!-- REVIEW_INPUT_REVISION: ${{ steps.review_input.outputs.review_revision }} -->`; senza quel marker il gate non può accettare alcun verdetto.

            Questo repo (`frontaliere-articles`) pubblica una superficie dati su HTTP che il sito consuma in produzione: `dist/api/` (manifest, articles.json, meta per locale, slugs, sitemap blog, dieci feed RSS, news-ticker). Un bug in cio' che la genera esce **live senza che il sito faccia un deploy** — non c'e' una build del sito a fare da rete.

            Leggi `REVIEW.md`: e' l'unica fonte di verita' per severity, scope, check richiesti e formato. NON leggere `AGENTS.md` salvo che REVIEW.md richieda un non-negotiable preciso.

            Il bundle deterministico e' gia' pronto in `${{ runner.temp }}/review-ctx/`: `review-bundle.md` e' l'input primario e contiene metadata della PR, la lista dei file code in scope, il diff del solo codice, il delta incrementale quando c'e'. I path rigenerati (`content/`, `data/`, `dist/`, `public/`) sono deliberatamente esclusi: non sono codice, non vanno reviewati riga-per-riga ne' contati come finding — valuta solo se il codice che li genera e' corretto. Leggi il bundle PRIMA di usare gh o gli strumenti sul repo, e non rieseguire `gh pr view`, `gh pr diff` o `gh api compare` salvo che il bundle dichiari incompleta una sezione.

            **Tier `minimal` (PR di soli content/data, ZERO code) — percorso corto, ≤6 turni:** NON leggere `REVIEW.md`, niente cross-file probing, niente adversarial check (no-op senza codice). Fai SOLO: leggi il bundle; verifica il contratto del body (`## Implementato` e `## Non implementato (ancora)` presenti, ogni bullet sensato, nessun placeholder vuoto o `TBD`); se e' a posto posta una review breve che chiude con `## LGTM`, altrimenti `🟡` (o `🔴 Important` se grave) e NIENTE `## LGTM`. Fermati dopo aver postato.

            Se `INCREMENTAL_BASE` e' valorizzato, revieva SOLO il delta e le sue interazioni: i commit fino a quel punto sono gia' stati approvati. Sei comunque autorizzato a Read/grep i file pieni per il CONTESTO — l'obiettivo e' non rispendere token su codice gia' approvato, non chiudere gli occhi sulle interazioni.

            **Disciplina turni (budget rigido, tutti i tier tranne `minimal`):** hai ${{ steps.tier.outputs.max_turns }} turni. Un messaggio con tool-call = 1 turno indipendentemente da quanti tool_use contiene, quindi le probe indipendenti vanno emesse in parallelo nello stesso messaggio, mai una per turno. `PR_NUMBER`/`HEAD_SHA`/`INCREMENTAL_BASE` sono gia' nell'env: mai spendere un turno per rileggerli. Il checkout NON ha `node_modules`: niente `npm`/`npx`/test runner, il verdetto si basa sulla lettura statica. Entro cinque turni dal cap DEVI aver postato la review: se hai ancora verifiche aperte, postale come `❓ q:` invece di continuare a probeare. Una review postata con un `❓` sblocca il loop; una review MAI postata brucia il run intero senza verdetto.

            **Workflow di review come da REVIEW.md:** completeness contract → `Implementato` con occhio critico → `Non implementato` filtro scopo → scope drift → ripetizione di pattern cross-file → conformita' al piano di test → claim di performance non validati → output.
            - Tier `high`, `high-mega` o `incremental-high`: aggiungi una sezione `## Adversarial check` con esattamente 3 rischi REALI non verificati, prima del summary. Mai «manca un test».
            - Sezioni mancanti + tier `high`/`high-mega`: posta il 🔴 process MA NON terminare — prosegui con la review sostanziale nello stesso pass. Solo il tier normal puo' terminare al process gate.
            - Escalation ❓ su cio' che tocca la superficie pubblicata: un `❓ q` il cui soggetto impatta `dist/api/`, le sitemap, i feed RSS, gli slug o i canonical va promosso a 🔴 oppure aperto come follow-up issue e linkato. Mai un ❓ passivo accanto a `## LGTM`: li' un errore e' gia' in produzione.
            - Niente finding «manca un test»: elenca rischi di COMPORTAMENTO non verificati. Eccezione: un BUG in un test ESISTENTE (assertion o regex leaky, fixture con date assolute).

            Se il bundle elenca un Important storico sul contratto del body con un anchor `PR body:L<n>`, quando lo hai risolto devi riportare la conferma in forma esatta `Fix di \`PR body:L<n>\`: ok.` (una riga per ogni anchor), prima di `Important: 0` e `## LGTM`; non sostituirla con una parafrasi del bullet. Per un Important senza anchor di file o body usa invece il testo normalizzato richiesto dal bundle, sempre dentro i backtick della conferma.

            Posta ESATTAMENTE una review con `gh pr review ${PR_NUMBER} --comment --body "<markdown nel formato di REVIEW.md>"`. Chiudi con `## LGTM` solo quando non c'e' un `🔴 Important` aperto, nessuna domanda funnel-critical irrisolta e il contratto del body e' valido. Incerto → `❓ q:`, mai speculazione. Lavora read-only: niente edit, commit, push, npm o test. Fermati subito dopo aver postato.

      # La review Codex puo' uscire 0 anche quando il run e' abortito su un
      # errore API transiente SENZA aver postato una review: il job sembra verde
      # ma la PR si ferma in silenzio. Si classifica dal log di esecuzione.
      - name: Fail on transient API error (no review posted)
        id: review_abort
        if: steps.body_contract.outcome != 'failure' && steps.tier.outputs.tier != 'tests-only' && always() && steps.resolve.outputs.should_review == 'true' && steps.guard.outputs.skip != 'true' && steps.review_claim.outputs.claim_allowed == 'true' && steps.codex_review.outputs.primary_success != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          REVIEW_OUTCOME: ${{ steps.codex_review.outcome }}
          CODEX_DIAGNOSTICS_FILE: ${{ steps.codex_review.outputs.codex_diagnostics_file }}
          CODEX_PRIMARY_SUCCESS: ${{ steps.codex_review.outputs.primary_success }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVIEW_TIER: ${{ steps.tier.outputs.tier }}
          REVIEW_MAX_TURNS: ${{ steps.tier.outputs.max_turns }}
          REVIEW_REVISION: ${{ steps.review_input.outputs.review_revision }}
          VERDICT_EVIDENCE_FILE: ${{ runner.temp }}/codex-verdict-evidence-${{ github.run_id }}-${{ github.run_attempt }}.md
        run: |
          set -uo pipefail
          set_review_output() {
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"
          }
          set_review_output review_aborted false
          set_review_output review_abort_cause none
          set_review_output retryable_failure false
          set_review_output permanent_failure false
          set_review_output verdict_evidence_file ''
          write_verdict_evidence() {
            local evidence_file="${VERDICT_EVIDENCE_FILE:-${RUNNER_TEMP:-/tmp}/codex-verdict-evidence-${RUN_ID:-$$}.md}"
            if ! EVIDENCE_FILE="$evidence_file" \
              EVIDENCE_TRIGGER='codex-primary' \
              FALLBACK_STATUS='success' \
              FALLBACK_DETAIL='codex-review-posted-after-max-turns' \
              GITHUB_OUTPUT=/dev/null \
              node scripts/ci/claude-codex-fallback.mjs >/dev/null 2>&1; then
              return 1
            fi
            if [ ! -s "$evidence_file" ]; then
              return 1
            fi
            set_review_output verdict_evidence_file "$evidence_file"
          }
          if [ "${CODEX_PRIMARY_SUCCESS:-false}" = 'true' ]; then
            echo "Codex primary riuscito: nessuna failure da classificare."
            exit 0
          fi
          # Codex viene eseguito con --json: il file è lo stream strutturato
          # della stessa action, non l'output Claude (vuoto nel percorso
          # Codex-only). Il classificatore è conservativo e restituisce una
          # causa esplicita prima che il claim decida retry o terminale.
          CLASSIFICATION_JSON=''
          if [ "${REVIEW_OUTCOME:-}" = 'cancelled' ]; then
            CLASSIFICATION_JSON='{"cause":"cancelled","numTurns":null,"source":"outcome"}'
          elif [ -n "${CODEX_DIAGNOSTICS_FILE:-}" ] && [ -f "${CODEX_DIAGNOSTICS_FILE}" ]; then
            if ! CLASSIFICATION_JSON=$(node scripts/ci/classify-codex-review-failure.mjs "${CODEX_DIAGNOSTICS_FILE}" "${REVIEW_OUTCOME:-}"); then
              set_review_output review_abort_cause probe_failed
              set_review_output permanent_failure true
              echo "::error::Impossibile classificare lo stream diagnostico Codex."
              exit 0
            fi
          else
            set_review_output review_abort_cause probe_failed
            set_review_output permanent_failure true
            echo "::error::Stream diagnostico Codex assente: failure non classificata, nessun autorebase automatico."
            exit 0
          fi
          if ! CLASSIFICATION_CAUSE=$(printf '%s' "$CLASSIFICATION_JSON" | jq -er '.cause // empty') \
            || [ -z "$CLASSIFICATION_CAUSE" ]; then
            set_review_output review_abort_cause probe_failed
            set_review_output permanent_failure true
            echo "::error::Classificazione Codex malformata: nessun autorebase automatico."
            exit 0
          fi
          NUM_TURNS=$(printf '%s' "$CLASSIFICATION_JSON" | jq -r 'if .numTurns == null then "?" else (.numTurns | tostring) end')

          # max_turns PRIMA di 429/5xx: il terminal marker è più specifico dei
          # campi di telemetria condivisi. Anche Codex può aver postato la review
          # nell'ultimo turno, quindi controlliamo HEAD, revisione body e marker
          # Codex prima di classificare l'abort.
          if [ "$CLASSIFICATION_CAUSE" = 'max_turns' ]; then
            # Il cap dei turni non prova da solo l'assenza di un verdetto: Codex
            # puo' aver gia' inviato la review e consumare l'ultimo turno mentre
            # chiude la propria esecuzione. Verifichiamo la HEAD e la finestra di
            # questa run prima di marchiare l'abort, altrimenti un 🔴 reale viene
            # trasformato in «nessun finding» dal ciclo di autorebase (#1185).
            if RUN_STARTED_AT=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.run_started_at // empty' 2>/dev/null); then
              :
            else
              set_review_output review_abort_cause probe_failed
              set_review_output permanent_failure true
              echo "::error::Impossibile interrogare la Actions API per run_started_at: max_turns non classificato come abort senza verdetto."
              exit 0
            fi
            REVIEWS=''
            if [ -z "${RUN_STARTED_AT:-}" ]; then
              set_review_output review_abort_cause probe_failed
              set_review_output permanent_failure true
              echo "::error::Impossibile leggere run_started_at dalla Actions API: max_turns non classificato come abort senza verdetto."
              exit 0
            fi

            # La review REST puo' diventare visibile alcuni secondi dopo il
            # termine dell'action: tre probe bounded evitano di scambiare la
            # consistenza eventuale per assenza di verdetto.
            for attempt in 1 2 3; do
              if REVIEWS=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100" --paginate --slurp 2>/dev/null); then
                :
              else
                PROBE_STATUS=$?
                if [ "$attempt" -eq 3 ]; then
                  set_review_output review_abort_cause probe_failed
                  set_review_output permanent_failure true
                  echo "::error::Impossibile interrogare la Reviews API dopo tre tentativi (status=${PROBE_STATUS}): max_turns non classificato come abort senza verdetto."
                  exit 0
                fi
                echo "::warning::Probe della Reviews API fallita (tentativo ${attempt}, status=${PROBE_STATUS}); ritento prima di classificare max_turns."
                sleep 2
                continue
              fi
              if [ -n "${REVIEWS:-}" ] && jq -e --arg head_sha "$HEAD_SHA" --arg run_started_at "$RUN_STARTED_AT" --arg review_revision "$REVIEW_REVISION" '
                def has_current_revision($expected):
                  [((.body // "") | split("\n")[] | rtrimstr("\r")
                    | select(test("^<!-- REVIEW_INPUT_REVISION: body:[0-9a-f]{64} -->$"; "i"))
                    | capture("^<!-- REVIEW_INPUT_REVISION: (?<revision>body:[0-9a-f]{64}) -->$"; "i").revision
                    | ascii_downcase)] | unique as $revisions
                  | (($revisions | length) == 1 and $revisions[0] == ($expected | ascii_downcase));
                flatten | any(.[]?;
                  (.user.type == "Bot")
                  and (
                    ((.user.login // "") | test("^(claude|frontaliere-automation)";"i"))
                    or (
                      (.user.login // "") == "github-actions[bot]"
                      and ((.body // "") | contains("<!-- CODEX_FALLBACK_REVIEW -->"))
                    )
                  )
                  and .commit_id == $head_sha
                  and (.submitted_at // "") >= $run_started_at
                  and has_current_revision($review_revision)
                )
              ' <<<"$REVIEWS" >/dev/null 2>&1; then
                if ! write_verdict_evidence; then
                  set_review_output review_abort_cause probe_failed
                  set_review_output permanent_failure true
                  echo "::error::Review Codex verificata ma evidenza di verdetto non scrivibile: nessun gate carry-forward automatico."
                  exit 0
                fi
                set_review_output review_abort_cause verdict_posted
                echo "::warning::Review Codex pubblicata sulla HEAD in questa run; max_turns non e' un abort senza verdetto. Il review gate valuta la review appena postata."
                exit 0
              fi
              [ "$attempt" -eq 3 ] || sleep 2
            done
            set_review_output review_aborted true
            set_review_output review_abort_cause max_turns
            set_review_output retryable_failure true
            # The Markdown backticks and literal shell text are intentional.
            # ShellCheck otherwise treats them as an interpolated expression.
            # shellcheck disable=SC2016
            BODY=$(printf '⚠️ **Review automatica fallita** (`terminal_reason=max_turns`, tier `%s`, cap %s turni, usati %s): Codex ha esaurito il budget prima di postare un verdetto. Nessuna review pubblicata — il check di questo job resta rosso e l auto-merge non puo scattare.\n\nLog: %s\n\nPer sbloccare: rilancia il run di `tests` piu recente di questa PR, oppure fai la review a mano col contratto di `REVIEW.md`.\n\nSe questa PR ha gia avuto una morte `max_turns`, un retry raramente basta: valuta di splittarla.' "${REVIEW_TIER:-?}" "${REVIEW_MAX_TURNS:-?}" "${NUM_TURNS:-?}" "$RUN_URL")
            gh pr comment "$PR_NUMBER" --body "$BODY" || echo "::warning::gh pr comment fallito (non bloccante)."
            echo "::error::Review Codex morta su max-turns (tier=${REVIEW_TIER:-?}, cap=${REVIEW_MAX_TURNS:-?}, turni=${NUM_TURNS:-?}) senza postare — rilancia, o splitta la PR se ricorre."
            exit 1
          fi
          # 429: rendi l'abort visibile nella Jobs API. GITHUB_OUTPUT non fa
          # parte di `jobs/{job_id}`: il consumer puo' quindi distinguere il
          # rate-limit soltanto dalla conclusion dello step. Il job sarebbe
          # gia' rosso per il review gate sotto; questa failure non aggiunge un
          # re-run, ma permette al consumer di classificarlo come abortito.
          if [ "$CLASSIFICATION_CAUSE" = 'rate_limit' ]; then
            set_review_output review_aborted true
            set_review_output review_abort_cause rate_limit
            set_review_output retryable_failure true
            echo "::warning::Review Codex abortita su 429 (quota). Il review gate blocchera' comunque il merge; questa failure rende il segnale leggibile al consumer."
            exit 1
          fi
          if [ "$CLASSIFICATION_CAUSE" = 'server_error' ]; then
            set_review_output review_aborted true
            set_review_output review_abort_cause server_error
            set_review_output retryable_failure true
            echo "::error::Review Codex abortita su un 5xx transiente senza postare — rilancia il job."
            exit 1
          fi
          if [ "$CLASSIFICATION_CAUSE" = 'cancelled' ]; then
            set_review_output review_aborted true
            set_review_output review_abort_cause cancelled
            set_review_output retryable_failure true
            echo "::error::Review Codex cancellata prima del verdetto — rilanciare il job."
            exit 1
          fi
          if [ "$CLASSIFICATION_CAUSE" = 'non_retryable' ] || [ "${REVIEW_OUTCOME:-}" = 'failure' ]; then
            # Un failure senza prova di max_turns/429/5xx non e' sicuro da
            # riattivare: il secondo step separato lo rende rosso senza
            # nominarlo come REVIEW_ABORT_STEP_NAME, cosi' il consumer non lo
            # scambia per un review-gate retryable (#1185 item 2).
            set_review_output review_abort_cause non_retryable
            set_review_output permanent_failure true
            echo "::error::Codex review fallita senza causa transient provata (cause=${CLASSIFICATION_CAUSE}, outcome=${REVIEW_OUTCOME:-unknown}): nessun autorebase automatico."
            exit 0
          fi
          echo "Step di review concluso senza errori API non recuperati."

      # Questo rosso NON appartiene a REVIEW_DEATH_STEP_NAMES: una causa
      # permanente deve bloccare il job, ma non puo' concedere il one-shot del
      # review gate. Il gate sotto gira comunque con always() e conserva il suo
      # verdetto separato.
      - name: Fail on non-retryable review action error (no automatic retry)
        if: steps.body_contract.outcome != 'failure' && steps.tier.outputs.tier != 'tests-only' && always() && steps.resolve.outputs.should_review == 'true' && steps.guard.outputs.skip != 'true' && steps.review_claim.outputs.claim_allowed == 'true' && steps.review_abort.outputs.permanent_failure == 'true'
        env:
          REVIEW_ABORT_CAUSE: ${{ steps.review_abort.outputs.review_abort_cause }}
        run: |
          set -u
          echo "::error::Review automatica non riattivabile (cause=${REVIEW_ABORT_CAUSE:-unknown}); correggere la causa prima di un nuovo run."
          exit 1

      # ── IL VERDETTO ──────────────────────────────────────────────────────
      # E' questo step a rendere il check-run rosso quando manca il `## LGTM` o
      # c'e' un `🔴 Important`, ed e' per questo che l'auto-merge NATIVO non puo'
      # scavalcare la review: il ruleset su `main` richiede questo check.
      #
      # Gira anche quando la review e' stata SALTATA dal guard (carry-forward) e
      # quando l'action e' morta: in quei casi il verdetto sta comunque nelle
      # review gia' postate, e non trovarne una approvante deve bloccare.
      - name: Require approving Codex review
        id: review_gate
        if: steps.body_contract.outcome != 'failure' && always() && steps.resolve.outputs.should_review == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVIEW_REVISION: ${{ steps.review_input.outputs.review_revision }}
          CODEX_FALLBACK_EVIDENCE_FILE: ${{ steps.codex_review.outputs.fallback_evidence_file || steps.review_abort.outputs.verdict_evidence_file }}
        run: node scripts/ci/review-gate.mjs

      # La Jobs API espone solo la conclusion del review gate, non la ragione
      # che lo ha fatto uscire 1. Il processo scrive failure_kind su
      # GITHUB_OUTPUT: questo step trasforma un verdetto esplicito in una
      # conclusione failure e lascia success un errore API/rate-limit o uno
      # stato sconosciuto. E' non-gating per `vitestFailureIsReviewGate`, ma il
      # suo stato e' il discriminante di `reviewSkippedByGuard`.
      - name: Classify review gate failure
        id: review_gate_failure
        if: >-
          ${{ steps.body_contract.outcome != 'failure' && always() &&
          steps.resolve.outputs.should_review == 'true' &&
          steps.review_gate.outcome == 'failure' }}
        env:
          FAILURE_KIND: ${{ steps.review_gate.outputs.failure_kind }}
        run: |
          set -u
          if [ "${FAILURE_KIND:-}" = 'verdict' ]; then
            echo "Review gate failure classificato come verdetto (LGTM mancante o finding Important)."
            exit 1
          fi
          echo "::warning::Review gate failure senza verdetto esplicito (failure_kind=${FAILURE_KIND:-unknown}): il prossimo autorebase conserva il one-shot."

      # GitHub tratta un check richiesto `skipped` come verde. Se il gate non
      # viene valutato, pero', non esiste alcun verdetto da portare avanti:
      # questo step trasforma ogni percorso non risolvibile in un rosso reale.
      # Il gate sopra resta sempre il punto che valuta LGTM, Important e
      # carry-forward; qui si sorveglia soltanto che quel punto abbia girato.
      - name: Fail when required review gate is skipped
        if: >-
          ${{ steps.body_contract.outcome != 'failure' && always() &&
          ((github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
           (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')) &&
          steps.review_gate.outcome == 'skipped' }}
        run: |
          echo "::error::Required review gate was skipped on a pull request; no approving review verdict was evaluated."
          exit 1

      - name: Finalize review PR + HEAD + contribution claim
        if: always() && steps.body_contract.outcome != 'failure' && steps.review_claim.outputs.claim_acquired == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CLAIM_ACTION: finalize
          CLAIM_KIND: review
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          EVENT_KEY: run:${{ github.run_id }}
          CONTRIBUTION_FINGERPRINT: ${{ steps.guard.outputs.contribution_fingerprint }}
          REVIEW_REVISION: ${{ steps.review_input.outputs.review_revision }}
          CLAIM_TOKEN: ${{ steps.review_claim.outputs.claim_token }}
          PROCEED: true
          CODEX_OUTCOME: ${{ steps.codex_review.outcome }}
          EXEC_FILE: ${{ steps.codex_review.outputs.codex_diagnostics_file }}
          RETRYABLE_FAILURE: ${{ steps.review_abort.outputs.retryable_failure }}
          PERMANENT_FAILURE: ${{ steps.review_abort.outputs.permanent_failure }}
          REVIEW_ABORT_CAUSE: ${{ steps.review_abort.outputs.review_abort_cause }}
          REVIEW_POSTED: ${{ steps.test_only_review.outcome == 'success' }}
          REVIEW_GATE_FALLBACK_APPROVED: ${{ steps.review_gate.outputs.fallback_approved }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/ci/review-claim.mjs --claim

      # ── IL SECONDO VERDETTO CONDIZIONALE ─────────────────────────────────
      # `generator-ci.yml` e' path-scoped, quindi il suo check-run NON esiste su
      # ogni PR e il ruleset non puo' richiederlo (bloccherebbe per sempre le PR
      # che non lo attivano). Il gate condizionale che teneva il workflow
      # dell'auto-merge su LGTM torna quindi dentro il job che PRODUCE il check
      # richiesto. Non e' escluso su `engine-lockstep-auto`: quella PR e' esente
      # dalla review perche' gia' giudicata sul sito, ma il contratto
      # engine/host e' proprio cio' che deve essere verificato QUI.
      #
      # Sta in fondo di proposito: quando ci arriva, `generator-ci` ha gia' avuto
      # tutta la durata della review per concludere, quindi l'attesa e' quasi
      # sempre nulla.
      - name: Generator CI gate (solo per le PR che ne toccano i path)
        if: >-
          ${{ steps.body_contract.outcome != 'failure' && always() && github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/generator-ci-gate.mjs
