name: PR collision detector

# Rileva quando più PR aperte modificano gli stessi file e lo dice PRIMA che
# diventi un conflitto di merge.
#
# Perché conta qui in particolare: su questo repo diversi workflow di
# generazione committano in autonomia, e il fixer apre PR da solo. Due agent
# che toccano lo stesso emitter senza saperlo producono un conflitto scoperto
# solo al merge, cioè nel momento peggiore — quando l'auto-merge ha già
# concluso che tutto era verde.
#
# Il gate del collision è già dentro `auto-merge-eval.mjs`: questo workflow
# esiste per etichettare e commentare, così il problema è visibile mentre le PR
# sono ancora aperte.
#
# Zero Claude, tutto deterministico.
#
# Cadenza `*/30` ai minuti 18 e 48, sfasata dal sito. Il ricalcolo periodico
# serve anche a TOGLIERE la label quando la collisione si risolve da sola
# (l'altra PR è stata mergiata o chiusa).

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '18,48 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo log, niente label né commenti'
        type: boolean
        required: false
        default: false

concurrency:
  group: pr-collision-detector-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Detect overlapping PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -uo pipefail
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            node scripts/ci/pr-collision-detector.mjs --dry-run
          else
            node scripts/ci/pr-collision-detector.mjs
          fi
