# in frontaliere-si-o-no to check two things fast: (1) schema — does
# background:true/wait-all:true survive inside a workflow_call job (unlike
# a composite action, which rejects it — frontaliere-si-o-no#6517); (2)
# which account's concurrency pool actually executes the job. Deleted right
# after answering both.
on:
  workflow_dispatch:
jobs:
  call_site_test:
    uses: valerielinc-ops/frontaliere-si-o-no/.github/workflows/test-reusable-bg-DELETEME.yml@test-reusable-bg-deleteme
