name: Enable native auto-merge

# L'auto-merge NATIVO di GitHub possiede l'attesa e la decisione di mergiare.
# Questo workflow si limita ad ARRUOLARE una PR idonea in quel meccanismo: i
# check richiesti e le review stanno sul ruleset di `main`, non reimplementati
# in Actions. Sostituisce i due workflow che facevano il merge da se' — quello
# su LGTM e il suo sweep orario — entrambi rimossi.
#
# Il contesto richiesto e' `tests (node --test)`, cioe' il job INTERO di
# `tests.yml` — contratto del body, unit + closure gates, e il verdetto della
# Claude review (`scripts/ci/review-gate.mjs`), piu' il gate condizionale di
# `generator-ci`. L'auto-merge nativo non puo' quindi scavalcare nessuno di
# quei giudizi: non li conosce, aspetta soltanto quel check.
#
# ── PERCHE' IL MERGE DEVE AVVENIRE CON IL PAT E NON CON GITHUB_TOKEN ────────
#
# L'auto-merge nativo mergia con l'identita' di CHI lo ha abilitato. Abilitarlo
# col `GITHUB_TOKEN` significa un merge di `github-actions[bot]`, e GitHub non
# fa MAI partire un workflow da un evento generato da quel token
# (anti-ricorsione): `publish-api.yml` non scatterebbe, e il corpus smetterebbe
# di pubblicare senza che niente diventi rosso. E' lo stesso vincolo del
# cascade merge→deploy sul sito. Quindi: nessun PAT, nessun arruolamento — si
# fallisce forte invece di consegnare un auto-merge che rompe la pubblicazione.
on:
  # Questo job chiama SOLO l'API GitHub e non esegue mai codice della PR.
  # `pull_request_target` tiene disponibile il permesso di scrittura.
  pull_request_target:
    # L'arruolamento persiste attraverso i commit successivi: rilanciare il job
    # a ogni `synchronize` ripeterebbe la stessa chiamata API senza effetto.
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  enable:
    # Guard esplicito contro i dispatch non-PR: tiene un evento malformato o
    # replayato dal produrre un run fallito mentre dereferenzia campi
    # `pull_request` che non esistono.
    if: github.event_name == 'pull_request_target' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A questo job servono solo il loader di Remote Config e il suo helper
      # JWT senza dipendenze. Un checkout dovrebbe comunque scaricare l'albero
      # del repo (28.777 file, `content/` compreso) prima che lo sparse possa
      # selezionarli, quindi si scaricano i due file raw.
      - name: Download workflow helpers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          helper_dir="${RUNNER_TEMP}/native-automerge-helpers"
          mkdir -p "$helper_dir/lib"
          gh api "repos/${GITHUB_REPOSITORY}/contents/generator/scripts/load-rc-env.mjs?ref=main" \
            --header 'Accept: application/vnd.github.raw+json' \
            > "$helper_dir/load-rc-env.mjs"
          gh api "repos/${GITHUB_REPOSITORY}/contents/generator/scripts/lib/google-service-account-token.mjs?ref=main" \
            --header 'Accept: application/vnd.github.raw+json' \
            > "$helper_dir/lib/google-service-account-token.mjs"
          echo "NATIVE_AUTOMERGE_HELPER_DIR=$helper_dir" >> "$GITHUB_ENV"

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON non configurato — senza Remote Config non c'e' il PAT."
            exit 1
          fi
          printf %s "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load PAT from Remote Config
        run: node "$NATIVE_AUTOMERGE_HELPER_DIR/load-rc-env.mjs"

      - name: Enable GitHub auto-merge
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_PAT_NANAKO:-}" ]; then
            echo "::error::GITHUB_PAT_NANAKO non caricato da Remote Config — non arruolo la PR: un auto-merge di github-actions[bot] non farebbe partire publish-api.yml."
            exit 1
          fi
          GH_TOKEN="$GITHUB_PAT_NANAKO" gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --auto --squash --delete-branch

      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json
