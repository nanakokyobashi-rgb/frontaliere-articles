name: Enable native auto-merge
# GitHub's native auto-merge owns the waiting/merge decision. This workflow
# only opts an eligible PR into that mechanism after the repository's explicit
# reviewer/check verdict; native merge still owns the final wait and merge.
# The required `tests (node --test)` context is the complete `tests`
# job. The downloaded helper additionally requires the latest reviewer-bot verdict
# to be anchored to the current HEAD, so an opening event cannot opt in an
# unreviewed PR.
on:
  # This workflow only calls the GitHub API and never executes PR code.
  # pull_request_target keeps the write permission available for fork PRs too.
  pull_request_target:
    # These events are observation/retry points only: the helper is fail-closed
    # until review and the required check both pass.
    types: [opened, reopened, ready_for_review, synchronize]
  pull_request_review:
    # A later edit/dismissal invalidates a previously valid verdict too; the
    # same fail-closed gate must re-read the review/check pair and revoke any
    # persisted native opt-in.
    types: [submitted, edited, dismissed]
  workflow_run:
    workflows: [tests]
    types: [completed]
permissions:
  contents: read
  pull-requests: write
concurrency:
  # Every trigger below calls the same idempotent gate. Use the source
  # repository and branch because that identity is available on both PR
  # events and workflow_run, including runs without pull_requests. This keeps
  # cancel-in-progress effective while the job resolves the PR number below.
  group: native-automerge-${{ github.event.pull_request.head.repo.full_name || github.event.workflow_run.head_repository.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: true
jobs:
  enable:
    # Guard explicitly against non-PR dispatches. This keeps a malformed or
    # manually replayed push event from producing a failed empty run while
    # dereferencing pull_request fields that do not exist.
    if: >-
      github.event_name == 'workflow_run' ||
      (github.event_name == 'pull_request_review' && github.event.pull_request.draft == false) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      # This job needs only the Remote Config loader and its dependency-free
      # JWT helper. A git checkout still has to fetch the repository's large
      # tree before sparse checkout can select those files, so download the
      # raw files directly instead of initializing a repository.
      #
      # Two-step rollout: the gate is trusted only when it is already present
      # on main. If this workflow lands before the helper (or main is rolled
      # back to a version without it), the job is a successful no-op and never
      # enables native auto-merge.
      - name: Download trusted workflow helpers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          helper_dir="${RUNNER_TEMP}/native-automerge-helpers"
          mkdir -p "$helper_dir/lib"
          # Keep the final extension while syntax-checking: Node otherwise
          # parses an `.tmp` file as CommonJS and rejects the helper exports.
          gate_tmp="$helper_dir/native-automerge-gate-check.mjs"
          policy_tmp="$helper_dir/review-test-policy-check.mjs"
          files_tmp="$helper_dir/lib/fetchPrFiles-check.mjs"
          vitest_tmp="$helper_dir/lib/vitestCheck-check.mjs"
          # A runner can lose its outbound GitHub connection after the job has
          # started. Retry only idempotent helper reads and only recognizable
          # transient failures; 404/403, invalid JavaScript and empty files
          # remain fail-closed instead of becoming a silent no-op.
          download_and_check() {
            local path="$1"
            local destination="$2"
            local error_file="${destination}.error"
            local attempt
            for attempt in 1 2 3; do
              rm -f "$destination" "$error_file"
              if gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" \
                --header 'Accept: application/vnd.github.raw+json' \
                > "$destination" 2> "$error_file" \
                && [ -s "$destination" ] \
                && node --check "$destination"; then
                rm -f "$error_file"
                return 0
              fi
              if [ "$attempt" -eq 3 ] || ! grep -Eiq \
                'timeout|timed[[:space:]._-]*out|deadline[[:space:]._-]*exceeded|connection reset|connection refused|temporary failure|service unavailable|bad gateway|gateway timeout|HTTP 5[0-9][0-9]|ECONNRESET|ETIMEDOUT|EAI_AGAIN' \
                "$error_file"; then
                cat "$error_file" >&2
                rm -f "$destination" "$error_file"
                return 1
              fi
              echo "::warning::Transient GitHub helper read failed for ${path} (attempt ${attempt}/3); retrying."
              sleep "$((attempt * 5))"
            done
            return 1
          }

          download_and_check \
            'generator/scripts/load-rc-env.mjs' "$helper_dir/load-rc-env.mjs"
          download_and_check \
            'generator/scripts/lib/google-service-account-token.mjs' \
            "$helper_dir/lib/google-service-account-token.mjs"

          # Inspect the parsed module graph, not a text substring: comments and
          # string literals must not turn the optional dependency into a hard
          # fetch. A detector error is unknown, and unknown remains fail-closed.
          gate_requires_vitest=unknown
          if download_and_check \
            'scripts/ci/native-automerge-gate.mjs' "$gate_tmp"; then
            if gate_requires_vitest="$(
              node --experimental-vm-modules --input-type=module - "$gate_tmp" <<'NODE'
          import { readFileSync } from 'node:fs';
          import vm from 'node:vm';

          const source = readFileSync(process.argv[2], 'utf8');
          const parsed = new vm.SourceTextModule(source);
          const requests = parsed.moduleRequests?.map(({ specifier }) => specifier)
            ?? parsed.dependencySpecifiers;
          if (!Array.isArray(requests)) {
            throw new Error('Unable to inspect gate module dependencies');
          }
          process.stdout.write(requests.includes('./lib/vitestCheck.mjs') ? 'true' : 'false');
          NODE
            )"; then
              case "$gate_requires_vitest" in
                true|false) ;;
                *) gate_requires_vitest=unknown ;;
              esac
            fi
          fi

          if { [ "$gate_requires_vitest" = true ] || [ "$gate_requires_vitest" = false ]; } \
            && download_and_check \
              'scripts/ci/review-test-policy.mjs' "$policy_tmp" \
            && download_and_check \
              'scripts/ci/lib/fetchPrFiles.mjs' "$files_tmp" \
            && { [ "$gate_requires_vitest" = false ] || download_and_check \
              'scripts/ci/lib/vitestCheck.mjs' "$vitest_tmp"; }; then
            mv "$gate_tmp" "$helper_dir/native-automerge-gate.mjs"
            mv "$policy_tmp" "$helper_dir/review-test-policy.mjs"
            mv "$files_tmp" "$helper_dir/lib/fetchPrFiles.mjs"
            if [ "$gate_requires_vitest" = true ]; then
              mv "$vitest_tmp" "$helper_dir/lib/vitestCheck.mjs"
            fi
            download_and_check \
              'scripts/ci/lib/constants.mjs' "$helper_dir/lib/constants.mjs"
            echo "NATIVE_AUTOMERGE_BOOTSTRAP_READY=true" >> "$GITHUB_ENV"
            echo "Native auto-merge gate bootstrap is present on main (vitestCheck required: $gate_requires_vitest)."
          else
            rm -f "$gate_tmp" "$policy_tmp" "$files_tmp" "$vitest_tmp" \
              "$helper_dir/native-automerge-gate.mjs" "$helper_dir/review-test-policy.mjs" \
              "$helper_dir/lib/fetchPrFiles.mjs" "$helper_dir/lib/vitestCheck.mjs"
            echo "NATIVE_AUTOMERGE_BOOTSTRAP_READY=false" >> "$GITHUB_ENV"
            echo 'Native auto-merge gate is not installed on main; fail-closed no-op.'
          fi
          echo "NATIVE_AUTOMERGE_HELPER_DIR=$helper_dir" >> "$GITHUB_ENV"
      - name: Prepare Firebase credentials
        if: env.NATIVE_AUTOMERGE_BOOTSTRAP_READY == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON is not configured" >&2
            exit 1
          fi
          printf %s "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Load PAT from Remote Config
        if: env.NATIVE_AUTOMERGE_BOOTSTRAP_READY == 'true'
        run: node "$NATIVE_AUTOMERGE_HELPER_DIR/load-rc-env.mjs"
      - name: Enable GitHub auto-merge after verified verdict
        if: env.NATIVE_AUTOMERGE_BOOTSTRAP_READY == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$GITHUB_PAT_NANAKO" ]; then
            echo "GITHUB_PAT_NANAKO was not loaded from Remote Config" >&2
            exit 1
          fi
          pr_number="${PR_NUMBER:-}"
          if [ -z "$pr_number" ] && [ -n "${WORKFLOW_HEAD_SHA:-}" ]; then
            pr_number=$(GH_TOKEN="$GITHUB_PAT_NANAKO" gh api \
              "repos/$REPOSITORY/commits/$WORKFLOW_HEAD_SHA/pulls" --paginate --slurp \
              | jq -r '[add[] | select(.state == "open" and .base.ref == "main") | .number] | .[0] // empty')
          fi
          if [ -z "$pr_number" ]; then
            echo 'Native auto-merge guard: no open main PR found for this event; no merge.'
            exit 0
          fi
          GH_TOKEN="$GITHUB_PAT_NANAKO" node "$NATIVE_AUTOMERGE_HELPER_DIR/native-automerge-gate.mjs" \
            "$REPOSITORY" "$pr_number"
      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json
