# Fast-publish one or more articles: render their 4 locale pages + the section
# archive and push them straight to the article shard repos and the CDN,
# skipping the full site build.
#
# WHY THIS EXISTS (issue #4974 item 3, migration §10.4 step 4)
# ───────────────────────────────────────────────────────────
# The main repo's `fast-publish-article.yml` was what made a generated article
# visible in minutes. §4 of the migration doc filed it under "site-only" — a
# judgement about where it RAN, not what it DID — and after the cutover nothing
# dispatched it. The result: every article generated since 2026-08-02 exists in
# the corpus, is listed in the API sitemaps, and 404s on the site.
#
# THE CHAIN LINK. `push: content/**` is the same link generate-article.yml
# restored in 0517589: a corpus push means an article was actually produced, so
# publication starts immediately instead of waiting for anything to dispatch it.
# It has to be a push trigger and not a workflow dispatch, because the Remote
# Config PAT cannot dispatch workflows — 403 "Resource not accessible by
# integration", re-verified. Push is the one thing it can do.
#
# ARMING. A corpus push PUBLISHES. That was not the first posture: every run
# used to be dry unless a repo variable said otherwise, so the first execution
# could exercise the whole path against the real corpus before anything reached
# a shard. That has happened — the dry run went green end to end, and twelve
# articles have since been published through the armed path — so the gate has
# served its purpose and the default is now to publish.
#
# KILL SWITCH, in this order:
#   1. `.github/FAST_PUBLISH_DISABLED` present in the repo  -> dry
#   2. repo variable FAST_PUBLISH_ARMED == 'false'          -> dry
#   3. workflow_dispatch with dry_run: true                 -> dry
# The file is first because it is the one a session can set: this environment's
# agent proxy refuses the Actions variables API ("Access to this GitHub Actions
# path is not permitted through this proxy"), so a variable-only switch cannot
# be flipped from here — which is exactly how the pipeline sat idle after the
# dry run passed. An in-repo switch is also reviewable in a diff and revertible
# with a commit.
#
# SHARD WRITE ACCESS — already proven, before this workflow ever runs.
# §10.2 recorded "NOT YET PROVEN ... the write has to be proven inside
# Actions", because the agent proxy refuses POST /git/refs. That conclusion was
# too pessimistic: the git receive-pack ADVERTISEMENT
# (GET /info/refs?service=git-receive-pack) is permission-gated and is a plain
# GET, so it goes through. Measured 2026-08-03 with Remote Config's GITHUB_PAT:
# all 8 article shards answer 200; the control (torvalds/linux, which this PAT
# obviously cannot write) answers 403 on receive-pack and 200 on upload-pack.
# The PAT can write to every article shard. The probe step below re-runs that
# same check every time, so a revoked or narrowed PAT fails loudly here rather
# than half-way through a publish.
#
# Shards belong to nanakokyobashi-rgb (scripts/lib/section-shard-owners.json),
# so this repo pushes to its own repos. The main repo's SHARD_*_DEPLOY_KEY
# secrets are irrelevant here — main needed them because main pushed to repos
# it did not own.

name: fast-publish-article

on:
  push:
    # Without this, ANY branch touching content/** fires this workflow — not
    # just main. Measured (issue #35): a manually-pushed backup branch
    # (snapshot/sessione-morta-2026-08-08, explicitly marked "NON VA
    # MERGIATO") reverted the corpus wholesale, and the push still matched
    # `content/**` and ran the publish attempt, which then failed because the
    # derived article id was absent from the reverted registry. The normal
    # chain (generate-article.yml et al.) pushes to `github.ref_name`, which
    # for scheduled/dispatch runs is always main — so this restriction does
    # not affect the real chain link, only stray non-main pushes. Matches
    # publish-api.yml's own `branches: [main]` guard on the same paths.
    branches: [main]
    paths:
      # Self-test on change, always dry (see the `dry` resolution below).
      - '.github/workflows/fast-publish-article.yml'
      - 'scripts/publish-article-fast.mjs'
      - 'scripts/ci/fast-publish-section.mjs'
      - 'generator/scripts/lib/corpus-paths.mjs'
      - 'scripts/ci/retry-cmd.sh'
      - 'scripts/cf-purge-cache.mjs'
      - 'generator/scripts/load-rc-env.mjs'
      - 'scripts/offload-generated-images-cdn.mjs'
      - 'engine/**'
      - 'host/**'
      - 'scripts/lib/article-render-pipeline.mjs'
      - 'scripts/lib/cf-analytics.mjs'
      - 'scripts/lib/cf-purge-variants.mjs'
      - 'scripts/lib/cdn-asset-existence.mjs'
      - 'scripts/lib/npm-ci-retry.sh'
      - 'scripts/lib/parse-positive-num.mjs'
      - 'scripts/lib/sanitize-control-chars.mjs'
      - 'scripts/lib/upload-cdn-file.sh'
      # THE CHAIN LINK — a corpus push means an article was produced.
      - 'content/**'
  workflow_dispatch:
    inputs:
      article_id:
        description: 'Single article id (empty = derive all ids from the last corpus commit)'
        required: false
        type: string
      article_ids:
        description: 'JSON array of article ids to publish together (takes precedence over article_id)'
        required: false
        type: string
      section:
        description: 'an active section of the core with a Pages shard, e.g. frontaliere or svizzera (empty = derive)'
        required: false
        type: string
      dry_run:
        description: 'Render and validate, push nothing'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  # Sezione e shard si risolvono in un job a parte perche' la concurrency del
  # job che pubblica e' PER SHARD (D8 del piano «sezioni cantonali»): due
  # articoli di sezioni diverse scrivono in repo shard diversi e non devono
  # aspettarsi, mentre due pubblicazioni sullo STESSO shard restano in fila.
  # La chiave di concurrency di un job puo' leggere `needs`, non gli output di
  # un suo step: da qui la separazione.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.mode.outputs.skip }}
      skip_reason: ${{ steps.mode.outputs.skip_reason }}
      dry: ${{ steps.mode.outputs.dry }}
      id: ${{ steps.mode.outputs.id }}
      ids: ${{ steps.mode.outputs.ids }}
      section: ${{ steps.mode.outputs.section }}
      shard: ${{ steps.mode.outputs.shard }}
    steps:
      - name: Checkout (resolve)
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Fetch push base (resolve)
        if: github.event_name == 'push'
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${PUSH_BEFORE:-}" ] && [[ ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$PUSH_BEFORE"
          fi

      - name: Resolve mode, article ids and section
        id: mode
        env:
          ARTICLE_IDS_INPUT: ${{ inputs.article_ids }}
          ARTICLE_ID_INPUT: ${{ inputs.article_id }}
          SECTION_INPUT: ${{ inputs.section }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          ids=()
          before="${PUSH_BEFORE:-}"
          if [ -z "$before" ] || [[ "$before" =~ ^0+$ ]]; then before=HEAD~1; fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Dispatch says what it wants; default stays dry so a manual poke
            # cannot publish by accident.
            dry=true
            [ "$DRY_RUN_INPUT" = "false" ] && dry=false
            section="$SECTION_INPUT"
            if [ -n "$ARTICLE_IDS_INPUT" ]; then
              ids_json="$(printf '%s' "$ARTICLE_IDS_INPUT" | jq -ce '
                if type == "array" and length > 0 and all(.[]; type == "string" and length > 0)
                then unique
                else error("article_ids must be a non-empty JSON array of article ids")
                end
              ')"
              mapfile -t ids < <(printf '%s' "$ids_json" | jq -r '.[]')
            elif [ -n "$ARTICLE_ID_INPUT" ]; then
              ids=("$ARTICLE_ID_INPUT")
            fi
          else
            # A push publishes, unless a kill switch says otherwise, and unless
            # it carries no article at all: a push that only touched this
            # workflow or the driver is a self-test.
            dry=false
            if [ -f .github/FAST_PUBLISH_DISABLED ]; then
              echo "::warning::.github/FAST_PUBLISH_DISABLED present — running dry"
              dry=true
            elif [ "${{ vars.FAST_PUBLISH_ARMED }}" = "false" ]; then
              echo "::warning::repo variable FAST_PUBLISH_ARMED=false — running dry"
              dry=true
            fi
            changed="$(git diff --name-only "$before" HEAD 2>/dev/null || true)"
            has_content=false
            while IFS= read -r changed_path; do
              case "$changed_path" in
                content/*) has_content=true; break ;;
              esac
            done <<< "$changed"
            if [ "$has_content" != true ]; then
              dry=true
            fi
          fi

          # Keep the legacy empty-dispatch behavior: with no explicit id, use
          # the body files from the last corpus commit. Collect every match,
          # not just the first one, so a batch commit is published whole.
          # Which directories hold article bodies, and which section owns each,
          # comes from the section core (scripts/ci/fast-publish-section.mjs):
          # the old `case` sent every non-`blog-body-ch` body to frontaliere,
          # so a new section would have been published into another section's
          # shard without an error.
          if [ "${#ids[@]}" -eq 0 ]; then
            changed="$(git diff --name-only "$before" HEAD 2>/dev/null || true)"
            body_re="$(node scripts/ci/fast-publish-section.mjs body-regex shard)"
            mapfile -t bodies < <(
              printf '%s\n' "$changed" \
                | grep -E "$body_re" \
                | sort -u || true
            )
            for body in "${bodies[@]}"; do
              [ -f "$body" ] || continue
              body_id="$(basename "$body" .ts)"
              body_section="$(node scripts/ci/fast-publish-section.mjs section-of "$body")"
              if [ -n "${section:-}" ] && [ "$section" != "$body_section" ]; then
                echo "::error::one commit changes both article sections; publish them in separate commits"
                exit 1
              fi
              section="$body_section"
              ids+=("$body_id")
            done
          fi
          echo "dry=$dry" >> "$GITHUB_OUTPUT"

          if [ "${#ids[@]}" -eq 0 ]; then
            if [ "${{ github.event_name }}" = "push" ] \
              && printf '%s\n' "$changed" | grep -Eq '^content/(cantons/|blog-body-canton-|blog-meta-canton-)'; then
              echo "::notice::CANTON_CONTENT_HANDLED_BY_FAST_PUBLISH_SECTION=1 — canton-only content push skipped by the Pages publisher"
              echo "skip_reason=canton-only-r2" >> "$GITHUB_OUTPUT"
              {
                echo "### fast-publish-article"
                echo
                echo "- skip: canton-only content push; fast-publish-section.yml owns the R2 publication"
                echo "- marker: CANTON_CONTENT_HANDLED_BY_FAST_PUBLISH_SECTION=1"
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "no article body in this event — nothing to publish"
              echo "skip_reason=no-article-body" >> "$GITHUB_OUTPUT"
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ids_json="$(printf '%s\n' "${ids[@]}" | jq -R . | jq -cs 'unique')"
          id="$(printf '%s' "$ids_json" | jq -r '.[0]')"
          section="${section:-frontaliere}"
          # Validates the section against the ACTIVE core sections and returns
          # its Pages shard. A section served from R2 (shardKey null, the canton
          # sections) is an explicit error here, never a fallback to a shard
          # that belongs to another section.
          shard="$(node scripts/ci/fast-publish-section.mjs shard-of "$section")"
          {
            echo "skip=false"
            echo "id=$id"
            echo "ids=$ids_json"
            echo "section=$section"
            echo "shard=$shard"
            echo "skip_reason=publish"
          } >> "$GITHUB_OUTPUT"
          echo "resolved ids=$(printf '%s' "$ids_json" | jq -r 'join(", ")') section=$section shard=$shard dry=$dry"

  publish:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Never cancel: a cancelled run can leave some locales pushed and others not.
    # Per shard, not global: the shard is the unit that a half-finished publish
    # can leave inconsistent, and it comes from the section core (`shardKey`).
    concurrency:
      group: fast-publish-article-${{ needs.resolve.outputs.shard }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          # persist-credentials: false is load-bearing, not hygiene. It stops
          # actions/checkout leaving its GITHUB_TOKEN in an extraheader that
          # would then be used ahead of the PAT for every shard push — the
          # `contents: read` token, which cannot write and whose push fires no
          # workflow anyway.
          persist-credentials: false

      - name: Set up Node
        if: needs.resolve.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: needs.resolve.outputs.skip != 'true'
        run: bash scripts/lib/npm-ci-retry.sh

      - name: Prepare Firebase credentials
        if: needs.resolve.outputs.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not set — Remote Config is the only source of the shard PAT and the R2 credentials"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config
        if: needs.resolve.outputs.skip != 'true'
        run: node generator/scripts/load-rc-env.mjs

      - name: Probe shard write access
        if: needs.resolve.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_PAT:-}" ]; then
            echo "::error::GITHUB_PAT missing after the Remote Config load"
            exit 1
          fi
          section="${{ needs.resolve.outputs.section }}"
          shard="${{ needs.resolve.outputs.shard }}"
          owner="$(jq -r --arg s "$shard" '.[$s] // "valerielinc-ops"' scripts/lib/section-shard-owners.json)"

          # The receive-pack advertisement is permission-gated: a credential
          # that cannot write gets 403 here while still getting 200 on
          # upload-pack. This is a GET and writes nothing.
          fail=0
          for loc in it en de fr; do
            repo="$owner/frontaliere-$shard-$loc"
            # set +e: a non-2xx is data here, not a reason to end the step.
            set +e
            code="$(curl -s -o /dev/null -w '%{http_code}' -u "x-access-token:$GITHUB_PAT" \
                    "https://github.com/$repo.git/info/refs?service=git-receive-pack")"
            set -e
            if [ "$code" = "200" ]; then
              echo "  write OK   $repo"
            else
              echo "::error::no write access to $repo (receive-pack returned $code)"
              fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1

      - name: Render the articles (fast path)
        if: needs.resolve.outputs.skip != 'true'
        env:
          ARTICLE_IDS_JSON: ${{ needs.resolve.outputs.ids }}
        run: |
          set -euo pipefail
          npx -y tsx@4.23.15 scripts/publish-article-fast.mjs \
            --ids "$ARTICLE_IDS_JSON" \
            --section "${{ needs.resolve.outputs.section }}" \
            --out "$RUNNER_TEMP/fast-dist" \
            --summary "$RUNNER_TEMP/fast-summary.json"

      # The hub LANDING was the one article surface a full site deploy still
      # owned. Since ARTICOLIFRONTALIERE_BUILD_EMIT_SKIP went on (2026-07-29
      # 19:28) the site stopped writing it and nothing took over: the article
      # was live at its own URL, in /tutti/ and in the sitemap, while the page
      # readers land on kept showing that evening's set. Nothing failed, which
      # is why it went unnoticed for a week.
      #
      # Best-effort on purpose: a refreshed grid must never be the reason a
      # published article fails to reach its shard. The script is fail-closed
      # per page — it leaves a page alone rather than write a half-formed one —
      # so the worst case here is the hub staying as stale as it already was.
      - name: Refresh the hub landing grid
        if: needs.resolve.outputs.skip != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          npx -y tsx@4.23.15 scripts/refresh-hub-landing.mjs \
            --out "$RUNNER_TEMP/fast-dist" \
            --section "${{ needs.resolve.outputs.section }}" \
            --summary "$RUNNER_TEMP/hub-landing.json"

      - name: Validate what was rendered
        if: needs.resolve.outputs.skip != 'true'
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/fast-summary.json"
          dist="$RUNNER_TEMP/fast-dist"
          article_count="$(jq -r '.ids | length' "$summary")"
          expected_ids="$(jq -c '.ids | sort' "$summary")"

          # Every path the summary promises must exist and be non-empty. A
          # zero-item archive renders "successfully" (the core EMITS-EMPTY by
          # design), so size alone is not enough — the archive must also list
          # something.
          fail=0
          for loc in it en de fr; do
            article_n="$(jq -r --arg l "$loc" '.shards[] | select(.locale==$l) | .articlePaths | length' "$summary")"
            bridge_n="$(jq -r --arg l "$loc" '.shards[] | select(.locale==$l) | .bridgePaths | length' "$summary")"
            hub_n="$(jq -r --arg l "$loc" '.shards[] | select(.locale==$l) | .hubPaths | length' "$summary")"
            article_ids="$(jq -c --arg l "$loc" '[.shards[] | select(.locale==$l) | .articleIds[]?] | sort' "$summary")"
            bridge_ids="$(jq -c --arg l "$loc" '[.shards[] | select(.locale==$l) | .bridgeIds[]?] | sort' "$summary")"
            if [ "${article_n:-0}" -ne "$article_count" ] || [ "$article_ids" != "$expected_ids" ]; then
              echo "::error::locale $loc has ${article_n:-0} article path(s) or the wrong article IDs (expected $article_count paths for $expected_ids; got $article_ids)"
              fail=1
            fi
            if [ "${bridge_n:-0}" -ne "$article_count" ] || [ "$bridge_ids" != "$expected_ids" ]; then
              echo "::error::locale $loc has ${bridge_n:-0} bridge path(s) or the wrong bridge IDs (expected $article_count paths for $expected_ids; got $bridge_ids)"
              fail=1
            fi
            if [ "${hub_n:-0}" -lt 1 ]; then
              echo "::error::locale $loc has no hub archive page"
              fail=1
            fi
          done

          while IFS= read -r rel; do
            if [ ! -s "$dist/$rel" ]; then
              echo "::error::missing or empty rendered file: $rel"
              fail=1
            fi
          done < <(jq -r '.shards[].paths[]' "$summary")

          # The archive must not be empty. This is the defect that made the
          # first local render produce four pages with zero <li> items when the
          # corpus symlinks were missing — it did not fail, it published nothing.
          it_archive="$(jq -r '.shards[] | select(.locale=="it") | .hubPaths[0]' "$summary")"
          items="$(grep -o '<li>' "$dist/$it_archive" | wc -l)"
          if [ "$items" -lt 1 ]; then
            echo "::error::IT archive $it_archive lists 0 articles — refusing to publish an empty archive over the live one"
            fail=1
          fi
          echo "IT archive lists $items items"

          # The host contract emits a named Person for real authors and a named
          # Organization profile for editorial signatures such as `redazione`.
          # Both are valid; requiring Person alone made every new article signed
          # by the editorial profile fail even though the registry had resolved.
          # A generic root Organization is still rejected: it is the silent
          # fallback produced when the registry cannot resolve the article.
          it_article="$(jq -r '.shards[] | select(.locale=="it") | .articlePaths[0]' "$summary")"
          author_entry="$(grep -o '"author"[[:space:]]*:[[:space:]]*{[^}]*}' "$dist/$it_article" | head -n 1 || true)"
          if printf '%s' "$author_entry" | grep -Eq '"@type"[[:space:]]*:[[:space:]]*"(Person|Organization)"' \
            && printf '%s' "$author_entry" | grep -Eq 'https://frontaliereticino\.ch/autori/[^" ]+'; then
            echo "article carries a named Person or editorial Organization author"
          else
            echo "::error::$it_article has no named Person/Organization author in its NewsArticle JSON-LD — the article registry did not resolve"
            fail=1
          fi

          # Nessuna pagina può uscire con riferimenti /assets/ same-origin (issue #5270).
          #
          # IL DIFETTO. `publish-article-fast.mjs` renderizzava l'archivio `/tutti/` DOPO
          # `offload-generated-images-cdn.mjs`, che è l'unico passaggio che riscrive i
          # `/assets/...` — stringhe letterali emesse da articleHubPagesPlugin, non asset
          # Rollup — verso il CDN. Nessuna origin sul percorso di servizio ospita /assets:
          # `https://frontaliereticino.ch/assets/index-entry.js` risponde 404. Le pagine
          # archivio uscivano quindi senza CSS, senza bundle SPA e senza loader AdSense.
          #
          # PERCHÉ QUI E NON SOLO NEL TEST DI ORDINE. `scripts/publish-article-fast.mjs` è
          # una COPIA di quello del repo del sito e nessun mirror trasporta `scripts/`: il
          # sito ha corretto l'ordine il 2026-08-06 (valerielinc-ops/frontaliere-si-o-no#5271)
          # e questa copia ha continuato a pubblicare l'ordine rotto. Poiché entrambi i repo
          # pushano gli shard degli articoli, l'archivio live alternava sano e rotto a
          # seconda di chi aveva pubblicato per ultimo. Il test di ordine difende l'ordine;
          # questo gate difende i BYTE che stanno per essere pushati, quindi regge anche se
          # un domani il rewrite si sposta altrove.
          #
          # Il pattern è ancorato a `src="` / `href="`: la pagina sana contiene comunque un
          # `href*="/assets/"` dentro un selettore CSS inline (lo swap del media print), che
          # non è un riferimento a risorsa e non deve far fallire nulla.
          asset_rx='(src|href)="/assets/[^"]'
          {
            jq -r '.shards[].paths[]' "$summary"
            [ -s "$RUNNER_TEMP/hub-landing.json" ] && jq -r '.pages[].path' "$RUNNER_TEMP/hub-landing.json"
          } | sort -u | while IFS= read -r rel; do
            [ -n "$rel" ] || continue
            [ -f "$dist/$rel" ] || continue
            n="$(grep -Eco "$asset_rx" "$dist/$rel" || true)"
            [ "${n:-0}" -gt 0 ] && echo "$rel:$n"
          done > "$RUNNER_TEMP/same-origin-assets.txt" || true

          if [ -s "$RUNNER_TEMP/same-origin-assets.txt" ]; then
            echo "::error::rendered pages still carry same-origin /assets/ refs (404 in production — issue #5270); the CDN offload must run AFTER every page is rendered:"
            cat "$RUNNER_TEMP/same-origin-assets.txt"
            fail=1
          else
            echo "no same-origin /assets/ refs in any rendered page"
          fi

          [ "$fail" = "0" ] || exit 1

      - name: Publish to shards and CDN
        if: needs.resolve.outputs.skip != 'true' && needs.resolve.outputs.dry != 'true'
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/fast-summary.json"
          dist="$RUNNER_TEMP/fast-dist"
          section="${{ needs.resolve.outputs.section }}"
          shard="${{ needs.resolve.outputs.shard }}"

          # UN SOLO push per locale, articolo + hub insieme.
          #
          # Prima erano due — l'articolo qui, la griglia dell'hub più in basso in questo
          # stesso step — verso LO STESSO repo shard, a pochi secondi di distanza. Ogni push
          # innesca una build GitHub Pages, e due build concorrenti sullo stesso repo si
          # ostacolano: nello storico di frontaliere-articolisvizzera-it ogni pubblicazione
          # compare come una COPPIA di build allo stesso minuto, una `built` e una `errored`,
          # per giorni.
          #
          # Finché una delle due passava, il difetto era invisibile. Il 2026-08-06 alle 11:34
          # hanno fallito entrambe: l'articolo era committato nello shard (21 KB, verificato
          # via API) e l'origin rispondeva 404 ore dopo, perché il sito restava sull'ultima
          # build riuscita. Il gate «Verify the article is actually readable» ha fatto il suo
          # lavoro e ha reso rosso il run — 5 run su 20 in due giorni, su articoli diversi.
          #
          # Con un push solo la corsa non esiste: una build per pubblicazione.
          for loc in it en de fr; do
            mapfile -t paths < <(jq -r --arg l "$loc" '.shards[] | select(.locale==$l) | .paths[]' "$summary")
            hpaths=()
            if [ -s "$RUNNER_TEMP/hub-landing.json" ]; then
              mapfile -t hpaths < <(jq -r --arg l "$loc" '.pages[] | select(.locale==$l) | .path' "$RUNNER_TEMP/hub-landing.json")
            fi
            # Signature is <section> <locale> <scratch_dist_dir> <relpath...>.
            # There is no subtree argument: each relpath is BOTH the path under
            # $dist and the destination path inside the shard repo.
            echo "── pushing ${#paths[@]} article + ${#hpaths[@]} landing file(s) to $shard/$loc"
            # Il fallback conserva la differenza di severità che le due chiamate separate
            # esprimevano: l'articolo è duro, l'hub è morbido («the hub stays stale, the
            # article is unaffected»). Se il push combinato fallisce si riprova col solo
            # articolo, così una pagina hub malformata non può impedire la pubblicazione.
            if ! bash scripts/lib/push-article-shard-incremental.sh \
                 "$shard" "$loc" "$dist" "${paths[@]}" ${hpaths[@]+"${hpaths[@]}"}; then
              echo "::warning::combined push failed for $shard/$loc — retrying with the article alone (the hub stays stale)"
              bash scripts/lib/push-article-shard-incremental.sh \
                "$shard" "$loc" "$dist" "${paths[@]}"
            fi
          done

          while IFS=$'\t' read -r local key; do
            [ -n "$local" ] || continue
            bash scripts/lib/upload-cdn-file.sh "$local" "$key"
          done < <(jq -r '.cdnUploads[] | "\(.local)\t\(.key)"' "$summary")

          # Il push delle landing dell'hub non è più qui: è stato assorbito nel push unico
          # in cima a questo step.
          #
          # Il commento che stava in questo punto aveva già visto metà del problema — «this
          # change doubles the pushes per article, so that non-zero exit is a real
          # possibility» — e lo mitigava mettendo il push dell'hub PER ULTIMO e non fatale,
          # così un suo fallimento non poteva terminare lo step prima delle upload CDN.
          #
          # Quella mitigazione proteggeva dal fallimento dello *script* di push. Non poteva
          # proteggere dalla conseguenza vera del raddoppio, che sta fuori dal runner: due
          # push allo stesso repo shard producono due build GitHub Pages concorrenti, e una
          # delle due va sistematicamente in `errored`. Con un push solo la causa sparisce
          # invece di essere assorbita, e le due proprietà che quel commento difendeva —
          # ordine e non-fatalità — sono conservate dal fallback dentro il loop.
          if [ ! -s "$RUNNER_TEMP/hub-landing.json" ]; then
            echo "::warning::no hub-landing.json — the landing grid was not refreshed for this article"
          fi

      - name: Purge the edge cache for what was published
        if: needs.resolve.outputs.skip != 'true' && needs.resolve.outputs.dry != 'true'
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/fast-summary.json"
          section="${{ needs.resolve.outputs.section }}"
          shard="${{ needs.resolve.outputs.shard }}"

          # Without this the article stays 404 at the apex even though the shard
          # has it and the origin serves it. Measured on run 30814047357: push
          # green on all 4 locales, origin-articolifrontaliere-it answered 200
          # with the right <title>, and the apex kept returning a cached 404.
          #
          # BOTH cache layers have to be purged, and the origin one is the one
          # that actually matters. locale-router.js fetches the shard origin
          # with `cf: { cacheEverything: true, cacheTtl: ORIGIN_CACHE_TTL }`,
          # and its own comment says it: "with cacheEverything it also
          # negative-caches origin 404s: a page that flips 404->200 on deploy
          # may serve a cached 404 from an already-probed colo for up to this
          # TTL" — 2 hours. That entry is keyed on the ORIGIN url, not the apex
          # one, so an apex-only purge reports success and changes nothing.
          # Measured: after purging 8 apex URLs the apex still answered 404 with
          # cf-cache-status HIT and a still-GROWING age (1262 -> 1476); adding
          # the one origin URL flipped it to 200 age=0 immediately.
          #
          # The origin path is the relpath verbatim, locale prefix included
          # (origin-...-de serves /de/grenzgaenger-artikel/..., not
          # /grenzgaenger-artikel/... — verified 200 vs 404).
          #
          # EVERY path this run pushed, apex + origin.
          #
          # It used to be `paths[0]` and `paths[2]` only — the article and the
          # archive's page-1 — with deep pages "deliberately excluded" because
          # they "only gain an entry at the tail and would blow the cap". The
          # chronological sort (issue #4974) retired the first half of that:
          # moving an article to the front shifts the boundary of every page,
          # so 31 pages per locale now change on every publish, not one. And
          # cf-purge-cache.mjs now batches past the 30-URL free-plan cap
          # instead of erroring, which retires the second half.
          #
          # Leaving them out meant every archive page but the first served
          # stale content for the full 4h edge TTL, with no ETag to revalidate
          # against — the pages the sort exists to keep fresh.
          #
          # Built in shell rather than one jq expression: the origin hostname
          # depends on the locale of the shard entry, which is easier to keep
          # obviously correct here than inside a jq reduce.
          urls=()
          while IFS=$'\t' read -r loc rel; do
            [ -n "$rel" ] || continue
            rel="${rel%index.html}"
            urls+=("https://frontaliereticino.ch/$rel")
            urls+=("https://origin-$shard-$loc.frontaliereticino.ch/$rel")
          done < <(jq -r '.shards[] | .locale as $l | .paths[] | [$l, .] | @tsv' "$summary")

          # The landing pages too, or the grid we just refreshed sits behind a
          # 4h edge cache and the article stays invisible on the page readers
          # land on — the exact symptom this refresh exists to fix.
          hub="$RUNNER_TEMP/hub-landing.json"
          if [ -s "$hub" ]; then
            while IFS=$'\t' read -r loc rel; do
              [ -n "$rel" ] || continue
              rel="${rel%index.html}"
              urls+=("https://frontaliereticino.ch/$rel")
              urls+=("https://origin-$shard-$loc.frontaliereticino.ch/$rel")
            done < <(jq -r '.pages[] | [.locale, .path] | @tsv' "$hub")
          fi

          echo "purging ${#urls[@]} URL(s)"
          printf '  %s\n' "${urls[@]}"

          if [ "${#urls[@]}" -eq 0 ]; then
            echo "::notice::no published URLs — skip targeted edge purge"
            exit 0
          fi

          # The SAME list is purged a second time after the verification step
          # (issue #114), so it is written down here instead of being rebuilt
          # there. A second construction is a second thing to keep in sync, and
          # the failure mode of a divergence is silent: the re-purge would clean
          # a set of URLs that is no longer the set that was published, and a
          # poisoned 404 would survive with every log line saying "purged".
          # One producer, one file, one consumer.
          printf '%s\n' "${urls[@]}" > "$RUNNER_TEMP/edge-purge-urls.txt"

          # cf-purge-cache.mjs is non-fatal when CF_API_TOKEN is absent — it
          # prints a notice and exits 0. Wrong posture here: a silent skip is
          # exactly how an article stays 404 for two hours, so check first.
          if [ -z "${CF_API_TOKEN:-}" ]; then
            echo "::error::CF_API_TOKEN missing after the Remote Config load — the article is on the shard but the apex will keep serving a cached 404"
            exit 1
          fi
          # Through retry-cmd.sh (issue #268: a single Cloudflare API blip —
          # "Authentication error" on the FIRST purge_cache call of an
          # otherwise-healthy run — failed this step outright with no retry.
          # Idempotent: a re-invocation just re-resolves the zone and re-POSTs
          # purge_cache for the same URL list; purging an already-purged URL is
          # a no-op, so retrying the whole script is safe.
          bash scripts/ci/retry-cmd.sh node scripts/cf-purge-cache.mjs "--files=$(IFS=,; echo "${urls[*]}")"

      - name: Verify the article is actually readable
        if: needs.resolve.outputs.skip != 'true' && needs.resolve.outputs.dry != 'true'
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/fast-summary.json"
          section="${{ needs.resolve.outputs.section }}"
          shard="${{ needs.resolve.outputs.shard }}"
          owner="$(jq -r --arg s "$shard" '.[$s] // "valerielinc-ops"' scripts/lib/section-shard-owners.json)"

          # Two checks, deliberately different in strength, because they answer
          # different questions.
          #
          # HARD — the shard ORIGIN must serve the page. That is entirely within
          # this pipeline's control: it means the push landed and Pages built
          # it. A failure here is a broken publish.
          #
          # SOFT — the apex. Cloudflare's negative cache for the origin fetch is
          # eventually consistent and a `files` purge propagates per PoP, so the
          # apex can lag by minutes. Measured across three publishes: en/de/fr
          # answered 200 within seconds every time while IT — the apex locale,
          # whose 404 is cached in far more PoPs because it takes far more
          # traffic — needed longer than a 3-minute budget twice, and was 200
          # shortly after. Failing the run on that would report a successful
          # publish as broken, which is its own kind of lie.
          fail=0

          # WHY THE TIMEOUT IS NOT ITSELF THE VERDICT (issue #31).
          #
          # This gate was failing ~10% of runs, and every time it was right that
          # the URL was 404 — but wrong about the reason it reported ("the shard
          # push did not become readable" points at the push, which had landed).
          # The real cause sits one layer down, outside the runner: the GitHub
          # Pages build for that shard commit comes back `errored` with a
          # duration of 0ms. Nothing was built, so the page stays 404 until some
          # LATER push happens to trigger a good build.
          #
          # Measured on frontaliere-articolisvizzera-fr: build errored 0ms at
          # 2026-08-08T03:23:51Z for commit 1ed91403 (run 31237078985), and the
          # very next build — same commit, no new push — was `built` in 34s.
          # Same signature at 2026-08-07T22:50:48Z. An errored 0ms build is a
          # transient fault on GitHub's side, and re-requesting it clears it.
          #
          # So on a timeout we ask Pages what happened. `errored` requests one
          # rebuild and polls once more; `building`/`queued` means a build is
          # already in flight and just needs more time, so it polls again
          # without requesting a second one (issue #260 — the FR shard was
          # still `building` after the first 3-minute window and would have
          # gone `built` shortly after, same as the IT apex case measured
          # below). Either case is ONE retry, not a loop: a Pages outage or a
          # build that is still not done after the second poll is a real
          # failure and must stay red rather than be papered over. Either way
          # the error message now carries the build status, so the issue this
          # opens points at the cause instead of the symptom.
          #
          # $GITHUB_PAT is the same credential the shard push uses (Remote
          # Config, loaded above; push-article-shard-incremental.sh reads
          # $SHARD_PUSH_PAT then falls back to it). Verified 2026-08-08: it is a
          # classic PAT with `repo`, which is enough for both Pages endpoints
          # even though it only has push — not admin — on the shard repos.
          # load-rc-env.mjs already ::add-mask::s it.

          # WHY EVERY PROBE CARRIES A CACHE-BUST QUERY (issue #114).
          #
          # This gate was writing the 404s it exists to detect into the caches
          # the step above had just purged. It runs AFTER the purge, and until
          # the step at the bottom of this job there was nothing behind it, so
          # those writes were never cleared.
          #
          # THE TWO PROBES POISON DIFFERENT CACHES, and it matters, because the
          # obvious story about the first one is wrong. Measured 2026-08-09:
          #
          #   origin-<shard>-<loc>.frontaliereticino.ch  →  server: GitHub.com,
          #     no cf-cache-status, no cf-ray. The host is DNS-only: an external
          #     request never enters Cloudflare at all, so it CANNOT write the
          #     entry locale-router.js reads (that entry is created only by the
          #     Worker's own subrequest, and is what the origin URLs in the purge
          #     list above are for). What it does hit is GitHub's Fastly, which
          #     negative-caches: x-cache MISS then HIT, x-cache-hits 1, on a 404.
          #
          #   frontaliereticino.ch  →  server: cloudflare, and on a 404
          #     cf-cache-status MISS then HIT with `s-maxage=7200`. THIS is the
          #     entry a reader and a crawler receive, and this loop used to walk
          #     it naked eight times at fifteen-second intervals.
          #
          # So the apex probe is the one that manufactures #114 — the article
          # alive, the origin serving 200, the sitemap announcing it, and the
          # apex answering a cached 404 with a growing `age` on the locale the
          # gate had just seen green.
          #
          # The origin probe is not innocent either, and its second-order effect
          # is the nastier one: the 404 it parks in Fastly is served back to THIS
          # GATE'S OWN next polls, so a shard that finishes building at second 20
          # can keep reading the gate's own stale 404 for the rest of the window
          # — and the Worker's subrequest, landing on the same Fastly, can pick
          # it up and cache it for the full ORIGIN_CACHE_TTL. A gate that both
          # creates and then re-reads its own negative answer is not measuring
          # anything.
          #
          # WHY A QUERY WORKS. Both caches key on the full URL including the
          # query, and GitHub Pages ignores the query for static files (verified
          # in #114 from the other end: the same apex URL answered 404 naked and
          # 200 with `?cb=<epoch>`). So the probe still measures the real origin
          # — it just lands on a throwaway key that no reader will ever ask for.
          # `$GITHUB_RUN_ID` + run attempt + a monotonic counter makes every
          # probe unique, so neither a retry nor the next poll can read an
          # earlier probe. The counter is global to this script, not the
          # per-call loop index: the origin loop below can call poll_origin
          # TWICE for the same URL (poll → Pages rebuild → poll again), and a
          # loop-local index restarts at 1 both times, so the recovery poll
          # would silently replay the same 12 bust keys the first poll just
          # wrote — reading its own stale answers instead of the rebuilt
          # origin.
          #
          # `_fpcb` IS NOT A NEW NAME, and that is the point. The site's liveness
          # probe for the same pipeline — scripts/wait-for-live-article-shards.mjs
          # over scripts/lib/live-link-check.mjs, both on
          # valerielinc-ops/frontaliere-si-o-no — has always busted its probes:
          # `_fpcb=<epoch>` plus `Cache-Control: no-cache` on the content check,
          # `_=<epoch>` inside checkLink. This gate is the shell reimplementation
          # of that check for the shards this repo pushes, and the port dropped
          # the bust. So this is not a new idea being tried here: it is the
          # restoration of a property the other half of the pipeline never lost,
          # under the same query name so that a grep finds both sides.
          #
          # `Cache-Control: no-cache` is sent for the same reason it is sent
          # there: with a unique key it changes nothing at Cloudflare, but it
          # tells Fastly not to hand back whatever it may already hold.
          #
          # This is the fix; the re-purge at the bottom is the backstop for the
          # callers this pipeline does not control. It is that way round because
          # #114 measured a `files` purge returning success while evicting
          # nothing (the `Vary: Origin` double-variant class), so "purge it
          # afterwards" cannot be the thing the correctness rests on.
          #
          # The bust is built INSIDE this function on purpose. `$1` stays the
          # canonical URL, and `$1` is what gets echoed and put in the error and
          # warning annotations, so a probe-only query can never leak into a URL
          # a human is told to open — or into an annotation another workflow
          # parses.
          #
          # Pinned by generator/tests/fast-publish-probe-cache-poisoning.test.mjs.
          PROBE_SEQ=0
          probe_url() {
            local u="$1" sep='?'
            PROBE_SEQ=$((PROBE_SEQ + 1))
            case "$u" in *\?*) sep='&' ;; esac
            printf '%s%s_fpcb=%s.%s.%s' \
              "$u" "$sep" "${GITHUB_RUN_ID:-local}" "${GITHUB_RUN_ATTEMPT:-1}" "$PROBE_SEQ"
          }

          # Poll $1 until it answers 200, at most $2 times, with optional curl
          # timeout $3. Last code observed is left in $POLL_CODE. $1 is never
          # requested as-is: see probe_url.
          poll_origin() {
            local u="$1" attempts="$2" timeout="${3:-20}" i
            POLL_CODE=000
            for i in $(seq 1 "$attempts"); do
              echo "poll_origin attempt $i/$attempts"
              set +e
              POLL_CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time "$timeout" \
                           -H 'Cache-Control: no-cache' "$(probe_url "$u")")"
              set -e
              [ "$POLL_CODE" = "200" ] && return 0
              if [ "$i" -lt "$attempts" ]; then sleep 15; fi
            done
            return 1
          }

          # Latest Pages build state for repo $1 -> $PAGES_STATUS (+ $PAGES_ERROR).
          # Never fatal: an unreachable or unauthorised API just reads "unknown",
          # which falls through to the same hard failure as before.
          pages_latest() {
            local repo="$1" body
            set +e
            body="$(curl -s --max-time 20 \
                    -H "Authorization: Bearer ${GITHUB_PAT:-}" \
                    -H "Accept: application/vnd.github+json" \
                    "https://api.github.com/repos/$repo/pages/builds/latest")"
            set -e
            PAGES_STATUS="$(printf '%s' "$body" | jq -r '.status // "unknown"' 2>/dev/null || echo unknown)"
            PAGES_ERROR="$(printf '%s' "$body" | jq -r '.error.message // ""' 2>/dev/null || echo "")"
            [ -n "$PAGES_STATUS" ] || PAGES_STATUS=unknown
          }

          if [ -z "${GITHUB_PAT:-}" ]; then
            echo "::warning::GITHUB_PAT is not set — the Pages-build recovery is unavailable, a timeout will fail as it did before"
          fi

          echo "── origin (hard gate)"
          declare -A pages_rebuild_requested=()
          declare -A origin_locale_gate_started=()
          while IFS=$'\t' read -r loc p0; do
            u="https://origin-$shard-$loc.frontaliereticino.ch/${p0%index.html}"
            repo="$owner/frontaliere-$shard-$loc"

            # Wait/recover once per locale until its Pages deployment is live;
            # then check each remaining article path once against that same build.
            # A missing batch member cannot be repaired by repeating the same
            # Pages wait for every ID, and doing so could exceed this job's timeout.
            if [ -n "${origin_locale_gate_started[$loc]:-}" ]; then
              if poll_origin "$u" 1 8; then
                echo "  200  $u"
              else
                echo "::error::$u answers $POLL_CODE after the locale deployment gate passed"
                fail=1
              fi
              continue
            fi
            origin_locale_gate_started[$loc]=1

            if poll_origin "$u" 12; then
              echo "  200  $u"
              continue
            fi

            pages_latest "$repo"
            echo "::warning::$u answers $POLL_CODE after the first poll — latest Pages build for $repo is '$PAGES_STATUS'"

            # `building`/`queued` is not a failure to react to — it is the
            # ORIGIN side of the same "budget too short" case the apex
            # comment above already documents for IT: a build in flight can
            # legitimately outlast a 3-minute poll and still land moments
            # later. Requesting a second build here would race the one
            # already running, so this branch only waits; only `errored`
            # (a build that already gave up) gets one rebuild request per locale.
            case "$PAGES_STATUS" in
              errored)
                if [ -n "${pages_rebuild_requested[$loc]:-}" ]; then
                  echo "::error::the Pages build for $repo is still 'errored' after its one rebuild request"
                  fail=1
                  continue
                fi
                pages_rebuild_requested[$loc]=1
                echo "── the Pages build errored; requesting one rebuild of $repo"
                set +e
                rc="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X POST \
                      -H "Authorization: Bearer ${GITHUB_PAT:-}" \
                      -H "Accept: application/vnd.github+json" \
                      "https://api.github.com/repos/$repo/pages/builds")"
                set -e
                if [ "$rc" != "201" ]; then
                  echo "::error::$u answers $POLL_CODE and the Pages build for $repo is 'errored'; the rebuild request returned HTTP $rc so it could not be retried"
                  fail=1
                  continue
                fi
                ;;
              building|queued)
                echo "── Pages build for $repo is still '$PAGES_STATUS'; polling longer instead of requesting a duplicate build"
                ;;
              *)
                echo "::error::$u answers $POLL_CODE — the shard push did not become readable (Pages build status: $PAGES_STATUS)"
                fail=1
                continue
                ;;
            esac

            if poll_origin "$u" 12; then
              echo "  200  $u  (recovered after the second poll)"
              continue
            fi

            pages_latest "$repo"
            echo "::error::$u answers $POLL_CODE after a second poll — GitHub Pages build for $repo is '$PAGES_STATUS'${PAGES_ERROR:+ ($PAGES_ERROR)}. The push landed; this is a Pages build failure on the shard, not a missing article."
            fail=1
          done < <(jq -r '.shards[] | .locale as $l | .articlePaths[] | [$l, .] | @tsv' "$summary")

          # The apex probe goes through poll_origin too — same cache-bust, one
          # implementation. It used to be an inline copy of the same loop with a
          # naked curl, and it is the WORSE of the two poisoners: it is the only
          # one that reaches Cloudflare at all (the origin hosts are DNS-only —
          # see the measurements above), and the entry it writes is the one a
          # reader and a crawler receive. Eight attempts × 15s of that, on a
          # locale whose shard is still building, is issue #114 being
          # manufactured by its own gate.
          #
          # WHAT THIS COSTS, stated plainly: with the bust, the check no longer
          # observes the EDGE — it observes the origin through the Worker, so it
          # can no longer report "the edge has not caught up yet". That signal
          # was warning-only and never gated anything, and buying it required
          # creating the very negative entry this issue is about, on the URL a
          # reader asks for. Edge freshness is now the job of the two purge
          # steps, which is where it belongs; what survives here is the check
          # that the Worker routes the apex to the right shard at all, which is
          # the part this pipeline can actually break.
          echo "── apex (best effort, through the Worker; edge freshness is the purge steps' job)"
          while IFS= read -r u; do
            if poll_origin "$u" 1 8; then echo "  200  $u"
            else echo "::warning::$u still answers $POLL_CODE through the Worker on a cache-busted probe — so this is the apex routing or the shard origin itself, not a stale edge entry"; fi
          done < <(jq -r '.shards[].urls[]' "$summary")

          [ "$fail" = "0" ] || exit 1

      - name: Re-purge the edge cache after the verification
        # `always()`, and that is the load-bearing part: the run this exists for
        # is the FAILING one. When the verification times out, some locale was
        # 404 for minutes while the world could reach it, and that is precisely
        # when a negative entry is most likely to be sitting in the cache.
        # Skipping the cleanup on failure would leave that 404 behind on exactly
        # the runs that needed the cleanup most.
        if: always() && needs.resolve.outputs.skip != 'true' && needs.resolve.outputs.dry != 'true'
        run: |
          set -euo pipefail

          # WHY A SECOND PURGE (issue #114).
          #
          # The first purge runs BEFORE the verification, and the verification
          # takes minutes — up to 12 polls × 15s per locale, plus a Pages rebuild
          # and 12 more. Anything that asks for one of these URLs during that
          # window, while the shard is still building, gets a 404 and leaves it
          # in the cache with nothing behind it to clear. The probes no longer do
          # that (they carry a cache-bust), but they were never the only caller:
          # the sitemap and slugs.json are already published by then, so a
          # crawler arriving in that window poisons the same key just as well.
          # Measured in #114 the 404 outlived the run by hours, on a locale the
          # gate itself had seen green.
          #
          # This is a backstop, not the fix. #114 also measured a `files` purge
          # returning success without evicting the variant the reader receives
          # (the `Vary: Origin` double-variant class). Not creating the entry is
          # what actually holds; re-purging is what covers the callers this
          # pipeline does not control.
          #
          # The list is READ, not rebuilt — see the producer in the first purge
          # step. Rebuilding it here would be a second copy of the apex+origin
          # construction, free to drift, whose divergence shows up as a purge
          # that logs success over the wrong URLs.
          list="$RUNNER_TEMP/edge-purge-urls.txt"
          if [ ! -s "$list" ]; then
            # No list means the first purge step never ran (an earlier step
            # failed, or the job was cancelled before it). Nothing was purged, so
            # there is nothing to re-purge: a notice, not a failure.
            echo "::notice::no $list — the first purge step did not run, so there is nothing to re-purge"
            exit 0
          fi

          mapfile -t urls < "$list"
          echo "re-purging ${#urls[@]} URL(s) after the verification"
          printf '  %s\n' "${urls[@]}"

          if [ "${#urls[@]}" -eq 0 ]; then
            echo "::notice::empty purge list — skip targeted edge re-purge"
            exit 0
          fi

          # If the list exists the first purge step ran, and that step exits 1
          # when CF_API_TOKEN is missing — so an absent token here means the env
          # was clobbered mid-job. Loud rather than silent: a poisoned key with
          # no purge behind it is a multi-hour 404 on a page whose sitemap entry
          # is already live, which is exactly the failure this step exists to end.
          if [ -z "${CF_API_TOKEN:-}" ]; then
            echo "::error::CF_API_TOKEN is gone after the verification — the post-verify purge cannot run, and a 404 cached during the build window would survive for hours"
            exit 1
          fi
          # Through retry-cmd.sh — same blip class and same idempotency
          # justification as the first purge step above (issue #268).
          bash scripts/ci/retry-cmd.sh node scripts/cf-purge-cache.mjs "--files=$(IFS=,; echo "${urls[*]}")"

      - name: Summary
        if: always() && needs.resolve.outputs.skip != 'true'
        run: |
          {
            echo "### fast-publish-article"
            echo
            echo "- ids: \`${{ needs.resolve.outputs.ids }}\`"
            echo "- section: \`${{ needs.resolve.outputs.section }}\`"
            echo "- mode: \`$([ "${{ needs.resolve.outputs.dry }}" = "true" ] && echo DRY || echo ARMED)\`"
            if [ "${{ needs.resolve.outputs.dry }}" = "true" ]; then
              echo
              echo "Dry run: rendered, validated and probed shard write access. Pushed nothing."
              echo "A push touching \`content/**\` publishes; remove \`.github/FAST_PUBLISH_DISABLED\` if it is present."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
