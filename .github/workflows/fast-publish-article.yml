# Fast-publish one article: render its 4 locale pages + the section archive and
# push them straight to the article shard repos and the CDN, skipping the full
# site build.
#
# WHY THIS EXISTS (issue #4974 item 3, migration §10.4 step 4)
# ───────────────────────────────────────────────────────────
# The main repo's `fast-publish-article.yml` was what made a generated article
# visible in minutes. §4 of the migration doc filed it under "site-only" — a
# judgement about where it RAN, not what it DID — and after the cutover nothing
# dispatched it. The result: every article generated since 2026-08-02 exists in
# the corpus, is listed in the API sitemaps, and 404s on the site.
#
# THE CHAIN LINK. `push: content/**` is the same link generate-article.yml
# restored in 0517589: a corpus push means an article was actually produced, so
# publication starts immediately instead of waiting for anything to dispatch it.
# It has to be a push trigger and not a workflow dispatch, because the Remote
# Config PAT cannot dispatch workflows — 403 "Resource not accessible by
# integration", re-verified. Push is the one thing it can do.
#
# ARMING. A corpus push PUBLISHES. That was not the first posture: every run
# used to be dry unless a repo variable said otherwise, so the first execution
# could exercise the whole path against the real corpus before anything reached
# a shard. That has happened — the dry run went green end to end, and twelve
# articles have since been published through the armed path — so the gate has
# served its purpose and the default is now to publish.
#
# KILL SWITCH, in this order:
#   1. `.github/FAST_PUBLISH_DISABLED` present in the repo  -> dry
#   2. repo variable FAST_PUBLISH_ARMED == 'false'          -> dry
#   3. workflow_dispatch with dry_run: true                 -> dry
# The file is first because it is the one a session can set: this environment's
# agent proxy refuses the Actions variables API ("Access to this GitHub Actions
# path is not permitted through this proxy"), so a variable-only switch cannot
# be flipped from here — which is exactly how the pipeline sat idle after the
# dry run passed. An in-repo switch is also reviewable in a diff and revertible
# with a commit.
#
# SHARD WRITE ACCESS — already proven, before this workflow ever runs.
# §10.2 recorded "NOT YET PROVEN ... the write has to be proven inside
# Actions", because the agent proxy refuses POST /git/refs. That conclusion was
# too pessimistic: the git receive-pack ADVERTISEMENT
# (GET /info/refs?service=git-receive-pack) is permission-gated and is a plain
# GET, so it goes through. Measured 2026-08-03 with Remote Config's GITHUB_PAT:
# all 8 article shards answer 200; the control (torvalds/linux, which this PAT
# obviously cannot write) answers 403 on receive-pack and 200 on upload-pack.
# The PAT can write to every article shard. The probe step below re-runs that
# same check every time, so a revoked or narrowed PAT fails loudly here rather
# than half-way through a publish.
#
# Shards belong to nanakokyobashi-rgb (scripts/lib/section-shard-owners.json),
# so this repo pushes to its own repos. The main repo's SHARD_*_DEPLOY_KEY
# secrets are irrelevant here — main needed them because main pushed to repos
# it did not own.

name: fast-publish-article

on:
  push:
    paths:
      # Self-test on change, always dry (see the `dry` resolution below).
      - '.github/workflows/fast-publish-article.yml'
      - 'scripts/publish-article-fast.mjs'
      # THE CHAIN LINK — a corpus push means an article was produced.
      - 'content/**'
  workflow_dispatch:
    inputs:
      article_id:
        description: 'Article id to publish (empty = derive from the last corpus commit)'
        required: false
        type: string
      section:
        description: 'frontaliere or svizzera (empty = derive)'
        required: false
        type: string
      dry_run:
        description: 'Render and validate, push nothing'
        required: false
        default: true
        type: boolean

# Never cancel: a cancelled run can leave some locales pushed and others not.
concurrency:
  group: fast-publish-article
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          # persist-credentials: false is load-bearing, not hygiene. It stops
          # actions/checkout leaving its GITHUB_TOKEN in an extraheader that
          # would then be used ahead of the PAT for every shard push — the
          # `contents: read` token, which cannot write and whose push fires no
          # workflow anyway.
          persist-credentials: false

      - name: Resolve mode, article id and section
        id: mode
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Dispatch says what it wants; default stays dry so a manual poke
            # cannot publish by accident.
            dry=true
            [ "${{ inputs.dry_run }}" = "false" ] && dry=false
          else
            # A push publishes, unless a kill switch says otherwise, and unless
            # it carries no article at all: a push that only touched this
            # workflow or the driver is a self-test.
            dry=false
            if [ -f .github/FAST_PUBLISH_DISABLED ]; then
              echo "::warning::.github/FAST_PUBLISH_DISABLED present — running dry"
              dry=true
            elif [ "${{ vars.FAST_PUBLISH_ARMED }}" = "false" ]; then
              echo "::warning::repo variable FAST_PUBLISH_ARMED=false — running dry"
              dry=true
            fi
            changed="$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)"
            if ! printf '%s\n' "$changed" | grep -q '^content/'; then
              dry=true
            fi
          fi
          echo "dry=$dry" >> "$GITHUB_OUTPUT"

          id="${{ inputs.article_id }}"
          section="${{ inputs.section }}"

          if [ -z "$id" ]; then
            # Derive from the corpus commit: a generated article always adds a
            # body file per locale under content/blog-body{,-ch}/<loc>/<id>.ts.
            # `grep || true` — under `set -e` a no-match exit 1 would kill the
            # step, and "no article in this push" is a normal outcome, not a
            # failure.
            body="$(git diff --name-only HEAD~1 HEAD 2>/dev/null \
                    | grep -E '^content/blog-body(-ch)?/[a-z]{2}/.+\.ts$' | head -1 || true)"
            if [ -n "$body" ]; then
              id="$(basename "$body" .ts)"
              case "$body" in
                content/blog-body-ch/*) section=svizzera ;;
                *)                      section=frontaliere ;;
              esac
            fi
          fi

          if [ -z "$id" ]; then
            echo "no article body in this push — nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "section=${section:-frontaliere}" >> "$GITHUB_OUTPUT"
          echo "resolved id=$id section=${section:-frontaliere} dry=$dry"

      - name: Set up Node
        if: steps.mode.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.mode.outputs.skip != 'true'
        run: npm ci

      - name: Prepare Firebase credentials
        if: steps.mode.outputs.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not set — Remote Config is the only source of the shard PAT and the R2 credentials"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config
        if: steps.mode.outputs.skip != 'true'
        run: node generator/scripts/load-rc-env.mjs

      - name: Probe shard write access
        if: steps.mode.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_PAT:-}" ]; then
            echo "::error::GITHUB_PAT missing after the Remote Config load"
            exit 1
          fi
          section="${{ steps.mode.outputs.section }}"
          shard="$([ "$section" = "svizzera" ] && echo articolisvizzera || echo articolifrontaliere)"
          owner="$(jq -r --arg s "$shard" '.[$s] // "valerielinc-ops"' scripts/lib/section-shard-owners.json)"

          # The receive-pack advertisement is permission-gated: a credential
          # that cannot write gets 403 here while still getting 200 on
          # upload-pack. This is a GET and writes nothing.
          fail=0
          for loc in it en de fr; do
            repo="$owner/frontaliere-$shard-$loc"
            # set +e: a non-2xx is data here, not a reason to end the step.
            set +e
            code="$(curl -s -o /dev/null -w '%{http_code}' -u "x-access-token:$GITHUB_PAT" \
                    "https://github.com/$repo.git/info/refs?service=git-receive-pack")"
            set -e
            if [ "$code" = "200" ]; then
              echo "  write OK   $repo"
            else
              echo "::error::no write access to $repo (receive-pack returned $code)"
              fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1

      - name: Render the article (fast path)
        if: steps.mode.outputs.skip != 'true'
        run: |
          set -euo pipefail
          npx -y tsx@4 scripts/publish-article-fast.mjs \
            --id "${{ steps.mode.outputs.id }}" \
            --section "${{ steps.mode.outputs.section }}" \
            --out "$RUNNER_TEMP/fast-dist" \
            --summary "$RUNNER_TEMP/fast-summary.json"

      # The hub LANDING was the one article surface a full site deploy still
      # owned. Since ARTICOLIFRONTALIERE_BUILD_EMIT_SKIP went on (2026-07-29
      # 19:28) the site stopped writing it and nothing took over: the article
      # was live at its own URL, in /tutti/ and in the sitemap, while the page
      # readers land on kept showing that evening's set. Nothing failed, which
      # is why it went unnoticed for a week.
      #
      # Best-effort on purpose: a refreshed grid must never be the reason a
      # published article fails to reach its shard. The script is fail-closed
      # per page — it leaves a page alone rather than write a half-formed one —
      # so the worst case here is the hub staying as stale as it already was.
      - name: Refresh the hub landing grid
        if: steps.mode.outputs.skip != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          npx -y tsx@4 scripts/refresh-hub-landing.mjs \
            --out "$RUNNER_TEMP/fast-dist" \
            --section "${{ steps.mode.outputs.section }}" \
            --summary "$RUNNER_TEMP/hub-landing.json"

      - name: Validate what was rendered
        if: steps.mode.outputs.skip != 'true'
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/fast-summary.json"
          dist="$RUNNER_TEMP/fast-dist"

          # Every path the summary promises must exist and be non-empty. A
          # zero-item archive renders "successfully" (the core EMITS-EMPTY by
          # design), so size alone is not enough — the archive must also list
          # something.
          fail=0
          for loc in it en de fr; do
            n="$(jq -r --arg l "$loc" '.shards[] | select(.locale==$l) | .paths | length' "$summary")"
            if [ "${n:-0}" -lt 3 ]; then
              echo "::error::locale $loc has only ${n:-0} paths (expected article + bridge + >=1 archive page)"
              fail=1
            fi
          done

          while IFS= read -r rel; do
            if [ ! -s "$dist/$rel" ]; then
              echo "::error::missing or empty rendered file: $rel"
              fail=1
            fi
          done < <(jq -r '.shards[].paths[]' "$summary")

          # The archive must not be empty. This is the defect that made the
          # first local render produce four pages with zero <li> items when the
          # corpus symlinks were missing — it did not fail, it published nothing.
          it_archive="$(jq -r '.shards[] | select(.locale=="it") | .paths[2]' "$summary")"
          items="$(grep -o '<li>' "$dist/$it_archive" | wc -l)"
          if [ "$items" -lt 1 ]; then
            echo "::error::IT archive $it_archive lists 0 articles — refusing to publish an empty archive over the live one"
            fail=1
          fi
          echo "IT archive lists $items items"

          # The article registry (data/{blog,swiss}-articles-data.ts -> content/)
          # is read inside a try/catch in ogPagesPlugin: when it is missing the
          # render SUCCEEDS and silently downgrades NewsArticle.author from the
          # named Person to a generic Organization, and drops the visible byline.
          # Measured: 4 of 42 rendered files differ, all of them article pages,
          # and nothing anywhere reports a problem. Same silent-degradation class
          # as the empty archive above, so it gets the same treatment.
          it_article="$(jq -r '.shards[] | select(.locale=="it") | .paths[0]' "$summary")"
          if ! grep -q '"author":{"@type":"Person"' "$dist/$it_article"; then
            echo "::error::$it_article has no Person author in its NewsArticle JSON-LD — the article registry did not resolve (check the data/*-articles-data.ts symlinks)"
            fail=1
          else
            echo "article carries a named Person author"
          fi

          [ "$fail" = "0" ] || exit 1

      - name: Publish to shards and CDN
        if: steps.mode.outputs.skip != 'true' && steps.mode.outputs.dry != 'true'
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/fast-summary.json"
          dist="$RUNNER_TEMP/fast-dist"
          section="${{ steps.mode.outputs.section }}"
          shard="$([ "$section" = "svizzera" ] && echo articolisvizzera || echo articolifrontaliere)"

          # UN SOLO push per locale, articolo + hub insieme.
          #
          # Prima erano due — l'articolo qui, la griglia dell'hub più in basso in questo
          # stesso step — verso LO STESSO repo shard, a pochi secondi di distanza. Ogni push
          # innesca una build GitHub Pages, e due build concorrenti sullo stesso repo si
          # ostacolano: nello storico di frontaliere-articolisvizzera-it ogni pubblicazione
          # compare come una COPPIA di build allo stesso minuto, una `built` e una `errored`,
          # per giorni.
          #
          # Finché una delle due passava, il difetto era invisibile. Il 2026-08-06 alle 11:34
          # hanno fallito entrambe: l'articolo era committato nello shard (21 KB, verificato
          # via API) e l'origin rispondeva 404 ore dopo, perché il sito restava sull'ultima
          # build riuscita. Il gate «Verify the article is actually readable» ha fatto il suo
          # lavoro e ha reso rosso il run — 5 run su 20 in due giorni, su articoli diversi.
          #
          # Con un push solo la corsa non esiste: una build per pubblicazione.
          for loc in it en de fr; do
            mapfile -t paths < <(jq -r --arg l "$loc" '.shards[] | select(.locale==$l) | .paths[]' "$summary")
            hpaths=()
            if [ -s "$RUNNER_TEMP/hub-landing.json" ]; then
              mapfile -t hpaths < <(jq -r --arg l "$loc" '.pages[] | select(.locale==$l) | .path' "$RUNNER_TEMP/hub-landing.json")
            fi
            # Signature is <section> <locale> <scratch_dist_dir> <relpath...>.
            # There is no subtree argument: each relpath is BOTH the path under
            # $dist and the destination path inside the shard repo.
            echo "── pushing ${#paths[@]} article + ${#hpaths[@]} landing file(s) to $shard/$loc"
            # Il fallback conserva la differenza di severità che le due chiamate separate
            # esprimevano: l'articolo è duro, l'hub è morbido («the hub stays stale, the
            # article is unaffected»). Se il push combinato fallisce si riprova col solo
            # articolo, così una pagina hub malformata non può impedire la pubblicazione.
            if ! bash scripts/lib/push-article-shard-incremental.sh \
                 "$shard" "$loc" "$dist" "${paths[@]}" ${hpaths[@]+"${hpaths[@]}"}; then
              echo "::warning::combined push failed for $shard/$loc — retrying with the article alone (the hub stays stale)"
              bash scripts/lib/push-article-shard-incremental.sh \
                "$shard" "$loc" "$dist" "${paths[@]}"
            fi
          done

          while IFS=$'\t' read -r local key; do
            [ -n "$local" ] || continue
            bash scripts/lib/upload-cdn-file.sh "$local" "$key"
          done < <(jq -r '.cdnUploads[] | "\(.local)\t\(.key)"' "$summary")

          # Il push delle landing dell'hub non è più qui: è stato assorbito nel push unico
          # in cima a questo step.
          #
          # Il commento che stava in questo punto aveva già visto metà del problema — «this
          # change doubles the pushes per article, so that non-zero exit is a real
          # possibility» — e lo mitigava mettendo il push dell'hub PER ULTIMO e non fatale,
          # così un suo fallimento non poteva terminare lo step prima delle upload CDN.
          #
          # Quella mitigazione proteggeva dal fallimento dello *script* di push. Non poteva
          # proteggere dalla conseguenza vera del raddoppio, che sta fuori dal runner: due
          # push allo stesso repo shard producono due build GitHub Pages concorrenti, e una
          # delle due va sistematicamente in `errored`. Con un push solo la causa sparisce
          # invece di essere assorbita, e le due proprietà che quel commento difendeva —
          # ordine e non-fatalità — sono conservate dal fallback dentro il loop.
          if [ ! -s "$RUNNER_TEMP/hub-landing.json" ]; then
            echo "::warning::no hub-landing.json — the landing grid was not refreshed for this article"
          fi

      - name: Purge the edge cache for what was published
        if: steps.mode.outputs.skip != 'true' && steps.mode.outputs.dry != 'true'
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/fast-summary.json"
          section="${{ steps.mode.outputs.section }}"
          shard="$([ "$section" = "svizzera" ] && echo articolisvizzera || echo articolifrontaliere)"

          # Without this the article stays 404 at the apex even though the shard
          # has it and the origin serves it. Measured on run 30814047357: push
          # green on all 4 locales, origin-articolifrontaliere-it answered 200
          # with the right <title>, and the apex kept returning a cached 404.
          #
          # BOTH cache layers have to be purged, and the origin one is the one
          # that actually matters. locale-router.js fetches the shard origin
          # with `cf: { cacheEverything: true, cacheTtl: ORIGIN_CACHE_TTL }`,
          # and its own comment says it: "with cacheEverything it also
          # negative-caches origin 404s: a page that flips 404->200 on deploy
          # may serve a cached 404 from an already-probed colo for up to this
          # TTL" — 2 hours. That entry is keyed on the ORIGIN url, not the apex
          # one, so an apex-only purge reports success and changes nothing.
          # Measured: after purging 8 apex URLs the apex still answered 404 with
          # cf-cache-status HIT and a still-GROWING age (1262 -> 1476); adding
          # the one origin URL flipped it to 200 age=0 immediately.
          #
          # The origin path is the relpath verbatim, locale prefix included
          # (origin-...-de serves /de/grenzgaenger-artikel/..., not
          # /grenzgaenger-artikel/... — verified 200 vs 404).
          #
          # EVERY path this run pushed, apex + origin.
          #
          # It used to be `paths[0]` and `paths[2]` only — the article and the
          # archive's page-1 — with deep pages "deliberately excluded" because
          # they "only gain an entry at the tail and would blow the cap". The
          # chronological sort (issue #4974) retired the first half of that:
          # moving an article to the front shifts the boundary of every page,
          # so 31 pages per locale now change on every publish, not one. And
          # cf-purge-cache.mjs now batches past the 30-URL free-plan cap
          # instead of erroring, which retires the second half.
          #
          # Leaving them out meant every archive page but the first served
          # stale content for the full 4h edge TTL, with no ETag to revalidate
          # against — the pages the sort exists to keep fresh.
          #
          # Built in shell rather than one jq expression: the origin hostname
          # depends on the locale of the shard entry, which is easier to keep
          # obviously correct here than inside a jq reduce.
          urls=()
          while IFS=$'\t' read -r loc rel; do
            [ -n "$rel" ] || continue
            rel="${rel%index.html}"
            urls+=("https://frontaliereticino.ch/$rel")
            urls+=("https://origin-$shard-$loc.frontaliereticino.ch/$rel")
          done < <(jq -r '.shards[] | .locale as $l | .paths[] | [$l, .] | @tsv' "$summary")

          # The landing pages too, or the grid we just refreshed sits behind a
          # 4h edge cache and the article stays invisible on the page readers
          # land on — the exact symptom this refresh exists to fix.
          hub="$RUNNER_TEMP/hub-landing.json"
          if [ -s "$hub" ]; then
            while IFS=$'\t' read -r loc rel; do
              [ -n "$rel" ] || continue
              rel="${rel%index.html}"
              urls+=("https://frontaliereticino.ch/$rel")
              urls+=("https://origin-$shard-$loc.frontaliereticino.ch/$rel")
            done < <(jq -r '.pages[] | [.locale, .path] | @tsv' "$hub")
          fi

          echo "purging ${#urls[@]} URL(s)"
          printf '  %s\n' "${urls[@]}"

          # cf-purge-cache.mjs is non-fatal when CF_API_TOKEN is absent — it
          # prints a notice and exits 0. Wrong posture here: a silent skip is
          # exactly how an article stays 404 for two hours, so check first.
          if [ -z "${CF_API_TOKEN:-}" ]; then
            echo "::error::CF_API_TOKEN missing after the Remote Config load — the article is on the shard but the apex will keep serving a cached 404"
            exit 1
          fi
          node scripts/cf-purge-cache.mjs "--files=$(IFS=,; echo "${urls[*]}")"

      - name: Verify the article is actually readable
        if: steps.mode.outputs.skip != 'true' && steps.mode.outputs.dry != 'true'
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/fast-summary.json"
          section="${{ steps.mode.outputs.section }}"
          shard="$([ "$section" = "svizzera" ] && echo articolisvizzera || echo articolifrontaliere)"

          # Two checks, deliberately different in strength, because they answer
          # different questions.
          #
          # HARD — the shard ORIGIN must serve the page. That is entirely within
          # this pipeline's control: it means the push landed and Pages built
          # it. A failure here is a broken publish.
          #
          # SOFT — the apex. Cloudflare's negative cache for the origin fetch is
          # eventually consistent and a `files` purge propagates per PoP, so the
          # apex can lag by minutes. Measured across three publishes: en/de/fr
          # answered 200 within seconds every time while IT — the apex locale,
          # whose 404 is cached in far more PoPs because it takes far more
          # traffic — needed longer than a 3-minute budget twice, and was 200
          # shortly after. Failing the run on that would report a successful
          # publish as broken, which is its own kind of lie.
          fail=0

          echo "── origin (hard gate)"
          while IFS=$'\t' read -r loc p0; do
            u="https://origin-$shard-$loc.frontaliereticino.ch/${p0%index.html}"
            code=000
            for attempt in $(seq 1 12); do
              set +e
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$u")"
              set -e
              [ "$code" = "200" ] && break
              sleep 15
            done
            if [ "$code" = "200" ]; then echo "  200  $u"
            else echo "::error::$u answers $code — the shard push did not become readable"; fail=1; fi
          done < <(jq -r '.shards[] | [.locale, .paths[0]] | @tsv' "$summary")

          echo "── apex (best effort, edge cache is eventually consistent)"
          while IFS= read -r u; do
            code=000
            for attempt in $(seq 1 8); do
              set +e
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$u")"
              set -e
              [ "$code" = "200" ] && break
              sleep 15
            done
            if [ "$code" = "200" ]; then echo "  200  $u"
            else echo "::warning::$u still answers $code — origin is fine, the edge has not caught up yet (negative-cache TTL is 2h; it clears sooner in practice)"; fi
          done < <(jq -r '.shards[].url' "$summary")

          [ "$fail" = "0" ] || exit 1

      - name: Summary
        if: always() && steps.mode.outputs.skip != 'true'
        run: |
          {
            echo "### fast-publish-article"
            echo
            echo "- id: \`${{ steps.mode.outputs.id }}\`"
            echo "- section: \`${{ steps.mode.outputs.section }}\`"
            echo "- mode: \`$([ "${{ steps.mode.outputs.dry }}" = "true" ] && echo DRY || echo ARMED)\`"
            if [ "${{ steps.mode.outputs.dry }}" = "true" ]; then
              echo
              echo "Dry run: rendered, validated and probed shard write access. Pushed nothing."
              echo "A push touching \`content/**\` publishes; remove \`.github/FAST_PUBLISH_DISABLED\` if it is present."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
