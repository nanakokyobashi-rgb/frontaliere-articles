name: PR body contract

# Verifica che il body della PR rispetti il contratto di `REVIEW.md`: le due
# sezioni con l'header letterale e con contenuto vero, e nessun
# `Closes #a #b` sulla stessa riga (GitHub chiude solo la prima, le altre
# restano aperte in silenzio).
#
# Zero Claude, e questo è il punto: il reviewer segnalerebbe comunque la
# violazione come 🔴 process, ma spendendo un ciclo di review — quota condivisa
# col sito — per dire una cosa che una regex sa. Qui la si intercetta prima.
#
# Il `pr-body-contract.yml` del sito è molto più grande perché incorpora una
# decina di check del suo dominio (CLS degli slot pubblicitari, pattern dei
# sibling…) che qui non hanno senso: questo è il sottoinsieme generico,
# costruito sopra gli stessi due moduli condivisi, che restano sorvegliati dal
# manifest.

# `ready_for_review` e' load-bearing, non decorativo: il job qui sotto e' gated
# su `draft == false`, quindi finche' la PR e' draft il check NON gira affatto.
# Senza questo trigger, una draft promossa a ready non ha piu' nessun evento che
# lo faccia partire — `synchronize` fira sui push, non sul cambio di stato — e a
# differenza di `pr-collision-detector.yml` qui non c'e' nessuno `schedule:` che
# la recuperi. Il body resterebbe non verificato per tutta la vita della PR se
# dopo la promozione non arriva ne' un push ne' un edit del body.
#
# Cio' che si perde NON e' un gate di merge: `auto-merge-eval` valuta il
# completeness contract direttamente dal PR body (`prBodyContractOk(meta.body)`),
# non dalla sticky di questo workflow, e il percorso normale richiede comunque un
# `## LGTM` di Claude che il body lo legge. Si perde il feedback deterministico
# veloce, cioe' esattamente cio' per cui questo workflow esiste: intercettare con
# una regex una violazione che altrimenti costa un ciclo di review — quota
# condivisa col sito — per essere detta.
#
# Sul sito il job NON ha il gate `draft == false`: il check gira gia' sulle
# draft, quindi la stessa lista di trigger la' non ha questo buco e aggiungere
# `ready_for_review` comprerebbe solo un run ridondante a ogni promozione.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-body-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contract:
    # Due esclusioni:
    #  - Le draft sono lavoro in corso: il body si completa prima di uscire da
    #    draft, e segnalarlo prima sarebbe solo rumore.
    #  - `engine-lockstep-auto` e' la PR del MIRROR dell'engine: il suo body lo
    #    genera il workflow del sito, non un agente di qui, e pretendere il
    #    contratto umano su di essa e' un errore di categoria. Non e'
    #    accademico: quella PR ha il proprio auto-merge dedicato
    #    (`auto-merge-engine-lockstep.yml`), che tratta un check rosso come
    #    non-evento ed esce 0 — quindi un fallimento QUI la blocca in silenzio.
    #    E' il canale con cui le correzioni all'engine scendono dal sito: gia'
    #    una volta si e' interrotto senza che nulla lo dicesse, e nove commit
    #    non sono mai arrivati.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.ref != 'engine-lockstep-auto'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verifica il contratto del body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/pr-body-contract.mjs "${{ github.event.pull_request.number }}"
