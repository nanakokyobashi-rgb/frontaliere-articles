name: Auto-merge engine lockstep PR

# Mergia la PR che il mirror dell'engine del sito apre su questo repo.
#
# PERCHÉ ESISTE. `mirror-articles-engine.yml` (nel repo del sito) apre una PR qui a ogni
# push sull'engine + ogni 6h. Nessuna automazione la raccoglieva: PR #8 è rimasta verde su
# 6 check per 9 ore in attesa di una mano umana. Non è igiene — è nanako a RENDERE le
# pagine articolo, quindi finché l'engine non scende ogni articolo pubblicato esce da un
# engine vecchio. È già successo, e si è visto solo come `audit:footer-root-presence`
# passato da 23 a 3608 offender: nessun errore, nessuna CI rossa, solo pagine sbagliate.
#
# PERCHÉ IL PAT E NON `GITHUB_TOKEN`. Questa è la parte che sembra un dettaglio e non lo è.
# Un merge fatto con `GITHUB_TOKEN` non fa scattare nessun workflow a valle (regola
# anti-ricorsione di GitHub), e `publish-api.yml` è proprio su `push` che tocca `engine/**`.
# La PR risulterebbe mergiata e la superficie dati NON verrebbe rigenerata — un guasto più
# silenzioso di quello che questo workflow chiude. Il merge deve essere autenticato con un
# PAT vero.
#
# QUALE PAT. `GITHUB_PAT_NANAKO`, non `GITHUB_PAT`. Sono due credenziali diverse entrambe in
# Remote Config e non sono intercambiabili: `GITHUB_PAT` è un token *integration* senza
# Actions write (risponde 403 su dispatch, vedi l'intestazione di generate-article.yml),
# mentre `GITHUB_PAT_NANAKO` è un PAT classico dell'account con scope `repo` + `workflow`.
# Verificato il 2026-08-06 con una sonda su un ref inesistente: 422 «No ref found» invece di
# 403, cioè l'autorizzazione c'è.
#
# PERIMETRO. Solo il branch `engine-lockstep-auto`, che il mirror possiede in esclusiva e
# force-pusha a ogni run — è stato derivato, mai modificato a mano. Il mirror stesso ha una
# allowlist fail-closed sul diff staged che gli impedisce di nominare `content/**`, quindi
# quel branch non può portare corpus. Nessun altro branch viene mai toccato da qui.

on:
  # Alla fine dei check, non all'apertura: alla `opened` i check non sono ancora partiti e
  # il gate sotto troverebbe sempre uno stato pendente.
  check_suite:
    types: [completed]
  # Rete di sicurezza. `check_suite` può non arrivare (o arrivare mentre la PR è ancora in
  # rebase) e senza il cron la PR resterebbe ferma esattamente come prima — che è il difetto
  # che questo workflow chiude, quindi vale la pena avere due strade.
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

concurrency:
  group: auto-merge-engine-lockstep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  merge:
    runs-on: ubuntu-latest
    # 10 non bastava più (issue #265): RC_FETCH_ATTEMPTS/TOKEN_EXCHANGE_ATTEMPTS
    # sono saliti a 7 per attraversare una finestra di quota Firebase per-minuto
    # (issue #263), e i due hop insieme (token exchange + RC fetch, backoff
    # 1+2+4+8+16+32s ≈ 63s ciascuno) possono da soli costare ~140s nel caso
    # peggiore — prima ancora di checkout/npm ci/merge. Con un budget di soli
    # 10 minuti quel margine si assottiglia abbastanza da rischiare un
    # timeout-kill del job a metà retry, che appare come `cancelled` invece di
    # un fallimento pulito. 15 allinea questo job al resto della famiglia
    # auto-merge-*/pr-* che gira sullo stesso script (pr-autorebase.yml,
    # pr-redflag-fixer.yml).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # Il PAT arriva da Remote Config, non da qui: senza questo il credential di
          # actions/checkout resterebbe quello di GITHUB_TOKEN.
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: bash scripts/lib/npm-ci-retry.sh

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not set — it is the only source of the merge PAT"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config
        # Come in ogni altro workflow che invoca questo script (issue-triage.yml,
        # followup-drainer.yml, ecc.): lo script esce SEMPRE 0 by
        # design, quindi questo non maschera un fallimento reale — è qui per
        # coerenza con la famiglia e perché il caso "PAT assente" è già gestito
        # esplicitamente allo step di merge sotto (exit 1 con messaggio chiaro),
        # non silenziosamente.
        continue-on-error: true
        run: node generator/scripts/load-rc-env.mjs

      - name: Merge the lockstep PR when it is green
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${GITHUB_PAT_NANAKO:-}" ]; then
            echo "::error::GITHUB_PAT_NANAKO assente. NON ricado su GITHUB_TOKEN: un merge fatto con quello non farebbe scattare publish-api.yml, quindi la PR risulterebbe mergiata e la superficie dati resterebbe vecchia — silenziosamente. Meglio non mergiare affatto."
            exit 1
          fi
          export GH_TOKEN="$GITHUB_PAT_NANAKO"

          PR=$(gh pr list --head engine-lockstep-auto --state open --json number -q '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "Nessuna PR lockstep aperta — niente da fare."
            exit 0
          fi
          echo "PR lockstep aperta: #$PR"

          # Congela la HEAD prima dei check: il mirror force-pusha questo branch e
          # una nuova HEAD durante la valutazione non deve poter trasformare un
          # verdetto valido in un merge di contenuto mai verificato.
          HEAD_SHA=""
          if ! HEAD_SHA=$(gh pr view "$PR" --json headRefOid -q '.headRefOid // empty'); then
            echo "::error::HEAD lockstep non leggibile — non mergio."
            exit 1
          fi
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::HEAD lockstep non rappresentabile — non mergio."
            exit 1
          fi
          echo "HEAD lockstep verificata prima dei check: $HEAD_SHA"

          # Leggi i nomi dei check required con il comando nativo, ma prendi
          # OGNI stato dal payload check-runs della commit congelata. `gh pr
          # checks` senza una commit esplicita può restituire il verdetto di una
          # HEAD intermedia (A→B→A); il policy helper verifica head_sha su ogni
          # run e poi conserva la distinzione required/all. Output vuoto,
          # pagine malformate, run di un'altra HEAD e stati non sicuri sono tutti
          # no-op fail-closed; il prossimo check_suite/cron riprova.
          REQUIRED_NAMES_FILE="$RUNNER_TEMP/lockstep-required-names.json"
          REQUIRED_NAMES_EXIT=0
          if gh pr checks "$PR" --required --json name > "$REQUIRED_NAMES_FILE"; then
            REQUIRED_NAMES_EXIT=0
          else
            REQUIRED_NAMES_EXIT=$?
          fi
          CHECK_RUNS_FILE="$RUNNER_TEMP/lockstep-check-runs.json"
          CHECK_RUNS_EXIT=0
          if gh api --paginate --slurp \
            "repos/${GH_REPO}/commits/${HEAD_SHA}/check-runs?per_page=100" > "$CHECK_RUNS_FILE"; then
            CHECK_RUNS_EXIT=0
          else
            CHECK_RUNS_EXIT=$?
          fi
          if ! REQUIRED_DECISION=$(node scripts/ci/native-automerge-sweep-policy.mjs \
            --required-check-runs "$CHECK_RUNS_FILE" "$REQUIRED_NAMES_FILE" "$HEAD_SHA" 2>&1); then
            echo "Check required sulla HEAD non autorizzante — non mergio: $REQUIRED_DECISION"
            exit 0
          fi
          echo "check required: $REQUIRED_DECISION"
          if [ "$REQUIRED_NAMES_EXIT" -ne 0 ] || [ "$CHECK_RUNS_EXIT" -ne 0 ]; then
            echo "Lettura dei nomi/check-run non conclusa con successo (required=$REQUIRED_NAMES_EXIT, runs=$CHECK_RUNS_EXIT) — non mergio."
            exit 0
          fi
          if ! CHECK_DECISION=$(node scripts/ci/native-automerge-sweep-policy.mjs \
            --all-check-runs "$CHECK_RUNS_FILE" "$REQUIRED_NAMES_FILE" "$HEAD_SHA" 2>&1); then
            echo "Check completo sulla HEAD non autorizzante — non mergio: $CHECK_DECISION"
            exit 0
          fi
          echo "check completo: $CHECK_DECISION"

          # `--merge`, non `--squash`: il commit del mirror porta il SHA del sito da cui
          # l'engine è stato copiato, che è l'unica traccia di provenienza fra i due repo.
          # Uno squash la sostituirebbe col titolo della PR e la perderebbe. Il match
          # HEAD rende atomico il confine fra snapshot/check e merge rispetto a un
          # force-push concorrente: in caso di drift GitHub rifiuta il merge.
          gh pr merge "$PR" --merge --delete-branch=false --match-head-commit "$HEAD_SHA"
          echo "PR #$PR mergiata con il PAT: publish-api.yml riceve il push e rigenera la superficie dati."
