name: Publish article data API

# This repository owns the article corpus. The site that renders it lives in a
# separate repository and consumes this data as plain JSON over HTTP — it must
# never reach into these sources at build time. Publishing on every push to main
# is what lets the two repos move independently: an article lands here and is
# live for consumers without the site repo deploying anything.
#
# JSON is the contract on purpose. The previous coupling shipped the registry as
# a Rollup-shaped ES module; republishing it out-of-band as a standalone esbuild
# bundle produced a module whose generated namespace export the consumer expected
# and did not find, and every article page on the live site sat on a loading
# skeleton. A JSON document has no module shape to disagree about.

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      # engine/** matters as much as the corpus: build-api.mjs is a thin caller
      # over engine/rssFeeds.mjs and engine/newsTickerDataPlugin.ts, both of
      # which arrive here through the mirror. Without this, a fix to the
      # GENERATOR never republishes — the surface keeps being rebuilt from the
      # old logic until some unrelated corpus change happens to come along.
      # Found the hard way: the fix that unfroze a three-month-stale RSS feed
      # landed here and changed nothing, because only content/ was watched.
      - 'engine/**'
      - 'scripts/build-api.mjs'
      - '.github/workflows/publish-api.yml'
  workflow_dispatch:

# One publish at a time, and never cancel one in flight: a half-written data
# surface is worse than a slightly stale one.
concurrency:
  group: publish-api
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Remote Config holds the R2 and Cloudflare credentials the edge push
      # below needs. Without these two steps that push would find no
      # credentials, warn, and skip — a silent no-op reported as success, which
      # is the failure mode this migration produced three times already.
      # Best-effort: publishing the API surface must not depend on them, so a
      # missing service account degrades to "no edge push", not a failed run.
      - name: Prepare Firebase credentials
        id: fbcreds
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_JSON unset — the sitemaps will reach the edge on the site's next deploy instead"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config
        if: steps.fbcreds.outcome == 'success'
        continue-on-error: true
        run: node generator/scripts/load-rc-env.mjs

      # tsx, not plain node: the corpus sources use extensionless relative
      # specifiers, which plain Node ESM does not resolve.
      - name: Build data surface
        run: npx -y tsx@4 scripts/build-api.mjs

      # The runtime index the SITE's article LISTS read. Publishing an article
      # to its shard makes its own URL live in a minute; it does not put it in
      # the hub, the archive or the homepage, which the site renders from data
      # compiled into its bundle. Without this an article stayed invisible in
      # every list until the site redeployed — the last thing generation here
      # still needed from over there.
      - name: Build the runtime blog index
        run: node scripts/build-blog-index.mjs

      # The builder already refuses to emit an empty registry; this is the second
      # gate, on the artifact rather than the process, so a truncated write can
      # never be published over a good copy.
      - name: Verify artifact
        run: |
          set -euo pipefail
          count=$(node -p "require('./dist/api/manifest.json').counts.articles")
          echo "articles in manifest: $count"
          if [ "$count" -lt 100 ]; then
            echo "::error::manifest reports only $count articles — refusing to publish"
            exit 1
          fi
          for f in articles.json slugs.json manifest.json; do
            test -s "dist/api/$f" || { echo "::error::dist/api/$f missing or empty"; exit 1; }
          done

          # The ten feeds and the ticker payload are consumed as live SEO/UI
          # surface, so gate them on the artifact too — not just on the builder
          # having exited zero. An empty feed served over a good one drops a
          # whole channel; an empty ticker leaves the homepage on its skeleton.
          for f in rss.xml rss-it.xml rss-en.xml rss-de.xml rss-fr.xml \
                   rss-svizzera.xml rss-svizzera-it.xml rss-svizzera-en.xml \
                   rss-svizzera-de.xml rss-svizzera-fr.xml; do
            test -s "dist/api/$f" || { echo "::error::dist/api/$f missing or empty"; exit 1; }
            items=$(grep -c '<item>' "dist/api/$f" || true)
            echo "$f: $items items"
            if [ "$items" -lt 1 ]; then
              echo "::error::dist/api/$f has no <item> entries — refusing to publish"
              exit 1
            fi
          done

          ticker=$(node -p "require('./dist/api/news-ticker-live.json').articles.length")
          echo "news-ticker articles: $ticker"
          if [ "$ticker" -lt 5 ]; then
            echo "::error::news-ticker-live.json carries only $ticker articles — refusing to publish"
            exit 1
          fi

          # ── Migration artifacts (docs §7 in the site repo) ──────────────
          #
          # The candidates file must ALWAYS exist — the site runs its sync with
          # --require-new and treats absence as a broken publisher. An empty
          # <urlset> is a correct quiet day, so the gate is presence and shape,
          # not a count floor (a floor would refuse every correct quiet day).
          test -s dist/api/sitemap-news-candidates.xml || {
            echo "::error::sitemap-news-candidates.xml missing or empty — refusing to publish"; exit 1; }
          grep -q '<urlset' dist/api/sitemap-news-candidates.xml || {
            echo "::error::sitemap-news-candidates.xml is not a sitemap document — refusing"; exit 1; }

          cands=$(grep -c '<url>' dist/api/sitemap-news-candidates.xml || true)
          echo "news candidates: $cands"

          # Every block must carry a publication date: it is the field the whole
          # freshness window turns on and the consumer refuses a block without one.
          dates=$(grep -c '<news:publication_date>' dist/api/sitemap-news-candidates.xml || true)
          if [ "$cands" -ne "$dates" ]; then
            echo "::error::$cands candidate blocks but $dates publication dates — refusing"
            exit 1
          fi

          # Ceiling, not a floor. The candidate set is the 48h slice of the corpus,
          # which is single digits on a normal day; a few hundred would mean the
          # window check broke and the whole 3.6k-article corpus is being offered
          # as "news". That silently torches the news sitemap, so it stops here.
          if [ "$cands" -gt 200 ]; then
            echo "::error::$cands news candidates — the 48h window is not being applied; refusing"
            exit 1
          fi

          # The image manifest is emitted ONLY when this repo holds hero images,
          # because the consumer refuses one listing zero. So its absence is valid
          # and only its CONTENT is gated here.
          if [ -f dist/api/images-manifest.json ]; then
            imgs=$(node -p "require('./dist/api/images-manifest.json').images.length")
            echo "images in manifest: $imgs"
            if [ "$imgs" -lt 1 ]; then
              echo "::error::images-manifest.json was emitted but lists zero images — refusing"
              exit 1
            fi
            # Every listed path must have actually been copied into the artifact,
            # or the site fetches a 404 and fails the whole sync.
            node -e "
              const m = require('./dist/api/images-manifest.json');
              const fs = require('fs');
              const missing = m.images.filter((i) => !fs.existsSync('dist/api/' + i.path));
              if (missing.length) {
                console.error('::error::manifest lists ' + missing.length + ' image(s) not present in dist/api: ' + missing.map(i => i.path).join(', '));
                process.exit(1);
              }
            "
          else
            echo "images-manifest.json: not emitted (no hero images in this repo yet) — expected before cutover"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/api

      - id: deploy
        uses: actions/deploy-pages@v4

      # Push the article sitemaps straight to the edge.
      #
      # The Worker's EDGE_PUSHED_FILES whitelist already lists exactly
      # /sitemap-blog.xml and /sitemap-blog-ch.xml: for those two paths it
      # serves a fresher copy from the pushable R2 origin when one exists, and
      # falls open to the normal passthrough on any miss. Until now only the
      # site repo ever PUT them there, from a copy it had pulled from this
      # API — so a new article entered the served sitemap on the SITE's next
      # deploy, not on this publish. With articles now rendered and pushed
      # from here within a minute of generation, the sitemap was the last part
      # of an article's publication still waiting on the other repo.
      #
      # Whoever produces the artifact publishes it: build-api.mjs generates
      # these two files a few steps above, so this job is their owner.
      #
      # Best-effort, exactly like the dispatch below: the R2 PUT is a freshness
      # optimisation over a passthrough that already works, so a missing
      # credential or a failed upload must never fail a good publish.
      - name: Push the article sitemaps and the blog index to the edge
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${CF_API_TOKEN:-}" ]; then
            echo "::warning::R2/CF credentials absent — the edge keeps serving the passthrough copy"
            exit 0
          fi
          # The R2 key is NOT the URL path. locale-router.js maps each
          # whitelisted path to its own `cdnKey`, and for these two that key is
          # `/edge/<name>` — a PUT to a bare `<name>` would land on a key the
          # Worker never reads, i.e. a silent no-op. Verified by reading
          # EDGE_PUSHED_FILES rather than assuming the obvious mapping.
          # upload-cdn-file.sh strips a leading slash, so pass it without.
          urls=()
          for f in sitemap-blog.xml sitemap-blog-ch.xml; do
            if [ ! -s "dist/api/$f" ]; then
              echo "::warning::dist/api/$f missing or empty — skipping"
              continue
            fi
            bash scripts/lib/upload-cdn-file.sh "dist/api/$f" "edge/$f"
            urls+=("https://frontaliereticino.ch/$f")
          done

          # The blog index goes to /data/, where the site's SPA already fetches
          # its jobs index from — NOT to /edge/, which is the Worker's
          # whitelist-and-purge path for whole documents it serves as pages.
          # This one is fetched by the app, so it just needs to be at the URL
          # cdnDataUrl() builds.
          for f in dist/api/data/blog-index-*.json; do
            [ -s "$f" ] || continue
            bash scripts/lib/upload-cdn-file.sh "$f" "data/$(basename "$f")"
            urls+=("https://cdn.frontaliereticino.ch/data/$(basename "$f")")
          done
          if [ ${#urls[@]} -gt 0 ]; then
            node scripts/cf-purge-cache.mjs "--files=$(IFS=,; echo "${urls[*]}")"
          fi

      # Tell the site the surface moved. The publisher knows when it has
      # published, so the push is the event — the consumer's schedule is only a
      # safety net for a dispatch that never arrives. Without this a new article
      # waits up to twelve hours before entering the sitemap, which for fresh
      # content is the difference that matters.
      # Best-effort: a failed dispatch must never fail a good publish. The
      # scheduled sync picks it up.
      - name: Notify the site
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          PAT: ${{ secrets.SITE_REPO_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${PAT:-}" ]; then
            echo "::warning::SITE_REPO_PAT unset — the site will pick this up on its schedule"
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/valerielinc-ops/frontaliere-si-o-no/dispatches \
            -d '{"event_type":"articles-published"}')
          echo "dispatch → HTTP $code"
          if [ "$code" != "204" ]; then
            echo "::warning::dispatch returned $code — the site will pick this up on its schedule"
          fi
