name: Publish article data API

# This repository owns the article corpus. The site that renders it lives in a
# separate repository and consumes this data as plain JSON over HTTP — it must
# never reach into these sources at build time. Publishing on every push to main
# is what lets the two repos move independently: an article lands here and is
# live for consumers without the site repo deploying anything.
#
# JSON is the contract on purpose. The previous coupling shipped the registry as
# a Rollup-shaped ES module; republishing it out-of-band as a standalone esbuild
# bundle produced a module whose generated namespace export the consumer expected
# and did not find, and every article page on the live site sat on a loading
# skeleton. A JSON document has no module shape to disagree about.

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      # engine/** matters as much as the corpus: build-api.mjs is a thin caller
      # over engine/rssFeeds.mjs and engine/newsTickerDataPlugin.ts, both of
      # which arrive here through the mirror. Without this, a fix to the
      # GENERATOR never republishes — the surface keeps being rebuilt from the
      # old logic until some unrelated corpus change happens to come along.
      # Found the hard way: the fix that unfroze a three-month-stale RSS feed
      # landed here and changed nothing, because only content/ was watched.
      - 'engine/**'
      - 'scripts/build-api.mjs'
      # Same argument, one level down. build-blog-index.mjs runs in this job and
      # emits the runtime list index; sanitize-control-chars.mjs is the output
      # boundary both it and build-api.mjs pass every byte through. Watching the
      # entrypoint alone repeats the RSS failure above in a new place: a fix to
      # either lands, republishes nothing, and the served surface keeps being
      # built by the old code until an unrelated corpus change happens along.
      - 'scripts/build-blog-index.mjs'
      - 'scripts/lib/sanitize-control-chars.mjs'
      - '.github/workflows/publish-api.yml'
  workflow_dispatch:

# One publish at a time, and never cancel one in flight: a half-written data
# surface is worse than a slightly stale one.
concurrency:
  group: publish-api
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # MISURATO 2026-08-09: la run riuscita piu' recente (31315163937) impiega 44s
    # in totale, di cui 6s per "Build data surface" e 22s per la spinta all'edge.
    # 20 minuti sono ~27x il caso normale: non tagliano niente di sano, e tagliano
    # un job appeso. Questo workflow e `generator-ci.yml` erano gli unici due dei
    # 31 senza `timeout-minutes`, e qui l'assenza pesa il doppio: la concurrency
    # `publish-api` NON cancella (`cancel-in-progress: false`), quindi un job
    # appeso non fallisce — mette in coda ogni pubblicazione successiva dietro di
    # se'. Il default di GitHub e' 6 ORE.
    #
    # Il retry aggiunto sotto rende il tetto necessario, non solo prudente:
    # 3 tentativi con backoff lineare allungano il caso peggiore, e senza un
    # tetto sarebbero 3 tentativi da 6 ore.
    #
    # 20 e' un BUDGET, scelto piu' corto del caso peggiore teorico della scala
    # di retry (3 tentativi del wrapper x i 5 fetch-retry di npm possono, su una
    # rete davvero giu', superarlo). E' voluto: se la rete e' giu' da venti
    # minuti, rimandare alla pubblicazione successiva costa una finestra di
    # staleness di circa mezz'ora — mentre un job che resta appeso quaranta
    # minuti blocca dietro di se' OGNI pubblicazione, perche' questa concurrency
    # non cancella. Meglio tagliare la scala che tenere la coda ferma.
    #
    # Nota: un job fermato da `timeout-minutes` risulta `cancelled`, non
    # `failure`, quindi i reporter con `if: failure()` non lo vedono; a coprirlo
    # e' il cron di scan-job-timeouts.mjs. Il tetto serve comunque: e' cio' che
    # fa finire il job.
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # fetch-depth: 0 perche' `github.event.before` deve essere raggiungibile
          # dal passo sotto: senza storia completa il diff sui corpi toccati non
          # si calcola, e lo scoping del preflight deve poter ricadere su
          # scansione piena — vedi lo step "Determine which article bodies this
          # push touched".
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          # La meta' strutturale della mitigazione di #98, e quella che conta di
          # piu': il retry accorcia le probabilita', la cache toglie la richiesta.
          # Senza questa riga NIENTE in questo job era cachato — ne' `npx -y
          # tsx@4` (che risolve e scarica tsx dal registro a OGNI run) ne'
          # l'install del parser qui sotto. `cache: 'npm'` conserva `~/.npm`, che
          # include sia la cache dei tarball sia `_npx/`: a cache calda entrambi
          # i comandi sono serviti da disco.
          # La chiave e' l'hash di package-lock.json, che questo repo ha e che
          # cambia di rado.
          cache: 'npm'

      # ── PREFLIGHT: la sintassi dei corpi articolo ────────────────────────────
      #
      # Perche' QUI e non in tests.yml, con le due misure che lo decidono:
      #
      #  1. `tests.yml` gira su `pull_request` e `push: branches-ignore: [main]`.
      #     Gli articoli atterrano per PUSH DIRETTO su main. MISURATO: gli ultimi
      #     commit su main che toccano content/blog-body ("Generate blog article")
      #     hanno 0 PR associate, e delle ultime 30 run di tests.yml NESSUNA e' su
      #     main. Un gate sulle PR non vedrebbe mai un articolo.
      #  2. `tests.yml` e' dependency-free per progetto (nessun npm ci, commento
      #     esplicito nel file) e questo controllo ha bisogno di un parser.
      #
      # E perche' un gate serve, dato che questo job non ne ha bisogno:
      # MISURATO, `scripts/build-api.mjs` non contiene la stringa `blog-body`
      # nemmeno una volta — carica registri, meta, router e content/seo, mai un
      # corpo. Quindi un corpo rotto NON rompe questa superficie: nasce qui e
      # detona sul SITO, nei quattro job build-locale. Il 2026-07-29 un apostrofo
      # non scappato in un corpo FR svizzera ha ucciso ogni deploy del sito
      # finche' qualcuno non l'ha trovato leggendo i log di build.
      #
      # Il gate sta PRIMA delle credenziali e del build apposta: se un corpo e'
      # rotto si scopre in una decina di secondi, senza montare segreti ne'
      # produrre un artefatto da buttare.
      - name: Install the preflight parser (esbuild)
        env:
          # Pin ESATTO, non un range. Un gate che cambia parser da solo puo'
          # iniziare a rifiutare qualcosa senza che nessuno abbia toccato una
          # riga, e questo gate ferma le pubblicazioni. La versione insegue
          # quella con cui il SITO builda davvero (misurato: esbuild 0.25.12 nel
          # suo node_modules, via vite): l'oracolo del gate deve essere il
          # compilatore che poi si rompe, non un altro.
          ESBUILD_PIN: esbuild@0.25.12
        run: |
          set -euo pipefail
          # In una directory ISOLATA, non nella radice del repo: `npm install`
          # qui dentro tirerebbe anche le 7 dipendenze di package.json —
          # playwright, sharp e @huggingface/transformers comprese — cioe'
          # esattamente il download fuori registro che #77 ha pagato caro.
          mkdir -p "$RUNNER_TEMP/preflight"
          cd "$RUNNER_TEMP/preflight"
          printf '{"name":"preflight-parser","private":true}\n' > package.json
          # --prefer-offline: a cache calda (vedi `cache: 'npm'` sopra) il
          # tarball arriva da disco e la rete non viene toccata affatto.
          bash "$GITHUB_WORKSPACE/scripts/ci/retry-cmd.sh" \
            npm install --no-save --no-audit --no-fund --prefer-offline --loglevel=error "$ESBUILD_PIN"

      # Calcola quali corpi QUESTO push ha toccato, cosi' il transform esbuild
      # (la parte costosa del preflight) puo' scoparsi a quelli invece di
      # riparsare l'intero corpus a ogni pubblicazione. I PAVIMENTI anti-falso-
      # verde nello script restano comunque sull'intero corpus via `readdir`:
      # non dipendono da questo diff.
      #
      # Fallback esplicito su scansione piena (mai su una lista vuota, che
      # farebbe passare inosservato un corpo nuovo rotto) quando il diff non e'
      # calcolabile in modo pulito: `workflow_dispatch` non ha un `before`,
      # `before` puo' essere assente o irraggiungibile dopo un force-push.
      - name: Determine which article bodies this push touched
        id: changed-bodies
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          scan_mode="full"
          files=""
          if [ "$EVENT_NAME" = "push" ] && [ -n "${BEFORE:-}" ] && \
             [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && \
             git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            if diff_out=$(git diff --name-only "$BEFORE" HEAD -- content/blog-body content/blog-body-ch 2>/dev/null); then
              scan_mode="changed"
              files="$diff_out"
            fi
          fi
          echo "scan-mode=$scan_mode" >> "$GITHUB_OUTPUT"
          {
            echo "changed-files<<PREFLIGHT_CHANGED_FILES_EOF"
            echo "$files"
            echo "PREFLIGHT_CHANGED_FILES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Preflight — i corpi articolo devono parsare come TypeScript
        env:
          PREFLIGHT_ESBUILD_DIR: ${{ runner.temp }}/preflight
          PREFLIGHT_SCAN_MODE: ${{ steps.changed-bodies.outputs.scan-mode }}
          PREFLIGHT_CHANGED_FILES: ${{ steps.changed-bodies.outputs.changed-files }}
        run: node scripts/ci/check-blog-body-syntax.mjs

      # ── LA RETE DI SICUREZZA CHE MANCAVA (issue #267, #245 item 2) ──────────
      #
      # Fino a qui gli articoli generati non passavano da NESSUNA guardia.
      # Misurato il 2026-08-12: `tests.yml` ha girato 0 volte su `main` nelle
      # ultime 50 run — ha `push: branches-ignore: [main]` — mentre `main`
      # riceve ~111 commit/giorno, tutti su `content/**`, dal push diretto di
      # `generate-article.yml`. Le due condizioni si annullano a vicenda: il
      # gate ignora main, la generazione scrive solo su main.
      #
      # Il costo di quel buco non e' teorico. Il 2026-08-11 alle 21:42 la
      # generazione ha prodotto un corpo con una legge inventata («LTL 1995»);
      # alle 22:38 il sync l'ha portato sul sito, alle 22:45 `main` DEL SITO e'
      # andato rosso su `article-fabrication-guard`, e da li' ogni PR del sito
      # e' rimasta bloccata a cascata per ~13 ore — `pr-review-loop` gira solo
      # su `tests` verde. Un singolo articolo su ~14.700 ha fermato il merge di
      # un intero repo.
      #
      # PERCHE' QUI, e non togliendo `branches-ignore` da `tests.yml`. `tests`
      # e' il trigger `workflow_run` sia di `pr-review-loop` sia di
      # `auto-merge-on-lgtm`: 111 completamenti/giorno su main diventerebbero
      # ~+333 run/giorno, 111 delle quali dispatch a vuoto del reviewer. Questo
      # workflow invece gira GIA' su ogni push a `content/**` di main — lo step
      # costa +0 run/giorno, solo i ~5s che le due suite impiegano davvero
      # (misurato in locale: 4,5s per 71 test sull'intero corpus).
      #
      # PERCHE' PROPRIO QUESTE DUE SUITE. Sono le uniche del repo che non
      # chiedono dipendenze — `node:test` piu' l'expect-shim locale — quindi
      # girano prima di `npm`, prima delle credenziali, senza allungare il
      # percorso critico. E hanno gia' dentro i PAVIMENTI anti-falso-verde
      # (>3000 corpi IT, >10.000 file body, >50.000 campi): uno scan a vuoto su
      # zero file non puo' passare per verde, che e' il modo piu' facile di
      # trasformare questa rete in decorazione.
      #
      # PERCHE' PRIMA DELLE CREDENZIALI. Un preflight rosso deve fermare la
      # pubblicazione senza aver toccato R2, Cloudflare o il PAT del sito — e
      # soprattutto senza raggiungere «Notify the site», cioe' senza
      # `repository_dispatch: articles-published`. E' quello a rendere il
      # fallimento OSSERVABILE dal lato giusto: `publish-api` non e' in
      # `PR_GATE_WORKFLOWS` di `scan-failed-runs.mjs`, quindi `push` + `failure`
      # e' reportable e apre una «Workflow Failure» QUI. Prima, il primo
      # osservatore era `main` del sito che andava rosso.
      #
      # DELIBERATO: un corpo cattivo congela l'intera superficie dati, non solo
      # se stesso. E' la scelta giusta nel verso in cui sbaglia — dati fermi di
      # qualche minuto contro un articolo fabbricato pubblicato e propagato agli
      # shard. Il rimedio e' riparare il corpo (il run successivo ripubblica
      # tutto), non allentare il gate.
      # AGGIUNTE 2026-08-13 (issue #280 item 3): article-fabrication-guard e
      # prompt-placeholder-guard non erano le sole due guardie corpus-wide
      # nate dopo il buco misurato sopra. article-slug-i18n.test.mjs (#191) e
      # article-source-echo.test.mjs (#202) hanno lo stesso strato 3 — un
      # ratchet/scan sul REGISTRO PUBBLICATO, non sul sorgente del generatore
      # — e girano SOLO su `tests.yml`/`generator-ci.yml`, entrambi con lo
      # stesso `branches-ignore: [main]` di prima: un articolo che reintroduce
      # lo slug italiano o un'eco della fonte pubblica lo stesso, e viene
      # intercettato solo alla PR successiva. Stessa ragione di sopra per il
      # PERCHE' QUI: zero dipendenze npm (solo node:fs/path/url + le due lib
      # pure che importano, anch'esse senza npm), ~1s sull'intero corpus.
      #
      # NON incluse qui: news-scan-quality.test.mjs e news-sources-svizzera
      # .test.mjs. Sono contratti statici sul SORGENTE di create-article.mjs
      # (le liste NEWS_SOURCES, l'estrazione date), non scan del corpus
      # pubblicato — un push che tocca solo content/** non puo' farli
      # divergere, e create-article.mjs arriva a main solo via merge di PR,
      # gia' coperto da tests.yml/generator-ci.yml sul branch prima del merge.
      # AGGIUNTE 2026-08-13 (cluster contenuto-sporco, issue #222/#220/#204):
      # seo-digit-residue-guard e faq-locale-consistency sono lo stesso strato
      # 3 di sopra — un ratchet/scan sul REGISTRO PUBBLICATO — applicato a due
      # difetti che sfuggivano al detector fino a questa PR: il residuo
      # cifra-lettera senza piu' il byte C0 ancorato (`sar0`/`3territorio`, un
      # caso live trovato in content/blog-meta-it.ts, zero C0 nel file) e
      # un articolo con `.faq` in un locale e non in un altro. Zero
      # dipendenze npm in piu': entrambi importano solo `scripts/find-dirty-
      # content-ids.mjs` (node:fs/path/url) o leggono `content/` direttamente.
      # AGGIUNTA 2026-08-13 (issue #251): cross-section-duplicate-ratchet
      # .test.mjs. Stesso strato 3 delle precedenti — un ratchet sul REGISTRO
      # PUBBLICATO, qui i due ledger URL→id `data/article-source-urls.json` e
      # `data/swiss-article-source-urls.json` — applicato al difetto che il
      # gate di quella issue chiude: la stessa pagina di fonte che genera un
      # articolo in ENTRAMBE le sezioni. Il PERCHE' QUI e' quello delle altre:
      # gli articoli generati atterrano con un push diretto su `main`, dove
      # `tests.yml` non gira (`branches-ignore: [main]`), e i due ledger
      # vengono riscritti dallo STESSO commit che tocca `content/**` — quindi
      # il trigger `paths: content/**` sopra li vede. Un sesto duplicato
      # sarebbe altrimenti intercettato solo alla PR successiva, cioe' dopo la
      # pubblicazione. Pavimento anti-falso-verde suo (>=50 voci per ledger) e
      # zero dipendenze npm: legge due JSON e importa
      # `generator/scripts/lib/cross-section-dedup.mjs`, che non importa
      # niente. MISURATO al 2026-08-13: 5 duplicati storici in baseline datata,
      # 0 nuovi.
      #
      # NON inclusa qui la meta' gemella, `cross-section-source-dedup.test.mjs`:
      # e' un contratto sul SORGENTE di `create-article.mjs`, che non e' fra i
      # `paths` di questo workflow. Una sua modifica arriverebbe su main senza
      # far partire il preflight, e il primo push di contenuto successivo
      # congelerebbe l'intera superficie dati per una ragione che col contenuto
      # pubblicato non c'entra. Stessa distinzione gia' fatta sopra per
      # `news-scan-quality.test.mjs`.
      - name: Preflight — le guardie sul corpus generato (fabrication, segnaposto, slug i18n, eco della fonte, residuo cifra-lettera, coerenza FAQ, duplicati cross-sezione)
        run: |
          node --test \
            generator/tests/article-fabrication-guard.test.mjs \
            generator/tests/prompt-placeholder-guard.test.mjs \
            generator/tests/article-slug-i18n.test.mjs \
            generator/tests/article-source-echo.test.mjs \
            generator/tests/seo-digit-residue-guard.test.mjs \
            generator/tests/faq-locale-consistency.test.mjs \
            generator/tests/cross-section-duplicate-ratchet.test.mjs

      # Remote Config holds the R2 and Cloudflare credentials the edge push
      # below needs. Without these two steps that push would find no
      # credentials, warn, and skip — a silent no-op reported as success, which
      # is the failure mode this migration produced three times already.
      # Best-effort: publishing the API surface must not depend on them, so a
      # missing service account degrades to "no edge push", not a failed run.
      - name: Prepare Firebase credentials
        id: fbcreds
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_JSON unset — the sitemaps will reach the edge on the site's next deploy instead"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config
        if: steps.fbcreds.outcome == 'success'
        continue-on-error: true
        run: node generator/scripts/load-rc-env.mjs

      # tsx, not plain node: the corpus sources use extensionless relative
      # specifiers, which plain Node ESM does not resolve.
      #
      # Attraverso il wrapper di retry (issue #98). `npx -y` risolve e SCARICA
      # tsx dal registro npm; qui un ETIMEDOUT non costa un articolo, costa la
      # pubblicazione dell'intera superficie dati — manifest, articles.json,
      # slugs.json, le due sitemap blog, i dieci feed RSS, il ticker.
      #
      # Ritentare l'INTERO comando (non solo il download) e' sicuro, e non e'
      # una deduzione: build-api.mjs fa `fs.rmSync(OUT, {recursive, force})`
      # sulla propria cartella di output alla riga 71 prima di scrivere qualunque
      # cosa. E' la stessa proprieta' che rende corretto ritentare `npm ci`, ed
      # e' cio' che impedisce a un tentativo interrotto di lasciare un
      # `dist/api/` mezzo vecchio e mezzo nuovo.
      # Costa poco anche quando non serve: misurato, questo step dura 6s.
      - name: Build data surface
        run: bash scripts/ci/retry-cmd.sh npx -y tsx@4 scripts/build-api.mjs

      # The runtime index the SITE's article LISTS read. Publishing an article
      # to its shard makes its own URL live in a minute; it does not put it in
      # the hub, the archive or the homepage, which the site renders from data
      # compiled into its bundle. Without this an article stayed invisible in
      # every list until the site redeployed — the last thing generation here
      # still needed from over there.
      - name: Build the runtime blog index
        run: node scripts/build-blog-index.mjs

      # The builder already refuses to emit an empty registry; this is the second
      # gate, on the artifact rather than the process, so a truncated write can
      # never be published over a good copy.
      - name: Verify artifact
        run: |
          set -euo pipefail
          count=$(node -p "require('./dist/api/manifest.json').counts.articles")
          echo "articles in manifest: $count"
          if [ "$count" -lt 100 ]; then
            echo "::error::manifest reports only $count articles — refusing to publish"
            exit 1
          fi
          for f in articles.json slugs.json manifest.json; do
            test -s "dist/api/$f" || { echo "::error::dist/api/$f missing or empty"; exit 1; }
          done

          # The ten feeds and the ticker payload are consumed as live SEO/UI
          # surface, so gate them on the artifact too — not just on the builder
          # having exited zero. An empty feed served over a good one drops a
          # whole channel; an empty ticker leaves the homepage on its skeleton.
          for f in rss.xml rss-it.xml rss-en.xml rss-de.xml rss-fr.xml \
                   rss-svizzera.xml rss-svizzera-it.xml rss-svizzera-en.xml \
                   rss-svizzera-de.xml rss-svizzera-fr.xml; do
            test -s "dist/api/$f" || { echo "::error::dist/api/$f missing or empty"; exit 1; }
            items=$(grep -c '<item>' "dist/api/$f" || true)
            echo "$f: $items items"
            if [ "$items" -lt 1 ]; then
              echo "::error::dist/api/$f has no <item> entries — refusing to publish"
              exit 1
            fi
          done

          ticker=$(node -p "require('./dist/api/news-ticker-live.json').articles.length")
          echo "news-ticker articles: $ticker"
          if [ "$ticker" -lt 5 ]; then
            echo "::error::news-ticker-live.json carries only $ticker articles — refusing to publish"
            exit 1
          fi

          # ── Migration artifacts (docs §7 in the site repo) ──────────────
          #
          # The candidates file must ALWAYS exist — the site runs its sync with
          # --require-new and treats absence as a broken publisher. An empty
          # <urlset> is a correct quiet day, so the gate is presence and shape,
          # not a count floor (a floor would refuse every correct quiet day).
          test -s dist/api/sitemap-news-candidates.xml || {
            echo "::error::sitemap-news-candidates.xml missing or empty — refusing to publish"; exit 1; }
          grep -q '<urlset' dist/api/sitemap-news-candidates.xml || {
            echo "::error::sitemap-news-candidates.xml is not a sitemap document — refusing"; exit 1; }

          cands=$(grep -c '<url>' dist/api/sitemap-news-candidates.xml || true)
          echo "news candidates: $cands"

          # Every block must carry a publication date: it is the field the whole
          # freshness window turns on and the consumer refuses a block without one.
          dates=$(grep -c '<news:publication_date>' dist/api/sitemap-news-candidates.xml || true)
          if [ "$cands" -ne "$dates" ]; then
            echo "::error::$cands candidate blocks but $dates publication dates — refusing"
            exit 1
          fi

          # Ceiling, not a floor. The candidate set is the 48h slice of the corpus,
          # which is single digits on a normal day; a few hundred would mean the
          # window check broke and the whole 3.6k-article corpus is being offered
          # as "news". That silently torches the news sitemap, so it stops here.
          if [ "$cands" -gt 200 ]; then
            echo "::error::$cands news candidates — the 48h window is not being applied; refusing"
            exit 1
          fi

          # The image manifest is emitted ONLY when this repo holds hero images,
          # because the consumer refuses one listing zero. So its absence is valid
          # and only its CONTENT is gated here.
          if [ -f dist/api/images-manifest.json ]; then
            imgs=$(node -p "require('./dist/api/images-manifest.json').images.length")
            echo "images in manifest: $imgs"
            if [ "$imgs" -lt 1 ]; then
              echo "::error::images-manifest.json was emitted but lists zero images — refusing"
              exit 1
            fi
            # Every listed path must have actually been copied into the artifact,
            # or the site fetches a 404 and fails the whole sync.
            node -e "
              const m = require('./dist/api/images-manifest.json');
              const fs = require('fs');
              const missing = m.images.filter((i) => !fs.existsSync('dist/api/' + i.path));
              if (missing.length) {
                console.error('::error::manifest lists ' + missing.length + ' image(s) not present in dist/api: ' + missing.map(i => i.path).join(', '));
                process.exit(1);
              }
            "
          else
            echo "images-manifest.json: not emitted (no hero images in this repo yet) — expected before cutover"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/api

      - id: deploy
        uses: actions/deploy-pages@v4

      # Push the article sitemaps straight to the edge.
      #
      # The Worker's EDGE_PUSHED_FILES whitelist already lists exactly
      # /sitemap-blog.xml and /sitemap-blog-ch.xml: for those two paths it
      # serves a fresher copy from the pushable R2 origin when one exists, and
      # falls open to the normal passthrough on any miss. Until now only the
      # site repo ever PUT them there, from a copy it had pulled from this
      # API — so a new article entered the served sitemap on the SITE's next
      # deploy, not on this publish. With articles now rendered and pushed
      # from here within a minute of generation, the sitemap was the last part
      # of an article's publication still waiting on the other repo.
      #
      # Whoever produces the artifact publishes it: build-api.mjs generates
      # these two files a few steps above, so this job is their owner.
      #
      # Best-effort, exactly like the dispatch below: the R2 PUT is a freshness
      # optimisation over a passthrough that already works, so a missing
      # credential or a failed upload must never fail a good publish.
      - name: Push the article sitemaps and the blog index to the edge
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${CF_API_TOKEN:-}" ]; then
            echo "::warning::R2/CF credentials absent — the edge keeps serving the passthrough copy"
            exit 0
          fi
          # The R2 key is NOT the URL path. locale-router.js maps each
          # whitelisted path to its own `cdnKey`, and for these that key is
          # `/edge/<name>` — a PUT to a bare `<name>` would land on a key the
          # Worker never reads, i.e. a silent no-op. Verified by reading
          # EDGE_PUSHED_FILES rather than assuming the obvious mapping.
          # upload-cdn-file.sh strips a leading slash, so pass it without.
          #
          # sitemap-articles-archive.xml joined for CORRECTNESS, not speed.
          # EDGE_PUSHED_FILES exists because the apex passthrough origin strips
          # hreflang alternates: measured live, sitemap-blog.xml went 15230
          # committed → 0 served, and every sitemap on that path loses them
          # while the ones served from here keep theirs. The archive sitemap
          # carries 40 alternates on its page-1 entries, so served from the
          # passthrough it would publish an alternate-less index — the same
          # defect, freshly reintroduced. Registered in EDGE_PUSHED_FILES on
          # the site side; this is the upload that key reads.
          #
          # Same explicit Cache-Control as the blog index below, for the same
          # reason: these three are rewritten on every publish, and
          # upload-cdn-file.sh's default is the write-once images/ class.
          urls=()
          for f in sitemap-blog.xml sitemap-blog-ch.xml sitemap-articles-archive.xml; do
            if [ ! -s "dist/api/$f" ]; then
              echo "::warning::dist/api/$f missing or empty — skipping"
              continue
            fi
            bash scripts/lib/upload-cdn-file.sh "dist/api/$f" "edge/$f" "public,max-age=600"
            urls+=("https://frontaliereticino.ch/$f")
          done

          # The blog index goes to /data/, where the site's SPA already fetches
          # its jobs index from — NOT to /edge/, which is the Worker's
          # whitelist-and-purge path for whole documents it serves as pages.
          # This one is fetched by the app, so it just needs to be at the URL
          # cdnDataUrl() builds.
          #
          # The explicit Cache-Control is load-bearing. upload-cdn-file.sh
          # defaults to `public, max-age=86400`, which is the images/ class: it
          # is correct for a hero image written once and never again, and wrong
          # for a file this job REWRITES on every publish — roughly every half
          # hour. The site's own deploy already syncs this exact R2 prefix with
          # `public,max-age=600` (scripts/lib/deploy-it-pages-prep.sh, _r2_sync
          # "$stage/data" data), so the 24h default was this publisher writing a
          # second, 144x slacker freshness contract into a prefix that already
          # had one. Matching it is the point — not a tuning choice.
          #
          # This is the SAFETY NET, not the mechanism: the purge below is what
          # makes a publish visible immediately. The TTL decides how long a
          # publish stays invisible when that purge does not happen — a missing
          # CF_API_TOKEN, a Cloudflare error, a variant nobody thought of. That
          # window was 24 hours. It is now 10 minutes.
          for f in dist/api/data/blog-index-*.json; do
            [ -s "$f" ] || continue
            bash scripts/lib/upload-cdn-file.sh "$f" "data/$(basename "$f")" "public,max-age=600"
            urls+=("https://cdn.frontaliereticino.ch/data/$(basename "$f")")
          done
          if [ ${#urls[@]} -gt 0 ]; then
            # Through retry-cmd.sh — same blip class and idempotency
            # justification as the fast-publish purge steps (issue #268): a
            # re-invocation just re-issues purge_cache for the same URLs,
            # which is a no-op for anything already purged.
            bash scripts/ci/retry-cmd.sh node scripts/cf-purge-cache.mjs "--files=$(IFS=,; echo "${urls[*]}")"
          fi

      # Tell the site the surface moved. The publisher knows when it has
      # published, so the push is the event — the consumer's schedule is only a
      # safety net for a dispatch that never arrives. Without this a new article
      # waits up to twelve hours before entering the sitemap, which for fresh
      # content is the difference that matters.
      # Best-effort: a failed dispatch must never fail a good publish. The
      # scheduled sync picks it up.
      - name: Notify the site
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          PAT: ${{ secrets.SITE_REPO_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${PAT:-}" ]; then
            echo "::warning::SITE_REPO_PAT unset — the site will pick this up on its schedule"
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/valerielinc-ops/frontaliere-si-o-no/dispatches \
            -d '{"event_type":"articles-published"}')
          echo "dispatch → HTTP $code"
          if [ "$code" != "204" ]; then
            echo "::warning::dispatch returned $code — the site will pick this up on its schedule"
          fi
