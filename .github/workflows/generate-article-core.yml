# AUTO-GENERATED by scripts/ci/generate-canton-article-workflows.mjs — DO NOT EDIT BY HAND.
# Sorgente: .github/workflows/generate-article.yml (job admit e generate, senza i commenti)
#   + le sostituzioni dichiarate in CORE_REPLACEMENTS del generatore.
# Le ragioni di ogni step stanno nella sorgente: si leggono e si modificano li'.
# Rigenera: node scripts/ci/generate-canton-article-workflows.mjs
# Verifica: node scripts/ci/generate-canton-article-workflows.mjs --check
name: Generate Blog Article (core)

on:
  workflow_call:
    inputs:
      section:
        description: 'Sezione servita dal chiamante (es. canton-ti)'
        required: true
        type: string
      caller_workflow:
        description: 'File del workflow chiamante: ammissione e dispatch della catena guardano le SUE run'
        required: true
        type: string
      concurrency_group:
        description: 'Gruppo base di concurrency della sezione; la produzione non sostituisce i pending di altre sezioni'
        required: true
        type: string
      body_path_regex:
        description: 'Regex (grep -E) dei corpi per locale che provano «articolo prodotto»'
        required: true
        type: string
      sibling_section:
        description: 'Sezione gemella con cui alternare e su cui ripiegare (vuoto = nessuna)'
        required: false
        default: ''
        type: string
      sibling_crons:
        description: 'Espressioni cron (separate da |) che scelgono la gemella'
        required: false
        default: ''
        type: string
      requested_section:
        description: 'Sezione chiesta da un dispatch (vale solo se e la gemella)'
        required: false
        default: ''
        type: string
      section_gate:
        description: 'canton = ammissione per cantone (Remote Config, budget, tetto globale, beacon)'
        required: false
        default: 'none'
        type: string
      chain_dispatch:
        description: 'true = un esito dichiarato senza articolo dispatcha il successore'
        required: false
        default: false
        type: boolean
      url:
        required: false
        default: ''
        type: string
      dry_run:
        required: false
        default: false
        type: boolean
      chain_depth:
        required: false
        default: '0'
        type: string
      no_article_streak:
        required: false
        default: '0'
        type: string
      rescue_depth:
        required: false
        default: '0'
        type: string
      parent_run_id:
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # elencare le run di questo workflow
      contents: read # il compare per distinguere il self-test dal chain link
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      chain_link: ${{ steps.check.outputs.chain_link }}
      content_push: ${{ steps.check.outputs.content_push }}
      run_mode: ${{ steps.check.outputs.run_mode }}
    steps:
      - name: Skip when a generation is already in flight
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SELF_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          CHAIN_DEPTH: ${{ inputs.chain_depth }}
          PARENT_RUN_ID: ${{ inputs.parent_run_id }}
          CHAIN_MAX_RUNS_PER_HOUR: ${{ vars.CHAIN_MAX_RUNS_PER_HOUR }}
          CALLER_WORKFLOW: ${{ inputs.caller_workflow }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail
          content_push=false
          successor_push=false
          run_mode=dry
          case "$EVENT_NAME" in
            schedule) run_mode=production ;;
            workflow_dispatch)
              [ "${DRY_RUN:-false}" = "true" ] || run_mode=production
              ;;
          esac
          trap 'echo "content_push=$content_push" >> "$GITHUB_OUTPUT"; echo "run_mode=$run_mode" >> "$GITHUB_OUTPUT"' EXIT

          chain_depth=0
          case "${CHAIN_DEPTH:-0}" in
            ''|*[!0-9]*) chain_depth=0 ;;
            *) chain_depth="${CHAIN_DEPTH:-0}" ;;
          esac
          is_link=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$chain_depth" -gt 0 ]; then
            is_link=true
          fi
          echo "chain_link=$is_link" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$is_link" != "true" ]; then
            echo "Dispatch manuale (chain_depth=$chain_depth) → si procede sempre."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "push" ] && [ -n "${PUSH_BEFORE:-}" ]; then
            compare_status=0
            compare_truncated=false
            compare_payload=$(gh api --paginate --slurp "repos/$REPO/compare/$PUSH_BEFORE...$PUSH_SHA" \
              2>/dev/null) || compare_status=$?
            changed=
            compare_file_count=0
            if [ "$compare_status" -eq 0 ]; then
              compare_file_count=$(jq -r '[.[]?.files[]?.filename] | length' <<< "$compare_payload" 2>/dev/null) || compare_status=$?
              case "$compare_file_count" in
                ''|*[!0-9]*) compare_status=65 ;;
                300|[3-9][0-9][0-9]|[1-9][0-9][0-9][0-9]*) compare_truncated=true ;;
                *) changed=$(jq -r '.[]?.files[]?.filename' <<< "$compare_payload" 2>/dev/null) || compare_status=$? ;;
              esac
            fi
            if [ "$compare_status" -ne 0 ] || [ "$compare_truncated" = "true" ]; then
              successor_push=true
              run_mode=unknown
              if [ "$compare_truncated" = "true" ]; then
                echo "::warning title=Confronto push troncato::gh api compare ha restituito almeno 300 file; il push resta un successore non classificato per non perdere un articolo."
              else
                echo "::warning title=Confronto push non disponibile::gh api compare non ha restituito tutti i file del push (status $compare_status); il push resta un successore non classificato per non perdere un articolo."
              fi
            else
              content_push=false
              while IFS= read -r changed_path; do
                case "$changed_path" in
                  content/*) content_push=true; break ;;
                esac
              done <<< "$changed"
            fi
            if [ "$content_push" = "true" ]; then
              successor_push=true
              run_mode=production
              content_push=true
              echo "Push che tocca content/**: successore di produzione; la serializzazione resta nel job generate."
            elif [ -n "${changed:-}" ]; then
              self_test_callers=$(while IFS= read -r changed_path; do
                if [[ "$changed_path" == .github/workflows/generate-article-[a-z0-9]*.yml \
                  && "$changed_path" != .github/workflows/generate-article-core.yml ]]; then
                  printf '%s\n' "$changed_path"
                fi
              done <<< "$changed" | sort -u || true)
              if [ -n "${self_test_callers:-}" ] \
                && printf '%s\n' "$self_test_callers" | grep -Fqx -- ".github/workflows/${CALLER_WORKFLOW:-}"; then
                self_test_leader=$(printf '%s\n' "$self_test_callers" | head -1)
                self_test_leader="${self_test_leader##*/}"
                if [ "${CALLER_WORKFLOW:-}" != "$self_test_leader" ]; then
                  echo "Self-test dry già eletto da $self_test_leader → questo chiamante (${CALLER_WORKFLOW:-?}) cede lo slot."
                  echo "proceed=false" >> "$GITHUB_OUTPUT"
                  echo "GENERATION_OUTCOME kind=skipped reason=self-test-batch section=unknown"
                  exit 0
                fi
                echo "Self-test dry eletto per il batch: $self_test_leader."
              elif [ -n "${self_test_callers:-}" ]; then
                echo "Self-test dry del workflow sorgente: non partecipa al batch cantonale."
              else
                echo "Self-test dry singolo: nessun batch cantonale da arbitrare."
              fi
              echo "Push senza content/** → self-test dry, nessuna scrittura: si procede."
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          runs=$(gh api \
            "repos/$REPO/actions/workflows/$CALLER_WORKFLOW/runs?per_page=100" \
            --jq '[.workflow_runs[] | {id: .id, created_at: .created_at, status: .status}]' \
            2>/dev/null || true)
          if [ -z "${runs:-}" ]; then
            echo "Impossibile leggere le run → si prosegue (fail-open)."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          inflight=$(printf '%s' "$runs" \
            | jq -c '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting")]' \
            2>/dev/null || true)
          if [ -z "${inflight:-}" ]; then
            echo "Impossibile filtrare le run in volo → si prosegue (fail-open)."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$is_link" = "true" ]; then
            cap="${CHAIN_MAX_RUNS_PER_HOUR:-}"
            case "$cap" in
              ''|*[!0-9]*) cap=20 ;;
            esac
            last_hour=$(printf '%s' "$runs" \
              | jq -r '[.[] | select((.created_at | fromdateiso8601) > (now - 3600))] | length' \
              2>/dev/null || true)
            case "${last_hour:-}" in
              ''|*[!0-9]*) last_hour=0 ;;
            esac
            if [ "$last_hour" -ge "$cap" ]; then
              echo "::warning::tetto orario della catena raggiunto: $last_hour run create nell'ultima ora (cap $cap) → anello non ammesso"
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "GENERATION_OUTCOME kind=skipped reason=chain-hour-cap section=unknown"
              exit 0
            fi
            echo "Tetto orario: $last_hour run nell'ultima ora su un cap di $cap."
          fi

          self_created=$(printf '%s' "$inflight" \
            | jq -r --argjson me "$SELF_ID" '.[] | select(.id == $me) | .created_at' 2>/dev/null | head -1)
          if [ -z "${self_created:-}" ]; then
            self_created=$(gh api "repos/$REPO/actions/runs/$SELF_ID" --jq '.created_at' 2>/dev/null || true)
          fi
          if [ -z "${self_created:-}" ]; then
            echo "Impossibile leggere il createdAt di questa run → si prosegue (fail-open)."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          parent_id="${PARENT_RUN_ID:-}"
          case "$parent_id" in
            ''|*[!0-9]*) parent_id=0 ;;
          esac
          WEDGE_SECONDS=1800

          older=$(printf '%s' "$inflight" \
            | jq -r --argjson me "$SELF_ID" --arg mine "$self_created" --argjson dad "$parent_id" \
                   --argjson wedge "$WEDGE_SECONDS" \
                '($mine | fromdateiso8601) as $t
                 | [ .[] | select(.id != $me) | select($dad == 0 or .id != $dad)
                        | select(.created_at < $mine or (.created_at == $mine and .id < $me))
                        | select($t - (.created_at | fromdateiso8601) < $wedge) ] | length' \
              2>/dev/null || true)

          stale=$(printf '%s' "$inflight" \
            | jq -r --argjson me "$SELF_ID" --arg mine "$self_created" --argjson dad "$parent_id" \
                   --argjson wedge "$WEDGE_SECONDS" \
                '($mine | fromdateiso8601) as $t
                 | [ .[] | select(.id != $me) | select($dad == 0 or .id != $dad)
                        | select(.created_at < $mine or (.created_at == $mine and .id < $me))
                        | select($t - (.created_at | fromdateiso8601) >= $wedge)
                        | "\(.id) (in volo da \((($t - (.created_at | fromdateiso8601)) / 60) | floor) min)" ]
                 | join(", ")' \
              2>/dev/null || true)
          if [ -n "${stale:-}" ]; then
            echo "::warning title=Run in volo oltre la soglia::Run piu' vecchie in volo da oltre ${WEDGE_SECONDS}s, NON piu' bloccanti per l'ammissione: ${stale}. Di norma sono incastrate, ma lo 0,91% delle run sane supera questa soglia: in quel caso il successore aspetta in coda senza disturbarle."
          fi
          case "${older:-}" in
            ''|*[!0-9]*) older=0 ;;
          esac

          if [ "$older" -gt 0 ]; then
            if [ "$successor_push" = "true" ]; then
              echo "Ci sono $older run più vecchie in volo, ma questo push è un successore: si procede e il job generate attende la concurrency."
            else
              echo "Ci sono $older run di generate-article già in volo e più vecchie di questa ($self_created)."
              echo "La catena sta già camminando: questo arrivo ($EVENT_NAME) è un riavvio ridondante → skip."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "GENERATION_OUTCOME kind=skipped reason=admit-in-flight section=unknown"
              exit 0
            fi
          else
            echo "Nessuna generazione più vecchia in volo → si procede."
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  section_gate:
    needs: admit
    if: needs.admit.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      proceed: ${{ steps.none.outputs.proceed || steps.canton.outputs.proceed }}
    steps:
      - name: Section gate — sezione senza gate
        id: none
        if: inputs.section_gate != 'canton'
        run: echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Section gate — checkout dei soli script del gate
        if: inputs.section_gate == 'canton'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            engine/shared
            generator/data
            generator/scripts
            host
            scripts/lib
            scripts/ci

      - name: Section gate — setup Node.js
        if: inputs.section_gate == 'canton'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Section gate — prepare Firebase credentials
        if: inputs.section_gate == 'canton'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_JSON non impostato: Remote Config non e' caricabile e la sezione resta spenta"
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Section gate — load secrets from Remote Config
        if: inputs.section_gate == 'canton'
        run: node generator/scripts/load-rc-env.mjs

      - name: Section gate — ammissione del cantone (Remote Config, budget, tetto globale, beacon)
        id: canton
        if: inputs.section_gate == 'canton'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SECTION: ${{ inputs.section }}
          SELF_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_REF: ${{ github.ref_name }}
          CANTON_GENERATION_MAX_PARALLEL: ${{ vars.CANTON_GENERATION_MAX_PARALLEL }}
          CANTON_DAILY_BUDGET_CAP: ${{ vars.CANTON_DAILY_BUDGET_CAP }}
          QUOTA_BEACON_PEER_REPO: valerielinc-ops/frontaliere-si-o-no
        run: node scripts/ci/canton-generation-admit.mjs

  generate:
    needs: [admit, section_gate]
    if: needs.admit.outputs.proceed == 'true' && needs.section_gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ (needs.admit.outputs.run_mode == 'production' || needs.admit.outputs.run_mode == 'unknown') && format('{0}-production', inputs.concurrency_group) || format('{0}-dry', inputs.concurrency_group) }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve run mode and section
        id: mode
        env:
          PRIMARY_SECTION: ${{ inputs.section }}
          SIBLING_SECTION: ${{ inputs.sibling_section }}
          SIBLING_CRONS: ${{ inputs.sibling_crons }}
          REQUESTED_SECTION: ${{ inputs.requested_section }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          EV="${{ github.event_name }}"

          CHAIN_LINK="${{ needs.admit.outputs.chain_link }}"
          [ "$CHAIN_LINK" = "true" ] || CHAIN_LINK=false
          ADMIT_MODE="${{ needs.admit.outputs.run_mode }}"

          CHAIN=false
          if [ "$EV" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              CHANGED=$(git diff --name-only "${{ github.sha }}~1" "${{ github.sha }}" 2>/dev/null || true)
            else
              CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" 2>/dev/null || true)
            fi
            while IFS= read -r changed_path; do
              case "$changed_path" in
                content/*) CHAIN=true; break ;;
              esac
            done <<< "$CHANGED"
            if [ "$ADMIT_MODE" = "unknown" ]; then
              CHAIN=true
              echo "::warning title=Push non classificabile::admit=unknown: il resolver usa la lane writer conservativa"
            fi
          fi

          if [ "$EV" = "push" ] && [ "$CHAIN" != "true" ]; then
            DRY=true
          elif [ "$EV" = "workflow_dispatch" ]; then
            DRY="${{ inputs.dry_run }}"
          else
            DRY=false
          fi

          SEC="$PRIMARY_SECTION"
          if [ "$EV" = "schedule" ]; then
            if [ -n "$SIBLING_SECTION" ]; then
              case "|$SIBLING_CRONS|" in
                *"|$SCHEDULE|"*) SEC="$SIBLING_SECTION" ;;
              esac
            fi
          elif [ "$CHAIN" = "true" ]; then
            if [ -n "$SIBLING_SECTION" ]; then
              case "$(git log -1 --format=%s "${{ github.sha }}")" in
                *"($SIBLING_SECTION)"*) SEC="$PRIMARY_SECTION" ;;
                *"($PRIMARY_SECTION)"*) SEC="$SIBLING_SECTION" ;;
              esac
            fi
          else
            SEC="$REQUESTED_SECTION"
          fi
          if [ -z "$SIBLING_SECTION" ] || [ "$SEC" != "$SIBLING_SECTION" ]; then SEC="$PRIMARY_SECTION"; fi

          {
            echo "dry=$DRY"
            echo "section=$SEC"
            echo "chain=$CHAIN"
            echo "chain_link=$CHAIN_LINK"
          } >> "$GITHUB_OUTPUT"
          EVENT_SHA="${{ github.sha }}"
          TIP_SHA="$(git rev-parse HEAD)"
          AHEAD="$(git rev-list --count "${EVENT_SHA}..HEAD" 2>/dev/null || echo unknown)"
          echo "CHECKOUT_TIP event=${EVENT_SHA:0:9} head=${TIP_SHA:0:9} ahead=${AHEAD}"
          echo "event=$EV chain=$CHAIN chain_link=$CHAIN_LINK → section=$SEC dry_run=$DRY"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: bash scripts/lib/npm-ci-retry.sh

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not set — Remote Config is the only source of the provider keys and the push PAT"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config
        run: node generator/scripts/load-rc-env.mjs

      - name: Setup Codex Luna Max article lane
        id: setup_claude_haiku_fallback
        if: steps.mode.outputs.dry != 'true'
        continue-on-error: true
        uses: ./.github/actions/setup-claude-haiku-fallback
        with:
          codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}

      - name: Verify a model provider is actually available
        id: provider_preflight
        if: steps.mode.outputs.dry != 'true'
        env:
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
          PROVIDER_PREFLIGHT_OUTPUT: ${{ runner.temp }}/provider-preflight.json
        run: node generator/scripts/lib/provider-preflight.mjs

      - name: Upload provider preflight report
        if: always() && steps.mode.outputs.dry != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: provider-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provider-preflight.json
          if-no-files-found: warn
          retention-days: 14

      - name: Load the generator without running it (dry run)
        if: steps.mode.outputs.dry == 'true'
        run: node generator/tests/dry-run-entrypoints.mjs

      - name: Configure git identity
        if: steps.mode.outputs.dry != 'true'
        run: |
          git config user.name "Valerie Linc"
          git config user.email "valerielinc@gmail.com"

      - name: Generate the article
        id: generate
        if: steps.mode.outputs.dry != 'true'
        env:
          TARGET_SECTION: ${{ steps.mode.outputs.section }}
          SOURCE_URL: ${{ inputs.url }}
          EVENT_NAME: ${{ github.event_name }}
          CHAIN_LINK: ${{ steps.mode.outputs.chain_link }}
          BODY_PATH_RE: ${{ inputs.body_path_regex }}
          PRIMARY_SECTION: ${{ inputs.section }}
          SIBLING_SECTION: ${{ inputs.sibling_section }}
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
        run: |
          set +e
          set -uo pipefail

          article_body_added() {
            git add -A
            git diff --cached --name-only --diff-filter=A \
              | grep -E "$BODY_PATH_RE" | head -1
          }

          registration_state_dirty() {
            git diff --cached --name-status -- content/ |
              awk -F '\t' 'NF { print; exit }'
          }

          sections=("$TARGET_SECTION")
          if [ -z "${SOURCE_URL:-}" ] && {
            [ "${EVENT_NAME:-}" != "workflow_dispatch" ] ||
            [ "${CHAIN_LINK:-false}" = "true" ]
          }; then
            if [ -n "${SIBLING_SECTION:-}" ]; then
              if [ "$TARGET_SECTION" = "$SIBLING_SECTION" ]; then
                sections+=("$PRIMARY_SECTION")
              else
                sections+=("$SIBLING_SECTION")
              fi
            fi
          fi

          budget_s="${GENERATE_BUDGET_S:-3000}"
          hard_kill_s="${GENERATE_HARD_KILL_S:-2400}"

          stall_s="${GENERATE_STALL_S:-300}"
          stall_poll_s="${GENERATE_STALL_POLL_S:-30}"
          stall_grace_s="${GENERATE_STALL_GRACE_S:-10}"

          diag_dir="${RUNNER_TEMP:-/tmp}/generate-diagnostics"
          rm -rf "$diag_dir"
          mkdir -p "$diag_dir"
          stall_flag="$diag_dir/stalled"
          stall_log="$diag_dir/attempt.log"
          cdp_client="${RUNNER_TEMP:-/tmp}/cdp-stack.mjs"

          proc_tree() {
            local root="$1" kid
            for kid in $(ps -A -o pid= -o ppid= | awk -v p="$root" '$2 == p { print $1 }'); do
              proc_tree "$kid"
            done
            printf '%s\n' "$root"
          }

          kill_tree() {
            local sig="$1" root="$2" p
            case "$root" in ''|0|*[!0-9]*) return 0 ;; esac
            for p in $(proc_tree "$root"); do
              kill "-$sig" "$p" 2>/dev/null || true
            done
          }

          cat > "$cdp_client" <<'CDP_CLIENT'
          const fs = await import('node:fs');
          const outFile = process.argv[2];
          const port = process.env.STALL_INSPECT_PORT || '9229';
          const bail = (why) => {
            try { fs.writeFileSync(outFile, `stack non catturato: ${why}\n`); } catch {}
            process.exit(0);
          };
          setTimeout(() => bail('il client CDP non ha ricevuto Debugger.paused in 8s'), 8000);
          let target;
          try {
            const res = await fetch(`http://127.0.0.1:${port}/json/list`);
            [target] = await res.json();
          } catch (e) {
            bail(`inspector non raggiungibile: ${e && e.message}`);
          }
          if (!target || !target.webSocketDebuggerUrl) bail('nessun target inspector');
          const ws = new WebSocket(target.webSocketDebuggerUrl);
          const scriptUrls = new Map();
          let id = 0;
          const send = (method) => ws.send(JSON.stringify({ id: ++id, method, params: {} }));
          ws.addEventListener('error', (e) => bail(`websocket: ${(e && e.message) || 'errore'}`));
          ws.addEventListener('open', () => { send('Debugger.enable'); send('Debugger.pause'); });
          ws.addEventListener('message', (ev) => {
            const msg = JSON.parse(ev.data);
            if (msg.method === 'Debugger.scriptParsed') {
              scriptUrls.set(msg.params.scriptId, msg.params.url);
              return;
            }
            if (msg.method !== 'Debugger.paused') return;
            const frames = msg.params.callFrames.map((f) => {
              const url = f.url || scriptUrls.get(f.location.scriptId) || '(sconosciuto)';
              return `  at ${f.functionName || '(anonimo)'} (${url}:${f.location.lineNumber + 1}:${f.location.columnNumber + 1})`;
            });
            fs.writeFileSync(outFile, `stack JS al momento dello stallo — ${frames.length} frame\n${frames.join('\n')}\n`);
            process.exit(0);
          });
          CDP_CLIENT

          create_article_pids() {
            local root="$1" p args out=""
            for p in $(proc_tree "$root"); do
              args="$(ps -o args= -p "$p" 2>/dev/null || true)"
              case "$args" in
                *create-article.mjs*) out="$out $p" ;;
              esac
            done
            printf '%s' "$out"
          }

          stall_watchdog() {
            local root="$1" last=-1 quiet=0 size p node_pids
            while kill -0 "$root" 2>/dev/null; do
              sleep "$stall_poll_s"
              size="$(wc -c < "$stall_log" 2>/dev/null | tr -d ' ')"
              [ -n "$size" ] || size=0

              [ -s "$diag_dir/resources.log" ] || \
                echo "# ts elapsed log_bytes | pid rss_kb cpu% state" > "$diag_dir/resources.log"
              for p in $(create_article_pids "$root"); do
                echo "$(date -u +%H:%M:%SZ) ${SECONDS}s ${size} | $(ps -o pid=,rss=,%cpu=,state= -p "$p" 2>/dev/null | tr -s ' ')" \
                  >> "$diag_dir/resources.log" 2>/dev/null || true
              done

              if [ "$size" != "$last" ]; then
                last="$size"
                quiet=0
                continue
              fi
              quiet=$(( quiet + stall_poll_s ))
              [ "$quiet" -lt "$stall_s" ] && continue

              : > "$stall_flag"
              echo "::warning::watchdog: nessun output per ${quiet}s (soglia ${stall_s}s) sulla sezione ${sec} — l'event loop e' bloccato, non e' lentezza. Prendo lo stack e uccido."

              node_pids="$(create_article_pids "$root")"
              for p in $node_pids; do kill -USR2 "$p" 2>/dev/null || true; done
              for p in $node_pids; do kill -USR1 "$p" 2>/dev/null || true; done
              sleep 2
              node "$cdp_client" "$diag_dir/stack-${sec}-${tried}.txt" \
                >> "$diag_dir/cdp-client.log" 2>&1 || true

              sleep "$stall_grace_s"
              kill_tree KILL "$root"
              return 0
            done
          }

          watch_pid=""
          stall_atexit() {
            kill_tree KILL "${watch_pid:-}"
            if [ ! -f "$stall_flag" ] && [ "${produced:-false}" = "true" ]; then
              rm -f "$stall_log" "$diag_dir/resources.log"
            fi
            return 0
          }
          trap stall_atexit EXIT

          min_attempt_s=$(( budget_s / 16 ))
          [ "$min_attempt_s" -lt 1 ] && min_attempt_s=1
          produced=false
          partial_failure=false
          effective="$TARGET_SECTION"
          tried=0
          roster_blocked=false
          all_declared=true
          undeclared_why=""
          outcome_kind="error"
          outcome_reason="unclassified"
          outcome_section="$TARGET_SECTION"

          for sec in "${sections[@]}"; do
            remaining=$(( budget_s - SECONDS ))
            if [ "$remaining" -lt "$min_attempt_s" ]; then
              echo "::warning::time budget spent — not attempting section $sec"
              break
            fi
            cap="$hard_kill_s"
            [ "$remaining" -lt "$cap" ] && cap="$remaining"
            tried=$(( tried + 1 ))
            echo "── attempt $tried: section=$sec cap=${cap}s"

            export CREATE_ARTICLE_MAX_WALL_MS=$(( (cap - 60) * 1000 ))

            export RUN_CARD_FILE="$diag_dir/run-card-$sec.json"

            rm -f "$stall_flag"
            : > "$stall_log"
            if [ -n "${SOURCE_URL:-}" ]; then
              timeout --signal=TERM --kill-after=60s "${cap}s" \
                node --report-on-signal --report-signal=SIGUSR2 --report-directory="$diag_dir" \
                generator/scripts/create-article.mjs --section="$sec" "$SOURCE_URL" \
                > >(tee -a "$stall_log") 2>&1 &
            else
              timeout --signal=TERM --kill-after=60s "${cap}s" \
                node --report-on-signal --report-signal=SIGUSR2 --report-directory="$diag_dir" \
                generator/scripts/create-article.mjs --section="$sec" \
                > >(tee -a "$stall_log") 2>&1 &
            fi
            attempt_pid=$!
            stall_watchdog "$attempt_pid" &
            watch_pid=$!
            wait "$attempt_pid"
            rc=$?
            kill_tree KILL "$watch_pid"
            wait "$watch_pid" 2>/dev/null || true
            watch_pid=""

            if [ -f "$stall_flag" ]; then
              echo "::warning::create-article.mjs muto per ${stall_s}s sulla sezione $sec — ucciso dal watchdog dello stallo, mentre il cap di durata (${cap}s) non era nemmeno vicino"
              outcome_kind="timeout"
              outcome_reason="stall"
              outcome_section="$sec"
              all_declared=false
              [ -n "$undeclared_why" ] || undeclared_why="stallo: nessun output per ${stall_s}s sulla sezione $sec (kill del watchdog, exit $rc) — l'event loop e' bloccato da lavoro sincrono, ed e' un difetto DIVERSO dal kill duro per budget scaduto. Lo stack e' nell'artifact generate-article-diagnostics."
              break
            fi
            if [ "$rc" = "124" ] || [ "$rc" = "137" ]; then
              echo "::warning::create-article.mjs hard-killed after ${cap}s on section $sec — no article this run"
              outcome_kind="timeout"
              outcome_reason="hard-kill"
              outcome_section="$sec"
              all_declared=false
              [ -n "$undeclared_why" ] || undeclared_why="kill duro dopo ${cap}s sulla sezione $sec (exit $rc): un provider che stalla non e' un differimento"
              break
            fi
            if [ "$rc" = "3" ]; then
              echo "::warning::create-article.mjs: il roster non puo' servire il prompt della sezione $sec (exit 3)"
              roster_blocked=true
            fi

            body="$(article_body_added || true)"
            if [ -n "$body" ]; then
              if [ "$rc" != "0" ]; then
                partial_failure=true
                all_declared=false
                [ -n "$undeclared_why" ] || undeclared_why="create-article.mjs ha scritto un corpo sulla sezione $sec ma e' terminato con exit $rc: output parziale non pubblicabile"
                echo "::error::create-article.mjs ha scritto un corpo sulla sezione $sec ma e' terminato con exit $rc — output parziale non pubblicabile"
                break
              fi
              produced=true
              effective="$sec"
              echo "article body added: $body"
              break
            fi
            echo "section $sec produced no article"

            registration_dirty="$(registration_state_dirty)"
            if [ -n "$registration_dirty" ]; then
              partial_failure=true
              all_declared=false
              [ -n "$undeclared_why" ] || undeclared_why="create-article.mjs ha lasciato una transazione di registrazione dirty sulla sezione $sec senza un body (exit $rc): output parziale non pubblicabile"
              echo "::error::create-article.mjs ha lasciato registrazione dirty sulla sezione $sec senza un body (exit $rc): $registration_dirty — output parziale non pubblicabile"
              break
            fi

            if [ "$rc" = "4" ]; then
              echo "::warning::create-article.mjs: nessun articolo sulla sezione $sec, ragione legittima DICHIARATA (exit 4)"
            elif [ "$rc" = "0" ]; then
              all_declared=false
              [ -n "$undeclared_why" ] || undeclared_why="create-article.mjs e' uscito 0 sulla sezione $sec senza scrivere un corpo e senza dichiarare una ragione (attesa: exit 4)"
            else
              all_declared=false
              [ -n "$undeclared_why" ] || undeclared_why="create-article.mjs e' uscito $rc sulla sezione $sec (non e' una delle sei ragioni legittime, che escono 4)"
            fi
          done

          if [ "$tried" = "0" ]; then
            all_declared=false
          fi

          if [ "$partial_failure" = "true" ]; then
            outcome_kind="error"
            outcome_reason="partial-failure"
            outcome_section="$effective"
          elif [ "$outcome_kind" = "timeout" ]; then
            :
          elif [ "$produced" = "true" ]; then
            outcome_kind="generated"
            outcome_reason="article"
            outcome_section="$effective"
          elif [ "$tried" = "0" ]; then
            outcome_kind="error"
            outcome_reason="no-attempt"
            outcome_section="$effective"
          elif [ "$roster_blocked" = "true" ]; then
            outcome_kind="error"
            outcome_reason="roster-blocked"
            outcome_section="$effective"
          elif [ "$outcome_kind" != "timeout" ] && [ "$all_declared" != "true" ]; then
            outcome_kind="error"
            outcome_reason="undeclared"
            outcome_section="$effective"
          elif [ "$all_declared" = "true" ]; then
            outcome_kind="no-article"
            outcome_reason="declared"
            outcome_section="$effective"
          fi
          echo "GENERATION_OUTCOME kind=$outcome_kind reason=$outcome_reason section=$outcome_section"

          {
            echo "article=$produced"
            echo "section=$effective"
            echo "declared=$all_declared"
            echo "roster_blocked=$roster_blocked"
            echo "partial_failure=$partial_failure"
          } >> "$GITHUB_OUTPUT"
          echo "article=$produced section=$effective declared=$all_declared roster_blocked=$roster_blocked partial_failure=$partial_failure attempts=$tried/${#sections[@]}"

          if [ "$partial_failure" = "true" ]; then
            exit 1
          fi
          if [ "$produced" = "true" ]; then
            exit 0
          fi

          if [ "$tried" = "0" ]; then
            echo "::error::nessun tentativo eseguito: il budget wall-clock era gia' speso prima del primo. Una run che non prova nemmeno non e' un esito normale."
            exit 1
          fi
          if [ "$roster_blocked" = "true" ]; then
            echo "::error::roster esaurito: nessun modello ha accettato il prompt e nessun articolo e' stato prodotto in $tried tentativi. Una run che non genera niente perche' il roster non puo' servirla NON e' un esito normale — vedi il messaggio 'roster-cannot-serve-prompt' nel log per il numero di token da tagliare."
            exit 1
          fi
          if [ "$all_declared" != "true" ]; then
            echo "::error::nessun articolo in $tried tentativi, e la ragione NON e' dichiarata: ${undeclared_why}. Le sei ragioni legittime escono tutte con EXIT_NO_ARTICLE_DECLARED (4) — vedi generator/scripts/lib/exhaustion-disposition.mjs. Un'uscita senza articolo e senza dichiarazione e' il verde silenzioso della #313 (60+ run 'success' consecutive, 06:06Z→16:30Z del 2026-08-14), e da qui in poi e' rossa."
            exit 1
          fi
          echo "nessun articolo, ma ogni tentativo ha dichiarato una ragione legittima (exit 4) — verde"
          exit 0

      - name: Upload wedge diagnostics (stack, report, log del tentativo)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generate-article-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/generate-diagnostics
          if-no-files-found: ignore
          retention-days: 14

      - name: Guard — l'articolo generato non raggiunge main se viola le guardie
        id: guard
        if: steps.mode.outputs.dry != 'true' && steps.generate.outputs.article == 'true'
        env:
          SECTION: ${{ steps.generate.outputs.section }}
        run: |
          set -uo pipefail
          if node --test \
            generator/tests/article-fabrication-guard.test.mjs \
            generator/tests/prompt-placeholder-guard.test.mjs \
            generator/tests/article-slug-i18n.test.mjs \
            generator/tests/article-source-echo.test.mjs \
            generator/tests/article-topic-coverage-guard.test.mjs \
            generator/tests/wrong-latin-language-adoption.test.mjs \
            generator/tests/localized-toponyms.test.mjs; then
            exit 0
          fi
          {
            echo "### ✖ Articolo RIFIUTATO prima del commit — sezione \`${SECTION:-?}\`"
            echo
            echo "\`article-fabrication-guard\` / \`prompt-placeholder-guard\` / \`article-slug-i18n\` / \`article-source-echo\` / \`wrong-latin-language-adoption\` / \`localized-toponyms\` hanno trovato offender nel corpus dopo la generazione."
            echo "**Niente e' stato committato**: il corpo resta sul runner e sparisce con lui, \`main\` non lo vede."
            echo
            echo "Gli offender sono elencati per path nel log di questo step. Confrontali con la riga \`article body added:\` dello step «Generate the article»:"
            echo
            echo "- se coincidono, il difetto e' **dell'articolo appena generato** e il rimedio e' la rigenerazione (il run successivo), non una modifica al gate;"
            echo "- se NON coincidono, il difetto e' **preesistente nel corpus** e va riparato prima che la generazione possa ripartire — finche' resta li', ogni run che produce un articolo muore qui."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Guard — l'articolo generato ha tutti i body localizzati
        if: steps.mode.outputs.dry != 'true' && steps.generate.outputs.article == 'true'
        run: |
          set -uo pipefail
          if node scripts/ci/check-blog-locale-completeness.mjs; then
            exit 0
          fi
          {
            echo "### ✖ Articolo RIFIUTATO prima del commit — localizzazione incompleta"
            echo
            echo "Il controllo confronta i campi body localizzati con quelli italiani."
            echo "**Niente e' stato committato**: correggere o rigenerare l'articolo prima del push."
            echo
            echo "Gli offender sono elencati nel log dello step; confrontali con `article body added:` dello step «Generate the article»."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Generate responsive image thumbnail for the new article
        if: steps.mode.outputs.dry != 'true'
        run: node scripts/generate-image-thumbnails.mjs

      - name: Commit and push
        id: commit
        if: steps.mode.outputs.dry != 'true'
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "no article generated this run"
            exit 0
          fi
          if [ -z "${GITHUB_PAT:-}" ]; then
            echo "::error::GITHUB_PAT missing — a GITHUB_TOKEN push fires no workflow at all (anti-recursion), so the article would never reach the site via publish-api.yml AND the self-trigger chain would stop dead. Both depend on this push being PAT-authenticated."
            exit 1
          fi

          if [ "${{ steps.generate.outputs.article }}" = "true" ]; then
            git commit -m "Generate blog article (${{ steps.generate.outputs.section }})"
          else
            git commit -m "Record rejected topic candidates (${{ steps.mode.outputs.section }} — no article generated)"
          fi
          PRODUCED="$(git rev-parse HEAD)"
          printf '%s\n' "$PRODUCED" > "$RUNNER_TEMP/produced-article-commit"
          registry_base="$RUNNER_TEMP/generated-image-registry-base.json"
          registry_snapshot="$RUNNER_TEMP/generated-image-registry-replayed.json"
          if ! git show "$PRODUCED^:data/generated-image-registry.json" > "$registry_base"; then
            printf '%s\n' '{"schema":1,"assetCount":0,"assets":[]}' > "$registry_base"
          fi
          cp data/generated-image-registry.json "$registry_snapshot"
          editorial_registry_base="$RUNNER_TEMP/editorial-image-registry-base.json"
          editorial_registry_snapshot=""
          if [ -f data/editorial-image-registry.json ]; then
            editorial_registry_snapshot="$RUNNER_TEMP/editorial-image-registry-replayed.json"
            if ! git show "$PRODUCED^:data/editorial-image-registry.json" > "$editorial_registry_base"; then
              printf '%s\n' '{"schema":1,"assetCount":0,"assets":[]}' > "$editorial_registry_base"
            fi
            cp data/editorial-image-registry.json "$editorial_registry_snapshot"
          fi

          TARGET="${{ github.ref_name }}"
          REMOTE="https://x-access-token:${GITHUB_PAT}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3 4 5; do
            if git push "$REMOTE" "HEAD:$TARGET"; then
              echo "pushed to $TARGET"
              exit 0
            fi
            echo "push attempt $attempt failed"
            if [ "$attempt" -eq 5 ]; then
              break
            fi
            sleep $((attempt * 3))
            rebased=1
            bash scripts/lib/rebase-onto-remote.sh "$REMOTE" "$TARGET" \
              data/generated-image-registry.json \
              data/editorial-image-registry.json \
              data/topic-candidates-evergreen-rejected.json \
              data/topic-candidates-consumed.json \
              data/topic-candidates-today-picks.json \
              data/blog-images-used.json \
              public/data/journalist-image-catalog.json \
              data/generated-image-registry.json \
              --merge-queue data/image-regeneration-queue.json \
              --merge-counter data/quota-state.json:runCounter \
              --merge-counter data/topic-candidates-experimental-counter.json:count \
              --merge-counter data/topic-candidates-evergreen-counter.json:count \
              --section-surfaces \
              --take-theirs content/image-credits/blog/ \
              --take-theirs public/images/blog/ || rebased=0
            if [ "$rebased" -eq 1 ]; then
              node scripts/ci/merge-generated-image-registry.mjs \
                data/generated-image-registry.json "$registry_base" "$registry_snapshot"
              git add data/generated-image-registry.json
              if [ -n "$editorial_registry_snapshot" ]; then
                node scripts/ci/merge-generated-image-registry.mjs \
                  data/editorial-image-registry.json "$editorial_registry_base" "$editorial_registry_snapshot" cover
                git add data/editorial-image-registry.json
              fi
              if ! git diff --cached --quiet; then
                if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
                  git commit -C "$PRODUCED"
                else
                  git commit --amend --no-edit
                fi
              fi
              uniq_rc=0
              node scripts/ci/check-post-rebase-uniqueness.mjs --produced "$PRODUCED" --against HEAD || uniq_rc=$?
              if [ "$uniq_rc" -ne 0 ]; then
                echo "::error::post-rebase uniqueness check exited $uniq_rc — not pushing (POST_REBASE_UNIQUENESS_VIOLATION: the article collides on id, source URL, or content; POST_REBASE_UNIQUENESS_ERROR: the check could not run). See the lines above."
                exit 1
              fi
            fi
          done
          echo "::error::push failed after 5 attempts — the article is registered locally but not pushed"
          exit 1

      - name: Preserve the unpushed article
        id: preserve_unpushed_article
        if: ${{ failure() && steps.commit.outcome == 'failure' && steps.generate.outputs.article == 'true' && steps.mode.outputs.dry != 'true' }}
        run: |
          set -euo pipefail
          produced_file="$RUNNER_TEMP/produced-article-commit"
          preserved_dir="$RUNNER_TEMP/unpushed-article"
          mkdir -p "$preserved_dir"
          if [ -s "$produced_file" ]; then
            bash scripts/ci/preserve-unpushed-commit.sh \
              "$(cat "$produced_file")" \
              "$preserved_dir" \
              "passo Commit and push fallito dopo il commit"
          else
            bash scripts/ci/preserve-unpushed-commit.sh \
              --worktree \
              "$preserved_dir" \
              "passo Commit and push fallito prima del commit"
          fi
          if [ ! -s "$preserved_dir/article.bundle" ] || [ ! -s "$preserved_dir/manifest.json" ] || [ ! -s "$preserved_dir/REPLAY.md" ]; then
            echo "Niente da conservare: il commit prodotto non è replayable"
            exit 0
          fi
          artifact_name="unpushed-article-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "Articolo generato conservato nell'artifact." >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: \`$artifact_name\`" >> "$GITHUB_STEP_SUMMARY"
          echo "preserved=true" >> "$GITHUB_OUTPUT"

      - name: Upload the unpushed article
        if: ${{ always() && steps.preserve_unpushed_article.outputs.preserved == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: unpushed-article-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unpushed-article
          retention-days: 14
          if-no-files-found: ignore

      - name: Cleanup Codex auth broker
        if: always()
        continue-on-error: true
        env:
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
        run: |
          if [ -z "$CODEX_AUTH_BROKER_SOCKET" ] || [ ! -S "$CODEX_AUTH_BROKER_SOCKET" ]; then
            exit 0
          fi
          node .github/actions/setup-claude-haiku-fallback/codex-auth-broker.mjs \
            --cleanup --socket "$CODEX_AUTH_BROKER_SOCKET" \
            || echo "::warning::Codex auth broker cleanup did not complete"
      - name: Summary
        if: always()
        env:
          DRY: ${{ steps.mode.outputs.dry }}
          CHAIN: ${{ steps.mode.outputs.chain }}
          SECTION_REQUESTED: ${{ steps.mode.outputs.section }}
          SECTION_PRODUCED: ${{ steps.generate.outputs.section }}
          ARTICLE: ${{ steps.generate.outputs.article }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
        run: |
          set -uo pipefail
          if [ "${DRY:-}" = "true" ]; then
            generated='no — dry run, the generator is loaded and never invoked'
          elif [ "${GUARD_OUTCOME:-}" = "failure" ]; then
            generated='no — REJECTED by article-fabrication-guard / prompt-placeholder-guard, nothing committed (see above)'
          elif [ -z "${ARTICLE:-}" ]; then
            generated='unknown — the run never reached the generator'
          elif [ "$ARTICLE" = "true" ]; then
            generated="yes — ${SECTION_PRODUCED:-?}"
          else
            generated='no — no section produced an article'
          fi
          {
            echo "### Generate Blog Article"
            echo "- Section requested: ${SECTION_REQUESTED:-n/a}"
            echo "- Chain link: ${CHAIN:-n/a}"
            echo "- Dry run: ${DRY:-n/a}"
            echo "- Generated: $generated"
            echo "- Target ref: ${{ github.ref_name }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Chain — dispatch the next link
        if: always()
        env:
          REPO: ${{ github.repository }}
          SELF_ID: ${{ github.run_id }}
          DRY: ${{ steps.mode.outputs.dry }}
          ARTICLE: ${{ steps.generate.outputs.article }}
          DECLARED: ${{ steps.generate.outputs.declared }}
          ROSTER_BLOCKED: ${{ steps.generate.outputs.roster_blocked }}
          SECTION_PRODUCED: ${{ steps.generate.outputs.section }}
          SECTION_REQUESTED: ${{ steps.mode.outputs.section }}
          CHAIN_DEPTH: ${{ inputs.chain_depth }}
          NO_ARTICLE_STREAK: ${{ inputs.no_article_streak }}
          RESCUE_DEPTH: ${{ inputs.rescue_depth }}
          CHAIN_ARMED: ${{ vars.CHAIN_ARMED }}
          CHAIN_DISPATCH: ${{ inputs.chain_dispatch }}
          CALLER_WORKFLOW: ${{ inputs.caller_workflow }}
          PRIMARY_SECTION: ${{ inputs.section }}
          SIBLING_SECTION: ${{ inputs.sibling_section }}
        run: |
          set +e
          set -uo pipefail

          max_depth="${CHAIN_MAX_DEPTH:-40}"
          max_streak="${CHAIN_MAX_STREAK:-6}"
          delay_s="${CHAIN_DELAY_S:-90}"
          max_rescue="${CHAIN_MAX_RESCUE:-1}"
          rescue_delay_s="${CHAIN_RESCUE_DELAY_S:-180}"

          stop() {
            echo "catena ferma: $1"
            exit 0
          }

          num() {
            case "${1:-}" in
              ''|*[!0-9]*) printf '0' ;;
              *) printf '%s' "$1" ;;
            esac
          }
          depth=$(num "${CHAIN_DEPTH:-0}")
          streak=$(num "${NO_ARTICLE_STREAK:-0}")
          rescue=$(num "${RESCUE_DEPTH:-0}")

          [ "${DRY:-}" = "true" ] && stop "self-test dry, non e' un anello"
          [ -f .github/CHAIN_DISABLED ] && stop ".github/CHAIN_DISABLED presente (kill switch in-repo)"
          [ "${CHAIN_ARMED:-}" = "false" ] && stop "vars.CHAIN_ARMED=false (kill switch)"
          [ "${CHAIN_DISPATCH:-}" = "true" ] || stop "catena via dispatch spenta per questo chiamante (chain_dispatch != true)"

          [ "${ARTICLE:-}" = "true" ] && stop "articolo prodotto — il successore lo fa gia' il push su content/**"
          [ "${ROSTER_BLOCKED:-}" = "true" ] && stop "roster esaurito: il prossimo tentativo troverebbe lo stesso muro, non una finestra nuova"

          kind='link'
          next_rescue="$rescue"
          if [ "${DECLARED:-}" != "true" ]; then
            kind=rescue
            [ "$rescue" -ge "$max_rescue" ] && stop "esito NON dichiarato (kill duro, stallo, exit 3, uscita muta o guasto prima del generatore), e il soccorso di questa catena e' gia' speso ($rescue/$max_rescue) — si cede al cron"
            next_rescue=$(( rescue + 1 ))
          fi

          next_depth=$(( depth + 1 ))
          next_streak=$(( streak + 1 ))
          [ "$next_streak" -ge "$max_streak" ] && stop "$next_streak anelli secchi di fila (cap $max_streak) — si cede al cron"
          [ "$next_depth" -ge "$max_depth" ] && stop "profondita' $next_depth (cap $max_depth) — si cede al cron"

          base="${SECTION_PRODUCED:-}"
          [ -n "$base" ] || base="${SECTION_REQUESTED:-${PRIMARY_SECTION:-}}"
          next_section="${PRIMARY_SECTION:-}"
          if [ -n "${SIBLING_SECTION:-}" ] && [ "$base" != "$SIBLING_SECTION" ]; then next_section="$SIBLING_SECTION"; fi

          token="${GITHUB_PAT_NANAKO:-}"
          token_name=GITHUB_PAT_NANAKO
          if [ -z "$token" ]; then
            token="${GITHUB_PAT:-}"
            token_name=GITHUB_PAT
          fi
          [ -n "$token" ] || stop "nessun PAT in ambiente (Remote Config non caricato?)"

          wait_s="$delay_s"
          [ "$kind" = "rescue" ] && wait_s="$rescue_delay_s"
          echo "${kind}: depth ${depth}→${next_depth}, streak ${streak}→${next_streak}, soccorso ${rescue}→${next_rescue}, sezione ${base}→${next_section}, fra ${wait_s}s"
          [ "$wait_s" -gt 0 ] && sleep "$wait_s"

          payload=$(printf '{"ref":"main","inputs":{"section":"%s","chain_depth":"%s","no_article_streak":"%s","parent_run_id":"%s","rescue_depth":"%s"}}' \
            "$next_section" "$next_depth" "$next_streak" "${SELF_ID:-}" "$next_rescue")

          dispatch() {
            curl -sS -o /tmp/chain-dispatch.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $1" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/workflows/$CALLER_WORKFLOW/dispatches" \
              -d "$payload" 2>/dev/null
          }

          code=$(dispatch "$token")
          if [ "$code" != "204" ] && [ "$token_name" = "GITHUB_PAT_NANAKO" ] && [ -n "${GITHUB_PAT:-}" ]; then
            echo "::warning::dispatch con GITHUB_PAT_NANAKO → HTTP $code, riprovo con GITHUB_PAT"
            token_name=GITHUB_PAT
            code=$(dispatch "${GITHUB_PAT}")
          fi

          if [ "$code" = "204" ]; then
            echo "$kind dispatchato con $token_name: sezione $next_section, depth $next_depth, streak $next_streak, soccorso $next_rescue"
            exit 0
          fi
          echo "::warning::dispatch ($kind) fallito (HTTP $code con $token_name): $(head -c 300 /tmp/chain-dispatch.json 2>/dev/null). La catena si ferma, il cron riprende."
          exit 0
