name: Housekeeping jobs (two lanes)

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  housekeeping:
    strategy:
      fail-fast: false
      matrix:
        lane: [prospective, rest]
    uses: valerielinc-ops/frontaliere-si-o-no/.github/workflows/housekeeping-jobs-logic.yml@2c27327f0b381e7a868468620e099f54e7a72ebc # sito #11175: lista sparse letta da main insieme al codice
    with:
      lane: ${{ matrix.lane }}
    secrets:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
