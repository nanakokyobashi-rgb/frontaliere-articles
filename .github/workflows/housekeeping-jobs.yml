name: Housekeeping jobs (two lanes)

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  housekeeping:
    strategy:
      fail-fast: false
      matrix:
        lane: [prospective, rest]
    # Pin del sito #15403: il workflow riusabile estende il timeout bounded della
    # vista completa di ownership per le slice sparse dei crawler.
    uses: valerielinc-ops/frontaliere-si-o-no/.github/workflows/housekeeping-jobs-logic.yml@1ad3a094c4face8ca18530e45b27a148abe52e34 # sito #15403
    with:
      lane: ${{ matrix.lane }}
    secrets:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
