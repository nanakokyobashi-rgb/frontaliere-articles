name: Housekeeping jobs (two lanes)

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  housekeeping:
    strategy:
      fail-fast: false
      matrix:
        lane: [prospective, rest]
    # Lo stesso commit di prima (sito #11175), con lo SHA che ha dopo la riscrittura
    # della storia del sito del 2026-10-07. Quello vecchio, 2c27327f0b38, esiste
    # ancora su GitHub ma nessun ramo lo raggiunge, e Actions non risolve un
    # workflow riusabile a un commit orfano: startup_failure, zero job, zero log.
    uses: valerielinc-ops/frontaliere-si-o-no/.github/workflows/housekeeping-jobs-logic.yml@1ad3a094c4face8ca18530e45b27a148abe52e34 # sito #15403: ownership view bounded timeout for sparse crawler slices
    with:
      lane: ${{ matrix.lane }}
    secrets:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
