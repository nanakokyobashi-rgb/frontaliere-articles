name: Workflow failure → issue

# Apre una issue per ogni workflow di questo repo che fallisce, così che un
# guasto entri nella coda di triage invece di restare una riga rossa nella
# scheda Actions che nessuno guarda.
#
# Scansione centrale, non uno step per workflow: il razionale completo sta in
# `scripts/ci/scan-failed-runs.mjs`. In breve — cablare uno step in ogni YAML
# vorrebbe dire modificare i workflow di generazione (il core operativo di
# questo repo) per una preoccupazione che non è la loro, e lascerebbe comunque
# scoperto ogni workflow nuovo. `close-recovered-failure-issues.yml` chiude
# centralmente; questo apre centralmente.
#
# ── Cadenza, e perché non è quella del sito ─────────────────────────────────
# Il cron CHIEDE ogni 30 minuti, ai minuti 9 e 39, deliberatamente sfasati dai
# cron del sito (che gira a :15/:17/:20/:23). I due repo colpiscono la STESSA
# API GitHub e la stessa quota: cron allineati sommano i picchi invece di
# distribuirli.
#
# Ma «ogni 30 minuti» è una RICHIESTA, non una garanzia, e su questo repo non
# viene onorata: GitHub degrada e droppa le `schedule` quando il repo è carico.
# Misurato il 2026-09-18 su 120 scansioni riuscite in 449 ore: cadenza reale
# mediana 231 minuti, p90 318, massima 454 — il 13% delle run richieste.
# Per questo la finestra di scansione NON è più una costante tarata sui 30
# minuti: `scan-failed-runs.mjs` la deriva dall'ultima scansione riuscita e si
# allarga da sola quando lo scheduler salta un giro. Vedi `resolveLookbackMin`.
# Con il vecchio lookback fisso di 40 minuti lo scanner copriva il 17,7% del
# tempo e il 70% delle run fallite non-PR non entrava in NESSUNA finestra.
#
# Zero Claude: è tutto deterministico. Il costo di quota è nullo — questo
# workflow può girare frequentemente senza togliere niente al ciclo del sito.

on:
  schedule:
    - cron: '9,39 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Elenca cosa aprirebbe senza aprire niente'
        required: false
        type: boolean
        default: false
      lookback_min:
        description: 'Finestra di scansione in minuti (vuoto = derivata dall''ultima scansione riuscita)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write
  actions: read # elencare le run e i loro job
  checks: read # leggere l'annotation che prova un vero timeout

concurrency:
  group: workflow-failure-issues
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Nessun `npm ci`: lo scanner e github-issue-creator usano solo builtin.

      # ── Perché serve il PAT per APRIRE una issue ────────────────────────
      # Una issue creata dal GITHUB_TOKEN NON emette l'evento `issues: opened`
      # (anti-ricorsione GitHub). Aprendo col GITHUB_TOKEN, quindi, ogni issue
      # di fallimento nascerebbe fuori dal triage event-driven e resterebbe
      # orfana fino allo sweep periodico. Sul sito è esattamente così che si
      # sono accumulate 46 issue mai triagiate, alcune vecchie di due settimane.
      # Col PAT l'evento parte e il triage la classifica subito.
      # Senza PAT il degrado è morbido, non silenzioso: le issue si aprono
      # comunque e le raccoglie lo sweep.
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load secrets from Remote Config
        continue-on-error: true
        run: node generator/scripts/load-rc-env.mjs

      - name: Scan failed runs and open issues
        env:
          # PAT se disponibile (l'evento `issues: opened` parte → triage
          # immediato), altrimenti GITHUB_TOKEN (le issue si aprono lo stesso,
          # le raccoglie lo sweep del triage). Il PAT arriva in GITHUB_ENV:
          # interpolarlo da `env.*` può restare vuoto e forzare il fallback.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Nessun workflow da ignorare: lo smoke del token, unico caso previsto,
          # ha esaurito il suo compito ed è stato rimosso. La variabile resta
          # supportata dallo scanner per un eventuale caso futuro.
          IGNORE_WORKFLOWS: ''
        run: |
          runtime_pat="${GITHUB_PAT_NANAKO:-}"
          export GH_TOKEN="${runtime_pat:-$GH_TOKEN}"
          # Nessun --lookback-min di default. Passarne SEMPRE uno (era
          # `|| '40'`) rendeva irraggiungibile la derivazione dall'ultima
          # scansione riuscita proprio sulle run da `schedule`, che sono il
          # 100% delle run reali: l'input è vuoto lì, quindi vinceva il '40'.
          ARGS=()
          if [ -n "${{ github.event.inputs.lookback_min }}" ]; then
            ARGS+=(--lookback-min "${{ github.event.inputs.lookback_min }}")
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
          node scripts/ci/scan-failed-runs.mjs ${ARGS[@]+"${ARGS[@]}"}

      # I timeout sono `cancelled`, quindi non raggiungono lo scanner sopra.
      # Gli host-kill sono `failure`, ma scan-failed-runs li cede a questo
      # detector specializzato per non contare lo stesso evento anche nel
      # rolling ledger dei fallimenti ordinari.
      # `if: always()`: senza, il default `success()` faceva saltare INTERAMENTE
      # il rilevamento di timeout e host-kill ogni volta che lo scanner
      # ordinario sopra usciva non-zero. Le due famiglie di guasto sono
      # indipendenti — un errore nel primo scanner non è una ragione per non
      # guardare i `cancelled` — e il verdetto del job resta comunque rosso
      # perché il passo precedente ha già fallito.
      - name: Scan timed out and host-killed jobs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Finestra RISOLTA dallo scanner precedente (vedi `resolveLookbackMin`):
          # un solo posto la calcola. Il fallback a 40 copre il caso in cui il
          # passo sopra sia morto prima di esportarla.
          TIMEOUT_SCAN_LOOKBACK_MINUTES: ${{ github.event.inputs.lookback_min || env.SCAN_RESOLVED_LOOKBACK_MIN || '40' }}
          # Stesso settle del default dello scanner: evita di scambiare la
          # finalizzazione dell'API Actions per uno step morto sull'host.
          HOST_KILL_SETTLE_MS: '120000'
        run: |
          runtime_pat="${GITHUB_PAT_NANAKO:-}"
          export GH_TOKEN="${runtime_pat:-$GH_TOKEN}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/ci/scan-job-timeouts.mjs --dry-run
          else
            node scripts/ci/scan-job-timeouts.mjs
          fi

      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json
