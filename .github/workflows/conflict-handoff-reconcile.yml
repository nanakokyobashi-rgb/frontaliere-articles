name: Reconcile conflict hand-offs (no-Claude)

# Chiude gli hand-off di conflitto il cui lavoro e' gia' stato completato. Il
# workflow e' autonomo perche' il riconciliatore non deve ricevere gli eventi
# `issues` del drainer. Il job usa comunque lo stesso mutex repo-scoped
# `followup-daily` del drainer, dei writer dei bucket e dell'autorebase: gli
# eventi irrilevanti restano fuori dal gruppo perche' il filtro e' sul job del
# drainer, prima del suo ingresso nel mutex.
#
# La cadenza precede nominalmente di tre minuti il followup-drainer; non e' un
# vincolo di ordinamento (i cron GitHub possono slittare), percio' lo script
# resta idempotente e fail-closed sugli stati ambigui.

on:
  schedule:
    - cron: '2,27,52 * * * *'
  workflow_dispatch:

# Stessa chiave del drainer e dei writer daily: create/routing e reconcile degli
# hand-off restano serializzati con ogni altra mutazione della coda, senza
# cancellare la run attiva.
concurrency:
  group: followup-daily-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    # Deve restare uguale a timeout-minutes sopra: il valore viene ripetuto
    # per costruire una deadline assoluta disponibile allo script.
    env:
      JOB_TIMEOUT_MINUTES: 6
    steps:
      # La deadline parte prima del checkout: runBudgetFromEnv deve poter
      # riservare margine anche quando il setup consuma quasi tutto il job.
      - name: Export job deadline
        run: echo "CI_JOB_DEADLINE_EPOCH=$(( $(date +%s) + ${{ env.JOB_TIMEOUT_MINUTES }} * 60 ))" >> "$GITHUB_ENV"

      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Reconcile conflict hand-offs (zero-Claude)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/ci/reconcile-conflict-handoffs.mjs
