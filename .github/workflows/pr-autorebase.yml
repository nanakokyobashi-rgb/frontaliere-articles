name: PR auto-rebase (near-merge only, no-Claude)

# Esegue il `git merge origin/main` che sblocca una PR ferma dietro main.
# Frugale e ZERO Claude: dopo il rebase NON si ri-esegue la review — si
# dispatcha solo `tests.yml` sull'head, e `auto-merge-eval` porta avanti l'
# `## LGTM` esistente, perché su un rebase di solo main-merge il contributo
# della PR è invariato (lo stabilisce il fingerprint code-only, la stessa
# funzione usata dal re-review guard).
#
# Tocca SOLO le PR "near-merge": `## LGTM` già dato, oppure etichettate
# `collision-risk` / `stale-review`. Una PR lontana dal merge non ha bisogno di
# essere spinta.
#
# ── Perché tre trigger e non solo il cron ───────────────────────────────────
# GitHub throttla i cron ad alta frequenza (sul sito un `*/30` gira ogni 2-4h):
# da solo lascerebbe le PR near-merge ferme per ore. Quindi:
#   - `pull_request_review` → appena arriva un `## LGTM`, sblocca subito.
#   - `pull_request: closed` → un merge rende improvvisamente `behind` le altre
#     PR aperte. Senza questo trigger il conflitto emerge solo al tick
#     successivo del cron, cioè ore dopo.
#   - `schedule` → la rete sotto entrambi.
#
# ── ADATTAMENTI (manifest: `adapted`) ───────────────────────────────────────
#  - Identità di push e dispatch: `GITHUB_PAT_NANAKO`.
#  - Sparse-checkout sui path pesanti di QUESTO repo (`content/` con 14.888
#    file, `dist/`, `public/`): il job fa solo merge e push, non li legge mai.
#    Restano nell'indice, quindi i commit li preservano e il merge resta
#    corretto; se un conflitto ne tocca uno, git lo materializza da sé.
#  - Cadenza sfasata dal sito.

on:
  schedule:
    - cron: '22,52 * * * *'
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo log, nessun push'
        type: boolean
        required: false
        default: false

concurrency:
  group: pr-autorebase
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write # dispatch di tests.yml sull'head rebasato

jobs:
  rebase:
    # Sul trigger `pull_request` solo i merge veri: una PR chiusa senza merge
    # non cambia lo stato delle altre.
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Serve l'intera storia per fare `git merge origin/main` sui branch.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/content
            !/dist
            !/public
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load secrets from Remote Config
        continue-on-error: true
        run: node generator/scripts/load-rc-env.mjs

      - name: Alert token-down (dedup, zero-Claude)
        if: env.GITHUB_PAT_NANAKO == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/ci/alert-pat-down.mjs --workflow "${{ github.workflow }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Rebase near-merge PRs (deterministic, no Claude)
        env:
          # Il PAT serve per due cose insieme: pushare il rebase e dispatchare
          # `tests.yml` (scope actions:write). Un push col GITHUB_TOKEN non
          # ri-triggererebbe nulla, quindi la PR resterebbe ferma comunque.
          GH_TOKEN: ${{ env.GITHUB_PAT_NANAKO }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CI_CHECK_NAME: 'tests (node --test)'
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::Nessun PAT usabile → autorebase inerte (serve per il push e per il dispatch di tests.yml)."
            exit 0
          fi
          if [ "${DRY_RUN:-false}" = "true" ]; then
            node scripts/ci/pr-autorebase.mjs --dry-run
          else
            node scripts/ci/pr-autorebase.mjs
          fi

      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json
