name: Orphan push warn

# Un `git push` sul branch di una PR gia' MERGED riesce comunque: GitHub lo
# accetta, il commit resta fuori da `main`, e nessuno lo dice. Non e' un errore,
# e' un'ASSENZA — la stessa classe di difetto che `loop-workflow-triggers.test.mjs`
# sorveglia. E' successo a monte della #524: il commit di fix della #523 e'
# atterrato dopo l'auto-merge ed e' rimasto orfano.
#
# Questo job e' SEGNALE, non blocco: commenta sulla PR (numero + sha) ed esce 0.
# Salta i commit gia' contenuti in main o nella head della PR mergiata, non
# attribuisce alla PR vecchia un nuovo commit post-merge su una head riusata,
# deduplica il commento sulla stessa PR e segnala anche le PR chiuse senza merge.
#
# ── PERCHE' E' UN WORKFLOW A SE' DAL 2026-09-03 ─────────────────────────────
# Viveva come primo job del workflow dell'auto-merge su LGTM, che aveva gia' il
# trigger `push` per altre ragioni. Quel workflow e' stato rimosso quando il
# merge e' passato all'auto-merge nativo di GitHub, e questo job non poteva
# seguirlo dentro `tests.yml`: li' il `push:` e' scopato a `main` di proposito
# (un push su un branch con PR aperta pagherebbe una seconda review Claude),
# mentre QUESTO job vuole esattamente i push sui branch — cioe' il trigger
# opposto. Due domande diverse, due workflow.
on:
  push:
    branches-ignore: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  warn-orphan-push:
    # `github.event.deleted != true` esclude il push di cancellazione del branch
    # che `gh pr merge --squash --delete-branch` genera su OGNI squash-merge:
    # senza questo guard, quel push (sha tutto-zero) trova la PR appena chiusa
    # come MERGED e posta l'avviso di «push orfano» a ogni singolo merge.
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Warn if this push is on a MERGED PR branch (orphan push)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # Niente `set -e`: un gh che fallisce non deve rendere rosso il push.
          # Il job e' un segnale; l'exit e' sempre 0.
          if [ -z "${HEAD_REF:-}" ] || [ -z "${REPO:-}" ]; then
            echo "ref o repo assenti — niente da segnalare."
            exit 0
          fi
          # Una PR aperta sulla stessa head non e' orfana: e' il ciclo normale.
          OPEN=$(gh pr list --repo "$REPO" --head "$HEAD_REF" --state open \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "${OPEN:-}" ]; then
            echo "PR #$OPEN aperta su $HEAD_REF — push non orfano."
            exit 0
          fi
          # Un branch riusato accumula PR MERGED e CLOSED sulla stessa head, e
          # l'ordine di `gh pr list` non e' documentato. Seleziona l'ultima PR
          # chiusa di qualunque tipo: una CLOSED senza merge e' comunque lavoro
          # che non e' atterrato su main.
          TARGET=$(gh pr list --repo "$REPO" --head "$HEAD_REF" --state all \
            --limit 100 --json number,createdAt,state,mergedAt,headRefOid \
            --jq 'map(select(.state != "OPEN")) | sort_by(.createdAt) | last // {}' \
            2>/dev/null || true)
          # Un gh fallito lascia TARGET vuota; evita `${TARGET:-{}}`, che Bash
          # interpreta male per la graffa interna e puo' passare un JSON "{...}}".
          if [ -z "${TARGET:-}" ]; then TARGET='{}'; fi
          PR_NUMBER=$(printf '%s' "$TARGET" | jq -r '.number // empty' 2>/dev/null || true)
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "Nessuna PR chiusa associata a $HEAD_REF — niente da segnalare."
            exit 0
          fi
          MERGED_AT=$(printf '%s' "$TARGET" | jq -r '.mergedAt // empty' 2>/dev/null || true)
          HEAD_OID=$(printf '%s' "$TARGET" | jq -r '.headRefOid // empty' 2>/dev/null || true)

          # Prima verifica la cosa piu' forte: se il pushato e' gia' nella
          # storia di main, non e' orfano. Per gli squash la head originale
          # non e' antenata del merge: il controllo temporale qui sotto copre
          # il nuovo giro senza attribuirlo alla PR vecchia.
          MAIN_CONTAINMENT=$(gh api "repos/${REPO}/compare/${SHA}...main" \
            --jq '.status' 2>/dev/null || true)
          if [ "$MAIN_CONTAINMENT" = "ahead" ] || [ "$MAIN_CONTAINMENT" = "identical" ]; then
            echo "Commit $SHA gia' contenuto in main — nessun push orfano."
            exit 0
          fi

          # Un commit creato dopo il merge e' il nuovo giro su una head
          # riusata, non una prova che il vecchio lavoro sia stato pushato di
          # nuovo. Emetti comunque l'annotation per-SHA, ma non commentare la
          # PR vecchia: il nuovo giro avra' la propria PR appena viene creata.
          PUSHED_AT=$(gh api "repos/${REPO}/commits/${SHA}" \
            --jq '.commit.committer.date // .commit.author.date // empty' \
            2>/dev/null || true)
          if [ -n "${MERGED_AT:-}" ] && [ -n "${PUSHED_AT:-}" ] && [[ "$PUSHED_AT" > "$MERGED_AT" ]]; then
            echo "::warning::Push post-merge su head riusata: commit $SHA e' successivo al merge della PR #$PR_NUMBER; nessun commento sulla PR precedente."
            exit 0
          fi

          # Confronta con la head della PR, non con il merge commit: il commit
          # della PR puo' essere stato squashato e quindi non essere un antenato
          # del merge commit pur essendo gia' atterrato su main. `ahead` e
          # `identical` sono l'equivalente remoto di merge-base --is-ancestor.
          if [ -n "${MERGED_AT:-}" ] && [ -n "${HEAD_OID:-}" ]; then
            CONTAINMENT=$(gh api "repos/${REPO}/compare/${SHA}...${HEAD_OID}" \
              --jq '.status' 2>/dev/null || true)
            if [ "$CONTAINMENT" = "ahead" ] || [ "$CONTAINMENT" = "identical" ]; then
              echo "Commit $SHA gia' contenuto nella head $HEAD_OID della PR #$PR_NUMBER — nessun push orfano."
              exit 0
            fi
          fi

          if [ -n "${MERGED_AT:-}" ]; then
            KIND='MERGED'
          else
            KIND='CLOSED WITHOUT MERGE'
          fi
          # L'annotation deve precedere il gate di dedup: ogni SHA orfano deve
          # restare visibile anche quando il commento per-PR esiste gia'.
          echo "::warning::Push orfano: commit $SHA sul branch $HEAD_REF della PR #$PR_NUMBER ($KIND)."
          MARKER='<!-- orphan-push-warn -->'
          # `--paginate` evita che un thread lungo tronchi il marker e riapra
          # il commento duplicato a ogni push.
          COMMENTS=$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq '.[].body' 2>/dev/null || true)
          if printf '%s' "$COMMENTS" | grep -Fq "$MARKER"; then
            echo "Avviso push orfano gia' presente sulla PR #$PR_NUMBER — nessun commento duplicato."
            exit 0
          fi
          BODY=$(printf '%s\n\n%s\n\n%s' \
            "⚠️ Push orfano dopo merge" \
            "Il commit ${SHA} è atterrato sul branch ${HEAD_REF} della PR #${PR_NUMBER}, che è ${KIND}. Il commit non è su main e resterebbe orfano in silenzio." \
            "Recuperalo con una nuova PR (cherry-pick) se deve entrare. ${MARKER}")
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$BODY" \
            || echo "Commento su PR #$PR_NUMBER fallito — il push resta un segnale, non un blocco."
          exit 0
