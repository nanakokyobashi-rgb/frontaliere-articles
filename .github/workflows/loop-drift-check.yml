name: Loop drift check

# Sorveglia la divergenza fra il ciclo autonomo di questo repo e quello di
# valerielinc-ops/frontaliere-si-o-no, e apre una issue SOLO quando c'è una
# decisione da prendere.
#
# Non è un diff a due vie. I due lati sono diversi per costruzione — qui non
# esistono vitest, npm ci, functions/ — e un checker che segnalasse ogni
# differenza direbbe la stessa cosa ogni giorno finché nessuno lo guarda più.
# Il confronto è a tre vie contro la baseline registrata nel manifest, quindi
# la domanda a cui risponde non è "sono diversi" ma **chi si è mosso**:
#
#   - `site-ahead`   il sito ha evoluto, qui no → c'è lavoro da portare. È il
#                    caso che oggi passa inosservato: il mirror dell'engine ha
#                    già dimostrato che un canale di discesa interrotto non lo
#                    dice a nessuno (nove commit persi, visibili solo come un
#                    audit passato da 23 a 3608).
#   - `corpus-ahead` abbiamo migliorato qualcosa qui → candidato a risalire.
#                    Senza questa classe le ottimizzazioni locali restano
#                    invisibili e vengono cancellate al prossimo allineamento.
#   - `both-moved`   due modifiche indipendenti → serve un umano, niente merge
#                    automatico.
#
# Zero Claude, zero scritture sul sito: legge file pubblici via raw.github.
# Costo di quota nullo.
#
# Cadenza giornaliera: la divergenza è un fenomeno lento (il sito mergia ~21
# PR/giorno ma tocca i file del ciclo di rado), e un controllo orario
# produrrebbe solo rumore sullo stesso verdetto.

on:
  schedule:
    - cron: '31 7 * * *' # 07:31 UTC, fuori dai picchi di cron del sito
  workflow_dispatch:
    inputs:
      report_issue:
        description: 'Apri/aggiorna la issue di drift (default: solo report nel log)'
        required: false
        type: boolean
        default: false
  # Un cambiamento ai file del ciclo è il momento in cui la baseline va
  # ri-registrata: verificare qui evita di scoprire settimane dopo che il
  # manifest era rimasto indietro.
  pull_request:
    paths:
      - 'scripts/ci/**'
      - 'scripts/lib/**'
      - '.github/workflows/**'
      - 'REVIEW.md'

permissions:
  contents: read
  issues: write

concurrency:
  group: loop-drift-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # `fetch-depth: 0` e non 1: la verifica delle baseline del manifest
          # contro la storia dei path (passo in fondo) e' integrale o non e'.
          # Con un checkout shallow lo script esce 1 invece di dichiarare
          # verificato cio' che non ha potuto leggere, quindi la profondita' fa
          # parte del contratto del job, non e' un dettaglio del runner.
          fetch-depth: 0
          # La storia resta completa, ma i blob del corpus vengono richiesti
          # on-demand dal verificatore: il checkout non deve scaricare 667 MB
          # dentro il timeout del watchdog.
          filter: blob:none

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Confronta il ciclo col sito
        id: drift_report
        # In modalita' report, un drift che ha gia' aperto/aggiornato la issue
        # non deve trasformarsi anche in una `Workflow Failure`.
        continue-on-error: ${{ github.event_name == 'schedule' || github.event.inputs.report_issue == 'true' || github.event.inputs.report_issue == '1' || github.event.inputs.report_issue == 'True' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SITE_REPO: valerielinc-ops/frontaliere-si-o-no
          SITE_REF: main
        run: |
          # Sulle PR il report resta nel log e NON fallisce il job: una
          # divergenza col sito non è un difetto della PR in corso, e far
          # fallire il check bloccherebbe l'auto-merge per una ragione che non
          # riguarda chi l'ha aperta. Sullo schedule invece si apre la issue.
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.report_issue }}" = "true" ] || [ "${{ github.event.inputs.report_issue }}" = "1" ] || [ "${{ github.event.inputs.report_issue }}" = "True" ]; then
            ARGS="--issue --strict"
          fi
          node scripts/ci/loop-drift-check.mjs $ARGS

      # I 24 artifact cross-repo hanno tre famiglie di digest e finora solo una
      # era confrontata con qualcosa (issue #916): `generatorSha256` e i 24
      # `sourceSha256` puntano a file che in questo checkout NON esistono,
      # quindi l'unico posto dove verificarli è qui, dove c'è la rete.
      # `if: always()` perché il passo sopra può uscire non-zero con `--strict`
      # su un drift che non riguarda questa domanda.
      - name: Verifica la provenienza del contratto cross-repo
        id: provenance_report
        if: always()
        # `--issue --strict` nel passo precedente rende l'exit non-zero la
        # prova che il canale di drift ha gia' preso in carico il verdetto.
        # In quel caso il rosso di questo report non apre una seconda issue.
        continue-on-error: ${{ steps.drift_report.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_REPO: valerielinc-ops/frontaliere-si-o-no
          SITE_REF: main
        run: |
          # Stessa regola del passo sopra, e la stessa CONDIZIONE: si escala
          # sullo schedule, oppure su un dispatch che l'ha chiesto con
          # `report_issue`. Sulle PR il report resta nel log — un generatore
          # mosso sul sito non è un difetto della PR in corso, e bloccarne
          # l'auto-merge sposterebbe il costo sulla persona sbagliata.
          #
          # `!= pull_request` non era la stessa regola: includeva anche il
          # `workflow_dispatch` di sola ISPEZIONE, quindi guardare il report a
          # mano faceva fallire il workflow e apriva una issue via
          # `workflow-failure-issues` — cioè il gesto più innocuo del ciclo
          # consumava un giro di fixer sulla quota condivisa col sito, per uno
          # stato del sito che nessuno aveva ancora deciso di trattare.
          # L'opt-in esiste già un passo sopra: qui va letto uguale (#982).
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.report_issue }}" = "true" ] || [ "${{ github.event.inputs.report_issue }}" = "1" ] || [ "${{ github.event.inputs.report_issue }}" = "True" ]; then
            ARGS="--strict"
          fi
          node scripts/ci/verify-crawler-contract-provenance.mjs $ARGS

      # Le baseline del manifest riconfrontate con la storia REALE dei path.
      # Le altre due verifiche di provenienza hanno entrambe un buco che questa
      # chiude: `checkBaselineProvenance()` (passo sopra) guarda tutte le voci
      # ma via rete, con un cap sulla storia esaminata e solo DOPO il merge;
      # `loop-baseline-pr-gate.mjs` guarda pre-merge ma solo le voci cambiate
      # nella PR, quindi ogni baseline gia' presente quando quel gate e' nato
      # non e' mai passata da nessuna verifica. Misurato sulla #978: una voce
      # entrata sette ore prima del gate con un `baseline.corpus` che quel path
      # non ha mai avuto.
      #
      # Qui il lato corpus e' QUESTO repo: offline, integrale, deterministico.
      # Quindi si esce rossi anche sulle PR — a differenza dei due passi sopra,
      # che dipendono dallo stato di un terzo repo: il rimedio
      # (`--init --only <path>`) e' interamente nelle mani di chi ha aperto la
      # PR, e non c'e' nessun falso rosso da cui proteggerla.
      - name: Baseline del manifest verificate contro la storia dei path
        if: always()
        run: node scripts/ci/verify-manifest-baseline-history.mjs

      # Il guard di censimento usa la rete solo una volta al giorno: serve a
      # scoprire file byte-identici fuori da `scope.roots`, `files` e
      # `outOfScope`, non a rallentare ogni PR con la stessa domanda.
      - name: Censimento opt-in dei gemelli
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SITE_REPO: valerielinc-ops/frontaliere-si-o-no
        run: LOOP_TWIN_CENSUS=1 node --test generator/tests/loop-sync-manifest-scope.test.mjs
