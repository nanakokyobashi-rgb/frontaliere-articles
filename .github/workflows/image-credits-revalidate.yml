name: Image credits revalidate

# Rilegge ogni mese su Wikimedia Commons i metadati delle copertine accreditate
# (P14, PR C4) e apre o aggiorna UNA issue quando il credito pubblicato non dice
# più quello che Commons dice oggi: un file cancellato, una licenza o un autore
# cambiati, una restrizione nuova, un file che ora richiede una mano umana.
#
# ── Perché serve ───────────────────────────────────────────────────────────
# Un record `content/image-credits/blog/<copertina>.json` fotografa Commons nel
# giorno in cui è stato letto. Commons cambia dopo: un file cancellato è quasi
# sempre un problema di copyright, una licenza o un autore cambiati rendono
# falso il credito della pagina. Senza una rilettura nessuno se ne accorge.
#
# ── Cosa fa, e cosa non fa MAI ─────────────────────────────────────────────
#  · `--fetch` (circa 11 richieste GET di sola lettura, con User-Agent,
#    `maxlag` e pause come chiede l'API di Commons) scrive lo snapshot nel
#    RUNNER; `--check` lo confronta con i record e nomina ogni campo cambiato
#    (`fetchedAt` non conta: una rilettura che trova il file uguale non è un
#    cambiamento).
#  · `scripts/ci/image-credits-revalidate.mjs` legge il log di `--check`: pulito
#    → lo dice e basta; problemi → una issue col titolo fisso (deduplicata da
#    `scripts/lib/github-issue-creator.mjs`, che commenta quella aperta), con
#    l'elenco per tipo e il rimedio. `needs-human`: curare un credito vuol dire
#    leggere la pagina del file, e restrizioni e sostituzioni le decide il
#    proprietario.
#  · Niente commit, niente push, niente PR: `contents: read`. Il rimedio è una
#    PR fatta da una persona (`--fetch`, curatela, `--build`).
#  · Un `--fetch` fallito o un log di `--check` incompleto rendono rossa la run
#    e nessuna issue di crediti: è un guasto, e lo segnala
#    `workflow-failure-issues.yml`.
#
# ── Checkout, misurato il 2026-10-04 su `main` (d389f7b06) ─────────────────
# L'albero intero è 38.903 file e 1.569 MB, quasi tutti inutili qui: `data/`
# da solo è 905 MB e `public/images/blog/` 362 MB (6.094 file). Due passate:
#  1. sparse checkout dei soli path che i due script leggono (codice, record,
#     letterali SEO, registri, quattro JSON di `data/`): 1.657 file, 24 MB;
#  2. le copertine Commons di cui `--check` misura l'header webp (crop o
#     resize), elencate dallo stesso `liveCommonsCovers` che `--check` usa:
#     684 file, 73 MB. Senza, `--check` dà 684 «size unknown».
# Totale 2.341 file, 97 MB, con `filter: blob:none`: si scaricano solo i blob
# materializzati. `generator/tests/image-credits-revalidate.test.mjs` verifica
# che la passata 1 copra tutto ciò che gli script importano e leggono.
#
# ── Cadenza ────────────────────────────────────────────────────────────────
# Il 7 di ogni mese alle 04:43 UTC: un minuto che nessun altro cron di questo
# repo usa, lontano dal vertice dell'ora e dai minuti del sito
# (:15/:17/:20/:23), e lontano dall'inizio del mese.
#
# ── Perché il PAT per aprire ───────────────────────────────────────────────
# Come negli altri monitor: una issue aperta dal GITHUB_TOKEN non emette
# `issues: opened` e nascerebbe fuori dal triage. Il PAT arriva dalla shell
# runtime dopo `load-rc-env.mjs`, caricato solo dopo `--fetch` e `--check`.

on:
  schedule:
    - cron: '43 4 7 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Stampa la issue che aprirebbe, senza aprirla'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: image-credits-revalidate
  cancel-in-progress: false

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /engine/shared/
            /generator/scripts/lib/
            /generator/scripts/load-rc-env.mjs
            /scripts/lib/
            /scripts/backfill-image-credits.mjs
            /scripts/ci/image-credits-revalidate.mjs
            /content/image-credits/
            /content/seo/
            /content/blog-articles-data.ts
            /content/swiss-articles-data.ts
            /data/blog-images-used.json
            /data/blog-images-used-site-legacy.json
            /data/image-credit-overrides.json
            /data/commons-credit-snapshot.json
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Nessun `npm ci`: backfill, librerie dei crediti e issue creator usano
      # solo builtin Node e `gh`.

      - name: Check out the covers --check measures
        run: |
          set -euo pipefail
          node scripts/ci/image-credits-revalidate.mjs --cover-patterns > "$RUNNER_TEMP/cover-patterns.txt"
          git sparse-checkout add --stdin < "$RUNNER_TEMP/cover-patterns.txt"
          # Una copertina tracciata e rimasta fuori dal checkout (skip-worktree,
          # `S`) diventerebbe un «size unknown» di --check, cioè una issue di
          # crediti falsa: meglio una run rossa.
          skipped=$(sed 's|^/||' "$RUNNER_TEMP/cover-patterns.txt" | xargs -r git ls-files -t -- | grep -c '^S ' || true)
          if [ "$skipped" -gt 0 ]; then
            echo "::error::$skipped copertine Commons tracciate non sono nel checkout: --check misurerebbe un albero incompleto"
            exit 1
          fi
          echo "$(wc -l < "$RUNNER_TEMP/cover-patterns.txt") copertine Commons vive, $(find public/images/blog -name '*.webp' 2>/dev/null | wc -l) webp nel checkout"

      - name: Read the Commons metadata again (read-only)
        run: node scripts/backfill-image-credits.mjs --fetch

      - name: Compare the credit records with it
        run: |
          set +e
          node scripts/backfill-image-credits.mjs --check > "$RUNNER_TEMP/image-credits-check.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/image-credits-check.log"
          echo "--check: exit $status (1 = problemi o guasto: decide lo step successivo)"

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_JSON assente — si prosegue col GITHUB_TOKEN (la issue si aprirà comunque, la raccoglie lo sweep)."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config
        continue-on-error: true
        run: node generator/scripts/load-rc-env.mjs

      - name: Open or update the issue
        env:
          # `GITHUB_PAT_NANAKO` arriva da Remote Config (GITHUB_ENV) ed è quello
          # che fa emettere `issues: opened`; il fallback shell tiene la run
          # viva anche quando Remote Config non risponde.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          runtime_pat="${GITHUB_PAT_NANAKO:-}"
          export GH_TOKEN="${runtime_pat:-$GH_TOKEN}"
          args=(--check-log "$RUNNER_TEMP/image-credits-check.log")
          if [ "${DRY_RUN:-false}" = "true" ]; then args+=(--dry-run); fi
          node scripts/ci/image-credits-revalidate.mjs "${args[@]}"

      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
