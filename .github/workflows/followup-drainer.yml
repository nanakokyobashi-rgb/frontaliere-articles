name: Follow-up drainer (queue → agent:fix, no-Claude)

# Drena la coda `agent:fix-queued` UNO alla volta, promuovendo a `agent:fix`
# solo quando lo slot del fixer è libero.
#
# Perché una alla volta e non tutte insieme: `issue-fix` ha una concurrency
# globale con `cancel-in-progress: false`, quindi promuovere N issue insieme
# significa N run in coda di cui una sola gira e le altre restano pending
# finché non vengono cancellate. Sul sito questo ha prodotto il 60% di run
# follow-up cancellate e una ventina di issue bloccate. Promuovendo solo a slot
# libero, la run promossa è l'unica pending e non può essere cancellata.
#
# Su questo repo il meccanismo conta ancora di più, perché il volume di issue è
# dominato dai fallimenti di generazione articoli: senza la coda, un provider
# LLM che cade per un'ora riempirebbe lo slot del fixer di guasti transienti e
# affamerebbe tutto il resto.
#
# ZERO Claude: tutto deterministico.
#
# ── ADATTAMENTI (manifest: `adapted`) ───────────────────────────────────────
#  - Nessun `npm ci`; ponte RC in `generator/scripts/load-rc-env.mjs`.
#  - Identità di promozione: `GITHUB_PAT_NANAKO` (niente GitHub App qui).
#  - Cadenza `*/20` → `*/25` ai minuti dispari, sfasata dal sito.

on:
  schedule:
    - cron: '5,30,55 * * * *'
  workflow_run:
    workflows: ['Issue fix (Claude → PR)'] # appena un fix finisce, promuovi il prossimo
    types: [completed]
  workflow_dispatch:

concurrency:
  group: followup-drainer
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  drain:
    runs-on: ubuntu-latest
    # Deve restare uguale a JOB_TIMEOUT_MINUTES sotto: `timeout-minutes` non
    # accetta il context `env`, quindi il valore è ripetuto.
    timeout-minutes: 6
    env:
      JOB_TIMEOUT_MINUTES: 6
    steps:
      # Deadline assoluta: è il riferimento che permette allo script di sapere
      # quanto tempo gli lascia il setup (scripts/ci/lib/run-budget.mjs).
      - name: Export job deadline
        run: echo "CI_JOB_DEADLINE_EPOCH=$(( $(date +%s) + ${{ env.JOB_TIMEOUT_MINUTES }} * 60 ))" >> "$GITHUB_ENV"

      # Cap sul Checkout separato da quello del job: sul sito un `git fetch` in
      # coda si è preso l'intero budget di 6 minuti e il drain non è mai
      # partito. Un cap sullo step cambia l'esito da `cancelled` a `failure`, e
      # un job cancellato non fa scattare nessun `if: failure()` — si perde in
      # silenzio. Questo repo è molto più piccolo del sito, quindi il margine è
      # ampio; il cap resta perché il modo di fallire è quello che conta, non la
      # taglia.
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ Nessuna Firebase SA — PAT non caricato; promozione inerte (un labeled dal GITHUB_TOKEN non farebbe partire il fixer)."
          fi

      - name: Load secrets from Remote Config
        continue-on-error: true
        run: node generator/scripts/load-rc-env.mjs

      - name: Alert token-down (dedup, zero-Claude)
        if: env.GITHUB_PAT_NANAKO == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/ci/alert-pat-down.mjs --workflow "${{ github.workflow }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Drain follow-up queue (deterministic, no Claude)
        env:
          # Il PAT è obbligatorio, non preferito: il `labeled` che promuove a
          # `agent:fix` deve far partire il fixer, e un evento emesso dal
          # GITHUB_TOKEN non lo fa. Senza PAT il drainer esce con un warning
          # invece di promuovere a vuoto — una promozione inerte lascerebbe la
          # issue etichettata `agent:fix` senza che nulla la lavori, che è lo
          # stato peggiore: sembra in corso e non lo è.
          GH_TOKEN: ${{ env.GITHUB_PAT_NANAKO }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Il beacon di quota cross-repo vale anche qui: promuovere una issue
          # mentre la quota condivisa è esaurita significa bruciare lo slot per
          # una run che morirà su 429 al primo turno.
          QUOTA_BEACON_PEER_REPO: valerielinc-ops/frontaliere-si-o-no
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::Nessun PAT usabile → drainer inerte (la promozione non farebbe partire il fixer)."
            exit 0
          fi
          node scripts/ci/followup-drainer.mjs

      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json
