name: Retry code check after corrected PR body
run-name: 'Body recovery · PR #${{ github.event.pull_request.number }}'

# API-only recovery on trusted main. It reruns the latest tests run of the
# exact PR head, without executing any file/string from the PR.
#
# Since tests.yml no longer listens to `edited`, this is the ONLY path by
# which a body correction re-enters the required check. Corpus adaptations of
# the site twin (see the manifest reason):
#  1. no dispatch when the head has no run: this repo's tests.yml checks out
#     the dispatched ref, so a dispatch on the base would test base code and
#     publish its check on the base SHA, never on the PR head;
#  2. the run is selected on head SHA AND PR branch AND the `pull_request`
#     event: a `push` run of the same commit, or a test-only dispatch from
#     pr-autorebase (no pr_number: no body contract, no review), is never the
#     target;
#  3. a run still in flight that started BEFORE the edit is cancelled and
#     rerun (it may have read the old body), instead of being classified
#     before its failed steps exist — the old `edited` trigger did the same
#     via cancel-in-progress, but for every edit;
#  4. a `cancelled` / `timed_out` latest run is rerun too: after an edit no
#     other event would ever bring that head back to a verdict;
#  5. a GREEN run is rerun when the NEW body breaks the contract (checked with
#     the base branch's own evaluator, zero-Claude): the rerun turns the
#     required check red before native auto-merge can land a broken body.
#     A green run whose new body still passes the contract is kept, and the
#     review is not redone: that is the policy ratified on the site with
#     valerielinc-ops/frontaliere-si-o-no#9118.
on:
  pull_request_target:
    types: [edited]

permissions:
  actions: write
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: body-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  recover:
    if: github.event.changes.body != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Trusted code only: `pull_request_target` checks out the BASE branch,
      # never the PR head, and only the body-contract evaluator is read.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # Directories holding the evaluator's whole import closure;
          # generator/tests/pr-body-recovery.test.mjs recomputes it.
          sparse-checkout: |
            scripts/lib
            scripts/ci/lib
          persist-credentials: false

      - name: Retry a failed body or review gate on the current head
        uses: actions/github-script@v8
        env:
          BODY_RECOVERY_POLL_MS: '5000'
          BODY_RECOVERY_WAIT_MS: '300000'
        with:
          script: |
            const repo = context.repo;
            const number = context.payload.pull_request.number;
            const editedAt = Date.parse(context.payload.pull_request.updated_at || '');
            const pollMs = Number(process.env.BODY_RECOVERY_POLL_MS) || 5000;
            const waitMs = Number(process.env.BODY_RECOVERY_WAIT_MS) || 300000;
            const retryMs = Number(process.env.BODY_RECOVERY_RETRY_MS) || 1000;
            const rateLimitRetries = Number(process.env.BODY_RECOVERY_RATE_LIMIT_RETRIES) || 3;
            const rateLimitWaitMs = Number(process.env.BODY_RECOVERY_RATE_LIMIT_WAIT_MS) || 300000;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const headerValue = (headers, name) => {
              if (typeof headers?.get === 'function') return headers.get(name);
              return headers?.[name] ?? headers?.[name.toLowerCase()] ?? null;
            };
            const isRateLimitError = error => {
              const status = Number(error?.status ?? error?.response?.status);
              const headers = error?.response?.headers;
              const message = [error?.message, error?.response?.data?.message]
                .filter(Boolean).join(' ');
              return status === 429
                || (status === 403 && (
                  /rate limit|secondary rate|abuse detection/i.test(message)
                  || headerValue(headers, 'retry-after') !== null
                  || headerValue(headers, 'x-ratelimit-remaining') === '0'
                ));
            };
            const retryDelay = (error, attempt) => {
              const headers = error?.response?.headers;
              const retryAfterRaw = headerValue(headers, 'retry-after');
              const retryAfterSeconds = Number(retryAfterRaw);
              const retryAfterMs = Number.isFinite(retryAfterSeconds) && retryAfterSeconds >= 0
                ? retryAfterSeconds * 1000
                : (() => {
                  const retryAt = Date.parse(retryAfterRaw || '');
                  return Number.isFinite(retryAt) ? Math.max(0, retryAt - Date.now()) : 0;
                })();
              const resetAt = Number(headerValue(headers, 'x-ratelimit-reset'));
              const resetMs = Number.isFinite(resetAt) && resetAt > 0
                ? Math.max(0, resetAt * 1000 - Date.now())
                : 0;
              return Math.max(retryAfterMs, resetMs, retryMs * 2 ** attempt);
            };
            // The installation token can exhaust its shared core quota while
            // several workflows are inspecting the same PR. A rate-limit 403
            // is transient when the reset fits in this job's bounded window;
            // every other API error remains fatal and every exhausted retry
            // still fails closed.
            const apiCall = async (label, operation) => {
              const deadline = Date.now() + rateLimitWaitMs;
              for (let attempt = 0; ; attempt += 1) {
                try {
                  return await operation();
                } catch (error) {
                  if (!isRateLimitError(error) || attempt >= rateLimitRetries) throw error;
                  const delay = retryDelay(error, attempt);
                  if (Date.now() + delay > deadline) {
                    throw new Error(`GitHub API rate limit while ${label}; retry window exhausted`, { cause: error });
                  }
                  core.warning(`GitHub API rate limit while ${label}; retrying in ${delay}ms (${attempt + 1}/${rateLimitRetries}).`);
                  await sleep(delay);
                }
              }
            };
            // Read the required context from the same trusted source used by
            // the CI gates; a duplicated literal could block a different
            // check if the job is ever renamed.
            const { VITEST_CHECK_NAME } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/lib/constants.mjs`);
            const { data: pr } = await apiCall('load pull request', () => github.rest.pulls.get({ ...repo, pull_number: number }));
            if (pr.state !== 'open' || pr.head.sha !== context.payload.pull_request.head.sha) return;
            const runs = await apiCall('list tests workflow runs', () => github.paginate(github.rest.actions.listWorkflowRuns, {
              ...repo, workflow_id: 'tests.yml', head_sha: pr.head.sha, per_page: 100,
            }));
            // Only runs that carry this PR's body contract and review: the
            // `pull_request` event on the PR branch.
            const latest = runs
              .filter(run => run.head_branch === pr.head.ref && run.event === 'pull_request')
              .sort((a, b) => b.id - a.id)[0];
            if (!latest) {
              core.info(`No tests run of PR #${number} exists on ${pr.head.sha}; the next push re-enters the code check.`);
              return;
            }
            const getRun = async () => (await apiCall(`read workflow run ${latest.id}`, () => github.rest.actions.getWorkflowRun({ ...repo, run_id: latest.id }))).data;
            const revokeNativeAutoMerge = async () => {
              let lastError;
              for (let attempt = 1; attempt <= 3; attempt += 1) {
                try {
                  // A red recovery job alone does not invalidate the previous
                  // green required check. Revoke native auto-merge first, when
                  // it is still enabled, so an unverifiable body cannot merge.
                  const { data: currentPr } = await apiCall('check native auto-merge', () => github.rest.pulls.get({ ...repo, pull_number: number }));
                  if (currentPr.state !== 'open' || !currentPr.auto_merge) return;
                  await apiCall('disable native auto-merge', () => github.graphql(`
                    mutation DisablePullRequestAutoMerge($pullRequestId: ID!) {
                      disablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId }) {
                        clientMutationId
                      }
                    }
                  `, { pullRequestId: currentPr.node_id });
                  ));
                  core.warning(`Native auto-merge revoked for PR #${number} before fail-closed recovery.`);
                  return;
                } catch (error) {
                  lastError = error;
                  if (attempt < 3 && !isRateLimitError(error)) await sleep(retryMs * attempt);
                }
              }
              throw lastError;
            };
            const failClosed = async message => {
              let revokeError;
              try {
                await revokeNativeAutoMerge();
              } catch (error) {
                revokeError = error;
              }
              if (revokeError) {
                try {
                  // If the API cannot confirm the revocation, make the
                  // required check itself fail on this exact head. A red
                  // recovery job alone would leave the previous green check
                  // eligible for native auto-merge.
                  await apiCall('block the required check', () => github.rest.checks.create({
                    ...repo,
                    name: VITEST_CHECK_NAME,
                    head_sha: pr.head.sha,
                    status: 'completed',
                    conclusion: 'failure',
                    output: {
                      title: 'Body recovery fail-closed',
                      summary: `Auto-merge revocation could not be confirmed: ${message}`,
                    },
                  }));
                  core.warning(`Required check blocked for PR #${number} because native auto-merge revocation failed.`);
                } catch (checkError) {
                  core.setFailed(`Recovery could not revoke native auto-merge or block the required check: ${checkError.message}`);
                  return;
                }
              }
              core.setFailed(message);
            };
            const settle = async attempt => {
              let run = await getRun();
              for (const deadline = Date.now() + waitMs; run.status !== 'completed'; run = await getRun()) {
                if (run.run_attempt !== attempt || Date.now() > deadline) return null;
                await sleep(pollMs);
              }
              return run.run_attempt === attempt ? run : null;
            };
            // Re-read: the listing may be stale by now.
            let target = await getRun();
            // A run (or attempt) that started after the edit already read the
            // current body from the API: its verdict, or the one it is about
            // to give, is not stale. This also keeps a duplicate delivery from
            // cancelling our own rerun. Same-second timestamps count as BEFORE
            // the edit (fail-safe: at worst one extra rerun, never a stale
            // verdict).
            if (!Number.isFinite(editedAt)) {
              await failClosed(`Edit timestamp non verificabile per PR #${number}; nessun retry cieco.`);
              return;
            }
            const startedAt = Date.parse(target.run_started_at || target.created_at || '');
            if (!Number.isFinite(startedAt)) {
              await failClosed(`Run ${target.id} senza timestamp verificabile; nessun retry cieco.`);
              return;
            }
            if (startedAt > editedAt) {
              core.info(`Run ${target.id} started after the edit; it validates the current body.`);
              return;
            }
            if (target.status !== 'completed') {
              try {
                await apiCall(`cancel workflow run ${target.id}`, () => github.rest.actions.cancelWorkflowRun({ ...repo, run_id: target.id }));
              } catch (error) {
                // 409: it completed in the meantime; classify it below.
                if (error?.status !== 409) throw error;
              }
              target = await settle(target.run_attempt);
              if (!target) {
                await failClosed(`Run ${latest.id} did not settle within the wait after cancellation; recovery cannot classify it safely.`);
                return;
              }
            }
            let retryReason = '';
            if (target.conclusion === 'success') {
              const { evaluateBodyContract } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/pr-body-contract-eval.mjs`);
              const { blocking } = evaluateBodyContract(pr.body ?? '');
              if (blocking > 0) retryReason = `the new body breaks the contract (${blocking} blocking problems)`;
            } else if (['cancelled', 'timed_out'].includes(target.conclusion)) {
              retryReason = `it ended ${target.conclusion} (or was still running on the previous body)`;
            } else if (target.conclusion === 'failure') {
              // Inspect the latest attempt only, never an old failure
              // underneath a running retry. A passed preflight alone is not
              // enough: the reviewer can also reject the body.
              const jobs = await apiCall('list tests workflow jobs', () => github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...repo, run_id: latest.id, filter: 'latest', per_page: 100,
              }));
              const failedBody = jobs.some(job => job.steps?.some(step => step.name.startsWith('PR-body completeness + multi-issue Closes') &&
                  step.conclusion === 'failure'));
              const reviewFailureSteps = new Set([
                'Require approving Codex review',
                'Classify review gate failure',
                'Fail when required review gate is skipped',
              ]);
              const failedJobs = jobs.filter(job => job.conclusion === 'failure');
              const reviewOnlyFailure = failedJobs.length > 0 && failedJobs.every(job => {
                const failedSteps = (job.steps ?? [])
                  .filter(step => step.conclusion === 'failure')
                  .map(step => step.name);
                return failedSteps.length > 0 && failedSteps.every(name => reviewFailureSteps.has(name));
              });
              retryReason = failedBody
                ? 'the body preflight failed'
                : reviewOnlyFailure
                  ? 'the review gate failed'
                  : '';
            } else if (target.conclusion !== 'success') {
              await failClosed(`Run ${latest.id} has an unverified conclusion (${target.conclusion || 'missing'}); recovery refuses to preserve a stale verdict.`);
              return;
            }
            if (!retryReason) {
              core.info(`Run ${latest.id} (${target.conclusion}) did not fail on the body or review alone; preserve the existing code verdict.`);
              return;
            }
            // Recheck both head and attempt right before the write. Duplicate
            // edit deliveries must not restart a retry that is already queued.
            const [{ data: currentPr }, currentRun] = await Promise.all([
              apiCall('recheck pull request before retry', () => github.rest.pulls.get({ ...repo, pull_number: number })),
              getRun(),
            ]);
            if (currentPr.state !== 'open' || currentPr.head.sha !== pr.head.sha ||
                currentRun.status !== 'completed' || currentRun.run_attempt !== target.run_attempt) return;
            await apiCall(`rerun workflow ${latest.id}`, () => github.rest.actions.reRunWorkflow({ ...repo, run_id: latest.id }));
            core.info(`Retrying code run ${latest.id}: ${retryReason} and the description changed.`);
