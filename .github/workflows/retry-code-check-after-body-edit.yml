name: Retry code check after corrected PR body
run-name: 'Body recovery · PR #${{ github.event.pull_request.number }}'

# API-only recovery on trusted main. It reruns the latest tests run of the
# exact PR head, without executing any file/string from the PR.
#
# Corpus adaptation: no dispatch when the head has no run. The site version
# dispatches tests.yml on the base ref, but this repo's tests.yml checks out
# the dispatched ref (no `ref: inputs.head_sha`), so that run would test the
# base code and publish its check on the base SHA, never on the PR head.
on:
  pull_request_target:
    types: [edited]

permissions:
  actions: write
  pull-requests: read

concurrency:
  group: body-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  recover:
    if: github.event.changes.body != null
    runs-on: ubuntu-latest
    # Covers the wait below for a run still in flight (review p90 ~12 min).
    timeout-minutes: 50
    steps:
      - name: Retry a failed body or review gate on the current head
        uses: actions/github-script@v8
        env:
          BODY_RECOVERY_POLL_MS: '30000'
          BODY_RECOVERY_WAIT_MS: '2400000'
        with:
          script: |
            const repo = context.repo;
            const number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: number });
            if (pr.state !== 'open' || pr.head.sha !== context.payload.pull_request.head.sha) return;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...repo, workflow_id: 'tests.yml', head_sha: pr.head.sha, per_page: 100,
            });
            const latest = runs.sort((a, b) => b.id - a.id)[0];
            if (!latest) {
              core.info(`No tests run exists on ${pr.head.sha}; the next push re-enters the code check.`);
              return;
            }
            // Corpus adaptation: settle BEFORE classifying. The edit can land
            // while the latest run is still queued or reviewing; its failed
            // steps do not exist yet, and without `edited` on tests.yml no
            // other event would ever retry it once it fails on the old body.
            const pollMs = Number(process.env.BODY_RECOVERY_POLL_MS) || 30000;
            const deadline = Date.now() + (Number(process.env.BODY_RECOVERY_WAIT_MS) || 2400000);
            let settled = latest;
            while (settled.status !== 'completed') {
              if (Date.now() > deadline) {
                core.warning(`Run ${latest.id} still ${settled.status} at the wait deadline; no retry.`);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, pollMs));
              ({ data: settled } = await github.rest.actions.getWorkflowRun({ ...repo, run_id: latest.id }));
              // Another attempt started (push, rescuer, duplicate edit): it
              // already reads the current body, nothing left to recover here.
              if (settled.run_attempt !== latest.run_attempt) return;
            }
            if (settled.conclusion !== 'failure') {
              core.info(`Run ${latest.id} concluded ${settled.conclusion}; preserve the existing code verdict.`);
              return;
            }
            // Inspect the latest attempt only, never an old failure underneath
            // a running retry. A passed preflight alone is not enough: the
            // reviewer can also reject the body, and that verdict otherwise
            // remains attached to the unchanged head forever after an edit.
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...repo, run_id: latest.id, filter: 'latest', per_page: 100,
            });
            const failedBody = jobs.some(job => job.steps?.some(step => step.name.startsWith('PR-body completeness + multi-issue Closes') &&
                step.conclusion === 'failure'));
            const reviewFailureSteps = new Set([
              'Require approving Codex review',
              'Classify review gate failure',
              'Fail when required review gate is skipped',
            ]);
            const failedJobs = jobs.filter(job => job.conclusion === 'failure');
            const reviewOnlyFailure = failedJobs.length > 0 && failedJobs.every(job => {
              const failedSteps = (job.steps ?? [])
                .filter(step => step.conclusion === 'failure')
                .map(step => step.name);
              return failedSteps.length > 0 && failedSteps.every(name => reviewFailureSteps.has(name));
            });
            const retryReason = failedBody
              ? 'the body preflight failed'
              : reviewOnlyFailure
                ? 'the review gate failed'
                : '';
            if (!retryReason) {
              core.info('Body preflight and review gate did not fail exclusively; preserve the existing code verdict.');
              return;
            }
            // Recheck both head and attempt after reading jobs. Duplicate edit
            // deliveries must not restart a retry that is already queued.
            const [{ data: currentPr }, { data: currentRun }] = await Promise.all([
              github.rest.pulls.get({ ...repo, pull_number: number }),
              github.rest.actions.getWorkflowRun({ ...repo, run_id: latest.id }),
            ]);
            if (currentPr.state !== 'open' || currentPr.head.sha !== pr.head.sha ||
                currentRun.status !== 'completed' || currentRun.run_attempt !== latest.run_attempt) return;
            await github.rest.actions.reRunWorkflow({ ...repo, run_id: latest.id });
            core.info(`Retrying code run ${latest.id}: ${retryReason} and the description changed.`);
