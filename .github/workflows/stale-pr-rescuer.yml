name: Stale PR rescuer (self-healing signal)

# Trasforma gli stalli silenziosi della pipeline PR in un segnale etichettato e
# interrogabile entro ~1h, invece di lasciarli fermi per giorni. Tre classi:
#
#   A) test verdi sull'head da >2h ma nessuna review li ha coperti (coda
#      congestionata, o il workflow file del branch è indietro).
#   B) 🔴 Important non ripreso: il reviewer l'ha postato sull'head corrente,
#      l'auto-merge è skippato e non arriva nessun commit nuovo.
#   C) test non-`success` sull'head e nessun run in volo. È la classe che
#      cadeva in un `else` MUTO: una PR con i test rossi non ha — e non può
#      acquisire — nessuno dei due segnali richiesti da A e B, perché il
#      reviewer gira solo su test verdi. Senza `stale-review` il gate
#      near-merge di `pr-autorebase` la salta, quindi niente rebase e niente
#      re-test, quindi il rosso resta. Ciclo chiuso.
#
# DETERMINISTICO, zero Claude. L'azione è una label + UN commento idempotente:
# nessun push automatico, quindi è sicuro girarlo accanto ad agent attivi.
#
# ── ADATTAMENTO chiave (manifest: `adapted`) ────────────────────────────────
# Il nome del check-run sul sito è hardcoded due volte dentro jq. Qui arriva da
# `CI_CHECK_NAME` e viene passato a jq con `--arg`: un literal in più nello
# YAML sarebbe una seconda sorgente di verità per lo stesso valore, cioè
# esattamente la classe di drift che `generator/tests/ci-check-name.test.mjs`
# sorveglia sul lato `.mjs` — e che qui non vedrebbe nessuno, perché un test
# non legge dentro una stringa jq.

on:
  # Primario: subito dopo ogni review — cioè esattamente quando uno stallo
  # inizierebbe. Il cron da solo non basta: GitHub lo deprioritizza sotto
  # carico e può saltare ore.
  workflow_run:
    workflows: ['PR Review (Claude single-pass)']
    types: [completed]
  schedule:
    - cron: '35 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo log, nessuna label né commento'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  checks: read # commits/{sha}/check-runs sull'head reale della PR
  pull-requests: write
  issues: write

concurrency:
  group: stale-pr-rescuer
  cancel-in-progress: false

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Scan open PRs and flag stalled ones
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          # Unica sorgente del nome del check anche per questo workflow.
          CI_CHECK_NAME: 'tests (node --test)'
        run: |
          set -uo pipefail
          NOW=$(date -u +%s)
          AGE_MIN_S=7200  # 2h: non toccare PR con lavoro recente

          prs=$(gh pr list --repo "$REPO" --state open --limit 50 \
            --json number,headRefName,headRefOid,updatedAt,author,labels,isDraft)

          echo "$prs" | jq -c '.[]' | while read -r pr; do
            N=$(echo "$pr" | jq -r '.number')
            BRANCH=$(echo "$pr" | jq -r '.headRefName')
            HEAD=$(echo "$pr" | jq -r '.headRefOid')
            UPD=$(echo "$pr" | jq -r '.updatedAt')
            HAS_LABEL=$(echo "$pr" | jq -r '[.labels[].name] | index("stale-review") // empty')
            IS_DRAFT=$(echo "$pr" | jq -r '.isDraft')

            # Idempotenza: già segnalata → skip.
            if [ -n "$HAS_LABEL" ]; then echo "PR #$N già stale-review — skip"; continue; fi

            # Le draft NON vanno toccate, ed è necessario per la classe C: una
            # WIP ha spesso i test rossi o nessun check per giorni, quindi
            # verrebbe etichettata `stale-review` — e `recycle-stale-prs` chiude
            # le `stale-review` ferme >24h senza commit nuovi. Senza questo
            # filtro la classe C trasformerebbe un lavoro in corso in una PR
            # chiusa.
            if [ "$IS_DRAFT" = "true" ]; then echo "PR #$N draft — skip"; continue; fi

            UPD_S=$(date -u -d "$UPD" +%s 2>/dev/null || echo "$NOW")
            if [ $((NOW - UPD_S)) -lt $AGE_MIN_S ]; then echo "PR #$N fresca (<2h) — skip"; continue; fi

            checks=$(gh api "repos/$REPO/commits/$HEAD/check-runs" 2>/dev/null || echo '{}')
            # ULTIMO check-run COMPLETATO per `completed_at`, non l'ultimo per
            # ordine API: uno stesso SHA può portare più check omonimi (il run
            # da `pull_request` più un `workflow_dispatch` manuale), e prendere
            # un verdetto arbitrario fa mascherare un `success` reale da un
            # `failure` stantio. Stessa selezione di `vitestCheck.mjs`.
            TESTS_CONCL=$(echo "$checks" | jq -r --arg n "$CI_CHECK_NAME" \
              '[.check_runs[] | select(.name==$n and .status=="completed" and .completed_at)] | sort_by(.completed_at) | last | .conclusion // "none"')
            TESTS_PENDING=$(echo "$checks" | jq -r --arg n "$CI_CHECK_NAME" \
              '[.check_runs[] | select(.name==$n and .status!="completed")] | length')

            reviews=$(gh api "repos/$REPO/pulls/$N/reviews" 2>/dev/null || echo '[]')
            LAST_BODY=$(echo "$reviews" | jq -r '[.[] | select(.user.login|test("claude";"i"))] | last | .body // ""')
            LAST_CID=$(echo "$reviews" | jq -r '[.[] | select(.user.login|test("claude";"i"))] | last | .commit_id // ""')

            REASON=""; RESCUE=""
            if [ "$TESTS_CONCL" = "success" ] && [ "$LAST_CID" != "$HEAD" ]; then
              REASON="test verdi sull'head corrente da >2h ma nessuna review li ha coperti"
              RESCUE="\`git fetch origin main && git merge origin/main\` nel branch \`$BRANCH\`, poi push. Se il merge non serve, può essere solo coda congestionata: attendi."
            elif echo "$LAST_BODY" | grep -qP '🔴\s*\*{0,2}\s*Important\s*\*{0,2}\s*[:—-]' && [ "$LAST_CID" = "$HEAD" ]; then
              # Regex allineata a REDFLAG_IMPORTANT_RE: un `grep -q "🔴"` nudo
              # scatterebbe anche sulla prosa di NEGAZIONE del reviewer ("zero
              # 🔴 Important findings"), segnalando come stallo una PR sana.
              REASON="🔴 Important non ripreso (review sull'head corrente, auto-merge skippato, nessun commit nuovo)"
              RESCUE="applica il fix del 🔴 in un nuovo commit sullo stesso branch \`$BRANCH\` → re-review automatica."
            elif [ "$TESTS_PENDING" = "0" ] && [ "$TESTS_CONCL" != "success" ]; then
              REASON="check \`$CI_CHECK_NAME\` = \`$TESTS_CONCL\` sull'head da >2h, nessun run in volo e nessun segnale a valle (il reviewer gira solo su test verdi) — stallo silenzioso"
              RESCUE="etichettata \`stale-review\` per riaprire il grafo: \`pr-autorebase\` ora la considera near-merge, la rebasa su main e ri-dispatcha i test. Se il rosso è REALE va fixato a mano sul branch \`$BRANCH\` — la label non lo nasconde, lo rende visibile."
            else
              echo "PR #$N nessuno stallo noto (check=$TESTS_CONCL pending=$TESTS_PENDING) — skip"; continue
            fi

            echo "::warning::PR #$N FERMA — $REASON"
            if [ "${DRY_RUN:-false}" = "true" ]; then echo "(dry-run) nessuna azione su PR #$N"; continue; fi

            gh pr edit "$N" --repo "$REPO" --add-label "stale-review" 2>/dev/null || \
              echo "::warning::label stale-review non applicata (assente? la crea scripts/ci/ensure-loop-labels.mjs)"
            gh pr comment "$N" --repo "$REPO" --body "$(printf '🔧 **stale-review** (automatico): PR ferma da oltre 2h.\n\nClasse: %s\n\nCome sbloccarla: %s\n\n_Segnale deterministico da stale-pr-rescuer.yml, zero Claude._' "$REASON" "$RESCUE")" \
              2>/dev/null || echo "commento fallito su PR #$N"
          done
          echo "Scan completo."
