name: Stale PR rescuer (self-healing signal)

# Trasforma gli stalli silenziosi della pipeline PR in un segnale etichettato e
# interrogabile entro ~1h, invece di lasciarli fermi per giorni. Quattro classi:
#
#   D) REVIEW PIÙ VECCHIA DELL'HEAD (direzione 3 della #201): esiste una review
#      Claude, non ha chiuso con `## LGTM`, è su un commit che non è più l'head,
#      e i test sono verdi sull'head. È la PR già riparata — tipicamente dal
#      redflag-fixer — di cui nessuno chiede più conto. Vedi sotto: la novità
#      non è la RILEVAZIONE, è il rimedio.
#   A) test verdi sull'head da >2h ma nessuna review li ha coperti (coda
#      congestionata, o il workflow file del branch è indietro).
#   B) 🔴 Important non ripreso: il reviewer l'ha postato sull'head corrente,
#      l'auto-merge è skippato e non arriva nessun commit nuovo. Se sul thread
#      c'è `<!-- REDFLAG_FIX_ROUND:` il 🔴 è già chiuso proceduralmente dal
#      fixer (nessun commit): si dispatcha `pr-review-loop.yml`. Senza quel
#      marker il 🔴 è ancora aperto e resta il consiglio di un commit nuovo.
#   C) test non-`success` sull'head e nessun run in volo. È la classe che
#      cadeva in un `else` MUTO: una PR con i test rossi non ha — e non può
#      acquisire — nessuno dei due segnali richiesti da A e B, perché il
#      reviewer gira solo su test verdi. Senza `stale-review` il gate
#      near-merge di `pr-autorebase` la salta, quindi niente rebase e niente
#      re-test, quindi il rosso resta. Ciclo chiuso.
#
# ── D: cosa cambia davvero, misurato ────────────────────────────────────────
# La condizione «ultima review più vecchia dell'ultimo commit» era GIÀ coperta,
# ma in aggregato e senza saperlo: con `LAST_CID != HEAD` la catena non ha
# nessuna cella muta — `success` cade in A, non-`success` senza run in volo cade
# in C, e con un run in volo lo skip è corretto. Replay dell'intera storia del
# repo (172 PR, commit vs review Claude in ordine temporale): UN solo intervallo
# oltre le 2h in quello stato, la #122 per 5h35 — e lì i test erano `failure`
# su ogni head, cioè il predicato di C.
#
# Quel che mancava è il RIMEDIO. In quello stato A dice «`git merge origin/main`
# e push», che è la cura per una coda congestionata, non per una review vecchia:
# dal 2026-08-13 `pr-review-loop.yml` ha un `workflow_dispatch` con l'input `pr`
# (#286, direzione 1 della stessa #201) e la cura è UN comando. D non allarga la
# rete — è un SOTTOINSIEME stretto di A, quindi l'insieme delle PR etichettate
# non cambia di una — cambia solo l'istruzione che il commento consegna.
#
# I tre guard sui falsi positivi, ognuno con la sua misura:
#   1. `LAST_CID` non vuoto. Una PR mai revisionata non è «revisionata e poi
#      superata»: resta in A. Sono 25 PR su 172 senza nessuna review Claude.
#   2. l'ultima review NON deve contenere `## LGTM`. Una LGTM su un commit
#      precedente seguita da commit di soli content/data è uno stato SANO e
#      progettato — è il `Re-review guard` di `pr-review-loop.yml`, che salta
#      Claude apposta e porta avanti la LGTM. Senza questo guard sarebbero
#      arrivati 2 falsi positivi su 41 intervalli, uno dei quali proprio sulla
#      #181, la PR da cui nasce la #201.
#   3. test verdi. Con i test rossi la causa dello stallo È il rosso, e il
#      rimedio di C (label → `pr-autorebase` → rebase + re-dispatch dei test) è
#      quello giusto: dirottare lì su un dispatch della review sostituirebbe una
#      cura corretta con una inefficace.
#
# La classificazione è pinnata da `generator/tests/stale-pr-rescuer-classify.test.mjs`,
# che ESTRAE ED ESEGUE il blocco `run:` qui sotto con `gh` e `date` stubbati —
# un test a regex su «c'è un ramo in più» passerebbe anche su un ramo
# irraggiungibile.
#
# DETERMINISTICO, zero Claude. L'azione è una label + UN commento idempotente:
# nessun push automatico, quindi è sicuro girarlo accanto ad agent attivi.
#
# ── ADATTAMENTO chiave (manifest: `adapted`) ────────────────────────────────
# Il nome del check-run sul sito è hardcoded due volte dentro jq. Qui arriva da
# `CI_CHECK_NAME` e viene passato a jq con `--arg`: un literal in più nello
# YAML sarebbe una seconda sorgente di verità per lo stesso valore, cioè
# esattamente la classe di drift che `generator/tests/ci-check-name.test.mjs`
# sorveglia sul lato `.mjs` — e che qui non vedrebbe nessuno, perché un test
# non legge dentro una stringa jq.

on:
  # Primario: subito dopo ogni review — cioè esattamente quando uno stallo
  # inizierebbe. Il cron da solo non basta: GitHub lo deprioritizza sotto
  # carico e può saltare ore.
  workflow_run:
    workflows: ['PR Review (Claude single-pass)']
    types: [completed]
  schedule:
    - cron: '35 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo log, nessuna label né commento'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  checks: read # commits/{sha}/check-runs sull'head reale della PR
  pull-requests: write
  issues: write
  actions: write # workflow_dispatch di pr-review-loop.yml (classe B + REDFLAG_FIX_ROUND)

concurrency:
  group: stale-pr-rescuer
  cancel-in-progress: false

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Scan open PRs and flag stalled ones
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          # Unica sorgente del nome del check anche per questo workflow.
          CI_CHECK_NAME: 'tests (node --test)'
        run: |
          set -uo pipefail
          NOW=$(date -u +%s)
          AGE_MIN_S=7200  # 2h: non toccare PR con lavoro recente

          # `gh api --paginate` e non il vecchio `gh pr list --limit 50`: quel
          # sottocomando NON ha `--paginate` e il suo `--limit` TRONCA in
          # silenzio, quindi oltre il taglio una PR semplicemente non esiste per
          # questo workflow. Nessun errore, nessun log: la 51esima PR aperta non
          # viene classificata e il suo stallo non viene mai visto — che è
          # esattamente il difetto che questo workflow esiste per non avere.
          # Con `--paginate` la risposta arriva come una SEQUENZA di array (uno
          # per pagina): `jq -c '.[]'` la legge come stream, senza `--slurp`.
          prs=$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" 2>/dev/null || echo '[]')

          echo "$prs" | jq -c '.[] | {
              number,
              headRefName: .head.ref,
              headRefOid: .head.sha,
              updatedAt: .updated_at,
              labels: [.labels[] | { name }],
              isDraft: .draft
            }' | while read -r pr; do
            N=$(echo "$pr" | jq -r '.number')
            BRANCH=$(echo "$pr" | jq -r '.headRefName')
            HEAD=$(echo "$pr" | jq -r '.headRefOid')
            UPD=$(echo "$pr" | jq -r '.updatedAt')
            HAS_LABEL=$(echo "$pr" | jq -r '[.labels[].name] | index("stale-review") // empty')
            IS_DRAFT=$(echo "$pr" | jq -r '.isDraft')

            # NOTA: qui NON si salta più la PR che ha già `stale-review`.
            # L'idempotenza si è spostata a valle, sull'AZIONE. Vedi il blocco
            # `MARKER` dopo la catena di classificazione: quel salto in cima era
            # il corto circuito della #314.

            # Le draft NON vanno toccate, ed è necessario per la classe C: una
            # WIP ha spesso i test rossi o nessun check per giorni, quindi
            # verrebbe etichettata `stale-review` — e `recycle-stale-prs` chiude
            # le `stale-review` ferme >24h senza commit nuovi. Senza questo
            # filtro la classe C trasformerebbe un lavoro in corso in una PR
            # chiusa.
            if [ "$IS_DRAFT" = "true" ]; then echo "PR #$N draft — skip"; continue; fi

            UPD_S=$(date -u -d "$UPD" +%s 2>/dev/null || echo "$NOW")
            if [ $((NOW - UPD_S)) -lt $AGE_MIN_S ]; then echo "PR #$N fresca (<2h) — skip"; continue; fi

            # `--paginate` anche qui: `check-runs` risponde `per_page` 30 di
            # default, e un SHA con molti check omonimi (rerun manuali) può
            # spingere il verdetto che conta fuori dalla prima pagina. Con
            # `--paginate` arriva una sequenza di OGGETTI `{check_runs: [...]}`,
            # uno per pagina: `jq -s` li raccoglie e `.[].check_runs[]?` li
            # appiattisce. Il `?` regge anche il fallback `{}`.
            checks=$(gh api --paginate "repos/$REPO/commits/$HEAD/check-runs?per_page=100" 2>/dev/null || echo '{}')
            # ULTIMO check-run COMPLETATO per `completed_at`, non l'ultimo per
            # ordine API: uno stesso SHA può portare più check omonimi (il run
            # da `pull_request` più un `workflow_dispatch` manuale), e prendere
            # un verdetto arbitrario fa mascherare un `success` reale da un
            # `failure` stantio. Stessa selezione di `vitestCheck.mjs`.
            #
            # Il tie-break su `.id` non è cosmetico: `completed_at` è un ISO8601
            # risolto al SECONDO, e due run sullo stesso SHA che chiudono nello
            # stesso secondo sono ordinariamente possibili — un rerun parte
            # quando il primo è quasi finito. A parità di chiave `sort_by` è
            # STABILE, quindi senza tie-break l'ultimo è quello che l'API ha
            # elencato per ultimo: cioè un ordine che non è il tempo. `.id` dei
            # check-run è monotono crescente ed è l'unico discriminante che il
            # payload offre a quella risoluzione.
            TESTS_CONCL=$(echo "$checks" | jq -rs --arg n "$CI_CHECK_NAME" \
              '[.[].check_runs[]? | select(.name==$n and .status=="completed" and .completed_at)] | sort_by([.completed_at, .id]) | last | .conclusion // "none"')
            TESTS_PENDING=$(echo "$checks" | jq -rs --arg n "$CI_CHECK_NAME" \
              '[.[].check_runs[]? | select(.name==$n and .status!="completed")] | length')

            # `--paginate`: una PR molto revisionata supera le 30 review di
            # default, e qui si legge l'ULTIMA — cioè proprio quella che una
            # risposta troncata non contiene. Sequenza di ARRAY: `.[][]?`.
            reviews=$(gh api --paginate "repos/$REPO/pulls/$N/reviews?per_page=100" 2>/dev/null || echo '[]')
            LAST_BODY=$(echo "$reviews" | jq -rs '[.[][]? | select(.user.login|test("claude";"i"))] | last | .body // ""')
            LAST_CID=$(echo "$reviews" | jq -rs '[.[][]? | select(.user.login|test("claude";"i"))] | last | .commit_id // ""')

            # `case` e non `grep`: `echo "$X" | grep -q` chiude la pipe al primo
            # match, e sotto `pipefail` un EPIPE sul lato scrivente farebbe
            # tornare 141 alla pipeline — cioè il contrario di ciò che il test
            # vuole dire. Con un body di review, che è lungo, non è teorico.
            case "$LAST_BODY" in *'## LGTM'*) LAST_LGTM=1 ;; *) LAST_LGTM=0 ;; esac

            REASON=""; RESCUE=""; CLASS=""
            if [ -n "$LAST_CID" ] && [ "$LAST_CID" != "$HEAD" ] && [ "$TESTS_CONCL" = "success" ] && [ "$LAST_LGTM" = "0" ]; then
              CLASS="D"
              # D — direzione 3 della #201. Sottoinsieme stretto di A: nessuna PR
              # in più viene etichettata, cambia solo il rimedio consegnato.
              REASON="ultima review più vecchia dell'head: è su \`${LAST_CID:0:7}\`, l'head è \`${HEAD:0:7}\`, non chiude con \`## LGTM\` e i test sull'head sono verdi — i findings sono stati ripresi da un commit nuovo e nessuno ha ri-revisionato"
              RESCUE="\`gh workflow run pr-review-loop.yml --repo $REPO -f pr=$N\`. Un rerun di \`tests\` NON produce l'evento \`workflow_run\` che fa ripartire il reviewer, quindi senza questo dispatch (o senza un altro commit sul branch \`$BRANCH\`) la review non riparte mai e la PR resta verde e ferma."
            elif [ "$TESTS_CONCL" = "success" ] && [ "$LAST_CID" != "$HEAD" ]; then
              CLASS="A"
              REASON="test verdi sull'head corrente da >2h ma nessuna review li ha coperti"
              RESCUE="\`git fetch origin main && git merge origin/main\` nel branch \`$BRANCH\`, poi push. Se il merge non serve, può essere solo coda congestionata: attendi."
            elif echo "$LAST_BODY" | grep -qP '🔴\s*\*{0,2}\s*Important\s*\*{0,2}\s*[:—-]' && [ "$LAST_CID" = "$HEAD" ]; then
              CLASS="B"
              # Regex allineata a REDFLAG_IMPORTANT_RE: un `grep -q "🔴"` nudo
              # scatterebbe anche sulla prosa di NEGAZIONE del reviewer ("zero
              # 🔴 Important findings"), segnalando come stallo una PR sana.
              REASON="🔴 Important non ripreso (review sull'head corrente, auto-merge skippato, nessun commit nuovo)"
              RESCUE="applica il fix del 🔴 in un nuovo commit sullo stesso branch \`$BRANCH\` → re-review automatica."
            elif [ "$TESTS_PENDING" = "0" ] && [ "$TESTS_CONCL" != "success" ]; then
              CLASS="C"
              REASON="check \`$CI_CHECK_NAME\` = \`$TESTS_CONCL\` sull'head da >2h, nessun run in volo e nessun segnale a valle (il reviewer gira solo su test verdi) — stallo silenzioso"
              RESCUE="etichettata \`stale-review\` per riaprire il grafo: \`pr-autorebase\` ora la considera near-merge, la rebasa su main e ri-dispatcha i test. Se il rosso è REALE va fixato a mano sul branch \`$BRANCH\` — la label non lo nasconde, lo rende visibile."
            else
              echo "PR #$N nessuno stallo noto (check=$TESTS_CONCL pending=$TESTS_PENDING) — skip"
              # L'altra metà della #314. `stale-review` non veniva TOLTA da
              # nessuno, e finché resta costa due volte: `pr-review-loop.yml`
              # salta la PR (quindi verde e mai revisionata), e
              # `recycle-stale-prs` la conta fra le chiudibili a 24h — cioè un
              # segnale scaduto può far chiudere una PR sana.
              #
              # Si toglie SOLO quando lo stato è noto e sano: `TESTS_PENDING=0`
              # esclude il caso «non lo sappiamo ancora», dove togliere la label
              # significherebbe cancellare un segnale valido per un run in volo.
              if [ -n "$HAS_LABEL" ] && [ "$TESTS_PENDING" = "0" ] && [ "${DRY_RUN:-false}" != "true" ]; then
                gh pr edit "$N" --repo "$REPO" --remove-label "stale-review" 2>/dev/null \
                  && echo "PR #$N: stale-review RIMOSSA — nessuno stallo residuo" \
                  || echo "::warning::rimozione di stale-review fallita su PR #$N"
              fi
              continue
            fi

            echo "::warning::PR #$N FERMA — $REASON"
            if [ "${DRY_RUN:-false}" = "true" ]; then echo "(dry-run) nessuna azione su PR #$N"; continue; fi

            # ── Idempotenza sull'AZIONE, non sulla VALUTAZIONE (#314) ────────
            # Prima c'era, in cima al ciclo, `[ -n "$HAS_LABEL" ] && continue`:
            # bastava una label perché la PR non venisse MAI più classificata.
            # È la combinazione peggiore, perché `stale-review` è anche ciò che
            # fa saltare la PR a `pr-review-loop.yml`. Una PR entrata in classe
            # C (test rossi), riparata dopo, diventa una classe D — verde, con
            # una review vecchia — che nessuno poteva più vedere: verde per ogni
            # gate, senza review, per sempre.
            #
            # Il loop che quel salto evitava era il RI-COMMENTO a ogni cron, e
            # si chiude più stretto senza spegnere la valutazione: la chiave di
            # idempotenza è la coppia (CLASSE, HEAD), scritta come marker HTML
            # dentro il commento. Stessa classe sullo stesso head → nessun
            # secondo commento. Classe DIVERSA, o head nuovo → è un fatto nuovo,
            # e va detto. Il marker è nel corpo e non nella label perché la
            # label è UNA e non può portare due dimensioni.
            #
            # `case` e non `grep -qF`: `echo | grep -q` chiude la pipe al primo
            # match e sotto `pipefail` l'EPIPE farebbe tornare 141, cioè un
            # «non trovato» proprio quando il marker C'È. Stessa ragione del
            # `case` su `## LGTM` qui sopra.
            MARKER="<!-- stale-pr-rescuer class=$CLASS head=${HEAD:0:7} -->"
            posted=$(gh api --paginate "repos/$REPO/issues/$N/comments?per_page=100" 2>/dev/null || echo '[]')
            POSTED_BODIES=$(echo "$posted" | jq -rs '[.[][]? | .body // ""] | join("\n")' 2>/dev/null || echo "")
            case "$POSTED_BODIES" in
              *"$MARKER"*) echo "PR #$N: classe $CLASS su ${HEAD:0:7} già segnalata — nessuna azione"; continue ;;
            esac

            # B + marker del fixer: il 🔴 è chiuso senza commit, quindi `tests`
            # non riparte e `pr-review-loop` non si innesca. La maniglia
            # (`workflow_dispatch`, #286) esiste; qui la si chiama. Senza il
            # marker il consiglio resta un commit nuovo. D consegna lo stesso
            # comando nel testo del RESCUE e NON lo esegue.
            if [ "$CLASS" = "B" ]; then
              case "$POSTED_BODIES" in
                *'<!-- REDFLAG_FIX_ROUND:'*)
                  RESCUE="\`gh workflow run pr-review-loop.yml --repo $REPO -f pr=$N\` — dispatchato da questo run: il 🔴 è chiuso proceduralmente dal redflag-fixer (nessun commit nuovo), e un commit vuoto non è la cura."
                  gh workflow run pr-review-loop.yml --repo "$REPO" -f pr="$N" \
                    && echo "PR #$N: review riaperta via workflow_dispatch (classe B, marker REDFLAG_FIX_ROUND)" \
                    || echo "::warning::dispatch pr-review-loop fallito su PR #$N"
                  ;;
              esac
            fi

            gh pr edit "$N" --repo "$REPO" --add-label "stale-review" 2>/dev/null || \
              echo "::warning::label stale-review non applicata (assente? la crea scripts/ci/ensure-loop-labels.mjs)"
            gh pr comment "$N" --repo "$REPO" --body "$(printf '🔧 **stale-review** (automatico): PR ferma da oltre 2h.\n\nClasse: %s\n\nCome sbloccarla: %s\n\n_Segnale deterministico da stale-pr-rescuer.yml, zero Claude._\n%s' "$REASON" "$RESCUE" "$MARKER")" \
              2>/dev/null || echo "commento fallito su PR #$N"
          done
          echo "Scan completo."
