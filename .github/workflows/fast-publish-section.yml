name: fast-publish-section
run-name: cover-publish-section / ${{ inputs.section || 'auto' }} / nonce=${{ inputs.dispatch_nonce || 'none' }} / dry=${{ inputs.dry_run }}

# Pubblica su R2 le pagine delle sezioni articoli CANTONALI (piano «sezioni
# articoli per cantone», D3/D8; P7b). E' il gemello di fast-publish-article.yml
# per le sezioni che non hanno uno shard Pages: il Worker del sito le serve da
# `edge/sections/<path>/index.html` quando il registro pubblicato da
# publish-api.yml le dichiara `live`.
#
# Cosa fa scattare un publish: un push che tocca i contenuti di una sezione
# cantonale ATTIVA nel core — un corpo (gli articoli cambiati vengono resi),
# oppure registro, mappa slug, meta, chunk SEO o i dati di un hub (si rendono
# landing, archivio e hub). Quali sezioni e quali id lo decide
# `scripts/ci/fast-publish-section.mjs r2-plan`, dal core: con la lista attiva
# di oggi (nessun cantone) la matrice e' vuota e il job `publish` non parte.
#
# CONCURRENCY PER SEZIONE (D8), non globale: `fast-publish-<sezione>`, senza
# cancellazione. Un gruppo unico con 24 generatori terrebbe una sola run in
# attesa e scarterebbe le altre (misurato su generate-article: 16 su 60), e gli
# articoli persi finirebbero tutti sulla riconciliazione. Due sezioni diverse
# scrivono chiavi R2 disgiunte, quindi possono andare in parallelo.
#
# NIENTE NOINDEX: una pagina resa con un `noindex`, senza il meta di proprieta'
# della route o con asset same-origin e' un rifiuto di
# scripts/publish-section-pages.mjs, prima di qualunque upload.
#
# BOOTSTRAP: `workflow_dispatch` con `bootstrap: true` rende TUTTI gli articoli
# della sezione, piu' landing, archivio e hub — e' il passo che carica le
# pagine su R2 mentre la sezione e' ancora `draft`, PRIMA del flip a `live` in
# sections/registry.json. Il verify in quel caso legge le chiavi sul CDN (la
# sezione non e' ancora servita all'apex).

on:
  push:
    branches: [main]
    paths:
      - 'content/cantons/**'
      - 'content/blog-body-canton-*/**'
      - 'content/blog-meta-canton-*'
      # Il flip draft -> live cambia solo il registro. Il primo pass carica le
      # pagine necessarie al bootstrap; il replay workflow_run, dopo il
      # completamento di publish-api, verifica feed RSS e landing sul live.
      - 'sections/registry.json'
      # A declared image may arrive after the article body. The resolver maps
      # this path through the registry to the owning canton article(s).
      # A queued-cover drain is the explicit-outbox exception; its push is
      # filtered by the shared commit marker before this workflow publishes.
      - 'public/images/**'
      - 'generator/scripts/lib/canton-hubs/paths.mjs'
      - 'generator/scripts/lib/corpus-paths.mjs'
      - 'generator/scripts/lib/control-char-write-report.mjs'
      # The article-body preflight is part of the publication chain. Changes
      # to its implementation or parser helpers must rerun this publisher.
      - 'scripts/ci/check-blog-body-links.mjs'
      - 'scripts/ci/check-blog-body-syntax.mjs'
      - 'scripts/lib/article-link-contract.mjs'
      - 'scripts/lib/typescript-expression-scanner.mjs'
      - 'scripts/lib/rss-feed-body-adapter.mjs'
      - 'generator/scripts/lib/article-meta-block.mjs'
      - 'generator/scripts/lib/article-excerpt.mjs'
      - 'engine/**'
      - 'host/**'
      - 'scripts/publish-section-pages.mjs'
      - 'scripts/publish-section-edge.mjs'
      - 'scripts/lib/section-bootstrap-lock.mjs'
      - 'scripts/ci/section-bootstrap-lock.mjs'
      - 'scripts/lib/conditional-cdn-put.sh'
      - 'scripts/ci/fast-publish-section.mjs'
      - 'scripts/ci/dispatch-fast-publish-replay.sh'
      - 'scripts/ci/read-main-head.sh'
      - 'scripts/ci/resolve-workflow-run-push-range.mjs'
      - 'scripts/ci/retry-cmd.sh'
      - 'scripts/ci/fetch-push-base-if-missing.sh'
      - 'scripts/ci/fast-publish-section-resolve.sh'
      - 'scripts/ci/fast-publish-section-edge-candidate.sh'
      - 'scripts/ci/fast-publish-section-preflight.sh'
      - 'scripts/ci/fast-publish-section-render.sh'
      - 'scripts/ci/fast-publish-section-recovery.sh'
      - 'scripts/cf-purge-cache.mjs'
      - 'scripts/offload-generated-images-cdn.mjs'
      - 'scripts/lib/article-render-pipeline.mjs'
      - 'scripts/lib/cf-analytics.mjs'
      - 'scripts/lib/canton-hub-data.mjs'
      - 'scripts/lib/canton-hub-content.mjs'
      - 'scripts/lib/cdn-asset-existence.mjs'
      - 'scripts/lib/cf-purge-variants.mjs'
      - 'scripts/lib/delete-cdn-file.sh'
      - 'scripts/lib/corpus-floors.mjs'
      - 'scripts/lib/corpus-sections.mjs'
      - 'scripts/lib/seo-entry.mjs'
      - 'scripts/lib/article-registry-reader.mjs'
      - 'scripts/lib/ts-literals.mjs'
      - 'generator/scripts/lib/daily-brief-content.mjs'
      - 'generator/scripts/lib/daily-brief-data.mjs'
      - 'generator/scripts/lib/daily-brief-insights.mjs'
      - 'generator/scripts/lib/localized-toponyms.mjs'
      - 'scripts/lib/engine-corpus-view.mjs'
      - 'scripts/lib/sanitize-control-chars.mjs'
      - 'scripts/lib/section-registry.mjs'
      - 'scripts/lib/assert-hub-locale-slug.mjs'
      - 'scripts/lib/section-page-manifest.mjs'
      - 'scripts/lib/upload-cdn-file.sh'
      - 'scripts/lib/r2-image-lease-process.sh'
      - 'scripts/lib/r2-image-namespace-lock.mjs'
      - 'scripts/lib/r2-section-lock.mjs'
      - 'scripts/lib/safe-lease-timestamp.mjs'
      - 'scripts/lib/is-invoked-directly.mjs'
      - 'scripts/lib/npm-ci-retry.sh'
      - 'scripts/lib/parse-positive-num.mjs'
      - 'generator/scripts/load-rc-env.mjs'
      - 'generator/scripts/lib/fetch-with-ref-timeout.mjs'
  # `sections/registry.json` and the edge API registry are published by
  # publish-api.yml. Its push-triggered run can finish after this workflow's
  # first pass; scheduled/manual runs can also change the effective API
  # surface without a new Git diff. API push completions refresh the
  # non-article surfaces of every live canton (RSS can change through API-only
  # inputs), preserve article scope from the originating diff, and merge
  # cleanup for sections no longer live.
  workflow_run:
    workflows: ['Publish article data API']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      section:
        description: 'Sezione cantonale attiva nel core (es. canton-ti)'
        required: true
        type: string
      article_ids:
        description: 'Array JSON di id articolo (vuoto = solo landing, archivio e hub)'
        required: false
        type: string
      missing_page_paths:
        description: 'Array JSON di path canonici verificati 404 dal reconciler'
        required: false
        default: '[]'
        type: string
      known_missing_page_paths:
        description: 'Array JSON di tutti i path 404 noti, anche oltre il cap del reconciler'
        required: false
        default: '[]'
        type: string
      bootstrap:
        description: 'Rendi TUTTI gli articoli della sezione (accensione di un cantone)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Rendi e valida, non caricare niente'
        required: false
        default: true
        type: boolean
      dispatch_nonce:
        description: 'Nonce opaco usato dal drain per correlare questa run'
        required: false
        default: ''
        type: string
      push_before:
        description: 'Base SHA della provenienza push esplicita (solo replay bounded)'
        required: false
        default: ''
        type: string
      push_after:
        description: 'Head SHA della provenienza push esplicita (solo replay bounded)'
        required: false
        default: ''
        type: string
      remove_stale_canton_rss_feeds:
        description: 'Rimuovi i feed RSS rimasti da una sezione demossa'
        required: false
        default: false
        type: boolean
      cleanup_inactive_surface:
        description: 'Rimuovi pagine e feed di una sezione disattivata senza renderizzarla'
        required: false
        default: false
        type: boolean
      api_release_commit:
        description: 'Commit API pubblicato dalla run originaria (solo replay bounded)'
        required: false
        default: ''
        type: string
      source_commit:
        description: 'Commit del corpus da checkoutare nel replay bounded'
        required: false
        default: ''
        type: string
      source_main_commit:
        description: 'HEAD di main osservata quando e’ stato preparato il replay bounded'
        required: false
        default: ''
        type: string
      replay_api_after_publish:
        description: 'Dopo uno staged backfill, ripubblica API sulla stessa HEAD verificata'
        required: false
        default: false
        type: boolean
      allow_deferred_live_release:
        description: 'Dopo uno staged backfill, mantieni il manifest differito senza dispatchare il replay API'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'schedule' ||
        github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    # Checkout plus runner teardown occasionally outlive the normal fast path;
    # keep a successful resolution from being cancelled by transient runner
    # overhead while still bounding a genuinely stuck resolver.
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
      dry: ${{ steps.plan.outputs.dry }}
      bootstrap: ${{ steps.plan.outputs.bootstrap }}
      replay_api_after_publish: ${{ steps.replay_mode.outputs.replay_api_after_publish }}
      allow_deferred_live_release: ${{ steps.replay_mode.outputs.allow_deferred_live_release }}
      push_before: ${{ steps.push_range.outputs.before }}
      push_after: ${{ steps.push_range.outputs.after }}
      preflight_head: ${{ steps.preflight_head.outputs.head }}
    steps:
      - name: Checkout (resolve)
        uses: actions/checkout@v7
        with:
          # Normal non-bootstrap cover-drain dispatches carry article ids, not
          # a source commit: resolve the live dispatch ref. workflow_run,
          # bounded replays, and bootstrap keep their exact source revision.
          ref: ${{ github.event.workflow_run.head_sha || inputs.source_commit || (github.event_name == 'workflow_dispatch' && inputs.bootstrap != true && github.ref) || github.sha }}
          # Il preflight dei body confronta il registro corrente con l'high-water
          # della revisione precedente. Un checkout shallow rende quella storia
          # non verificabile e blocca ogni replay prima del render.
          fetch-depth: 0
          # The resolve gate reads the source corpus and publisher code, but
          # never generated `data/`, `dist/`, or `public/`. Keep those large
          # trees out of the sparse checkout so an intermittent GitHub transfer
          # cannot consume the whole resolve budget before the gate starts.
          filter: blob:none
          sparse-checkout: |
            /*
            !/data
            !/dist
            !/public
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Checkout replay dispatcher from workflow revision
        uses: actions/checkout@v7
        with:
          # workflow_run checks out the older publish source at the workspace
          # root; github.sha points to the default-branch workflow revision.
          ref: ${{ github.sha }}
          path: .replay-dispatcher-source
          fetch-depth: 1
          sparse-checkout: |
            .github/actions/setup-article-source-runtime/action.yml
            scripts/ci/article-source-runtime/package.json
            scripts/ci/article-source-runtime/package-lock.json
            scripts/ci/check-article-source-runtime.mjs
            scripts/lib/npm-ci-retry.sh
            scripts/ci/dispatch-fast-publish-replay.sh
            scripts/ci/read-main-head.sh
            scripts/ci/fast-publish-section-resolve.sh
            scripts/ci/fast-publish-section-edge-candidate.sh
            scripts/ci/fast-publish-section-preflight.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Materialize resolver from workflow revision
        run: |
          set -euo pipefail
          resolver_source='.replay-dispatcher-source/scripts/ci/fast-publish-section-resolve.sh'
          resolver_target='scripts/ci/fast-publish-section-resolve.sh'
          main_head_source='.replay-dispatcher-source/scripts/ci/read-main-head.sh'
          main_head_target='scripts/ci/read-main-head.sh'
          edge_candidate_source='.replay-dispatcher-source/scripts/ci/fast-publish-section-edge-candidate.sh'
          edge_candidate_target='scripts/ci/fast-publish-section-edge-candidate.sh'
          preflight_source='.replay-dispatcher-source/scripts/ci/fast-publish-section-preflight.sh'
          preflight_target='scripts/ci/fast-publish-section-preflight.sh'
          if [ ! -f "$resolver_source" ]; then
            echo "::error::resolver non presente nel checkout della revisione del workflow"
            exit 1
          fi
          if [ ! -f "$main_head_source" ]; then
            echo "::error::helper della punta di main non presente nel checkout della revisione del workflow"
            exit 1
          fi
          if [ ! -f "$edge_candidate_source" ]; then
            echo "::error::helper della release edge non presente nel checkout della revisione del workflow"
            exit 1
          fi
          if [ ! -f "$preflight_source" ]; then
            echo "::error::helper di preflight non presente nel checkout della revisione del workflow"
            exit 1
          fi
          # workflow_run puo' aver effettuato il checkout del corpus a una
          # revisione precedente all'estrazione del resolver. Il codice del
          # resolver deve pero' sempre provenire dalla revisione che contiene
          # il workflow; le sorgenti e i dati restano quelli del run pinnato.
          install -m 0755 "$resolver_source" "$resolver_target"
          if [ -f "$main_head_source" ]; then
            install -m 0755 "$main_head_source" "$main_head_target"
          elif [ -f "$main_head_target" ]; then
            chmod 0755 "$main_head_target"
            echo "::warning::helper della punta di main assente nella revisione del dispatcher; uso quello del checkout pinned"
          else
            echo "::warning::helper della punta di main assente nelle revisioni disponibili; genero il fallback git-transport"
            cat > "$main_head_target" <<'EOF'
            #!/usr/bin/env bash
            set -euo pipefail
            remote="${1:-origin}"
            ref="${2:-refs/heads/main}"
            if [ "$#" -gt 2 ]; then
              echo "usage: $0 [remote] [ref]" >&2
              exit 2
            fi
            main_head=''
            for attempt in 1 2 3; do
              main_head=''
              ls_remote_out=''
              if ls_remote_out="$(timeout 60 git ls-remote --refs "$remote" "$ref" 2>/dev/null)"; then
                main_head="$(printf '%s\n' "$ls_remote_out" | awk -v wanted="$ref" '$2 == wanted { print $1; exit }')"
              fi
              if [[ "$main_head" =~ ^[a-f0-9]{40}$ ]]; then
                printf '%s\n' "$main_head"
                exit 0
              fi
              [ "$attempt" -lt 3 ] && sleep "$((attempt * 5))"
            done
            echo "::error::punta di $ref non risolvibile via git ls-remote" >&2
            exit 1
          EOF
            chmod 0755 "$main_head_target"
          fi
          install -m 0755 "$edge_candidate_source" "$edge_candidate_target"
          install -m 0755 "$preflight_source" "$preflight_target"

      - name: Set up Node (resolve)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Resolve originating push range
        id: push_range
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          DISPATCH_PUSH_BEFORE: ${{ inputs.push_before }}
          DISPATCH_PUSH_AFTER: ${{ inputs.push_after }}
          SOURCE_COMMIT_INPUT: ${{ inputs.source_commit }}
          SOURCE_MAIN_COMMIT_INPUT: ${{ inputs.source_main_commit }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          before="${PUSH_BEFORE:-}"
          after="${PUSH_AFTER:-}"
          if [ "$EVENT_NAME" = 'workflow_run' ]; then
            if [ -z "${WORKFLOW_RUN_HEAD_SHA:-}" ] || ! [[ "$WORKFLOW_RUN_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]; then
              echo "::error::workflow_run head SHA non valido"
              exit 1
            fi
            if [ "$WORKFLOW_RUN_EVENT" = 'push' ]; then
              range_output="$(
                REPO="$REPO" \
                WORKFLOW_RUN_HEAD_SHA="$WORKFLOW_RUN_HEAD_SHA" \
                WORKFLOW_RUN_ID="$WORKFLOW_RUN_ID" \
                  node scripts/ci/resolve-workflow-run-push-range.mjs
              )"
              before=''
              after=''
              range_source=''
              while IFS='=' read -r key value; do
                case "$key" in
                  before) before="$value" ;;
                  after) after="$value" ;;
                  source) range_source="$value" ;;
                esac
              done <<< "$range_output"
              if [ "$after" != "$WORKFLOW_RUN_HEAD_SHA" ]; then
                echo "::error::resolver della push ha restituito una HEAD inattesa: $after"
                exit 1
              fi
              echo "::notice::range push originaria risolta via $range_source: $before -> $after"
            elif [ "$WORKFLOW_RUN_EVENT" != 'schedule' ] && [ "$WORKFLOW_RUN_EVENT" != 'workflow_dispatch' ]; then
              echo "::error::workflow_run event non supportato: $WORKFLOW_RUN_EVENT"
              exit 1
            fi
          elif [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            if [ -n "${SOURCE_COMMIT_INPUT:-}" ] && ! [[ "$SOURCE_COMMIT_INPUT" =~ ^[a-f0-9]{40}$ ]]; then
              echo "::error::source_commit richiede una SHA completa"
              exit 1
            fi
            if [ -n "${SOURCE_COMMIT_INPUT:-}" ]; then
              if [ -z "${SOURCE_MAIN_COMMIT_INPUT:-}" ] || ! [[ "$SOURCE_MAIN_COMMIT_INPUT" =~ ^[a-f0-9]{40}$ ]]; then
                echo "::error::source_main_commit e' obbligatorio e richiede una SHA completa quando source_commit e' valorizzato"
                exit 1
              fi
              if [ "$SOURCE_COMMIT_INPUT" != "$SOURCE_MAIN_COMMIT_INPUT" ]; then
                echo "::error::source_commit deve coincidere con source_main_commit nel replay bounded"
                exit 1
              fi
              if [ "$(git rev-parse HEAD)" != "$SOURCE_COMMIT_INPUT" ]; then
                echo "::error::checkout non coincide con source_commit"
                exit 1
              fi
            fi
            dispatch_before="${DISPATCH_PUSH_BEFORE:-}"
            dispatch_after="${DISPATCH_PUSH_AFTER:-}"
            if [ -n "$dispatch_before" ] || [ -n "$dispatch_after" ]; then
              if [ -z "$dispatch_before" ] || [ -z "$dispatch_after" ] \
                || ! [[ "$dispatch_before" =~ ^[a-f0-9]{40}$ ]] \
                || ! [[ "$dispatch_after" =~ ^[a-f0-9]{40}$ ]]; then
                echo "::error::push_before/push_after richiedono una provenienza completa di SHA"
                exit 1
              fi
              before="$dispatch_before"
              after="$dispatch_after"
            fi
          fi
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"

      - name: Fetch push base (resolve)
        env:
          PUSH_BEFORE: ${{ steps.push_range.outputs.before }}
        run: |
          bash scripts/ci/fetch-push-base-if-missing.sh

      # Solo builtin Node (fast-publish-section.mjs): decide prima se c'e' un
      # target, cosi' un resolve vuoto non installa il parser né avvia il gate.
      - name: Resolve sections and article ids
        id: plan
        env:
          SECTION_INPUT: ${{ inputs.section }}
          ARTICLE_IDS_INPUT: ${{ inputs.article_ids }}
          MISSING_PAGE_PATHS_INPUT: ${{ inputs.missing_page_paths }}
          KNOWN_MISSING_PAGE_PATHS_INPUT: ${{ inputs.known_missing_page_paths }}
          BOOTSTRAP_INPUT: ${{ inputs.bootstrap }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          REMOVE_STALE_INPUT: ${{ inputs.remove_stale_canton_rss_feeds }}
          CLEANUP_INACTIVE_SURFACE_INPUT: ${{ inputs.cleanup_inactive_surface }}
          REPLAY_API_INPUT: ${{ inputs.replay_api_after_publish }}
          ALLOW_DEFERRED_LIVE_RELEASE_INPUT: ${{ inputs.allow_deferred_live_release }}
          EVENT_NAME: ${{ github.event_name }}
          COVER_DRAIN_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          WORKFLOW_RUN_COVER_DRAIN_COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          PUSH_BEFORE: ${{ steps.push_range.outputs.before }}
          PUSH_AFTER: ${{ steps.push_range.outputs.after }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_COMMIT_INPUT: ${{ inputs.source_commit }}
          SOURCE_MAIN_COMMIT_INPUT: ${{ inputs.source_main_commit }}
          DISPATCH_NONCE_INPUT: ${{ inputs.dispatch_nonce }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FAST_PUBLISH_ARMED: ${{ vars.FAST_PUBLISH_ARMED }}
        run: |
          bash scripts/ci/fast-publish-section-resolve.sh

      # Tieni l'arming del replay fuori dal run monolitico di resolve: GitHub
      # rifiuta workflow con espressioni oltre 21.000 caratteri. I valori
      # calcolati da plan restano la base per dispatch, bootstrap e replay.
      - name: Arm normal push staged replay
        id: replay_mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          ANY: ${{ steps.plan.outputs.any }}
          DRY: ${{ steps.plan.outputs.dry }}
          PLAN_REPLAY_API_AFTER_PUBLISH: ${{ steps.plan.outputs.replay_api_after_publish }}
          PLAN_ALLOW_DEFERRED_LIVE_RELEASE: ${{ steps.plan.outputs.allow_deferred_live_release }}
        run: |
          set -euo pipefail
          replay_api_after_publish="${PLAN_REPLAY_API_AFTER_PUBLISH:-false}"
          allow_deferred_live_release="${PLAN_ALLOW_DEFERRED_LIVE_RELEASE:-false}"
          # Un push puo' vincere la gara con publish-api prima che le pagine
          # siano su R2. Il render staged resta fail-closed sugli errori reali,
          # ma se la matrice ha completato con successo il replay API e' parte
          # obbligatoria del percorso normale, non un'opzione riservata al
          # bootstrap. Cosi' il timeout bounded dell'API non lascia uno staged
          # parziale senza redispatch.
          if [ "$EVENT_NAME" = 'push' ] && [ "$ANY" = 'true' ] && [ "$DRY" != 'true' ]; then
            replay_api_after_publish=true
            allow_deferred_live_release=true
          fi
          echo "replay_api_after_publish=$replay_api_after_publish" >> "$GITHUB_OUTPUT"
          echo "allow_deferred_live_release=$allow_deferred_live_release" >> "$GITHUB_OUTPUT"

      - name: Setup isolated article source runtime
        if: steps.plan.outputs.any == 'true'
        uses: ./.replay-dispatcher-source/.github/actions/setup-article-source-runtime

      - name: Install isolated blog-body syntax parser (esbuild)
        if: steps.plan.outputs.any == 'true'
        run: |
          set -euo pipefail
          preflight_dir="$RUNNER_TEMP/preflight"
          # publish-api.yml is the single source for the parser pin used by
          # this gate; a fast publisher must not drift to another esbuild.
          ESBUILD_PIN="$(sed -n 's/^[[:space:]]*ESBUILD_PIN:[[:space:]]*//p' .github/workflows/publish-api.yml | head -n 1)"
          if [[ ! "$ESBUILD_PIN" =~ ^esbuild@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::publish-api.yml does not expose a valid ESBUILD_PIN"
            exit 1
          fi
          mkdir -p "$preflight_dir"
          printf '{"name":"preflight-parser","private":true}\n' > "$preflight_dir/package.json"
          (
            cd "$preflight_dir"
            bash "$GITHUB_WORKSPACE/scripts/ci/retry-cmd.sh" \
              npm install --no-save --no-audit --no-fund --prefer-offline --loglevel=error "$ESBUILD_PIN"
          )
          test -f "$preflight_dir/node_modules/esbuild/lib/main.js"

      - name: Preflight — i link Markdown devono avere una destinazione canonica
        if: steps.plan.outputs.any == 'true'
        env:
          BEFORE: ${{ steps.push_range.outputs.before }}
          AFTER: ${{ steps.push_range.outputs.after }}
          EVENT_NAME: ${{ github.event_name }}
          PREFLIGHT_EVENT_NAME: ${{ github.event_name }}
          PREFLIGHT_PUSH_BASE_REVISION: ${{ steps.push_range.outputs.before }}
          ARTICLE_IDS_INPUT: ${{ inputs.article_ids }}
          SECTION_INPUT: ${{ inputs.section }}
        run: bash scripts/ci/fast-publish-section-preflight.sh

      - name: Record preflight revision
        id: preflight_head
        if: steps.plan.outputs.any == 'true'
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve
    if: needs.resolve.outputs.any == 'true'
    runs-on: ubuntu-latest
    # Il job conserva il budget esteso per i retry del render; il gate bootstrap
    # del publisher API ha invece una finestra bounded breve e lascia il recupero
    # al replay gia' previsto quando il fast-publish e' ancora in coda.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    concurrency:
      group: fast-publish-${{ matrix.target.section }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Keep normal non-bootstrap cover-drain dispatches on the live ref;
          # workflow_run, bounded replay, and bootstrap may pin an older
          # source commit.
          ref: ${{ github.event.workflow_run.head_sha || inputs.source_commit || (github.event_name == 'workflow_dispatch' && inputs.bootstrap != true && github.ref) || github.sha }}
          # resolvePublishedReleaseCommit() verifica la release API con
          # merge-base: una release precedente puo' essere fuori dai due
          # commit che actions/checkout scarica di default.
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout replay dispatcher from workflow revision
        uses: actions/checkout@v7
        with:
          # workflow_run checks out the older publish source at the workspace
          # root; github.sha points to the default-branch workflow revision.
          ref: ${{ github.sha }}
          path: .replay-dispatcher-source
          fetch-depth: 1
          sparse-checkout: |
            .github/actions/setup-article-source-runtime/action.yml
            scripts/ci/article-source-runtime/package.json
            scripts/ci/article-source-runtime/package-lock.json
            scripts/ci/check-article-source-runtime.mjs
            scripts/lib/npm-ci-retry.sh
            scripts/ci/dispatch-fast-publish-replay.sh
            scripts/ci/read-main-head.sh
            scripts/ci/fast-publish-section-render.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Materialize freshness helper from workflow revision
        run: |
          set -euo pipefail
          source='.replay-dispatcher-source/scripts/ci/read-main-head.sh'
          target='scripts/ci/read-main-head.sh'
          render_source='.replay-dispatcher-source/scripts/ci/fast-publish-section-render.sh'
          render_target='scripts/ci/fast-publish-section-render.sh'
          if [ ! -f "$render_source" ]; then
            echo "::error::helper di render non presente nel checkout della revisione del workflow"
            exit 1
          fi
          install -m 0755 "$render_source" "$render_target"
          if [ -f "$source" ]; then
            install -m 0755 "$source" "$target"
          elif [ -f "$target" ]; then
            chmod 0755 "$target"
            echo "::warning::helper della punta di main assente nella revisione del dispatcher; uso quello del checkout pinned"
          else
            echo "::warning::helper della punta di main assente nelle revisioni disponibili; genero il fallback git-transport"
            cat > "$target" <<'EOF'
            #!/usr/bin/env bash
            set -euo pipefail
            remote="${1:-origin}"
            ref="${2:-refs/heads/main}"
            if [ "$#" -gt 2 ]; then
              echo "usage: $0 [remote] [ref]" >&2
              exit 2
            fi
            main_head=''
            for attempt in 1 2 3; do
              main_head=''
              ls_remote_out=''
              if ls_remote_out="$(timeout 60 git ls-remote --refs "$remote" "$ref" 2>/dev/null)"; then
                main_head="$(printf '%s\n' "$ls_remote_out" | awk -v wanted="$ref" '$2 == wanted { print $1; exit }')"
              fi
              if [[ "$main_head" =~ ^[a-f0-9]{40}$ ]]; then
                printf '%s\n' "$main_head"
                exit 0
              fi
              [ "$attempt" -lt 3 ] && sleep "$((attempt * 5))"
            done
            echo "::error::punta di $ref non risolvibile via git ls-remote" >&2
            exit 1
          EOF
            chmod 0755 "$target"
          fi

      - name: Guard pinned replay freshness
        id: replay_freshness
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PINNED_SOURCE_COMMIT: ${{ inputs.source_commit }}
          PINNED_SOURCE_MAIN: ${{ inputs.source_main_commit }}
        run: |
          set -euo pipefail
          pinned_source=''
          if [ "$EVENT_NAME" = 'workflow_run' ]; then
            pinned_source="${WORKFLOW_RUN_HEAD_SHA:-}"
          elif [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ -n "${PINNED_SOURCE_COMMIT:-}" ]; then
            pinned_source="${PINNED_SOURCE_MAIN:-$PINNED_SOURCE_COMMIT}"
          else
            echo 'fresh=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$pinned_source" ] || ! [[ "$pinned_source" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::revisione pinned non valida per il guard di freschezza"
            exit 1
          fi
          if ! current_main="$(bash scripts/ci/read-main-head.sh)"; then
            echo "::error::impossibile verificare la revisione corrente di main prima del replay"
            exit 1
          fi
          if ! [[ "$current_main" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::revisione corrente di main non valida"
            exit 1
          fi
          echo "current_main=$current_main" >> "$GITHUB_OUTPUT"
          if [ "$current_main" != "$pinned_source" ]; then
            echo "::notice::replay pinned saltato: main e' avanzata da $pinned_source a $current_main"
            echo 'fresh=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'fresh=true' >> "$GITHUB_OUTPUT"

      # Un replay stantio usa il workflow corrente su main e la sua HEAD come
      # sorgente del corpus. Per una run API osservata conserva P come release
      # solo se P copre tutti gli input raggiungibili dalla HEAD corrente;
      # un bounded dispatch riparte senza il vecchio override e lascia che il
      # publisher ricalcoli una release compatibile. In entrambi i casi, se la
      # release corrente non e' pronta il replay resta in attesa invece di
      # creare una superficie mista.
      - name: Prepare Firebase credentials for stale replay recovery
        if: steps.replay_freshness.outputs.fresh == 'false'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not set — Remote Config is the only source of the dispatch token"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/stale-replay-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/stale-replay-sa.json" >> "$GITHUB_ENV"

      - name: Load dispatch token for stale replay recovery
        if: steps.replay_freshness.outputs.fresh == 'false'
        run: node generator/scripts/load-rc-env.mjs

      - name: Dispatch bounded replay with current corpus checkout
        if: steps.replay_freshness.outputs.fresh == 'false'
        env:
          REPO: ${{ github.repository }}
          SECTION: ${{ matrix.target.section }}
          ARTICLE_IDS_JSON: ${{ toJSON(matrix.target.ids) }}
          MISSING_PAGE_PATHS_JSON: ${{ toJSON(matrix.target.missingPagePaths || fromJSON('[]')) }}
          KNOWN_MISSING_PAGE_PATHS_JSON: ${{ toJSON(matrix.target.knownMissingPagePaths || fromJSON('[]')) }}
          BOOTSTRAP: ${{ matrix.target.bootstrap }}
          REMOVE_STALE_CANTON_RSS_FEEDS: ${{ matrix.target.removeStaleCantonRssFeeds || false }}
          CLEANUP_INACTIVE_SURFACE: ${{ matrix.target.cleanupInactiveSurface || false }}
          ALLOW_DEFERRED_LIVE_RELEASE: ${{ needs.resolve.outputs.allow_deferred_live_release }}
          DRY: ${{ needs.resolve.outputs.dry }}
          REPLAY_API_AFTER_PUBLISH: ${{ inputs.replay_api_after_publish }}
          STALE_HEAD: ${{ github.event.workflow_run.head_sha }}
          CURRENT_MAIN: ${{ steps.replay_freshness.outputs.current_main }}
          ORIGINAL_PUSH_BEFORE: ${{ needs.resolve.outputs.push_before }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
        run: |
          set -euo pipefail
          runtime_pat="${GITHUB_PAT_NANAKO:-}"
          if [ -z "$runtime_pat" ]; then
            echo "::error::GITHUB_PAT_NANAKO assente: impossibile redispatchare il replay stantio"
            exit 1
          fi
          export GH_TOKEN="$runtime_pat"
          dispatch_nonce="${DISPATCH_NONCE:-}"
          if [ -z "$dispatch_nonce" ]; then
            dispatch_nonce="stale-publish-${GITHUB_RUN_ID}-${SECTION}"
          fi
          dispatch_title="cover-publish-section / ${SECTION} / nonce=${dispatch_nonce}"
          replay_before="${ORIGINAL_PUSH_BEFORE:-$STALE_HEAD}"
          replay_after=''
          if [ -n "$replay_before" ]; then
            # The redispatch checks out CURRENT_MAIN; an old push_after would
            # make release resolution inspect the stale replay range.
            replay_after="$CURRENT_MAIN"
          fi
          api_release_commit=''
          if [ -n "${STALE_HEAD:-}" ]; then
            if ! [[ "$STALE_HEAD" =~ ^[a-f0-9]{40}$ ]]; then
              echo "::error::head API stantia non valida per il recovery workflow_run"
              exit 1
            fi
            if [ "$(git rev-parse --is-shallow-repository)" = 'true' ]; then
              git fetch --no-tags --unshallow origin main
            else
              git fetch --no-tags origin main
            fi
            api_release_commit="$(
              CURRENT_MAIN="$CURRENT_MAIN" STALE_API_RELEASE="$STALE_HEAD" node --input-type=module -e '
                import { resolveStaleReplayApiReleaseCommit } from "./scripts/publish-section-pages.mjs";
                process.stdout.write(resolveStaleReplayApiReleaseCommit(
                  process.env.CURRENT_MAIN,
                  process.env.STALE_API_RELEASE,
                ));
              '
            )"
            if [ "$api_release_commit" = "$CURRENT_MAIN" ]; then
              echo "::notice::release API stantia non copre la HEAD corrente; il replay ricalcolera' la release senza override"
              api_release_commit=''
            else
              echo "::notice::replay stantio: release API attesa $api_release_commit"
            fi
          else
            # Un bounded dispatch deve ripartire senza la release osservata:
            # il publisher ricalcola quella compatibile con la HEAD corrente.
            echo "::notice::replay bounded stantio: ricalcolo la release API sulla HEAD $CURRENT_MAIN"
          fi
          bash .replay-dispatcher-source/scripts/ci/dispatch-fast-publish-replay.sh "$REPO" "$dispatch_title" --ref main \
            -f section="$SECTION" \
            -f article_ids="$ARTICLE_IDS_JSON" \
            -f missing_page_paths="$MISSING_PAGE_PATHS_JSON" \
            -f known_missing_page_paths="$KNOWN_MISSING_PAGE_PATHS_JSON" \
            -f bootstrap="$BOOTSTRAP" \
            -f remove_stale_canton_rss_feeds="$REMOVE_STALE_CANTON_RSS_FEEDS" \
            -f cleanup_inactive_surface="$CLEANUP_INACTIVE_SURFACE" \
            -f replay_api_after_publish="$REPLAY_API_AFTER_PUBLISH" \
            -f allow_deferred_live_release="$ALLOW_DEFERRED_LIVE_RELEASE" \
            -f api_release_commit="$api_release_commit" \
            -f source_commit="$CURRENT_MAIN" \
            -f source_main_commit="$CURRENT_MAIN" \
            -f dry_run="$DRY" \
            -f push_before="$replay_before" \
            -f push_after="$replay_after" \
            -f dispatch_nonce="$dispatch_nonce"

      - name: Fetch fallback corpus revision for manifest migration
        if: steps.replay_freshness.outputs.fresh == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ needs.resolve.outputs.push_before }}
          PUSH_AFTER: ${{ needs.resolve.outputs.push_after }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_run' ]; then
            if [ -z "${WORKFLOW_RUN_HEAD_SHA:-}" ] || [ "$(git rev-parse HEAD)" != "$WORKFLOW_RUN_HEAD_SHA" ]; then
              echo "::error::workflow_run head non coincide con il checkout"
              exit 1
            fi
          fi
          bash scripts/ci/fetch-push-base-if-missing.sh

      - name: Set up Node
        if: steps.replay_freshness.outputs.fresh == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup isolated article source runtime
        if: steps.replay_freshness.outputs.fresh == 'true'
        uses: ./.replay-dispatcher-source/.github/actions/setup-article-source-runtime

      - name: Install dependencies
        if: steps.replay_freshness.outputs.fresh == 'true'
        run: |
          set -euo pipefail
          bash scripts/lib/npm-ci-retry.sh
          lock_hash="$(sha256sum package.json package-lock.json | sha256sum | cut -d' ' -f1)"
          echo "INSTALLED_DEPENDENCY_LOCK_HASH=$lock_hash" >> "$GITHUB_ENV"

      # Remote Config e' la sola sorgente delle credenziali R2 e Cloudflare.
      # In dry non servono: il render e la validazione girano comunque.
      - name: Prepare Firebase credentials
        if: steps.replay_freshness.outputs.fresh == 'true' && needs.resolve.outputs.dry != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not set — Remote Config is the only source of the R2 and Cloudflare credentials"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config
        if: steps.replay_freshness.outputs.fresh == 'true' && needs.resolve.outputs.dry != 'true'
        run: node generator/scripts/load-rc-env.mjs

      # Un upload che «salta» per credenziali assenti esce 0 da
      # upload-cdn-file.sh: qui l'assenza deve fermare il job PRIMA del render,
      # non diventare una pubblicazione verde che non ha caricato niente.
      - name: Require the R2 and Cloudflare credentials
        if: steps.replay_freshness.outputs.fresh == 'true' && needs.resolve.outputs.dry != 'true'
        run: |
          set -euo pipefail
          missing=()
          for v in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_S3_ENDPOINT R2_BUCKET CF_API_TOKEN; do
            [ -n "${!v:-}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::missing after the Remote Config load: ${missing[*]}"
            exit 1
          fi

      # Le pagine rese qui prendono la shell da `host/`. Il riferimento a
      # `/assets/gtag-init-<hash>.js` ha il nome derivato dal contenuto: cambia
      # ogni volta che il sito cambia quei byte, e l'oggetto arriva sulla CDN
      # solo con un deploy completo del sito, ore dopo che il contratto puo'
      # arrivare qui. Il 2026-10-07 gli emettitori veloci del sito hanno
      # pubblicato quel riferimento prima del file: 404 su ogni articolo
      # rirenderizzato per 2 h 40 min (sito issue 12270). Questo passo carica
      # il file se la CDN non lo ha, non sostituisce mai un oggetto e ferma il
      # job se non riesce a stabilirlo: scripts/ci/ensure-host-shell-assets.mjs.
      - name: Ensure the host shell assets are on the CDN
        if: steps.replay_freshness.outputs.fresh == 'true' && needs.resolve.outputs.dry != 'true'
        run: bash scripts/ci/retry-cmd.sh npx -y tsx@4.23.15 scripts/ci/ensure-host-shell-assets.mjs

      # Un bootstrap di una sezione gia' live carica HTML mentre il publisher
      # API prepara la stessa release. Il gate R2 viene acquisito PRIMA del
      # render e rilasciato anche su errore: publish-section-edge aspetta il
      # suo sblocco prima di fare il PUT del registro. Se publish-api ha vinto
      # la gara di avvio, il bootstrap attende il lease edge-publisher e
      # riprende dopo il suo rilascio; il replay API successivo riallinea il
      # registry alla nuova superficie HTML.
      - name: Acquire bootstrap R2 gate
        id: acquire_bootstrap
        if: steps.replay_freshness.outputs.fresh == 'true' && needs.resolve.outputs.dry != 'true' && matrix.target.bootstrap == true
        env:
          SECTION: ${{ matrix.target.section }}
          LOCK_WAIT_MS: 3300000
          LOCK_RETRY_MS: 20000
        run: node scripts/ci/section-bootstrap-lock.mjs acquire --section "$SECTION" --commit "$(git rev-parse HEAD)" --wait-ms "$LOCK_WAIT_MS" --retry-ms "$LOCK_RETRY_MS"

      - name: Render, validate and publish the section pages
        id: render
        if: steps.replay_freshness.outputs.fresh == 'true'
        env:
          SECTION: ${{ matrix.target.section }}
          ARTICLE_IDS_JSON: ${{ toJSON(matrix.target.ids) }}
          MISSING_PAGE_PATHS_JSON: ${{ toJSON(matrix.target.missingPagePaths || fromJSON('[]')) }}
          KNOWN_MISSING_PAGE_PATHS_JSON: ${{ toJSON(matrix.target.knownMissingPagePaths || fromJSON('[]')) }}
          BOOTSTRAP: ${{ matrix.target.bootstrap }}
          TARGET_BOOTSTRAP: ${{ matrix.target.bootstrap }}
          FAST_PUBLISH_ARMED: ${{ vars.FAST_PUBLISH_ARMED }}
          DRY: ${{ needs.resolve.outputs.dry }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ needs.resolve.outputs.push_before }}
          PUSH_AFTER: ${{ needs.resolve.outputs.push_after }}
          PREFLIGHT_HEAD: ${{ needs.resolve.outputs.preflight_head }}
          REMOVE_STALE_CANTON_RSS_FEEDS: ${{ matrix.target.removeStaleCantonRssFeeds || false }}
          CLEANUP_INACTIVE_SURFACE: ${{ matrix.target.cleanupInactiveSurface || false }}
          API_RELEASE_COMMIT: ${{ inputs.api_release_commit }}
          ALLOW_DEFERRED_LIVE_RELEASE: ${{ needs.resolve.outputs.allow_deferred_live_release }}
          REPLAY_API_AFTER_PUBLISH: ${{ needs.resolve.outputs.replay_api_after_publish }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_MAIN_COMMIT: ${{ inputs.source_main_commit }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          REF: ${{ github.ref }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_MAIN_HEAD: ${{ github.event.workflow_run.head_sha || inputs.source_main_commit || github.event.after || github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/ci/fast-publish-section-render.sh

      - name: Release bootstrap R2 gate
        # GITHUB_ENV aggiorna l'ambiente dei passi successivi, ma non è una
        # base affidabile per la valutazione dell'espressione `if` del passo.
        # L'outcome dell'acquire è il fatto durevole: se ha acquisito il lease,
        # il release deve partire anche quando il render fallisce.
        if: always() && steps.replay_freshness.outputs.fresh == 'true' && needs.resolve.outputs.dry != 'true' && ((matrix.target.bootstrap == true && steps.acquire_bootstrap.outcome == 'success') || steps.render.outputs.dynamic_bootstrap_lock == 'true')
        env:
          SECTION: ${{ matrix.target.section }}
        run: node scripts/ci/section-bootstrap-lock.mjs release --section "$SECTION"

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          s="$RUNNER_TEMP/section-summary.json"
          [ -s "$s" ] || { echo "nessun summary: il render non e' arrivato in fondo"; exit 0; }
          jq -r '"sezione \(.section) (\(.declaredStatus // "?")): pagine \(.counts | tostring), hub mancanti \(.hubsMissing | tostring), difetti \(.defects | length), pubblicato \(.published | tostring)"' "$s"

      - name: Record publish result
        if: always()
        env:
          SECTION: ${{ matrix.target.section }}
          RENDERED_HEAD: ${{ steps.render.outputs.rendered_head }}
          FRESH: ${{ steps.replay_freshness.outputs.fresh }}
        run: |
          set -euo pipefail
          jq -cn \
            --arg section "$SECTION" \
            --arg rendered_head "${RENDERED_HEAD:-}" \
            --arg fresh "${FRESH:-}" \
            '{section: $section, rendered_head: $rendered_head, fresh: $fresh}' \
            > "$RUNNER_TEMP/fast-publish-result.json"

      - name: Upload publish result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fast-publish-result-${{ matrix.target.section }}
          path: ${{ runner.temp }}/fast-publish-result.json
          if-no-files-found: error

  # Matrix job outputs are scalar: GitHub keeps the value from whichever leg
  # finishes last. Compare every leg's recorded productive HEAD before any
  # API replay, so a release can never announce a mixed R2 surface.
  publish_release_head:
    needs: [resolve, publish]
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      needs.publish.result == 'success' &&
      needs.resolve.outputs.dry != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rendered_head: ${{ steps.collect.outputs.rendered_head }}
      mixed_matrix: ${{ steps.collect.outputs.mixed_matrix }}
    steps:
      - name: Download matrix publish results
        uses: actions/download-artifact@v7
        with:
          pattern: fast-publish-result-*
          path: ${{ runner.temp }}/fast-publish-results
          merge-multiple: false

      - name: Verify one productive HEAD for the whole matrix
        id: collect
        env:
          EXPECTED_MATRIX: ${{ needs.resolve.outputs.matrix }}
        run: |
          set -euo pipefail
          echo 'mixed_matrix=false' >> "$GITHUB_OUTPUT"
          results_dir="$RUNNER_TEMP/fast-publish-results"
          mapfile -t result_files < <(find "$results_dir" -type f -name fast-publish-result.json -print)
          if [ "${#result_files[@]}" -eq 0 ]; then
            echo "::error::nessun risultato della matrix publish disponibile per il replay API"
            exit 1
          fi
          actual="$(jq -s -c 'map({section, rendered_head, fresh})' "${result_files[@]}")"
          expected_sections="$(jq -c '[.[].section] | sort' <<<"$EXPECTED_MATRIX")"
          actual_sections="$(jq -c 'map(.section) | sort' <<<"$actual")"
          if [ "$actual_sections" != "$expected_sections" ]; then
            echo "::error::risultati publish incompleti o duplicati: attesi $expected_sections, ricevuti $actual_sections"
            exit 1
          fi
          if jq -e 'all(.[]; (.rendered_head == "" and .fresh == "false"))' <<<"$actual" >/dev/null; then
            echo "::notice::tutte le leg hanno rilevato un replay stantio; il recovery redispatchato proseguira' sulla HEAD corrente"
            exit 0
          fi
          if jq -e 'any(.[]; ((.rendered_head // "") | test("^[a-f0-9]{40}$"))) and any(.[]; ((.fresh // "") != "true" or (.rendered_head // "") == ""))' <<<"$actual" >/dev/null; then
            echo "::warning::matrix mista: almeno una leg non e' fresca mentre un'altra ha prodotto una HEAD; accodo il recovery sulla HEAD corrente"
            echo 'mixed_matrix=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! jq -e 'all(.[]; ((.rendered_head // "") | test("^[a-f0-9]{40}$")))' <<<"$actual" >/dev/null; then
            echo "::error::almeno una leg della matrix non ha prodotto una HEAD pubblicabile"
            exit 1
          fi
          rendered_head="$(jq -r 'map(.rendered_head) | unique | if length == 1 then .[0] else empty end' <<<"$actual")"
          if [ -z "$rendered_head" ]; then
            echo "::warning::la matrix publish ha prodotto HEAD diverse; accodo il recovery sulla HEAD corrente: $actual"
            echo 'mixed_matrix=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "rendered_head=$rendered_head" >> "$GITHUB_OUTPUT"

  # A push can start the API publisher before the section runner has uploaded
  # its HTML. After a successful staged section publish, every non-dry push
  # arms the API replay so an earlier fail-closed readiness check cannot strand
  # the registry on the previous release. API-triggered replays are excluded
  # to prevent a workflow_run loop; genuine render errors still block replay,
  # while mixed matrix HEADs are handed to the bounded recovery dispatch below.
  replay-api-after-staged-release:
    needs: [resolve, publish, publish_release_head]
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      needs.publish.result == 'success' &&
      needs.publish_release_head.result == 'success' &&
      (needs.publish_release_head.outputs.rendered_head != '' ||
       needs.publish_release_head.outputs.mixed_matrix == 'true') &&
      (needs.publish_release_head.outputs.mixed_matrix == 'true' ||
       needs.resolve.outputs.bootstrap == 'true' || needs.resolve.outputs.replay_api_after_publish == 'true') &&
      needs.resolve.outputs.dry != 'true' &&
      github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Il replay deve usare esattamente la revisione dalla quale il
          # publisher ha renderizzato e caricato le pagine. `main` puo' essere
          # avanzata durante il render; il guard sotto in quel caso lascia il
          # lavoro al run generato dal nuovo push.
          ref: ${{ needs.publish_release_head.outputs.rendered_head || inputs.source_commit || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout replay dispatcher from workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .replay-dispatcher-source
          fetch-depth: 1
          sparse-checkout: |
            scripts/ci/dispatch-fast-publish-replay.sh
            scripts/ci/read-main-head.sh
            scripts/ci/fast-publish-section-recovery.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Materialize freshness helper from workflow revision
        run: |
          set -euo pipefail
          source='.replay-dispatcher-source/scripts/ci/read-main-head.sh'
          target='scripts/ci/read-main-head.sh'
          recovery_source='.replay-dispatcher-source/scripts/ci/fast-publish-section-recovery.sh'
          recovery_target='scripts/ci/fast-publish-section-recovery.sh'
          if [ ! -f "$recovery_source" ]; then
            echo "::error::helper di recovery non presente nel checkout della revisione del workflow"
            exit 1
          fi
          install -m 0755 "$recovery_source" "$recovery_target"
          if [ -f "$source" ]; then
            install -m 0755 "$source" "$target"
          elif [ -f "$target" ]; then
            chmod 0755 "$target"
            echo "::warning::helper della punta di main assente nella revisione del dispatcher; uso quello del checkout pinned"
          else
            echo "::warning::helper della punta di main assente nelle revisioni disponibili; genero il fallback git-transport"
            cat > "$target" <<'EOF'
            #!/usr/bin/env bash
            set -euo pipefail
            remote="${1:-origin}"
            ref="${2:-refs/heads/main}"
            if [ "$#" -gt 2 ]; then
              echo "usage: $0 [remote] [ref]" >&2
              exit 2
            fi
            main_head=''
            for attempt in 1 2 3; do
              main_head=''
              ls_remote_out=''
              if ls_remote_out="$(timeout 60 git ls-remote --refs "$remote" "$ref" 2>/dev/null)"; then
                main_head="$(printf '%s\n' "$ls_remote_out" | awk -v wanted="$ref" '$2 == wanted { print $1; exit }')"
              fi
              if [[ "$main_head" =~ ^[a-f0-9]{40}$ ]]; then
                printf '%s\n' "$main_head"
                exit 0
              fi
              [ "$attempt" -lt 3 ] && sleep "$((attempt * 5))"
            done
            echo "::error::punta di $ref non risolvibile via git ls-remote" >&2
            exit 1
          EOF
            chmod 0755 "$target"
          fi

      - name: Verify staged release revision is still main
        id: replay_freshness
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ needs.publish_release_head.outputs.rendered_head || inputs.source_commit || github.sha }}
          MIXED_MATRIX: ${{ needs.publish_release_head.outputs.mixed_matrix }}
        run: |
          set -euo pipefail
          if [ "${MIXED_MATRIX:-}" = 'true' ]; then
            if ! current_main="$(bash scripts/ci/read-main-head.sh)"; then
              echo "::error::impossibile verificare main dopo una matrix mista"
              exit 1
            fi
            if ! [[ "$current_main" =~ ^[a-f0-9]{40}$ ]]; then
              echo "::error::revisione corrente di main non valida dopo una matrix mista"
              exit 1
            fi
            echo "current_main=$current_main" >> "$GITHUB_OUTPUT"
            echo "::notice::matrix mista rilevata; il recovery ripartira' dalla HEAD corrente $current_main"
            echo 'fresh=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::source commit non e' una SHA completa per il replay staged"
            exit 1
          fi
          if ! current_main="$(bash scripts/ci/read-main-head.sh)"; then
            echo "::error::impossibile verificare main prima del replay API"
            exit 1
          fi
          if ! [[ "$current_main" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::revisione corrente di main non valida per il replay bootstrap"
            exit 1
          fi
          echo "current_main=$current_main" >> "$GITHUB_OUTPUT"
          if [ "$current_main" != "$SOURCE_COMMIT" ]; then
            echo "::notice::main e' avanzata da $SOURCE_COMMIT a $current_main durante il backfill; il passo recovery redispatchera' il publisher sulla HEAD corrente"
            echo 'fresh=false' >> "$GITHUB_OUTPUT"
          else
            echo "main ancora sulla revisione staged $SOURCE_COMMIT"
            echo 'fresh=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.replay_freshness.outcome == 'success'
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies for Remote Config
        if: steps.replay_freshness.outcome == 'success'
        run: bash scripts/lib/npm-ci-retry.sh

      - name: Prepare Firebase credentials
        if: steps.replay_freshness.outcome == 'success'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not set — Remote Config is the only source of the dispatch token"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Load dispatch token from Remote Config
        if: steps.replay_freshness.outcome == 'success'
        run: node generator/scripts/load-rc-env.mjs

      - name: Redispatch staged backfill on current main after stale replay or mixed matrix
        if: >-
          steps.replay_freshness.outputs.fresh == 'false' ||
          needs.publish_release_head.outputs.mixed_matrix == 'true'
        env:
          REPOSITORY: ${{ github.repository }}
          TARGET_MATRIX: ${{ needs.resolve.outputs.matrix }}
          ORIGINAL_PUSH_BEFORE: ${{ needs.resolve.outputs.push_before }}
          CURRENT_MAIN: ${{ steps.replay_freshness.outputs.current_main }}
          MIXED_MATRIX: ${{ needs.publish_release_head.outputs.mixed_matrix }}
          DRY: ${{ needs.resolve.outputs.dry }}
          REPLAY_API_AFTER_PUBLISH: ${{ needs.resolve.outputs.replay_api_after_publish }}
          ALLOW_DEFERRED_LIVE_RELEASE: ${{ needs.resolve.outputs.allow_deferred_live_release }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
        run: bash scripts/ci/fast-publish-section-recovery.sh

      - name: Replay publish-api after staged release
        if: >-
          steps.replay_freshness.outputs.fresh == 'true' &&
          needs.publish_release_head.outputs.mixed_matrix != 'true'
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ needs.publish_release_head.outputs.rendered_head || inputs.source_commit || github.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]] \
            || [ "$(git rev-parse HEAD)" != "$SOURCE_COMMIT" ]; then
            echo "::error::checkout del replay non coincide con la revisione staged"
            exit 1
          fi
          readiness_attempts=0
          readiness_ready='false'
          max_readiness_attempts=3
          while (( readiness_attempts < max_readiness_attempts )); do
            readiness_attempts=$((readiness_attempts + 1))
            git fetch --no-tags --depth=1 origin main
            current_main="$(git rev-parse FETCH_HEAD)"
            if [ "$current_main" != "$SOURCE_COMMIT" ]; then
              echo "::error::main e' avanzata durante il backfill ($SOURCE_COMMIT -> $current_main); replay API non accodato"
              exit 1
            fi
            readiness="$RUNNER_TEMP/staged-replay-readiness.json"
            node scripts/reconcile-section-pages.mjs --out "$readiness" --cap 1
            if [ "$(jq -r 'if .skipped then "true" else "false" end' "$readiness")" != 'true' ] \
              && [ "$(jq -r '.counts.missingPages' "$readiness")" = '0' ] \
              && [ "$(jq -r '.counts.unknown' "$readiness")" = '0' ] \
              && [ "$(jq -r '.counts.manifestUnknown' "$readiness")" = '0' ]; then
              readiness_ready='true'
              break
            fi
            if (( readiness_attempts < max_readiness_attempts )); then
              retry_delay=$((readiness_attempts * 20))
              echo "::notice::replay API non ancora dimostrato (tentativo $readiness_attempts/$max_readiness_attempts); ritento tra ${retry_delay}s"
              sleep "$retry_delay"
            fi
          done
          if [ "$readiness_ready" != 'true' ]; then
            echo "::error::replay API bloccato: la readiness deferred non e' stata dimostrata dopo $max_readiness_attempts tentativi"
            exit 1
          fi
          runtime_pat="${GITHUB_PAT_NANAKO:-}"
          if [ -z "$runtime_pat" ]; then
            echo "::error::GITHUB_PAT_NANAKO non caricato da Remote Config"
            exit 1
          fi
          export GH_TOKEN="$runtime_pat"
          verifyMainHeadAtDispatch() {
            local current_main=''
            if ! current_main="$(bash scripts/ci/read-main-head.sh)"; then
              echo "::error::impossibile verificare main immediatamente prima del dispatch publish-api"
              return 1
            fi
            if ! [[ "$current_main" =~ ^[a-f0-9]{40}$ ]]; then
              echo "::error::HEAD di main non valida immediatamente prima del dispatch publish-api: $current_main"
              return 1
            fi
            if [ "$current_main" != "$SOURCE_COMMIT" ]; then
              echo "::notice::main e' avanzata dopo la readiness ($SOURCE_COMMIT -> $current_main); replay API interrotto"
              return 2
            fi
          }
          if verifyMainHeadAtDispatch; then
            gh workflow run publish-api.yml --repo "$REPOSITORY" --ref main -f source_commit="$SOURCE_COMMIT"
          else
            verify_status=$?
            if [ "$verify_status" -eq 2 ]; then
              echo "::notice::nessun dispatch publish-api: la superficie verra' riallineata dal percorso sulla nuova HEAD"
              exit 0
            fi
            exit "$verify_status"
          fi

      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
