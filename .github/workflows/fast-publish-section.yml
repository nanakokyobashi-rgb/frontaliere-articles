name: fast-publish-section
run-name: cover-publish-section / ${{ inputs.section || 'auto' }} / nonce=${{ inputs.dispatch_nonce || 'none' }} / dry=${{ inputs.dry_run }} / c=${{ inputs.dispatch_cohort || 'none' }}

# Pubblica su R2 le sezioni attive del piano/registro, con concorrenza per sezione.
# Bootstrap carica tutta la superficie prima del flip draft/live.

on:
  push:
    branches: [main]
    paths:
      - 'content/cantons/**'
      - 'content/article-index-exclusions.json'
      - 'content/blog-body-canton-*/**'
      - 'content/blog-meta-canton-*'
      # Il flip draft -> live cambia solo il registro; lo stage carica le
      # pagine necessarie prima della pubblicazione API.
      - 'sections/registry.json'
      # Declared images and queued-cover writes are filtered below.
      - 'public/images/**'
      - 'generator/scripts/lib/canton-hubs/paths.mjs'
      - 'generator/scripts/lib/corpus-paths.mjs'
      - 'generator/scripts/lib/control-char-write-report.mjs'
      # The article-body preflight is part of the publication chain. Changes
      # to its implementation or parser helpers must rerun this publisher.
      - 'scripts/ci/check-blog-body-links.mjs'
      - 'scripts/ci/check-blog-body-syntax.mjs'
      - 'scripts/lib/article-link-contract.mjs'
      - 'scripts/lib/typescript-expression-scanner.mjs'
      - 'scripts/lib/rss-feed-body-adapter.mjs'
      - 'generator/scripts/lib/article-meta-block.mjs'
      - 'generator/scripts/lib/article-excerpt.mjs'
      - 'engine/**'
      - 'host/**'
      - 'scripts/publish-section-pages.mjs'
      - 'scripts/lib/section-bootstrap-lock.mjs'
      - 'scripts/ci/section-bootstrap-lock.mjs'
      - 'scripts/lib/conditional-cdn-put.sh'
      - 'scripts/ci/fast-publish-section.mjs'
      - 'scripts/ci/fast-publish-section-coordinate.sh'
      - 'scripts/ci/fast-publish-section-late-api-recovery.sh'
      - 'scripts/ci/wait-fast-publish-api-readiness.mjs'
      - 'scripts/ci/dispatch-fast-publish-replay.sh'
      - 'scripts/ci/dispatch-bounded-section-replay.sh'
      - 'scripts/ci/read-main-head.sh'
      - 'scripts/ci/resolve-workflow-run-push-range.mjs'
      - 'scripts/ci/retry-cmd.sh'
      - 'scripts/ci/fetch-push-base-if-missing.sh'
      - 'scripts/ci/section-source-unaffected.sh'
      - 'scripts/ci/fast-publish-section-resolve.sh'
      - 'scripts/ci/fast-publish-section-edge-candidate.sh'
      - 'scripts/ci/fast-publish-section-preflight.sh'
      - 'scripts/ci/fast-publish-section-render.sh'
      - 'scripts/ci/fast-publish-section-recovery.sh'
      - 'scripts/ci/record-fast-publish-result.sh'
      - 'scripts/cf-purge-cache.mjs'
      - 'scripts/offload-generated-images-cdn.mjs'
      - 'scripts/lib/article-render-pipeline.mjs'
      - 'scripts/lib/content-updated-at.mjs'
      - 'scripts/lib/declared-image-fetch.mjs'
      - 'scripts/lib/cf-analytics.mjs'
      - 'scripts/lib/canton-hub-data.mjs'
      - 'scripts/lib/canton-hub-content.mjs'
      - 'scripts/lib/cdn-asset-existence.mjs'
      - 'scripts/lib/cf-purge-variants.mjs'
      - 'scripts/lib/delete-cdn-file.sh'
      - 'scripts/lib/corpus-floors.mjs'
      - 'scripts/lib/corpus-sections.mjs'
      - 'scripts/lib/seo-entry.mjs'
      - 'scripts/lib/article-registry-reader.mjs'
      - 'scripts/lib/ts-literals.mjs'
      - 'generator/scripts/lib/daily-brief-content.mjs'
      - 'generator/scripts/lib/daily-brief-data.mjs'
      - 'generator/scripts/lib/daily-brief-insights.mjs'
      - 'generator/scripts/lib/localized-toponyms.mjs'
      - 'generator/scripts/lib/localized-toponym-table.mjs'
      - 'generator/scripts/lib/static-article-field-scanner.mjs'
      - 'generator/data/localized-toponyms.json'
      - 'scripts/lib/engine-corpus-view.mjs'
      - 'scripts/lib/sanitize-control-chars.mjs'
      - 'scripts/lib/section-registry.mjs'
      - 'scripts/lib/assert-hub-locale-slug.mjs'
      - 'scripts/lib/section-page-manifest.mjs'
      - 'scripts/lib/upload-cdn-file.sh'
      - 'scripts/lib/r2-image-lease-process.sh'
      - 'scripts/lib/r2-image-namespace-lock.mjs'
      - 'scripts/lib/r2-section-lock.mjs'
      - 'scripts/lib/safe-lease-timestamp.mjs'
      - 'scripts/lib/is-invoked-directly.mjs'
      - 'scripts/lib/npm-ci-retry.sh'
      - 'scripts/lib/parse-positive-num.mjs'
      - 'generator/scripts/load-rc-env.mjs'
      - 'generator/scripts/lib/fetch-with-ref-timeout.mjs'
  workflow_dispatch:
    inputs:
      section:
        description: 'Sezione cantonale attiva nel core (es. canton-ti)'
        required: true
        type: string
      article_ids:
        description: 'Array JSON di id articolo (vuoto = solo landing, archivio e hub)'
        required: false
        type: string
      missing_page_paths:
        description: 'Array JSON di path canonici verificati 404 dal reconciler'
        required: false
        default: '[]'
        type: string
      known_missing_page_paths:
        description: 'Array JSON di tutti i path 404 noti, anche oltre il cap del reconciler'
        required: false
        default: '[]'
        type: string
      bootstrap:
        description: 'Rendi TUTTI gli articoli della sezione (accensione di un cantone)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Rendi e valida, non caricare niente'
        required: false
        default: true
        type: boolean
      dispatch_nonce:
        description: 'Nonce opaco usato dal drain per correlare questa run'
        required: false
        default: ''
        type: string
      dispatch_cohort:
        description: 'coorte'
        required: false
        default: ''
        type: string
      push_before:
        description: 'Base SHA della provenienza push esplicita (solo replay bounded)'
        required: false
        default: ''
        type: string
      push_after:
        description: 'Head SHA della provenienza push esplicita (solo replay bounded)'
        required: false
        default: ''
        type: string
      remove_stale_canton_rss_feeds:
        description: 'Rimuovi i feed RSS rimasti da una sezione demossa'
        required: false
        default: false
        type: boolean
      cleanup_inactive_surface:
        description: 'Rimuovi pagine e feed di una sezione disattivata senza renderizzarla'
        required: false
        default: false
        type: boolean
      api_release_commit:
        description: 'Commit API pubblicato dalla run originaria (solo replay bounded)'
        required: false
        default: ''
        type: string
      source_commit:
        description: 'Commit del corpus da checkoutare nel replay bounded'
        required: false
        default: ''
        type: string
      source_main_commit:
        description: 'HEAD di main osservata quando e’ stato preparato il replay bounded'
        required: false
        default: ''
        type: string
      replay_api_after_publish:
        description: 'Dopo uno staged backfill, ripubblica API sulla stessa HEAD verificata'
        required: false
        default: false
        type: boolean
      allow_deferred_live_release:
        description: 'Dopo uno staged backfill, mantieni il manifest differito senza dispatchare il replay API'
        required: false
        default: false
        type: boolean
      coordinated_recovery:
        description: 'Child coordinato da una recovery mixed: non armare replay API locale'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    # Include checkout/teardown overhead while bounding a stalled resolver.
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
      stage_matrix: ${{ steps.plan.outputs.stage_matrix }}
      stage_any: ${{ steps.plan.outputs.stage_any }}
      api_action: ${{ steps.plan.outputs.api_action }}
      api_wait_commit: ${{ steps.plan.outputs.api_wait_commit }}
      dry: ${{ steps.plan.outputs.dry }}
      bootstrap: ${{ steps.plan.outputs.bootstrap }}
      replay_api_after_publish: ${{ steps.replay_mode.outputs.replay_api_after_publish }}
      allow_deferred_live_release: ${{ steps.replay_mode.outputs.allow_deferred_live_release }}
      push_before: ${{ steps.plan.outputs.before }}
      push_after: ${{ steps.plan.outputs.after }}
      event_before: ${{ steps.push_range.outputs.before }}
      source_commit: ${{ steps.plan.outputs.source_commit }}
      api_release_commit: ${{ steps.plan.outputs.api_release_commit }}
      preflight_head: ${{ steps.preflight_head.outputs.head }}
    steps:
      - name: Checkout (resolve)
        uses: actions/checkout@v7
        with:
          # Normal non-bootstrap cover-drain dispatches carry article ids, not
          # a source commit: resolve the live dispatch ref. workflow_run,
          # bounded replays, and bootstrap keep their exact source revision.
          ref: ${{ github.event.workflow_run.head_sha || inputs.source_commit || (github.event_name == 'workflow_dispatch' && inputs.bootstrap != true && github.ref) || github.sha }}
          # Il floor richiede la storia precedente: un checkout shallow blocca il render.
          fetch-depth: 0
          # Resolve needs source corpus/code, not generated data/dist/public.
          # Exclude those trees so transfers cannot consume the resolve budget.
          filter: blob:none
          sparse-checkout: |
            /*
            !/data
            !/dist
            !/public
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Checkout replay dispatcher from workflow revision
        uses: actions/checkout@v7
        with:
          # workflow_run checks out the older publish source at the workspace
          # root; github.sha points to the default-branch workflow revision.
          ref: ${{ github.sha }}
          path: .replay-dispatcher-source
          fetch-depth: 1
          sparse-checkout: |
            .github/actions/setup-article-source-runtime/action.yml
            scripts/ci/article-source-runtime/package.json
            scripts/ci/article-source-runtime/package-lock.json
            scripts/ci/check-article-source-runtime.mjs
            scripts/lib/npm-ci-retry.sh
            scripts/ci/dispatch-fast-publish-replay.sh
            scripts/ci/read-main-head.sh
            scripts/ci/fetch-push-base-if-missing.sh
            scripts/ci/fast-publish-section-resolve.sh
            scripts/ci/section-source-unaffected.sh
            scripts/ci/fast-publish-section-edge-candidate.sh
            scripts/ci/fast-publish-section-preflight.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Materialize resolver from workflow revision
        run: |
          set -euo pipefail
          resolver_source='.replay-dispatcher-source/scripts/ci/fast-publish-section-resolve.sh'
          resolver_target='scripts/ci/fast-publish-section-resolve.sh'
          main_head_source='.replay-dispatcher-source/scripts/ci/read-main-head.sh'
          main_head_target='scripts/ci/read-main-head.sh'
          edge_candidate_source='.replay-dispatcher-source/scripts/ci/fast-publish-section-edge-candidate.sh'
          edge_candidate_target='scripts/ci/fast-publish-section-edge-candidate.sh'
          preflight_source='.replay-dispatcher-source/scripts/ci/fast-publish-section-preflight.sh'
          preflight_target='scripts/ci/fast-publish-section-preflight.sh'
          if [ ! -f "$resolver_source" ]; then
            echo "::error::resolver non presente nel checkout della revisione del workflow"
            exit 1
          fi
          if [ ! -f "$main_head_source" ]; then
            echo "::error::helper della punta di main non presente nel checkout della revisione del workflow"
            exit 1
          fi
          if [ ! -f "$edge_candidate_source" ]; then
            echo "::error::helper della release edge non presente nel checkout della revisione del workflow"
            exit 1
          fi
          if [ ! -f "$preflight_source" ]; then
            echo "::error::helper di preflight non presente nel checkout della revisione del workflow"
            exit 1
          fi
          # Resolver dalla revisione del workflow; sorgenti/dati dal run pinnato.
          install -m 0755 "$resolver_source" "$resolver_target"
          test -f .replay-dispatcher-source/scripts/ci/fetch-push-base-if-missing.sh
          ln -sfn "$PWD/.replay-dispatcher-source/scripts/ci/fetch-push-base-if-missing.sh" scripts/ci/fetch-push-base-if-missing.sh
          if [ -f "$main_head_source" ]; then
            install -m 0755 "$main_head_source" "$main_head_target"
          elif [ -f "$main_head_target" ]; then
            chmod 0755 "$main_head_target"
            echo "::warning::helper della punta di main assente nella revisione del dispatcher; uso quello del checkout pinned"
          else
            echo "::warning::helper della punta di main assente nelle revisioni disponibili; genero il fallback git-transport"
            cat > "$main_head_target" <<'EOF'
            #!/usr/bin/env bash
            set -euo pipefail
            remote="${1:-origin}"
            ref="${2:-refs/heads/main}"
            if [ "$#" -gt 2 ]; then
              echo "usage: $0 [remote] [ref]" >&2
              exit 2
            fi
            main_head=''
            for attempt in 1 2 3; do
              main_head=''
              ls_remote_out=''
              if ls_remote_out="$(timeout 60 git ls-remote --refs "$remote" "$ref" 2>/dev/null)"; then
                main_head="$(printf '%s\n' "$ls_remote_out" | awk -v wanted="$ref" '$2 == wanted { print $1; exit }')"
              fi
              if [[ "$main_head" =~ ^[a-f0-9]{40}$ ]]; then
                printf '%s\n' "$main_head"
                exit 0
              fi
              [ "$attempt" -lt 3 ] && sleep "$((attempt * 5))"
            done
            echo "::error::punta di $ref non risolvibile via git ls-remote" >&2
            exit 1
          EOF
            chmod 0755 "$main_head_target"
          fi
          install -m 0755 "$edge_candidate_source" "$edge_candidate_target"
          install -m 0755 "$preflight_source" "$preflight_target"

      - name: Set up Node (resolve)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Resolve originating push range
        id: push_range
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          DISPATCH_PUSH_BEFORE: ${{ inputs.push_before }}
          DISPATCH_PUSH_AFTER: ${{ inputs.push_after }}
          SOURCE_COMMIT_INPUT: ${{ inputs.source_commit }}
          SOURCE_MAIN_COMMIT_INPUT: ${{ inputs.source_main_commit }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_RUN_DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          set -euo pipefail
          before="${PUSH_BEFORE:-}"
          after="${PUSH_AFTER:-}"
          if [ "$EVENT_NAME" = 'workflow_run' ]; then
            if [ -z "${WORKFLOW_RUN_HEAD_SHA:-}" ] || ! [[ "$WORKFLOW_RUN_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]; then
              echo "::error::workflow_run head SHA non valido"
              exit 1
            fi
            if [ "$WORKFLOW_RUN_EVENT" = 'push' ]; then
              range_output="$(
                REPO="$REPO" \
                WORKFLOW_RUN_HEAD_SHA="$WORKFLOW_RUN_HEAD_SHA" \
                WORKFLOW_RUN_ID="$WORKFLOW_RUN_ID" \
                  node scripts/ci/resolve-workflow-run-push-range.mjs
              )"
              before=''
              after=''
              range_source=''
              while IFS='=' read -r key value; do
                case "$key" in
                  before) before="$value" ;;
                  after) after="$value" ;;
                  source) range_source="$value" ;;
                esac
              done <<< "$range_output"
              if [ "$after" != "$WORKFLOW_RUN_HEAD_SHA" ]; then
                echo "::error::resolver della push ha restituito una HEAD inattesa: $after"
                exit 1
              fi
              echo "::notice::range push originaria risolta via $range_source: $before -> $after"
            elif [ "$WORKFLOW_RUN_EVENT" = 'workflow_dispatch' ]; then
              range_output="$(WORKFLOW_RUN_DISPLAY_TITLE="$WORKFLOW_RUN_DISPLAY_TITLE" \
                node scripts/ci/resolve-workflow-run-push-range.mjs --fast-publish-range)" || {
                range_output=''
              }
              if [ -n "$range_output" ]; then
                range_source=''
                while IFS='=' read -r key value; do
                  case "$key" in
                    before) before="$value" ;;
                    after) after="$value" ;;
                    source) range_source="$value" ;;
                  esac
                done <<< "$range_output"
                if [ "$range_source" != 'fast-publish-range-title' ] \
                  && [ "$after" != "$WORKFLOW_RUN_HEAD_SHA" ]; then
                  echo '::error::range Fast Publish nel titolo non coincide con la HEAD del workflow_run API'
                  exit 1
                fi
                echo "::notice::range Fast Publish originario risolto dal titolo: $before -> $after"
              fi
            elif [ "$WORKFLOW_RUN_EVENT" != 'schedule' ] && [ "$WORKFLOW_RUN_EVENT" != 'workflow_dispatch' ]; then
              echo "::error::workflow_run event non supportato: $WORKFLOW_RUN_EVENT"
              exit 1
            fi
          elif [ "$EVENT_NAME" = 'push' ]; then
            range_source='push-event'
          elif [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            if [ -n "${SOURCE_COMMIT_INPUT:-}" ] && ! [[ "$SOURCE_COMMIT_INPUT" =~ ^[a-f0-9]{40}$ ]]; then
              echo "::error::source_commit richiede una SHA completa"
              exit 1
            fi
            if [ -n "${SOURCE_COMMIT_INPUT:-}" ]; then
              if [ -z "${SOURCE_MAIN_COMMIT_INPUT:-}" ] || ! [[ "$SOURCE_MAIN_COMMIT_INPUT" =~ ^[a-f0-9]{40}$ ]]; then
                echo "::error::source_main_commit e' obbligatorio e richiede una SHA completa quando source_commit e' valorizzato"
                exit 1
              fi
              if [ "$SOURCE_COMMIT_INPUT" != "$SOURCE_MAIN_COMMIT_INPUT" ]; then
                echo "::error::source_commit deve coincidere con source_main_commit nel replay bounded"
                exit 1
              fi
              if [ "$(git rev-parse HEAD)" != "$SOURCE_COMMIT_INPUT" ]; then
                echo "::error::checkout non coincide con source_commit"
                exit 1
              fi
            fi
            dispatch_before="${DISPATCH_PUSH_BEFORE:-}"
            dispatch_after="${DISPATCH_PUSH_AFTER:-}"
            if [ -n "$dispatch_before" ] || [ -n "$dispatch_after" ]; then
              if [ -z "$dispatch_before" ] || [ -z "$dispatch_after" ] \
                || ! [[ "$dispatch_before" =~ ^[a-f0-9]{40}$ ]] \
                || ! [[ "$dispatch_after" =~ ^[a-f0-9]{40}$ ]]; then
                echo "::error::push_before/push_after richiedono una provenienza completa di SHA"
                exit 1
              fi
              before="$dispatch_before"
              after="$dispatch_after"
              range_source='dispatch-input'
            fi
          fi
          {
            echo "before=$before"
            echo "after=$after"
            echo "source=${range_source:-}"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch push base (resolve)
        env:
          PUSH_BEFORE: ${{ steps.push_range.outputs.before }}
        run: |
          bash scripts/ci/fetch-push-base-if-missing.sh

      # Solo builtin Node (fast-publish-section.mjs): decide prima se c'e' un
      # target, cosi' un resolve vuoto non installa il parser né avvia il gate.
      - name: Resolve sections and article ids
        id: plan
        env:
          SECTION_INPUT: ${{ inputs.section }}
          ARTICLE_IDS_INPUT: ${{ inputs.article_ids }}
          MISSING_PAGE_PATHS_INPUT: ${{ inputs.missing_page_paths }}
          KNOWN_MISSING_PAGE_PATHS_INPUT: ${{ inputs.known_missing_page_paths }}
          BOOTSTRAP_INPUT: ${{ inputs.bootstrap }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          REMOVE_STALE_INPUT: ${{ inputs.remove_stale_canton_rss_feeds }}
          CLEANUP_INACTIVE_SURFACE_INPUT: ${{ inputs.cleanup_inactive_surface }}
          REPLAY_API_INPUT: ${{ inputs.replay_api_after_publish }}
          ALLOW_DEFERRED_LIVE_RELEASE_INPUT: ${{ inputs.allow_deferred_live_release }}
          API_RELEASE_COMMIT_INPUT: ${{ inputs.api_release_commit }}
          COORDINATED_RECOVERY_INPUT: ${{ inputs.coordinated_recovery }}
          EVENT_NAME: ${{ github.event_name }}
          COVER_DRAIN_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          WORKFLOW_RUN_COVER_DRAIN_COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          PUSH_BEFORE: ${{ steps.push_range.outputs.before }}
          PUSH_AFTER: ${{ steps.push_range.outputs.after }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_RUN_RANGE_SOURCE: ${{ steps.push_range.outputs.source }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_COMMIT_INPUT: ${{ inputs.source_commit }}
          SOURCE_MAIN_COMMIT_INPUT: ${{ inputs.source_main_commit }}
          DISPATCH_NONCE_INPUT: ${{ inputs.dispatch_nonce }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FAST_PUBLISH_ARMED: ${{ vars.FAST_PUBLISH_ARMED }}
        run: |
          bash scripts/ci/fast-publish-section-resolve.sh

      # Tieni l'arming del replay fuori dal run monolitico di resolve: GitHub
      # rifiuta workflow con espressioni oltre 21.000 caratteri. I valori
      # calcolati da plan restano la base per dispatch, bootstrap e replay.
      - name: Arm normal push staged replay
        id: replay_mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          ANY: ${{ steps.plan.outputs.any }}
          DRY: ${{ steps.plan.outputs.dry }}
          PLAN_REPLAY_API_AFTER_PUBLISH: ${{ steps.plan.outputs.replay_api_after_publish }}
          PLAN_ALLOW_DEFERRED_LIVE_RELEASE: ${{ steps.plan.outputs.allow_deferred_live_release }}
        run: |
          set -euo pipefail
          replay_api_after_publish="${PLAN_REPLAY_API_AFTER_PUBLISH:-false}"
          allow_deferred_live_release="${PLAN_ALLOW_DEFERRED_LIVE_RELEASE:-false}"
          # I push con fonti API articolo vengono pubblicati dal solo pass
          # workflow_run dopo il successo di publish-api. Il push diretto resta
          # per il codice di render e non dispatcha una build API duplicata.
          echo "replay_api_after_publish=$replay_api_after_publish" >> "$GITHUB_OUTPUT"
          echo "allow_deferred_live_release=$allow_deferred_live_release" >> "$GITHUB_OUTPUT"

      - name: Setup isolated article source runtime
        if: steps.plan.outputs.any == 'true'
        uses: ./.replay-dispatcher-source/.github/actions/setup-article-source-runtime

      - name: Install isolated blog-body syntax parser (esbuild)
        if: steps.plan.outputs.any == 'true'
        run: |
          set -euo pipefail
          preflight_dir="$RUNNER_TEMP/preflight"
          # publish-api.yml is the single source for the parser pin used by
          # this gate; a fast publisher must not drift to another esbuild.
          ESBUILD_PIN="$(sed -n 's/^[[:space:]]*ESBUILD_PIN:[[:space:]]*//p' .github/workflows/publish-api.yml | head -n 1)"
          if [[ ! "$ESBUILD_PIN" =~ ^esbuild@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::publish-api.yml does not expose a valid ESBUILD_PIN"
            exit 1
          fi
          mkdir -p "$preflight_dir"
          printf '{"name":"preflight-parser","private":true}\n' > "$preflight_dir/package.json"
          (
            cd "$preflight_dir"
            bash "$GITHUB_WORKSPACE/scripts/ci/retry-cmd.sh" \
              npm install --no-save --no-audit --no-fund --prefer-offline --loglevel=error "$ESBUILD_PIN"
          )
          test -f "$preflight_dir/node_modules/esbuild/lib/main.js"

      - name: Preflight — i link Markdown devono avere una destinazione canonica
        if: steps.plan.outputs.any == 'true'
        env:
          BEFORE: ${{ steps.plan.outputs.before }}
          AFTER: ${{ steps.plan.outputs.after }}
          EVENT_NAME: ${{ github.event_name }}
          PREFLIGHT_EVENT_NAME: ${{ github.event_name }}
          PREFLIGHT_PUSH_BASE_REVISION: ${{ steps.push_range.outputs.before }}
          ARTICLE_IDS_INPUT: ${{ inputs.article_ids }}
          SECTION_INPUT: ${{ inputs.section }}
        run: bash scripts/ci/fast-publish-section-preflight.sh

      - name: Record preflight revision
        id: preflight_head
        if: steps.plan.outputs.any == 'true'
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  stage:
    name: stage (${{ matrix.target.section }})
    needs: resolve
    if: needs.resolve.outputs.stage_any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.stage_matrix) }}
    concurrency:
      group: fast-publish-${{ matrix.target.section }}
      cancel-in-progress: false
      queue: single
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Read main after acquiring the section slot
        id: start_source
        env:
          SECTION: ${{ matrix.target.section }}
        run: |
          set -euo pipefail
          observed="$(bash scripts/ci/read-main-head.sh)"
          if ! [[ "$observed" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::HEAD main non valida dopo aver acquisito lo slot della sezione'
            exit 1
          fi
          if ! git cat-file -e "$observed^{commit}" 2>/dev/null; then git fetch --quiet --no-tags origin "$observed"; fi
          git checkout --detach "$observed"
          eligible="$(node scripts/ci/fast-publish-section.mjs r2-section-eligible "$SECTION")"
          if [ "$eligible" != 'true' ]; then
            echo "::error::target stage $SECTION non eleggibile sulla HEAD $observed; cede alla run latest"
            exit 1
          fi
          echo "head=$observed" >> "$GITHUB_OUTPUT"

      - name: Setup isolated article source runtime
        uses: ./.github/actions/setup-article-source-runtime

      - name: Install dependencies
        run: bash scripts/lib/npm-ci-retry.sh

      - name: Prepare Firebase credentials
        if: needs.resolve.outputs.dry != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo '::error::FIREBASE_SERVICE_ACCOUNT_JSON is not set'
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Load R2 and CDN credentials
        if: needs.resolve.outputs.dry != 'true'
        run: node generator/scripts/load-rc-env.mjs

      - name: Require R2 and Cloudflare credentials
        if: needs.resolve.outputs.dry != 'true'
        run: |
          set -euo pipefail
          missing=()
          for name in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_S3_ENDPOINT R2_BUCKET CF_API_TOKEN; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::missing after Remote Config load: ${missing[*]}"
            exit 1
          fi

      - name: Ensure host shell assets are on the CDN
        if: needs.resolve.outputs.dry != 'true'
        run: bash scripts/ci/retry-cmd.sh npx -y tsx@4.23.15 scripts/ci/ensure-host-shell-assets.mjs

      - name: Acquire bootstrap R2 gate
        id: acquire_bootstrap
        if: needs.resolve.outputs.dry != 'true'
        env:
          SECTION: ${{ matrix.target.section }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/section-bootstrap-lock.mjs acquire --section "$SECTION" --commit "${{ steps.start_source.outputs.head }}" --wait-ms 3300000 --retry-ms 20000

      - name: Stage full section before API release
        id: render
        env:
          SECTION: ${{ matrix.target.section }}
          ARTICLE_IDS_JSON: '[]'
          MISSING_PAGE_PATHS_JSON: '[]'
          KNOWN_MISSING_PAGE_PATHS_JSON: '[]'
          BOOTSTRAP: true
          TARGET_BOOTSTRAP: true
          FAST_PUBLISH_ARMED: ${{ vars.FAST_PUBLISH_ARMED }}
          DRY: ${{ needs.resolve.outputs.dry }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ needs.resolve.outputs.push_before }}
          PUSH_AFTER: ${{ needs.resolve.outputs.push_after }}
          PREFLIGHT_HEAD: ${{ needs.resolve.outputs.preflight_head }}
          REMOVE_STALE_CANTON_RSS_FEEDS: ${{ matrix.target.removeStaleCantonRssFeeds || false }}
          CLEANUP_INACTIVE_SURFACE: ${{ matrix.target.cleanupInactiveSurface || false }}
          API_RELEASE_COMMIT: ''
          ALLOW_DEFERRED_LIVE_RELEASE: true
          REPLAY_API_AFTER_PUBLISH: false
          COORDINATED_RECOVERY: false
          SOURCE_COMMIT: ${{ steps.start_source.outputs.head }}
          SOURCE_MAIN_COMMIT: ${{ steps.start_source.outputs.head }}
          PINNED_REPLAY_MAIN: ${{ steps.start_source.outputs.head }}
          EXPECTED_MAIN_HEAD: ${{ steps.start_source.outputs.head }}
          DEFER_STALE_HANDOFF: true
          DISPATCH_NONCE: ''
          DISPATCH_COHORT: ''
          REF: refs/heads/main
          WORKFLOW_RUN_HEAD_SHA: ${{ steps.start_source.outputs.head }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SECTION_SOURCE_UNAFFECTED_HELPER: scripts/ci/section-source-unaffected.sh
        run: bash scripts/ci/fast-publish-section-render.sh

      - name: Release bootstrap R2 gate
        if: always() && needs.resolve.outputs.dry != 'true' && steps.acquire_bootstrap.outcome == 'success'
        env:
          SECTION: ${{ matrix.target.section }}
        run: bash scripts/ci/retry-cmd.sh node scripts/ci/section-bootstrap-lock.mjs release --section "$SECTION"

      - name: Require stage to be complete
        if: steps.render.outputs.stale_handoff == 'true'
        run: |
          echo '::error::stage ceduto a una run latest; nessun dispatch API effettuato'
          exit 1

      - name: Write stage artifact
        if: success()
        env:
          SECTION: ${{ matrix.target.section }}
          SOURCE_COMMIT: ${{ steps.start_source.outputs.head }}
        run: |
          set -euo pipefail
          jq -n --arg section "$SECTION" --arg sourceCommit "$SOURCE_COMMIT" \
            '{section: $section, sourceCommit: $sourceCommit, staged: true}' \
            > "$RUNNER_TEMP/fast-publish-stage-$SECTION.json"

      - name: Upload stage artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: fast-publish-stage-${{ matrix.target.section }}
          path: ${{ runner.temp }}/fast-publish-stage-${{ matrix.target.section }}.json
          if-no-files-found: error

      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"

  coordinate_api_release:
    needs: [resolve, stage]
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      needs.resolve.outputs.any == 'true' &&
      (needs.stage.result == 'success' || needs.stage.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 190
    permissions:
      contents: read
      actions: write
    outputs:
      # Keep the per-section finalize jobs unmaterialized while this global
      # barrier is active. Once the coordinator completes, each target joins
      # the same queue:single group as stage, preserving the 1 running + 1
      # pending limit across phases.
      final_matrix: ${{ needs.resolve.outputs.matrix }}
      api_commit: ${{ steps.decision.outputs.api_commit }}
      api_baseline: ${{ steps.decision.outputs.api_baseline }}
      defer_api_wait: ${{ steps.decision.outputs.defer_api_wait }}
      wait_api: ${{ steps.decision.outputs.wait_api }}
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Download all completed stage artifacts
        if: needs.resolve.outputs.stage_any == 'true'
        uses: actions/download-artifact@v7
        with:
          pattern: fast-publish-stage-*
          path: ${{ runner.temp }}/fast-publish-stage-artifacts
          merge-multiple: true

      - name: Prepare API release decision
        id: decision
        env:
          API_ACTION: ${{ needs.resolve.outputs.dry == 'true' && 'none' || needs.resolve.outputs.api_action }}
          API_WAIT_COMMIT: ${{ needs.resolve.outputs.api_wait_commit }}
          STAGE_MATRIX: ${{ needs.resolve.outputs.stage_matrix }}
          FINAL_MATRIX: ${{ needs.resolve.outputs.matrix }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ needs.resolve.outputs.push_before }}
          PUSH_AFTER: ${{ needs.resolve.outputs.push_after }}
          ARTIFACTS_DIR: ${{ runner.temp }}/fast-publish-stage-artifacts
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/ci/fast-publish-section-coordinate.sh

      - name: Setup isolated article source runtime for Remote Config
        if: steps.decision.outputs.action == 'dispatch'
        uses: ./.github/actions/setup-article-source-runtime

      - name: Install dependencies for Remote Config
        if: steps.decision.outputs.action == 'dispatch'
        run: bash scripts/lib/npm-ci-retry.sh

      - name: Prepare Firebase credentials for dispatch
        if: steps.decision.outputs.action == 'dispatch'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo '::error::FIREBASE_SERVICE_ACCOUNT_JSON is not set'
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Load dispatch token from Remote Config
        if: steps.decision.outputs.action == 'dispatch'
        run: node generator/scripts/load-rc-env.mjs

      - name: Dispatch publish-api for the staged release
        if: steps.decision.outputs.action == 'dispatch'
        env:
          REPOSITORY: ${{ github.repository }}
          API_COMMIT: ${{ steps.decision.outputs.api_commit }}
          PUSH_BEFORE: ${{ needs.resolve.outputs.event_before }}
        run: |
          set -euo pipefail
          if ! [[ "$API_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::commit API non valido per il dispatch'
            exit 1
          fi
          before="$PUSH_BEFORE"
          if ! [[ "$before" =~ ^[a-f0-9]{40}$ ]]; then before="$(git rev-parse "$API_COMMIT^1")"; fi
          runtime_pat="${GITHUB_PAT_NANAKO:-}"
          if [ -z "$runtime_pat" ]; then
            echo '::error::GITHUB_PAT_NANAKO non caricato da Remote Config'
            exit 1
          fi
          export GH_TOKEN="$runtime_pat"
          gh workflow run publish-api.yml --repo "$REPOSITORY" --ref main \
            -f source_commit="$API_COMMIT" \
            -f bing_seo_nonce="fast-publish-range-${before}-${API_COMMIT}"

      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"

  finalize:
    name: finalize (${{ matrix.target.section }})
    needs: [resolve, stage, coordinate_api_release]
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      needs.resolve.outputs.any == 'true' &&
      (needs.stage.result == 'success' || needs.stage.result == 'skipped') &&
      (needs.coordinate_api_release.result == 'success' || needs.coordinate_api_release.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: ${{ fromJSON(needs.coordinate_api_release.outputs.final_matrix) }}
    concurrency:
      group: fast-publish-${{ matrix.target.section }}
      cancel-in-progress: false
      queue: single
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Download stage artifact for this section
        if: needs.resolve.outputs.stage_any == 'true'
        uses: actions/download-artifact@v7
        with:
          name: fast-publish-stage-${{ matrix.target.section }}
          path: ${{ runner.temp }}/fast-publish-stage-${{ matrix.target.section }}

      - name: Read latest main after acquiring the section slot
        id: start_source
        env:
          SECTION: ${{ matrix.target.section }}
          STAGE_ARTIFACT: ${{ runner.temp }}/fast-publish-stage-${{ matrix.target.section }}/fast-publish-stage-${{ matrix.target.section }}.json
          STAGE_ANY: ${{ needs.resolve.outputs.stage_any }}
          PREFLIGHT_HEAD: ${{ needs.resolve.outputs.preflight_head }}
          CLEANUP_INACTIVE_SURFACE: ${{ matrix.target.cleanupInactiveSurface || false }}
          DEFER_API_WAIT: ${{ needs.coordinate_api_release.outputs.defer_api_wait || false }}
        run: |
          set -euo pipefail
          observed="$(bash scripts/ci/read-main-head.sh)"
          if ! [[ "$observed" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::HEAD main non valida dopo aver acquisito lo slot della sezione'
            exit 1
          fi
          if ! git cat-file -e "$observed^{commit}" 2>/dev/null; then git fetch --quiet --no-tags origin "$observed"; fi
          git checkout --detach "$observed"
          if [ "$CLEANUP_INACTIVE_SURFACE" = 'true' ]; then
            eligible=true
          else
            eligible="$(node scripts/ci/fast-publish-section.mjs r2-section-eligible "$SECTION")"
          fi
          if [ "$eligible" != 'true' ]; then
            echo '::notice::sezione non eleggibile sulla HEAD osservata; cede al pending latest'
            echo 'fresh=false' >> "$GITHUB_OUTPUT"
            echo "head=$observed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          stage_source=''
          section_changed=false
          force_full_section=false
          if [ "$STAGE_ANY" = 'true' ] && [ -s "$STAGE_ARTIFACT" ]; then
            stage_source="$(jq -r '.sourceCommit' "$STAGE_ARTIFACT")"
          elif [ "$CLEANUP_INACTIVE_SURFACE" != 'true' ] \
            && [[ "${PREFLIGHT_HEAD:-}" =~ ^[a-f0-9]{40}$ ]]; then
            # Any stage-less active target may have replaced a pending push,
            # including landing/hub-only dispatches with ids=[]. Force a full
            # latest-section recovery even when preflight already equals latest.
            stage_source="$PREFLIGHT_HEAD"
            force_full_section=true
            echo "::notice::target senza artifact stage: bootstrap full-section latest per $SECTION"
          fi
          if [ "$CLEANUP_INACTIVE_SURFACE" != 'true' ] \
            && [ -n "$stage_source" ] \
            && ! bash scripts/ci/section-source-unaffected.sh --section "$SECTION" "$stage_source" "$observed"; then
            echo "::notice::sezione $SECTION cambiata dopo lo stage; recupero latest full-section sotto lo slot corrente"
            section_changed=true
          fi
          recovery_decision="$(jq -cn \
            --arg stageCommit "$stage_source" \
            --arg latestCommit "$observed" \
            --argjson sectionChanged "$section_changed" \
            --argjson forceFullSection "$force_full_section" \
            --argjson deferApiWait "${DEFER_API_WAIT:-false}" \
            '{stageCommit:$stageCommit,latestCommit:$latestCommit,sectionChanged:$sectionChanged,deferApiWait:$deferApiWait,forceFullSection:$forceFullSection}' \
            | node scripts/ci/fast-publish-section.mjs r2-late-finalize-recovery)"
          rebootstrap="$(jq -r '.rebootstrap' <<<"$recovery_decision")"
          {
            echo 'fresh=true'
            echo "rebootstrap=$rebootstrap"
            echo "stage_source=$stage_source"
            echo "head=$observed"
          } >> "$GITHUB_OUTPUT"

      - name: Setup isolated article source runtime
        if: steps.start_source.outputs.fresh == 'true'
        uses: ./.github/actions/setup-article-source-runtime

      - name: Install dependencies
        if: steps.start_source.outputs.fresh == 'true'
        run: bash scripts/lib/npm-ci-retry.sh

      - name: Prepare Firebase credentials
        if: steps.start_source.outputs.fresh == 'true' && needs.resolve.outputs.dry != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo '::error::FIREBASE_SERVICE_ACCOUNT_JSON is not set'
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Load R2 and CDN credentials
        if: steps.start_source.outputs.fresh == 'true' && needs.resolve.outputs.dry != 'true'
        run: node generator/scripts/load-rc-env.mjs

      - name: Require R2 and Cloudflare credentials
        if: steps.start_source.outputs.fresh == 'true' && needs.resolve.outputs.dry != 'true'
        run: |
          set -euo pipefail
          missing=()
          for name in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_S3_ENDPOINT R2_BUCKET CF_API_TOKEN; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::missing after Remote Config load: ${missing[*]}"
            exit 1
          fi

      - name: Ensure host shell assets are on the CDN
        if: steps.start_source.outputs.fresh == 'true' && needs.resolve.outputs.dry != 'true'
        run: bash scripts/ci/retry-cmd.sh npx -y tsx@4.23.15 scripts/ci/ensure-host-shell-assets.mjs

      - name: Acquire bootstrap R2 gate for recovery stage
        id: acquire_recovery_bootstrap
        if: steps.start_source.outputs.fresh == 'true' && steps.start_source.outputs.rebootstrap == 'true' && needs.resolve.outputs.dry != 'true'
        env:
          SECTION: ${{ matrix.target.section }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/section-bootstrap-lock.mjs acquire --section "$SECTION" --commit "${{ steps.start_source.outputs.head }}" --wait-ms 3300000 --retry-ms 20000

      - name: Restage latest section before API readiness
        id: recovery_stage
        if: steps.start_source.outputs.fresh == 'true' && steps.start_source.outputs.rebootstrap == 'true' && needs.resolve.outputs.dry != 'true'
        env:
          SECTION: ${{ matrix.target.section }}
          ARTICLE_IDS_JSON: '[]'
          MISSING_PAGE_PATHS_JSON: '[]'
          KNOWN_MISSING_PAGE_PATHS_JSON: '[]'
          BOOTSTRAP: true
          TARGET_BOOTSTRAP: true
          FAST_PUBLISH_ARMED: ${{ vars.FAST_PUBLISH_ARMED }}
          DRY: 'false'
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ''
          PUSH_AFTER: ${{ steps.start_source.outputs.head }}
          PREFLIGHT_HEAD: ${{ needs.resolve.outputs.preflight_head }}
          REMOVE_STALE_CANTON_RSS_FEEDS: false
          CLEANUP_INACTIVE_SURFACE: false
          API_RELEASE_COMMIT: ''
          ALLOW_DEFERRED_LIVE_RELEASE: true
          REPLAY_API_AFTER_PUBLISH: false
          COORDINATED_RECOVERY: false
          SOURCE_COMMIT: ''
          SOURCE_MAIN_COMMIT: ''
          PINNED_REPLAY_MAIN: ''
          EXPECTED_MAIN_HEAD: ''
          FULL_SECTION_LATEST_RECOVERY: true
          DEFER_STALE_HANDOFF: true
          DISPATCH_NONCE: ''
          DISPATCH_COHORT: ''
          REF: refs/heads/main
          WORKFLOW_RUN_HEAD_SHA: ${{ steps.start_source.outputs.head }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SECTION_SOURCE_UNAFFECTED_HELPER: scripts/ci/section-source-unaffected.sh
        run: bash scripts/ci/fast-publish-section-render.sh

      - name: Release bootstrap R2 gate after recovery stage
        if: always() && steps.start_source.outputs.rebootstrap == 'true' && needs.resolve.outputs.dry != 'true' && steps.acquire_recovery_bootstrap.outcome == 'success'
        env:
          SECTION: ${{ matrix.target.section }}
        run: bash scripts/ci/retry-cmd.sh node scripts/ci/section-bootstrap-lock.mjs release --section "$SECTION"

      - name: Resolve late API release after recovery stage
        id: late_api_recovery
        if: steps.start_source.outputs.fresh == 'true' && steps.start_source.outputs.rebootstrap == 'true' && needs.resolve.outputs.dry != 'true'
        env:
          SECTION: ${{ matrix.target.section }}
          STAGED_HEAD: ${{ steps.recovery_stage.outputs.rendered_head }}
          STAGE_BASELINE_COMMIT: ${{ steps.start_source.outputs.stage_source || needs.resolve.outputs.push_before }}
          API_BASELINE_COMMIT: ${{ needs.coordinate_api_release.outputs.api_baseline }}
          COORDINATOR_API_COMMIT: ${{ needs.coordinate_api_release.outputs.api_commit }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/fast-publish-section-late-api-recovery.sh

      - name: Wait for recovered API release readiness
        if: steps.late_api_recovery.outputs.wait_api == 'true'
        env:
          EXPECTED_API_COMMIT: ${{ steps.late_api_recovery.outputs.api_commit }}
          SECTION: ${{ matrix.target.section }}
          FAST_PUBLISH_API_WAIT_MS: '10800000'
        run: node scripts/ci/wait-fast-publish-api-readiness.mjs

      - name: Wait for API release readiness while holding the section slot
        if: steps.start_source.outputs.fresh == 'true' && steps.start_source.outputs.rebootstrap != 'true' && needs.coordinate_api_release.outputs.wait_api == 'true'
        env:
          EXPECTED_API_COMMIT: ${{ needs.coordinate_api_release.outputs.api_commit }}
          SECTION: ${{ matrix.target.section }}
          FAST_PUBLISH_API_WAIT_MS: '10800000'
        run: node scripts/ci/wait-fast-publish-api-readiness.mjs

      - name: Acquire bootstrap R2 gate for finalization
        id: acquire_finalize_bootstrap
        if: steps.start_source.outputs.fresh == 'true' && needs.resolve.outputs.dry != 'true' && (matrix.target.bootstrap == true || steps.start_source.outputs.rebootstrap == 'true')
        env:
          SECTION: ${{ matrix.target.section }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/section-bootstrap-lock.mjs acquire --section "$SECTION" --commit "${{ steps.start_source.outputs.head }}" --wait-ms 3300000 --retry-ms 20000

      - name: Render and finalize latest section pages
        id: render
        if: steps.start_source.outputs.fresh == 'true'
        env:
          SECTION: ${{ matrix.target.section }}
          ARTICLE_IDS_JSON: ${{ steps.start_source.outputs.rebootstrap == 'true' && '[]' || toJSON(matrix.target.ids) }}
          MISSING_PAGE_PATHS_JSON: ${{ toJSON(matrix.target.missingPagePaths || fromJSON('[]')) }}
          KNOWN_MISSING_PAGE_PATHS_JSON: ${{ toJSON(matrix.target.knownMissingPagePaths || fromJSON('[]')) }}
          BOOTSTRAP: ${{ matrix.target.bootstrap || steps.start_source.outputs.rebootstrap == 'true' }}
          TARGET_BOOTSTRAP: ${{ matrix.target.bootstrap || steps.start_source.outputs.rebootstrap == 'true' }}
          FAST_PUBLISH_ARMED: ${{ vars.FAST_PUBLISH_ARMED }}
          DRY: ${{ needs.resolve.outputs.dry }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ needs.resolve.outputs.push_before }}
          PUSH_AFTER: ${{ steps.start_source.outputs.head }}
          PREFLIGHT_HEAD: ${{ needs.resolve.outputs.preflight_head }}
          REMOVE_STALE_CANTON_RSS_FEEDS: ${{ matrix.target.removeStaleCantonRssFeeds || false }}
          CLEANUP_INACTIVE_SURFACE: ${{ matrix.target.cleanupInactiveSurface || false }}
          API_RELEASE_COMMIT: ${{ steps.late_api_recovery.outputs.api_commit || needs.coordinate_api_release.outputs.api_commit }}
          ALLOW_DEFERRED_LIVE_RELEASE: false
          REPLAY_API_AFTER_PUBLISH: false
          COORDINATED_RECOVERY: false
          SOURCE_COMMIT: ${{ steps.start_source.outputs.head }}
          SOURCE_MAIN_COMMIT: ${{ steps.start_source.outputs.head }}
          PINNED_REPLAY_MAIN: ${{ steps.start_source.outputs.head }}
          EXPECTED_MAIN_HEAD: ${{ steps.start_source.outputs.head }}
          DEFER_STALE_HANDOFF: true
          DISPATCH_NONCE: ''
          DISPATCH_COHORT: ''
          REF: refs/heads/main
          WORKFLOW_RUN_HEAD_SHA: ${{ steps.start_source.outputs.head }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SECTION_SOURCE_UNAFFECTED_HELPER: scripts/ci/section-source-unaffected.sh
        run: bash scripts/ci/fast-publish-section-render.sh

      - name: Release bootstrap R2 gate after finalization
        if: always() && steps.start_source.outputs.fresh == 'true' && needs.resolve.outputs.dry != 'true' && ((matrix.target.bootstrap == true || steps.start_source.outputs.rebootstrap == 'true') && steps.acquire_finalize_bootstrap.outcome == 'success' || steps.render.outputs.dynamic_bootstrap_lock == 'true')
        env:
          SECTION: ${{ matrix.target.section }}
        run: bash scripts/ci/retry-cmd.sh node scripts/ci/section-bootstrap-lock.mjs release --section "$SECTION"

      - name: Promote explicit bootstrap section
        if: success() && github.event_name == 'workflow_dispatch' && inputs.bootstrap == true && steps.render.outputs.rendered_head != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SECTION: ${{ matrix.target.section }}
          REPOSITORY: ${{ github.repository }}
        run: gh workflow run auto-live-canton-sections.yml --repo "$REPOSITORY" --ref main -f mode=promote -f sections="$SECTION"

      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
