name: fast-publish-section
run-name: cover-publish-section / ${{ inputs.section || 'auto' }} / nonce=${{ inputs.dispatch_nonce || 'none' }}

# Pubblica su R2 le pagine delle sezioni articoli CANTONALI (piano «sezioni
# articoli per cantone», D3/D8; P7b). E' il gemello di fast-publish-article.yml
# per le sezioni che non hanno uno shard Pages: il Worker del sito le serve da
# `edge/sections/<path>/index.html` quando il registro pubblicato da
# publish-api.yml le dichiara `live`.
#
# Cosa fa scattare un publish: un push che tocca i contenuti di una sezione
# cantonale ATTIVA nel core — un corpo (gli articoli cambiati vengono resi),
# oppure registro, mappa slug, meta, chunk SEO o i dati di un hub (si rendono
# landing, archivio e hub). Quali sezioni e quali id lo decide
# `scripts/ci/fast-publish-section.mjs r2-plan`, dal core: con la lista attiva
# di oggi (nessun cantone) la matrice e' vuota e il job `publish` non parte.
#
# CONCURRENCY PER SEZIONE (D8), non globale: `fast-publish-<sezione>`, senza
# cancellazione. Un gruppo unico con 24 generatori terrebbe una sola run in
# attesa e scarterebbe le altre (misurato su generate-article: 16 su 60), e gli
# articoli persi finirebbero tutti sulla riconciliazione. Due sezioni diverse
# scrivono chiavi R2 disgiunte, quindi possono andare in parallelo.
#
# NIENTE NOINDEX: una pagina resa con un `noindex`, senza il meta di proprieta'
# della route o con asset same-origin e' un rifiuto di
# scripts/publish-section-pages.mjs, prima di qualunque upload.
#
# BOOTSTRAP: `workflow_dispatch` con `bootstrap: true` rende TUTTI gli articoli
# della sezione, piu' landing, archivio e hub — e' il passo che carica le
# pagine su R2 mentre la sezione e' ancora `draft`, PRIMA del flip a `live` in
# sections/registry.json. Il verify in quel caso legge le chiavi sul CDN (la
# sezione non e' ancora servita all'apex).

on:
  push:
    branches: [main]
    paths:
      - 'content/cantons/**'
      - 'content/blog-body-canton-*/**'
      - 'content/blog-meta-canton-*'
      # Il flip draft -> live cambia solo il registro. Il primo pass carica le
      # pagine necessarie al bootstrap; il replay workflow_run, dopo il
      # completamento di publish-api, verifica feed RSS e landing sul live.
      - 'sections/registry.json'
      # A declared image may arrive after the article body. The resolver maps
      # this path through the registry to the owning canton article(s).
      # A queued-cover drain is the explicit-outbox exception; its push is
      # filtered by the shared commit marker before this workflow publishes.
      - 'public/images/**'
      - 'generator/scripts/lib/canton-hubs/paths.mjs'
      - 'generator/scripts/lib/corpus-paths.mjs'
      - 'generator/scripts/lib/control-char-write-report.mjs'
      # The article-body preflight is part of the publication chain. Changes
      # to its implementation or parser helpers must rerun this publisher.
      - 'scripts/ci/check-blog-body-links.mjs'
      - 'scripts/lib/article-link-contract.mjs'
      - 'generator/scripts/lib/article-meta-block.mjs'
      - 'generator/scripts/lib/article-excerpt.mjs'
      - 'engine/**'
      - 'host/**'
      - 'scripts/publish-section-pages.mjs'
      - 'scripts/publish-section-edge.mjs'
      - 'scripts/lib/section-bootstrap-lock.mjs'
      - 'scripts/ci/section-bootstrap-lock.mjs'
      - 'scripts/lib/conditional-cdn-put.sh'
      - 'scripts/ci/fast-publish-section.mjs'
      - 'scripts/ci/dispatch-fast-publish-replay.sh'
      - 'scripts/ci/resolve-workflow-run-push-range.mjs'
      - 'scripts/ci/retry-cmd.sh'
      - 'scripts/ci/fetch-push-base-if-missing.sh'
      - 'scripts/cf-purge-cache.mjs'
      - 'scripts/offload-generated-images-cdn.mjs'
      - 'scripts/lib/article-render-pipeline.mjs'
      - 'scripts/lib/cf-analytics.mjs'
      - 'scripts/lib/canton-hub-data.mjs'
      - 'scripts/lib/canton-hub-content.mjs'
      - 'scripts/lib/cdn-asset-existence.mjs'
      - 'scripts/lib/cf-purge-variants.mjs'
      - 'scripts/lib/delete-cdn-file.sh'
      - 'scripts/lib/corpus-floors.mjs'
      - 'scripts/lib/corpus-sections.mjs'
      - 'scripts/lib/engine-corpus-view.mjs'
      - 'scripts/lib/sanitize-control-chars.mjs'
      - 'scripts/lib/section-registry.mjs'
      - 'scripts/lib/assert-hub-locale-slug.mjs'
      - 'scripts/lib/section-page-manifest.mjs'
      - 'scripts/lib/upload-cdn-file.sh'
      - 'scripts/lib/r2-image-lease-process.sh'
      - 'scripts/lib/r2-image-namespace-lock.mjs'
      - 'scripts/lib/r2-section-lock.mjs'
      - 'scripts/lib/is-invoked-directly.mjs'
      - 'scripts/lib/npm-ci-retry.sh'
      - 'scripts/lib/parse-positive-num.mjs'
      - 'generator/scripts/load-rc-env.mjs'
      - 'generator/scripts/lib/fetch-with-ref-timeout.mjs'
  # `sections/registry.json` and the edge API registry are published by
  # publish-api.yml. Its push-triggered run can finish after this workflow's
  # first pass; scheduled/manual runs can also change the effective API
  # surface without a new Git diff. API push completions refresh the
  # non-article surfaces of every live canton (RSS can change through API-only
  # inputs), preserve article scope from the originating diff, and merge
  # cleanup for sections no longer live.
  workflow_run:
    workflows: ['Publish article data API']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      section:
        description: 'Sezione cantonale attiva nel core (es. canton-ti)'
        required: true
        type: string
      article_ids:
        description: 'Array JSON di id articolo (vuoto = solo landing, archivio e hub)'
        required: false
        type: string
      missing_page_paths:
        description: 'Array JSON di path canonici verificati 404 dal reconciler'
        required: false
        default: '[]'
        type: string
      known_missing_page_paths:
        description: 'Array JSON di tutti i path 404 noti, anche oltre il cap del reconciler'
        required: false
        default: '[]'
        type: string
      bootstrap:
        description: 'Rendi TUTTI gli articoli della sezione (accensione di un cantone)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Rendi e valida, non caricare niente'
        required: false
        default: true
        type: boolean
      dispatch_nonce:
        description: 'Nonce opaco usato dal drain per correlare questa run'
        required: false
        default: ''
        type: string
      push_before:
        description: 'Base SHA della provenienza push esplicita (solo replay bounded)'
        required: false
        default: ''
        type: string
      push_after:
        description: 'Head SHA della provenienza push esplicita (solo replay bounded)'
        required: false
        default: ''
        type: string
      remove_stale_canton_rss_feeds:
        description: 'Rimuovi i feed RSS rimasti da una sezione demossa'
        required: false
        default: false
        type: boolean
      cleanup_inactive_surface:
        description: 'Rimuovi pagine e feed di una sezione disattivata senza renderizzarla'
        required: false
        default: false
        type: boolean
      api_release_commit:
        description: 'Commit API pubblicato dalla run originaria (solo replay bounded)'
        required: false
        default: ''
        type: string
      source_commit:
        description: 'Commit del corpus da checkoutare nel replay bounded'
        required: false
        default: ''
        type: string
      source_main_commit:
        description: 'HEAD di main osservata quando e’ stato preparato il replay bounded'
        required: false
        default: ''
        type: string
      replay_api_after_publish:
        description: 'Dopo uno staged backfill, ripubblica API sulla stessa HEAD verificata'
        required: false
        default: false
        type: boolean
      allow_deferred_live_release:
        description: 'Dopo uno staged backfill, mantieni il manifest differito senza dispatchare il replay API'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'schedule' ||
        github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    # Checkout plus runner teardown occasionally outlive the normal fast path;
    # keep a successful resolution from being cancelled by transient runner
    # overhead while still bounding a genuinely stuck resolver.
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
      dry: ${{ steps.plan.outputs.dry }}
      bootstrap: ${{ steps.plan.outputs.bootstrap }}
      replay_api_after_publish: ${{ steps.plan.outputs.replay_api_after_publish }}
      allow_deferred_live_release: ${{ steps.plan.outputs.allow_deferred_live_release }}
      push_before: ${{ steps.push_range.outputs.before }}
      push_after: ${{ steps.push_range.outputs.after }}
    steps:
      - name: Checkout (resolve)
        uses: actions/checkout@v7
        with:
          # Normal non-bootstrap cover-drain dispatches carry article ids, not
          # a source commit: resolve the live dispatch ref. workflow_run,
          # bounded replays, and bootstrap keep their exact source revision.
          ref: ${{ github.event.workflow_run.head_sha || inputs.source_commit || (github.event_name == 'workflow_dispatch' && inputs.bootstrap != true && github.ref) || github.sha }}
          fetch-depth: 2
          # The resolve gate reads the source corpus and publisher code, but
          # never generated `data/`, `dist/`, or `public/`. Keep those large
          # trees out of the shallow fetch so an intermittent GitHub transfer
          # cannot consume the whole resolve budget before the gate starts.
          filter: blob:none
          sparse-checkout: |
            /*
            !/data
            !/dist
            !/public
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve originating push range
        id: push_range
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          DISPATCH_PUSH_BEFORE: ${{ inputs.push_before }}
          DISPATCH_PUSH_AFTER: ${{ inputs.push_after }}
          SOURCE_COMMIT_INPUT: ${{ inputs.source_commit }}
          SOURCE_MAIN_COMMIT_INPUT: ${{ inputs.source_main_commit }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          before="${PUSH_BEFORE:-}"
          after="${PUSH_AFTER:-}"
          if [ "$EVENT_NAME" = 'workflow_run' ]; then
            if [ -z "${WORKFLOW_RUN_HEAD_SHA:-}" ] || ! [[ "$WORKFLOW_RUN_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]; then
              echo "::error::workflow_run head SHA non valido"
              exit 1
            fi
            if [ "$WORKFLOW_RUN_EVENT" = 'push' ]; then
              range_output="$(
                REPO="$REPO" \
                WORKFLOW_RUN_HEAD_SHA="$WORKFLOW_RUN_HEAD_SHA" \
                WORKFLOW_RUN_ID="$WORKFLOW_RUN_ID" \
                  node scripts/ci/resolve-workflow-run-push-range.mjs
              )"
              before=''
              after=''
              range_source=''
              while IFS='=' read -r key value; do
                case "$key" in
                  before) before="$value" ;;
                  after) after="$value" ;;
                  source) range_source="$value" ;;
                esac
              done <<< "$range_output"
              if [ "$after" != "$WORKFLOW_RUN_HEAD_SHA" ]; then
                echo "::error::resolver della push ha restituito una HEAD inattesa: $after"
                exit 1
              fi
              echo "::notice::range push originaria risolta via $range_source: $before -> $after"
            elif [ "$WORKFLOW_RUN_EVENT" != 'schedule' ] && [ "$WORKFLOW_RUN_EVENT" != 'workflow_dispatch' ]; then
              echo "::error::workflow_run event non supportato: $WORKFLOW_RUN_EVENT"
              exit 1
            fi
          elif [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            if [ -n "${SOURCE_COMMIT_INPUT:-}" ] && ! [[ "$SOURCE_COMMIT_INPUT" =~ ^[a-f0-9]{40}$ ]]; then
              echo "::error::source_commit richiede una SHA completa"
              exit 1
            fi
            if [ -n "${SOURCE_COMMIT_INPUT:-}" ]; then
              if [ -z "${SOURCE_MAIN_COMMIT_INPUT:-}" ] || ! [[ "$SOURCE_MAIN_COMMIT_INPUT" =~ ^[a-f0-9]{40}$ ]]; then
                echo "::error::source_main_commit e' obbligatorio e richiede una SHA completa quando source_commit e' valorizzato"
                exit 1
              fi
              if [ "$SOURCE_COMMIT_INPUT" != "$SOURCE_MAIN_COMMIT_INPUT" ]; then
                echo "::error::source_commit deve coincidere con source_main_commit nel replay bounded"
                exit 1
              fi
              if [ "$(git rev-parse HEAD)" != "$SOURCE_COMMIT_INPUT" ]; then
                echo "::error::checkout non coincide con source_commit"
                exit 1
              fi
            fi
            dispatch_before="${DISPATCH_PUSH_BEFORE:-}"
            dispatch_after="${DISPATCH_PUSH_AFTER:-}"
            if [ -n "$dispatch_before" ] || [ -n "$dispatch_after" ]; then
              if [ -z "$dispatch_before" ] || [ -z "$dispatch_after" ] \
                || ! [[ "$dispatch_before" =~ ^[a-f0-9]{40}$ ]] \
                || ! [[ "$dispatch_after" =~ ^[a-f0-9]{40}$ ]]; then
                echo "::error::push_before/push_after richiedono una provenienza completa di SHA"
                exit 1
              fi
              before="$dispatch_before"
              after="$dispatch_after"
            fi
          fi
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"

      - name: Fetch push base (resolve)
        env:
          PUSH_BEFORE: ${{ steps.push_range.outputs.before }}
        run: |
          bash scripts/ci/fetch-push-base-if-missing.sh

      - name: Preflight — i link Markdown devono avere una destinazione canonica
        env:
          BEFORE: ${{ steps.push_range.outputs.before }}
          AFTER: ${{ steps.push_range.outputs.after }}
          ARTICLE_IDS_INPUT: ${{ inputs.article_ids }}
          SECTION_INPUT: ${{ inputs.section }}
        run: |
          set -euo pipefail
          changed_files="$RUNNER_TEMP/fast-publish-section-changed-bodies.txt"
          : > "$changed_files"
          scan_mode=full
          # Keep this dependency closure identical to publish-api.yml. A mixed
          # push that changes a body and its gate must scan the full corpus.
          gate_input_paths=(
            .github/workflows/fast-publish-section.yml
            .github/workflows/publish-api.yml
            engine/articleSeoFallback.ts
            engine/ogPagesPlugin.ts
            engine/rssFeeds.mjs
            engine/shared/articleSectionCore.mjs
            engine/shared/cantonArticleSectionCore.generated.mjs
            engine/shared/normalizeArticleMarkdown.ts
            generator/data/canton-url-slugs.json
            generator/data/canton-sections.json
            generator/scripts/lib/corpus-paths.mjs
            host/cantonSectionsBootstrap.mjs
            scripts/ci/check-blog-body-links.mjs
            scripts/lib/article-link-contract.mjs
            scripts/lib/corpus-sections.mjs
            generator/scripts/lib/article-meta-block.mjs
            generator/scripts/lib/article-excerpt.mjs
          )
          if [[ "${BEFORE:-}" =~ ^[a-f0-9]{40}$ ]] \
            && [[ "${AFTER:-}" =~ ^[a-f0-9]{40}$ ]] \
            && [ "$BEFORE" != '0000000000000000000000000000000000000000' ] \
            && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null \
            && git cat-file -e "${AFTER}^{commit}" 2>/dev/null; then
            if git diff --quiet "$BEFORE" "$AFTER" -- "${gate_input_paths[@]}" 2>/dev/null; then
              git diff --name-only "$BEFORE" "$AFTER" -- content > "$changed_files"
              if [ -s "$changed_files" ]; then scan_mode=changed; fi
            fi
          fi
          PREFLIGHT_SCAN_MODE="$scan_mode" \
            PREFLIGHT_ARTICLE_IDS="${ARTICLE_IDS_INPUT:-}" \
            PREFLIGHT_SECTION="${SECTION_INPUT:-}" \
            PREFLIGHT_CHANGED_FILES_FILE="$changed_files" \
            node scripts/ci/check-blog-body-links.mjs

      # Solo builtin Node (fast-publish-section.mjs): niente setup-node/npm ci
      # per decidere se c'e' qualcosa da pubblicare.
      - name: Resolve sections and article ids
        id: plan
        env:
          SECTION_INPUT: ${{ inputs.section }}
          ARTICLE_IDS_INPUT: ${{ inputs.article_ids }}
          MISSING_PAGE_PATHS_INPUT: ${{ inputs.missing_page_paths }}
          KNOWN_MISSING_PAGE_PATHS_INPUT: ${{ inputs.known_missing_page_paths }}
          BOOTSTRAP_INPUT: ${{ inputs.bootstrap }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          REMOVE_STALE_INPUT: ${{ inputs.remove_stale_canton_rss_feeds }}
          CLEANUP_INACTIVE_SURFACE_INPUT: ${{ inputs.cleanup_inactive_surface }}
          REPLAY_API_INPUT: ${{ inputs.replay_api_after_publish }}
          ALLOW_DEFERRED_LIVE_RELEASE_INPUT: ${{ inputs.allow_deferred_live_release }}
          EVENT_NAME: ${{ github.event_name }}
          COVER_DRAIN_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          WORKFLOW_RUN_COVER_DRAIN_COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          PUSH_BEFORE: ${{ steps.push_range.outputs.before }}
          PUSH_AFTER: ${{ steps.push_range.outputs.after }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_COMMIT_INPUT: ${{ inputs.source_commit }}
          SOURCE_MAIN_COMMIT_INPUT: ${{ inputs.source_main_commit }}
          DISPATCH_NONCE_INPUT: ${{ inputs.dispatch_nonce }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          # A workflow_run or a bounded workflow_dispatch can be queued after
          # main has moved while the edge pointer is still between releases.
          # Reconcile against the pinned/current release and retry within the
          # resolve budget instead of turning a harmless stale replay into a
          # deterministic red run before the publish freshness guard.
          reconcile_edge_matrix() {
            local expected_commit="${1:-}"
            local fallback_commit="${2:-}"
            local source_dir="${3:-$PWD}"
            local deadline=$(( SECONDS + 8 * 60 ))
            local attempt=0
            local matrix=''
            local remaining=0
            local attempt_timeout=0
            local delay=0
            local max_attempt_seconds=30
            if ! command -v timeout >/dev/null 2>&1; then
              echo "::error::timeout command unavailable; refusing an unbounded edge reconciliation" >&2
              return 1
            fi
            reconcile_edge_attempt() {
              local candidate="${1:-}"
              local budget_seconds="${2:-0}"
              local candidate_timeout="$budget_seconds"
              if [ "$candidate_timeout" -gt "$max_attempt_seconds" ]; then
                candidate_timeout="$max_attempt_seconds"
              fi
              if [ "$candidate_timeout" -le 0 ]; then
                return 124
              fi
              (
                cd "$source_dir"
                timeout --signal=TERM --kill-after=1s "${candidate_timeout}s" \
                  node scripts/ci/fast-publish-section.mjs r2-reconcile-plan "$candidate"
              ) \
                | jq -c 'map(. + {bootstrap: (.bootstrap // false)})'
            }
            while (( SECONDS < deadline )); do
              remaining=$(( deadline - SECONDS ))
              if [ "$remaining" -le 0 ]; then break; fi
              attempt=$((attempt + 1))
              attempt_timeout="$remaining"
              if [ "$attempt_timeout" -gt "$max_attempt_seconds" ]; then
                attempt_timeout="$max_attempt_seconds"
              fi
              if matrix="$(reconcile_edge_attempt "$expected_commit" "$attempt_timeout")"; then
                printf '%s' "$matrix"
                return 0
              fi
              remaining=$(( deadline - SECONDS ))
              if [ "$remaining" -gt 0 ] && [ -n "$fallback_commit" ] && [ "$fallback_commit" != "$expected_commit" ]; then
                attempt=$((attempt + 1))
                attempt_timeout="$remaining"
                if [ "$attempt_timeout" -gt "$max_attempt_seconds" ]; then
                  attempt_timeout="$max_attempt_seconds"
                fi
                if matrix="$(reconcile_edge_attempt "$fallback_commit" "$attempt_timeout")"; then
                  echo "::notice::registro edge coerente sulla release $fallback_commit dopo il tentativo $attempt" >&2
                  printf '%s' "$matrix"
                  return 0
                fi
              fi
              remaining=$(( deadline - SECONDS ))
              if [ "$remaining" -le 0 ]; then break; fi
              delay=5
              if [ "$remaining" -lt "$delay" ]; then delay="$remaining"; fi
              echo "::notice::registro edge in transizione; ritento il piano di riconciliazione tra ${delay} secondi (tentativo $attempt, budget residuo ${remaining}s)" >&2
              sleep "$delay"
            done
            echo "::error::registro edge non coerente dopo $attempt tentativi; nessun replay verra' accodato" >&2
            return 1
          }
          if [ "$EVENT_NAME" = 'push' ] || { [ "$EVENT_NAME" = 'workflow_run' ] && [ "$WORKFLOW_RUN_EVENT" = 'push' ]; }; then
            cover_drain_message="${COVER_DRAIN_COMMIT_MESSAGE:-}"
            if [ "$EVENT_NAME" = 'workflow_run' ]; then
              cover_drain_message="${WORKFLOW_RUN_COVER_DRAIN_COMMIT_MESSAGE:-}"
            fi
            export COVER_DRAIN_COMMIT_MESSAGE="$cover_drain_message"
            cover_drain_marker="$(node scripts/ci/cover-drain-commit.mjs is-cover-drain)"
            if [ "$cover_drain_marker" = 'true' ]; then
              echo 'cover-drain push is handled by the explicit publisher outbox dispatch; skipping automatic section publishing'
              {
                echo 'matrix=[]'
                echo 'any=false'
                echo 'dry=false'
                echo 'replay_api_after_publish=false'
                echo 'allow_deferred_live_release=false'
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          pinned_source=''
          if [ "$EVENT_NAME" = 'workflow_run' ]; then
            pinned_source="${WORKFLOW_RUN_HEAD_SHA:-}"
          elif [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ -n "${SOURCE_COMMIT_INPUT:-}" ]; then
            pinned_source="${SOURCE_MAIN_COMMIT_INPUT:-$SOURCE_COMMIT_INPUT}"
          fi
          if [ -n "$pinned_source" ]; then
            if ! current_main="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"; then
              echo "::error::impossibile verificare la revisione corrente di main prima del piano"
              exit 1
            fi
            if ! [[ "$current_main" =~ ^[a-f0-9]{40}$ ]]; then
              echo "::error::revisione corrente di main non valida prima del piano"
              exit 1
            fi
            if [ "$current_main" != "$pinned_source" ]; then
              echo "::notice::replay stantio saltato nel resolve: main e' avanzata da $pinned_source a $current_main"
              if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
                echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON assente: impossibile redispatchare il replay stantio"
                exit 1
              fi
              resolve_sa="$RUNNER_TEMP/fast-publish-section-resolve-sa.json"
              printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$resolve_sa"
              rc_exports="$(
                env -u GITHUB_ENV \
                  GOOGLE_APPLICATION_CREDENTIALS="$resolve_sa" \
                  node generator/scripts/load-rc-env.mjs
              )"
              eval "$rc_exports"
              runtime_pat="${GITHUB_PAT_NANAKO:-}"
              if [ -z "$runtime_pat" ]; then
                echo "::error::GITHUB_PAT_NANAKO assente: impossibile redispatchare il replay stantio"
                exit 1
              fi
              export GH_TOKEN="$runtime_pat"
              dispatch_stale_replay() {
                local section="${1:-}"
                local article_ids="${2:-[]}"
                local missing_page_paths="${3:-[]}"
                local known_missing_page_paths="${4:-[]}"
                local bootstrap="${5:-false}"
                local remove_stale="${6:-false}"
                local dry="${7:-false}"
                local replay_api_after_publish="${8:-false}"
                local allow_deferred_live_release="${9:-false}"
                local replay_before="${10:-}"
                local replay_after="${11:-}"
                local dispatch_nonce="${12:-}"
                local cleanup_inactive_surface="${13:-false}"
                local nonce_seed="$dispatch_nonce"
                local nonce_hash=''
                local dispatch_title=''
                [ -n "$section" ] || { echo "::error::sezione assente nel redispatch stale"; return 1; }
                if [ -z "$nonce_seed" ]; then
                  nonce_seed='stale-resolve'
                fi
                nonce_hash="$(printf '%s\0%s\0%s' "$nonce_seed" "$current_main" "$section" | sha256sum | cut -c1-16)"
                dispatch_nonce="stale-resolve-${current_main:0:12}-${section}-${nonce_hash}"
                dispatch_title="cover-publish-section / ${section} / nonce=${dispatch_nonce}"
                if bash scripts/ci/dispatch-fast-publish-replay.sh "$REPO" "$dispatch_title" --ref main \
                  -f section="$section" \
                  -f article_ids="$article_ids" \
                  -f missing_page_paths="$missing_page_paths" \
                  -f known_missing_page_paths="$known_missing_page_paths" \
                  -f bootstrap="$bootstrap" \
                  -f remove_stale_canton_rss_feeds="$remove_stale" \
                  -f cleanup_inactive_surface="$cleanup_inactive_surface" \
                  -f replay_api_after_publish="$replay_api_after_publish" \
                  -f allow_deferred_live_release="$allow_deferred_live_release" \
                  -f source_commit="$current_main" \
                  -f source_main_commit="$current_main" \
                  -f dry_run="$dry" \
                  -f push_before="$replay_before" \
                  -f push_after="$replay_after" \
                  -f dispatch_nonce="$dispatch_nonce"; then
                  return 0
                fi
                echo "::error::replay non accodato per $section sulla HEAD $current_main"
                return 1
              }
              replay_dry=false
              replay_api_after_publish=false
              allow_deferred_live_release=false
              replay_before="${PUSH_BEFORE:-}"
              replay_after=''
              if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
                replay_dry="${DRY_RUN_INPUT:-true}"
                replay_api_after_publish="${REPLAY_API_INPUT:-false}"
                allow_deferred_live_release="${ALLOW_DEFERRED_LIVE_RELEASE_INPUT:-false}"
                replay_before="${PUSH_BEFORE:-}"
                # The source checkout is current_main. Keep a push range only
                # when it has a base, and always end that range at current_main
                # so a stale head cannot select an older API release.
                if [ -n "$replay_before" ]; then
                  replay_after="$current_main"
                fi
                dispatch_stale_replay \
                  "$SECTION_INPUT" \
                  "${ARTICLE_IDS_INPUT:-[]}" \
                  "${MISSING_PAGE_PATHS_INPUT:-[]}" \
                  "${KNOWN_MISSING_PAGE_PATHS_INPUT:-[]}" \
                  "${BOOTSTRAP_INPUT:-false}" \
                  "${REMOVE_STALE_INPUT:-false}" \
                  "$replay_dry" \
                  "$replay_api_after_publish" \
                  "$allow_deferred_live_release" \
                  "$replay_before" \
                  "$replay_after" \
                  "${DISPATCH_NONCE_INPUT:-}" \
                  "${CLEANUP_INACTIVE_SURFACE_INPUT:-false}"
              else
                if [ -n "$replay_before" ]; then
                  replay_after="$current_main"
                fi
                # The edge candidate may be pinned to the stale run, but the
                # matrix shape must come from current main so new or activated
                # sections are included in the replay.
                current_main_source="$RUNNER_TEMP/fast-publish-section-current-main-${GITHUB_RUN_ID}"
                cleanup_current_main_source() {
                  if [ -e "$current_main_source" ]; then
                    rm -rf -- "$current_main_source"
                  fi
                }
                trap cleanup_current_main_source EXIT
                if [ -e "$current_main_source" ]; then
                  echo "::error::snapshot temporaneo gia' esistente: $current_main_source"
                  exit 1
                fi
                if ! git fetch --no-tags --depth=1 origin \
                  "refs/heads/main:refs/remotes/origin/fast-publish-current-main"; then
                  echo "::error::impossibile scaricare la HEAD corrente di main per il piano stale"
                  exit 1
                fi
                fetched_current_main="$(git rev-parse refs/remotes/origin/fast-publish-current-main)"
                if [ "$fetched_current_main" != "$current_main" ]; then
                  echo "::error::main e' avanzata durante la preparazione del piano stale ($current_main -> $fetched_current_main)"
                  exit 1
                fi
                if ! mkdir "$current_main_source"; then
                  echo "::error::impossibile preparare lo snapshot della HEAD corrente per il piano stale"
                  exit 1
                fi
                if ! git archive --format=tar "$current_main" -- \
                  engine host generator/data/canton-sections.json generator/scripts/lib \
                  scripts/ci/fast-publish-section.mjs scripts/lib \
                  | tar -x -C "$current_main_source"; then
                  echo "::error::impossibile materializzare il codice della HEAD corrente per il piano stale"
                  exit 1
                fi
                replay_matrix="$(reconcile_edge_matrix "$pinned_source" "$current_main" "$current_main_source")"
                dispatched=0
                failed_sections=()
                while IFS=$'\t' read -r section article_ids bootstrap remove_stale cleanup_inactive_surface; do
                  [ -n "$section" ] || continue
                  if dispatch_stale_replay \
                    "$section" "$article_ids" '[]' '[]' "$bootstrap" "$remove_stale" \
                    "$replay_dry" "$replay_api_after_publish" "$allow_deferred_live_release" \
                    "$replay_before" "$replay_after" '' "$cleanup_inactive_surface"; then
                    dispatched=$((dispatched + 1))
                  else
                    failed_sections+=("$section")
                  fi
                done < <(jq -r '.[] | [.section, ((.ids // []) | tojson), (.bootstrap // false), (.removeStaleCantonRssFeeds // false), (.cleanupInactiveSurface // false)] | @tsv' <<<"$replay_matrix")
                if (( ${#failed_sections[@]} > 0 )); then
                  printf -v failed_sections_csv '%s, ' "${failed_sections[@]}"
                  failed_sections_csv="${failed_sections_csv%, }"
                  echo "::error::replay stale non accodato per le sezioni: $failed_sections_csv"
                  exit 1
                fi
                echo "::notice::redispatch stale completato per $dispatched sezioni sulla HEAD $current_main"
              fi
              {
                echo 'matrix=[]'
                echo 'any=false'
                echo 'dry=false'
                echo 'bootstrap=false'
                echo 'replay_api_after_publish=false'
                echo 'allow_deferred_live_release=false'
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          before="${PUSH_BEFORE:-}"
          replay_api_after_publish=false
          if [ "$EVENT_NAME" = 'workflow_run' ]; then
            if [ -z "${WORKFLOW_RUN_HEAD_SHA:-}" ] || [ "$(git rev-parse HEAD)" != "$WORKFLOW_RUN_HEAD_SHA" ]; then
              echo "::error::workflow_run head non coincide con il checkout"
              exit 1
            fi
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            dry=true
            [ "$DRY_RUN_INPUT" = "false" ] && dry=false
            ids_json='[]'
            if [ -n "$ARTICLE_IDS_INPUT" ]; then
              ids_json="$(printf '%s' "$ARTICLE_IDS_INPUT" | jq -ce '
                if type == "array" and all(.[]; type == "string" and length > 0)
                then unique
                else error("article_ids must be a JSON array of article ids")
                end
              ')"
            fi
            validate_page_paths() {
              local option="$1"
              jq -ce --arg option "$option" '
                if type == "array" and all(.[]; type == "string" and test("^/[a-z0-9/-]+/$") and (contains("//") | not))
                then unique
                else error($option + " must be a JSON array of canonical paths")
                end
              '
            }
            missing_pages_json="$(printf '%s' "${MISSING_PAGE_PATHS_INPUT:-[]}" | validate_page_paths missing_page_paths)"
            known_missing_pages_json="$(printf '%s' "${KNOWN_MISSING_PAGE_PATHS_INPUT:-[]}" | validate_page_paths known_missing_page_paths)"
            bootstrap=false
            [ "$BOOTSTRAP_INPUT" = "true" ] && bootstrap=true
            remove_stale=false
            [ "$REMOVE_STALE_INPUT" = "true" ] && remove_stale=true
            [ "$REPLAY_API_INPUT" = "true" ] && replay_api_after_publish=true
            allow_deferred_live_release=false
            if [ "$REPLAY_API_INPUT" = "true" ] || [ "$ALLOW_DEFERRED_LIVE_RELEASE_INPUT" = "true" ]; then
              allow_deferred_live_release=true
            fi
            if [ "$bootstrap" = "true" ] && [ "$ids_json" != "[]" ]; then
              echo "::error::bootstrap rende tutti gli articoli: non si combina con article_ids"
              exit 1
            fi
            cleanup_inactive_surface=false
            [ "${CLEANUP_INACTIVE_SURFACE_INPUT:-false}" = "true" ] && cleanup_inactive_surface=true
            [ "$cleanup_inactive_surface" = "true" ] && remove_stale=true
            matrix="$(jq -cn --arg s "$SECTION_INPUT" --argjson ids "$ids_json" --argjson missing "$missing_pages_json" --argjson knownMissing "$known_missing_pages_json" --argjson b "$bootstrap" --argjson r "$remove_stale" --argjson c "$cleanup_inactive_surface" \
              '[{section: $s, ids: $ids, missingPagePaths: $missing, knownMissingPagePaths: $knownMissing, bootstrap: $b, removeStaleCantonRssFeeds: $r, cleanupInactiveSurface: $c}]')"
          else
            dry=false
            allow_deferred_live_release=false
            if [ "$EVENT_NAME" = 'workflow_run' ]; then
              # Ogni completion API deve leggere il registro edge della
              # release appena completata: anche una kill-switch o un hub
              # mancante puo' rendere non-live una sezione senza una
              # transizione in sections/registry.json.
              edge_matrix="$(reconcile_edge_matrix "$WORKFLOW_RUN_HEAD_SHA")"
              if [ "$WORKFLOW_RUN_EVENT" = 'push' ]; then
                if [ -z "$before" ] || [[ "$before" =~ ^0+$ ]]; then before=HEAD~1; fi
                # Il replay della push API deve riprodurre il piano dei contenuti
                # della push originaria: il primo fast-publish puo' essere
                # fallito mentre attendeva la release API, senza modificare il registro.
                diff_matrix="$(git diff --name-status "$before" HEAD 2>/dev/null \
                  | PUSH_BEFORE="$before" node scripts/ci/fast-publish-section.mjs r2-plan \
                  | jq -c 'map(. + {bootstrap: (.bootstrap // false)})')"
                # Un API push riuscito puo' cambiare RSS anche se il diff
                # contiene solo input del generatore non associabili a una
                # singola sezione. Aggiorna landing/archive/hub/RSS di tutte le
                # cantonali live, mantenendo gli articoli circoscritti al diff.
                matrix="$(printf '%s\n%s\n' "$diff_matrix" "$edge_matrix" \
                  | node scripts/ci/fast-publish-section.mjs r2-api-push-plan)"
              else
                matrix="$edge_matrix"
              fi
            else
              if [ -z "$before" ] || [[ "$before" =~ ^0+$ ]]; then before=HEAD~1; fi
              matrix="$(git diff --name-status "$before" HEAD 2>/dev/null \
                | PUSH_BEFORE="$before" node scripts/ci/fast-publish-section.mjs r2-plan \
                | jq -c 'map(. + {bootstrap: (.bootstrap // false)})')"
            fi
          fi
          # Applica i kill switch anche ai workflow_dispatch, inclusi i replay
          # stantii: l'input dry_run=false non può riarmare il publisher.
          if [ -f .github/FAST_PUBLISH_DISABLED ]; then
            echo "::warning::.github/FAST_PUBLISH_DISABLED present — running dry"
            dry=true
          elif [ "${{ vars.FAST_PUBLISH_ARMED }}" = "false" ]; then
            echo "::warning::repo variable FAST_PUBLISH_ARMED=false — running dry"
            dry=true
          fi
          any=false
          [ "$(printf '%s' "$matrix" | jq 'length')" -gt 0 ] && any=true
          bootstrap=false
          if [ "$(printf '%s' "$matrix" | jq 'any(.[]; .bootstrap == true)')" = "true" ]; then
            bootstrap=true
          fi
          {
            echo "matrix=$matrix"
            echo "any=$any"
            echo "dry=$dry"
            echo "bootstrap=$bootstrap"
            echo "replay_api_after_publish=$replay_api_after_publish"
            echo "allow_deferred_live_release=$allow_deferred_live_release"
          } >> "$GITHUB_OUTPUT"
          echo "resolved matrix=$matrix dry=$dry"

  publish:
    needs: resolve
    if: needs.resolve.outputs.any == 'true'
    runs-on: ubuntu-latest
    # Budget: fino a 55 min per il gate bootstrap, 3 checkout main x 2 tentativi
    # di render da 45 min, più margine operativo; il limite del job resta 6h.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    concurrency:
      group: fast-publish-${{ matrix.target.section }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Keep normal non-bootstrap cover-drain dispatches on the live ref;
          # workflow_run, bounded replay, and bootstrap may pin an older
          # source commit.
          ref: ${{ github.event.workflow_run.head_sha || inputs.source_commit || (github.event_name == 'workflow_dispatch' && inputs.bootstrap != true && github.ref) || github.sha }}
          # resolvePublishedReleaseCommit() verifica la release API con
          # merge-base: una release precedente puo' essere fuori dai due
          # commit che actions/checkout scarica di default.
          fetch-depth: 0
          persist-credentials: false

      - name: Guard pinned replay freshness
        id: replay_freshness
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PINNED_SOURCE_COMMIT: ${{ inputs.source_commit }}
          PINNED_SOURCE_MAIN: ${{ inputs.source_main_commit }}
        run: |
          set -euo pipefail
          pinned_source=''
          if [ "$EVENT_NAME" = 'workflow_run' ]; then
            pinned_source="${WORKFLOW_RUN_HEAD_SHA:-}"
          elif [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ -n "${PINNED_SOURCE_COMMIT:-}" ]; then
            pinned_source="${PINNED_SOURCE_MAIN:-$PINNED_SOURCE_COMMIT}"
          else
            echo 'fresh=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$pinned_source" ] || ! [[ "$pinned_source" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::revisione pinned non valida per il guard di freschezza"
            exit 1
          fi
          if ! current_main="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"; then
            echo "::error::impossibile verificare la revisione corrente di main prima del replay"
            exit 1
          fi
          if ! [[ "$current_main" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::revisione corrente di main non valida"
            exit 1
          fi
          echo "current_main=$current_main" >> "$GITHUB_OUTPUT"
          if [ "$current_main" != "$pinned_source" ]; then
            echo "::notice::replay pinned saltato: main e' avanzata da $pinned_source a $current_main"
            echo 'fresh=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'fresh=true' >> "$GITHUB_OUTPUT"

      # Un replay stantio usa il workflow corrente su main e la sua HEAD come
      # sorgente del corpus. Per una run API osservata conserva P come release
      # solo se P copre tutti gli input raggiungibili dalla HEAD corrente;
      # un bounded dispatch riparte senza il vecchio override e lascia che il
      # publisher ricalcoli una release compatibile. In entrambi i casi, se la
      # release corrente non e' pronta il replay resta in attesa invece di
      # creare una superficie mista.
      - name: Prepare Firebase credentials for stale replay recovery
        if: steps.replay_freshness.outputs.fresh == 'false'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not set — Remote Config is the only source of the dispatch token"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/stale-replay-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/stale-replay-sa.json" >> "$GITHUB_ENV"

      - name: Load dispatch token for stale replay recovery
        if: steps.replay_freshness.outputs.fresh == 'false'
        run: node generator/scripts/load-rc-env.mjs

      - name: Dispatch bounded replay with current corpus checkout
        if: steps.replay_freshness.outputs.fresh == 'false'
        env:
          REPO: ${{ github.repository }}
          SECTION: ${{ matrix.target.section }}
          ARTICLE_IDS_JSON: ${{ toJSON(matrix.target.ids) }}
          MISSING_PAGE_PATHS_JSON: ${{ toJSON(matrix.target.missingPagePaths || fromJSON('[]')) }}
          KNOWN_MISSING_PAGE_PATHS_JSON: ${{ toJSON(matrix.target.knownMissingPagePaths || fromJSON('[]')) }}
          BOOTSTRAP: ${{ matrix.target.bootstrap }}
          REMOVE_STALE_CANTON_RSS_FEEDS: ${{ matrix.target.removeStaleCantonRssFeeds || false }}
          CLEANUP_INACTIVE_SURFACE: ${{ matrix.target.cleanupInactiveSurface || false }}
          ALLOW_DEFERRED_LIVE_RELEASE: ${{ needs.resolve.outputs.allow_deferred_live_release }}
          DRY: ${{ needs.resolve.outputs.dry }}
          REPLAY_API_AFTER_PUBLISH: ${{ inputs.replay_api_after_publish }}
          STALE_HEAD: ${{ github.event.workflow_run.head_sha }}
          CURRENT_MAIN: ${{ steps.replay_freshness.outputs.current_main }}
          ORIGINAL_PUSH_BEFORE: ${{ needs.resolve.outputs.push_before }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
        run: |
          set -euo pipefail
          runtime_pat="${GITHUB_PAT_NANAKO:-}"
          if [ -z "$runtime_pat" ]; then
            echo "::error::GITHUB_PAT_NANAKO assente: impossibile redispatchare il replay stantio"
            exit 1
          fi
          export GH_TOKEN="$runtime_pat"
          dispatch_nonce="${DISPATCH_NONCE:-}"
          if [ -z "$dispatch_nonce" ]; then
            dispatch_nonce="stale-publish-${GITHUB_RUN_ID}-${SECTION}"
          fi
          dispatch_title="cover-publish-section / ${SECTION} / nonce=${dispatch_nonce}"
          replay_before="${ORIGINAL_PUSH_BEFORE:-$STALE_HEAD}"
          replay_after=''
          if [ -n "$replay_before" ]; then
            # The redispatch checks out CURRENT_MAIN; an old push_after would
            # make release resolution inspect the stale replay range.
            replay_after="$CURRENT_MAIN"
          fi
          api_release_commit=''
          if [ -n "${STALE_HEAD:-}" ]; then
            if ! [[ "$STALE_HEAD" =~ ^[a-f0-9]{40}$ ]]; then
              echo "::error::head API stantia non valida per il recovery workflow_run"
              exit 1
            fi
            if [ "$(git rev-parse --is-shallow-repository)" = 'true' ]; then
              git fetch --no-tags --unshallow origin main
            else
              git fetch --no-tags origin main
            fi
            api_release_commit="$(
              CURRENT_MAIN="$CURRENT_MAIN" STALE_API_RELEASE="$STALE_HEAD" node --input-type=module -e '
                import { resolveStaleReplayApiReleaseCommit } from "./scripts/publish-section-pages.mjs";
                process.stdout.write(resolveStaleReplayApiReleaseCommit(
                  process.env.CURRENT_MAIN,
                  process.env.STALE_API_RELEASE,
                ));
              '
            )"
            if [ "$api_release_commit" = "$CURRENT_MAIN" ]; then
              echo "::notice::release API stantia non copre la HEAD corrente; il replay ricalcolera' la release senza override"
              api_release_commit=''
            else
              echo "::notice::replay stantio: release API attesa $api_release_commit"
            fi
          else
            # Un bounded dispatch deve ripartire senza la release osservata:
            # il publisher ricalcola quella compatibile con la HEAD corrente.
            echo "::notice::replay bounded stantio: ricalcolo la release API sulla HEAD $CURRENT_MAIN"
          fi
          bash scripts/ci/dispatch-fast-publish-replay.sh "$REPO" "$dispatch_title" --ref main \
            -f section="$SECTION" \
            -f article_ids="$ARTICLE_IDS_JSON" \
            -f missing_page_paths="$MISSING_PAGE_PATHS_JSON" \
            -f known_missing_page_paths="$KNOWN_MISSING_PAGE_PATHS_JSON" \
            -f bootstrap="$BOOTSTRAP" \
            -f remove_stale_canton_rss_feeds="$REMOVE_STALE_CANTON_RSS_FEEDS" \
            -f cleanup_inactive_surface="$CLEANUP_INACTIVE_SURFACE" \
            -f replay_api_after_publish="$REPLAY_API_AFTER_PUBLISH" \
            -f allow_deferred_live_release="$ALLOW_DEFERRED_LIVE_RELEASE" \
            -f api_release_commit="$api_release_commit" \
            -f source_commit="$CURRENT_MAIN" \
            -f source_main_commit="$CURRENT_MAIN" \
            -f dry_run="$DRY" \
            -f push_before="$replay_before" \
            -f push_after="$replay_after" \
            -f dispatch_nonce="$dispatch_nonce"

      - name: Fetch fallback corpus revision for manifest migration
        if: steps.replay_freshness.outputs.fresh == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ needs.resolve.outputs.push_before }}
          PUSH_AFTER: ${{ needs.resolve.outputs.push_after }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_run' ]; then
            if [ -z "${WORKFLOW_RUN_HEAD_SHA:-}" ] || [ "$(git rev-parse HEAD)" != "$WORKFLOW_RUN_HEAD_SHA" ]; then
              echo "::error::workflow_run head non coincide con il checkout"
              exit 1
            fi
          fi
          bash scripts/ci/fetch-push-base-if-missing.sh

      - name: Set up Node
        if: steps.replay_freshness.outputs.fresh == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.replay_freshness.outputs.fresh == 'true'
        run: |
          set -euo pipefail
          bash scripts/lib/npm-ci-retry.sh
          lock_hash="$(sha256sum package.json package-lock.json | sha256sum | cut -d' ' -f1)"
          echo "INSTALLED_DEPENDENCY_LOCK_HASH=$lock_hash" >> "$GITHUB_ENV"

      # Remote Config e' la sola sorgente delle credenziali R2 e Cloudflare.
      # In dry non servono: il render e la validazione girano comunque.
      - name: Prepare Firebase credentials
        if: steps.replay_freshness.outputs.fresh == 'true' && needs.resolve.outputs.dry != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not set — Remote Config is the only source of the R2 and Cloudflare credentials"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config
        if: steps.replay_freshness.outputs.fresh == 'true' && needs.resolve.outputs.dry != 'true'
        run: node generator/scripts/load-rc-env.mjs

      # Un upload che «salta» per credenziali assenti esce 0 da
      # upload-cdn-file.sh: qui l'assenza deve fermare il job PRIMA del render,
      # non diventare una pubblicazione verde che non ha caricato niente.
      - name: Require the R2 and Cloudflare credentials
        if: steps.replay_freshness.outputs.fresh == 'true' && needs.resolve.outputs.dry != 'true'
        run: |
          set -euo pipefail
          missing=()
          for v in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_S3_ENDPOINT R2_BUCKET CF_API_TOKEN; do
            [ -n "${!v:-}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::missing after the Remote Config load: ${missing[*]}"
            exit 1
          fi

      # Le pagine rese qui prendono la shell da `host/`. Il riferimento a
      # `/assets/gtag-init-<hash>.js` ha il nome derivato dal contenuto: cambia
      # ogni volta che il sito cambia quei byte, e l'oggetto arriva sulla CDN
      # solo con un deploy completo del sito, ore dopo che il contratto puo'
      # arrivare qui. Il 2026-10-07 gli emettitori veloci del sito hanno
      # pubblicato quel riferimento prima del file: 404 su ogni articolo
      # rirenderizzato per 2 h 40 min (sito issue 12270). Questo passo carica
      # il file se la CDN non lo ha, non sostituisce mai un oggetto e ferma il
      # job se non riesce a stabilirlo: scripts/ci/ensure-host-shell-assets.mjs.
      - name: Ensure the host shell assets are on the CDN
        if: steps.replay_freshness.outputs.fresh == 'true' && needs.resolve.outputs.dry != 'true'
        run: bash scripts/ci/retry-cmd.sh npx -y tsx@4.23.15 scripts/ci/ensure-host-shell-assets.mjs

      # Un bootstrap di una sezione gia' live carica HTML mentre il publisher
      # API prepara la stessa release. Il gate R2 viene acquisito PRIMA del
      # render e rilasciato anche su errore: publish-section-edge aspetta il
      # suo sblocco prima di fare il PUT del registro. Se publish-api ha vinto
      # la gara di avvio, il bootstrap attende il lease edge-publisher e
      # riprende dopo il suo rilascio; il replay API successivo riallinea il
      # registry alla nuova superficie HTML.
      - name: Acquire bootstrap R2 gate
        id: acquire_bootstrap
        if: steps.replay_freshness.outputs.fresh == 'true' && needs.resolve.outputs.dry != 'true' && matrix.target.bootstrap == true
        env:
          SECTION: ${{ matrix.target.section }}
          LOCK_WAIT_MS: 3300000
          LOCK_RETRY_MS: 20000
        run: node scripts/ci/section-bootstrap-lock.mjs acquire --section "$SECTION" --commit "$(git rev-parse HEAD)" --wait-ms "$LOCK_WAIT_MS" --retry-ms "$LOCK_RETRY_MS"

      - name: Render, validate and publish the section pages
        if: steps.replay_freshness.outputs.fresh == 'true'
        env:
          SECTION: ${{ matrix.target.section }}
          ARTICLE_IDS_JSON: ${{ toJSON(matrix.target.ids) }}
          MISSING_PAGE_PATHS_JSON: ${{ toJSON(matrix.target.missingPagePaths || fromJSON('[]')) }}
          KNOWN_MISSING_PAGE_PATHS_JSON: ${{ toJSON(matrix.target.knownMissingPagePaths || fromJSON('[]')) }}
          BOOTSTRAP: ${{ matrix.target.bootstrap }}
          DRY: ${{ needs.resolve.outputs.dry }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ needs.resolve.outputs.push_before }}
          PUSH_AFTER: ${{ needs.resolve.outputs.push_after }}
          REMOVE_STALE_CANTON_RSS_FEEDS: ${{ matrix.target.removeStaleCantonRssFeeds || false }}
          CLEANUP_INACTIVE_SURFACE: ${{ matrix.target.cleanupInactiveSurface || false }}
          API_RELEASE_COMMIT: ${{ inputs.api_release_commit }}
          ALLOW_DEFERRED_LIVE_RELEASE: ${{ needs.resolve.outputs.allow_deferred_live_release }}
          REPLAY_API_AFTER_PUBLISH: ${{ needs.resolve.outputs.replay_api_after_publish }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_MAIN_COMMIT: ${{ inputs.source_main_commit }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          REF: ${{ github.ref }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_MAIN_HEAD: ${{ github.event.workflow_run.head_sha || inputs.source_main_commit || github.event.after || github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "${SOURCE_COMMIT:-}" ]; then
            if [ -z "${SOURCE_MAIN_COMMIT:-}" ] || ! [[ "$SOURCE_MAIN_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
              echo "::error::source_main_commit e' obbligatorio e richiede una SHA completa quando source_commit e' valorizzato"
              exit 1
            fi
            if ! [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
              echo "::error::source_commit richiede una SHA completa"
              exit 1
            fi
            if [ "$SOURCE_COMMIT" != "$SOURCE_MAIN_COMMIT" ]; then
              echo "::error::source_commit deve coincidere con source_main_commit nel replay bounded"
              exit 1
            fi
            if [ "$(git rev-parse HEAD)" != "$SOURCE_COMMIT" ]; then
              echo "::error::checkout non coincide con source_commit"
              exit 1
            fi
          fi
          pinned_replay_main=''
          if [ "$EVENT_NAME" = 'workflow_run' ]; then
            pinned_replay_main="$WORKFLOW_RUN_HEAD_SHA"
          elif [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ -n "${SOURCE_COMMIT:-}" ]; then
            pinned_replay_main="$SOURCE_MAIN_COMMIT"
          fi
          if [ -n "$pinned_replay_main" ]; then
            if ! current_main="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"; then
              echo "::error::impossibile verificare la revisione corrente di main prima degli upload"
              exit 1
            fi
            if ! [[ "$current_main" =~ ^[a-f0-9]{40}$ ]]; then
              echo "::error::revisione corrente di main non valida prima degli upload"
              exit 1
            fi
            if [ "$current_main" != "$pinned_replay_main" ]; then
              runtime_pat="${GITHUB_PAT_NANAKO:-}"
              if [ -z "$runtime_pat" ]; then
                echo "::error::GITHUB_PAT_NANAKO assente: impossibile redispatchare il replay stantio prima degli upload"
                exit 1
              fi
              export GH_TOKEN="$runtime_pat"
              dispatch_nonce="${DISPATCH_NONCE:-}"
              if [ -z "$dispatch_nonce" ]; then
                dispatch_nonce="stale-late-${GITHUB_RUN_ID}-${SECTION}"
              fi
              if [ "$EVENT_NAME" = 'workflow_run' ]; then
                echo "::notice::replay workflow_run redispatchato prima degli upload: main e' avanzato da $pinned_replay_main a $current_main"
              else
                echo "::notice::replay bounded redispatchato prima degli upload: main e' avanzato da $pinned_replay_main a $current_main"
              fi
              replay_before="${PUSH_BEFORE:-$pinned_replay_main}"
              replay_after=''
              if [ -n "$replay_before" ]; then
                # The replay source is current_main; do not retain the old
                # range head or release selection.
                replay_after="$current_main"
              fi
              api_release_commit=''
              if [ "$EVENT_NAME" = 'workflow_run' ]; then
                if [ "$(git rev-parse --is-shallow-repository)" = 'true' ]; then
                  git fetch --no-tags --unshallow origin main
                else
                  git fetch --no-tags origin main
                fi
                api_release_commit="$(
                  CURRENT_MAIN="$current_main" STALE_API_RELEASE="$pinned_replay_main" node --input-type=module -e '
                    import { resolveStaleReplayApiReleaseCommit } from "./scripts/publish-section-pages.mjs";
                    process.stdout.write(resolveStaleReplayApiReleaseCommit(
                      process.env.CURRENT_MAIN,
                      process.env.STALE_API_RELEASE,
                    ));
                  '
                )"
                if [ "$api_release_commit" = "$current_main" ]; then
                  echo "::notice::release API stantia non copre la HEAD corrente; il replay ricalcolera' la release senza override"
                  api_release_commit=''
                else
                  echo "::notice::replay workflow_run: release API attesa $api_release_commit"
                fi
              fi
              dispatch_title="cover-publish-section / ${SECTION} / nonce=${dispatch_nonce}"
              bash scripts/ci/dispatch-fast-publish-replay.sh "$REPO" "$dispatch_title" --ref main \
                -f section="$SECTION" \
                -f article_ids="$ARTICLE_IDS_JSON" \
                -f missing_page_paths="$MISSING_PAGE_PATHS_JSON" \
                -f known_missing_page_paths="$KNOWN_MISSING_PAGE_PATHS_JSON" \
                -f bootstrap="$BOOTSTRAP" \
                -f remove_stale_canton_rss_feeds="$REMOVE_STALE_CANTON_RSS_FEEDS" \
                -f cleanup_inactive_surface="$CLEANUP_INACTIVE_SURFACE" \
                -f replay_api_after_publish="$REPLAY_API_AFTER_PUBLISH" \
                -f allow_deferred_live_release="$ALLOW_DEFERRED_LIVE_RELEASE" \
                -f api_release_commit="$api_release_commit" \
                -f source_commit="$current_main" \
                -f source_main_commit="$current_main" \
                -f dry_run="$DRY" \
                -f push_before="$replay_before" \
                -f push_after="$replay_after" \
                -f dispatch_nonce="$dispatch_nonce"
              exit 0
            fi
          fi
          previous_revision="${PUSH_BEFORE:-}"
          if [ "$EVENT_NAME" = 'workflow_run' ]; then
            if [ -z "${WORKFLOW_RUN_HEAD_SHA:-}" ] || [ "$(git rev-parse HEAD)" != "$WORKFLOW_RUN_HEAD_SHA" ]; then
              echo "::error::workflow_run head non coincide con il checkout"
              exit 1
            fi
          fi
          build_publish_args() {
            local dry_mode="$1"
            args=(--section "$SECTION" --out "$RUNNER_TEMP/section-dist" --summary "$RUNNER_TEMP/section-summary.json")
            if [ -n "$previous_revision" ] && [[ ! "$previous_revision" =~ ^0+$ ]]; then
              args+=(--previous-revision "$previous_revision")
            fi
            if [ "$BOOTSTRAP" = "true" ]; then
              args+=(--bootstrap)
            else
              args+=(--ids "$(printf '%s' "$ARTICLE_IDS_JSON" | jq -c .)")
            fi
            args+=(--missing-pages "$(printf '%s' "$MISSING_PAGE_PATHS_JSON" | jq -c .)")
            args+=(--known-missing-pages "$(printf '%s' "$KNOWN_MISSING_PAGE_PATHS_JSON" | jq -c .)")
            if [ "$REMOVE_STALE_CANTON_RSS_FEEDS" = "true" ]; then
              args+=(--remove-stale-canton-rss-feeds)
            fi
            if [ "$CLEANUP_INACTIVE_SURFACE" = "true" ]; then
              args+=(--cleanup-inactive-surface)
            fi
            if [ "$dry_mode" = "true" ]; then
              args+=(--dry-run)
            else
              args+=(--publish)
            fi
          }
          build_publish_args "$DRY"
          # A normal cover-drain dispatch from main has no immutable source
          # commit. It must rebase onto the live main between attempts when
          # the freshness guard reports that main advanced during the render.
          # The same dispatch can safely retry a staged live release while the
          # API/edge pointer is still catching up: publish-section-pages writes
          # a summary proving that only the deferred, non-destructive phase
          # remains. Every other error stays fail-closed. workflow_run and
          # bounded replays are redispatched if their pinned source goes stale
          # before render, preserving the source/API freshness invariant.
          normal_dispatch='false'
          if [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "$REF" = 'refs/heads/main' ] && [ -z "${SOURCE_COMMIT:-}" ] && [ "$BOOTSTRAP" != 'true' ]; then
            normal_dispatch='true'
          fi
          if [ "$normal_dispatch" != 'true' ]; then
            # Attraverso il wrapper di retry (issue #98): `npx -y` scarica tsx
            # dal registro a ogni run. Ritentare l'intero comando e' sicuro:
            # il render riscrive lo stesso scratch e gli upload R2 sono PUT
            # idempotenti sulle stesse chiavi.
            bash scripts/ci/retry-cmd.sh npx -y tsx@4.23.15 scripts/publish-section-pages.mjs "${args[@]}"
            exit 0
          fi

          deferred_replay_deadline_ms=$(( $(date +%s%3N) + 30 * 60 * 1000 ))
          while :; do
            deferred_retry='false'
            for publish_attempt in 1 2 3; do
              git fetch --no-tags origin main
              # `git fetch origin main` aggiorna sempre FETCH_HEAD, ma non
              # necessariamente il ref remoto locale in un checkout Actions.
              # Il retry deve quindi usare esattamente il commit appena letto,
              # altrimenti tre tentativi ripetono la stessa vecchia revisione.
              git checkout --detach FETCH_HEAD
              export EXPECTED_MAIN_HEAD="$(git rev-parse HEAD)"
              echo "::notice::normal cover dispatch on main $EXPECTED_MAIN_HEAD (freshness attempt $publish_attempt/3)"

              # main puo' essere avanzata dopo resolve. Rileggi il kill switch
              # dalla revisione appena checkoutata: il dry calcolato da resolve
              # non puo' riarmare una revisione che ora e' disabilitata.
              attempt_dry="$DRY"
              if [ -f .github/FAST_PUBLISH_DISABLED ]; then
                echo "::warning::.github/FAST_PUBLISH_DISABLED present on live checkout — running dry"
                attempt_dry=true
              elif [ "${{ vars.FAST_PUBLISH_ARMED }}" = "false" ]; then
                echo "::warning::repo variable FAST_PUBLISH_ARMED=false — running dry"
                attempt_dry=true
              fi
              build_publish_args "$attempt_dry"

              live_dependency_lock_hash="$(sha256sum package.json package-lock.json | sha256sum | cut -d' ' -f1)"
              if [ "${INSTALLED_DEPENDENCY_LOCK_HASH:-}" != "$live_dependency_lock_hash" ]; then
                echo "::notice::package metadata changed with the live checkout; reinstalling dependencies"
                bash scripts/lib/npm-ci-retry.sh
                export INSTALLED_DEPENDENCY_LOCK_HASH="$live_dependency_lock_hash"
                echo "INSTALLED_DEPENDENCY_LOCK_HASH=$live_dependency_lock_hash" >> "$GITHUB_ENV"
              fi

              if [ "$attempt_dry" != "true" ]; then
                # Il checkout puo' aver cambiato host/constants.ts e quindi il
                # nome dell'asset gtag: riallinea la CDN prima di ogni render.
                bash scripts/ci/retry-cmd.sh npx -y tsx@4.23.15 scripts/ci/ensure-host-shell-assets.mjs
              fi
              # Il wrapper ritenta i blip npm/R2. Se il publish fallisce dopo
              # quei tentativi, il summary distingue una staging riuscita che
              # attende il flip API/edge da un errore reale.
              rm -f "$RUNNER_TEMP/section-summary.json"
              if RETRY_CMD_ATTEMPTS=2 bash scripts/ci/retry-cmd.sh npx -y tsx@4.23.15 scripts/publish-section-pages.mjs "${args[@]}"; then
                exit 0
              fi
              if [ "$normal_dispatch" = 'true' ] \
                && [ -s "$RUNNER_TEMP/section-summary.json" ] \
                && jq -e '.deferredLiveRelease == true and .published.deferredReason != null' "$RUNNER_TEMP/section-summary.json" >/dev/null; then
                now_ms="$(date +%s%3N)"
                if [ "$now_ms" -ge "$deferred_replay_deadline_ms" ]; then
                  echo "::error::release API/edge non pronta dopo il budget bounded di replay del cover publisher"
                  exit 1
                fi
                echo "::notice::staging live completata ma API/edge non ancora pronta; attendo il replay prima del prossimo render"
                sleep 30
                deferred_retry='true'
                break
              fi
              if ! current_main="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"; then
                echo "::error::impossibile rileggere la revisione corrente di main dopo un render fallito"
                exit 1
              fi
              if [ "$current_main" = "$EXPECTED_MAIN_HEAD" ]; then
                echo "::error::render fallito senza un avanzamento concorrente di main"
                exit 1
              fi
              echo "::notice::main avanzata durante il render ($EXPECTED_MAIN_HEAD → $current_main); riallineo il checkout"
            done
            if [ "$deferred_retry" = 'true' ]; then
              continue
            fi
            echo "::error::main e' avanzata durante tre tentativi di render del publisher"
            exit 1
          done

      - name: Release bootstrap R2 gate
        # GITHUB_ENV aggiorna l'ambiente dei passi successivi, ma non è una
        # base affidabile per la valutazione dell'espressione `if` del passo.
        # L'outcome dell'acquire è il fatto durevole: se ha acquisito il lease,
        # il release deve partire anche quando il render fallisce.
        if: always() && steps.acquire_bootstrap.outcome == 'success' && steps.replay_freshness.outputs.fresh == 'true' && needs.resolve.outputs.dry != 'true' && matrix.target.bootstrap == true
        env:
          SECTION: ${{ matrix.target.section }}
        run: node scripts/ci/section-bootstrap-lock.mjs release --section "$SECTION"

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          s="$RUNNER_TEMP/section-summary.json"
          [ -s "$s" ] || { echo "nessun summary: il render non e' arrivato in fondo"; exit 0; }
          jq -r '"sezione \(.section) (\(.declaredStatus // "?")): pagine \(.counts | tostring), hub mancanti \(.hubsMissing | tostring), difetti \(.defects | length), pubblicato \(.published | tostring)"' "$s"

  # A push can start the API publisher before the section runner has uploaded
  # its HTML. After a successful bootstrap or explicitly armed staged
  # backfill, replay the API so an earlier fail-closed readiness check cannot
  # strand the registry on the previous release. API-triggered replays are
  # excluded to prevent a workflow_run loop.
  replay-api-after-staged-release:
    needs: [resolve, publish]
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      needs.publish.result == 'success' &&
      (needs.resolve.outputs.bootstrap == 'true' || needs.resolve.outputs.replay_api_after_publish == 'true') &&
      needs.resolve.outputs.dry != 'true' &&
      github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Il replay deve usare esattamente la revisione dalla quale il
          # publisher ha renderizzato e caricato le pagine. `main` puo' essere
          # avanzata durante il render; il guard sotto in quel caso lascia il
          # lavoro al run generato dal nuovo push.
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify staged release revision is still main
        id: replay_freshness
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::source commit non e' una SHA completa per il replay staged"
            exit 1
          fi
          if ! current_main="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"; then
            echo "::error::impossibile verificare main prima del replay API"
            exit 1
          fi
          if ! [[ "$current_main" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::revisione corrente di main non valida per il replay bootstrap"
            exit 1
          fi
          echo "current_main=$current_main" >> "$GITHUB_OUTPUT"
          if [ "$current_main" != "$SOURCE_COMMIT" ]; then
            echo "::notice::main e' avanzata da $SOURCE_COMMIT a $current_main durante il backfill; il passo recovery redispatchera' il publisher sulla HEAD corrente"
            echo 'fresh=false' >> "$GITHUB_OUTPUT"
          else
            echo "main ancora sulla revisione staged $SOURCE_COMMIT"
            echo 'fresh=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.replay_freshness.outcome == 'success'
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies for Remote Config
        if: steps.replay_freshness.outcome == 'success'
        run: bash scripts/lib/npm-ci-retry.sh

      - name: Prepare Firebase credentials
        if: steps.replay_freshness.outcome == 'success'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not set — Remote Config is the only source of the dispatch token"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Load dispatch token from Remote Config
        if: steps.replay_freshness.outcome == 'success'
        run: node generator/scripts/load-rc-env.mjs

      - name: Redispatch staged backfill on current main after stale replay
        if: steps.replay_freshness.outputs.fresh == 'false'
        env:
          REPOSITORY: ${{ github.repository }}
          TARGET_MATRIX: ${{ needs.resolve.outputs.matrix }}
          CURRENT_MAIN: ${{ steps.replay_freshness.outputs.current_main }}
          DRY: ${{ needs.resolve.outputs.dry }}
          REPLAY_API_AFTER_PUBLISH: ${{ needs.resolve.outputs.replay_api_after_publish }}
          ALLOW_DEFERRED_LIVE_RELEASE: ${{ needs.resolve.outputs.allow_deferred_live_release }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
        run: |
          set -euo pipefail
          runtime_pat="${GITHUB_PAT_NANAKO:-}"
          if [ -z "$runtime_pat" ]; then
            echo "::error::GITHUB_PAT_NANAKO non caricato: recovery staged impossibile"
            exit 1
          fi
          if ! [[ "$CURRENT_MAIN" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::HEAD corrente non valida per il recovery bootstrap: $CURRENT_MAIN"
            exit 1
          fi
          export GH_TOKEN="$runtime_pat"
          dispatch_nonce_input="${DISPATCH_NONCE:-}"
          dispatched=0
          failed_sections=()
          while IFS=$'\t' read -r section article_ids missing_page_paths known_missing_page_paths bootstrap remove_stale cleanup_inactive_surface; do
            [ -n "$section" ] || continue
            nonce_seed="${dispatch_nonce_input:-stale-staged-recovery}"
            nonce_hash="$(printf '%s\0%s\0%s' "$nonce_seed" "$CURRENT_MAIN" "$section" | sha256sum | cut -c1-16)"
            dispatch_nonce="stale-staged-${CURRENT_MAIN:0:12}-${section}-${nonce_hash}"
            dispatch_title="cover-publish-section / ${section} / nonce=${dispatch_nonce}"
            echo "::notice::recovery staged $section sulla HEAD corrente $CURRENT_MAIN"
            if bash scripts/ci/dispatch-fast-publish-replay.sh "$REPOSITORY" "$dispatch_title" --ref main \
              -f section="$section" \
              -f article_ids="$article_ids" \
              -f missing_page_paths="$missing_page_paths" \
              -f known_missing_page_paths="$known_missing_page_paths" \
              -f bootstrap="$bootstrap" \
              -f remove_stale_canton_rss_feeds="$remove_stale" \
              -f cleanup_inactive_surface="$cleanup_inactive_surface" \
              -f source_commit="$CURRENT_MAIN" \
              -f source_main_commit="$CURRENT_MAIN" \
              -f replay_api_after_publish="$REPLAY_API_AFTER_PUBLISH" \
              -f allow_deferred_live_release="$ALLOW_DEFERRED_LIVE_RELEASE" \
              -f dry_run="$DRY" \
              -f dispatch_nonce="$dispatch_nonce"; then
              dispatched=$((dispatched + 1))
            else
              echo "::error::recovery staged non accodato per $section sulla HEAD $CURRENT_MAIN"
              failed_sections+=("$section")
            fi
          done < <(jq -r '.[] | [.section, ((.ids // []) | tojson), ((.missingPagePaths // []) | tojson), ((.knownMissingPagePaths // []) | tojson), (.bootstrap // false), (.removeStaleCantonRssFeeds // false), (.cleanupInactiveSurface // false)] | @tsv' <<<"$TARGET_MATRIX")
          if (( ${#failed_sections[@]} > 0 )); then
            printf -v failed_sections_csv '%s, ' "${failed_sections[@]}"
            failed_sections_csv="${failed_sections_csv%, }"
            echo "::error::recovery staged non accodato per le sezioni: $failed_sections_csv"
            exit 1
          fi
          if [ "$dispatched" -eq 0 ]; then
            echo "::error::matrix staged vuoto nel recovery stale"
            exit 1
          fi

      - name: Replay publish-api after staged release
        if: steps.replay_freshness.outputs.fresh == 'true'
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]] \
            || [ "$(git rev-parse HEAD)" != "$SOURCE_COMMIT" ]; then
            echo "::error::checkout del replay non coincide con la revisione staged"
            exit 1
          fi
          git fetch --no-tags --depth=1 origin main
          current_main="$(git rev-parse FETCH_HEAD)"
          if [ "$current_main" != "$SOURCE_COMMIT" ]; then
            echo "::notice::main e' avanzata durante il backfill ($SOURCE_COMMIT -> $current_main); nessun replay stantio"
            exit 0
          fi
          readiness="$RUNNER_TEMP/staged-replay-readiness.json"
          node scripts/reconcile-section-pages.mjs --out "$readiness" --cap 1
          if [ "$(jq -r 'if .skipped then "true" else "false" end' "$readiness")" = 'true' ] \
            || [ "$(jq -r '.counts.missingPages' "$readiness")" != '0' ] \
            || [ "$(jq -r '.counts.unknown' "$readiness")" != '0' ] \
            || [ "$(jq -r '.counts.manifestUnknown' "$readiness")" != '0' ]; then
            echo "::notice::replay API rimandato: la verifica globale rileva pagine mancanti o non verificabili"
            exit 0
          fi
          runtime_pat="${GITHUB_PAT_NANAKO:-}"
          if [ -z "$runtime_pat" ]; then
            echo "::error::GITHUB_PAT_NANAKO non caricato da Remote Config"
            exit 1
          fi
          export GH_TOKEN="$runtime_pat"
          gh workflow run publish-api.yml --repo "$REPOSITORY" --ref main -f source_commit="$SOURCE_COMMIT"

      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
