name: Translate Queue Recovery Watchdog (observe only)

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: translate-queue-recovery-watchdog-v1
  cancel-in-progress: false
  queue: max

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch immutable zero-dependency watchdog
        shell: bash
        env:
          WATCHDOG_SCRIPT: ${{ runner.temp }}/translate-queue-recovery.mjs
          WATCHDOG_SCRIPT_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/ci/translate-queue-recovery.mjs
        run: |-
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --location --max-redirs 0 --connect-timeout 5 --max-time 20 --max-filesize 262144 \
            --output "$WATCHDOG_SCRIPT" "$WATCHDOG_SCRIPT_URL"

      - name: Observe translate queue without recovery
        id: observe
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RECOVERY_MODE: dry-run
          WATCHDOG_SCRIPT: ${{ runner.temp }}/translate-queue-recovery.mjs
        run: |
          set -euo pipefail
          node "$WATCHDOG_SCRIPT" > translate-queue-recovery-report.json

      - name: Alert on queue SLO or incomplete discovery
        id: alert
        env:
          REPORT_PATH: translate-queue-recovery-report.json
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8'));
          const slo = report.queue?.slo || {};
          const discovery = report.discovery || {};
          const reasons = [];
          if (slo.state === 'breached') {
            // Il numero dell'alert deve dire QUALE grandezza ha sfondato: con un
            // detentore si misura la sua eta', senza detentore l'attesa del
            // pending piu' vecchio. Scrivere sempre "pending age" ha mandato la
            // diagnosi sulla coda quando il soggetto era un altro.
            reasons.push(
              `queue SLO breached: ${slo.measured} ${slo.measuredAgeSeconds}s >= ${slo.thresholdSeconds}s`
              + ` (oldest pending ${slo.oldestPendingAgeSeconds ?? 'none'}s, active ${report.counts?.active ?? 'unknown'})`,
            );
          }
          if (discovery.truncated || discovery.state !== 'complete') {
            // `residual runs` e `next page` da soli descrivono solo il
            // troncamento per paginazione, e mandano la diagnosi fuori strada
            // quando la causa e' un'altra: il 2026-09-18 la discovery risultava
            // troncata con 174/174 run lette e nessuna pagina residua, perche'
            // i candidati erano 29 contro un tetto di 20 e il budget GET era
            // consumato (27/29) dai candidati a blob non allineato.
            const budget = report.queryBudget || {};
            reasons.push(
              `discovery ${discovery.state}: scanned ${discovery.scannedRuns ?? 'unknown'}/${discovery.declaredTotal ?? 'unknown'}`
              + `, next page ${discovery.nextPage ?? 'none'}, residual runs ${discovery.residualRuns ?? 'unknown'}`
              + `, deep candidates ${report.counts?.deepCandidates ?? 'unknown'} inspected ${report.counts?.deepInspected ?? 'unknown'}`
              + `, gets ${budget.usedGets ?? 'unknown'}/${budget.maxGets ?? 'unknown'} exhausted ${budget.exhausted ?? 'unknown'}`,
            );
          }
          if (report.failClosed) reasons.push('observation fail-closed: evidence incomplete');
          const summary = [
            '### Translate queue watchdog',
            `- SLO: ${slo.state || 'unknown'}`,
            `- Pending: ${report.counts?.pending ?? 'unknown'}`,
            `- Discovery: ${discovery.state || 'unknown'}${discovery.truncated ? ' (truncated)' : ''}`,
            `- Decision: ${report.decision || 'unknown'}`,
            reasons.length ? `- Alerts: ${reasons.join(' | ')}` : '- Alerts: none',
          ].join('\n');
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          for (const reason of reasons) console.log(`::warning::${reason}`);
          if (slo.state === 'breached' || report.failClosed) process.exitCode = 1;
          NODE

      - name: Upload queue evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: translate-queue-recovery-${{ github.run_id }}
          path: translate-queue-recovery-report.json
          if-no-files-found: error
          retention-days: 14
