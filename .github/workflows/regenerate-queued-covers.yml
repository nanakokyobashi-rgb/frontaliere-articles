name: Regenerate queued article covers
run-name: Regenerate queued covers (${{ inputs.limit || '10' }})

# La coda e' un recupero dati, non una nuova pipeline editoriale: parte ogni
# due ore e si ferma da sola quando items[] e' vuoto e l'outbox publisher e'
# vuoto. Il dispatch manuale puo' abbassare o alzare il tetto e, solo con una
# scelta esplicita, riaprire le voci marcate failed.
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: "Numero massimo di voci da tentare in questa run (mai tentate e meno fallite prima)"
        required: false
        default: '10'
        type: string
      retry_failed:
        description: 'Rimetti in coda le voci marcate failed e ritentale (solo dispatch manuale)'
        required: false
        default: false
        type: boolean

# Il gruppo condiviso `generate-article` e' una politica di scarto in entrambe
# le direzioni: GitHub conserva una sola run pending e un arrivo del drain puo'
# sfrattare una generazione (vedi l'intestazione di generate-article.yml).
# La mutua esclusione delle scritture su main vive gia' nel push con rebase dello
# step «Commit and push corpus data»; due drain non devono sovrapporsi, quindi
# resta un gruppo ma proprio.
concurrency:
  group: regenerate-queued-covers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drain:
    runs-on: ubuntu-latest
    # Budget: 45m job timeout; 40m internal deadline after Remote Config, so
    # 5m remain for ack, summary and cleanup. Each cover reserves 120s and the
    # final publisher phase reserves 15m; the pre-generation publisher phase is
    # capped at 15m, so generation is reduced or skipped when both do not fit.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: bash scripts/lib/npm-ci-retry.sh

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not set — Remote Config is the only source of provider keys and the push PAT"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Load secrets from Remote Config
        run: node generator/scripts/load-rc-env.mjs

      - name: Initialize cover drain budget
        id: budget
        env:
          DEADLINE_FILE: ${{ runner.temp }}/queued-cover-deadline-ms
          PREPUBLISH_DEADLINE_FILE: ${{ runner.temp }}/queued-cover-prepublish-deadline-ms
          OUTBOX_FILE: data/image-regeneration-publish-outbox.json
        run: |
          set -euo pipefail
          now_ms="$(node -e 'process.stdout.write(String(Date.now()))')"
          deadline_ms=$((now_ms + 40 * 60 * 1000))
          prepublish_deadline_ms=$((now_ms + 15 * 60 * 1000))
          if [ "$prepublish_deadline_ms" -gt "$deadline_ms" ]; then
            prepublish_deadline_ms="$deadline_ms"
          fi
          printf '%s\n' "$deadline_ms" > "$DEADLINE_FILE"
          printf '%s\n' "$prepublish_deadline_ms" > "$PREPUBLISH_DEADLINE_FILE"
          if [ -s "$OUTBOX_FILE" ] && jq -e '.schema == 1 and ((.items | type) == "array") and (.items | length > 0)' "$OUTBOX_FILE" >/dev/null; then
            echo 'initial_outbox=true' >> "$GITHUB_OUTPUT"
          else
            echo 'initial_outbox=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch pending cover publishers before generation
        id: pre_republish
        if: steps.budget.outputs.initial_outbox == 'true'
        env:
          OUTBOX_FILE: data/image-regeneration-publish-outbox.json
          STATUS_FILE: ${{ runner.temp }}/queued-cover-prepublish-status.json
          DEADLINE_FILE: ${{ runner.temp }}/queued-cover-prepublish-deadline-ms
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_PAT_NANAKO:-}" ]; then
            echo "::error::GITHUB_PAT_NANAKO missing — cannot dispatch the existing article publishers"
            exit 1
          fi
          export GH_TOKEN="$GITHUB_PAT_NANAKO"
          node scripts/ci/cover-publisher-drain.mjs \
            --mode run \
            --outbox "$OUTBOX_FILE" \
            --status "$STATUS_FILE" \
            --repo "$REPO" \
            --deadline-at "$(cat "$DEADLINE_FILE")"

      - name: Acknowledge pre-generation cover publishers
        id: pre_ack
        if: ${{ always() && steps.budget.outcome == 'success' && (steps.pre_republish.outcome == 'success' || steps.pre_republish.outcome == 'failure' || steps.pre_republish.outcome == 'skipped') }}
        env:
          OUTBOX_FILE: data/image-regeneration-publish-outbox.json
          STATUS_FILE: ${{ runner.temp }}/queued-cover-prepublish-status.json
        run: |
          set -euo pipefail
          if [ ! -s "$OUTBOX_FILE" ] || ! jq -e '.schema == 1 and ((.items | type) == "array") and (.items | length > 0)' "$OUTBOX_FILE" >/dev/null; then
            echo 'outbox_pending=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -s "$STATUS_FILE" ]; then
            echo "::error::pre-generation publisher status is missing; keeping the outbox and skipping generation"
            echo 'outbox_pending=true' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          export GH_TOKEN="${GITHUB_PAT_NANAKO:-}"
          node scripts/ci/cover-publisher-drain.mjs \
            --mode ack \
            --outbox "$OUTBOX_FILE" \
            --status "$STATUS_FILE"
          pending='false'
          if [ -s "$OUTBOX_FILE" ] && jq -e '.schema == 1 and ((.items | type) == "array") and (.items | length > 0)' "$OUTBOX_FILE" >/dev/null; then
            pending='true'
          fi
          echo "outbox_pending=$pending" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- "$OUTBOX_FILE"; then
            echo "no pre-generation publisher entries were acknowledged; outbox_pending=$pending"
            exit 0
          fi
          if [ -z "${GITHUB_PAT_NANAKO:-}" ]; then
            echo "::error::GITHUB_PAT_NANAKO missing — refusing an untrusted outbox acknowledgement push"
            exit 1
          fi
          git add -A -- "$OUTBOX_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(generator): acknowledge queued cover publishers (partial)"
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GITHUB_PAT_NANAKO" | base64 -w 0)"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          git remote set-url origin "$remote"
          for attempt in 1 2 3 4 5; do
            if git -c pack.window=0 -c pack.threads=1 push --no-thin --no-verify origin HEAD:main; then
              echo "pre-generation publisher outbox acknowledgement pushed"
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then break; fi
            echo "pre-generation acknowledgement push attempt $attempt failed; rebasing"
            sleep $((attempt * 3))
            bash scripts/lib/rebase-onto-remote.sh "$remote" main "$OUTBOX_FILE" || {
              git rebase --abort 2>/dev/null || true
            }
          done
          echo "::error::pre-generation publisher acknowledgement could not be pushed; it remains durable on main"
          exit 1

      # The same Codex broker lane used by generate-article.yml. The engine
      # still owns provider order and verification; this step only supplies
      # the first provider's governed authentication path.
      - name: Setup Codex Luna Max article lane
        id: setup_claude_haiku_fallback
        continue-on-error: true
        if: steps.pre_ack.outcome == 'success' && steps.pre_ack.outputs.outbox_pending != 'true'
        uses: ./.github/actions/setup-claude-haiku-fallback
        with:
          codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}

      - name: Drain queued covers
        id: drain
        if: steps.pre_ack.outcome == 'success'
        env:
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
          LIMIT_INPUT: ${{ inputs.limit || '10' }}
          RETRY_FAILED: ${{ inputs.retry_failed || false }}
          SUMMARY_FILE: ${{ runner.temp }}/queued-cover-summary.json
          OUTBOX_FILE: data/image-regeneration-publish-outbox.json
          QUEUE_FILE: data/image-regeneration-queue.json
          DEADLINE_FILE: ${{ runner.temp }}/queued-cover-deadline-ms
        run: |
          set -euo pipefail
          if [ -s "$OUTBOX_FILE" ] && jq -e '.schema == 1 and ((.items | type) == "array") and (.items | length > 0)' "$OUTBOX_FILE" >/dev/null; then
            residual='0'
            if [ -s "$QUEUE_FILE" ]; then residual="$(jq -er 'if .schema == 1 and (.items | type == "array") then (.items | length) else error("invalid queue") end' "$QUEUE_FILE")"; fi
            jq -n --argjson residual "$residual" \
              '{drained:0,residual:$residual,failed:0,failedIds:[],marked:[],reused:0,alreadySatisfied:0,alreadySatisfiedIds:[],requeued:[],sections:{},skippedBeforeDrain:true}' \
              > "$SUMMARY_FILE"
            echo "publisher outbox is still pending after the pre-generation phase; skipping new cover generation"
            echo "summary=$SUMMARY_FILE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          retry_args=()
          if [ "$RETRY_FAILED" = 'true' ]; then retry_args+=(--retry-failed); fi
          case "$LIMIT_INPUT" in
            ''|*[!0-9]*)
              echo "::error::limit must be an integer"
              exit 1
              ;;
          esac
          now_ms="$(node -e 'process.stdout.write(String(Date.now()))')"
          deadline_ms="$(cat "$DEADLINE_FILE")"
          publisher_reserve_ms=$((15 * 60 * 1000))
          per_cover_ms=$((120 * 1000))
          available_ms=$((deadline_ms - now_ms - publisher_reserve_ms))
          budget_limit=$((available_ms / per_cover_ms))
          if [ "$budget_limit" -lt 1 ]; then
            queue_residual='0'
            if [ -s "$QUEUE_FILE" ]; then queue_residual="$(jq -er '.items | length' "$QUEUE_FILE")"; fi
            jq -n --argjson residual "$queue_residual" \
              '{drained:0,residual:$residual,failed:0,failedIds:[],marked:[],reused:0,alreadySatisfied:0,alreadySatisfiedIds:[],requeued:[],sections:{},skippedForBudget:true}' \
              > "$SUMMARY_FILE"
            echo "not enough internal time for one cover plus the 15m publisher reserve; skipping generation"
            echo "summary=$SUMMARY_FILE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          effective_limit="$LIMIT_INPUT"
          if [ "$effective_limit" -gt "$budget_limit" ]; then
            effective_limit="$budget_limit"
            echo "reducing cover limit from $LIMIT_INPUT to $effective_limit to preserve the publisher reserve"
          fi
          node generator/scripts/regenerate-queued-covers.mjs \
            --limit "$effective_limit" \
            --summary "$SUMMARY_FILE" \
            "${retry_args[@]}"
          echo "summary=$SUMMARY_FILE" >> "$GITHUB_OUTPUT"

      - name: Commit and push corpus data
        id: push
        if: steps.drain.outcome == 'success'
        env:
          SUMMARY_FILE: ${{ runner.temp }}/queued-cover-summary.json
          PREPUBLISH_OUTBOX_PENDING: ${{ steps.pre_ack.outputs.outbox_pending }}
        run: |
          set -euo pipefail
          echo "publish_ready=false" >> "$GITHUB_OUTPUT"
          queue_file=data/image-regeneration-queue.json
          expected_queue="$RUNNER_TEMP/queued-cover-expected-queue.json"

          snapshot_expected_queue() {
            local expected verified
            if [ ! -s "$SUMMARY_FILE" ]; then
              echo "::error::queued-cover summary is missing; cannot snapshot the expected queue"
              return 1
            fi
            if [ -e "$queue_file" ]; then
              cp "$queue_file" "$expected_queue"
            else
              printf '%s\n' '{"schema":1,"items":[]}' > "$expected_queue"
            fi
            expected="$(jq -er 'if .schema == 1 and (.items | type == "array") then (.items | length) else error("invalid expected queue") end' "$expected_queue")"
            verified="${SUMMARY_FILE}.expected"
            jq --argjson expected "$expected" \
              'if has("residualDrainer") then . else .residualDrainer = .residual end
               | .residual = $expected
               | .residualExpected = $expected
               | .residualSource = "expected-before-push"' \
              "$SUMMARY_FILE" > "$verified"
            mv "$verified" "$SUMMARY_FILE"
          }

          verify_pushed_queue() {
            local internal expected_count actual expected_ids actual_ids missing verified pushed_queue
            if [ ! -s "$SUMMARY_FILE" ]; then
              echo "::error::queued-cover summary is missing; cannot verify the pushed queue"
              return 1
            fi
            if [ ! -s "$expected_queue" ]; then
              echo "::error::queued-cover expected queue snapshot is missing; cannot verify the pushed queue"
              return 1
            fi
            internal="$(jq -er '.residual // error("missing residual")' "$SUMMARY_FILE")"
            expected_count="$(jq -er 'if .schema == 1 and (.items | type == "array") then ([.items[] | .articleId | tostring] | unique | length) else error("invalid expected queue") end' "$expected_queue")"
            expected_ids="$(jq -er 'if .schema == 1 and (.items | type == "array") then [.items[] | .articleId | tostring] | unique else error("invalid expected queue") end' "$expected_queue")"
            if [ "$internal" -ne "$expected_count" ]; then
              echo "::error::queued-cover summary diverged before push: drainer=$internal, snapshot=$expected_count"
              return 1
            fi
            if git cat-file -e "HEAD:$queue_file" 2>/dev/null; then
              pushed_queue="$(git show "HEAD:$queue_file")"
            else
              pushed_queue='{"schema":1,"items":[]}'
            fi
            actual="$(jq -er 'if .schema == 1 and (.items | type == "array") then ([.items[] | .articleId | tostring] | unique | length) else error("invalid queue") end' <<< "$pushed_queue")"
            actual_ids="$(jq -er 'if .schema == 1 and (.items | type == "array") then [.items[] | .articleId | tostring] | unique else error("invalid queue") end' <<< "$pushed_queue")"
            missing="$(jq -ner --argjson expected "$expected_ids" --argjson actual "$actual_ids" '$expected - $actual')"
            verified="${SUMMARY_FILE}.verified"
            jq --argjson internal "$internal" --argjson actual "$actual" --argjson missing "$missing" \
              '.residualInternal = $internal | .residual = $actual | .residualMissing = $missing | .residualSource = "pushed-branch"' \
              "$SUMMARY_FILE" > "$verified"
            mv "$verified" "$SUMMARY_FILE"
            if [ "$actual" -ne "$internal" ]; then
              echo "::error::queued-cover queue count diverged after push: drainer=$internal, pushed branch=$actual"
              return 1
            fi
            if [ "$missing" != '[]' ]; then
              echo "::error::queued-cover queue items lost after push: $missing"
              return 1
            fi
          }

          git add -A
          snapshot_expected_queue
          if git diff --cached --quiet; then
            if [ -s data/image-regeneration-publish-outbox.json ] && [ "${PREPUBLISH_OUTBOX_PENDING:-false}" != 'true' ]; then
              echo "no corpus changes; retrying the durable publisher outbox"
              echo "publish_ready=true" >> "$GITHUB_OUTPUT"
            else
              echo "queued cover queue produced no changes or the pre-generation outbox is still pending"
            fi
            verify_pushed_queue
            exit 0
          fi
          if [ -z "${GITHUB_PAT_NANAKO:-}" ]; then
            echo "::error::GITHUB_PAT_NANAKO missing — refusing a GITHUB_TOKEN push because it would not trigger publish-api.yml"
            exit 1
          fi

          drained=0
          if [ -f "$SUMMARY_FILE" ]; then drained="$(jq -r '.drained // 0' "$SUMMARY_FILE")"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(generator): drain queued article covers ($drained drained)"
          PRODUCED="$(git rev-parse HEAD)"
          registry_base="$RUNNER_TEMP/generated-image-registry-base.json"
          registry_snapshot="$RUNNER_TEMP/generated-image-registry-replayed.json"
          if ! git show "$PRODUCED^:data/generated-image-registry.json" > "$registry_base"; then
            printf '%s\n' '{"schema":1,"assetCount":0,"assets":[]}' > "$registry_base"
          fi
          cp data/generated-image-registry.json "$registry_snapshot"

          # Keep the token out of URLs and logs. The extraheader is local-only
          # checkout state and is removed with the runner; the runtime source is
          # explicitly the Remote Config bridge's GITHUB_PAT_NANAKO variable.
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GITHUB_PAT_NANAKO" | base64 -w 0)"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          git remote set-url origin "$remote"

          for attempt in 1 2 3 4 5; do
            if git -c pack.window=0 -c pack.threads=1 push --no-thin --no-verify origin HEAD:main; then
              echo "pushed to main"
              verify_pushed_queue
              if [ "${PREPUBLISH_OUTBOX_PENDING:-false}" = 'true' ]; then
                echo "pre-generation outbox remains pending; not dispatching it again in this run"
              else
                echo "publish_ready=true" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then break; fi
            echo "push attempt $attempt failed; rebasing onto origin/main"
            sleep $((attempt * 3))

            # rebase-onto-remote.sh has the repository's proven queue merge,
            # per-section registry merge, and per-article image resolution.
            # Pull uses the authenticated remote URL plus the local extraheader
            # above; no credential-bearing URL is written to git config.
            rebased=1
            bash scripts/lib/rebase-onto-remote.sh "$remote" main \
              data/generated-image-registry.json \
              --merge-queue "$queue_file" \
              --section-surfaces \
              --take-theirs public/images/blog/ || rebased=0
            if [ "$rebased" -ne 1 ]; then
              echo "::error::safe rebase failed; refusing to choose a side for a corpus conflict"
              exit 1
            fi
            node scripts/ci/merge-generated-image-registry.mjs \
              data/generated-image-registry.json "$registry_base" "$registry_snapshot"
            git add data/generated-image-registry.json
            if ! git diff --cached --quiet; then
              if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
                git commit -C "$PRODUCED"
              else
                git commit --amend --no-edit
              fi
            fi
            snapshot_expected_queue
          done
          echo "::error::push failed after 5 attempts"
          exit 1

      - name: Dispatch and complete pending cover publishers
        id: republish
        if: steps.push.outputs.publish_ready == 'true'
        env:
          OUTBOX_FILE: data/image-regeneration-publish-outbox.json
          STATUS_FILE: ${{ runner.temp }}/queued-cover-publish-status.json
          DEADLINE_FILE: ${{ runner.temp }}/queued-cover-deadline-ms
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_PAT_NANAKO:-}" ]; then
            echo "::error::GITHUB_PAT_NANAKO missing — cannot dispatch the existing article publishers"
            exit 1
          fi
          if [ ! -s "$OUTBOX_FILE" ]; then
            echo "no pending cover publisher outbox"
            exit 0
          fi
          export GH_TOKEN="$GITHUB_PAT_NANAKO"
          node scripts/ci/cover-publisher-drain.mjs \
            --mode run \
            --outbox "$OUTBOX_FILE" \
            --status "$STATUS_FILE" \
            --repo "$REPO" \
            --deadline-at "$(cat "$DEADLINE_FILE")"

      - name: Acknowledge cover publisher outbox
        if: ${{ always() && steps.push.outputs.publish_ready == 'true' && (steps.republish.outcome == 'success' || steps.republish.outcome == 'failure') }}
        env:
          OUTBOX_FILE: data/image-regeneration-publish-outbox.json
          STATUS_FILE: ${{ runner.temp }}/queued-cover-publish-status.json
        run: |
          set -euo pipefail
          if [ ! -e "$OUTBOX_FILE" ]; then
            echo "publisher outbox already empty"
            exit 0
          fi
          if [ ! -s "$STATUS_FILE" ]; then
            echo "::error::publisher status is missing; leaving the outbox durable for the next run"
            exit 1
          fi
          export GH_TOKEN="${GITHUB_PAT_NANAKO:-}"
          node scripts/ci/cover-publisher-drain.mjs \
            --mode ack \
            --outbox "$OUTBOX_FILE" \
            --status "$STATUS_FILE"
          if git diff --quiet -- "$OUTBOX_FILE"; then
            echo "no successful publisher section to acknowledge"
            exit 0
          fi
          if [ -z "${GITHUB_PAT_NANAKO:-}" ]; then
            echo "::error::GITHUB_PAT_NANAKO missing — refusing an untrusted outbox acknowledgement push"
            exit 1
          fi
          git add -A -- "$OUTBOX_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(generator): acknowledge queued cover publishers (partial)"
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GITHUB_PAT_NANAKO" | base64 -w 0)"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          git remote set-url origin "$remote"
          for attempt in 1 2 3 4 5; do
            if git -c pack.window=0 -c pack.threads=1 push --no-thin --no-verify origin HEAD:main; then
              echo "publisher outbox acknowledged"
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then break; fi
            echo "outbox acknowledgement push attempt $attempt failed; rebasing"
            sleep $((attempt * 3))
            bash scripts/lib/rebase-onto-remote.sh "$remote" main "$OUTBOX_FILE" || {
              git rebase --abort 2>/dev/null || true
            }
          done
          echo "::error::publisher outbox acknowledgement could not be pushed; it remains durable on main for the next run"
          exit 1

      - name: Summary
        if: always()
        env:
          SUMMARY_FILE: ${{ runner.temp }}/queued-cover-summary.json
        run: |
          set -uo pipefail
          {
            echo "## Queue cover drain"
          if [ -s "$SUMMARY_FILE" ]; then
              drained="$(jq -r '.drained // 0' "$SUMMARY_FILE")"
              residual="$(jq -r '.residual // 0' "$SUMMARY_FILE")"
              failed="$(jq -r '.failed // 0' "$SUMMARY_FILE")"
              already_satisfied="$(jq -r '.alreadySatisfied // 0' "$SUMMARY_FILE")"
              marked="$(jq -r '(.marked // []) | length' "$SUMMARY_FILE")"
              requeued="$(jq -r '(.requeued // []) | length' "$SUMMARY_FILE")"
              echo "- Smaltite: **$drained**"
              echo "- Già soddisfatte, tolte senza rigenerare: **$already_satisfied**"
              echo "- Residue: **$residual**"
              echo "- Fallite in questa run: **$failed**"
              echo "- Marcate dopo almeno tre fallimenti: **$marked**"
              echo "- Riaccodate manualmente: **$requeued**"
              if [ "$marked" -gt 0 ]; then
                echo "- ⚠️ ID marcati: $(jq -r '(.marked // []) | join(", ")' "$SUMMARY_FILE")"
              fi
              if [ "$failed" -gt 0 ]; then
                echo "- ⚠️ ID falliti in questa run: $(jq -r '(.failedIds // []) | join(", ")' "$SUMMARY_FILE")"
              fi
              if [ "$already_satisfied" -gt 0 ]; then
                echo "- ID già soddisfatti: $(jq -r '(.alreadySatisfiedIds // []) | join(", ")' "$SUMMARY_FILE")"
              fi
              echo "- Sezioni ripubblicate: $(jq -c '.sections // {}' "$SUMMARY_FILE")"
            else
              echo "- Summary del drainer non disponibile: la run si è fermata prima del conteggio."
            fi
            for publisher_status in \
              "$RUNNER_TEMP/queued-cover-prepublish-status.json" \
              "$RUNNER_TEMP/queued-cover-publish-status.json"; do
              if [ -s "$publisher_status" ] && jq -e 'type == "object" and (.sections | type == "array")' "$publisher_status" >/dev/null 2>&1; then
                echo "- Publisher $(basename "$publisher_status" .json): $(jq -c '.counts // {}' "$publisher_status")"
                pending_publishers="$(jq -c '[.sections[] | select(.status != "success") | {section,status,error}]' "$publisher_status")"
                if [ "$pending_publishers" != '[]' ]; then
                  echo "- Publisher non conclusi: $pending_publishers"
                fi
              elif [ -s "$publisher_status" ]; then
                echo "- ⚠️ Publisher $(basename "$publisher_status" .json): status non valido; outbox lasciato durevole"
              fi
            done
            if [ -s data/image-regeneration-publish-outbox.json ]; then
              echo "- ⚠️ Publisher outbox ancora pendente: $(jq -c '.items // []' data/image-regeneration-publish-outbox.json)"
            else
              echo "- Publisher outbox: vuoto"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup Codex auth broker
        if: always()
        continue-on-error: true
        env:
          CODEX_AUTH_BROKER_SOCKET: ${{ steps.setup_claude_haiku_fallback.outputs.codex_auth_broker_socket }}
        run: |
          if [ -z "$CODEX_AUTH_BROKER_SOCKET" ] || [ ! -S "$CODEX_AUTH_BROKER_SOCKET" ]; then
            exit 0
          fi
          node .github/actions/setup-claude-haiku-fallback/codex-auth-broker.mjs \
            --cleanup --socket "$CODEX_AUTH_BROKER_SOCKET" \
            || echo "::warning::Codex auth broker cleanup did not complete"
