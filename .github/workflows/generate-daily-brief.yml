name: Generate Daily Brief Edition (Bollettino del Frontaliere)

# The DAILY dated edition (`bollettino-frontaliere-YYYY-MM-DD`) — the Discover
# opener. Form copied from generate-border-wait-ranking-weekly.yml, with the
# differences that matter spelled out:
#
#   - DATED id, registered fresh every day (not an evergreen body refresh):
#     a bumped updatedAt on a stable id is not a new story for Discover.
#     Flooding is bounded by build-api's sitemap retention (latest 90 listed).
#   - The data comes from Firestore over REST (trafficCurrent, fuelPrices,
#     exchangeHistory) plus the public CDN jobs-stats.json — so the Firebase
#     service account is needed BEFORE generation, in every mode, unlike the
#     ranking whose window is public. A missing SA is a config error and fails
#     the run; a missing DATA SOURCE only degrades its block (per-block
#     degradation lives in the scripts, not here).
#   - A day with fewer than 2 fresh blocks produces NO edition and exits 0:
#     a day without data must not break the cron, and an empty edition must
#     never be published (loadSnapshot enforces both). The only thing such a
#     day still commits is `data/daily-brief-degradation.json`, the streak
#     ledger — see the `git add` below and issue #885.
#   - The hero + thumbnail are pushed to R2 after the commit (best-effort,
#     same upload-cdn-file.sh as fast-publish): the og:image in the static
#     HTML points at cdn.frontaliereticino.ch, and Discover reads exactly
#     that URL. The raw.githubusercontent client fallback does not cover the
#     static markup, so the CDN warm belongs to this job.
#
# The push uses GITHUB_PAT from Remote Config, NOT GITHUB_TOKEN — a
# GITHUB_TOKEN push would not fire publish-api.yml (GitHub anti-recursion),
# and the edition would never reach the API surface, the sitemap, or the site.

on:
  schedule:
    # Daily, 05:05 UTC — before the morning commute (07:05 CEST), off the
    # congested top-of-hour cron slot.
    - cron: '5 5 * * *'
  # Self-test on change, always dry. See generate-border-wait-ranking-weekly.yml.
  push:
    paths:
      - '.github/workflows/generate-daily-brief.yml'
      - 'generator/scripts/refresh-daily-brief-data.mjs'
      - 'generator/scripts/generate-daily-brief-article.mjs'
      - 'generator/scripts/lib/daily-brief-data.mjs'
      - 'generator/scripts/lib/daily-brief-content.mjs'
      - 'generator/scripts/lib/daily-brief-image.mjs'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan only: fetch the data and render, write nothing'
        required: false
        default: false
        type: boolean

concurrency:
  group: generate-daily-brief
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Resolve run mode
        id: mode
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            DRY=true
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DRY="${{ inputs.dry_run }}"
          else
            DRY=false
          fi
          echo "dry=$DRY" >> "$GITHUB_OUTPUT"
          echo "event=${{ github.event_name }} → dry_run=$DRY"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Load-bearing, not hygiene: the stored GITHUB_TOKEN extraheader
          # would take precedence over the PAT in the push URL below. See the
          # incident note in generate-border-wait-ranking-weekly.yml.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # --ignore-scripts is safe WITH sharp: its linux binary arrives via the
      # platform-specific optional package, no postinstall needed.
      - name: Install dependencies
        run: bash scripts/lib/npm-ci-retry.sh --no-audit --no-fund --ignore-scripts

      # Needed BEFORE generation in every mode: the data snapshot reads
      # Firestore over REST with this service account. Missing SA = config
      # error = red run (a data outage, by contrast, only degrades blocks).
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not set — Firestore reads and the push PAT both come from it"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # A block degraded for three editions in a row is an upstream contract
      # change, not an outage, and this step DETECTS it — it does not fail on
      # it. The red is spent by the gate step after `Commit and push` below:
      # see the header of `reportDegradationAlarms`.
      - name: Refresh the day's data snapshot
        id: refresh
        env:
          DRY_RUN: ${{ steps.mode.outputs.dry == 'true' && '1' || '0' }}
        run: node generator/scripts/refresh-daily-brief-data.mjs

      # Registers today's edition (or refreshes it on a same-day rerun), and
      # renders the unique 1200×675 hero from the day's numbers. Refuses thin
      # or stale snapshots with exit 0 — see the script header.
      - name: Generate the daily edition
        env:
          DRY_RUN: ${{ steps.mode.outputs.dry == 'true' && '1' || '0' }}
        run: node generator/scripts/generate-daily-brief-article.mjs

      # ── La guardia sul percorso di scrittura (issue #275) ──────────────────
      #
      # PERCHE' ANCHE SU UN PRODUTTORE DETERMINISTICO. Questo workflow non
      # chiama nessun modello: `lib/daily-brief-content.mjs` e' «zero LLM» e
      # rende l'edizione dai numeri di `public/data/daily-brief.json`. La classe
      # segnaposto non nasce dal modello, qui.
      #
      # Cio' che la rende necessaria lo stesso e' che la meta' IN PROCESSO non
      # copre questo produttore quanto sembra. `sanitizePromptPlaceholders` gira
      # dentro `registerArticleFiles()`, e questo script lo chiama SOLO nel ramo
      # `!exists` (prima registrazione dell'edizione del giorno). Ogni rerun
      # dello stesso giorno passa da `refreshBodyFiles()` — `writeFileSync`
      # diretto sui quattro body — e da `refreshMetaAndSeo()`, che riscrive
      # excerpt/seoDescription/ogDescription in `blog-meta*` e in `content/seo/`
      # senza toccare il registrar (e' il percorso nato con la #85, appunto
      # perche' `registerArticleFiles` scrive quei campi una volta sola).
      # Su quei due percorsi la guardia in processo NON esiste: questo step e'
      # l'unico controllo fra il template e `main`.
      #
      # E vale anche in ingresso: se il corpus e' gia' sporco, un'edizione
      # committata sopra lo tiene tale e la porta al sito col cron 2x/giorno di
      # `sync-articles-sitemaps.yml`, che non aspetta il dispatch.
      #
      # LA CONDIZIONE E' LA SCRITTURA: nei giorni senza edizione (snapshot
      # magro o stantio, vedi lo step sopra) `content/` non viene toccato e
      # questo step esce verde senza scansionare niente.
      - name: Guard — cio' che questo run ha scritto non raggiunge main se viola le guardie
        id: guard
        if: steps.mode.outputs.dry != 'true'
        run: |
          set -uo pipefail
          if [ -z "$(git status --porcelain -- content/)" ]; then
            echo "nessuna edizione scritta sotto content/ in questo run — niente da validare"
            exit 0
          fi
          git status --porcelain -- content/ | head -20 || true
          if node --test \
            generator/tests/article-fabrication-guard.test.mjs \
            generator/tests/prompt-placeholder-guard.test.mjs; then
            exit 0
          fi
          {
            echo "### ✖ Scrittura RIFIUTATA prima del commit — \`generate-daily-brief\`"
            echo
            echo "\`article-fabrication-guard\` / \`prompt-placeholder-guard\` hanno trovato offender nel corpus dopo la scrittura."
            echo "**Niente e' stato committato**: l'edizione resta sul runner e sparisce con lui, \`main\` non la vede."
            echo
            echo "Gli offender sono elencati per path nel log di questo step. Confrontali con i path stampati sopra da \`git status\`:"
            echo
            echo "- se coincidono, il difetto e' dell'edizione appena scritta (template o snapshot), e va riparato li';"
            echo "- se NON coincidono, il difetto e' **preesistente nel corpus**. L'edizione di oggi non e' persa: dopo la fix si rifa' col \`workflow_dispatch\`, che rientra nel ramo \`exists\` e riscrive gli stessi file."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # RC is loaded only when there is a commit to push (GITHUB_PAT) and
      # assets to warm on the CDN (R2_*). A dry run never touches it.
      - name: Load secrets from Remote Config
        if: steps.mode.outputs.dry != 'true'
        run: node generator/scripts/load-rc-env.mjs

      - name: Configure git identity
        if: steps.mode.outputs.dry != 'true'
        run: |
          git config user.name "Valerie Linc"
          git config user.email "valerielinc@gmail.com"

      - name: Commit and push
        id: commit
        if: steps.mode.outputs.dry != 'true'
        run: |
          set -euo pipefail
          # Explicit list, never -A. Globs (nullglob: a no-edition day expands
          # them to nothing, and `git add` of an unmatched pathspec would fail
          # the green exit below). The seo glob covers a shard roll past
          # seo-blog-5.
          shopt -s nullglob
          # `data/daily-brief-degradation.json` is the streak ledger and is the
          # ONE path that must be staged even on a day with no edition: the
          # 0/4-blocks branch skips the snapshot on purpose, and without this
          # add the count would die on the runner and a permanent blackout
          # would never reach the threshold (#885). Il file e' versionato e il
          # refresh lo riscrive quando il contenuto cambia davvero (#927), quindi
          # esiste sempre qui e finisce in stage solo se lo streak si e' mosso.
          git add public/data/daily-brief.json \
                  data/daily-brief-degradation.json \
                  content/blogArticleIds.ts \
                  content/routerBlogData.ts \
                  content/blog-articles-data.ts \
                  content/blog-meta-it.ts \
                  content/blog-meta-en.ts \
                  content/blog-meta-de.ts \
                  content/blog-meta-fr.ts \
                  content/seo/seo-blog-*.ts
          EDITION_FILES=(content/blog-body/*/bollettino-frontaliere-*.ts \
                         public/images/blog/bollettino-frontaliere-*.webp \
                         public/images/blog/thumbnails/bollettino-frontaliere-*-480w.webp)
          if [ "${#EDITION_FILES[@]}" -gt 0 ]; then
            git add "${EDITION_FILES[@]}"
          fi
          if git diff --cached --quiet; then
            echo "no edition today (no data, or nothing changed) — exiting green"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Un giorno senza edizione ma con lo streak che si muove (0/4 blocchi,
          # #885) mette in stage SOLO il registro, e prima che esistesse quel
          # `git add` questo ramo non veniva mai raggiunto: usciva verde sopra.
          # Ora ci arriva, e con lui arriva l'`exit 1` del push fallito — cioe'
          # un rosso ogni mattina finche' il blackout dura, che e' esattamente
          # il loop dichiarato inaccettabile in #882.
          #
          # Il registro non e' l'edizione: `data/**` non e' nei `paths:` di
          # `publish-api.yml`, quindi perderlo non lascia il sito su una
          # superficie vecchia. Perderlo costa un allarme in ritardo — lo
          # stesso prezzo che si pagava prima di #885 — mentre il rosso in loop
          # costa una mattina rossa per sempre. Quindi: se in stage c'e' SOLO
          # il registro, un push fallito e' un warning e la run resta verde;
          # se c'e' un'edizione, il rosso resta rosso.
          #
          # Il ramo degradato vale SOLO per il push fallito dopo tre tentativi,
          # che e' una condizione transitoria: domani la stessa soglia viene
          # riattraversata e l'allarme scatta con un giorno di ritardo. Un PAT
          # assente NON e' transitorio — si ripete identico ogni mattina, lo
          # streak nuovo non raggiungerebbe mai `main`, resterebbe fissato a
          # `k+1` per sempre e sotto la soglia l'allarme non scatterebbe mai:
          # il buco di memoria di #885 riaperto sotto una run verde. Un secret
          # mancante e' una config rotta e deve restare rossa.
          if [ "$(git diff --cached --name-only)" = "data/daily-brief-degradation.json" ]; then
            LEDGER_ONLY=true
          else
            LEDGER_ONLY=false
          fi
          if [ -z "${GITHUB_PAT:-}" ]; then
            echo "::error::GITHUB_PAT missing — a GITHUB_TOKEN push would not fire publish-api.yml and the edition would never go live; on a ledger-only day the streak would never reach main and the alarm would never fire (#885)"
            exit 1
          fi

          git commit -m "Daily brief edition $(date -u +%F)"

          TARGET="${{ github.ref_name }}"
          REMOTE="https://x-access-token:${GITHUB_PAT}@github.com/${{ github.repository }}.git"
          PUSH_LOG="$(mktemp)"
          for attempt in 1 2 3; do
            if git push "$REMOTE" "HEAD:$TARGET" 2>&1 | tee "$PUSH_LOG"; then
              echo "pushed to $TARGET"
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push attempt $attempt failed"
            if [ "$attempt" -eq 3 ]; then
              break
            fi
            sleep $((attempt * 3))
            git pull --rebase "$REMOTE" "$TARGET" || { git rebase --abort 2>/dev/null || true; }
          done
          # Il ramo degradato qui sotto classifica per FORMA del fallimento
          # (retry esauriti), non per causa — e le due cose non coincidono. Un
          # PAT scaduto o revocato NON e' assente: passa il `-z` sopra, arriva
          # al push e prende un rifiuto identico ogni mattina. Degradarlo
          # riaprirebbe esattamente il buco appena chiuso per il PAT assente:
          # lo streak nuovo non raggiunge mai `main`, domani si rilegge lo
          # stesso `k`, la soglia non viene mai attraversata e per tutta la
          # durata del blackout — quando non c'e' nessun giorno-edizione a
          # rimettere il rosso — l'allarme non scatta MAI (#885).
          # Quindi: un rifiuto permanente (credenziale non valida, ref
          # protetto, repo non raggiungibile) resta rosso anche nel giorno di
          # soli-registro; solo un fallimento senza segno di rifiuto (rete,
          # race sul ref) e' transitorio e puo' morire sul runner.
          if grep -qiE 'denied|403|forbidden|protected branch|not found|authentication failed|invalid username or password|could not read username|support for password authentication' "$PUSH_LOG"; then
            echo "::error::push rifiutato in modo permanente (credenziale scaduta/revocata, ref protetto o repo non raggiungibile — vedi output sopra): non e' una causa transitoria, si ripeterebbe identica ogni mattina e su un giorno di soli-registro terrebbe lo streak sotto la soglia con l'allarme muto per sempre (#885)"
            exit 1
          fi
          if [ "$LEDGER_ONLY" = true ]; then
            echo "::warning::push fallito dopo 3 tentativi, ma in stage c'era solo il registro di degrado: muore sul runner (allarme in ritardo, nessun bollettino perso) invece di rendere rossa ogni mattina del blackout"
            echo "pushed=ledger-lost" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::push failed after 3 attempts (git output above)"
          exit 1

      # Best-effort CDN warm (upload-cdn-file.sh always exits 0 by design):
      # the static og:image URL is cdn.frontaliereticino.ch/images/blog/<id>.webp
      # and Discover fetches exactly that. Purge afterwards in case a 404 for
      # the not-yet-uploaded key was already cached at the edge.
      - name: Push hero + thumbnail to the CDN
        if: steps.mode.outputs.dry != 'true' && steps.commit.outputs.pushed == 'true'
        run: |
          set -euo pipefail
          ID="bollettino-frontaliere-$(date -u +%F)"
          HERO="public/images/blog/$ID.webp"
          THUMB="public/images/blog/thumbnails/$ID-480w.webp"
          if [ ! -f "$HERO" ]; then
            echo "::warning::$HERO not on disk — nothing to warm (edition may be a same-day refresh)"
            exit 0
          fi
          bash scripts/lib/upload-cdn-file.sh "$HERO" "images/blog/$ID.webp"
          if [ -f "$THUMB" ]; then
            bash scripts/lib/upload-cdn-file.sh "$THUMB" "images/blog/thumbnails/$ID-480w.webp"
          fi
          node scripts/cf-purge-cache.mjs --files="https://cdn.frontaliereticino.ch/images/blog/$ID.webp,https://cdn.frontaliereticino.ch/images/blog/thumbnails/$ID-480w.webp" || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### Daily Brief Edition"
            echo "- Dry run: ${{ steps.mode.outputs.dry }}"
            echo "- Pushed: ${{ steps.commit.outputs.pushed || 'n/a' }}"
            echo "- Target ref: ${{ github.ref_name }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── L'allarme di degradazione permanente, ULTIMO step del job (#882) ──
      #
      # La posizione e' il contenuto di questo step, non un dettaglio, e ha gia'
      # sbagliato due volte.
      #
      # Non sul refresh: lo streak per blocco vive solo dentro
      # `public/data/daily-brief.json`, e l'unico punto che lo rende durevole e'
      # il `git add` dello step `Commit and push`. Un exit code non-zero sul
      # refresh salta commit e push, quindi lo streak avanzato muore sul runner,
      # il checkout del giorno dopo rilegge lo snapshot di D-1 e la STESSA
      # edizione riattraversa la soglia: rosso ogni mattina e bollettino mai
      # pubblicato, cioe' la regressione che l'allarme esiste per chiudere.
      #
      # E nemmeno subito dopo il commit: `Push hero + thumbnail to the CDN` non
      # ha nessuna status function nel suo `if:`, quindi eredita un `success()`
      # implicito e un `exit 1` prima di lui lo salta. L'hero
      # `bollettino-frontaliere-<data>.webp` e' l'og:image esatto che Discover
      # fetcha: saltarlo lascia un 404 all'edge che `cf-purge-cache.mjs` non
      # ripulisce e che nessuna run successiva ripara, perche' quello step
      # lavora solo sull'ID del giorno corrente e da domani `degradation_crossed`
      # e' false per sempre. Il rosso costerebbe un pezzo dell'edizione su cui
      # viene speso.
      #
      # Quindi: ULTIMO. Ogni step che qualcuno aggiungera' a questo job va messo
      # PRIMA di questo, e `daily-brief-degradation-alarm.test.mjs` lo pretende.
      #
      # `steps.commit` puo' non aver pushato (niente in stage): lo streak nuovo
      # e' comunque committato — nello snapshot quando c'e' un'edizione, e in
      # `data/daily-brief-degradation.json` sempre, anche a 0/4 blocchi (#885)
      # — e il verdetto vale lo stesso: l'attraversamento va detto anche in un
      # giorno senza edizione.
      #
      # L'unica eccezione e' `pushed == 'ledger-lost'`: lo streak nuovo viveva
      # solo nel registro e il registro non ha raggiunto `main`. Domani si
      # rilegge il valore vecchio, si riattraversa la stessa soglia e il rosso
      # si ripete ogni mattina — il verdetto va speso su un attraversamento
      # durevole, o non va speso.
      - name: Degradation alarm — un blocco degradato da tre edizioni di fila
        if: steps.mode.outputs.dry != 'true' && steps.refresh.outputs.degradation_crossed == 'true' && steps.commit.outputs.pushed != 'ledger-lost'
        run: |
          set -euo pipefail
          BLOCKS='${{ steps.refresh.outputs.degradation_blocks }}'
          {
            echo "### ✖ Bollettino: degradazione permanente — \`$BLOCKS\`"
            echo
            echo "Questi blocchi degradano da tre edizioni consecutive. Non e' un'interruzione della fonte: e' un cambio di forma o di contratto a monte, e il Bollettino esce da giorni senza quelle sezioni **con la run verde**."
            echo
            echo "L'edizione di oggi **e' stata generata e committata** (questo step viene dopo il push): la run e' rossa per farsi leggere, non per fermare il giornale."
            echo
            echo "Le annotazioni \`::error::\` nello step \`Refresh the day's data snapshot\` nominano blocco, streak e ragione. Ripara la fonte o la guardia; dall'edizione successiva la run torna verde da sola."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::daily-brief: $BLOCKS degradati da tre edizioni consecutive — vedi il summary di questa run"
          exit 1
