name: Recycle stale PRs (close + re-queue source issue)

# R3-B: una PR flaggata `stale-review` da stale-pr-rescuer resta comunque ferma
# se nessuno agisce (alert-only). Osservato 2026-06-02: #1073/#1075 ferme ~29h.
# Far ripartire un branch vecchio contro un `main` che si è mosso di 100+ commit
# è conflict-prone e di basso valore. Meglio RICICLARE: chiudere la PR
# profondamente stale e ri-accodare la issue sorgente con `agent:fix` → fix
# fresco contro il `main` corrente (issue-fix apre un branch nuovo).
#
# Conservativo: agisce SOLO su PR `stale-review` aperte >24h E senza commit nuovi
# da >24h E con issue sorgente ancora OPEN. Daily (non urgente). dry_run per test.
# Separato da stale-pr-rescuer (che fira a ogni review completion) per non
# pagare npm ci + PAT ad ogni evento.

on:
  schedule:
    - cron: '50 6 * * *' # daily 06:50 UTC — cleanup non urgente, sfasato dal 40 6 del sito
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo log, niente close/re-queue'
        type: boolean
        default: true
      max_age_hours:
        description: 'Soglia "deeply stale" in ore (default 24)'
        type: string
        default: '24'
      max_recycles:
        description: 'Massimo di close+re-queue per run (default 5; lo scan riparte al run successivo)'
        type: string
        default: '5'

permissions:
  contents: write   # serve per --delete-branch sul gh pr close (vedi sotto)
  pull-requests: write
  issues: write

concurrency:
  group: recycle-stale-prs
  cancel-in-progress: false

jobs:
  recycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'


      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "⚠️ Nessuna Firebase SA — GITHUB_PAT non caricato; il re-queue (agent:fix) verrà SALTATO (serve PAT per triggerare issue-fix). La PR verrà comunque chiusa."
          fi

      - name: Load secrets from Remote Config (GITHUB_PAT)
        continue-on-error: true
        run: node generator/scripts/load-rc-env.mjs

      # Primary identity = GitHub App installation token (`frontaliere-automation[bot]`):
      # auto-mints, no expiry babysit, and the re-queue label push re-triggers
      # issue-fix.yml just like the PAT (issue-fix.yml's sender gate already
      # allowlists the App slug). Falls back to env.GITHUB_PAT (#2861 item 1).
      - name: Mint App token (primary identity, PAT fallback)
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/mint-app-token.mjs

      # PAT-down = degrado silenzioso a catena del loop autonomo (merge senza
      # cascade, coda congelata, routing/re-queue inerti). Alert inline
      # deterministico, dedup sul titolo canonico del monitor daily
      # (gh-pat-expiry-monitor.yml) che resta l'owner dell'auto-close.
      # GH_TOKEN = GITHUB_TOKEN, NON il PAT (e' la cosa rotta).
      - name: Alert token-down (dedup, zero-Claude)
        if: env.GITHUB_PAT_NANAKO == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/ci/alert-pat-down.mjs --workflow "${{ github.workflow }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Recycle deeply-stale stale-review PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT: ${{ env.GITHUB_PAT_NANAKO }}
          REPO: ${{ github.repository }}
          # Posture: lo SCHEDULE agisce (false) — è l'intento autonomo; il
          # DISPATCH manuale resta safe-by-default (input default true) per test.
          # Senza questo, il cron passa dry_run vuoto → permanentemente dry-run →
          # non riciclerebbe mai (reviewer nit). I gate conservativi (>24h + no
          # commit + issue OPEN) tengono il blast radius minimo.
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || github.event.inputs.dry_run }}
          MAX_AGE_HOURS: ${{ github.event.inputs.max_age_hours || '24' }}
          MAX_RECYCLES_PER_RUN: ${{ github.event.inputs.max_recycles || '5' }}
        run: |
          set -uo pipefail
          DRY="${DRY_RUN:-true}"
          NOW=$(date -u +%s)
          MAXAGE=$(( ${MAX_AGE_HOURS:-24} * 3600 ))
          MAX_RECYCLES="${MAX_RECYCLES_PER_RUN:-5}"
          if ! printf '%s' "$MAX_RECYCLES" | grep -qE '^[1-9][0-9]*$'; then
            echo "::error::MAX_RECYCLES_PER_RUN deve essere un intero positivo (ricevuto: $MAX_RECYCLES)."
            exit 1
          fi
          RECYCLE_ATTEMPTS=0

          # `autorebase-reopen-failed` e' escluso: quella label la mette
          # pr-autorebase quando la coppia close+reopen si rompe a meta', e dice
          # esattamente "non cancellare questo head ref". Questo workflow e'
          # l'unico che cancella branch su questo repo (`--delete-branch` sotto),
          # quindi e' qui che la label deve avere effetto — altrimenti resta un
          # segnale che nessuno legge, applicato proprio quando serve di piu'.
          #
          # `gh api --paginate` e non `gh pr list --limit 50`: quel
          # sottocomando non ha `--paginate`, il suo `--limit` TRONCA in
          # silenzio e ordina per creazione DISCENDENTE — cioe' taglia via
          # proprio le PR piu' VECCHIE, che sono per costruzione le uniche che
          # questo scan puo' riciclare (gate 1: aperte da >MAXAGE). Sopra il
          # cap lo scan resterebbe verde riciclando le PR sbagliate e lasciando
          # ferme per sempre quelle che deve riciclare. L'endpoint `issues` e'
          # l'unico che filtra per label; `.pull_request` seleziona le PR e il
          # rimappaggio riporta i campi alla forma che i gate sotto leggono.
          # Cattura PRIMA l'esito di gh --paginate, poi aggrega le righe JSON.
          # Se gh muore dopo una pagina, l'output parziale non arriva mai al
          # ramo di close: il prossimo run riparte dall'elenco completo.
          prs_lines=$(gh api --paginate "repos/$REPO/issues?state=open&labels=stale-review&per_page=100" \
            --jq '.[] | select(.pull_request) | {number, title, body, createdAt: .created_at, labels: [.labels[] | {name}]}' )
          PRS_RC=$?
          if [ "$PRS_RC" -ne 0 ]; then
            echo "::error::Query stale-review fallita (rc=$PRS_RC): non riciclo PR con lista incompleta."
            exit 1
          fi
          if ! prs=$(printf '%s\n' "$prs_lines" | jq -s '.'); then
            echo "::error::Output stale-review non valido dopo la paginazione: non riciclo PR."
            exit 1
          fi
          COUNT=$(printf '%s' "$prs" | jq 'length')
          echo "stale-review PRs aperte: $COUNT"

          printf '%s' "$prs" | jq -c '.[]' | while read -r pr; do
            N=$(printf '%s' "$pr" | jq -r '.number')
            TITLE=$(printf '%s' "$pr" | jq -r '.title')
            BODY=$(printf '%s' "$pr" | jq -r '.body // ""')
            CREATED=$(printf '%s' "$pr" | jq -r '.createdAt')
            HAS_AUTOFIX=$(printf '%s' "$pr" | jq -r 'if any(.labels[]?.name; . == "agent:autofix") then "true" else "false" end')

            # Gate 0 — head ref protetto. PRIMO di tutti: gli altri gate
            # decidono SE riciclare, questo decide se e' lecito farlo. Una PR
            # con questa label ha gia' avuto un close+reopen rotto a meta';
            # `gh pr close --delete-branch` qui sotto le porterebbe via anche il
            # branch, cioe' l'unica cosa ancora recuperabile.
            if printf '%s' "$pr" | jq -e '[.labels[].name] | index("autorebase-reopen-failed")' >/dev/null 2>&1; then
              echo "PR #$N ha autorebase-reopen-failed (head ref da preservare) — skip"; continue
            fi

            # Gate 1: PR aperta da >MAXAGE.
            CS=$(date -u -d "$CREATED" +%s 2>/dev/null || echo "$NOW")
            if [ $((NOW - CS)) -lt "$MAXAGE" ]; then echo "PR #$N non abbastanza vecchia — skip"; continue; fi

            # Gate 2: nessun commit nuovo da >MAXAGE (lavoro davvero abbandonato).
            # Una sola `gh pr view` per i tre campi che servono: il massimo delle
            # date di commit (gate 2), il nome del ref e la SHA della head, che
            # il gate di liberazione del branch qui sotto deve verificare.
            PRMETA=$(gh pr view "$N" --repo "$REPO" --json commits,headRefName,headRefOid 2>/dev/null || true)
            LASTCOMMIT=$(printf '%s' "$PRMETA" | jq -r '[.commits[]?.committedDate | select(type == "string" and length > 0)] | max // empty' 2>/dev/null || true)
            HEADREF=$(printf '%s' "$PRMETA" | jq -r '.headRefName // empty' 2>/dev/null || true)
            HEADSHA=$(printf '%s' "$PRMETA" | jq -r '.headRefOid // empty' 2>/dev/null || true)
            # Il recycle è distruttivo (chiude la PR e cancella il branch):
            # richiede la provenienza autonoma esplicita. `fix/*` conserva la
            # compatibilità con le PR storiche; le PR owner-authored nuove
            # arrivano con `agent:autofix` applicato dal fixer.
            if [ "$HAS_AUTOFIX" != "true" ] && ! printf '%s' "$HEADREF" | grep -q '^fix/'; then
              echo "PR #$N senza agent:autofix e branch non fix/* — skip recycle (solo PR autonome)"; continue
            fi
            # LASTCOMMIT vuoto = PR senza commit o head fork inaccessibile: NON
            # ricicliamo (il close --delete-branch su un head fork può fallire
            # silenziosamente lasciando il ref, e "0 commit" non è il lavoro
            # abbandonato che R3-B mira a riciclare). Skip difensivo. Cfr. #1201
            # item 3.
            if [ -z "$LASTCOMMIT" ]; then echo "PR #$N: nessun commit/head fork inaccessibile — skip recycle"; continue; fi
            LCS=$(date -u -d "$LASTCOMMIT" +%s 2>/dev/null || echo 0)
            if [ $((NOW - LCS)) -lt "$MAXAGE" ]; then echo "PR #$N ha commit recenti — skip (lavoro attivo)"; continue; fi

            # Source issue: "(#N)" nel titolo o "Closes #N" nel body.
            ISSUE=$(printf '%s' "$TITLE" | grep -oE '\(#[0-9]+\)' | tail -1 | grep -oE '[0-9]+' || true)
            if [ -z "${ISSUE:-}" ]; then
              ISSUE=$(printf '%s' "$BODY" | grep -oiE 'closes #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
            fi
            if [ -z "${ISSUE:-}" ]; then echo "PR #$N nessuna issue sorgente identificabile — skip (no recycle cieco)"; continue; fi

            # La issue sorgente deve essere OPEN (altrimenti non c'è cosa ri-accodare).
            IST=$(gh issue view "$ISSUE" --repo "$REPO" --json state --jq '.state' 2>/dev/null || echo "UNKNOWN")
            if [ "$IST" != "OPEN" ]; then echo "PR #$N → issue #$ISSUE stato=$IST (non OPEN) — skip"; continue; fi

            echo "::notice::PR #$N RICICLABILE → chiudi + re-queue issue #$ISSUE"
            if [ "$DRY" = "true" ]; then echo "(dry-run) skip azione PR #$N"; continue; fi

            # ── ORDINE: prima si LIBERA il ref, poi si ri-accoda ────────────
            #
            # Il re-label e' un trigger: `issue-fix` parte sull'evento
            # `labeled`, ricrea il branch con nome DETERMINISTICO `fix/issue-N`
            # e pusha con `git push -u` (no force). Se in quel momento il ref
            # remoto della PR stale e' ancora vivo, la storia diverge (vecchio
            # commit su un main mosso) → push non-fast-forward → rifiutato →
            # 0 PR → R3-B no-op SILENZIOSO proprio sul path che deve fixare.
            # Ri-accodare prima della chiusura apre quella finestra a ogni
            # riciclo, ed e' certa quando la close fallisce.
            #
            # Quindi: close --delete-branch, verifica che il ref sia sparito,
            # e solo allora il re-label. L'esito della close E' il gate.
            #
            # Il requisito che il re-queue proteggeva resta: senza PAT non si
            # tocca niente e la PR resta APERTA (un `agent:fix` via
            # GITHUB_TOKEN non triggera `issue-fix` — anti-ricorsione, sender
            # github-actions[bot] — quindi chiudere qui vorrebbe dire chiudere
            # senza che nessuno riprenda il lavoro).
            if [ -z "${PAT:-}" ]; then
              echo "⚠️ PAT assente — PR #${N} NON chiusa e issue #${ISSUE} NON ri-accodata. Ri-applicare agent:fix a mano."
              gh issue comment "${ISSUE}" --repo "${REPO}" --body "♻️ PR stale #${N} non chiusa: riapplicare \`agent:fix\` (serve PAT) per un fix fresco." 2>/dev/null || true
              continue
            fi

            # Cap misurato sul numero di chiusure tentate, riservato PRIMA
            # dell'operazione distruttiva. Con timeout 10min e tre probe di
            # ref per PR, 5 lascia margine a un run lento e rende lo scan
            # ripartibile: il prossimo run riprende la lista da capo.
            if [ "$RECYCLE_ATTEMPTS" -ge "$MAX_RECYCLES" ]; then
              echo "::notice::Cap $MAX_RECYCLES_PER_RUN raggiunto: fermo prima di un altro gh pr close --delete-branch; il prossimo run riprenderà lo scan."
              break
            fi
            RECYCLE_ATTEMPTS=$((RECYCLE_ATTEMPTS + 1))

            # --delete-branch OBBLIGATORIO: vedi sopra, e' cio' che libera il
            # nome per il push fresco. (richiede permissions.contents:write)
            if ! gh pr close "$N" --repo "$REPO" --delete-branch --comment "$(printf '♻️ **recycle** (auto): PR ferma >%sh come \x60stale-review\x60 con branch indietro su un main mosso di molti commit. Chiusa (branch remoto cancellato) e issue sorgente #%s ri-accodata per un fix fresco contro main corrente (issue-fix aprirà un branch nuovo con lo stesso nome). Il lavoro non è perso: la issue resta aperta.' "${MAX_AGE_HOURS:-24}" "$ISSUE")"; then
              echo "::warning::close fallita PR #${N}: NON ri-accodo issue #${ISSUE} (la PR resta aperta e il lavoro recuperabile)."
              continue
            fi

            # La close puo' tornare 0 e lasciare comunque il ref (head su fork,
            # branch protetto, race). Il push di issue-fix e' il consumatore del
            # ref, non della PR: si verifica il REF, non lo stato della PR.
            ref_free=false
            if [ -z "${HEADREF:-}" ]; then
              echo "::warning::PR #${N}: head ref sconosciuto, non posso verificare che sia libero"
            else
              for attempt in 1 2 3; do
                REF_SHA=$(gh api "repos/${REPO}/git/refs/heads/${HEADREF}" --jq '.object.sha' 2>/dev/null || true)
                if [ -z "$REF_SHA" ]; then
                  ref_free=true; break
                fi
                if [ "$attempt" = "2" ]; then
                  if [ -z "${HEADSHA:-}" ]; then
                    echo "::warning::PR #${N}: head SHA sconosciuta, skip DELETE del ref ${HEADREF}"
                    break
                  fi
                  if [ "$REF_SHA" != "$HEADSHA" ]; then
                    echo "::warning::PR #${N}: ref ${HEADREF} punta a ${REF_SHA}, diverso dalla head chiusa ${HEADSHA}; skip DELETE"
                    break
                  fi
                  gh api -X DELETE "repos/${REPO}/git/refs/heads/${HEADREF}" >/dev/null 2>&1 || true
                fi
                sleep 2
              done
            fi
            if [ "${ref_free}" != "true" ]; then
              # Ri-accodare ora significherebbe un push non-fast-forward e zero
              # PR. La issue resta aperta e il canale manuale la recupera.
              echo "::error::PR #${N}: branch ${HEADREF:-?} ancora presente dopo la close — NON ri-accodo issue #${ISSUE}."
              gh issue comment "${ISSUE}" --repo "${REPO}" --body "♻️ PR stale #${N} chiusa ma il branch \`${HEADREF:-?}\` non è stato cancellato: riapplicare \`agent:fix\` a mano dopo aver rimosso il ref (un fix fresco non potrebbe pushare)." 2>/dev/null || true
              continue
            fi

            # Re-queue: serve PAT (un agent:fix via GITHUB_TOKEN NON triggera
            # issue-fix — anti-ricorsione; sender github-actions[bot] non passa
            # il gate). Col PAT il sender e' un account del progetto, che il
            # gate di issue-fix accetta → trigger valido.
            GH_TOKEN="${PAT}" gh issue edit "${ISSUE}" --repo "${REPO}" --remove-label agent:fix 2>/dev/null || true
            sleep 2
            if GH_TOKEN="${PAT}" gh issue edit "${ISSUE}" --repo "${REPO}" --add-label agent:fix 2>/dev/null; then
              echo "issue #${ISSUE} ri-accodata (agent:fix via PAT)"
            else
              echo "::error::re-label fallito issue #${ISSUE} (PR #${N} gia' chiusa): riapplicare agent:fix a mano."
              gh issue comment "${ISSUE}" --repo "${REPO}" --body "♻️ PR stale #${N} chiusa ma il re-label \`agent:fix\` è fallito: riapplicarlo a mano per un fix fresco." 2>/dev/null || true
            fi

          done
          echo "Recycle scan completo."

      # Draft parcheggiate → `needs-human`. DEVE stare PRIMA del digest qui
      # sotto, cosi' una draft etichettata in questo run compare gia' nella
      # issue dello stesso run invece che 24h dopo.
      #
      # Il buco non e' in nessuno dei singoli strati: ognuno salta le draft con
      # una buona ragione (review, auto-merge, sweep, autorebase, rescuer), e
      # `recycle-stale-prs` qui sopra agisce solo su `stale-review`, che una
      # draft non riceve MAI proprio perche' il rescuer la salta. La somma
      # lascia una draft aperta fuori da tutto: e' rimasta cosi' la #33, uno
      # snapshot di sessione morta aperto come draft per rimandare una
      # decisione, che nessun processo avrebbe mai chiuso ne' segnalato.
      #
      # Solo label + commento: una draft parcheggiata puo' essere WIP vero, e
      # chiuderla d'ufficio sarebbe l'errore opposto e peggiore.
      # GITHUB_TOKEN basta (label + comment); nessun PAT, nessun Claude.
      - name: Flag parked draft PRs (zero-Claude)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Stessa postura del recycle sopra: lo schedule agisce, il dispatch
          # manuale resta dry-run per default.
          PARKED_HOURS: '48'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
            node scripts/ci/parked-pr-detector.mjs
          else
            node scripts/ci/parked-pr-detector.mjs --dry-run
          fi

      # Visibilita' needs-human: quattro sorgenti convergono su questa label — il
      # 🔴-fixer al round-cap, che etichetta e STOPPA (by-design), lo step qui
      # sopra per le draft parcheggiate, il followup-drainer per le issue
      # too-large, e da #413 l'escalation cronica di
      # scripts/ci/close-recovered-failure-issues.mjs. In tutti i casi NESSUN
      # processo rilancia o segnala quell'oggetto — resta fermo finche' l'owner
      # non guarda a mano (osservato #1526: 102h di latenza).
      #
      # PERCHE' ANCHE LE ISSUE, e perche' QUI. Su `needs-human` la label non e'
      # un selettore ma un filtro di ESCLUSIONE: followup-drainer.mjs la usa per
      # tenere una issue fuori dal pool dei retry parcheggiati (:1091) e fuori
      # dal rescue `agent:fix` dei crawler (:1204). Fino a #413 nessun workflow
      # dei due repo faceva `gh issue list --label needs-human`: una issue
      # escalata usciva da ogni coda automatica e non entrava in nessuna coda
      # umana. Misurato qui il 2026-08-18: 13 issue aperte su 26 — meta' esatta
      # del backlog — portavano la label, alcune ferme da nove giorni (#94, #138,
      # #249). Sul sito il report giornaliero del loop (loop-health-report, che
      # in questo repo non esiste) ne pubblica almeno il CONTEGGIO; qui non
      # esiste nemmeno quello, e un numero non dice comunque QUALI sono.
      # Il canale giusto e' questo e non uno nuovo — e' la regola scritta
      # in scripts/ci/parked-pr-detector.mjs («Riusarla significa che il segnale
      # finisce in un canale che esiste gia' ed e' gia' letto, invece di aprirne
      # un secondo che nessuno guarda») e in scripts/ci/lib/reopen-breaker.mjs.
      #
      # Il TITOLO non cambia: e' la chiave di dedup di github-issue-creator.mjs,
      # e rinominarlo orfanerebbe l'issue dedup gia' aperta (corpus #409, sito
      # #5041), che nessuno chiuderebbe piu'. Le due liste stanno nel corpo.
      - name: Surface needs-human PRs and issues (dedup, zero-Claude)
        id: surface_digest
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # UNICA sorgente del titolo: e' insieme la chiave di dedup di
          # github-issue-creator.mjs e il selettore che esclude questa stessa
          # issue dalla propria lista. Duplicarlo fra i due usi le farebbe
          # divergere in silenzio, e la seconda tornerebbe a auto-elencarsi.
          DEDUP_TITLE: 'needs-human: PR bloccate in attesa di revisione umana'
          # I TRACKER PERMANENTI, per TITOLO — uno per riga. Come DEDUP_TITLE
          # qui sopra, e per la stessa ragione: il titolo e' la chiave con cui
          # ognuno di questi oggetti viene ritrovato dal processo che lo
          # mantiene, quindi non e' apponibile da terzi e non cambia senza che
          # quel processo si accorga.
          #
          # Fino a #981 il filtro era la LABEL `agent:no-age-out`, e sbagliava
          # nei due versi opposti:
          #  - SOTTO-esclusione (item 2): sul digest dello sweep la label la
          #    mette un prompt Claude (`needs-human-sweep.yml`). Un run che
          #    ricrea il digest senza quella label lo rimette in questa lista, e
          #    `ISSUES` torna a non poter essere mai vuoto — l'assorbente di
          #    #733, ripristinato in silenzio e con la suite verde, perche' un
          #    test puo' verificare che la stringa sia nel prompt, non che
          #    l'oggetto reale l'abbia ricevuta. Il titolo invece e' ESATTO nel
          #    prompt E la chiave con cui lo step «Classify outcome» dello sweep
          #    ritrova il digest: sbagliarlo tinge di rosso quel run.
          #  - SOPRA-esclusione (item 3): `agent:no-age-out` significa «non
          #    scade», non «non e' un item umano». Un'issue genuinamente
          #    bloccata a cui qualcuno l'ha messa per tenerla fuori dall'age-out
          #    spariva dall'unica lista che gli umani leggono e, peggio,
          #    permetteva a questo digest di auto-chiudersi mentre quel blocco
          #    era vivo — il difetto opposto a quello riparato.
          # E non e' nemmeno una partizione esatta della classe:
          # `scripts/lib/github-issue-creator.mjs` documenta che il ledger
          # transient (#25) e' un tracker e la label NON ce l'ha (per questo e'
          # elencato qui sotto per titolo).
          #
          # Il legame fra questi titoli e le loro sorgenti — `DIGEST_TITLE` in
          # needs-human-sweep.yml e `TRANSIENT_LEDGER_TITLE` in
          # github-issue-creator.mjs, che uno YAML non puo' importare — e'
          # coperto da generator/tests/needs-human-digest-self-listing.test.mjs
          # (AGENTS.md #6).
          PERMANENT_TRACKER_TITLES: |
            🧭 Decisioni del proprietario — digest
            Crawler transient failures (rolling ledger)
        run: |
          set -uo pipefail
          # Il digest puo' essere appena creato o riaperto dopo il fetch che
          # classifica il backlog. Per chiudere e per riallineare il body serve
          # quindi una risoluzione fresca, sempre per titolo ESATTO e senza
          # filtro label: il digest nasce con `automation`, non con
          # `needs-human`.
          resolve_dedup_number() {
            local matches
            matches=$(gh api --paginate "repos/$GH_REPO/issues?state=open&per_page=100" \
              --jq 'first(.[] | select(.pull_request | not) | select(.title == env.DEDUP_TITLE) | .number)') || return 1
            printf '%s\n' "$matches" | head -n 1
          }
          # L'ESITO della query paginata e delle sue due partizioni, non solo il
          # loro output. `set -e` non e' attivo (i rami sotto decidono da soli),
          # quindi un `gh` non-zero — jq su una forma inattesa, rate-limit,
          # token scaduto — lascia la variabile VUOTA e indistinguibile da
          # «nessun residuo». La risposta unica fallita potrebbe quindi chiudere
          # il digest mentre il backlog needs-human e' pieno: senza fallire, e
          # sotto `continue-on-error: true`, l'unico canale che gli umani leggono
          # sparirebbe in silenzio.
          # I due gemelli che chiudono con `--resolve` in questo repo
          # (reconcile-article-shards.yml, republish-dirty-content.yml) gia'
          # subordinano la chiusura a `steps.detect.outcome == 'success'` prima
          # ancora di guardare il conteggio; qui produttore e consumatore
          # stanno nello stesso step, e l'equivalente e' catturare `$?`.
          #
          # E il PERIMETRO della query, non solo il suo esito: gira su
          # `gh api --paginate` e non su `gh pr list` / `gh issue list --limit
          # N`. Quei sottocomandi non hanno `--paginate` e il loro `--limit`
          # TRONCA IN SILENZIO: la lista PR qui non ne aveva nemmeno uno,
          # quindi si fermava al default di 30, e la lista issue si fermava a
          # 200 con i filtri applicati DOPO il taglio. Sopra il cap la lista
          # pubblicata e i due conteggi sotto-riportano senza errore — l'unico
          # canale che gli umani leggono direbbe «30 PR» con 90 aperte, che e'
          # la stessa bugia silenziosa della query fallita un passo piu' in
          # la'. `transport-identical-twins.yml`, `auto-merge-enroll-sweep.yml`
          # e `stale-pr-rescuer.yml` hanno gia' preso questa via.
          #
          # PR e issue vengono dallo STESSO endpoint `issues`, che le elenca
          # entrambe: e' l'unico che accetta il filtro per label
          # (`repos/.../pulls` non ce l'ha), e la presenza di `.pull_request`
          # e' la discriminante fra i due tipi. Si pagina una volta sola e si
          # partiziona il risultato in memoria: una sola risposta evita il
          # doppio consumo di rate-limit e osserva un backlog coerente.
          # `gh --paginate --jq` emette un oggetto per item; il `jq -s` locale
          # ricompone la risposta prima della validazione del payload. Cosi' il
          # comando paginato resta l'unico fetch, ma il parser di #1389 continua
          # a rifiutare JSON invalido, envelope con errors e forme troncate.
          OPEN_ISSUES_API="repos/$GH_REPO/issues?state=open&per_page=100"
          # shellcheck disable=SC2016 # le variabili $ENV.* appartengono a jq, non alla shell
          OPEN_ISSUES_LINES=$(gh api --paginate "$OPEN_ISSUES_API" --jq '.[] | . as $i | {
            number: $i.number,
            title: $i.title,
            updated_at: $i.updated_at,
            pull_request: ($i.pull_request // null),
            needs_human: ([$i.labels[]? | .name] | index("needs-human") != null),
            dedup: (($i.pull_request == null) and ($i.title == $ENV.DEDUP_TITLE)),
            permanent_tracker: (($i.pull_request == null) and (($ENV.PERMANENT_TRACKER_TITLES | split("\n") | map(select(length > 0)) | index($i.title)) != null))
          }')
          OPEN_ISSUES_FETCH_RC=$?
          OPEN_ISSUES_ARRAY=''
          OPEN_ISSUES_ARRAY_RC=1
          NEEDS_HUMAN_PAYLOAD=''
          NEEDS_HUMAN_ITEMS=''
          NEEDS_HUMAN_RC=1
          NEEDS_HUMAN_SHAPE_RC=1
          NEEDS_HUMAN_MARKER_RC=1
          NEEDS_HUMAN_PAYLOAD_MARKER='<!-- NEEDS_HUMAN_DIGEST_PAYLOAD_OK -->'
          if [ "$OPEN_ISSUES_FETCH_RC" -eq 0 ]; then
            OPEN_ISSUES_ARRAY=$(printf '%s\n' "$OPEN_ISSUES_LINES" | jq -s '.')
            OPEN_ISSUES_ARRAY_RC=$?
            if [ "$OPEN_ISSUES_ARRAY_RC" -eq 0 ]; then
              # Il parser controlla ogni item e rifiuta errors/data parziali
              # prima che un array vuoto possa entrare nel ramo di chiusura.
              NEEDS_HUMAN_PAYLOAD=$(printf '%s' "$OPEN_ISSUES_ARRAY" | node scripts/ci/needs-human-digest.mjs)
              NEEDS_HUMAN_SHAPE_RC=$?
              if [ "$NEEDS_HUMAN_SHAPE_RC" -eq 0 ]; then
                NEEDS_HUMAN_MARKER=$(printf '%s\n' "$NEEDS_HUMAN_PAYLOAD" | sed -n '1p')
                if [ "$NEEDS_HUMAN_MARKER" = "$NEEDS_HUMAN_PAYLOAD_MARKER" ]; then
                  NEEDS_HUMAN_MARKER_RC=0
                  OPEN_ISSUES_ITEMS=$(printf '%s\n' "$NEEDS_HUMAN_PAYLOAD" | tail -n +2)
                  NEEDS_HUMAN_ITEMS=$(printf '%s\n' "$OPEN_ISSUES_ITEMS" | jq '[.[] | select(.needs_human == true)]')
                  NEEDS_HUMAN_RC=$?
                fi
              fi
            fi
          fi
          # L'issue dedup di questo stesso step nasce con `automation` e NON
          # con `needs-human` — ma niente le impedisce di riceverla dopo: il
          # followup-drainer gliel'ha messa il 2026-09-02T13:39:50Z (issue
          # #733), e dal commento di recurrence successivo l'issue si elenca
          # fra i propri item. Un report che si auto-elenca non converge mai:
          # la condizione di chiusura che questo stesso step scrive nel body
          # (liste entrambe vuote, richiusa sotto per numero) diventa
          # irraggiungibile, perche' la lista issue contiene sempre almeno se
          # stessa. L'esclusione va fatta QUI, sulla chiave di dedup, non
          # sperando che la label resti quella di partenza.
          #
          # SECONDA esclusione, stessa forma e stessa chiave (il TITOLO): i
          # TRACKER PERMANENTI. Il digest dello sweep esiste per restare aperto
          # e non ha una causa singola da riparare; finche' compare qui,
          # `ISSUES` non e' MAI vuoto e la chiusura promessa nel corpo resta
          # irraggiungibile — l'assorbente di #733 con un'altra issue al posto
          # di questa. Elencarlo come «oggetto che aspetta occhi umani» e' anche
          # falso: il digest E' il canale umano, non un item da sbloccare.
          # Perche' per titolo e non per label: vedi PERMANENT_TRACKER_TITLES.
          PRS=$(printf '%s\n' "$NEEDS_HUMAN_ITEMS" | jq -r '[.[] | select(.pull_request) | "- #\(.number) \(.title) (ultimo update \(.updated_at))"] | join("\n")')
          PRS_RC=$?
          ISSUES=$(printf '%s\n' "$NEEDS_HUMAN_ITEMS" | jq -r '[.[] | select((.pull_request | not) and (.dedup | not) and (.permanent_tracker | not)) | "- #\(.number) \(.title) (ultimo update \(.updated_at))"] | join("\n")')
          ISSUES_RC=$?
          if [ "$OPEN_ISSUES_FETCH_RC" -ne 0 ] || [ "$OPEN_ISSUES_ARRAY_RC" -ne 0 ] || [ "$NEEDS_HUMAN_RC" -ne 0 ] || [ "$NEEDS_HUMAN_SHAPE_RC" -ne 0 ] || [ "$NEEDS_HUMAN_MARKER_RC" -ne 0 ]; then
            # Query fallita: lo stato del backlog e' SCONOSCIUTO, non vuoto.
            # Non si chiude e non si ripubblica il corpo (che con una lista
            # troncata da un errore direbbe il falso): si fallisce lo step —
            # `continue-on-error: true` tiene comunque verde il job, ma il
            # rosso resta visibile e il prossimo run ricalcola da zero.
            echo "::error::Payload needs-human fallito (fetch rc=$OPEN_ISSUES_FETCH_RC, array rc=$OPEN_ISSUES_ARRAY_RC, partition rc=$NEEDS_HUMAN_RC, shape rc=$NEEDS_HUMAN_SHAPE_RC, marker rc=$NEEDS_HUMAN_MARKER_RC): non tocco l'issue dedup. Liste vuote per una risposta parziale o malformata non sono «nessun residuo»."
            exit 1
          fi
          # Le due partizioni hanno esiti indipendenti. Se una sola fallisce,
          # la metà buona resta pubblicabile ma porta un marker esplicito e un
          # placeholder: non si chiude un digest quando una metà è sconosciuta.
          # Se falliscono entrambe, non c'è una metà affidabile da pubblicare.
          if [ "$PRS_RC" -ne 0 ] && [ "$ISSUES_RC" -ne 0 ]; then
            echo "::error::Partizioni needs-human entrambe fallite (PR rc=$PRS_RC, issue rc=$ISSUES_RC): non tocco l'issue dedup."
            exit 1
          fi
          INCOMPLETE_CHANNELS=''
          PR_COUNT=0
          ISSUE_COUNT=0
          if [ "$PRS_RC" -ne 0 ]; then
            INCOMPLETE_CHANNELS='prs'
            PRS='_(lista PR non disponibile in questo run; la metà buona resta pubblicata)_'
            PR_COUNT='n/d'
          else
            [ -n "$PRS" ] && PR_COUNT=$(printf '%s\n' "$PRS" | wc -l | tr -d ' ')
          fi
          if [ "$ISSUES_RC" -ne 0 ]; then
            INCOMPLETE_CHANNELS="${INCOMPLETE_CHANNELS}${INCOMPLETE_CHANNELS:+,}issues"
            ISSUES='_(lista issue non disponibile in questo run; la metà buona resta pubblicata)_'
            ISSUE_COUNT='n/d'
          else
            [ -n "$ISSUES" ] && ISSUE_COUNT=$(printf '%s\n' "$ISSUES" | wc -l | tr -d ' ')
          fi
          INCOMPLETE_MARKER=''
          DIGEST_PREFIX=''
          if [ -n "$INCOMPLETE_CHANNELS" ]; then
            INCOMPLETE_MARKER="<!-- NEEDS_HUMAN_DIGEST_INCOMPLETE: $INCOMPLETE_CHANNELS -->"
            DIGEST_PREFIX="$INCOMPLETE_MARKER\n⚠️ **Lista incompleta:** il prossimo run con entrambe le partizioni leggibili sostituirà questo marker e il contenuto parziale."
            echo "::warning::$INCOMPLETE_MARKER una sola metà del digest è stata pubblicata; la chiusura resta disabilitata."
          fi
          if [ -z "$PRS" ] && [ -z "$ISSUES" ] && [ -z "$INCOMPLETE_MARKER" ]; then
            # Liste vuote = la condizione di chiusura che il corpo promette.
            # Uscire e basta la lasciava non mantenuta: l'issue dedup restava
            # aperta con un elenco ormai falso, e nessun altro processo la
            # chiude (close-recovered-failure-issues.mjs copre le famiglie
            # `Workflow Failure:` / `Crawler Failure:`, non questo titolo).
            # #733 ne e' l'osservazione: dopo il fix dell'auto-elencamento la
            # sua lista puo' finalmente svuotarsi, ma senza un chiuditore
            # sarebbe rimasta aperta lo stesso — un secondo assorbente dietro
            # al primo.
            #
            # La chiusura risolve il NUMERO dell'issue con la STESSA
            # uguaglianza esatta con cui la lista qui sopra la esclude
            # (`.title == $ENV.DEDUP_TITLE`), e chiude quel numero. Passava da
            # `github-issue-creator.mjs --resolve`, che cerca per PREFISSO
            # SANITIZZATO a 60 char (`searchIssuesByTitlePrefix`,
            # `startsWith`): il titolo di dedup ne ha 52, quindi il prefisso e'
            # il titolo INTERO e qualunque issue aperta il cui titolo comincia
            # con questa chiave e prosegue (`… — 2026-09`, un duplicato
            # rinominato, una escalation che cita la chiave) sarebbe stata
            # chiusa AL POSTO del digest. Quella issue, senza `needs-human`,
            # non compare in nessuna delle due liste: le liste restano vuote a
            # ogni run, il digest resta aperto con un elenco falso e a ogni
            # giro si chiude un'altra issue estranea. Le due forme della chiave
            # divergono, ed e' la divergenza il difetto — non il match per
            # prefisso, che in `github-issue-creator.mjs` e' deliberato
            # («Deliberately asymmetric», :296) e su cui contano tutti gli
            # altri chiamanti. Qui apertura, esclusione e chiusura tornano a
            # usare UNA sola forma della chiave.
            #
            # Il numero va risolto di nuovo: il digest puo' essere stato chiuso
            # da un run precedente e la risposta iniziale non contiene issue
            # che si riaprono dopo il fetch. La funzione condivisa usa la stessa
            # uguaglianza esatta della classificazione, pagina senza cap e
            # distingue una PR da un'issue anche se la label e' cambiata.
            echo "Niente needs-human aperto (ne PR ne issue): richiudo l'issue dedup, se aperta."
            DEDUP_NUMBER=$(resolve_dedup_number)
            DEDUP_RC=$?
            if [ "$DEDUP_RC" -ne 0 ]; then
              # Stesso principio del guard sopra: query fallita non e' «nessun
              # digest aperto». Non si chiude niente e lo step diventa rosso.
              echo "::error::Query dell'issue dedup fallita (rc=$DEDUP_RC): non chiudo niente. Un risultato vuoto per un errore non e «issue gia chiusa»."
              exit 1
            fi
            if [ -z "$DEDUP_NUMBER" ]; then
              echo "Nessuna issue aperta con il titolo di dedup: niente da chiudere."
              exit 0
            fi
            echo "Chiudo l'issue dedup #$DEDUP_NUMBER."
            gh issue close "$DEDUP_NUMBER" \
              --comment "Chiusa da \`Recycle stale PRs\`: nessun oggetto \`needs-human\` aperto (ne PR ne issue), la condizione di chiusura scritta nel corpo e soddisfatta. Il prossimo residuo riapre un'issue nuova con lo stesso titolo."
            exit 0
          fi
          echo "needs-human aperti: $PR_COUNT PR, $ISSUE_COUNT issue"
          [ -n "$PRS" ] || PRS='_(nessuna)_'
          [ -n "$ISSUES" ] || ISSUES='_(nessuna)_'
          DESC=$(printf '%b\n\nNessun processo automatico sblocchera questi oggetti, e su `needs-human` la label e un filtro di ESCLUSIONE dalle code del drainer, non una segnalazione. Servono occhi umani.\n\n**PR** (%s) — il fixer dei red-flag ha raggiunto il round-cap e si e fermato (anti-loop), oppure sono draft parcheggiate, che ogni strato del ciclo salta by-design:\n\n%s\n\n**Issue** (%s) — escalate dal followup-drainer (too-large) o dal gate cronico di close-recovered-failure-issues.mjs (un guasto che ricorre oltre soglia). Restano fuori dal pool dei retry parcheggiati e dal rescue agent:fix dei crawler finche portano la label. Esclusi i tracker permanenti, riconosciuti per TITOLO (il digest dello sweep, il ledger transient): sono aperti per costruzione e non sono item da sbloccare. Escludere per label non sarebbe la stessa cosa — `agent:no-age-out` vuol dire «non scade», e nasconderebbe da qui una issue davvero bloccata:\n\n%s\n\n_Issue dedup giornaliera da recycle-stale-prs.yml (zero-Claude); si aggiorna con un commento di recurrence finche esiste qualcosa di needs-human, e si richiude da sola al primo run in cui entrambe le liste sono vuote (i tracker permanenti non contano come residuo)._' "$DIGEST_PREFIX" "$PR_COUNT" "$PRS" "$ISSUE_COUNT" "$ISSUES")
          node scripts/ci/publish-needs-human-digest.mjs \
            --fail-on-write \
            --title "$DEDUP_TITLE" \
            --description "$DESC" \
            --priority 2 \
            --label automation \
            --workflow "Recycle stale PRs"

          PUBLISH_RC=$?
          if [ "$PUBLISH_RC" -ne 0 ]; then
            echo "::error::Pubblicazione del digest non persistita (rc=$PUBLISH_RC): il body non viene riallineato."
            exit "$PUBLISH_RC"
          fi

          # `createGithubIssue` aggiorna il body solo alla prima creazione; su
          # recurrence e reopen scrive un commento e conserva il body. Risolvo
          # il numero dopo la scrittura e sostituisco il body con le liste di
          # questo run, cosi' il testo visibile e l'ultimo commento restano
          # sulla stessa fotografia (#1004).
          DEDUP_NUMBER=$(resolve_dedup_number)
          DEDUP_RC=$?
          if [ "$DEDUP_RC" -ne 0 ]; then
            echo "::error::Query dell'issue dedup fallita (rc=$DEDUP_RC): il body puo' essere rimasto quello precedente."
            exit 1
          fi
          if [ -z "$DEDUP_NUMBER" ]; then
            echo "::error::Digest pubblicato ma issue dedup non trovata con titolo esatto: body non riallineato."
            exit 1
          fi
          echo "Riallineo il body dell'issue dedup #$DEDUP_NUMBER alle liste di questo run."
          gh issue edit "$DEDUP_NUMBER" --body "$DESC"
          EDIT_RC=$?
          if [ "$EDIT_RC" -ne 0 ]; then
            echo "::error::Riallineamento del body dell'issue dedup fallito (rc=$EDIT_RC)."
            exit 1
          fi

      # `continue-on-error` sul produttore protegge il resto del recycle, ma da
      # solo renderebbe un errore persistente indistinguibile da un digest sano.
      # Questo watchdog osserva l'outcome dello step e rialza il segnale al job:
      # il corpo dell'ultima pubblicazione buona resta intatto, mentre il run
      # diventa visibilmente rosso finché il produttore non torna aggiornabile.
      - name: Watchdog — needs-human digest outcome
        if: always()
        env:
          SURFACE_OUTCOME: ${{ steps.surface_digest.outcome }}
        run: |
          set -eu
          if [ "$SURFACE_OUTCOME" != "success" ]; then
            echo "::error::needs-human digest non aggiornato in questo run (surface outcome=$SURFACE_OUTCOME): l'ultima pubblicazione buona resta conservata, ma serve un run riuscito."
            exit 1
          fi
          echo "needs-human digest aggiornato o verificato con successo."
