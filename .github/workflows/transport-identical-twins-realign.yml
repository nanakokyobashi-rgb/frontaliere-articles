name: Transport identical twins (post-merge realign)

# La PR di trasporto verifica i byte prima del push, ma una persona può
# correggere uno dei file nella PR prima del merge. Questo job rilegge la
# provenienza dal body della PR e il commit di main dopo il merge, quindi
# aggiorna solo `baseline.corpus` quando i byte committati sono ancora quelli
# scaricati. Un mismatch resta rosso: non inventa una baseline locale.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

concurrency:
  # Tutti i riallineamenti scrivono lo stesso manifest su main: il lock deve
  # essere globale, non per PR, altrimenti due merge diversi possono calcolare
  # lo stesso parent e uno dei push viene respinto senza poter aggiornare la
  # baseline.
  group: transport-identical-twins-realign-main
  cancel-in-progress: false

jobs:
  realign:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'transport/identical-twins-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main dopo il merge
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Prepara lista dal body e dai file della PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER" --jq '.body // ""' > "$RUNNER_TEMP/transport-body.md"
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename' > "$RUNNER_TEMP/transport-files.txt"
          # Formato e parser vivono in scripts/ci/transport-realign-body.mjs,
          # lo stesso modulo con cui transport-identical-twins.yml scrive le
          # righe: path con backtick, hash storiche e bullet duplicati hanno una
          # sola definizione, coperta da generator/tests/transport-realign-body.test.mjs.
          node scripts/ci/transport-realign-body.mjs \
            "$RUNNER_TEMP/transport-body.md" \
            "$RUNNER_TEMP/transport-files.txt" \
            "$RUNNER_TEMP/transport-realign.tsv"

      # Il PAT corpus-owned permette il push sul branch protetto quando le
      # regole lo consentono; senza caricarlo il job non può materializzare la
      # correzione del solo manifest.
      - name: Write Firebase SA (se presente)
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -uo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load secrets from Remote Config
        continue-on-error: true
        run: node generator/scripts/load-rc-env.mjs

      - name: Riallinea e committa la baseline su main
        if: hashFiles('.github/workflows/transport-identical-twins-realign.yml') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          runtime_pat="${GITHUB_PAT_NANAKO:-}"
          if [ -z "$runtime_pat" ]; then
            echo "::warning::Nessun GITHUB_PAT_NANAKO runtime → riallineamento post-merge inerte."
            exit 0
          fi
          export GH_TOKEN="$runtime_pat"
          if [ ! -s "$RUNNER_TEMP/transport-realign.tsv" ]; then
            echo "Nessun file trasportato nel body: niente riallineamento post-merge."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${runtime_pat}@github.com/${REPO}.git"
          for attempt in 1 2 3; do
            git fetch origin main --prune
            git checkout --detach origin/main
            rc=0
            node scripts/ci/transport-identical-twins.mjs --realign="$RUNNER_TEMP/transport-realign.tsv" --json > "$RUNNER_TEMP/realign.json" || rc=$?
            cat "$RUNNER_TEMP/realign.json"
            if [ "$rc" != "0" ]; then
              echo "Il realign post-merge non è certificabile: nessun commit automatico della baseline."
              exit "$rc"
            fi
            if git diff --quiet -- scripts/ci/loop-sync-manifest.json; then
              echo "Baseline già allineata: niente commit post-merge."
              exit 0
            fi
            if [ -n "$(git diff --name-only)" ] && [ "$(git diff --name-only)" != "scripts/ci/loop-sync-manifest.json" ]; then
              echo "::error::Il realign ha modificato file oltre il manifest."
              exit 1
            fi
            git add -- scripts/ci/loop-sync-manifest.json
            git commit -m "chore(loop): riallinea baseline dopo trasporto"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::Push post-merge non fast-forward o temporaneamente rifiutato; aggiorno main e ritento ($attempt/3)."
          done
          echo "::error::Push post-merge fallito dopo 3 tentativi: la baseline resta da riallineare in una passata successiva."
          exit 1

      - name: PAT assente — segnala il blocco
        if: always() && hashFiles('.github/workflows/transport-identical-twins-realign.yml') != ''
        run: |
          if [ -n "${GITHUB_PAT_NANAKO:-}" ]; then
            exit 0
          fi
          echo "::error::GITHUB_PAT_NANAKO assente: la correzione post-merge del manifest è blocked: credenziale Remote Config non disponibile."
          exit 1
