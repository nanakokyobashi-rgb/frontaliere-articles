name: reconcile-section-pages

# Riconcilia le pagine ANNUNCIATE delle sezioni cantonali `live` con cio' che
# R2 ha davvero, osserva anche le pagine articolo ORFANE dal manifest dell'edge
# e ripubblica le mancanti o le orfane dispatchando fast-publish-section.yml
# (piano «sezioni articoli per cantone», P7b). Gemello di
# reconcile-article-shards.yml per le sezioni servite dal Worker.
#
# fast-publish-section.yml pubblica gli articoli del commit che lo fa scattare:
# un push con piu' commit, una run fallita a meta' o un upload non confermato
# lasciano un articolo annunciato (slugs.json, sitemap di sezione, feed) e
# assente su R2 — un 404 su un URL dichiarato. Un run fallito può anche lasciare
# una pagina ritirata sull'edge: il manifest scritto dal publisher dopo una
# release verificata rende quella chiave osservabile nel giro seguente. Qui si
# chiudono entrambi i buchi, con un CAP PER SEZIONE (D8) cosi' che un cantone
# con molti buchi non consumi il giro degli altri. Quando l'edge flip e'
# pendente, le run di backfill sono staged senza replay individuale. Il
# reconcile ritorna subito; la conclusione di ogni child riapre il controllo
# event-driven e l'ultimo giro che dimostra la superficie completa accoda il
# replay API globale. Nessun runner resta occupato ad aspettare altri runner.
#
# Finche' nessuna sezione e' live il rilevamento e' un no-op (zero sezioni).

on:
  workflow_run:
    workflows: [fast-publish-section]
    types: [completed]
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rileva e riporta, non dispatcha backfill'
        required: false
        default: true
        type: boolean
      cap:
        description: 'Articoli massimi per sezione in questo run'
        required: false
        default: '3'

concurrency:
  group: reconcile-section-pages
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # dispatch di fast-publish-section.yml

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Detect announced pages missing on R2
        id: detect
        env:
          CAP_INPUT: ${{ inputs.cap }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/reconcile-section-pages.mjs \
            --out "$RUNNER_TEMP/reconcile-sections.json" --cap "${CAP_INPUT:-3}"
          source_commit="$(git rev-parse HEAD)"
          current_main="$(bash scripts/ci/read-main-head.sh)"
          if ! [[ "$source_commit" =~ ^[a-f0-9]{40}$ ]] || ! [[ "$current_main" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::HEAD del reconcile o HEAD corrente di main non valida"
            exit 1
          fi
          if [ "$source_commit" != "$current_main" ]; then
            echo "::notice::reconcile stantio: checkout $source_commit, main $current_main; nessun backfill o replay armato"
            {
              echo 'dispatch=0'
              echo 'pending_edge_flip=false'
              echo 'head_guard=false'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "dispatch=$(jq -r '.counts.dispatch // 0' "$RUNNER_TEMP/reconcile-sections.json")"
            echo "pending_edge_flip=$(jq -r '.pendingEdgeFlip // false' "$RUNNER_TEMP/reconcile-sections.json")"
            echo "api_release_commit=$(jq -r '.apiCommit // empty' "$RUNNER_TEMP/reconcile-sections.json")"
            echo "source_commit=$source_commit"
            echo "skip=$(jq -r 'if .skip then \"true\" else \"false\" end' "$RUNNER_TEMP/reconcile-sections.json")"
            echo "leftover=$(jq -r '.counts.leftover // 0' "$RUNNER_TEMP/reconcile-sections.json")"
            echo "unknown=$(jq -r '.counts.unknown // 0' "$RUNNER_TEMP/reconcile-sections.json")"
            echo "manifest_unknown=$(jq -r '.counts.manifestUnknown // 0' "$RUNNER_TEMP/reconcile-sections.json")"
            echo "landing_content_stale=$(jq -r '.counts.landingContentStale // 0' "$RUNNER_TEMP/reconcile-sections.json")"
            echo 'head_guard=true'
          } >> "$GITHUB_OUTPUT"

      # Niente catena stretta: solo i child con un nonce emesso da questo
      # workflow o dalla recovery coordinata possono riaprire il controllo
      # event-driven. Il run coordinatore che ha accettato i dispatch resta un
      # normale producer event e non puo' armare il replay globale prima dei
      # child. E' la stessa regola di reconcile-article-shards.yml.
      - name: Resolve backfill mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_RUN_DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
          PENDING_EDGE_FLIP: ${{ steps.detect.outputs.pending_edge_flip }}
        run: |
          set -euo pipefail
          allow=true
          event_replay=false
          schedule_retry=false
          trusted_child=false
          child_nonce=''
          child_cohort=''
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" != "false" ]; then
            allow=false; echo "dispatch disabilitato: dry_run manuale"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$WORKFLOW_RUN_EVENT" = "workflow_dispatch" ]; then
              child_nonce="${WORKFLOW_RUN_DISPLAY_TITLE#*nonce=}"
              child_nonce="${child_nonce%% / dry=*}"
              child_cohort="${WORKFLOW_RUN_DISPLAY_TITLE#* / c=}"
              case "$child_nonce" in
                reconcile-*|stale-staged-*|stale-late-*)
                  trusted_child=true
                  ;;
              esac
            fi
            if [ "$WORKFLOW_RUN_CONCLUSION" = "success" ] && [ "$trusted_child" = 'true' ]; then
              event_replay=true
            fi
            if [ "$trusted_child" = 'true' ]; then
              allow=false; echo "dispatch disabilitato: il child ha gia' eseguito il backfill; controllo event-driven"
            fi
          elif [ "$EVENT_NAME" = "schedule" ] && [ "$PENDING_EDGE_FLIP" = 'true' ]; then
            schedule_retry=true
            echo "replay retry abilitato dal cron: flip API pendente"
          fi
          {
            echo "allow=$allow"
            echo "event_replay=$event_replay"
            echo "schedule_retry=$schedule_retry"
            echo "trusted_child=$trusted_child"
            echo "child_nonce=$child_nonce"
            echo "child_cohort=$child_cohort"
          } >> "$GITHUB_OUTPUT"

      # Un evento workflow_run con il solo titolo non dimostra che il child
      # abbia pubblicato la revisione osservata: il coordinatore del child puo'
      # terminare verde subito dopo aver accettato un dispatch. Il child deve
      # quindi lasciare un artifact fresco, con nonce e source commit coerenti;
      # in caso contrario il replay globale resta chiuso.
      - name: Verify complete event-driven child cohort
        id: child_artifact
        if: steps.mode.outputs.event_replay == 'true' || steps.mode.outputs.schedule_retry == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CHILD_NONCE: ${{ steps.mode.outputs.child_nonce }}
          CHILD_COHORT: ${{ steps.mode.outputs.child_cohort }}
          EXPECTED_SOURCE_COMMIT: ${{ steps.detect.outputs.source_commit }}
          MODE: ${{ steps.mode.outputs.schedule_retry == 'true' && 'schedule' || 'event' }}
        run: |
          bash scripts/ci/verify-fast-publish-section-cohort.sh

      # Il backfill e' un publisher a tutti gli effetti: eredita gli stessi
      # interruttori del fast-publish, anche quando il reconcile nasce da
      # workflow_run o dal cron. La detection resta attiva, ma non si carica
      # una pagina live mentre il kill-switch tiene spenti gli upload.
      - name: Resolve fast-publish kill-switch
        id: arm
        run: |
          set -euo pipefail
          allow=true
          if [ -f .github/FAST_PUBLISH_DISABLED ]; then
            allow=false; echo "dispatch backfill disabilitato: .github/FAST_PUBLISH_DISABLED presente"
          elif [ "${{ vars.FAST_PUBLISH_ARMED }}" = "false" ]; then
            allow=false; echo "dispatch backfill disabilitato: repo variable FAST_PUBLISH_ARMED=false"
          fi
          echo "allow=$allow" >> "$GITHUB_OUTPUT"

      - name: Prepare Firebase credentials for producer dispatch
        if: >-
          (steps.mode.outputs.allow == 'true' || steps.mode.outputs.event_replay == 'true') &&
          steps.arm.outputs.allow == 'true' &&
          steps.detect.outputs.head_guard == 'true' &&
          (steps.detect.outputs.dispatch != '0' || steps.detect.outputs.pending_edge_flip == 'true')
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON assente: dispatch producer non autorizzabile"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/reconcile-dispatch-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/reconcile-dispatch-sa.json" >> "$GITHUB_ENV"

      - name: Load producer token from Remote Config
        if: >-
          (steps.mode.outputs.allow == 'true' || steps.mode.outputs.event_replay == 'true') &&
          steps.arm.outputs.allow == 'true' &&
          steps.detect.outputs.head_guard == 'true' &&
          (steps.detect.outputs.dispatch != '0' || steps.detect.outputs.pending_edge_flip == 'true')
        run: node generator/scripts/load-rc-env.mjs

      - name: Backfill (dispatch fast-publish-section per sezione)
        if: steps.mode.outputs.allow == 'true' && steps.arm.outputs.allow == 'true' && steps.detect.outputs.dispatch != '0'
        env:
          PENDING_EDGE_FLIP: ${{ steps.detect.outputs.pending_edge_flip }}
          API_RELEASE_COMMIT: ${{ steps.detect.outputs.api_release_commit }}
          SOURCE_COMMIT: ${{ steps.detect.outputs.source_commit }}
        run: |
          set -euo pipefail
          runtime_pat="${GITHUB_PAT_NANAKO:-}"
          if [ -z "$runtime_pat" ]; then
            echo "::error::GITHUB_PAT_NANAKO non caricato: dispatch backfill non autorizzato"
            exit 1
          fi
          export GH_TOKEN="$runtime_pat"
          dispatch_cohort_size="$(jq '[.sections[] | select(.dispatch)] | length' "$RUNNER_TEMP/reconcile-sections.json")"
          if ! [[ "$dispatch_cohort_size" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::dimensione coorte reconcile non valida: $dispatch_cohort_size"
            exit 1
          fi
          dispatch_cohort="reconcile-${GITHUB_RUN_ID}-n${dispatch_cohort_size}"
          fail=0
          while IFS=$'\t' read -r section ids missing_page_paths known_missing_page_paths; do
            [ -n "$section" ] || continue
            echo "── backfill $section ids=$ids"
            dispatch_nonce="reconcile-${GITHUB_RUN_ID}-${section}"
            args=(
              -f "section=$section"
              -f "article_ids=$ids"
              -f "missing_page_paths=$missing_page_paths"
              -f "known_missing_page_paths=$known_missing_page_paths"
              -f 'bootstrap=false'
              -f 'dry_run=false'
              -f "dispatch_nonce=$dispatch_nonce"
              -f "dispatch_cohort=$dispatch_cohort"
            )
            if [ "$PENDING_EDGE_FLIP" = 'true' ]; then
              args+=(
                -f 'allow_deferred_live_release=true'
                -f "api_release_commit=$API_RELEASE_COMMIT"
                -f "source_commit=$SOURCE_COMMIT"
                -f "source_main_commit=$SOURCE_COMMIT"
              )
            fi
            if ! gh workflow run fast-publish-section.yml --repo "$GITHUB_REPOSITORY" --ref main "${args[@]}"; then
              echo "::warning::dispatch fallito per $section — riprovera' il prossimo giro"
              fail=1
            fi
          done < <(jq -r '.sections[] | select(.dispatch) | [.section, (.selected | tojson), (.missingPagePaths | tojson), (.knownMissingPagePaths | tojson)] | @tsv' "$RUNNER_TEMP/reconcile-sections.json")
          [ "$fail" = "0" ] || exit 1

      # Il workflow_run di un child fast-publish e' il barrier event: questo
      # passo risonda la superficie e accoda il replay solo quando tutti i
      # child hanno realmente lasciato R2 pronto. Il run di detection che ha
      # dispatchato i child e' gia' terminato, quindi non occupa runner.
      - name: Replay API after event-driven backfill readiness
        if: >-
          (steps.mode.outputs.event_replay == 'true' || steps.mode.outputs.schedule_retry == 'true') &&
          steps.child_artifact.outputs.verified == 'true' &&
          steps.arm.outputs.allow == 'true' &&
          steps.detect.outputs.pending_edge_flip == 'true' &&
          steps.detect.outputs.skip == 'false' &&
          steps.detect.outputs.dispatch == '0' &&
          steps.detect.outputs.leftover == '0' &&
          steps.detect.outputs.landing_content_stale == '0' &&
          steps.detect.outputs.unknown == '0' &&
          steps.detect.outputs.manifest_unknown == '0' &&
          steps.detect.outputs.head_guard == 'true'
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ steps.detect.outputs.source_commit }}
          CAP_INPUT: ${{ inputs.cap }}
        run: |
          set -euo pipefail
          runtime_pat="${GITHUB_PAT_NANAKO:-}"
          if [ -z "$runtime_pat" ]; then
            echo "::error::GITHUB_PAT_NANAKO non caricato: replay API non autorizzato"
            exit 1
          fi
          export GH_TOKEN="$runtime_pat"
          if ! [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::HEAD corrente non valida per il replay API bounded"
            exit 1
          fi
          current_main="$(bash scripts/ci/read-main-head.sh)"
          if ! [[ "$current_main" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::HEAD corrente di main non valida per il replay API bounded"
            exit 1
          fi
          if [ "$current_main" != "$SOURCE_COMMIT" ]; then
            echo "::notice::main e' avanzata dopo la detection ($SOURCE_COMMIT -> $current_main); nessun replay API stantio"
            exit 0
          fi
          verified="$RUNNER_TEMP/reconcile-sections-after-backfill.json"
          node scripts/reconcile-section-pages.mjs --out "$verified" --cap "${CAP_INPUT:-3}"
          if [ "$(jq -r 'if .skip then "true" else "false" end' "$verified")" = 'true' ] \
            || [ "$(jq -r '.counts.missingPages // 0' "$verified")" != '0' ] \
            || [ "$(jq -r '.counts.landingContentStale // 0' "$verified")" != '0' ] \
            || [ "$(jq -r '.counts.unknown // 0' "$verified")" != '0' ] \
            || [ "$(jq -r '.counts.manifestUnknown // 0' "$verified")" != '0' ]; then
            echo "::notice::replay API rimandato: la verifica post-backfill non dimostra una superficie completa"
            exit 0
          fi
          if [ "$(jq -r '.pendingEdgeFlip // false' "$verified")" != 'true' ]; then
            echo "::notice::nessun flip API pendente dopo la verifica post-backfill"
            exit 0
          fi
          verifyMainHeadAtDispatch() {
            local current_main=''
            if ! current_main="$(bash scripts/ci/read-main-head.sh)"; then
              echo "::error::impossibile verificare main immediatamente prima del dispatch publish-api"
              return 1
            fi
            if ! [[ "$current_main" =~ ^[a-f0-9]{40}$ ]]; then
              echo "::error::HEAD di main non valida immediatamente prima del dispatch publish-api: $current_main"
              return 1
            fi
            if [ "$current_main" != "$SOURCE_COMMIT" ]; then
              echo "::notice::main e' avanzata dopo la verifica post-backfill ($SOURCE_COMMIT -> $current_main); replay API interrotto"
              return 2
            fi
          }
          if verifyMainHeadAtDispatch; then
            echo "::notice::backfill globalmente verificato: replay API bounded sulla HEAD $SOURCE_COMMIT"
            gh workflow run publish-api.yml --repo "$REPOSITORY" --ref main -f source_commit="$SOURCE_COMMIT"
          else
            verify_status=$?
            if [ "$verify_status" -eq 2 ]; then
              echo "::notice::nessun dispatch publish-api: la superficie verra' riallineata dal percorso sulla nuova HEAD"
              exit 0
            fi
            exit "$verify_status"
          fi

      - name: Report
        if: always()
        run: |
          set -euo pipefail
          r="$RUNNER_TEMP/reconcile-sections.json"
          [ -s "$r" ] || exit 0
          jq -r 'if .skip then "skip \(.skip.code): \(.skip.reason)" else "sezioni live \(.counts.sections), da ripubblicare \(.counts.dispatch), articoli mancanti \(.counts.missing), oltre il cap \(.counts.leftover), orfane \(.counts.orphaned), manifest non verificabili \(.counts.manifestUnknown), non verificabili \(.counts.unknown)" end' "$r"
