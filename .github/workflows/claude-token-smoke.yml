name: Claude token smoke

# Il minimo indispensabile per rispondere a UNA domanda: il valore di
# CLAUDE_CODE_OAUTH_TOKEN (aggiunto ai secret di questo repo il 2026-08-06)
# funziona davvero? GitHub non restituisce i secret, quindi finora si sapeva
# solo che il segreto ESISTE — non che autentichi.
#
# Perché non basta "il workflow è verde": claude-code-action può fallire in modo
# silenzioso a valle dell'auth. Quindi il gate non è lo step dell'action, è lo
# step DOPO: Claude deve aver scritto un file con un sentinel. Nessun file =
# nessun turno eseguito, e il job va rosso anche se l'action è uscita 0.
#
# Zero effetti collaterali: dispatch-only, `contents: read`, nessun push,
# nessuna issue, nessun commento. Cancellabile appena il ciclo vero è in piedi.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: claude-token-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Claude — scrivi il sentinel
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Mai `*`: se un'automation interna dispatchasse questo workflow via
          # GITHUB_TOKEN o App token, claude-code-action aborterebbe
          # "non-human actor" senza whitelist esplicita (stesso class-fix dei
          # sibling sul sito).
          allowed_bots: 'github-actions[bot], claude[bot], frontaliere-automation[bot]'
          show_full_output: true
          # 2 turni bastano per una Write. Niente
          # --dangerously-skip-permissions: sui trigger workflow_dispatch non
          # produce mai bypassPermissions (rollback 2026-07-02, issue #3269 del
          # sito) — gli allowedTools espliciti sono l'unica via che funziona qui.
          claude_args: "--max-turns 2 --model claude-sonnet-5 --allowedTools 'Write'"
          prompt: |
            Scrivi il file `claude-smoke-ok.txt` nella root del workspace.
            Contenuto: una sola riga, esattamente `SMOKE_OK`.
            Non fare altro, non leggere altri file, non commentare.

      # Il gate vero. `claude_args` non garantisce che un turno sia stato
      # eseguito; questo file sì.
      - name: Verifica che Claude abbia davvero eseguito un turno
        run: |
          if [ ! -f claude-smoke-ok.txt ]; then
            echo "::error::Nessun claude-smoke-ok.txt — Claude non ha eseguito nessun turno (auth fallita o azione no-op)."
            exit 1
          fi
          echo "Contenuto:"
          cat claude-smoke-ok.txt
          grep -q 'SMOKE_OK' claude-smoke-ok.txt || {
            echo "::error::File presente ma senza sentinel SMOKE_OK."
            exit 1
          }
          echo "✅ CLAUDE_CODE_OAUTH_TOKEN valido: Claude ha autenticato ed eseguito un turno."
