name: Auto-merge enroll sweep

# Rete di sicurezza per l'ARRUOLAMENTO nell'auto-merge nativo, non per il merge.
#
# `enable-native-automerge.yml` arruola una PR su `opened`/`reopened`/
# `ready_for_review`. Se quel run fallisce — Remote Config che non risponde, un
# 5xx dell'API, un evento perso — la PR non viene arruolata MAI PIU': non c'e'
# un altro evento che ci riprovi. Da fuori e' indistinguibile da una PR sana:
# tutti i check verdi, nessun rosso, e nessun merge. E' esattamente la forma di
# stallo che questo repo ha gia' pagato due volte (la #12 col check mancante, la
# #201 con la review che non ripartiva): niente fallisce, qualcosa si ferma.
#
# Il vecchio `auto-merge-sweep` faceva il MERGE da se' ogni mezz'ora ed e' stato
# rimosso col passaggio al nativo. Questo sweep non duplica quel decisore: per
# ogni candidata passa il controllo al gate trusted di `main`, che rilegge PR,
# review, check richiesto e HEAD e abilita soltanto l'auto-merge nativo con
# `--match-head-commit`. Un arruolamento in piu' non puo' quindi saltare il
# verdetto del gate o la sua protezione dalla race sulla HEAD.
#
# ── PERCHE' L'IDENTITA' DEVE ESSERE IL PAT ─────────────────────────────────
# L'auto-merge nativo mergia con l'identita' di CHI lo ha abilitato. Arruolare
# col `GITHUB_TOKEN` darebbe un merge di `github-actions[bot]`, e GitHub non fa
# mai partire un workflow da un evento generato da quel token: `publish-api.yml`
# non scatterebbe e il corpus smetterebbe di pubblicare senza che niente
# diventi rosso. Nessun PAT, nessun arruolamento — si esce senza fare danni.
on:
  schedule:
    - cron: '18,48 * * * *' # sfasato dai cron di pr-autorebase (22,52)
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-merge-enroll-sweep
  cancel-in-progress: false

jobs:
  enroll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Come `enable-native-automerge.yml`: niente checkout dell'albero (28.777
      # file). Oltre al loader di Remote Config scarichiamo da `main` il gate
      # trusted e le sue sole dipendenze dependency-free: il codice della PR
      # non decide quali review/check possano arruolare l'auto-merge.
      - name: Download workflow helpers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          helper_dir="${RUNNER_TEMP}/native-automerge-helpers"
          mkdir -p "$helper_dir/lib"
          # Bootstrap reads are idempotent. Retry only transient network/API
          # failures so a bad path, invalid source or empty response still
          # stops the sweep before it can read or enroll anything.
          download_and_check() {
            local path="$1"
            local destination="$2"
            local error_file="${destination}.error"
            local attempt
            for attempt in 1 2 3; do
              rm -f "$destination" "$error_file"
              if gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" \
                --header 'Accept: application/vnd.github.raw+json' \
                > "$destination" 2> "$error_file" \
                && [ -s "$destination" ] \
                && node --check "$destination"; then
                rm -f "$error_file"
                return 0
              fi
              if [ "$attempt" -eq 3 ] || ! grep -Eiq \
                'timeout|timed[[:space:]._-]*out|deadline[[:space:]._-]*exceeded|connection reset|connection refused|temporary failure|service unavailable|bad gateway|gateway timeout|HTTP 429|rate limit exceeded|secondary rate limit|HTTP 5[0-9][0-9]|ECONNRESET|ETIMEDOUT|EAI_AGAIN' \
                "$error_file"; then
                cat "$error_file" >&2
                rm -f "$destination" "$error_file"
                return 1
              fi
              echo "::warning::Transient GitHub helper read failed for ${path} (attempt ${attempt}/3); retrying."
              sleep "$((attempt * 5))"
            done
            return 1
          }

          download_and_check \
            'generator/scripts/load-rc-env.mjs' "$helper_dir/load-rc-env.mjs"
          download_and_check \
            'generator/scripts/lib/google-service-account-token.mjs' \
            "$helper_dir/lib/google-service-account-token.mjs"
          for spec in \
            'scripts/ci/native-automerge-gate.mjs|native-automerge-gate.mjs' \
            'scripts/ci/review-test-policy.mjs|review-test-policy.mjs' \
            'scripts/ci/lib/fetchPrFiles.mjs|lib/fetchPrFiles.mjs' \
            'scripts/ci/lib/constants.mjs|lib/constants.mjs' \
            'scripts/ci/native-automerge-sweep-policy.mjs|native-automerge-sweep-policy.mjs'; do
            source_path="${spec%%|*}"
            destination="${spec#*|}"
            download_and_check "$source_path" "$helper_dir/$destination"
          done
          echo "NATIVE_AUTOMERGE_HELPER_DIR=$helper_dir" >> "$GITHUB_ENV"

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON non configurato — senza Remote Config non c'e' il PAT."
            exit 1
          fi
          printf %s "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Load PAT from Remote Config
        run: node "$NATIVE_AUTOMERGE_HELPER_DIR/load-rc-env.mjs"

      - name: Enroll open PRs that nobody enrolled
        env:
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if [ -z "${GITHUB_PAT_NANAKO:-}" ]; then
            echo "::error::GITHUB_PAT_NANAKO non caricato da Remote Config — non arruolo niente: un auto-merge di github-actions[bot] non farebbe partire publish-api.yml."
            exit 1
          fi
          export GH_TOKEN="$GITHUB_PAT_NANAKO"
          # `gh pr list --limit N` TRONCA in silenzio, mentre un errore API
          # trasformato in `[]` farebbe sembrare vuota una coda che non abbiamo
          # letto. Conserviamo le pagine REST slurpate e lasciamo al policy
          # helper trusted la validazione dello shape e il filtro minimo:
          # base=main, non lockstep, non draft, auto_merge=null.
          pages_file="${RUNNER_TEMP}/auto-merge-open-pr-pages.json"
          if ! gh api --paginate --slurp \
            "repos/${REPO}/pulls?state=open&per_page=100" > "$pages_file"; then
            echo "::error::lettura paginata delle PR aperte fallita — non considero la lista vuota e non arruolo niente."
            exit 1
          fi
          if ! prs="$(node "$NATIVE_AUTOMERGE_HELPER_DIR/native-automerge-sweep-policy.mjs" \
            --enroll "$pages_file")"; then
            echo "::error::payload REST paginato delle PR aperte non valido — non considero la lista vuota."
            exit 1
          fi
          if [ -z "${prs:-}" ]; then
            echo "Nessuna PR aperta da arruolare."
            exit 0
          fi
          n=0
          for pr in $prs; do
            # Fail-soft per singola PR: il gate trusted decide se la candidata
            # resta in attesa di review/check o se viene arruolata. Il gate
            # rilegge la HEAD subito prima dell'opt-in e usa --match-head-commit.
            if GH_TOKEN="$GITHUB_PAT_NANAKO" node "$NATIVE_AUTOMERGE_HELPER_DIR/native-automerge-gate.mjs" \
              "$REPO" "$pr"; then
              echo "PR #$pr valutata dal native gate (arruolamento o attesa)."
              n=$((n + 1))
            else
              echo "::warning::PR #$pr non valutata dal native gate — riprovo al prossimo giro."
            fi
          done
          echo "Valutate $n PR dal native gate."

      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json
