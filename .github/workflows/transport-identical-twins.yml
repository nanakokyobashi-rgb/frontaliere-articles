name: Transport identical twins (pull-side)

# Il TRASPORTO che ai gemelli `identical` del manifest mancava (issue #331,
# follow-up di #326 e #303). Zero Claude: legge il manifest, copia dal sito i
# soli file dichiarati `identical` e fermi in `site-ahead`, apre UNA PR che
# passa dalla review come ogni altra.
#
# ── Perche' un canale TIRATO, e non l'allowlist del mirror ──────────────────
# `mirror-articles-engine.yml` gira sul SITO e copia DIRECTORY INTERE: si ferma
# a `engine/` perche' quello e' l'unico albero con una prova di confinamento, e
# allargarlo a `scripts/**`/`host/**` sovrascriverebbe le decine di voci
# `adapted` che vivono li' — la meta' distruttiva del vecchio mirror, spostata
# da `content/` a `generator/`.
#
# Questo canale non ha bisogno di quella prova: non copia mai una directory, ma
# i singoli path che il manifest dichiara `identical`, dal loro `sitePath`. Un
# file `adapted` non e' protetto da un'eccezione — non e' proprio nell'insieme
# di partenza. E copia SOLO `site-ahead` (`classify()` di loop-drift-check):
# se questo lato si e' mosso, non si tocca niente.
#
# `engine/` resta fuori: e' `outOfScope` nel manifest PROPRIO perche' ha gia' il
# mirror, e due canali sullo stesso path sono un conflitto, non una ridondanza.
#
# ── Cosa NON fa ────────────────────────────────────────────────────────────
# Non mergia e non forza: apre una PR normale. La review e l'auto-merge nativo
# decidono come sempre. Una PR di trasporto alla volta (guard qui sotto), cosi'
# un giorno storto non impila copie che nessuno rivede.
on:
  schedule:
    - cron: '47 4 * * *' # ogni giorno alle 04:47 UTC, prima del drift check delle 07:31
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo report, nessuna scrittura e nessuna PR.'
        required: false
        default: 'false'
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: transport-identical-twins
  cancel-in-progress: false

jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Una PR di trasporto alla volta. Senza questo guard un giorno in cui la
      # review e' lenta produce N PR sovrapposte sugli stessi file, che e'
      # esattamente il rumore che il manifest esiste per evitare.
      #
      # Il conteggio si fa sul campo `headRefName`, non con `--search head:`: i
      # branch reali sono `transport/identical-twins-<RUN_ID>`, quindi quel
      # guard funzionava solo se la qualifica `head:` facesse prefix match. Se
      # il match fosse esatto conterebbe 0 PER SEMPRE e lo schedule impilerebbe
      # una PR al giorno sugli stessi file, restando verde a ogni run — un guard
      # che non si accorge di non guardare niente. `startswith` sul nome del
      # branch non ha quella semantica da indovinare.
      #
      # Il conteggio si fa con `gh api --paginate` e NON con `gh pr list
      # --limit N`: quel sottocomando non ha `--paginate` e il suo `--limit`
      # TRONCA in silenzio. `gh pr list` ordina per creazione DISCENDENTE, e la
      # PR che questo guard deve vedere e' per costruzione la VECCHIA — quella
      # aperta ieri e non ancora rivista. Oltre il taglio non esiste per il
      # workflow: il guard conta 0, resta verde, e lo schedule impila una PR di
      # trasporto al giorno sugli stessi file. E' lo stesso failure mode del
      # vecchio `--search head:`, rientrato dall'altra porta (issue #871 item
      # 3). `auto-merge-enroll-sweep.yml` e `stale-pr-rescuer.yml` lo avevano
      # gia' imparato.
      - name: Guard — trasporto gia' in volo
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # `set -e`: se la chiamata API fallisce lo step esce ROSSO invece di
          # contare 0 e aprire una copia in piu'. Un guard che non ha potuto
          # guardare non e' un guard verde.
          set -euo pipefail
          # `head.repo.full_name == env.REPO`: su una PR da un FORK `head.ref` non
          # e' qualificato, quindi chiunque puo' aprire un branch chiamato come
          # il nostro e far contare 1 a questo guard — che poi si spegnerebbe
          # da solo per sempre. Il prefisso e' un nome, non un permesso.
          # Si serializza il repo head insieme al branch: jq `env.REPO` non è
          # affidabile in questo contesto, mentre awk confronta il valore già
          # uscito dall'API senza lasciare passare fork con lo stesso branch.
          gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --jq '.[] | [.head.repo.full_name, .head.ref] | @tsv' |
            awk -F '\t' -v repo="$REPO" '$1 == repo { print $2 }' > /tmp/open-prs.txt
          OPEN=$(grep -c '^transport/identical-twins' /tmp/open-prs.txt || true)
          echo "open_transports=$OPEN" >> "$GITHUB_OUTPUT"
          if [ "$OPEN" != "0" ]; then
            echo "Una PR di trasporto e' gia' aperta — niente di nuovo oggi."
          fi

      - name: Write Firebase SA (se presente)
        if: steps.guard.outputs.open_transports == '0'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -uo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      # Ponte Remote Config → env: da qui arriva `GITHUB_PAT_NANAKO`.
      - name: Load secrets from Remote Config
        if: steps.guard.outputs.open_transports == '0'
        continue-on-error: true
        run: node generator/scripts/load-rc-env.mjs

      # La copia usa il PAT caricato sopra, non il GITHUB_TOKEN del workflow.
      # Sondiamo quindi proprio quell'identità: se il PAT ha `workflow`, il
      # trasporto può includere i gemelli sotto `.github/workflows/`; altrimenti
      # `unsafeTarget()` resta fail-closed e li lascia nel canale manuale.
      - name: Probe scope workflows del token di trasporto
        if: steps.guard.outputs.open_transports == '0'
        continue-on-error: true
        env:
          PUSH_TOKEN: ${{ env.GITHUB_PAT_NANAKO }}
        run: node scripts/ci/probe-workflow-scope.mjs

      # Il dry-run gira SEMPRE, anche senza PAT: il report nel log e' gia' la
      # meta' osservativa, e senza di lui un run senza credenziali non
      # lascerebbe traccia di cosa avrebbe portato.
      - name: Cosa c'e' da portare (dry-run)
        if: steps.guard.outputs.open_transports == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_REPO: valerielinc-ops/frontaliere-si-o-no
          SITE_REF: main
        run: |
          set -uo pipefail
          rc=0
          node scripts/ci/transport-identical-twins.mjs || rc=$?
          # exit 2 = «c'e' un no permanente con divergenza reale». NON deve
          # fermare qui la passata: gli altri gemelli si copiano benissimo, e
          # far fallire il dry-run salterebbe lo step di apply (l'`if:` ha un
          # `success()` implicito), cioe' un gemello bloccato per sempre
          # fermerebbe il trasporto di TUTTI finche' una persona non copia a
          # mano.
          #
          # Il 2 non muore pero' qui: viene messo da parte su file e ripreso
          # dall'ULTIMO step, che gira con `always()`. Degradarlo e basta
          # avrebbe lasciato il rosso a carico del solo step di apply, che e'
          # gatato su `env.GITHUB_PAT_NANAKO != ''` — e il passo che popola quel
          # PAT e' `continue-on-error: true`. Con Remote Config muto l'apply
          # viene SALTATO e la passata sarebbe uscita verde coi blocchi
          # permanenti dentro `manual`: lo stesso guasto che l'item 4 chiude,
          # rientrato dalla porta accanto.
          echo "$rc" > "$RUNNER_TEMP/transport-rc"
          [ "$rc" = "2" ] && rc=0
          exit "$rc"

      # Senza PAT non si scrive: un push col GITHUB_TOKEN non fa partire i
      # workflow sulla PR (anti-ricorsione), quindi il check richiesto non
      # verrebbe mai emesso e la PR resterebbe verde-e-ferma per sempre — la
      # stessa forma di stallo che `enable-native-automerge` esiste per evitare.
      - name: Copia e apri la PR
        if: steps.guard.outputs.open_transports == '0' && github.event.inputs.dry_run != 'true' && env.GITHUB_PAT_NANAKO != ''
        env:
          GH_TOKEN: ${{ env.GITHUB_PAT_NANAKO }}
          REPO: ${{ github.repository }}
          SITE_REPO: valerielinc-ops/frontaliere-si-o-no
          SITE_REF: main
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/transport-realign-rc"
          # `rc=2` (blocchi permanenti con divergenza reale) non ferma la copia:
          # il report e' gia' scritto, gli altri gemelli partono, e il codice si
          # ripropaga al verdetto finale — cosi' il workflow esce rosso e
          # `scan-failed-runs.mjs` apre la sua issue, ma la PR di oggi e' stata
          # aperta lo stesso. Ogni altro codice resta bloccante.
          rc=0
          node scripts/ci/transport-identical-twins.mjs --apply --json > /tmp/transport.json || rc=$?
          previous_rc="$(cat "$RUNNER_TEMP/transport-rc" 2>/dev/null || echo 0)"
          case "$previous_rc" in
            0|1|2) ;;
            *) previous_rc=0 ;;
          esac
          if [ "$rc" != "0" ] && [ "$rc" != "2" ]; then
            if [ "$previous_rc" -gt "$rc" ]; then
              echo "$previous_rc" > "$RUNNER_TEMP/transport-rc"
            else
              echo "$rc" > "$RUNNER_TEMP/transport-rc"
            fi
            exit "$rc"
          fi
          [ "$previous_rc" -gt "$rc" ] && rc="$previous_rc"
          echo "$rc" > "$RUNNER_TEMP/transport-rc"
          PORTED=$(node -e 'console.log(require("/tmp/transport.json").transported.length)')
          MANIFEST_CHANGED=$(node -e 'console.log(require("/tmp/transport.json").manifestChanged ? "true" : "false")')
          if [ "$MANIFEST_CHANGED" != "true" ]; then
            echo "Nessun gemello o snapshot da registrare: niente PR."
            exit 0
          fi
          BRANCH="transport/identical-twins-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git checkout -b "$BRANCH"
          # Si stagia l'insieme ENUMERATO da `--apply`, non tutto cio' che e'
          # sporco nel checkout: l'argomento «l'enumerazione E' il
          # confinamento» vale solo se arriva fino al COMMIT. Con `git add -A`
          # qualunque residuo di uno step precedente entrerebbe in una PR che
          # passa dall'auto-merge nativo, elencando nel body solo i file
          # trasportati.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("fs");
            const r = require("/tmp/transport.json");
            fs.writeFileSync("/tmp/transport-paths.tsv", r.transported.map((t) => t.path + "\t" + t.to).join("\n") + (r.transported.length ? "\n" : ""));
          '
          cut -f1 /tmp/transport-paths.tsv | xargs -r -d '\n' git add --
          git add -- scripts/ci/loop-sync-manifest.json
          git diff --cached --name-only
          git commit -m "chore(loop): porta ${PORTED} gemelli identical dal sito"
          # La baseline che `--apply` ha scritto e' l'hash dei byte SCARICATI,
          # calcolato prima che il commit esistesse (issue #852). Qui il commit
          # c'e', quindi i byte committati sono finalmente leggibili e la
          # baseline si verifica contro di loro PRIMA del push, con `--amend`
          # dove va corretta per non lasciare due commit sullo stesso atto.
          #
          # Un mismatch appartiene alla singola voce, non all'intero batch:
          # raccogli il verdetto, togli quella voce dal commit e riallinea di
          # nuovo le sole voci sane. Il rosso resta nel file di stato letto
          # dall'ultimo step, quindi il canale prosegue senza assolversi.
          realign_rc=0
          if [ "$PORTED" != "0" ]; then
            node scripts/ci/transport-identical-twins.mjs --realign=/tmp/transport-paths.tsv --json > /tmp/realign.json || realign_rc=$?
          else
            printf '%s\n' '{"mismatched":[],"normalization":[],"unreadable":[]}' > /tmp/realign.json
          fi
          case "$realign_rc" in
            0) ;;
            1)
              BAD_COUNT=$(node -e 'const r=require("/tmp/realign.json"); console.log((r.mismatched||[]).length+(r.normalization||[]).length)')
              UNREADABLE_COUNT=$(node -e 'console.log((require("/tmp/realign.json").unreadable||[]).length)')
              if [ "$BAD_COUNT" = "0" ] || [ "$UNREADABLE_COUNT" != "0" ]; then
                echo "1" > "$RUNNER_TEMP/transport-realign-rc"
                exit 1
              fi
              echo "1" > "$RUNNER_TEMP/transport-realign-rc"
              node -e '
                const fs = require("fs");
                const r = require("/tmp/transport.json");
                const a = require("/tmp/realign.json");
                const bad = new Set([...(a.mismatched || []), ...(a.normalization || [])].map((x) => x.path));
                r.transported = r.transported.filter((x) => !bad.has(x.path));
                r.realignExcluded = [...bad].sort();
                fs.writeFileSync("/tmp/transport.json", JSON.stringify(r, null, 2));
              '
              node -e '
                const fs = require("fs");
                const { execFileSync } = require("child_process");
                const current = JSON.parse(fs.readFileSync("scripts/ci/loop-sync-manifest.json", "utf8"));
                const previous = JSON.parse(execFileSync("git", ["show", "HEAD^:scripts/ci/loop-sync-manifest.json"]));
                const bad = new Set(require("/tmp/realign.json").mismatched.map((x) => x.path).concat(require("/tmp/realign.json").normalization.map((x) => x.path)));
                for (const rel of bad) {
                  const now = current.files.find((x) => x.path === rel);
                  const old = previous.files.find((x) => x.path === rel);
                  if (now && old) {
                    now.baseline = old.baseline;
                    if (Object.prototype.hasOwnProperty.call(old, "couplingSnapshot")) now.couplingSnapshot = old.couplingSnapshot;
                    else delete now.couplingSnapshot;
                  }
                }
                fs.writeFileSync("scripts/ci/loop-sync-manifest.json", JSON.stringify(current, null, 2) + "\n");
              '
              node -e '
                const fs = require("fs");
                for (const item of ["mismatched", "normalization"]) {
                  for (const x of require("/tmp/realign.json")[item] || []) process.stdout.write(x.path + "\n");
                }
              ' | while IFS= read -r rel; do
                [ -z "$rel" ] || git restore --source=HEAD^ --staged --worktree -- "$rel"
              done
              git add -- scripts/ci/loop-sync-manifest.json
              git commit --amend --no-edit
              node -e '
                const fs = require("fs");
                const r = require("/tmp/transport.json");
                fs.writeFileSync("/tmp/transport-paths.tsv", r.transported.map((t) => t.path + "\t" + t.to).join("\n") + (r.transported.length ? "\n" : ""));
              '
              if [ "$PORTED" != "0" ]; then
                realign_rc=0
                node scripts/ci/transport-identical-twins.mjs --realign=/tmp/transport-paths.tsv --json > /tmp/realign-safe.json || realign_rc=$?
                if [ "$realign_rc" != "0" ]; then
                  echo "1" > "$RUNNER_TEMP/transport-realign-rc"
                  exit 1
                fi
              fi
              ;;
            *)
              echo "1" > "$RUNNER_TEMP/transport-realign-rc"
              exit "$realign_rc"
              ;;
          esac
          PORTED=$(node -e 'console.log(require("/tmp/transport.json").transported.length)')
          if ! git diff --quiet -- scripts/ci/loop-sync-manifest.json; then
            git add -- scripts/ci/loop-sync-manifest.json
            git commit --amend --no-edit
          fi
          if git diff --quiet HEAD^ HEAD; then
            echo "Tutti i path trasportati avevano un mismatch: nessuna PR apribile, il rosso resta registrato."
            exit 0
          fi
          # Il corpo si scrive da Node su file: un heredoc dentro un blocco
          # `run:` indentato porterebbe la sua indentazione DENTRO il markdown,
          # e `## Implementato` rientrato non e' piu' un heading — il contratto
          # del body (`pr-body-contract`) lo leggerebbe come assente.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("fs");
            const r = require("/tmp/transport.json");
            const list = r.transported.map((t) => "- `" + t.path + "` \u2190 `" + t.sitePath + "` del sito (site sha256 `" + t.to + "`)").join("\n");
            const deltas = (r.couplingDelta || []).map((d) => "- Snapshot accoppiamenti per `" + d.path + "`: +" + d.added.length + "/-" + d.removed.length + (d.initialized ? " (prima osservazione)" : " (delta dalla passata precedente)" ) + ".").join("\n");
            const excluded = (r.realignExcluded || []).map((p) => "- `" + p + "` escluso dal commit per mismatch/normalizzazione dei byte; blocked: diagnosi realign da correggere a mano.").join("\n");
            const workflowsBlocked = process.env.PAT_WORKFLOWS_SCOPE !== "true";
            const deferred = workflowsBlocked
              ? "- Le voci `adapted` restano escluse per costruzione; i gemelli sotto `.github/workflows/` richiedono lo scope `workflows`: blocked: PAT_WORKFLOWS_SCOPE non è true per questa identità."
              : "- Le voci `adapted` restano escluse per costruzione; i gemelli sotto `.github/workflows/` non sono bloccati dallo scope in questa passata e, se `site-ahead`, sono eleggibili al trasporto in questa PR.";
            fs.writeFileSync("/tmp/pr-body.md", [
              "## Implementato",
              "- Copia automatica dei gemelli dichiarati `mode: identical` in `scripts/ci/loop-sync-manifest.json` che il sito ha portato avanti mentre questo lato restava fermo sulla baseline (stato `site-ahead`), con riallineamento della baseline ai byte committati solo per i path verificati. Aperta da `.github/workflows/transport-identical-twins.yml` (issue #331).",
              list,
              deltas,
              "",
              "## Non implementato (ancora)",
              excluded,
              deferred,
              "",
            ].join("\n"));
          '
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(loop): trasporto di ${PORTED} gemelli \`identical\` dal sito" \
            --body-file /tmp/pr-body.md

      # Il rosso dei blocchi permanenti e dei mismatch vive QUI e non dentro
      # uno dei due rami.
      #
      # Lo step di apply e' gatato su `env.GITHUB_PAT_NANAKO != ''`, e il passo
      # che popola quel PAT (`Load secrets from Remote Config`) e'
      # `continue-on-error: true`: se Remote Config non risponde, l'apply viene
      # SALTATO. Un rosso che vivesse solo li' sparirebbe insieme allo step, e
      # la passata schedulata uscirebbe VERDE coi gemelli bloccati per sempre
      # dentro `manual` — cioe' esattamente il difetto che l'item 4 di #871
      # chiude, un livello piu' in la'. Con `always()` il verdetto non dipende
      # da quale ramo ha girato: il codice messo da parte dal dry-run vale anche
      # quando l'apply non e' mai partito.
      - name: No permanenti — serve una copia a mano
        if: always() && steps.guard.outputs.open_transports == '0'
        run: |
          set -uo pipefail
          rc="$(cat "$RUNNER_TEMP/transport-rc" 2>/dev/null || echo 0)"
          realign_rc="$(cat "$RUNNER_TEMP/transport-realign-rc" 2>/dev/null || echo 0)"
          if [ "$realign_rc" = "1" ]; then
            echo "::error::Il realign ha escluso uno o piu' path dal batch: il rosso resta aperto per la diagnosi dei byte committati, mentre i path sani sono stati pubblicati."
            exit 1
          fi
          [ "$rc" = "2" ] || exit 0
          echo "::error::Gemelli \`identical\` in \`site-ahead\` bloccati per SEMPRE: nessun giro di questo canale li portera', serve una copia a mano. Le righe \`⛔\` del dry-run qui sopra dicono quali e perche'."
          exit 1
