name: Issue fix (Codex Luna Max → PR)

# Il fixer autonomo: prende una issue etichettata `agent:fix`, diagnostica,
# applica un fix chirurgico e apre una PR — che poi entra nel ciclo di review e
# auto-merge come qualunque altra.
#
# È il consumatore di quota più costoso del ciclo (~1M token per run sul sito),
# ed è per questo che arriva per ultimo e dietro quattro cancelli a costo zero.
#
# ── I quattro pre-flight, e cosa impedisce ciascuno ─────────────────────────
#
# 1. quota telemetry — il beacon legacy resta osservabile, ma Codex Luna Max è
#    l'unico provider del lane; la telemetria non può impedire il primo tentativo.
# 2. already-resolved — la issue potrebbe essere già stata risolta da una PR
#    mergiata nel frattempo.
# 3. workflows-scope — se il fix richiede di toccare `.github/workflows/**` ma
#    il token di push non ha lo scope, il push fallirebbe DOPO che il lavoro è
#    stato fatto. Rilevarlo al turno 1 invece che alla fine è la differenza fra
#    zero token e un milione.
# 4. claim in-flight — mutua esclusione: due run sulla stessa issue.
#
# Tutti e quattro sono deterministici, zero-agent, e girano PRIMA dello step
# che costa.
#
# ── ADATTAMENTI (manifest: `adapted`) ───────────────────────────────────────
#  - Gate `sender`: accetta gli account del progetto (i due owner) e gli account
#    legacy del bot autorizzato.
#    Sul sito è cablato su `valerielinc-ops`; qui la label di routing viene
#    applicata dal PAT di questo repo, che è di un altro account.
#  - Identità di push: `GITHUB_PAT_NANAKO`, non un token di GitHub App —
#    passato ANCHE come `github_token` al lane Codex (vedi lo step
#    "Run Codex Luna Max fix"). Il `git remote set-url` dello step di identità copre
#    solo i push che partono da un `run:`: l'action, all'avvio, RISCRIVE quel
#    remote col proprio token (`replaceCheckoutCredentials()`), quindi il token
#    che conta per il lavoro dell'agente è quello passato nel `with:`.
#  - Gate dei test: `node --test`, non vitest. Niente `npm ci`.
#  - Ponte Remote Config: `generator/scripts/load-rc-env.mjs`.

on:
  issues:
    types: [labeled]

# Fino a 7 fixer remoti Codex-primary possono lavorare su issue diverse. La
# chiave per-issue serializza solo eventi concorrenti sullo stesso numero; la
# coda `agent:fix-queued` e il lease bounded tengono il pool sotto controllo.
# Chiave PER-ISSUE. `concurrency` e' valutata a livello di WORKFLOW, cioe' PRIMA
# dell'`if:` del job: con un `group:` costante OGNI evento issue del repo entra
# in questa coda — anche quelli che l'`if:` scarta come `skipped` — e ogni nuova
# pending SFRATTA (`cancelled`) la precedente, perche' `cancel-in-progress: false`
# protegge la run in corso e non le pending. La profondita' e' 1, non N. E
# poiche' `on: issues:[labeled]` e' one-shot, l'evento della run sfrattata e'
# consumato: la label resta sulla issue e NIENTE la ri-arma.
#
# Misurato su QUESTO repo il 2026-09-05, prima della fix:
#   09-04: 290 run create, 73 `cancelled`, 50 `success`; 09-05: 110 create,
#   20 `cancelled`, 24 `success`. Quasi una run utile su due andava persa.
#
# Con la chiave per-issue due issue DIVERSE non si sfrattano piu', mentre due
# eventi sulla STESSA issue continuano a serializzare — l'unica mutua esclusione
# che serviva. Il fallback `|| github.run_id` non serve oggi (`issues` e' l'unico
# trigger, quindi il numero c'e' sempre) ed esiste perche' un trigger senza issue
# nel payload, aggiunto un domani, renderebbe la chiave di nuovo costante e
# riporterebbe gli sfratti in silenzio.
#
# Stessa fix, stessa causa, sul sito: valerielinc-ops/frontaliere-si-o-no#7497.
concurrency:
  group: issue-fix-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: write

jobs:
  # Il contratto L11 viene verificato prima del checkout e di ogni pre-flight
  # costoso. Un marker assente non restringe il classificatore normale; un
  # marker L11 invalido, scaduto o non autorizzato dal registry è review-only.
  # Questo è un filtro di routing, non un gate umano per il merge: la prova PR
  # viene aggiunta solo dopo che il fixer ha davvero consegnato una PR.
  l11_contract:
    if: |
      github.event.label.name == 'agent:fix' &&
      (github.event.sender.login == 'nanakokyobashi-rgb' ||
       github.event.sender.login == 'valerielinc-ops' ||
       startsWith(github.event.sender.login, 'claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
    outputs:
      allowed: ${{ steps.validate.outputs.allowed }}
    steps:
      - name: Validate L11 issue contract (zero-agent, fail-closed)
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          body=$(gh issue view "$ISSUE" --repo "$REPO" --json body --jq '.body // ""')
          contract=$(node --input-type=module - "$body" <<'NODE'
          const body = process.argv[2] || '';
          const marker = /<!-- L11_ISSUE_CONTRACT:\s*(\{.*\})\s*-->/ms.exec(body);
          if (!marker) { process.stdout.write(JSON.stringify({ present: false, valid: false, fixable: false })); process.exit(0); }
          let c;
          try { c = JSON.parse(marker[1]); } catch { process.stdout.write(JSON.stringify({ present: true, valid: false, fixable: false, reason: 'invalid-json' })); process.exit(0); }
          const id = (v, p) => typeof v === 'string' && new RegExp(`^lf-${p}-[0-9a-f]{24}$`).test(v);
          const generated = Date.parse(typeof c.generatedAt === 'string' ? c.generatedAt : '');
          const expires = Date.parse(typeof c.expiresAt === 'string' ? c.expiresAt : '');
          const ttl = Number.isInteger(c.candidateTtlHours) && c.candidateTtlHours > 0
            && Number.isFinite(generated) && Number.isFinite(expires) && expires > Date.now()
            && expires >= generated && expires <= generated + c.candidateTtlHours * 3600000
            && c.ttl?.hours === c.candidateTtlHours && c.ttl?.expiresAt === c.expiresAt;
          const shape = c.schemaVersion === 1 && c.loopId === 'L11' && c.mode === 'observe-report-only'
            && id(c.candidateId, 'candidate') && id(c.sourceRecordId, 'source') && Number.isFinite(generated)
            && c.remediationPrProofRequired === true && c.remediationPr === null
            && (c.route === 'bounded-fix-queue' || c.route === 'review-only');
          const parts = typeof c.actionClass === 'string' ? c.actionClass.split('+').map((v) => v.trim()) : [];
          const fixable = shape && c.route === 'bounded-fix-queue' && parts.includes('issue') && ttl;
          const reviewOnly = shape && c.route === 'review-only';
          process.stdout.write(JSON.stringify({ present: true, valid: fixable || reviewOnly, fixable }));
          NODE
          )
          present=$(printf '%s' "$contract" | jq -r '.present == true')
          valid=$(printf '%s' "$contract" | jq -r '.valid == true')
          fixable=$(printf '%s' "$contract" | jq -r '.fixable == true')
          if [ "$present" != "true" ]; then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
            echo 'Non-L11 issue → classificatore normale.'
            exit 0
          fi
          if [ "$valid" = "true" ] && [ "$fixable" = "true" ]; then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
            echo 'Contratto L11 valido: issue route bounded autorizzata dal registry.'
            exit 0
          fi
          echo 'allowed=false' >> "$GITHUB_OUTPUT"
          echo 'Contratto L11 non eleggibile: rimuovo il routing e lascio review-only.'
          gh issue edit "$ISSUE" --repo "$REPO" \
            --remove-label agent:fix --remove-label agent:fix-queued \
            --add-label operations-audit-review || true

  fix:
    needs: l11_contract
    # La label È il consenso: solo chi ha accesso in scrittura può applicarla.
    # Il gate sul sender è la cintura contro una label aggiunta da
    # un'automazione esterna.
    if: |
      needs.l11_contract.result == 'success' &&
      needs.l11_contract.outputs.allowed == 'true' &&
      github.event.label.name == 'agent:fix' &&
      (github.event.sender.login == 'nanakokyobashi-rgb' ||
       github.event.sender.login == 'valerielinc-ops' ||
       startsWith(github.event.sender.login, 'claude'))
    runs-on: ubuntu-latest
    # Il tetto vero del runner. Non è un budget: sono i minuti massimi prima che
    # il lavoro già fatto venga ucciso a metà. Si pagano i minuti usati, non il
    # tetto.
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Le label di routing non si creano da sole: `gh issue edit --add-label`
      # fallisce se la label non esiste, e nei workflow quel fallimento è un
      # warning NON bloccante (di proposito: un routing mancato non deve
      # diventare una run rossa). Senza questo step il ciclo girerebbe, loggerebbe
      # e uscirebbe 0 — senza instradare nulla. Idempotente, costa una lista.
      - name: Ensure loop labels exist (idempotente)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/ensure-loop-labels.mjs

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
          fi

      - name: Load secrets from Remote Config
        continue-on-error: true
        run: node generator/scripts/load-rc-env.mjs

      # ── Pre-flight 1: quota telemetry ─────────────────────────────────────
      # Il beacon è conservato per diagnosi e non è più un gate: Codex deve
      # poter partire anche quando il beacon di quota è attivo.
      - name: Pre-flight — quota telemetry (Codex primary)
        id: quota
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          # Beacon per-account: osserviamo anche il repo peer senza cedere a
          # quella quota il tentativo Codex-primary.
          QUOTA_BEACON_PEER_REPO: valerielinc-ops/frontaliere-si-o-no
          CODEX_FALLBACK_MODE: '1'
        run: node scripts/ci/check-quota-backoff.mjs

      # ── Pre-flight 2: già risolta ─────────────────────────────────────────
      - name: Pre-flight — already-resolved gate (zero-Claude)
        id: preflight
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/ci/check-issue-already-resolved.mjs

      # ── Pre-flight 2b: dispatch stantio ───────────────────────────────────
      # Il pre-flight 2 risponde a «e' gia' risolta?», e su una PR aperta fa
      # PROCEED di proposito (PR aperta = lavoro in corso, non fatto). Qui la
      # domanda e' un'altra: «questo EVENTO descrive ancora lo stato della
      # issue?». Da #908 la chiave di concorrenza e' per-issue, quindi un secondo
      # `labeled` sulla stessa issue non muore piu' sfrattato: aspetta il primo e
      # poi esegue, con il payload catturato prima — anche se la prima run ha nel
      # frattempo aperto la PR o si e' presa la label. Difesa unica rimasta era
      # l'istruzione di prompt «PR gia' in volo: skip», cioe' una run Codex
      # intera sulla quota condivisa per scoprire una cosa che si legge con due
      # chiamate `gh`. Bias a PROCEDERE su qualunque dubbio (#918).
      - name: Pre-flight — stale-dispatch gate (zero-Claude)
        id: stale
        if: steps.preflight.outputs.already_resolved != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DISPATCH_LABEL: ${{ github.event.label.name }}
          STAGE: fix
        run: node scripts/ci/check-stale-issue-dispatch.mjs

      # ── Pre-flight 2d: diagnosi gia' consegnata al sito ───────────────────
      # Il POST-step qui sotto («Consegna al sito…») consegna e, se la consegna
      # non chiude, parcheggia in `needs-human`. Da li' la issue RIENTRA: il
      # pre-pass di `needs-human-sweep` la ri-accoda quando il verdetto scade, e
      # lo sweep settimanale puo' rimetterla in coda. Il giro successivo pagava
      # una run Codex INTERA sulla quota condivisa col sito per ri-diagnosticare
      # lo stesso file bloccato dal mirror e riemettere lo stesso verdetto —
      # ── Pre-flight 3: capability sui workflow ─────────────────────────────
      # Solo quando NON c'è il PAT: col PAT il push su `.github/workflows/**`
      # passa, e girare il guard toglierebbe una capacità che il run possiede.
      #
      # Perché la condizione ora è VERA (e prima era una promessa non mantenuta):
      # il PAT viaggia sul remote solo per i push lanciati da un `run:`, ma è
      # il lane Codex a pushare, con il proprio token. Finché non le si
      # passava `github_token`, l'action cadeva sul token di GitHub App del run
      # e ogni push su `.github/workflows/**` veniva rifiutato con "refusing to
      # allow a GitHub App to create or update workflow ... without `workflows`
      # permission" — con il PAT lì accanto, inutilizzato. Ora il PAT è passato
      # anche all'action, quindi saltare il guard riflette una capacità reale.
      - name: Pre-flight — workflows-scope capability guard (zero-Claude)
        id: scope_guard
        if: steps.preflight.outputs.already_resolved != 'true' && steps.stale.outputs.stale_dispatch != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          echo "has_workflows_token=false" >> "$GITHUB_OUTPUT"
          if [ -n "${GITHUB_PAT_NANAKO:-}" ]; then
            echo "GITHUB_PAT_NANAKO runtime presente → capability workflows lasciata al token del fixer."
            echo "has_workflows_token=true" >> "$GITHUB_OUTPUT"
            echo "workflows_blocked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/ci/check-workflows-scope.mjs

      # ── Pre-flight 4: contesto di gruppo prima del claim ──────────────────
      - name: Load issue group context (B19, zero-Claude)
        id: group
        if: steps.preflight.outputs.already_resolved != 'true' && steps.stale.outputs.stale_dispatch != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CTX_DIR: ${{ runner.temp }}/issue-fix-ctx
        run: |
          # Scrivere subito i default rende l'output sicuro anche se uno dei
          # comandi successivi abortisce lo step (che è continue-on-error).
          # I consumer ricevono così sempre un valore esplicito e il fallback
          # resta quello del flusso singolo.
          {
            echo "is_group=false"
            echo "group_label="
            echo "group_numbers="
            echo "skip_member=false"
          } >> "$GITHUB_OUTPUT"
          set -euo pipefail
          mkdir -p "$CTX_DIR"
          : > "$CTX_DIR/group.json"
          group_is_group=false
          group_label_output=
          group_numbers_output=
          group_skip_member=false

          load_group_context() {
            local leader_json group_label group_contract members valid numbers
            local group_max_size group_label_pattern query_limit

            if ! leader_json=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json labels); then
              echo "::warning::impossibile leggere le label della issue #$ISSUE_NUMBER → fallback alla issue singola"
              return 0
            fi

            # Tetto e matcher arrivano dalla stessa sorgente del producer. Il
            # tail protegge il contratto da eventuale stdout diagnostico emesso
            # da un import transitivo senza duplicare la regola nel YAML.
            if ! group_contract=$(node --input-type=module -e "import('./scripts/ci/followup-drainer.mjs').then(({ ISSUE_GROUP_MAX_SIZE, ISSUE_GROUP_LABEL_PATTERN }) => process.stdout.write(JSON.stringify({ maxSize: ISSUE_GROUP_MAX_SIZE, labelPattern: ISSUE_GROUP_LABEL_PATTERN })))" | tail -n 1); then
              echo "::warning::impossibile leggere il contratto del raggruppatore → fallback alla issue #$ISSUE_NUMBER"
              return 0
            fi
            if ! group_max_size=$(printf '%s' "$group_contract" | jq -er '.maxSize | numbers | tostring') || \
              ! group_label_pattern=$(printf '%s' "$group_contract" | jq -er '.labelPattern | strings | select(length > 0)'); then
              echo "::warning::contratto B19 non valido → fallback alla issue #$ISSUE_NUMBER"
              return 0
            fi
            case "$group_max_size" in
              [2-9]|[1-9][0-9]*) ;;
              *) echo "::warning::tetto B19 non valido ($group_max_size) → fallback alla issue #$ISSUE_NUMBER"; return 0 ;;
            esac

            if ! group_label=$(printf '%s' "$leader_json" | jq -r --arg pattern "$group_label_pattern" \
              '[.labels[]?.name | select(test($pattern))] | .[0] // empty'); then
              echo "::warning::impossibile riconoscere la label B19 → fallback alla issue #$ISSUE_NUMBER"
              return 0
            fi
            if [ -z "$group_label" ]; then
              echo "issue #$ISSUE_NUMBER: nessun gruppo B19 → flusso singolo"
              return 0
            fi

            # La label è assegnata a tutti i membri, ma solo il numero in coda
            # alla label può armare il run. Un membro etichettato per errore
            # NON degrada al flusso singolo: il suo concurrency key è diverso
            # dal leader e una fallback single-issue potrebbe correre insieme
            # al claim B19. Lo segnaliamo al gate mutex, che chiude il job
            # prima di ogni diagnosi/Claude senza scrivere un secondo claim.
            if [ "${group_label##*-}" != "$ISSUE_NUMBER" ]; then
              group_label_output=$group_label
              group_skip_member=true
              echo "issue #$ISSUE_NUMBER: membro non-leader di $group_label → skip senza fixer singolo"
              return 0
            fi

            query_limit=$((group_max_size + 1))
            if ! members=$(gh issue list --repo "$REPO" --state open --label "$group_label" \
              --json number,title,body,labels,createdAt,updatedAt --limit "$query_limit"); then
              echo "::warning::impossibile leggere i membri di $group_label → fallback alla issue #$ISSUE_NUMBER"
              return 0
            fi
            if ! valid=$(printf '%s' "$members" | jq -r --arg label "$group_label" --arg leader "$ISSUE_NUMBER" --argjson max "$group_max_size" \
              'type == "array" and length >= 2 and length <= $max
               and ([.[].number | tostring] | index($leader) != null)
               and all(.[]; any(.labels[]?; .name == $label))'); then
              echo "::warning::impossibile validare $group_label → fallback alla issue #$ISSUE_NUMBER"
              return 0
            fi
            if [ "$valid" != true ]; then
              echo "::warning::gruppo $group_label non valido o oltre il tetto → fallback alla issue #$ISSUE_NUMBER"
              return 0
            fi

            if ! printf '%s' "$members" | jq --arg leader "$ISSUE_NUMBER" \
              'sort_by(if (.number | tostring) == $leader then 0 else 1 end, .createdAt, .number)' > "$CTX_DIR/group.json"; then
              echo "::warning::impossibile scrivere il contesto di $group_label → fallback alla issue #$ISSUE_NUMBER"
              return 0
            fi
            if ! numbers=$(jq -er '[.[].number] | join(",")' "$CTX_DIR/group.json"); then
              echo "::warning::impossibile leggere il contesto di $group_label → fallback alla issue #$ISSUE_NUMBER"
              return 0
            fi
            group_is_group=true
            group_label_output=$group_label
            group_numbers_output=$numbers
            echo "issue #$ISSUE_NUMBER: gruppo B19 $group_label → membri #$numbers"
          }

          load_group_context
          {
            echo "is_group=$group_is_group"
            echo "group_label=$group_label_output"
            echo "group_numbers=$group_numbers_output"
            echo "skip_member=$group_skip_member"
          } >> "$GITHUB_OUTPUT"

      - name: Validate issue group context file (zero-Claude)
        id: group_context
        if: steps.group.outputs.is_group == 'true'
        env:
          CTX_DIR: ${{ runner.temp }}/issue-fix-ctx
        run: |
          set -euo pipefail
          if [ ! -r "$CTX_DIR/group.json" ] || ! jq -e 'type == "array" and length >= 2' "$CTX_DIR/group.json" >/dev/null; then
            echo "::error::contesto del gruppo B19 illeggibile: il ramo group non può procedere"
            exit 1
          fi

      # ── Pre-flight 5: mutua esclusione ────────────────────────────────────
      # Il claim arriva DOPO il caricamento del contesto: per un leader B19 la
      # stessa mutua esclusione viene applicata a tutti i membri, prima che una
      # run singola possa iniziare diagnosi o aprire una PR concorrente.
      - name: Pre-flight — in-progress claim gate (zero-Claude, mutex)
        id: claim
        if: steps.preflight.outputs.already_resolved != 'true' && steps.stale.outputs.stale_dispatch != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true'
        # FAIL-CLOSED: il claim script emette `in_flight=true` su un errore di
        # lettura/scrittura o verifica; non lasciare che una mutex illeggibile
        # arrivi al fixer.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_NUMBERS: ${{ steps.group.outputs.group_numbers }}
          SKIP_GROUP_MEMBER: ${{ steps.group.outputs.skip_member || 'false' }}
          CLAIM_ACTION: acquire
          CLAIM_OWNER: remote
        run: node scripts/ci/claim-issue-group-in-flight.mjs

      # ── Pre-flight 6: diagnosi gia' consegnata al sito (zero-Claude) ───────
      # La consegna viene verificata DOPO il claim: prima di quel punto la
      # issue puo' essere stata riusata da una run concorrente e il verdetto
      # letto potrebbe appartenere alla run sbagliata. Il claim stabilisce
      # l'identita' della run prima di consentire il corto-circuito.
      - name: Pre-flight — diagnosi gia' consegnata al sito (zero-Claude)
        id: handoff_pre
        if: steps.preflight.outputs.already_resolved != 'true' && steps.stale.outputs.stale_dispatch != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: SITE_TOKEN="${GITHUB_PAT:-}" node scripts/ci/handoff-to-site.mjs --preflight

      - name: Acquire shared Codex lane quota lease (issue-fix slot)
        id: quota_lease
        if: steps.preflight.outputs.already_resolved != 'true' && steps.stale.outputs.stale_dispatch != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true' && steps.handoff_pre.outputs.handoff_delivered != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          QUOTA_LEASE_ACTION: consume
          QUOTA_LEASE_ROLE: issue-fix
          QUOTA_LEASE_OWNER: issue-fix
          QUOTA_LEASE_TARGET_TYPE: issue
          QUOTA_LEASE_TARGET: ${{ github.event.issue.number }}
          QUOTA_LEASE_TTL_SEC: '21600'
          # Il lease è un pool bounded di fixer Codex-primary, non più un
          # mutex globale: la chiave per-issue del workflow rende reali i 7
          # slot e il drainer impedisce il fan-out oltre il cap.
          QUOTA_LEASE_MAX_INFLIGHT_FIX: '7'
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/ci/check-quota-backoff.mjs

      - name: Shared Codex lane quota lease unavailable (requeue zero-agent)
        if: steps.preflight.outputs.already_resolved != 'true' && steps.stale.outputs.stale_dispatch != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true' && steps.handoff_pre.outputs.handoff_delivered != 'true' && steps.quota_lease.outputs.lease_allowed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "${{ steps.quota_lease.outputs.lease_error }}" = 'true' ]; then
            echo "::error::Lease quota condiviso illeggibile o non verificabile → issue-fix saltato fail-closed, nessuna mutazione cieca."
            exit 1
          fi
          gh issue edit "$ISSUE_NUMBER" --repo "$GH_REPO" --add-label agent:fix-queued --remove-label agent:fix
          echo "Lease quota condiviso negato (${{ steps.quota_lease.outputs.lease_reason }}) → issue #$ISSUE_NUMBER ri-accodata senza consumare un tentativo Codex."

      - name: Determine fix tier
        id: tier
        if: steps.preflight.outputs.already_resolved != 'true' && steps.stale.outputs.stale_dispatch != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true' && steps.handoff_pre.outputs.handoff_delivered != 'true' && steps.quota_lease.outputs.lease_allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          CTX_DIR: ${{ runner.temp }}/issue-fix-ctx
        # I cap turni sono anti-runaway sopra il p99 dei run sani, non budget di
        # lavoro: un run che muore al cap brucia la quota intera e non consegna
        # niente, che è peggio di qualche turno in più.
        run: |
          set -euo pipefail
          mkdir -p "$CTX_DIR"
          # Daily selection and tiering use one immutable issue snapshot.
          gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json title,body > "$CTX_DIR/issue.json"
          labels_json=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json labels --jq '[.labels[].name]')
          decision=$(node scripts/lib/classify-issue.mjs "$ISSUE_TITLE" "$labels_json")
          cat=$(node -e "process.stdout.write(JSON.parse(process.argv[1]).category)" "$decision")
          echo "category=$cat"

          # Una issue aggregata (più item distinti) non entra in un solo run:
          # tentarli tutti sfora il budget e non consegna NESSUNA PR. Il
          # circuit-breaker nel prompt fixa UN item e deferisce il resto.
          #
          # Il verdetto NON si calcola qui: era una quarta copia del rilevatore,
          # in shell e con una regola tutta sua («quattro righe di lista nel
          # corpo»), che sbagliava in entrambi i versi rispetto a `isAggregate()`
          # — vedi il docblock di `detect-aggregate.mjs`. AGENTS.md #6: una
          # sorgente sola.
          node scripts/ci/detect-aggregate.mjs

          case "$cat" in
            publish|engine) echo "tier=high"   >> "$GITHUB_OUTPUT"; echo "max_turns=60" >> "$GITHUB_OUTPUT" ;;
            *)              echo "tier=normal" >> "$GITHUB_OUTPUT"; echo "max_turns=45" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "model=gpt-5.6-luna" >> "$GITHUB_OUTPUT"
          echo "category=$cat" >> "$GITHUB_OUTPUT"
          # A daily bucket is an aggregate even when it currently contains one
          # item. Select exactly the first stable open item for this run.
          if jq -e '.title | test("^follow-up\\(daily:")' "$CTX_DIR/issue.json" >/dev/null 2>&1; then
            node --input-type=module - "$CTX_DIR/issue.json" >> "$GITHUB_OUTPUT" <<'NODE'
          import fs from 'node:fs';
          import { dailyBucketInfo, parseFollowupItems } from './scripts/ci/followup-resolution-match.mjs';
          const issue = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const info = dailyBucketInfo(issue.title || '');
          const items = parseFollowupItems(issue.body || '');
          const open = items.find((item) => item.id && item.state === 'open');
          console.log('is_daily_bucket=true');
          console.log(`daily_key=${info?.dailyKey || ''}`);
          console.log(`selected_item_id=${open?.id || ''}`);
          console.log('is_aggregate=true');
          NODE
          else
            {
              echo "is_daily_bucket=false"
              echo "daily_key="
              echo "selected_item_id="
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Validate daily bucket item selection (fail closed)
        id: daily_item_guard
        if: steps.tier.outputs.is_daily_bucket == 'true'
        env:
          DAILY_ITEM_ID: ${{ steps.tier.outputs.selected_item_id }}
        run: |
          set -eu
          case "${DAILY_ITEM_ID:-}" in
            FU-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-[0-9][0-9][0-9])
              echo "daily item selezionato: ${DAILY_ITEM_ID}"
              ;;
            *)
              echo "::error::daily bucket senza DAILY_ITEM_ID stabile: nessuna PR verrà creata"
              exit 1
              ;;
          esac

      - name: Closing keyword for the PR body (zero-Claude)
        id: closing
        if: steps.preflight.outputs.already_resolved != 'true' && steps.stale.outputs.stale_dispatch != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true' && steps.handoff_pre.outputs.handoff_delivered != 'true' && steps.quota_lease.outputs.lease_allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          IS_DAILY: ${{ steps.tier.outputs.is_daily_bucket }}
          DAILY_ITEM_ID: ${{ steps.tier.outputs.selected_item_id }}
        run: |
          set -uo pipefail
          if [ "${IS_DAILY:-false}" = true ]; then
            ref="Addresses #${ISSUE_NUMBER}"
            if [ -n "${DAILY_ITEM_ID:-}" ]; then
              ref="${ref}"$'\nFollow-up item: '"${DAILY_ITEM_ID}"
            else
              echo "::error::daily bucket #${ISSUE_NUMBER} senza item open stabile"
              exit 1
            fi
            {
              echo "closing_ref<<CLOSING_REF_EOF"
              printf '%s\n' "$ref"
              echo "CLOSING_REF_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "closing-ref: daily bucket → $ref"
            exit 0
          fi
          ref=$(gh issue view "$ISSUE_NUMBER" --repo "$GH_REPO" --json number,title,body,labels 2>/dev/null \
            | node scripts/lib/pr-body-generator-contract.mjs --closing-ref 2>/dev/null) || ref=""
          if [ -z "$ref" ]; then ref="Closes #${ISSUE_NUMBER}"; fi
          echo "closing_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Closing ref: $ref"

      # Un run precedente può essere morto DOPO aver pushato il checkpoint WIP:
      # in quel caso il branch esiste già su origin col diff reale, e ripartire
      # da zero butterebbe lavoro già fatto e già pagato.
      - name: Check for resumable WIP branch (zero-Claude)
        id: resume
        if: steps.preflight.outputs.already_resolved != 'true' && steps.stale.outputs.stale_dispatch != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true' && steps.handoff_pre.outputs.handoff_delivered != 'true' && steps.quota_lease.outputs.lease_allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -uo pipefail
          if git ls-remote --exit-code --heads origin "fix/issue-$ISSUE_NUMBER" >/dev/null 2>&1; then
            echo "resume=true" >> "$GITHUB_OUTPUT"
            echo "Branch fix/issue-$ISSUE_NUMBER già su origin → resume."
          else
            echo "resume=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.preflight.outputs.already_resolved != 'true' && steps.stale.outputs.stale_dispatch != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true' && steps.handoff_pre.outputs.handoff_delivered != 'true' && steps.quota_lease.outputs.lease_allowed == 'true'
        env:
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          git config user.name  "claude-fixer[bot]"
          git config user.email "claude-fixer[bot]@users.noreply.github.com"
          if [ -n "${GITHUB_PAT_NANAKO:-}" ]; then
            # `actions/checkout` persiste il token del runner (una GitHub App)
            # in `http.https://github.com/.extraheader`, e un header
            # Authorization esplicito PREVALE sulle credenziali dentro l'URL del
            # remote. Senza rimuoverlo, il `set-url` qui sotto e' INERTE: il push
            # viaggia comunque con l'identita' della App, e GitHub lo rifiuta con
            # "refusing to allow a GitHub App to create or update workflow ...
            # without workflows permission" — anche quando il PAT ha eccome lo
            # scope `workflow`. E' esattamente cosi' che i fix per #76 e #77 sono
            # stati scritti, dichiarati "blocked-workflows-scope" e persi.
            #
            # Verificato contro github.com: con un extraheader fasullo e un URL
            # valido, `git ls-remote` fallisce; rimuovendo l'extraheader riesce.
            git config --unset-all http."https://github.com/".extraheader 2>/dev/null || true
            git remote set-url origin "https://x-access-token:${GITHUB_PAT_NANAKO}@github.com/${REPO}.git"
            # ATTENZIONE alla portata di questo step: vale per i push lanciati
            # da un `run:`. Per il lavoro dell'agente NON basta, e non perche'
            # l'action lo ignori: perche' lo SOVRASCRIVE. All'avvio
            # `replaceCheckoutCredentials()` azzera l'extraheader e rifa' il
            # `set-url` col token che l'action ha ricevuto nel `with:`. Ecco
            # perche' serve anche `github_token` sullo step "Run Codex Luna Max fix":
            # sistemare solo questo remote lasciava l'agente sul token di App.
            echo "push identity (run: steps): PAT — .github/workflows/** pushabile (scope workflow verificato sul PAT)"
            echo "push identity (Codex lane): PAT via input github_token — vedi step 'Run Codex Luna Max fix'"
          else
            echo "push identity: GITHUB_TOKEN (.github/workflows/** NON pushabile, né dai run: né dall'action)"
          fi

      - name: Run Codex Luna Max fix
        # Tetto sullo step (classe #7310 del sito, portata qui riconciliando il
        # `both-moved` di #956). Il cap del job e' 360min e non lega mai: il
        # vincolo che morde e' `--max-turns`. Misurato su questo repo il
        # 2026-09-06, 10 esecuzioni reali dello step: 275s min, 733s max. 120min
        # stanno ~10x sopra il massimo osservato — nessun fix reale li tocca —
        # e tolgono il caso «run appesa che brucia 6h di runner e muore
        # `cancelled`», dove il salvataggio del WIP e i tre step di telemetria
        # qui sotto perdono la coda per girare: un run cancellato non lascia
        # ne' branch ne' marker `FIX_OUTCOME`, e il drainer lo ri-accoda a vuoto.
        timeout-minutes: 120
        id: codex_fix
        if: steps.preflight.outputs.already_resolved != 'true' && steps.stale.outputs.stale_dispatch != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true' && steps.handoff_pre.outputs.handoff_delivered != 'true' && steps.quota_lease.outputs.lease_allowed == 'true'
        continue-on-error: true
        uses: ./.github/actions/claude-codex-fallback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_GROUP: ${{ steps.group.outputs.is_group || 'false' }}
          ISSUE_GROUP_LABEL: ${{ steps.group.outputs.group_label || '' }}
          ISSUE_GROUP_NUMBERS: ${{ steps.group.outputs.group_numbers || '' }}
          IS_DAILY_BUCKET: ${{ steps.tier.outputs.is_daily_bucket }}
          DAILY_KEY: ${{ steps.tier.outputs.daily_key }}
          DAILY_ITEM_ID: ${{ steps.tier.outputs.selected_item_id }}
          CLOSING_REF: ${{ steps.closing.outputs.closing_ref }}
        with:
          codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}
          # Il token con cui l'ACTION fa le sue operazioni git/GitHub. Senza
          # questo input l'action ricade sul token di GitHub App del run, che
          # per policy di GitHub non può creare né modificare file sotto
          # `.github/workflows/**`: il push viene rifiutato con
          #   "refusing to allow a GitHub App to create or update workflow
          #    `.github/workflows/<f>.yml` without `workflows` permission"
          # DOPO che il fix è stato scritto — cioè al costo pieno di un run.
          # È la causa reale di `blocked-workflows-scope` (10 occorrenze in 14
          # giorni, escalata dal lessons-harvester): NON uno scope mancante sul
          # PAT (`x-oauth-scopes` include `workflow`), NON il PAT assente in CI
          # (il loader RC lo carica), NON un push col PAT rifiutato (verificato:
          # exit 0). Il `git remote set-url` dello step precedente non e' solo
          # "inerte": l'action lo SOVRASCRIVE. `configureGitAuth()` chiama
          # `replaceCheckoutCredentials()` (src/github/operations/git-config.ts)
          # in modo incondizionato all'avvio, che azzera l'extraheader di
          # actions/checkout e rifa' `git remote set-url origin
          # https://x-access-token:<token>@...` col PROPRIO token. Qualunque
          # remote configurato prima viene riscritto un istante prima che
          # l'agente lavori: l'unico modo di decidere quel token e' questo input.
          #
          # NIENTE fallback su `secrets.GITHUB_TOKEN`: sarebbe una REGRESSIONE.
          # Gli eventi generati dal GITHUB_TOKEN non ri-attivano i workflow a
          # valle (anti-ricorsione di GitHub), quindi con quel fallback una PR
          # aperta durante un caricamento RC fallito non riceverebbe piu' ne'
          # `tests`, quindi nemmeno la review che vive dentro `tests`:
          # resterebbe ferma e verde per sempre.
          # La stringa vuota fa fallire la corsia primaria in modo fail-closed
          # prima dell'avvio di Codex: non deve mai trasformarsi nel token del
          # run o in una credenziale operativa con eventi soppressi.
          github_token: ${{ env.GITHUB_PAT_NANAKO }}
          codex_github_token: ${{ env.GITHUB_PAT_NANAKO }}
          prompt: |
            Sei l'agent di fix autonomo per la issue #${{ github.event.issue.number }} ("${{ github.event.issue.title }}"). Tier: ${{ steps.tier.outputs.tier }}, categoria: ${{ steps.tier.outputs.category }}.

            **Raggruppamento B19:** `group=${{ steps.group.outputs.is_group || 'false' }}`, membri `${{ steps.group.outputs.group_numbers || '' }}`. Se `group=true`, carica `${{ runner.temp }}/issue-fix-ctx/group.json`: contiene tutte le issue della stessa PR, già verificate dal drainer con una firma e un punto di riparazione comuni, entro il tetto numerico definito da `ISSUE_GROUP_MAX_SIZE`. Diagnostica ogni membro e risolvi tutti i membri nella stessa PR; non prendere lavoro esterno al gruppo. Nel body della PR usa una riga di chiusura per ogni membro, una keyword per riga. Se un membro non è confermabile o non è riparabile con certezza, non forzarlo: lascialo senza keyword di chiusura e dichiaralo in `## Non implementato (ancora)` con uno stato letterale. Se `group=false`, il flusso resta quello della issue singola.

            Questo repo pubblica una superficie dati su HTTP (`dist/api/`) che `frontaliereticino.ch` consuma in produzione. **Il sito non ribuilda quando questo repo pubblica**: un errore qui è live subito.

            **Bootstrap (in quest'ordine):**
            1. Leggi `ISSUES.md` → "Fix flow" — contratto operativo del fixer.
            2. Leggi `AGENTS.md` — non-negoziabili e architettura. VINCOLANTE.
            3. Carica la issue: `gh issue view $ISSUE_NUMBER --json number,title,body,labels,comments`. Se `group=true`, leggi anche `${{ runner.temp }}/issue-fix-ctx/group.json` e tratta ogni record come una issue da chiudere nella stessa PR: la diagnosi deve confermare il punto di riparazione comune, non limitarsi alla label.

            **Stati già dichiarati nei residui (leggi PRIMA di implementare):** se la issue nasce da una PR (follow-up, `Addresses`/`da PR #N` nel body, o una qualunque PR citata come origine nel body), leggi il body della PR d'origine e classifica i bullet di `## Non implementato (ancora)` con `extractSection`, `sectionBullets` e `bulletState` da `scripts/lib/pr-body-sections-check.mjs`; usa le stesse funzioni di `scripts/ci/followup-has-candidates.mjs`, non un parser inventato. `blocked:` non è monolitico: chiudono `in questa PR`, `PR concatenata #N`, `per scelta`, `by construction` e `blocked: decisione del proprietario`, anche nella variante inglese `blocked: owner decision`; ogni altro `blocked: <causa>` resta lavoro dovuto. `PR concatenata` senza `#N` non chiude.

            **Contratto del body PR (gate deterministico, non una scelta stilistica):** `## Implementato` deve descrivere solo comportamento, file e conteggi dimostrabili nella diff di questa PR; non rivendicare batch, file o item ereditati dalla base. `## Non implementato (ancora)` deve contenere `- Nessuno` quando non resta lavoro dovuto. Per ogni residuo reale usa una voce tracciabile con `in questa PR`, `PR concatenata #N` oppure `blocked: <causa esterna reale>`. `PR concatenata` senza `#N` non è tracciabile; `blocked:` non può descrivere la semplice coda interna del daily bucket, degli item restanti o della prossima PR: in quei casi indica la PR numerata o il blocker esterno reale.

            **Pre-condizioni (termina se falliscono):**
            - Esiste già una PR aperta che cita "#$ISSUE_NUMBER" → commenta "PR già in volo: #<n>, skip." e TERMINA.
            - **Overlap sui file:** estrai i path target dal body. Se una PR aperta modifica già uno di quei file → commenta e TERMINA, per non creare un conflitto o un doppione. Nel dubbio (issue non file-specifica) procedi.
            - **Capability guard — valutalo SUBITO, prima di implementare.** Il risultato runtime è `${{ steps.scope_guard.outputs.has_workflows_token }}`. Se è `true`, il PAT è passato sia al remote git sia al lane Codex (`github_token`) e modificare `.github/workflows/**` è una capacità piena: fallo senza esitare. Se è `false`, la corsia Codex non riceve credenziali e non devi implementare modifiche ai workflow: posta il diff proposto, spiega che il PAT non è stato caricato da Remote Config e termina con `blocked-workflows-scope`. Se un push viene rifiutato, usa `blocked-workflows-scope` solo quando il messaggio dice letteralmente "without `workflows` permission"; verifica `git remote -v` e che `git config --get-all http."https://github.com/".extraheader` sia vuoto, poi ritenta una volta e documenta integralmente il rifiuto se persiste. Qualunque altro errore di push va gestito come tale. In ogni caso, impostazioni del repo, branch protection e secret non presenti in CI vanno documentati e terminati senza implementare.
            - **Issue aggregata — is_aggregate=${{ steps.tier.outputs.is_aggregate }}.** Se `true`, tentare tutti gli item in un run sfora il budget turni e consegna ZERO PR. **Regola ferrea:** fixa ESATTAMENTE UN item, poi fermati. (a) applica il capability guard per-item, saltando quelli fuori capacità senza abortire l'intera issue; (b) scegli il primo item in-capacità a maggior valore; (c) implementa solo quello; (d) appena la PR è aperta STOP IMMEDIATO, anche con turni residui; (e) elenca gli altri in `## Non implementato`, che li ri-accoda. Ogni ciclo chiude almeno un item, quindi converge.

            **Daily bucket — is_daily_bucket=${{ steps.tier.outputs.is_daily_bucket }}, daily_key=${{ steps.tier.outputs.daily_key }}, item=${{ steps.tier.outputs.selected_item_id }}.** È un contenitore giornaliero condiviso: lavora SOLO l'item stabile selezionato `${{ steps.tier.outputs.selected_item_id }}` e non gli altri item del bucket. Nel body della PR copia VERBATIM la riga di chiusura pre-calcolata `${{ steps.closing.outputs.closing_ref }}`. Per un daily bucket deve essere `Addresses #${{ github.event.issue.number }}` più `Follow-up item: ${{ steps.tier.outputs.selected_item_id }}`; non usare mai `Closes`.

            **Se `group=true`, il gruppo B19 sostituisce il flusso singolo:** il tetto è già 3 issue atomiche con punto di riparazione comune; implementa tutti i membri del gruppo nella singola PR, senza prendere lavoro esterno. Usa una riga `Closes #N` separata per ogni membro completato. Se un membro non è confermabile o non è riparabile con certezza, non forzarlo: lascialo senza keyword di chiusura e dichiaralo in `## Non implementato` con uno stato letterale. Se `group=false`, valgono le regole della issue singola e dell'aggregata sopra.

            **Fix flow:**
            1. Branch isolato — **resume-aware** (`resume=${{ steps.resume.outputs.resume }}`): se `false`, `git checkout -b fix/issue-$ISSUE_NUMBER`. Se `true`, un run precedente è morto dopo il checkpoint: `git fetch origin fix/issue-$ISSUE_NUMBER && git checkout fix/issue-$ISSUE_NUMBER`, ispeziona con `git log --oneline origin/main..HEAD --stat` e CONTINUA da lì se il diff è pertinente; se è stale, `git reset --hard origin/main`. Usa giudizio, non è un automatismo.
               Questo container è **già** un checkout isolato monouso: **non** creare worktree interni. La regola worktree-first vale per le sessioni locali con un `main` condiviso, non qui — crearne uno brucia turni rifacendo la meccanica del checkout.
            2. Diagnosi della **root cause**, non del sintomo. **Budget:** se dopo ~15 turni non emerge una root cause chiara, NON continuare a scavare: restringi lo scope o termina pulito con outcome `no-root-cause`.
            3. Fix chirurgico alla **CLASSE del bug, non al singolo file**. Niente refactor drive-by, ma per un fix di pattern (regex, guard, soglia, selettore) cerca con `rg` i gemelli in `generator/`, `engine/`, `host/`, `scripts/` e sweepa l'intera classe **nella stessa PR**, oppure giustifica ogni gemello non toccato in `## Non implementato`. Toccare i file gemelli con lo stesso antipattern non è drive-by: è il fix completo, e previene il 🔴 del reviewer che costerebbe due cicli di quota.
            4. **Checkpoint WIP — commit e push IMMEDIATI.** Appena il fix è applicato, anche prima di testarlo: `git add -A && git commit -m "wip(issue-$ISSUE_NUMBER): checkpoint pre-test"` e `git push -u origin fix/issue-$ISSUE_NUMBER`. Se il run muore dopo questo punto il branch sopravvive col diff reale, recuperabile al retry. Senza checkpoint, un run morto per max-turns perde il 100% del lavoro col container.
            5. Mai abbassare un quality gate o un test per far passare qualcosa.
            6. **Gate test pre-PR (obbligatorio):** `node --test 'generator/tests/*.test.mjs'`. **Non** usare vitest: questo repo non ce l'ha. Non usare `npm test` cieco. Il glob è necessario — `node --test <dir>` su Node 22 collassa la cartella in un unico test fallito invece di scoprire i file. Rosso → fixa la root cause e rigira. Una PR coi test rossi non riceve review e resta ferma: è un ciclo sprecato.
            7. Commit (no-op se dal checkpoint non è cambiato altro — una storia wip+fix sul branch va bene).
            8. Push.
            9. Apri la PR con `gh pr create`. Body OBBLIGATORIO:
               ```
               ## Implementato
               - <cosa fa il fix>
               Closes #$ISSUE_NUMBER

               ## Non implementato (ancora)
               - <scope non fatto + stato: in questa PR / PR concatenata #N / blocked: <causa>>
               ```
               **Eccezione — issue AGGREGATA (is_aggregate=${{ steps.tier.outputs.is_aggregate }}).** Se `true`, la regola ferrea qui sopra ti fa chiudere UN item su N: `Closes #$ISSUE_NUMBER` al merge chiuderebbe il TRACKER, e con esso gli item che hai appena elencato in `## Non implementato` — non resta piu' niente da ri-accodare, e il ciclo non converge. `scripts/ci/reconcile-followups.mjs` rifiuta gia' di auto-chiudere un aggregato (`closeEligible = ... && !isAggregate`); la keyword nel body bypassa quella protezione. **Usa la riga `closing_ref` pre-calcolata dal workflow** (`Refs #$ISSUE_NUMBER` per gli aggregati normali; `Addresses #$ISSUE_NUMBER` + `Follow-up item: FU-...` per i daily), mai una keyword inventata.

               **Eccezione — fix provabile solo da una run su `main`.** Se QUESTA PR tocca `.github/workflows/**` o la config dell'action Claude (`claude_args`, `settings`, sandbox, `permissionMode`, `github_token`) per un bug osservabile solo a runtime (sandbox/bwrap, permessi, rate-limit, dispatch) — nessun test né lettura del diff può dimostrare che il fix funziona, solo una run reale — **non usare `Closes #$ISSUE_NUMBER`**: usa `Refs #$ISSUE_NUMBER` e, dopo l'apertura della PR, aggiungi `awaiting-production-proof`. Il post-step deterministico applica automaticamente la label ai retry che consegnano file `.github/workflows/<file>`; altri path restano fuori da questo hold perché il drainer non ha una prova equivalente. Dettagli in `ISSUES.md` → "Fix flow".
            10. La PR entra da sola nel ciclo di review e auto-merge. **NON mergiare a mano.**

            **Vincoli:**
            - Modifiche chirurgiche, root-cause, una issue alla volta.
            - Mai toccare file fuori dallo scope — **eccetto i gemelli della stessa classe di bug** (passo 3): quelli SONO in scope.
            - **CODE vs DATA:** `content/` (14.888 file), `dist/`, `data/`, `public/` NON sono codice da leggere riga per riga. Se la root cause è un drift dell'output, fixa il CODICE che lo genera. Campione → `Read` mirato. `rg` scopato al codice: `rg <pattern> generator engine host scripts -g '!content/**' -g '!dist/**'`.
            - Se la root cause non è determinabile con confidenza → NON forzare un fix: commenta "Root cause non determinata: <cosa hai trovato>. Serve indagine umana." e TERMINA senza PR.
            - **Telemetria (OBBLIGATORIO):** l'ULTIMO commento che posti sulla issue DEVE contenere un marker su riga propria — in testa o in coda, indifferentemente: `<!-- FIX_OUTCOME: <code> -->`, con `<code>` fra `pr-created`, `blocked-workflows-scope`, `blocked-secrets`, `blocked-admin-settings`, `no-root-cause`, `overlap-skip`, `pr-already-open`, `already-fixed`. Se apri una PR e non posti altro, posta comunque un commento col solo marker. Senza marker, il drainer non sa distinguere un verdetto da una run morta e ri-accoda a vuoto.

      - name: Salva il lavoro parziale (WIP checkpoint deterministico, zero-Claude)
        # PERCHE' ESISTE. Il checkpoint WIP c'era gia', ma come PASSO DEL PROMPT,
        # cioe' affidato alla scelta dell'agente. Un run che muore per
        # `error_max_turns` muore proprio quando non ha piu' turni per eseguirlo:
        # l'istruzione arriva esattamente quando non puo' piu' essere seguita.
        # Sul sito, sulle 29 issue parcheggiate con verdetto `max-turns`, VENTI
        # non avevano nessun branch `fix/issue-N` su origin — il diff era morto
        # col container, insieme ai turni gia' pagati per produrlo.
        #
        # Questo step e' la meta' deterministica: gira `if: always()`, dopo
        # Claude e prima di qualunque telemetria, quindi coglie l'albero di
        # lavoro anche quando la CLI e' stata uccisa. La resume-logic dello step
        # «Check for resumable WIP branch» esiste gia' e sa ripartire da
        # `fix/issue-N`: senza questo step non aveva quasi mai un branch da
        # riprendere.
        #
        # NON tocca niente quando c'e' gia' una PR (il lavoro e' consegnato) o
        # quando l'albero e' pulito e non c'e' nulla davanti a origin/main (non
        # c'era lavoro da salvare). Best-effort in senso stretto: qualunque
        # fallimento e' un warning, mai un job rosso — un salvataggio mancato non
        # deve trasformare un run terminato in un run fallito.
        if: always() && steps.preflight.outputs.already_resolved != 'true' && steps.stale.outputs.stale_dispatch != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true' && steps.handoff_pre.outputs.handoff_delivered != 'true' && steps.quota_lease.outputs.lease_allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          BRANCH="fix/issue-$ISSUE"

          PR_STATE=$(gh pr list --repo "$REPO" --head "$BRANCH" --state all --json state \
            --jq '[.[] | select(.state=="OPEN" or .state=="MERGED")] | length' 2>/dev/null || echo 0)
          if [ "${PR_STATE:-0}" != "0" ]; then
            echo "wip-salvage: PR gia' aperta/mergiata su $BRANCH → il lavoro e' consegnato, niente da salvare."
            exit 0
          fi

          # Il branch di lavoro puo' non essere quello corrente se l'agente e'
          # morto prima del checkout: in quel caso si crea qui.
          CUR=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo HEAD)
          if [ "$CUR" != "$BRANCH" ]; then
            git checkout -B "$BRANCH" >/dev/null 2>&1 || true
          fi

          DIRTY=$(git status --porcelain 2>/dev/null | head -c 1)
          AHEAD=$(git rev-list --count origin/main..HEAD 2>/dev/null || echo 0)
          if [ -z "$DIRTY" ] && [ "${AHEAD:-0}" = "0" ]; then
            echo "wip-salvage: albero pulito e 0 commit davanti a origin/main → nessun lavoro da salvare."
            exit 0
          fi

          if [ -n "$DIRTY" ]; then
            # `git add -A` e non un elenco: qui non si sa cosa l'agente ha
            # toccato, ed e' proprio cio' che va conservato. Il checkout di
            # questo job non e' sparse, quindi non c'e' il rischio di perdere
            # modifiche fuori dal cono.
            git add -A
            git commit -q -m "wip(issue-$ISSUE): checkpoint automatico di un run terminato senza PR" \
              -m "Salvato da issue-fix.yml (step deterministico), non dall'agente: il run e' finito senza aprire una PR e senza eseguire il checkpoint del prompt — il caso tipico e' error_max_turns, che finisce i turni proprio prima di poterlo fare." \
              -m "Run: $RUN_URL" || echo "wip-salvage: commit vuoto o rifiutato, continuo."
          fi

          # Ri-applica l'identita' di push: dopo il lane Codex il remote
          # porta la credenziale che l'action ha ricevuto, e l'extraheader di
          # actions/checkout ha comunque la precedenza sull'URL — stessa
          # trappola documentata nello step «Configure git identity».
          if [ -n "${GITHUB_PAT_NANAKO:-}" ]; then
            git config --unset-all http."https://github.com/".extraheader 2>/dev/null || true
            git remote set-url origin "https://x-access-token:${GITHUB_PAT_NANAKO}@github.com/${REPO}.git"
          fi

          if git push -u origin "$BRANCH" 2>&1 | tail -3; then
            SHA=$(git rev-parse --short HEAD)
            FILES=$(git diff --name-only origin/main..HEAD | head -20)
            N=$(git diff --name-only origin/main..HEAD | wc -l | tr -d ' ')
            echo "wip-salvage: $BRANCH pushato ($N file, $SHA)."
            {
              echo "💾 **Lavoro parziale salvato** (step deterministico di \`issue-fix\`, zero-Claude)"
              echo
              echo "Questo run e' terminato senza aprire una PR, quindi il diff che aveva in mano sarebbe morto col container. E' stato committato e pushato su \`$BRANCH\` (\`$SHA\`, $N file):"
              echo
              echo '```'
              echo "$FILES"
              echo '```'
              echo
              echo "Il prossimo tentativo **riprende da qui** invece di ripartire da zero (resume-logic del fixer). Se il diff non e' pertinente, il fixer lo scarta da se' con un \`git reset --hard origin/main\`."
              echo
              echo "Run: $RUN_URL"
            } > /tmp/wip-note.md
            gh issue comment "$ISSUE" --repo "$REPO" --body-file /tmp/wip-note.md >/dev/null 2>&1 \
              || echo "::warning::wip-salvage: commento sulla issue non postato (il branch pero' e' salvo)."
          else
            echo "::warning::wip-salvage: push di $BRANCH fallito — il lavoro resta solo nel container e andra' perso."
          fi

      - name: Mark autonomous PR provenance (zero-Claude)
        if: always() && steps.claim.outputs.claim_acquired == 'true' && steps.quota_lease.outputs.lease_allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -uo pipefail
          runtime_token="${GITHUB_PAT_NANAKO:-}"
          if [ -n "$runtime_token" ]; then
            export GH_TOKEN="$runtime_token"
          fi
          BRANCH="fix/issue-$ISSUE"
          PR_NUMBER=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number,createdAt \
            --jq 'sort_by(.createdAt) | last | .number // empty' 2>/dev/null || true)
          if [ -z "$PR_NUMBER" ]; then
            echo "provenance: nessuna PR aperta su $BRANCH — skip"
            exit 0
          fi
          gh label create agent:autofix --repo "$REPO" --color 1d76db \
            --description "PR prodotta dal loop autonomo: abilita i fixer bounded" --force \
            2>/dev/null || true
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label agent:autofix \
            && echo "provenance: PR #$PR_NUMBER marcata agent:autofix" \
            || echo "::warning::provenance: label agent:autofix non applicata alla PR #$PR_NUMBER"

          # Prova esplicita della remediation: L11 resta report-only fino a
          # questo punto. Il commento non è un gate del merge; collega solo la
          # PR realmente aperta al candidate/source record osservato.
          ISSUE_BODY=$(gh issue view "$ISSUE" --repo "$REPO" --json body --jq '.body // ""' 2>/dev/null || true)
          CONTRACT=$(node --input-type=module - "$ISSUE_BODY" <<'NODE'
          const body = process.argv[2] || '';
          const marker = /<!-- L11_ISSUE_CONTRACT:\s*(\{.*\})\s*-->/ms.exec(body);
          if (!marker) process.exit(0);
          try { JSON.parse(marker[1]); } catch { process.exit(0); }
          process.stdout.write(marker[1]);
          NODE
          )
          if [ -n "$CONTRACT" ]; then
            HEAD_SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq '.headRefOid' 2>/dev/null || true)
            PROOF=$(node --input-type=module - "$CONTRACT" "$PR_NUMBER" "$HEAD_SHA" <<'NODE'
          const contract = JSON.parse(process.argv[2]);
          const prNumber = Number(process.argv[3]);
          const headSha = process.argv[4] || null;
          if (contract.loopId !== 'L11' || !/^lf-candidate-[0-9a-f]{24}$/.test(contract.candidateId)
            || !/^lf-source-[0-9a-f]{24}$/.test(contract.sourceRecordId) || !Number.isInteger(prNumber)) process.exit(0);
          process.stdout.write(`<!-- L11_REMEDIATION_PR: ${JSON.stringify({ schemaVersion: 1, candidateId: contract.candidateId, sourceRecordId: contract.sourceRecordId, prNumber, headSha })} -->\n_Prova remediation L11: PR aperta dal percorso issue-fix._`);
          NODE
            )
            if [ -n "$PROOF" ]; then
              gh issue comment "$ISSUE" --repo "$REPO" --body "$PROOF" \
                || echo "::warning::prova remediation L11 non commentata sulla issue"
            fi
          fi

      - name: Apply production-proof hold for runtime workflow fixes (zero-Claude)
        # La regola era affidata al prompt: se l'agente apriva la PR e poi
        # moriva, oppure saltava il comando, la issue rientrava subito nella
        # coda senza la prova necessaria su `main`. Questo post-step legge la
        # PR consegnata e rende la sospensione deterministica.
        #
        # Il file-list CLI fallisce chiuso quando GitHub non consegna l'elenco
        # completo: non applichiamo una label sulla base di una lista troncata.
        # `.github/workflows/<file>` (un solo livello) segue workflowFilesOf;
        # altri path non vengono selezionati, perché il drainer non ha una
        # prova di produzione equivalente per loro.
        if: always() && steps.claim.outputs.claim_acquired == 'true' && steps.quota_lease.outputs.lease_allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          ACTION_OUTCOME: ${{ steps.codex_fix.outcome || '' }}
          ISSUE_GROUP: ${{ steps.group.outputs.is_group || 'false' }}
          ISSUE_GROUP_NUMBERS: ${{ steps.group.outputs.group_numbers || '' }}
        run: |
          set -uo pipefail
          runtime_token="${GITHUB_PAT_NANAKO:-}"
          if [ -n "$runtime_token" ]; then
            export GH_TOKEN="$runtime_token"
          fi
          if [ -z "$ACTION_OUTCOME" ] || [ "$ACTION_OUTCOME" = "skipped" ]; then
            echo "production-proof: nessuna consegna Codex nella run corrente (outcome=$ACTION_OUTCOME) — skip"
            exit 0
          fi
          BRANCH="fix/issue-$ISSUE"
          RUN_STARTED_AT=""
          RUN_LOOKUP_RC=1
          for attempt in 1 2; do
            RUN_LOOKUP_RC=0
            RUN_STARTED_AT=$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID" \
              --jq '.run_started_at // .created_at' 2>/dev/null) || RUN_LOOKUP_RC=$?
            if [ "$RUN_LOOKUP_RC" -eq 0 ] && [ -n "$RUN_STARTED_AT" ]; then
              break
            fi
            echo "::warning::production-proof: start time run illeggibile (attempt=$attempt rc=$RUN_LOOKUP_RC)"
            [ "$attempt" -lt 2 ] && sleep 2
          done
          if [ "$RUN_LOOKUP_RC" -ne 0 ] || [ -z "$RUN_STARTED_AT" ]; then
            echo "::error::production-proof: start time run non leggibile — hold non valutato"
            exit 1
          fi

          PR_LIST_JSON=""
          PR_LOOKUP_RC=1
          for attempt in 1 2; do
            PR_LOOKUP_RC=0
            PR_LIST_JSON=$(gh pr list --repo "$REPO" --head "$BRANCH" --state all \
              --json number,state,createdAt 2>/dev/null) || PR_LOOKUP_RC=$?
            if [ "$PR_LOOKUP_RC" -eq 0 ]; then
              break
            fi
            echo "::warning::production-proof: lookup PR fallito (attempt=$attempt rc=$PR_LOOKUP_RC), retry"
            [ "$attempt" -lt 2 ] && sleep 2
          done
          if [ "$PR_LOOKUP_RC" -ne 0 ]; then
            echo "::error::production-proof: lookup PR non leggibile dopo il retry — hold non valutato"
            exit 1
          fi
          PR_PARSE_RC=0
          PR_NUMBER=$(printf '%s\n' "$PR_LIST_JSON" | jq -r --arg started "$RUN_STARTED_AT" \
            'map(select((.state == "OPEN" or .state == "MERGED") and (.createdAt >= $started))) | sort_by(.createdAt) | last | .number // empty' \
            2>/dev/null) || PR_PARSE_RC=$?
          if [ "$PR_PARSE_RC" -ne 0 ]; then
            echo "::error::production-proof: parsing PR lookup fallito — hold non valutato"
            exit 1
          fi
          if [ -z "$PR_NUMBER" ]; then
            echo "production-proof: nessuna PR open/merged consegnata nella run corrente su $BRANCH — skip"
            exit 0
          fi

          FILES_JSON=""
          FILES_RC=1
          COMPLETE=false
          FILES_REASON="cli-failed"
          for attempt in 1 2 3; do
            FILES_RC=0
            FILES_JSON=$(node scripts/ci/fetch-pr-files.mjs --repo "$REPO" --pr "$PR_NUMBER" 2>/dev/null) || FILES_RC=$?
            COMPLETE=false
            FILES_REASON="cli-failed"
            if [ "$FILES_RC" -eq 0 ] && [ -n "$FILES_JSON" ]; then
              COMPLETE=$(printf '%s\n' "$FILES_JSON" | jq -r '.complete // false' 2>/dev/null) || COMPLETE=false
              FILES_REASON=$(printf '%s\n' "$FILES_JSON" | jq -r '.reason // "unknown"' 2>/dev/null) || FILES_REASON=unknown
            fi
            if [ "$FILES_RC" -eq 0 ] && [ "$COMPLETE" = "true" ]; then
              break
            fi
            if [ "$FILES_RC" -eq 0 ] && [ "$FILES_REASON" = "rest-hard-limit" ]; then
              echo "::error::production-proof: elenco file PR #$PR_NUMBER oltre il cap REST — hold non valutabile"
              break
            fi
            echo "::warning::production-proof: elenco file PR #$PR_NUMBER non completo (attempt=$attempt rc=$FILES_RC reason=$FILES_REASON), retry"
            [ "$attempt" -lt 3 ] && sleep "$attempt"
          done
          if [ "$FILES_RC" -ne 0 ] || [ "$COMPLETE" != "true" ]; then
            echo "::error::production-proof: elenco file PR #$PR_NUMBER incompleto dopo i retry — hold non valutato"
            exit 1
          fi
          RUNTIME_RC=0
          RUNTIME_FILES=$(printf '%s\n' "$FILES_JSON" | jq -r \
            '.files[]? | select(test("^\\.github/workflows/[^/]+$"))' \
            2>/dev/null) || RUNTIME_RC=$?
          if [ "$RUNTIME_RC" -ne 0 ]; then
            echo "::error::production-proof: parsing elenco file PR #$PR_NUMBER fallito — hold non valutato"
            exit 1
          fi
          if [ -z "$RUNTIME_FILES" ]; then
            echo "production-proof: PR #$PR_NUMBER non tocca superfici runtime-sensitive — skip"
            exit 0
          fi

          LABEL_CREATE_RC=1
          for attempt in 1 2 3; do
            if gh label create awaiting-production-proof --repo "$REPO" --color c5def5 \
              --description "Merge atterrato, serve una run su main prima della chiusura" --force \
              2>/dev/null; then
              LABEL_CREATE_RC=0
              break
            fi
            echo "::warning::production-proof: creazione label fallita (attempt=$attempt)"
            [ "$attempt" -lt 3 ] && sleep "$attempt"
          done
          if [ "$LABEL_CREATE_RC" -ne 0 ]; then
            echo "::error::production-proof: label non disponibile dopo i retry — hold non applicato"
            exit 1
          fi

          TARGET_ISSUES="${ISSUE_GROUP_NUMBERS:-$ISSUE}"
          if [ "$ISSUE_GROUP" = "true" ] && [ -z "$ISSUE_GROUP_NUMBERS" ]; then
            echo "::error::production-proof: gruppo B19 senza membri — hold non applicato"
            exit 1
          fi
          IFS=',' read -r -a ISSUE_LIST <<< "$TARGET_ISSUES"
          for target_issue in "${ISSUE_LIST[@]}"; do
            target_issue="${target_issue//[[:space:]]/}"
            if [[ ! "$target_issue" =~ ^[0-9]+$ ]]; then
              echo "::error::production-proof: membro issue non valido: $target_issue"
              exit 1
            fi
            ISSUE_EDIT_RC=1
            for attempt in 1 2 3; do
              if gh issue edit "$target_issue" --repo "$REPO" --add-label awaiting-production-proof; then
                ISSUE_EDIT_RC=0
                break
              fi
              echo "::warning::production-proof: edit label issue #$target_issue fallito (attempt=$attempt)"
              [ "$attempt" -lt 3 ] && sleep "$attempt"
            done
            if [ "$ISSUE_EDIT_RC" -ne 0 ]; then
              echo "::error::production-proof: label non applicata alla issue #$target_issue dopo i retry"
              exit 1
            fi
            echo "production-proof: issue #$target_issue sospesa per PR #$PR_NUMBER"
          done

      # Simmetrico al claim, e su OGNI percorso terminale (successo, blocco,
      # max-turns, fallimento infra). `agent:in-progress` e' mutua esclusione,
      # non uno stato: lasciato appeso su una issue aperta, la esclude dal fixer
      # per SEMPRE — nessun errore, la issue semplicemente non viene piu' presa.
      #
      # I due gate insieme dicono "questo run aveva davvero il lock": lo step
      # claim e' stato eseguito (non corto-circuitato da un gate a monte) E ha
      # visto la issue libera. Cosi' non si rimuove mai un claim di qualcun altro.
      # `blocked-admin-settings` su questo repo NON descrive impostazioni di repo.
      # Misurato il 2026-08-24 su tutte e 4 le issue aperte che lo portano — #548,
      # #531, #513, #472 — la forma e' sempre «lato sbagliato del mirror»: il
      # fixer verifica al turno 1 che il file da cambiare vive sul SITO, lo
      # scrive, e si ferma perche' non ha i permessi per pushare la'.
      #
      # La diagnosi e' quindi corretta, completa e GIA' PAGATA — e nessuno la
      # porta di la'. Il verdetto la trasformava in un parcheggio, che e' il modo
      # piu' costoso di avere ragione: l'informazione che serve al sito esiste, in
      # un commento che il sito non legge.
      #
      # Il canale c'era e non era usato: `GITHUB_PAT` e' di `valerielinc-ops`
      # (admin sul sito, verificato) ed e' nella mappa `RC_TO_ENV`, quindi lo step
      # «Load secrets from Remote Config» qui sopra lo mette in `process.env`.
      #
      # DETERMINISTICO e non affidato al prompt, per la stessa ragione del
      # checkpoint WIP dei `max-turns`: un passo che l'agente esegue solo se gli
      # restano turni non viene eseguito proprio nei casi che contano. Qui l'agente
      # ha gia' scritto la diagnosi e questo step la legge.
      #
      # Il predicato e' una CONGIUNZIONE di tre condizioni (verdetto instradabile
      # + il nome del repo del sito + almeno un path citato), ed e' la congiunzione
      # a selezionare 4 casi su 4 senza falsi: i due `blocked-workflows-scope`
      # locali (#529, #547) NON vengono spediti.
      #
      # Dal 2026-09-05 (#316) il verdetto instradabile non e' piu' solo un
      # `blocked-*`: `no-root-cause` puo' portare la stessa forma. Su #316 il
      # fixer lo ha emesso DIECI volte fra il 2026-08-14 e il 2026-09-03 con la
      # causa trovata e riconfermata ogni volta — `isQueueManaged` in
      # `scripts/ci/followup-drainer.mjs` — fermandosi perche' quel file e'
      # `mode: identical` nel manifest. Non un vicolo cieco: il mirror.
      # `no-root-cause` resta pero' ambiguo dove i `blocked-*` non lo sono,
      # perche' copre ANCHE il vicolo cieco vero, quindi per lui la terza
      # condizione e' il MANIFEST (almeno un path citato con `mode: identical`)
      # al posto del nome del repo in prosa. Dal 2026-09-06 (#972) l'appartenenza
      # al manifest non basta piu' DA SOLA: dei 53 commenti di verdetto che
      # citano un path `identical`, 27 lo nominano di passaggio o per escluderlo,
      # e 47 dei 157 entry `identical` sono i file del ciclo stesso. Serve quindi
      # anche un'affermazione di mirror nella stessa frase — in congiunzione col
      # manifest, mai al suo posto — e `no-root-cause` consegna ma non CHIUDE
      # mai: parcheggia. La regola vive per intero in `handoffDecision`, non qui:
      # questo commento la descrive e non la duplica, ed e'
      # `generator/tests/handoff-to-site.test.mjs` a inchiodarla.
      - name: Consegna al sito la diagnosi che vive di la' (zero-Claude)
        if: always() && steps.claim.outputs.in_flight != 'true' && steps.stale.outputs.stale_dispatch != 'true' && steps.handoff_pre.outputs.handoff_delivered != 'true' && steps.quota_lease.outputs.lease_allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: SITE_TOKEN="${GITHUB_PAT:-}" node scripts/ci/handoff-to-site.mjs

      - name: Emit FIX_OUTCOME telemetry (deterministic backstop)
        # Il prompt CHIEDE all'agente di postare un marker granulare
        # `<!-- FIX_OUTCOME: <code> -->`, ma un marker emesso dal prompt e'
        # inaffidabile per costruzione: chi muore ai turni non lo scrive, e sul
        # sito e' stato osservato un run che aveva l'istruzione e non ha postato
        # niente. Questo backstop garantisce che il lessons-harvester e il
        # drainer abbiano SEMPRE un marker da interrogare: `pr-created` se
        # questo run ha aperto una PR su `fix/issue-<N>`, altrimenti un grezzo
        # `no-pr-unspecified`.
        #
        # Non sovrascrive MAI il marker granulare del run CORRENTE: se ce n'e' gia'
        # uno, esce. I marker storici non possono sopprimere questo backstop.
        # Il gate `if:` salta i corti-circuiti di pre-flight, che
        # hanno gia' postato il proprio marker specifico — senza quel salto
        # questo step ci scriverebbe sopra `no-pr-unspecified` e avvelenerebbe
        # il segnale invece di completarlo. Best-effort: non fallisce mai.
        if: always() && steps.preflight.outputs.already_resolved != 'true' && steps.stale.outputs.stale_dispatch != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true' && steps.handoff_pre.outputs.handoff_delivered != 'true' && steps.quota_lease.outputs.lease_allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -uo pipefail
          RUN_STARTED_AT=$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID" \
            --jq '.run_started_at // .created_at' 2>/dev/null || true)
          if [ -z "${RUN_STARTED_AT:-}" ]; then
            echo "::warning::RUN_STARTED_AT non disponibile: backstop non emesso."
            exit 0
          fi
          COMMENTS=$(gh issue view "$ISSUE" --repo "$REPO" --json comments 2>/dev/null || echo '{"comments":[]}')
          HAS=$(printf '%s\n' "$COMMENTS" | jq -r --arg started "$RUN_STARTED_AT" \
            '[.comments[] | select((.createdAt // "") >= $started) | select((.body // "") | test("<!-- FIX_OUTCOME:"))] | length' \
            2>/dev/null || echo 0)
          if [ "${HAS:-0}" != "0" ]; then
            echo "Marker FIX_OUTCOME gia' presente in questo run — nessun backstop necessario."
            exit 0
          fi
          PR=$(gh pr list --repo "$REPO" --head "fix/issue-$ISSUE" --state open --json number,createdAt \
            --jq 'sort_by(.createdAt) | last | .number // empty' 2>/dev/null || true)
          if [ -n "${PR:-}" ]; then OUT=pr-created; else OUT=no-pr-unspecified; fi
          echo "FIX_OUTCOME issue=$ISSUE outcome=$OUT (backstop deterministico)"
          gh issue comment "$ISSUE" --repo "$REPO" --body "$(printf '<!-- FIX_OUTCOME: %s -->\n_Outcome rilevato dal post-step deterministico (telemetria lessons-harvester)._' "$OUT")" || true

      # Il colore del job e' il LAVORO reale del run, non l'exit della CLI.
      #  - PR aperta o gia' MERGED per la issue (`fix/issue-<N>`) -> SUCCESS.
      #    Vale ANCHE se la CLI e' morta `error_max_turns` DOPO che la PR era
      #    stata aperta: e' un falso-fallimento, il lavoro e' consegnato ed e'
      #    gia' in review.
      #  - nessuna PR + CLI FAILED -> non-delivery reale -> ROSSO. Il segnale
      #    serve al drainer e al report di salute del ciclo, e non va mascherato.
      #  - nessuna PR + CLI SUCCESS -> terminale pulito (blocked / already-fixed
      #    / no-root-cause: l'agente ha deciso di NON aprire PR) -> verde.
      # I fallimenti infra a monte (setup, pre-flight) restano rossi da soli:
      # quegli step non hanno `continue-on-error`. Nessun gate abbassato — la PR
      # passa comunque dal reviewer; qui si disambigua «intenzionale» da «crash».
      - name: Classify outcome (work-done, not CLI exit)
        if: always() && steps.preflight.outputs.already_resolved != 'true' && steps.stale.outputs.stale_dispatch != 'true' && steps.scope_guard.outputs.workflows_blocked != 'true' && steps.claim.outputs.in_flight != 'true' && steps.handoff_pre.outputs.handoff_delivered != 'true' && steps.quota_lease.outputs.lease_allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          ACTION_OUTCOME: ${{ steps.codex_fix.outcome }}
        run: |
          set -uo pipefail
          # `sort_by(.createdAt) | last`, non `.[0]`: con un branch `fix/issue-<N>`
          # riusato dopo un merge la lista tiene la PR vecchia insieme alla nuova, in
          # un ordine che `gh` non documenta, e il numero stampato qui sotto punterebbe
          # al lavoro sbagliato. Stesso predicato di `deliveredPrNumber()` in
          # `scripts/ci/mark-claude-terminal-outcome.mjs` (AGENTS.md #6).
          if PR_STATE=$(gh pr list --repo "$REPO" --head "fix/issue-$ISSUE" --state all --json number,state,createdAt \
            --jq '[.[] | select(.state=="OPEN" or .state=="MERGED")] | sort_by(.createdAt) | last | .number // empty'); then
            :
          else
            PR_LOOKUP_RC=$?
            echo "::error::issue-fix #$ISSUE: impossibile verificare le PR consegnate (gh pr list rc=$PR_LOOKUP_RC); non classifico la CLI come non-delivery."
            exit 1
          fi
          echo "issue=$ISSUE pr(head fix/issue-$ISSUE, open|merged)=${PR_STATE:-<none>} claude=$ACTION_OUTCOME"
          if [ -n "${PR_STATE:-}" ]; then
            echo "PR #$PR_STATE esiste (open/merged) per la issue -> run SUCCESS. Job verde anche se la CLI e' uscita '$ACTION_OUTCOME' (falso-fallimento: lavoro consegnato)."
            exit 0
          fi
          if [ "$ACTION_OUTCOME" = "failure" ]; then
            # Quota esaurita (429): il job resta comunque ROSSO — non e' un
            # successo e non ha consegnato niente, quindi nessun falso-verde.
            # Cambia solo il MESSAGGIO: attribuire questi run al «fixer che non
            # sa fixare» e' una misattribuzione, e sul sito ha tenuto acceso un
            # allarme per sette report senza che nessuno risalisse alla causa.
            # Claude non ha eseguito (0 turni, costo 0): il recupero corretto e'
            # aspettare la finestra, e lo fa il marker `rate-limited` emesso
            # dallo step precedente, che il drainer legge.
            RL=$(gh issue view "$ISSUE" --repo "$REPO" --json comments \
              --jq '[.comments[].body | select(test("<!-- FIX_OUTCOME: rate-limited -->"))] | length' 2>/dev/null || echo 0)
            if [ "${RL:-0}" != "0" ]; then
              echo "::error::issue-fix #$ISSUE: run terminata su QUOTA Claude esaurita (429) al primo turno — l'agente non ha letto la issue (0 turni, costo 0). Non e' un fallimento di diagnosi: la issue e' stata ri-accodata SENZA consumare un tentativo. Job ROSSO perche' nessuna PR e' stata consegnata (nessun falso-verde)."
              exit 1
            fi
            echo "::error::issue-fix #$ISSUE: nessuna PR aperta/mergiata e la CLI e' fallita ('$ACTION_OUTCOME') -> non-delivery reale. Job ROSSO (segnale preservato per il drainer e il report di salute)."
            exit 1
          fi
          echo "Nessuna PR ma la CLI e' uscita pulita ('$ACTION_OUTCOME') -> terminale legittimo (blocked/already-fixed/no-root-cause). Job verde."

      - name: Release shared Codex lane quota lease
        if: always() && steps.quota_lease.outputs.lease_consumed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          QUOTA_LEASE_ACTION: release
          QUOTA_LEASE_ROLE: issue-fix
          QUOTA_LEASE_OWNER: issue-fix
          QUOTA_LEASE_TARGET_TYPE: issue
          QUOTA_LEASE_TARGET: ${{ github.event.issue.number }}
          QUOTA_LEASE_TOKEN: ${{ steps.quota_lease.outputs.lease_token }}
        run: node scripts/ci/check-quota-backoff.mjs

      - name: Release in-progress claim (zero-Claude, mutex)
        if: always() && steps.claim.outputs.claim_acquired == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ''
          CLAIMED_NUMBERS: ${{ steps.claim.outputs.claimed_numbers }}
          CLAIM_ACTION: release
          CLAIM_OWNER: remote
        run: node scripts/ci/claim-issue-group-in-flight.mjs

      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json
